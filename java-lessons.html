
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050810">
  <title>رحلة Java | Cody Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

  <style>
    :root {
      --bg:#050810;
      --panel:#0b1120;
      --surface:#101a2d;
      --border:#243149;
      --text:#f8fafc;
      --muted:#94a3b8;
      --cyan:#67e8f9;
      --purple:#a78bfa;
      --green:#34d399;
      --gold:#fbbf24;
      --red:#fb7185;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Cairo',sans-serif;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    button,a { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }

    .app {
      height:100%;
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
    }

    .sidebar {
      background:var(--panel);
      border-left:1px solid var(--border);
      display:flex;
      flex-direction:column;
      min-height:0;
      z-index:20;
    }

    .brand {
      padding:20px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-icon {
      width:44px;
      height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:#17263c;
      color:var(--cyan);
      font-size:25px;
    }

    .brand h1 { font-size:18px; margin:0; }
    .brand p { font-size:12px; color:var(--muted); margin:3px 0 0; }

    .sidebar-label {
      color:var(--muted);
      font-size:12px;
      padding:18px 18px 8px;
    }

    .chapters {
      overflow:auto;
      padding:8px 12px 24px;
    }

    .chapter {
      margin-bottom:10px;
      border:1px solid var(--border);
      border-radius:13px;
      overflow:hidden;
      background:#0d1627;
    }

    .chapter-head {
      width:100%;
      border:0;
      padding:13px;
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--text);
      background:transparent;
      text-align:right;
    }

    .chapter-num {
      flex:0 0 34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:#17263c;
      color:var(--cyan);
      font-weight:800;
    }

    .chapter-title { flex:1; font-size:13px; font-weight:800; }
    .chapter-head i { color:var(--muted); }

    .lesson-list {
      display:none;
      padding:0 10px 10px;
    }

    .chapter.open .lesson-list { display:block; }

    .lesson-link {
      display:block;
      padding:10px;
      margin-top:4px;
      border-radius:9px;
      color:var(--muted);
      font-size:12px;
    }

    .lesson-link:hover,
    .lesson-link.active {
      background:#17263c;
      color:var(--cyan);
    }

    .lesson-link.active { border-right:3px solid var(--cyan); }

    .workspace {
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .topbar {
      min-height:72px;
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--panel);
      border-bottom:1px solid var(--border);
    }

    .top-left,.top-right {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .small-btn,.back-btn {
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:9px 12px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      font-size:12px;
    }

    .stats {
      color:var(--gold);
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
    }

    .progress-area {
      padding:10px 20px;
      background:var(--panel);
      border-bottom:1px solid var(--border);
    }

    .progress-info {
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
      margin-bottom:7px;
    }

    .progress-track {
      height:6px;
      background:#263247;
      border-radius:10px;
      overflow:hidden;
    }

    .progress-fill {
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--cyan),var(--purple));
      transition:width .25s;
    }

    .content {
      flex:1;
      min-height:0;
      overflow:auto;
      padding:clamp(16px,3vw,30px);
    }

    .lesson-heading { margin-bottom:22px; }
    .eyebrow { color:var(--cyan); font-size:12px; font-weight:800; }
    .lesson-heading h2 { margin:5px 0; font-size:clamp(22px,3vw,30px); }
    .lesson-heading p { color:var(--muted); margin:0; font-size:13px; }

    .chat {
      display:flex;
      flex-direction:column;
      gap:14px;
      max-width:950px;
      margin:auto;
    }

    .message {
      display:flex;
      gap:11px;
      align-items:flex-start;
    }

    .avatar {
      flex:0 0 42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:#12324a;
      font-size:21px;
    }

    .bubble {
      min-width:0;
      max-width:850px;
      padding:15px 17px;
      border:1px solid var(--border);
      border-radius:15px 15px 4px 15px;
      background:var(--surface);
      line-height:1.95;
      font-size:14px;
      overflow-wrap:anywhere;
    }

    .bubble code {
      direction:ltr;
      unicode-bidi:isolate;
      font-family:'Fira Code',monospace;
      color:var(--cyan);
      background:#050810;
      padding:3px 6px;
      border-radius:5px;
    }

    .card {
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      background:var(--panel);
      margin-top:12px;
    }

    .card h3 { margin:0 0 12px; font-size:16px; }

    .choices {
      display:grid;
      gap:9px;
    }

    .choice {
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--surface);
      color:var(--text);
      padding:12px;
      text-align:right;
      font-size:13px;
    }

    .choice:hover { border-color:var(--cyan); }
    .choice:disabled { cursor:default; opacity:.8; }
    .choice.correct { border-color:var(--green); color:var(--green); }
    .choice.wrong { border-color:var(--red); color:var(--red); }

    .editor-card { padding:0; overflow:hidden; }
    .editor-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 15px;
      background:#111b2c;
      border-bottom:1px solid var(--border);
    }

    .editor-head strong { font-size:13px; }
    .editor-head span { font-size:11px; color:var(--muted); }

    .editor-actions { display:flex; gap:7px; }

    .action-btn {
      border:0;
      border-radius:9px;
      padding:9px 12px;
      font-weight:800;
      font-size:12px;
    }

    .run-btn { background:var(--green); color:#052016; }
    .hint-btn { background:#263247; color:var(--text); }

    .editor-mount { direction:ltr; }
    .CodeMirror {
      height:250px;
      font:13px 'Fira Code',monospace;
      direction:ltr;
      text-align:left;
    }

    .output {
      min-height:65px;
      max-height:160px;
      overflow:auto;
      padding:13px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      background:#03060c;
      color:#d1d5db;
      font:12px/1.7 'Fira Code',monospace;
      direction:ltr;
      text-align:left;
      border-top:1px solid var(--border);
    }

    .feedback {
      margin-top:12px;
      border-radius:10px;
      padding:11px;
      background:#111b2c;
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
    }

    .feedback.success { color:var(--green); }
    .feedback.error { color:var(--gold); }

    .footer {
      padding:13px 20px;
      background:var(--panel);
      border-top:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .footer-note { color:var(--muted); font-size:11px; }
    .next-btn {
      border:0;
      border-radius:11px;
      padding:12px 18px;
      background:var(--cyan);
      color:#06202a;
      font-weight:900;
      font-size:13px;
    }

    .next-btn:disabled { opacity:.45; cursor:not-allowed; }

    .notice {
      max-width:700px;
      margin:35px auto;
      text-align:center;
      padding:28px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--panel);
    }

    .notice-icon { font-size:36px; color:var(--gold); }
    .notice h2 { margin:10px 0; }
    .notice p { color:var(--muted); line-height:1.9; font-size:13px; }

    .mobile-menu { display:none; }

    @media(max-width:850px) {
      .app { grid-template-columns:1fr; }
      .sidebar {
        position:fixed;
        top:0; bottom:0; right:0;
        width:min(320px,88vw);
        transform:translateX(105%);
        transition:transform .25s;
        box-shadow:-20px 0 60px #0008;
      }
      .sidebar.show { transform:translateX(0); }
      .mobile-menu { display:inline-flex; }
      .topbar { padding:10px 12px; min-height:60px; }
      .progress-area { padding:9px 14px; }
      .content { padding:16px 12px; }
      .footer { padding:10px 12px; }
      .footer-note { display:none; }
      .bubble { font-size:13px; }
      .CodeMirror { height:220px; }
    }
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="ri-code-s-slash-line"></i></div>
      <div>
        <h1>Cody Academy</h1>
        <p>رحلتك في تعلم Java</p>
      </div>
    </div>
    <div class="sidebar-label">خريطة التعلم</div>
    <nav class="chapters" id="chaptersList" aria-label="فصول Java"></nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="top-left">
        <button class="small-btn mobile-menu" id="menuBtn" aria-label="فتح قائمة الفصول">
          <i class="ri-menu-line"></i>
        </button>
        <a class="back-btn" href="java-chapters.html">
          <i class="ri-map-2-line"></i><span>الخريطة</span>
        </a>
      </div>
      <div class="top-right">
        <span class="stats"><i class="ri-star-fill"></i> <span id="xpDisplay">0</span> XP</span>
      </div>
    </header>

    <div class="progress-area">
      <div class="progress-info">
        <span id="progressLabel">تقدمك في رحلة Java</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <section class="content" id="content">
      <div class="lesson-heading">
        <span class="eyebrow" id="lessonEyebrow">CODY LEARNING PATH</span>
        <h2 id="lessonTitle">جاري تجهيز الدرس...</h2>
        <p id="lessonSubtitle">لحظات ونبدأ رحلة البرمجة.</p>
      </div>
      <div class="chat" id="chatContainer" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <span class="footer-note">كل خطوة جديدة بتقرّبك من هدفك 🚀</span>
      <button class="next-btn" id="nextBtn" disabled>متابعة <i class="ri-arrow-left-line"></i></button>
    </footer>
  </main>
</div>

<script src="js/chapters/java_ch1.js"></script>
<script src="js/chapters/java_ch2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script>
"use strict";

const CHAPTERS = [
  { id:1, title:"البداية مع Java" },
  { id:2, title:"المتغيرات" },
  { id:3, title:"العمليات الحسابية" },
  { id:4, title:"الشروط" },
  { id:5, title:"الحلقات" },
  { id:6, title:"المصفوفات" },
  { id:7, title:"الدوال" },
  { id:8, title:"النصوص" },
  { id:9, title:"الكائنات" },
  { id:10, title:"الوراثة" },
  { id:11, title:"معالجة الأخطاء" },
  { id:12, title:"المشروع النهائي" }
];

const PROGRESS_KEY = "cody_java_progress";
const XP_KEY = "cody_java_xp";
const LESSON_KEY = "cody_last_lesson_java";

const params = new URLSearchParams(location.search);
let chapterId = Number(params.get("ch")) || 1;
let lessonId = Number(params.get("lesson")) || 1;
let currentLesson = null;
let stepIndex = 0;
let editor = null;
let challengePassed = false;
let waitingForAnswer = false;

const $ = id => document.getElementById(id);

function safeReadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
    return {
      completed: Array.isArray(data.completed) ? data.completed : [],
      lessons: Array.isArray(data.lessons) ? data.lessons : []
    };
  } catch {
    return { completed: [], lessons: [] };
  }
}

function saveProgress(progress) {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
}

function getChapterData(id) {
  return window.CHAPTERS && window.CHAPTERS[id];
}

function updateStats() {
  $("xpDisplay").textContent = localStorage.getItem(XP_KEY) || "0";
  const progress = safeReadProgress();
  const percent = Math.round((progress.completed.length / CHAPTERS.length) * 100);
  $("progressFill").style.width = percent + "%";
  $("progressPercent").textContent = percent + "%";
}

function addXP(amount) {
  const current = Number(localStorage.getItem(XP_KEY)) || 0;
  localStorage.setItem(XP_KEY, String(current + amount));
  updateStats();
}

function renderSidebar() {
  const list = $("chaptersList");
  list.replaceChildren();

  const progress = safeReadProgress();

  CHAPTERS.forEach((chapter, index) => {
    const data = getChapterData(chapter.id);
    const unlocked = index === 0 ||
      progress.completed.includes(CHAPTERS[index - 1].id);

    const wrapper = document.createElement("section");
    wrapper.className = "chapter" +
      (chapter.id === chapterId ? " open" : "");

    const head = document.createElement("button");
    head.className = "chapter-head";
    head.type = "button";

    const number = document.createElement("span");
    number.className = "chapter-num";
    number.textContent = progress.completed.includes(chapter.id)
      ? "✓" : String(chapter.id);

    const title = document.createElement("span");
    title.className = "chapter-title";
    title.textContent = chapter.title;

    const icon = document.createElement("i");
    icon.className = unlocked
      ? "ri-arrow-down-s-line"
      : "ri-lock-line";

    head.append(number, title, icon);
    head.addEventListener("click", () => {
      if (!unlocked) {
        showNotice("الفصل مقفول", "أكمل الفصل السابق أولًا لفتح هذا الفصل.");
        return;
      }
      if (!data || !Array.isArray(data.lessons) || !data.lessons.length) {
        showNotice("الفصل قيد التجهيز", "محتوى هذا الفصل لم يُضف بعد. تقدر تتابع الفصول المتاحة حاليًا.");
        return;
      }
      wrapper.classList.toggle("open");
    });

    const lessons = document.createElement("div");
    lessons.className = "lesson-list";

    if (data && Array.isArray(data.lessons)) {
      data.lessons.forEach((lesson, indexInChapter) => {
        const link = document.createElement("a");
        link.className = "lesson-link" +
          (chapter.id === chapterId && indexInChapter + 1 === lessonId
            ? " active" : "");
        link.href = `java-lessons.html?ch=${chapter.id}&lesson=${indexInChapter + 1}`;
        link.textContent = lesson.title || `الدرس ${indexInChapter + 1}`;
        lessons.appendChild(link);
      });
    } else {
      const pending = document.createElement("div");
      pending.className = "lesson-link";
      pending.textContent = "المحتوى قيد التجهيز";
      pending.style.opacity = ".6";
      lessons.appendChild(pending);
    }

    wrapper.append(head, lessons);
    list.appendChild(wrapper);
  });
}

function showNotice(title, message) {
  $("chatContainer").replaceChildren();

  const box = document.createElement("div");
  box.className = "notice";

  const icon = document.createElement("div");
  icon.className = "notice-icon";
  icon.innerHTML = '<i class="ri-book-open-line"></i>';

  const heading = document.createElement("h2");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = message;

  box.append(icon, heading, paragraph);
  $("chatContainer").appendChild(box);
  $("nextBtn").disabled = true;
}

function addMessage(message) {
  const row = document.createElement("div");
  row.className = "message";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "🤖";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  // Curriculum text intentionally supports inline code/HTML.
  // Lesson files are authored by the platform owner.
  bubble.innerHTML = message;

  row.append(avatar, bubble);
  $("chatContainer").appendChild(row);
  $("content").scrollTop = $("content").scrollHeight;
}

function showFeedback(message, type = "") {
  let feedback = document.querySelector(".feedback");
  if (!feedback) {
    feedback = document.createElement("div");
    feedback.className = "feedback";
    $("chatContainer").appendChild(feedback);
  }
  feedback.className = "feedback " + type;
  feedback.textContent = message;
}

function renderChoice(step) {
  const card = document.createElement("div");
  card.className = "card";

  const heading = document.createElement("h3");
  heading.textContent = step.question || "اختار الإجابة الصحيحة";

  const choices = document.createElement("div");
  choices.className = "choices";

  (step.options || []).forEach((option, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = option;

    button.addEventListener("click", () => {
      if (waitingForAnswer) return;
      waitingForAnswer = true;

      const correct = index === step.correct;
      button.classList.add(correct ? "correct" : "wrong");

      Array.from(choices.children).forEach((child, i) => {
        child.disabled = true;
        if (i === step.correct) child.classList.add("correct");
      });

      showFeedback(
        (correct ? "إجابة صحيحة! " : "لسه محتاج تراجع. ") +
        (step.explanation || ""),
        correct ? "success" : "error"
      );

      if (correct) addXP(5);
      $("nextBtn").disabled = false;
    });

    choices.appendChild(button);
  });

  card.append(heading, choices);
  $("chatContainer").appendChild(card);
  $("nextBtn").disabled = true;
}

function renderChallenge(step) {
  const card = document.createElement("div");
  card.className = "card editor-card";

  const header = document.createElement("div");
  header.className = "editor-head";

  const label = document.createElement("div");
  const title = document.createElement("strong");
  title.textContent = "Main.java";
  const subtitle = document.createElement("br");
  const hintLabel = document.createElement("span");
  hintLabel.textContent = "Java · Code Editor";
  label.append(title, subtitle, hintLabel);

  const actions = document.createElement("div");
  actions.className = "editor-actions";

  const hintButton = document.createElement("button");
  hintButton.className = "action-btn hint-btn";
  hintButton.textContent = "تلميح";

  const runButton = document.createElement("button");
  runButton.className = "action-btn run-btn";
  runButton.innerHTML = '<i class="ri-check-line">
  runButton.innerHTML = '<i class="ri-play-fill"></i> فحص الحل';

  actions.append(hintButton, runButton);
  header.append(label, actions);

  const mount = document.createElement("div");
  mount.className = "editor-mount";

  const output = document.createElement("pre");
  output.className = "output";
  output.textContent = "اكتبي الحل المطلوب، ثم اضغطي فحص الحل.";

  card.append(header, mount, output);
  $("chatContainer").appendChild(card);

  editor = CodeMirror(mount, {
    value: step.defaultCode || `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}`,
    mode: "text/x-java",
    theme: "dracula",
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    lineWrapping: true,
    viewportMargin: Infinity
  });

  hintButton.addEventListener("click", () => {
    output.textContent = step.hint || "راجعي شرح الدرس وحاولي تقسيم المطلوب لخطوات صغيرة.";
  });

  runButton.addEventListener("click", () => {
    const code = editor.getValue();

    if (!code.trim()) {
      output.textContent = "اكتبي الكود الأول، وبعدها افحصي الحل.";
      return;
    }

    let passed = false;

    try {
      passed = typeof step.check === "function"
        ? Boolean(step.check(code))
        : false;
    } catch (error) {
      console.error("Java challenge check failed:", error);
    }

    if (passed) {
      challengePassed = true;
      output.textContent = step.successMsg || "ممتاز! الحل اجتاز الفحص.";
      output.style.color = "#34d399";
      showFeedback("أحسنتِ! نجحتي في التحدي. تقدري تكملي للخطوة التالية.", "success");
      addXP(10);
      $("nextBtn").disabled = false;
    } else {
      output.textContent = "الحل لسه مش مطابق للمطلوب. راجعي الكود والتلميح وحاولي تاني.";
      output.style.color = "#fbbf24";
      showFeedback("راجعي المطلوب والتلميح، وبعدها جربي مرة تانية.", "error");
    }
  });

  $("nextBtn").disabled = true;
}

function renderStep() {
  if (!currentLesson || !Array.isArray(currentLesson.steps)) {
    showNotice("الدرس غير متاح", "محتوى الدرس غير مكتمل أو لم يتم تحميله.");
    return;
  }

  if (stepIndex >= currentLesson.steps.length) {
    finishLesson();
    return;
  }

  const step = currentLesson.steps[stepIndex];

  if (!step || !step.type) {
    showNotice("خطأ في محتوى الدرس", "راجعي ملف الفصل وتأكدي إن كل خطوة لها type صحيح.");
    return;
  }

  $("nextBtn").disabled = true;
  waitingForAnswer = false;
  challengePassed = false;

  document.querySelectorAll(".feedback").forEach(element => element.remove());

  if (step.type === "cody") {
    addMessage(step.text || "");
    $("nextBtn").disabled = false;
  } else if (step.type === "quiz" || step.type === "choice") {
    renderChoice(step);
  } else if (step.type === "challenge") {
    addMessage("دلوقتي جه دور التطبيق العملي! نفّذي المطلوب في محرر الأكواد.");
    renderChallenge(step);
  } else {
    showNotice("نوع خطوة غير معروف", `نوع الخطوة "${step.type}" غير مدعوم حاليًا.`);
  }

  $("progressLabel").textContent =
    `الفصل ${chapterId} · الدرس ${lessonId} · الخطوة ${stepIndex + 1} من ${currentLesson.steps.length}`;

  $("lessonEyebrow").textContent =
    `CHAPTER ${chapterId} · LESSON ${lessonId}`;

  $("lessonTitle").textContent = currentLesson.title || "درس Java";
  $("lessonSubtitle").textContent = "اتعلمي خطوة بخطوة مع Cody.";
}

function finishLesson() {
  $("chatContainer").replaceChildren();

  addMessage("🎉 برافو! خلصتي الدرس بنجاح. استمري في رحلتك لتعلم Java!");

  const progress = safeReadProgress();
  const lessonKey = `${chapterId}-${lessonId}`;

  if (!progress.lessons.includes(lessonKey)) {
    progress.lessons.push(lessonKey);
    saveProgress(progress);
    addXP(15);
  }

  const chapterData = getChapterData(chapterId);
  const lessons = chapterData && Array.isArray(chapterData.lessons)
    ? chapterData.lessons
    : [];

  const isLastLesson = lessonId >= lessons.length;
  const nextChapter = CHAPTERS.find(chapter => chapter.id === chapterId + 1);
  const nextChapterData = nextChapter ? getChapterData(nextChapter.id) : null;

  if (isLastLesson) {
    if (!progress.completed.includes(chapterId)) {
      progress.completed.push(chapterId);
      saveProgress(progress);
    }

    if (nextChapter && nextChapterData && Array.isArray(nextChapterData.lessons)) {
      $("nextBtn").textContent = "الفصل التالي ←";
      $("nextBtn").disabled = false;
      $("nextBtn").onclick = () => {
        location.href = `java-lessons.html?ch=${nextChapter.id}&lesson=1`;
      };
    } else {
      $("nextBtn").textContent = "العودة للخريطة";
      $("nextBtn").disabled = false;
      $("nextBtn").onclick = () => {
        location.href = "java-chapters.html";
      };
    }
  } else {
    $("nextBtn").textContent = "الدرس التالي ←";
    $("nextBtn").disabled = false;
    $("nextBtn").onclick = () => {
      location.href = `java-lessons.html?ch=${chapterId}&lesson=${lessonId + 1}`;
    };
  }

  updateStats();
  renderSidebar();
}

function advance() {
  if (!currentLesson || stepIndex >= currentLesson.steps.length) return;

  const step = currentLesson.steps[stepIndex];

  if (step.type === "challenge" && !challengePassed) {
    showFeedback("لازم تنجحي في التحدي الأول قبل ما تكملي.", "error");
    return;
  }

  if ((step.type === "quiz" || step.type === "choice") && !waitingForAnswer) {
    showFeedback("اختاري إجابة الأول عشان تكملي.", "error");
    return;
  }

  stepIndex++;
  renderStep();
}

function loadLesson() {
  const chapterData = getChapterData(chapterId);

  if (!chapterData || !Array.isArray(chapterData.lessons)) {
    $("lessonTitle").textContent = "الفصل غير متاح";
    $("lessonSubtitle").textContent = "محتوى الفصل لم يتم تحميله.";
    showNotice(
      "محتوى الفصل غير موجود",
      `ملف الفصل ${chapterId} غير موجود أو لم يتم تحميله. تأكدي من وجود js/chapters/java_ch${chapterId}.js وأنه يعرّف window.CHAPTERS[${chapterId}].`
    );
    renderSidebar();
    return;
  }

  currentLesson = chapterData.lessons[lessonId - 1];

  if (!currentLesson) {
    showNotice("الدرس غير موجود", "اختاري درسًا متاحًا من قائمة الفصول.");
    renderSidebar();
    return;
  }

  stepIndex = 0;
  editor = null;

  $("nextBtn").textContent = "متابعة ←";
  $("nextBtn").onclick = null;

  $("chatContainer").replaceChildren();

  renderSidebar();
  updateStats();
  renderStep();
}

$("nextBtn").addEventListener("click", () => {
  if ($("nextBtn").onclick) return;
  advance();
});

$("menuBtn").addEventListener("click", () => {
  $("sidebar").classList.toggle("show");
});

$("content").addEventListener("click", event => {
  if (
    window.innerWidth <= 850 &&
    !event.target.closest("#menuBtn") &&
    !event.target.closest("#sidebar")
  ) {
    $("sidebar").classList.remove("show");
  }
});

window.addEventListener("storage", event => {
  if (event.key === PROGRESS_KEY || event.key === XP_KEY) {
    updateStats();
    renderSidebar();
  }
});

if (chapterId < 1 || chapterId > CHAPTERS.length) chapterId = 1;
if (lessonId < 1) lessonId = 1;

loadLesson();
</script>
</body>
</html>
