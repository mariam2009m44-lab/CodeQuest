
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050810">
  <title>رحلة Java | Cody Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

  <style>
    :root {
      --bg:#050810;
      --panel:#0b1120;
      --surface:#101a2d;
      --border:#243149;
      --text:#f8fafc;
      --muted:#94a3b8;
      --cyan:#67e8f9;
      --purple:#a78bfa;
      --green:#34d399;
      --gold:#fbbf24;
      --red:#fb7185;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:'Cairo',sans-serif;
    }

    button,a { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit;text-decoration:none; }

    .app {
      height:100%;
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
    }

    .sidebar {
      background:var(--panel);
      border-left:1px solid var(--border);
      display:flex;
      flex-direction:column;
      min-height:0;
      z-index:20;
    }

    .brand {
      padding:20px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-icon {
      width:44px;
      height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:#17263c;
      color:var(--cyan);
      font-size:25px;
    }

    .brand h1 { font-size:18px;margin:0; }
    .brand p { font-size:12px;color:var(--muted);margin:3px 0 0; }

    .sidebar-label {
      color:var(--muted);
      font-size:12px;
      padding:18px 18px 8px;
    }

    .chapters {
      overflow:auto;
      padding:8px 12px 24px;
    }

    .chapter {
      margin-bottom:10px;
      border:1px solid var(--border);
      border-radius:13px;
      overflow:hidden;
      background:#0d1627;
    }

    .chapter-head {
      width:100%;
      border:0;
      padding:13px;
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--text);
      background:transparent;
      text-align:right;
    }

    .chapter-num {
      flex:0 0 34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:#17263c;
      color:var(--cyan);
      font-weight:800;
    }

    .chapter-title { flex:1;font-size:13px;font-weight:800; }
    .chapter-head i { color:var(--muted); }

    .lesson-list { display:none;padding:0 10px 10px; }
    .chapter.open .lesson-list { display:block; }

    .lesson-link {
      display:block;
      padding:10px;
      margin-top:4px;
      border-radius:9px;
      color:var(--muted);
      font-size:12px;
    }

    .lesson-link:hover,
    .lesson-link.active {
      background:#17263c;
      color:var(--cyan);
    }

    .lesson-link.active { border-right:3px solid var(--cyan); }

    .workspace {
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .topbar {
      min-height:72px;
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--panel);
      border-bottom:1px solid var(--border);
    }

    .top-left,.top-right {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .small-btn,.back-btn {
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:9px 12px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      font-size:12px;
    }

    .stats {
      color:var(--gold);
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
    }

    .progress-area {
      padding:10px 20px;
      background:var(--panel);
      border-bottom:1px solid var(--border);
    }

    .progress-info {
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
      margin-bottom:7px;
    }

    .progress-track {
      height:6px;
      background:#263247;
      border-radius:10px;
      overflow:hidden;
    }

    .progress-fill {
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--cyan),var(--purple));
      transition:width .25s;
    }

    .content {
      flex:1;
      min-height:0;
      overflow:auto;
      padding:clamp(16px,3vw,30px);
    }

    .lesson-heading { margin-bottom:22px; }
    .eyebrow { color:var(--cyan);font-size:12px;font-weight:800; }
    .lesson-heading h2 { margin:5px 0;font-size:clamp(22px,3vw,30px); }
    .lesson-heading p { color:var(--muted);margin:0;font-size:13px; }

    .chat {
      display:flex;
      flex-direction:column;
      gap:14px;
      max-width:950px;
      margin:auto;
    }

    .message {
      display:flex;
      gap:11px;
      align-items:flex-start;
    }

    .avatar {
      flex:0 0 42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:#12324a;
      font-size:21px;
    }

    .bubble {
      min-width:0;
      max-width:850px;
      padding:15px 17px;
      border:1px solid var(--border);
      border-radius:15px 15px 4px 15px;
      background:var(--surface);
      line-height:1.95;
      font-size:14px;
      overflow-wrap:anywhere;
    }

    .bubble code {
      direction:ltr;
      unicode-bidi:isolate;
      font-family:'Fira Code',monospace;
      color:var(--cyan);
      background:#050810;
      padding:3px 6px;
      border-radius:5px;
    }

    .card {
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      background:var(--panel);
      margin-top:12px;
    }

    .card h3 { margin:0 0 12px;font-size:16px; }

    .choices { display:grid;gap:9px; }

    .choice {
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--surface);
      color:var(--text);
      padding:12px;
      text-align:right;
      font-size:13px;
    }

    .choice:hover { border-color:var(--cyan); }
    .choice:disabled { cursor:default;opacity:.8; }
    .choice.correct { border-color:var(--green);color:var(--green); }
    .choice.wrong { border-color:var(--red);color:var(--red); }

    .editor-card { padding:0;overflow:hidden; }

    .editor-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 15px;
      background:#111b2c;
      border-bottom:1px solid var(--border);
    }

    .editor-head strong { font-size:13px; }
    .editor-head span { font-size:11px;color:var(--muted); }
    .editor-actions { display:flex;gap:7px; }

    .action-btn {
      border:0;
      border-radius:9px;
      padding:9px 12px;
      font-weight:800;
      font-size:12px;
    }

    .run-btn { background:var(--green);color:#052016; }
    .hint-btn { background:#263247;color:var(--text); }

    .editor-mount { direction:ltr; }
    .CodeMirror {
      height:250px;
      font:13px 'Fira Code',monospace;
      direction:ltr;
      text-align:left;
    }

    .output {
      min-height:65px;
      max-height:160px;
      overflow:auto;
      padding:13px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      background:#03060c;
      color:#d1d5db;
      font:12px/1.7 'Fira Code',monospace;
      direction:ltr;
      text-align:left;
      border-top:1px solid var(--border);
    }

    .feedback {
      margin-top:12px;
      border-radius:10px;
      padding:11px;
      background:#111b2c;
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
    }

    .feedback.success { color:var(--green); }
    .feedback.error { color:var(--gold); }

    .footer {
      padding:13px 20px;
      background:var(--panel);
      border-top:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .footer-note { color:var(--muted);font-size:11px; }

    .next-btn {
      border:0;
      border-radius:11px;
      padding:12px 18px;
      background:var(--cyan);
      color:#06202a;
      font-weight:900;
      font-size:13px;
    }

    .next-btn:disabled { opacity:.45;cursor:not-allowed; }

    .notice {
      max-width:700px;
      margin:35px auto;
      text-align:center;
      padding:28px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--panel);
    }

    .notice-icon { font-size:36px;color:var(--gold); }
    .notice h2 { margin:10px 0; }
    .notice p { color:var(--muted);line-height:1.9;font-size:13px; }

    .mobile-menu { display:none; }

    @media(max-width:850px) {
      .app { grid-template-columns:1fr; }

      .sidebar {
        position:fixed;
        top:0;
        bottom:0;
        right:0;
        width:min(320px,88vw);
        transform:translateX(105%);
        transition:transform .25s;
        box-shadow:-20px 0 60px #0008;
      }

      .sidebar.show { transform:translateX(0); }
      .mobile-menu { display:inline-flex; }
      .topbar { padding:10px 12px;min-height:60px; }
      .progress-area { padding:9px 14px; }
      .content { padding:16px 12px; }
      .footer { padding:10px 12px; }
      .footer-note { display:none; }
      .bubble { font-size:13px; }
      .CodeMirror { height:220px; }
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="ri-code-s-slash-line"></i></div>
      <div>
        <h1>Cody Academy</h1>
        <p>رحلتك في تعلم Java</p>
      </div>
    </div>

    <div class="sidebar-label">خريطة التعلم</div>
    <nav class="chapters" id="chaptersList" aria-label="فصول Java"></nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="top-left">
        <button class="small-btn mobile-menu" id="menuBtn" type="button" aria-label="فتح قائمة الفصول">
          <i class="ri-menu-line"></i>
        </button>

        <a class="back-btn" href="java-chapters.html">
          <i class="ri-map-2-line"></i><span>الخريطة</span>
        </a>
      </div>

      <div class="top-right">
        <span class="stats"><i class="ri-star-fill"></i> <span id="xpDisplay">0</span> XP</span>
      </div>
    </header>

    <div class="progress-area">
      <div class="progress-info">
        <span id="progressLabel">تقدمك في رحلة Java</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <section class="content" id="content">
      <div class="lesson-heading">
        <span class="eyebrow" id="lessonEyebrow">CODY LEARNING PATH</span>
        <h2 id="lessonTitle">جاري تجهيز الدرس...</h2>
        <p id="lessonSubtitle">لحظات ونبدأ رحلة البرمجة.</p>
      </div>
      <div class="chat" id="chatContainer" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <span class="footer-note">كل خطوة جديدة بتقرّبك من هدفك 🚀</span>
      <button class="next-btn" id="nextBtn" type="button" disabled>
        متابعة <i class="ri-arrow-left-line"></i>
      </button>
    </footer>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script>
"use strict";

/*
  هذا الملف يحتوي على بيانات تجريبية للفصلين الأول والثاني.
  يمكن إضافة بقية المنهج داخل JAVA_CURRICULUM بنفس بنية الدروس الموجودة.
*/

const JAVA_CURRICULUM = {
  1: {
    title: "البداية مع Java",
    lessons: [
      {
        title: "ما هي Java؟",
        steps: [
          {
            type: "cody",
            text: `
              <h3>أهلًا بك في عالم Java! 🚀</h3>
              <p>Java لغة برمجة نستخدمها لبناء أنواع مختلفة من البرامج والتطبيقات.</p>
              <p>في هذه الرحلة ستتعلم البرمجة من البداية، خطوة بخطوة، مع أمثلة وتطبيقات عملية.</p>
              <p><strong>ما الذي ستتعلمه؟</strong></p>
              <ul>
                <li>كتابة أول برنامج.</li>
                <li>فهم الأوامر الأساسية.</li>
                <li>التعامل مع المتغيرات والشروط والحلقات.</li>
              </ul>
            `
          },
          {
            type: "cody",
            text: `
              <h3>شكل برنامج Java الأساسي</h3>
              <p>يبدأ برنامج Java البسيط عادةً بكلاس يحتوي على الدالة <code>main</code>.</p>
              <p>هذه الدالة هي نقطة البداية التي ينفذ منها البرنامج.</p>
              <pre dir="ltr"><code>public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}</code></pre>
              <p>الأمر <code>System.out.println()</code> يطبع نصًا ثم ينتقل إلى سطر جديد.</p>
            `
          },
          {
            type: "quiz",
            question: "ما وظيفة System.out.println()؟",
            options: [
              "طباعة نص أو قيمة على الشاشة",
              "إنشاء كلاس جديد",
              "إيقاف الكمبيوتر"
            ],
            correct: 0,
            explanation: "هذا الأمر يطبع النص أو القيمة على الشاشة ثم ينتقل إلى سطر جديد."
          },
          {
            type: "challenge",
            title: "أول برنامج لك",
            hint: "استخدم System.out.println(\"Hello, Java!\"); داخل الدالة main.",
            defaultCode: `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}`,
            check: code =>
              /class\s+Main\b/.test(code) &&
              /static\s+void\s+main\s*\(/.test(code) &&
              /System\s*\.\s*out\s*\.\s*println\s*\(/.test(code),
            successMsg: "ممتاز! الكود يحتوي على العناصر الأساسية المطلوبة."
          }
        ]
      },
      {
        title: "التعليقات والأوامر",
        steps: [
          {
            type: "cody",
            text: `
              <h3>كتابة التعليقات</h3>
              <p>التعليق هو نص يكتبه المبرمج لتوضيح الكود. لا ينفذه Java كأمر برمجي.</p>
              <pre dir="ltr"><code>// هذا تعليق من سطر واحد

/*
  هذا تعليق
  من عدة أسطر
*/</code></pre>
              <p>استخدم التعليقات عندما تحتاج إلى توضيح سبب كتابة جزء من الكود.</p>
            `
          },
          {
            type: "quiz",
            question: "أي رمز يُستخدم لكتابة تعليق من سطر واحد في Java؟",
            options: ["//", "##", "<!-- -->"],
            correct: 0,
            explanation: "في Java نبدأ التعليق ذي السطر الواحد باستخدام //."
          },
          {
            type: "challenge",
            title: "اكتب تعليقًا",
            hint: "ضع // في بداية السطر، ثم اكتب تعليقًا يشرح البرنامج.",
            defaultCode: `public class Main {
    public static void main(String[] args) {
        // My first Java program
        System.out.println("Hello!");
    }
}`,
            check: code =>
              /\/\//.test(code) &&
              /System\s*\.\s*out\s*\.\s*println\s*\(/.test(code),
            successMsg: "أحسنت! أضفت تعليقًا وأمر طباعة."
          }
        ]
      }
    ]
  },

  2: {
    title: "المتغيرات",
    lessons: [
      {
        title: "ما هو المتغير؟",
        steps: [
          {
            type: "cody",
            text: `
              <h3>التعرف على المتغيرات</h3>
              <p>المتغير مكان مسمّى نستخدمه لتخزين قيمة يمكن الرجوع إليها أثناء تنفيذ البرنامج.</p>
              <p>مثال على متغير يخزن عددًا صحيحًا:</p>
              <pre dir="ltr"><code>int age = 16;</code></pre>
              <p><code>int</code> نوع البيانات، و<code>age</code> اسم المتغير، و<code>16</code> القيمة المخزنة.</p>
            `
          },
          {
            type: "cody",
            text: `
              <h3>أنواع بيانات أساسية</h3>
              <ul>
                <li><code>int</code>: للأعداد الصحيحة.</li>
                <li><code>double</code>: للأعداد العشرية.</li>
                <li><code>char</code>: لحرف واحد بين علامتي اقتباس مفردتين.</li>
                <li><code>boolean</code>: لقيمة true أو false.</li>
                <li><code>String</code>: للنصوص.</li>
              </ul>
              <pre dir="ltr"><code>int score = 100;
double price = 12.5;
char grade = 'A';
boolean passed = true;
String name = "Ali";</code></pre>
            `
          },
          {
            type: "quiz",
            question: "أي نوع بيانات يناسب تخزين عدد صحيح مثل 25؟",
            options: ["String", "int", "boolean"],
            correct: 1,
            explanation: "يُستخدم int لتخزين الأعداد الصحيحة."
          },
          {
            type: "challenge",
            title: "أنشئ متغيرًا",
            hint: "اكتب تعريفًا لمتغير من نوع int اسمه score، واجعل قيمته 100.",
            defaultCode: `public class Main {
    public static void main(String[] args) {
        int score = 100;
        System.out.println(score);
    }
}`,
            check: code =>
              /\bint\s+score\s*=\s*100\s*;/.test(code),
            successMsg: "ممتاز! عرّفت المتغير المطلوب."
          }
        ]
      }
    ]
  },

  3: { title:"العمليات الحسابية", lessons:[] },
  4: { title:"الشروط", lessons:[] },
  5: { title:"الحلقات", lessons:[] },
  6: { title:"المصفوفات", lessons:[] },
  7: { title:"الدوال", lessons:[] },
  8: { title:"النصوص", lessons:[] },
  9: { title:"الكائنات", lessons:[] },
  10: { title:"الوراثة", lessons:[] },
  11: { title:"معالجة الأخطاء", lessons:[] },
  12: { title:"المشروع النهائي", lessons:[] }
};

const CHAPTERS = [
  { id:1, title:"البداية مع Java" },
  { id:2, title:"المتغيرات" },
  { id:3, title:"العمليات الحسابية" },
  { id:4, title:"الشروط" },
  { id:5, title:"الحلقات" },
  { id:6, title:"المصفوفات" },
  { id:7, title:"الدوال" },
  { id:8, title:"النصوص" },
  { id:9, title:"الكائنات" },
  { id:10, title:"الوراثة" },
  { id:11, title:"معالجة الأخطاء" },
  { id:12, title:"المشروع النهائي" }
];

const PROGRESS_KEY = "cody_java_progress";
const XP_KEY = "cody_java_xp";

const params = new URLSearchParams(location.search);
let chapterId = Number(params.get("ch")) || 1;
let lessonId = Number(params.get("lesson")) || 1;
let currentLesson = null;
let stepIndex = 0;
let editor = null;
let challengePassed = false;
let waitingForAnswer = false;
let lessonFinished = false;

const $ = id => document.getElementById(id);

function safeReadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");

    return {
      completed: Array.isArray(data.completed) ? data.completed : [],
      lessons: Array.isArray(data.lessons) ? data.lessons : []
    };
  } catch {
    return { completed: [], lessons: [] };
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (error) {
    console.error("Could not save Java progress:", error);
  }
}

function getChapterData(id) {
  return JAVA_CURRICULUM[id] || null;
}

function getXP() {
  return Math.max(0, Number(localStorage.getItem(XP_KEY)) || 0);
}

function updateStats() {
  $("xpDisplay").textContent = String(getXP());

  const progress = safeReadProgress();
  const percent = Math.round(
    (progress.completed.length / CHAPTERS.length) * 100
  );

  $("progressFill").style.width = percent + "%";
  $("progressPercent").textContent = percent + "%";
}

function addXP(amount) {
  const current = getXP();

  try {
    localStorage.setItem(XP_KEY, String
(current + amount));
  } catch (error) {
    console.error("Could not save XP:", error);
  }

  updateStats();
}

function getCompletedLessonKey(ch, lesson) {
  return `${ch}-${lesson}`;
}

function isLessonCompleted(ch, lesson) {
  return safeReadProgress().lessons.includes(
    getCompletedLessonKey(ch, lesson)
  );
}

function markLessonCompleted() {
  const progress = safeReadProgress();
  const key = getCompletedLessonKey(chapterId, lessonId);

  if (!progress.lessons.includes(key)) {
    progress.lessons.push(key);
    saveProgress(progress);
    addXP(20);
  }
}

function renderSidebar() {
  const container = $("chaptersList");
  container.replaceChildren();

  CHAPTERS.forEach(chapter => {
    const data = getChapterData(chapter.id);
    const isCurrent = chapter.id === chapterId;
    const chapterLessons = data?.lessons || [];

    const wrapper = document.createElement("div");
    wrapper.className = "chapter" + (isCurrent ? " open" : "");

    const head = document.createElement("button");
    head.type = "button";
    head.className = "chapter-head";
    head.innerHTML = `
      <span class="chapter-num">${chapter.id}</span>
      <span class="chapter-title"></span>
      <i class="ri-arrow-down-s-line"></i>
    `;
    head.querySelector(".chapter-title").textContent = chapter.title;

    head.addEventListener("click", () => {
      if (!chapterLessons.length) {
        showNotice(
          "هذا الفصل غير جاهز بعد",
          "محتوى هذا الفصل لم يُضف إلى المنهج بعد."
        );
        return;
      }

      chapterId = chapter.id;
      lessonId = 1;
      stepIndex = 0;
      updateURL();
      renderApp();
    });

    const list = document.createElement("div");
    list.className = "lesson-list";

    chapterLessons.forEach((lesson, index) => {
      const link = document.createElement("button");
      link.type = "button";
      link.className = "lesson-link";
      link.style.width = "100%";
      link.style.border = "0";
      link.style.textAlign = "right";

      if (isCurrent && lessonId === index + 1) {
        link.classList.add("active");
      }

      link.textContent =
        `${isLessonCompleted(chapter.id, index + 1) ? "✓ " : ""}${index + 1}. ${lesson.title}`;

      link.addEventListener("click", () => {
        chapterId = chapter.id;
        lessonId = index + 1;
        stepIndex = 0;
        updateURL();
        renderApp();
      });

      list.appendChild(link);
    });

    wrapper.append(head, list);
    container.appendChild(wrapper);
  });
}

function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set("ch", String(chapterId));
  url.searchParams.set("lesson", String(lessonId));
  history.replaceState({}, "", url);
}

function showNotice(title, message) {
  $("lessonEyebrow").textContent = "CODY LEARNING PATH";
  $("lessonTitle").textContent = title;
  $("lessonSubtitle").textContent = "";
  $("chatContainer").replaceChildren();

  const notice = document.createElement("div");
  notice.className = "notice";

  const icon = document.createElement("div");
  icon.className = "notice-icon";
  icon.innerHTML = '<i class="ri-book-open-line"></i>';

  const heading = document.createElement("h2");
  heading.textContent = title;

  const paragraph = document.createElement("p");
  paragraph.textContent = message;

  notice.append(icon, heading, paragraph);
  $("chatContainer").appendChild(notice);
  $("nextBtn").disabled = true;
}

function addMessage(content, isCody = true) {
  const message = document.createElement("div");
  message.className = "message";

  if (isCody) {
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🤖";
    message.appendChild(avatar);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (isCody) {
    bubble.innerHTML = content;
  } else {
    bubble.textContent = content;
  }

  message.appendChild(bubble);
  $("chatContainer").appendChild(message);

  return bubble;
}

function disposeEditor() {
  if (editor) {
    editor.toTextArea?.();
    editor = null;
  }
}

function renderStep() {
  disposeEditor();
  $("chatContainer").replaceChildren();

  const step = currentLesson?.steps?.[stepIndex];

  if (!step) {
    finishLesson();
    return;
  }

  challengePassed = false;
  waitingForAnswer = false;
  lessonFinished = false;
  $("nextBtn").disabled = true;

  if (step.type === "cody") {
    addMessage(step.text);
    $("nextBtn").disabled = false;
    return;
  }

  if (step.type === "quiz") {
    renderQuiz(step);
    return;
  }

  if (step.type === "challenge") {
    renderChallenge(step);
    return;
  }

  addMessage("<p>نوع الخطوة غير معروف.</p>");
}

function renderQuiz(step) {
  addMessage(`<h3>${step.question}</h3>`);

  const card = document.createElement("div");
  card.className = "card";

  const choices = document.createElement("div");
  choices.className = "choices";

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.hidden = true;

  step.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = option;

    button.addEventListener("click", () => {
      if (waitingForAnswer) return;

      if (index === step.correct) {
        waitingForAnswer = true;
        button.classList.add("correct");

        [...choices.children].forEach(choice => {
          choice.disabled = true;
        });

        feedback.hidden = false;
        feedback.className = "feedback success";
        feedback.textContent = "إجابة صحيحة! " + step.explanation;
        $("nextBtn").disabled = false;
      } else {
        button.classList.add("wrong");
        feedback.hidden = false;
        feedback.className = "feedback error";
        feedback.textContent = "ليست الإجابة الصحيحة. حاول مرة أخرى.";
      }
    });

    choices.appendChild(button);
  });

  card.append(choices, feedback);
  $("chatContainer").appendChild(card);
}

function renderChallenge(step) {
  addMessage(`
    <h3>${step.title}</h3>
    <p>اكتب الكود المطلوب في المحرر، ثم اضغط على «تحقق من الحل».</p>
  `);

  const card = document.createElement("div");
  card.className = "card editor-card";

  const head = document.createElement("div");
  head.className = "editor-head";
  head.innerHTML = `
    <div>
      <strong>Java Editor</strong>
      <br>
      <span>تحقق مبدئي من بنية الكود</span>
    </div>
    <div class="editor-actions">
      <button class="action-btn hint-btn" id="hintBtn" type="button">تلميح</button>
      <button class="action-btn run-btn" id="checkBtn" type="button">تحقق من الحل</button>
    </div>
  `;

  const mount = document.createElement("div");
  mount.className = "editor-mount";

  const textarea = document.createElement("textarea");
  textarea.id = "codeEditor";
  textarea.value = step.defaultCode || "";

  mount.appendChild(textarea);

  const output = document.createElement("div");
  output.className = "output";
  output.textContent = "لم يتم التحقق من الكود بعد.";

  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = "challengeFeedback";

  card.append(head, mount, output, feedback);
  $("chatContainer").appendChild(card);

  if (window.CodeMirror) {
    editor = CodeMirror.fromTextArea(textarea, {
      mode: "text/x-java",
      theme: "dracula",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      lineWrapping: true
    });
  }

  $("hintBtn").addEventListener("click", () => {
    feedback.className = "feedback";
    feedback.textContent = step.hint || "راجع المثال الموجود في الدرس.";
  });

  $("checkBtn").addEventListener("click", () => {
    const code = editor ? editor.getValue() : textarea.value;

    if (typeof step.check === "function" && step.check(code)) {
      if (!challengePassed) {
        challengePassed = true;
        addXP(10);
      }

      output.textContent = "تم اجتياز الفحص المبدئي.";
      feedback.className = "feedback success";
      feedback.textContent =
        step.successMsg || "ممتاز! اجتزت التحدي.";
      $("nextBtn").disabled = false;
    } else {
      output.textContent = "لم تتحقق الشروط المطلوبة بعد.";
      feedback.className = "feedback error";
      feedback.textContent =
        "راجع التلميح وتأكد من كتابة العناصر المطلوبة في الكود.";
      $("nextBtn").disabled = true;
    }
  });
}

function finishLesson() {
  disposeEditor();

  if (lessonFinished) return;
  lessonFinished = true;

  markLessonCompleted();
  renderSidebar();
  updateStats();

  $("chatContainer").replaceChildren();

  const notice = document.createElement("div");
  notice.className = "notice";

  const icon = document.createElement("div");
  icon.className = "notice-icon";
  icon.innerHTML = '<i class="ri-checkbox-circle-line"></i>';

  const heading = document.createElement("h2");
  heading.textContent = "أحسنت! أنهيت الدرس 🎉";

  const paragraph = document.createElement("p");
  paragraph.textContent =
    "تم حفظ تقدمك على هذا الجهاز. يمكنك الانتقال إلى الدرس التالي أو العودة إلى خريطة الفصول.";

  const nextLesson = document.createElement("button");
  nextLesson.type = "button";
  nextLesson.className = "next-btn";
  nextLesson.textContent = "الدرس التالي";

  nextLesson.addEventListener("click", () => {
    const chapter = getChapterData(chapterId);

    if (chapter && lessonId < chapter.lessons.length) {
      lessonId++;
    } else {
      showNotice(
        "انتهى محتوى الفصل الحالي",
        "يمكنك الرجوع إلى خريطة Java لاختيار فصل آخر. بقية الفصول تحتاج إلى إضافة دروسها."
      );
      return;
    }

    stepIndex = 0;
    updateURL();
    renderApp();
  });

  notice.append(icon, heading, paragraph, nextLesson);
  $("chatContainer").appendChild(notice);

  $("lessonTitle").textContent = currentLesson.title;
  $("lessonSubtitle").textContent = "اكتمل الدرس بنجاح.";
  $("nextBtn").disabled = true;
}

function renderApp() {
  const chapter = getChapterData(chapterId);

  if (!chapter || !chapter.lessons.length) {
    renderSidebar();
    updateStats();
    showNotice(
      chapter?.title || "الفصل غير موجود",
      "لا توجد دروس جاهزة لهذا الفصل حتى الآن. أضف محتوى الفصل داخل JAVA_CURRICULUM."
    );
    return;
  }

  if (lessonId < 1 || lessonId > chapter.lessons.length) {
    lessonId = 1;
  }

  currentLesson = chapter.lessons[lessonId - 1];
  stepIndex = 0;

  $("lessonEyebrow").textContent =
    `الفصل ${chapterId} · الدرس ${lessonId}`;
  $("lessonTitle").textContent = currentLesson.title;
  $("lessonSubtitle").textContent = chapter.title;

  renderSidebar();
  updateStats();
  renderStep();
}

$("nextBtn").addEventListener("click", () => {
  if ($("nextBtn").disabled || lessonFinished) return;

  const step = currentLesson?.steps?.[stepIndex];
  if (!step) return;

  if (step.type === "quiz" && !waitingForAnswer) return;
  if (step.type === "challenge" && !challengePassed) return;

  stepIndex++;

  if (stepIndex >= currentLesson.steps.length) {
    finishLesson();
  } else {
    renderStep();
  }
});

$("menuBtn").addEventListener("click", () => {
  $("sidebar").classList.toggle("show");
});

document.addEventListener("click", event => {
  if (
    window.innerWidth <= 850 &&
    !$("sidebar").contains(event.target) &&
    !$("menuBtn").contains(event.target)
  ) {
    $("sidebar").classList.remove("show");
  }
});

renderApp();
