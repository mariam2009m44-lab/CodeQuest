<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>تعلم Java | Cody Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #070b14;
      --panel: #0d1423;
      --panel2: #111b2e;
      --border: #223047;
      --text: #f0f5ff;
      --muted: #9aa9c0;
      --cyan: #22d3ee;
      --purple: #a78bfa;
      --green: #4ade80;
      --red: #fb7185;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top right, #14223a 0, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      min-height: 100vh;
    }

    button, textarea, input { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(7, 11, 20, .92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 20px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #06101c;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 8px 13px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong { color: var(--text); }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 22px;
      max-width: 1500px;
      padding: 24px;
      margin: auto;
    }

    .sidebar, .card {
      background: rgba(13, 20, 35, .94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .sidebar {
      align-self: start;
      padding: 18px;
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    .sidebar h2 {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .progress-track {
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      background: #202b3e;
      margin: 14px 0 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      transition: width .25s ease;
    }

    .chapter {
      margin-top: 20px;
    }

    .chapter-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .lesson-nav {
      width: 100%;
      text-align: right;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 10px;
      display: flex;
      gap: 9px;
      align-items: center;
      margin: 4px 0;
      font-size: 13px;
    }

    .lesson-nav:hover {
      background: var(--panel2);
      color: var(--text);
    }

    .lesson-nav.active {
      background: rgba(34, 211, 238, .1);
      border-color: rgba(34, 211, 238, .4);
      color: var(--cyan);
    }

    .lesson-nav.done .lesson-icon { color: var(--green); }

    .lesson-icon {
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    main { min-width: 0; }

    .welcome {
      padding: 25px;
      margin-bottom: 20px;
      background: linear-gradient(120deg, rgba(34,211,238,.1), rgba(167,139,250,.1));
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.5;
    }

    h2, h3 { line-height: 1.6; }

    .welcome p {
      margin: 6px 0 0;
      max-width: 800px;
      color: var(--muted);
      line-height: 1.9;
    }

    .lesson-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .lesson-heading h2 {
      margin: 4px 0;
      font-size: 25px;
    }

    .pill {
      display: inline-block;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 30px;
      padding: 5px 11px;
      font-size: 12px;
    }

    .card {
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .explanation {
      line-height: 2;
      color: #d4deee;
    }

    .tip {
      border-right: 3px solid var(--purple);
      background: rgba(167,139,250,.08);
      border-radius: 9px;
      padding: 12px 15px;
      margin-top: 14px;
      line-height: 1.9;
    }

    .code-example {
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      overflow-x: auto;
      background: #060a12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: #c4f1ff;
      font: 13px/1.8 Consolas, Monaco, monospace;
    }

    .editor-card { padding: 0; overflow: hidden; }

    .editor-header {
      padding: 13px 17px;
      background: #111a2a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .editor-header strong { font-size: 14px; }

    .editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn:hover { filter: brightness(1.15); }

    .btn-primary {
      color: #06101c;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .btn-success {
      color: #06140a;
      background: var(--green);
      border-color: var(--green);
    }

    .editor-wrap { direction: ltr; }

    .CodeMirror {
      height: 280px;
      font-size: 14px;
      font-family: Consolas, Monaco, monospace;
      direction: ltr;
      text-align: left;
    }

    .output {
      padding: 15px 18px;
      background: #080e18;
      border-top: 1px solid var(--border);
      min-height: 70px;
    }

    .output-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .output-message {
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .output-message.success { color: var(--green); }
    .output-message.error { color: var(--red); }

    .quiz-question {
      line-height: 1.9;
      margin-bottom: 12px;
    }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: right;
      margin: 8px 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0a1120;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .quiz-option:hover { border-color: var(--purple); }
    .quiz-option.correct { border-color: var(--green); color: var(--green); }
    .quiz-option.wrong { border-color: var(--red); color: var(--red); }

    .quiz-feedback {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.8;
    }

    .lesson-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 40px;
    }

    .notice {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 20;
      max-width: calc(100vw - 40px);
      background: #16243a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: 0 12px 40px #0005;
      display: none;
    }

    .notice.show { display: block; }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
    }

    .empty-state h2 { font-size: 25px; }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .sidebar-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .chapter { margin-top: 12px; }
      .topbar { padding: 12px 14px; }
      .brand { font-size: 17px; }
    }

    @media (max-width: 500px) {
      .stat { padding: 7px 9px; font-size: 11px; }
      .brand-icon { width: 36px; height: 36px; }
      .card { padding: 16px; }
      .welcome { padding: 18px; }
      .lesson-heading h2 { font-size: 21px; }
      .CodeMirror { height: 240px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">C</div>
      <span>Cody Academy</span>
    </div>

    <div class="top-actions">
      <div class="stat">⭐ XP: <strong id="xpDisplay">0</strong></div>
      <div class="stat">📚 الإنجاز: <strong id="progressPercent">0%</strong></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>مسار Java</h2>
      <div class="muted small">ابدأ من الأساسيات وتقدم خطوة بخطوة.</div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="muted small" id="progressText">0 من 16 درسًا مكتملًا</div>
      <div class="sidebar-list" id="sidebarList"></div>
    </aside>

    <main>
      <section class="welcome">
        <div class="eyebrow">مسار تعليمي تفاعلي</div>
        <h1>رحلتك في تعلم Java تبدأ هنا 🚀</h1>
        <p>
          تعلّم أساسيات Java من الصفر، وشاهد أمثلة عملية، واكتب الكود بنفسك،
          ثم اختبر فهمك وأكمل التحديات لتحصل على نقاط XP.
        </p>
      </section>

      <div id="lessonContent"></div>
    </main>
  </div>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <script>
    "use strict";

    const PROGRESS_KEY = "cody_java_progress";
    const XP_KEY = "cody_java_xp";

    /*
      ملاحظة:
      هذا الملف يعرض أمثلة Java ويفحص وجود أجزاء مطلوبة في إجابات التحديات.
      لا ينفذ Java فعليًا داخل المتصفح.
    */

    const CURRICULUM = [
      {
        id: 1,
        title: "البداية مع Java",
        description: "تعرّف على Java واكتب أول برنامج.",
        lessons: [
          {
            title: "ما هي Java؟",
            duration: "10 دقائق",
            explanation: `
              Java لغة برمجة تُستخدم في تطبيقات كثيرة، مثل أنظمة الشركات
              وبعض تطبيقات Android والأدوات الخلفية للمواقع.

              الكود الذي تكتبه يكون عادة داخل class، وتبدأ البرامج التقليدية
              من الدالة main. يجب الانتباه إلى الأحرف الكبيرة والصغيرة؛
              فـ Java تميّز بينهما.
            `,
            example: `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}`,
            tip: "احفظ شكل البرنامج الأساسي أولًا، ثم تعلّم معنى كل سطر بالتدريج.",
            task: "اكتب برنامجًا يحتوي على class باسم Main ودالة main، واطبع Hello, Java! باستخدام System.out.println.",
            starter: `public class Main {
    public static void main(String[] args) {
        // اكتب أمر الطباعة هنا
    }
}`,
            checks: [
              { pattern: /class\s+Main\b/, message: "أضف class باسم Main." },
              { pattern: /public\s+static\s+void\s+main\s*\(/, message: "أضف دالة main بالشكل الصحيح." },
              { pattern: /System\.out\.println\s*\(/, message: "استخدم System.out.println للطباعة." },
              { pattern: /Hello,\s*Java!/, message: "اطبع النص Hello, Java!." }
            ],
            quiz: {
              question: "ما الأمر المستخدم لطباعة نص في هذا المثال؟",
              options: [
                "System.out.println()",
                "Console.write()",
                "print.java()"
              ],
              answer: 0,
              explanation: "System.out.println() يطبع النص ثم ينتقل إلى سطر جديد."
            }
          },
          {
            title: "التعليقات والطباعة",
            duration: "10 دقائق",
            explanation: `
              التعليقات هي نصوص يكتبها المبرمج لتوضيح الكود، ولا تُنفّذ كأوامر.
              التعليق الذي يبدأ بـ // يستمر حتى نهاية السطر.
              أما التعليق بين /* و */ فيمكن أن يمتد إلى عدة أسطر.
            `,
            example: `public class Main {
    public static void main(String[] args) {
        // This is a comment
        System.out.println("Welcome");
        System.out.println("Learning Java");
    }
}`,
            tip: "النص داخل علامات الاقتباس يُطبع كما هو. لا تضع علامات الاقتباس حول أمر الطباعة كله.",
            task: "أضف تعليقًا يبدأ بـ // ثم اطبع Welcome باستخدام System.out.println.",
            starter: `public class Main {
    public static void main(String[] args) {
        // اكتب تعليقًا هنا

    }
}`,
            checks: [
              { pattern: /\/\//, message: "أضف تعليقًا باستخدام //." },
              { pattern: /System\.out\.println\s*\(\s*"Welcome"\s*\)/, message: 'اطبع "Welcome" باستخدام System.out.println.' }
            ],
            quiz: {
              question: "أي اختيار يمثل تعليقًا من سطر واحد؟",
              options: ["// تعليق", "<!-- تعليق -->", "** تعليق **"],
              answer: 0,
              explanation: "في Java يبدأ التعليق من سطر واحد بالرمز //."
            }
          }
        ]
      },
      {
        id: 2,
        title: "المتغيرات وأنواع البيانات",
        description: "خزّن البيانات واستخدمها.",
        lessons: [
          {
            title: "المتغيرات",
            duration: "12 دقيقة",
            explanation: `
              المتغير اسم يشير إلى مكان تُخزّن فيه قيمة.
              عند تعريف متغير في Java نكتب نوع البيانات ثم اسم المتغير ثم القيمة
              عند الحاجة. مثال: int age = 16;
              يجب إنهاء معظم أوامر Java بالفاصلة المنقوطة ;.
            `,
            example: `public class Main {
    public static void main(String[] args) {
        int age = 16;
        System.out.println(age);
    }
}`,
            tip: "اختر اسمًا واضحًا للمتغير، مثل age للعمر و score للنتيجة.",
            task: "أنشئ متغيرًا من النوع int باسم score وقيمته 100، ثم اطبع المتغير.",
            starter: `public class Main {
    public static void main(String[] args) {
        // أنشئ المتغير هنا

        // اطبع المتغير هنا
    }
}`,
            checks: [
              { pattern: /\bint\s+score\s*=\s*100\s*;/, message: "عرّف int score = 100;." },
              { pattern: /System\.out\.println\s*\(\s*score\s*\)/, message: "اطبع المتغير score." }
            ],
            quiz: {
              question: "أي نوع يُستخدم عادة لتخزين عدد صحيح؟",
              options: ["int", "String", "boolean"],
              answer: 0,
              explanation: "يُستخدم int لتخزين الأعداد الصحيحة ضمن مداه."
            }
          },
          {
            title: "أنواع البيانات",
            duration: "12 دقيقة",
            explanation: `
              من أنواع البيانات الأساسية:
              int للأعداد الصحيحة، double للأعداد العشرية، boolean للقيم true أو false،
              و char لحرف واحد. أما String فتُستخدم لتخزين النصوص.
              String ليست نوعًا بدائيًا، لكنها نوع شائع جدًا في Java.
            `,
            example: `int age = 16;
double price = 25.5;
boolean isReady = true;
char grade = 'A';
String name = "Cody";`,
            tip: "استخدم 'A' مع char و \"Cody\" مع String؛ نوع علامات الاقتباس مهم.",
            task: "أنشئ متغير String باسم name وقيمته Cody، ومتغير double باسم price وقيمته 25.5.",
            starter: `public class Main {
    public static void main(String[] args) {
        // أضف المتغيرات هنا
    }
}`,
            checks: [
              { pattern: /String\s+name\s*=\s*"Cody"\s*;/, message: 'أنشئ String name = "Cody";.' },
              { pattern: /double\s+price\s*=\s*25\.5\s*;/, message: "أنشئ double price = 25.5;." }
            ],
            quiz: {
              question: "أي نوع يناسب القيمة true أو false؟",
              options: ["double", "boolean", "char"],
              answer: 1,
              explanation: "النوع boolean يحمل إحدى القيمتين true أو false."
            }
          }
        ]
      },
      {
        id: 3,
        title: "العمليات الحسابية",
        description: "نفّذ الحسابات على المتغيرات.",
        lessons: [
          {
            title: "العمليات الأساسية",
            duration: "12 دقيقة",
            explanation: `
              تستخدم Java الرموز + للجمع، - للطرح، * للضرب، / للقسمة،
              و % للحصول على باقي القسمة.
              عند قسمة عددين صحيحين قد تكون النتيجة عددًا صحيحًا فقط.
            `,
            example: `int a = 10;
int b = 3;

System.out.println(a + b); // 13
System.out.println(a - b); // 7
System.out.println(a * b); // 30
System.out.println(a % b); // 1`,
            tip: "استخدم الأقواس عندما تريد توضيح ترتيب العمليات الحسابية.",
            task: "أنشئ المتغيرين a و b، ثم اطبع ناتج جمعهما باستخدام +.",
            starter: `public class Main {
    public static void main(String[] args) {
        int a = 10;
        int b = 3;

        // اطبع ناتج الجمع
    }
}`,
            checks: [
              { pattern: /int\s+a\s*=\s*10\s*;/, message: "تأكد من تعريف a بالقيمة 10." },
              { pattern: /int\s+b\s*=\s*3\s*;/, message: "تأكد من تعريف b بالقيمة 3." },
              { pattern: /System\.out\.println\s*\(\s*a\s*\+\s*b\s*\)/, message: "اطبع a + b." }
            ],
            quiz: {
              question: "ما نتيجة 10 % 3؟",
              options: ["3", "1", "0"],
              answer: 1,
              explanation: "باقي قسمة 10 على 3 يساوي 1."
            }
          },
          {
            title: "تحديث قيم المتغيرات",
            duration: "10 دقائق",
            explanation: `
              يمكنك تحديث قيمة متغير باستخدام عمليات مثل score = score + 1.
              ويمكن كتابة ذلك بصورة مختصرة: score += 1.
              أما score++ فتزيد القيمة بمقدار واحد.
            `,
            example: `int score = 5;
score++;
System.out.println(score); // 6

score += 4;
System.out.println(score); // 10`,
            tip: "التحديث يؤثر في قيمة المتغير، وليس في الاسم نفسه.",

function getXP() {

}

function updateStats() {

  if (xpElement) {

function findLesson(lessonId) {

  const completeButton = document.getElementById("completeLesson");

  if (title) title.textContent = lesson.title;

  if (explanation) explanation.textContent = lesson.explanation || "";

  if (example) {
    example.textContent = lesson.code || "";
  }

  if (task) {
    task.textContent = lesson.task || "";
  }

  if (hint) {

  if (quiz) {

        ${escapeHTML(lesson.quiz?.question || "جرّب كتابة الكود المطلوب.")}
      </p>
      <p class="quiz-instruction">

      </p>
    `;

    const isCompleted = completedLessons.includes(lesson.id);

    completeButton.textContent = isCompleted
      ? "تم إكمال الدرس ✓"
      : "إكمال الدرس";

    completeButton.disabled = isCompleted;
  }

  const codeInput = document.getElementById("codeEditor");

  if (codeInput) {
    disposeEditor();
    codeInput.value = lesson.starterCode || lesson.code || "";

function checkChallenge() {
  const lesson = findLesson(currentLessonId);

  if (!lesson) {
    showNotice("اختار درس الأول.", "error");
    return;
  }

  const code = getEditorCode().trim();

  if (!code) {
    setOutput("اكتب الكود الأول، وبعدها جرّب التحقق.", "error");
    return;
  }

  if (!Array.isArray(lesson.checks) || lesson.checks.length === 0) {
    setOutput(
      "تم استلام الكود. التحقق هنا مبدئي، وليس تشغيلًا حقيقيًا للغة Java.",
      "info"
    );
    return;
  }

  const failedCheck = lesson.checks.find(check => {
    check.pattern.lastIndex = 0;
    return !check.pattern.test(code);
  });

  if (failedCheck) {
    setOutput(
      `لسه فيه حاجة محتاجة تعديل. تلميح: ${failedCheck.message}`,
      "error"
    );
    return;
  }

  setOutput("ممتاز! الكود اجتاز التحقق المبدئي. 🎉", "success");

  if (!completedLessons.includes(lesson.id)) {
    completedLessons.push(lesson.id);
    saveProgress();
    addXP(10);

    const completeButton = document.getElementById("completeLesson");

    if (completeButton) {
      completeButton.textContent = "تم إكمال الدرس ✓";
      completeButton.disabled = true;
    }

    showNotice("أحسنت! حصلت على 10 نقاط خبرة.", "success");
  }
}

function attachLessonEvents() {

    });
  }

  if (completeButton) {

    });
  }

  if (resetButton) {

      if (editor) {
        editor.setValue(starterCode);

        const codeInput = document.getElementById("codeEditor");
        if (codeInput) codeInput.value = starterCode;
      }

      setOutput("تمت إعادة الكود إلى بدايته.");

  if (nextButton) {
    nextButton.addEventListener("click", () => {
      const index = allLessons.findIndex(
        lesson => lesson.id === currentLessonId
      );

      if (index >= 0 && index < allLessons.length - 1) {
        renderLesson(allLessons[index + 1].id);
      } else {
        showNotice("وصلت لآخر درس في المنهج. أحسنت!", "success");
      }
    });
  }

  if (previousButton) {
    previousButton.addEventListener("click", () => {
      const index = allLessons.findIndex(
        lesson => lesson.id === currentLessonId
      );

      if (index > 0) {
        renderLesson(allLessons[index - 1].id);
      } else {
        showNotice("ده أول درس في المنهج.", "info");
      }
    });
  }
}

function getInitialLesson() {
  const firstIncomplete = allLessons.find(
    lesson => !completedLessons.includes(lesson.id)
  );

  return firstIncomplete || allLessons[0] || null;
}
