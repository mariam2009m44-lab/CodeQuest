<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المتجر | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 80px; background: #050914; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(10, 17, 40, 0.95); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .top-bar a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .top-bar h1 { margin: 0; font-size: 1.3rem; color: var(--gold); }
        
        .wallet { background: rgba(0,0,0,0.5); border: 1px solid var(--gold); padding: 8px 15px; border-radius: 12px; color: var(--gold); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box;}
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        
        .item-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px 15px; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .item-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .item-icon { font-size: 3rem; margin-bottom: 10px; }
        .item-name { font-weight: bold; color: #fff; margin-bottom: 5px; }
        .item-price { color: var(--gold); font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .btn-buy { background: var(--gold); color: #000; border: none; padding: 10px; border-radius: 10px; width: 100%; font-family: 'Cairo'; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-buy:disabled { background: #333; color: #888; cursor: not-allowed; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 17, 40, 0.98); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass-border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        .nav-item i { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--gold); }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    
    <header class="top-header">
        <a href="dashboard.html" class="btn-icon"><i class="ri-arrow-right-line"></i></a>
        <h1 style="font-size:1.1rem; margin:0;">المتجر</h1>
        <div style="width: 40px;"></div>
    </header>


    <div class="grid" id="shopGrid"></div>

    
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><i class="ri-home-4-line"></i><span>الرئيسية</span></a>
        <a href="languages.html" class="nav-item"><i class="ri-book-open-line"></i><span>التعلم</span></a>
        <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="shop.html" class="nav-item active"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="profile.html" class="nav-item"><i class="ri-user-3-line"></i><span>ملفي</span></a>
    </nav>


    <script>
        // كتالوج المنتجات (أسعار ثابتة)
        const items = [
            { id: 'crown', name: 'تاج ملكي', icon: '👑', price: 150 },
            { id: 'cat', name: 'قطة أليفة', icon: '🐱', price: 200 },
            { id: 'star', name: 'نجمة سحرية', icon: '⭐', price: 100 },
            { id: 'glasses', name: 'نضارة كود', icon: '👓', price: 80 },
            { id: 'rocket', name: 'صاروخ', icon: '🚀', price: 300 },
            { id: 'shield', name: 'درع', icon: '🛡️', price: 250 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'login.html'; return; }
                const uid = Auth.getUserId();
                const doc = await firebase.firestore().collection('users').doc(uid).get();
                
                let currentCoins = doc.data().coins || 0; // قراءة العملات
                let inventory = doc.data().inventory || [];
                document.getElementById('userCoins').innerText = currentCoins;
                
                renderShop(currentCoins, inventory);
            });
        });

        function renderShop(coins, inventory) {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const isBought = inventory.includes(item.id);
                const canAfford = coins >= item.price;
                grid.innerHTML += `
                    <div class="item-card">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-price"><i class="ri-coin-line"></i> ${item.price}</div>
                        <button class="btn-buy" onclick="buyItem('${item.id}', ${item.price})" ${isBought || !canAfford ? 'disabled' : ''}>
                            ${isBought ? 'تم الشراء ✅' : (canAfford ? 'شراء' : 'عملات غير كافية')}
                        </button>
                    </div>
                `;
            });
        }

        async function buyItem(itemId, price) {
            const uid = Auth.getUserId();
            const userRef = firebase.firestore().collection('users').doc(uid);
            try {
                await firebase.firestore().runTransaction(async (transaction) => {
                    const doc = await transaction.get(userRef);
                    let coins = doc.data().coins || 0;
                    let inventory = doc.data().inventory || [];
                    
                    if (coins < price) throw "عملاتك لا تكفي!";
                    if (inventory.includes(itemId)) throw "لقد اشتريت هذا بالفعل!";
                    
                    // خصم العملات فقط، بدون المساس بالنقاط (XP)
                    transaction.update(userRef, {
                        coins: coins - price,
                        inventory: [...inventory, itemId]
                    });
                });
                alert("🎉 مبروك! تم الشراء بنجاح.");
                window.location.reload();
            } catch (e) { alert("❌ " + e); }
        }
    </script>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
</body>
</html>
