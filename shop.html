<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>المتجر</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" /><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script><link rel="stylesheet" href="global.css"></head><body><div class="header"><a href="languages.html" class="btn-back">رجوع</a><h1>المتجر 🛒</h1></div><h2 style="margin-top:20px; color:#ffd700;">رصيدك: <span id="pts">0</span></h2><p style="color:#aaa;">(المتجر قيد التطوير، ولكن النقاط بتتحدث من Firebase)</p><div class="bottom-nav"><a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a><a href="shop.html" class="nav-btn active"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a><a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a><a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a></div><script>Auth.init(async (l)=>{if(!l) window.location.href='index.html'; else { const d = await firebase.firestore().collection('users').doc(Auth.getUserId()).get(); if(d.exists) document.getElementById('pts').innerText = d.data().points||0; }});</script>
<script>
    // كود عرض النقاط الحقيقية في الواجهة
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (window.Auth && Auth.getUserData()) {
                const points = Auth.getUserData().points || 0;
                // بندور على أي عنصر فيه كلمة "رصيدك" أو "0" ونغيره
                let el = document.getElementById('pointsDisplay');
                if(!el) {
                    // لو مفيش ID، هنكريت شارة صغيرة فوق الشمال تبان في كل الصفحات
                    el = document.createElement('div');
                    el.style.cssText = 'position:fixed; top:15px; left:15px; background:#FFD700; color:#000; padding:8px 15px; border-radius:20px; font-weight:bold; z-index:9999; font-family:Cairo, sans-serif; box-shadow: 0 4px 15px rgba(255,215,0,0.3);';
                    document.body.appendChild(el);
                }
                el.innerHTML = `⭐ رصيدك: ${points} XP`;
            }
        }, 1000); // نستنى ثانية عشان Firebase يحمل الداتا
    });
</script>
</body>
</html>
