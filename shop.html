<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .shop-container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
        .mystery-box { font-size: 6rem; cursor: pointer; transition: transform 0.2s; display: inline-block; margin: 30px 0; }
        .mystery-box:hover { transform: scale(1.1) rotate(5deg); }
        .mystery-box:active { transform: scale(0.9); }
        .balance { font-size: 2rem; color: var(--accent); font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="shop-container animate-fade">
        <a href="index.html" class="btn-secondary" style="position:absolute; top:20px; right:20px; text-decoration:none;">⬅️ رجوع</a>
        <h1 style="color: var(--primary); margin-bottom: 10px;">متجر الأسرار</h1>
        <div class="balance">رصيدك: <span id="shop-points">0</span> ⭐</div>
        
        <div class="card-glass" style="padding: 40px;">
            <h2 style="color: var(--secondary);">صندوق المفاجآت!</h2>
            <p style="color: var(--text-muted);">افتح الصندوق بـ 50 نقطة واحصل على ميدالية أو شخصية نادرة!</p>
            <div class="mystery-box" id="box" onclick="openBox()">🎁</div>
            <div id="result" style="font-size: 1.5rem; font-weight: bold; color: var(--accent); margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        let currentPoints = 0;
        
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((loggedIn) => {
                if(!loggedIn) window.location.href = 'login.html';
                else {
                    currentPoints = Auth.getUserData()?.points || 0;
                    document.getElementById('shop-points').innerText = currentPoints;
                }
            });
        });

        async function openBox() {
            if (currentPoints < 50) {
                showToast("عذراً، تحتاج 50 نقطة لفتح الصندوق!", "success");
                return;
            }
            
            const box = document.getElementById('box');
            box.style.transform = 'scale(1.2) rotate(20deg)';
            setTimeout(() => box.style.transform = 'scale(1) rotate(-20deg)', 200);
            setTimeout(() => box.style.transform = 'scale(1) rotate(0)', 400);
            
            // خصم النقاط
            await Auth.addPoints(-50);
            currentPoints -= 50;
            document.getElementById('shop-points').innerText = currentPoints;
            
            // سحب عشوائي
            const prizes = ['🥇 ميدالية ذهبية', '👽 شخصية فضائية', '🐱 شخصية قطة', '💎 جوهرة نادرة'];
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            
            setTimeout(() => {
                document.getElementById('result').innerText = "مبروك! حصلت على: " + prize;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }, 600);
        }
    </script>
    <script src="global.js"></script>
</body>
</html>
