<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المتجر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px;margin:auto;}.item{background:rgba(255,255,255,0.05);padding:15px;border-radius:15px;}button{background:#00e5ff;border:none;padding:10px;border-radius:10px;margin-top:10px;cursor:pointer;}</style></head><body><h2 style="color:#ffd700;">🛒 المتجر (رصيدك: <span id="b">0</span>)</h2><button onclick="window.location.href='languages.html'" style="margin-bottom:20px;">رجوع</button><div class="grid" id="g"></div><script>document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){let b=Auth.getUserData()?Auth.getUserData().bonusPoints||0:0;document.getElementById('b').innerText=b;const items=[{n:'تاج',i:'👑',p:50},{n:'قطة',i:'🐱',p:80}];document.getElementById('g').innerHTML=items.map(x=>`<div class="item"><div style="font-size:40px;">${x.i}</div><div>${x.n}</div><div style="color:#ffd700;">${x.p} نقطة</div><button onclick="buy(${x.p},${b})">شراء</button></div>`).join('');}async function buy(p,b){if(b<p){alert('نقاطك لا تكفي');return;}await firebase.firestore().collection('users').doc(Auth.getUserId()).update({bonusPoints:firebase.firestore.FieldValue.increment(-p)});alert('تم الشراء!');location.reload();}</script></body></html>
