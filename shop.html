<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
<style>body{background:#050914;color:#fff;font-family:Cairo;text-align:center;padding:20px;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px;margin:auto;} .item{background:rgba(255,255,255,0.05);border:1px solid #555;padding:15px;border-radius:15px;cursor:pointer;} .item:hover{border-color:#ffd700;} .icon{font-size:40px;} h2{color:#ffd700;}</style>
</head>
<body>
<h2>رصيدك: <span id="balance" style="color:#00e5ff;">0</span> نقطة</h2>
<button onclick="window.location.href='languages.html'" style="margin-bottom:20px;padding:10px;border-radius:10px;cursor:pointer;font-family:Cairo;">رجوع</button>
<div class="grid" id="grid"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        const balanceEl = document.getElementById('balance');
        let balance = Auth.getUserData() ? (Auth.getUserData().bonusPoints || 0) : 0;
        balanceEl.innerText = balance;

        const items = [{n:'تاج',i:'👑',p:50},{n:'قطة',i:'🐱',p:80},{n:'نجوم',i:'⭐',p:60},{n:'بطل',i:'🦸',p:100}];
        const grid = document.getElementById('grid');
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = '<div class="icon">' + item.i + '</div><p>' + item.n + '</p><b style="color:#ffd700;">' + item.p + ' نقطة</b>';
            div.onclick = async () => {
                if(balance >= item.p) {
                    try {
                        await firebase.firestore().collection('users').doc(Auth.getUserId()).update({
                            bonusPoints: firebase.firestore.FieldValue.increment(-item.p)
                        });
                        alert('تم الشراء!');
                        location.reload();
                    } catch(e) { alert('خطأ في الشراء'); }
                } else { alert('نقاطك لا تكفي!'); }
            };
            grid.appendChild(div);
        });
    });
});
</script>
</body></html>
