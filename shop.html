<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>المتجر | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.7); }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 1.4rem; color: var(--gold); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .points-display { background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 20px; border: 1px solid var(--gold); margin-top: 20px; text-align: center; }
        .points-display h2 { margin: 0; font-size: 2rem; color: var(--gold); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 90%; max-width: 600px; margin-top: 20px; }
        .item-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; text-align: center; }
        .item-icon { font-size: 3rem; margin-bottom: 10px; }
        .item-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .item-price { color: var(--gold); font-size: 0.9rem; margin-bottom: 15px; }
        .btn-buy { background: var(--neon-cyan); color: #000; border: none; padding: 8px; border-radius: 10px; width: 100%; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 65px; height: 60px; border-radius: 18px; color: #667; text-decoration: none; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; font-weight: bold; }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h1>🛒 المتجر</h1></div>
    <div class="points-display"><h2 id="userPoints">0</h2><p style="margin: 5px 0 0; color: #aaa;">رصيدك من النقاط</p></div>
    <div class="grid-container" id="shopGrid"></div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn active"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        const shopItems = [
            { id: 'crown', name: 'تاج ملكي', icon: '👑', price: 50 },
            { id: 'cat', name: 'قطة أليفة', icon: '🐱', price: 80 },
            { id: 'glasses', name: 'نضارة كود', icon: '👓', price: 30 }
        ];
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const uid = Auth.getUserId();
                const doc = await firebase.firestore().collection('users').doc(uid).get();
                document.getElementById('userPoints').innerText = doc.data().points || 0;

                const grid = document.getElementById('shopGrid');
                shopItems.forEach(item => {
                    grid.innerHTML += `
                        <div class="item-card">
                            <div class="item-icon">${item.icon}</div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${item.price} نقطة</div>
                            <button class="btn-buy" onclick="buyItem('${item.id}', ${item.price})">شراء</button>
                        </div>
                    `;
                });
            });
        });

        async function buyItem(itemId, price) {
            const uid = Auth.getUserId();
            const userRef = firebase.firestore().collection('users').doc(uid);
            try {
                await firebase.firestore().runTransaction(async (transaction) => {
                    const doc = await transaction.get(userRef);
                    const currentPoints = doc.data().points || 0;
                    if (currentPoints < price) throw "نقاطك لا تكفي!";
                    let inventory = doc.data().inventory || [];
                    if (inventory.includes(itemId)) throw "لقد اشتريت هذا بالفعل!";
                    inventory.push(itemId);
                    transaction.update(userRef, { points: currentPoints - price, inventory: inventory });
                });
                alert("🎉 تم الشراء بنجاح!");
                window.location.reload();
            } catch(e) { alert("❌ " + e); }
        }
    </script>
</body></html>
