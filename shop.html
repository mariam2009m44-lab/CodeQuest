<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;background-image:radial-gradient(circle at 50% 0%, rgba(255,215,0,0.15) 0%, transparent 60%);font-family:Cairo;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.back-btn{background:rgba(0,229,255,0.1);color:#00e5ff;border:1px solid #00e5ff;padding:8px 15px;border-radius:20px;font-weight:bold;cursor:pointer;font-family:Cairo;}
.balance{background:rgba(255,215,0,0.1);border:2px solid #ffd700;padding:10px 20px;border-radius:20px;font-weight:900;color:#ffd700;font-size:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:500px;margin:auto;}
.item{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:20px;padding:20px;text-align:center;transition:0.3s;}
.item:hover{transform:translateY(-5px);border-color:#ffd700;box-shadow:0 10px 20px rgba(255,215,0,0.2);}
.icon{font-size:50px;margin-bottom:10px;}
.name{font-weight:bold;font-size:14px;}
.price{color:#ffd700;font-weight:900;margin-top:5px;}
.buy-btn{background:linear-gradient(135deg,#00e5ff,#0072ff);color:#fff;border:none;padding:10px;border-radius:10px;width:100%;margin-top:10px;font-weight:bold;font-family:Cairo;cursor:pointer;}
</style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="window.location.href='languages.html'">← رجوع</button>
    <div class="balance">💰 <span id="balance">0</span> نقطة</div>
</div>
<div class="grid" id="grid"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        const balanceEl = document.getElementById('balance');
        let balance = Auth.getUserData() ? (Auth.getUserData().bonusPoints || 0) : 0;
        balanceEl.innerText = balance;

        const items = [{n:'تاج ذهبي',i:'👑',p:50},{n:'قطة مشمش',i:'🐱',p:80},{n:'تأثير نجوم',i:'⭐',p:60},{n:'لقب بطل',i:'🦸',p:100}];
        const grid = document.getElementById('grid');
        
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div class="icon">${item.i}</div><div class="name">${item.n}</div><div class="price">${item.p} نقطة</div><button class="buy-btn" onclick="buyItem('${item.n}', ${item.p}, ${balance})">شراء</button>`;
            grid.appendChild(div);
        });
    });
});

async function buyItem(name, price, balance) {
    if(balance < price) { alert('نقاطك لا تكفي! العب مستويات أكتر عشان تجمع نقاط.'); return; }
    try {
        await firebase.firestore().collection('users').doc(Auth.getUserId()).update({
            bonusPoints: firebase.firestore.FieldValue.increment(-price)
        });
        try { confetti({ particleCount: 150, spread: 100 }); } catch(e) {}
        alert('تم شراء ' + name + ' بنجاح! 🎉');
        location.reload();
    } catch(e) { alert('حدث خطأ أثناء الشراء.'); }
}
</script>
</body></html>
