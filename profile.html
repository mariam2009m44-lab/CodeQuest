<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: var(--bg-deep); padding: var(--space-l); }
        .profile-container { max-width: 800px; margin: 0 auto; }
        .profile-header { background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-xl); text-align: center; margin-bottom: var(--space-l); position: relative; overflow: hidden; }
        .avatar-display { width: 120px; height: 120px; background: var(--bg-deep); border: 4px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5rem; margin: 0 auto var(--space-m); box-shadow: 0 0 30px rgba(0, 217, 255, 0.3); }
        .user-name { font-size: 2rem; color: var(--text-primary); margin-bottom: var(--space-xs); }
        .user-level { display: inline-block; background: rgba(118, 87, 255, 0.2); color: var(--accent-purple); padding: 5px 15px; border-radius: var(--radius-pill); font-weight: 700; margin-bottom: var(--space-m); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-s); }
        .stat-box { background: rgba(5, 11, 31, 0.5); border: 1px solid var(--border-soft); border-radius: var(--radius-button); padding: var(--space-s); text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 900; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px; }
        .section-title { color: var(--text-primary); font-size: 1.3rem; margin-bottom: var(--space-m); display: flex; align-items: center; gap: 10px; }
        .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: var(--space-s); }
        .badge-item { background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-m); text-align: center; }
        .badge-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .badge-name { font-size: 0.9rem; color: var(--text-secondary); font-weight: 600; }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="profile-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-m);">
            <h1 style="color: var(--text-primary);">ملفي الشخصي</h1>
            <a href="dashboard.html" class="btn-secondary"><i class="ri-home-5-line"></i> الرئيسية</a>
        </div>

        <div class="profile-header">
            <div class="avatar-display" id="avatarDisplay">🤖</div>
            <h2 class="user-name" id="userName">جاري التحميل...</h2>
            <div class="user-level" id="userLevel">المستوى 1</div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="statXP">0</div>
                    <div class="stat-label">نقاط الخبرة</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statCoins">0</div>
                    <div class="stat-label">العملات</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statLessons">0</div>
                    <div class="stat-label">دروس مكتملة</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statProjects">0</div>
                    <div class="stat-label">مشاريع</div>
                </div>
            </div>
        </div>

        <h3 class="section-title"><i class="ri-medal-line"></i> الشارات المكتسبة</h3>
        <div class="badges-grid" id="badgesContainer"></div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc } from './js/app.js';

        const avatarMap = {
            'crown': '👑', 'glasses': '👓', 'stars': '✨', 'suit': '🧥', 'default': '🤖'
        };

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('userName').innerText = data.displayName || user.email.split('@')[0];
                    document.getElementById('statXP').innerText = data.xp || 0;
                    document.getElementById('statCoins').innerText = data.coins || 0;
                    
                    const level = Math.floor((data.xp || 0) / 100) + 1;
                    document.getElementById('userLevel').innerText = 'المستوى ' + level;

                    const inventory = data.inventory || [];
                    if (inventory.includes('crown')) document.getElementById('avatarDisplay').innerText = '👑';
                    else if (inventory.includes('suit')) document.getElementById('avatarDisplay').innerText = '🧥';
                    
                    renderBadges(data);
                }
            }
        });

        function renderBadges(data) {
            const container = document.getElementById('badgesContainer');
            container.innerHTML = '';
            const badges = [];
            
            if ((data.xp || 0) >= 50) badges.push({ icon: '🚀', name: 'البداية' });
            if ((data.xp || 0) >= 200) badges.push({ icon: '🔥', name: 'مثابر' });
            if ((data.inventory || []).length > 0) badges.push({ icon: '🛍️', name: 'متسوق' });
            if ((data.xp || 0) >= 500) badges.push({ icon: '🏆', name: 'محترف' });

            if (badges.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">أكمل دروساً أكثر للحصول على شارات!</p>';
            }

            badges.forEach(b => {
                const div = document.createElement('div');
                div.className = 'badge-item';
                div.innerHTML = `<div class="badge-icon">${b.icon}</div><div class="badge-name">${b.name}</div>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
