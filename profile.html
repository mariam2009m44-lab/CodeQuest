<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>ملفي | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>

    <script src="js/world-bg.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const uid = Auth.getUserId();
                
                // قراءة الأفاتار من المتصفح (عشان يظهر فوراً)
                let savedAvatar = localStorage.getItem('cq_avatar');
                if(savedAvatar) document.getElementById('userAvatar').src = savedAvatar;

                try {
                    const doc = await firebase.firestore().collection('users').doc(uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('userName').innerText = data.username || "مستخدم";
                        document.getElementById('userPts').innerText = data.points || 0;
                        
                        // لو فيه أفاتار في فايربيز، نحدثه ونعرضه
                        if(data.avatar) {
                            document.getElementById('userAvatar').src = data.avatar;
                            localStorage.setItem('cq_avatar', data.avatar);
                        }
                    }
                } catch(e) { console.error(e); }
            });
        });
    </script>

</body></html>
