<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>ملفي | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.7); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 1.4rem; color: var(--neon-cyan); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        
        .profile-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px 20px; width: 90%; max-width: 400px; margin-top: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .avatar-wrapper { width: 140px; height: 140px; margin: 0 auto 20px; border-radius: 50%; padding: 5px; background: linear-gradient(45deg, #00e5ff, #8b5cf6); box-shadow: 0 0 30px rgba(0,229,255,0.4); }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; background: #111; object-fit: cover; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .stat-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h3 { margin: 0; color: #aaa; font-size: 0.9rem; }
        .stat-box p { margin: 5px 0 0; color: var(--gold); font-size: 1.5rem; font-weight: bold; }
        
        .btn-logout { background: rgba(255, 68, 68, 0.1); color: #ff4444; border: 1px solid #ff4444; padding: 15px; border-radius: 15px; width: 100%; margin-top: 30px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: #ff4444; color: #fff; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 65px; height: 60px; border-radius: 18px; color: #667; text-decoration: none; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; font-weight: bold; }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h1>الملف الشخصي</h1></div>
    <div class="profile-card">
        <div class="avatar-wrapper"><img src="" id="userAvatar" onerror="this.src='cody-avatar.svg'"></div>
        <h2 style="margin: 0; font-size: 1.8rem;" id="userName">جاري التحميل...</h2>
        <p style="color: var(--neon-cyan); margin: 5px 0 0;">مبرمج طموح 🚀</p>
        <div class="stats-grid">
            <div class="stat-box"><h3>النقاط (XP)</h3><p id="userPts">0</p></div>
            <div class="stat-box"><h3>المستوى</h3><p>1</p></div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()">تسجيل الخروج</button>
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn active"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. عرض الصورة فوراً من المتصفح
            const localAvatar = localStorage.getItem('cq_avatar');
            if(localAvatar) document.getElementById('userAvatar').src = localAvatar;

            // 2. جلب البيانات من فايربيز
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const uid = Auth.getUserId();
                try {
                    const doc = await firebase.firestore().collection('users').doc(uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('userName').innerText = data.username || "مستخدم";
                        document.getElementById('userPts').innerText = data.points || 0;
                        if(data.avatar) {
                            document.getElementById('userAvatar').src = data.avatar;
                            localStorage.setItem('cq_avatar', data.avatar);
                        }
                    }
                } catch(e) { console.error(e); }
            });
        });
    </script>
</body></html>
