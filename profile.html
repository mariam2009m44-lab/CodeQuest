<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">ملفي الشخصي</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>

        <div class="card" style="text-align: center; margin-bottom: 30px;">
            <div id="avatarDisplay" style="width: 100px; height: 100px; background: var(--primary-main); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px auto;">
                <i class="ri-user-smile-line"></i>
            </div>
            <h2 id="displayName" style="color: var(--text-main); margin-bottom: 5px;">جاري التحميل...</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">مبرمج طموح 🚀</p>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <div style="text-align: center;">
                    <p id="profileXP" style="font-size: 1.5rem; font-weight: 700; color: var(--primary-main);">0</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">XP</p>
                </div>
                <div style="text-align: center;">
                    <p id="profileCoins" style="font-size: 1.5rem; font-weight: 700; color: var(--reward);">0</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">كوينز</p>
                </div>
            </div>
        </div>

        <h3 style="color: var(--text-main); margin-bottom: 20px;">الشارات المكتسبة</h3>
        <div id="badgesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px;">
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc } from './js/app.js';

        const avatarMap = {
            'astronaut': '👩‍🚀',
            'fox': '🦊',
            'robot': '🤖',
            'dragon': '🐉',
            'default': '<i class="ri-user-smile-line"></i>'
        };

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const data = userSnap.data() || {};

                document.getElementById('displayName').innerText = data.displayName || "بطل CodeQuest";
                document.getElementById('profileXP').innerText = data.xp || 0;
                document.getElementById('profileCoins').innerText = data.coins || 0;

                const activeAvatar = data.activeAvatar || 'default';
                const avatarEl = document.getElementById('avatarDisplay');
                if (avatarMap[activeAvatar].includes('<i')) {
                    avatarEl.innerHTML = avatarMap[activeAvatar];
                } else {
                    avatarEl.innerText = avatarMap[activeAvatar];
                    avatarEl.style.background = 'transparent';
                }

                const badgesContainer = document.getElementById('badgesContainer');
                if (data.xp >= 50) {
                    badgesContainer.innerHTML += `<div class="card" style="text-align: center; padding: 15px;"><div style="font-size: 2rem; margin-bottom: 10px;">🚀</div><p style="font-size: 0.8rem; font-weight: 600;">البداية</p></div>`;
                }
                if (data.xp >= 200) {
                    badgesContainer.innerHTML += `<div class="card" style="text-align: center; padding: 15px;"><div style="font-size: 2rem; margin-bottom: 10px;">🔥</div><p style="font-size: 0.8rem; font-weight: 600;">مثابر</p></div>`;
                }
                if (data.inventory && data.inventory.length > 0) {
                    badgesContainer.innerHTML += `<div class="card" style="text-align: center; padding: 15px;"><div style="font-size: 2rem; margin-bottom: 10px;">🛍️</div><p style="font-size: 0.8rem; font-weight: 600;">متسوق</p></div>`;
                }
            }
        });
    </script>
</body>
</html>
