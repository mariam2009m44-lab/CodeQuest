<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ملفي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:20px;font-family:Cairo;text-align:center;}.card{background:rgba(255,255,255,0.05);padding:20px;border-radius:20px;max-width:400px;margin:auto;border:2px solid #00e5ff;}.score{font-size:40px;color:#ffd700;font-weight:bold;margin:20px 0;}button{background:#e74c3c;color:#fff;padding:10px 20px;border:none;border-radius:10px;margin-top:20px;cursor:pointer;}</style></head><body><div class="card"><h2 id="name" style="color:#00e5ff;">...</h2><div class="score">💰 <span id="score">0</span></div><button onclick="Auth.logout()">تسجيل الخروج</button><button onclick="window.location.href='languages.html'" style="background:#00e5ff;color:#000;margin-right:10px;">رجوع</button></div><script>document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else{document.getElementById('name').innerText=Auth.getCurrentUser();document.getElementById('score').innerText=Auth.getUserData()?Auth.getUserData().bonusPoints||0:0;}});});</script></body></html>
