<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الملف الشخصي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
<style>body{background:#050914;color:#fff;font-family:Cairo;text-align:center;padding:20px;} .card{background:rgba(255,255,255,0.05);border:2px solid #00e5ff;border-radius:20px;padding:20px;max-width:400px;margin:auto;} img{width:100px;height:100px;border-radius:50%;border:3px solid #00e5ff;} h2{color:#ffd700;} button{background:#e74c3c;color:#fff;padding:10px 20px;border:none;border-radius:10px;margin-top:20px;cursor:pointer;font-family:Cairo;font-weight:bold;}</style>
</head>
<body>
<div class="card">
    <div id="avatar"></div>
    <h2 id="name">جاري التحميل...</h2>
    <h3>النقاط: <span id="score" style="color:#ffd700;">0</span></h3>
    <button onclick="Auth.logout()">تسجيل الخروج</button>
    <br><br><button onclick="window.location.href='languages.html'" style="background:#00e5ff;color:#000;">الرجوع للرئيسية</button>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        const user = Auth.getCurrentUser(), data = Auth.getUserData();
        document.getElementById('name').innerText = user;
        document.getElementById('score').innerText = data ? (data.bonusPoints || 0) : 0;
        document.getElementById('avatar').innerHTML = Auth.getAvatarHtml(user);
    });
});
</script>
</body></html>
