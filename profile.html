<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050914;color:#fff;min-height:100vh;padding:15px;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0%, rgba(0,229,255,0.15) 0%, transparent 60%)}
.header-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;position:relative;z-index:2}
.back-btn{background:rgba(0,229,255,0.1);color:#00e5ff;border:1px solid rgba(0,229,255,0.4);padding:9px 16px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer;font-family:'Cairo',sans-serif;transition:0.3s}
.header-title{flex:1;text-align:center;color:#00e5ff;font-size:18px;font-weight:900;text-shadow:0 0 15px rgba(0,229,255,0.6)}

.profile-card{background:linear-gradient(135deg, rgba(0,229,255,0.1), rgba(0,114,255,0.05));border:2px solid rgba(0,229,255,0.3);border-radius:24px;padding:25px 20px;text-align:center;margin-bottom:15px;position:relative;z-index:2;box-shadow:0 15px 40px rgba(0,229,255,0.15)}
.avatar-wrap{position:relative;width:110px;height:110px;margin:0 auto 12px;cursor:pointer;transition:0.3s}
.avatar-wrap:active{transform:scale(0.95)}
.avatar-wrap img, .avatar-wrap .letter-avatar{width:100%;height:100%;border-radius:50%;background:#b6e3f4;border:3px solid #00e5ff;box-shadow:0 0 25px rgba(0,229,255,0.6);object-fit:cover}
.avatar-wrap .letter-avatar{display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.avatar-edit{position:absolute;bottom:0;right:0;background:#27ae60;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #050914;box-shadow:0 5px 15px rgba(39,174,96,0.5)}
.profile-card h2{color:#00e5ff;font-size:22px;margin-bottom:5px;font-weight:900;text-shadow:0 0 15px rgba(0,229,255,0.5)}
.join-date{color:#a0aec0;font-size:12px;margin-bottom:18px}
.total-score{background:rgba(0,0,0,0.4);border:1px solid rgba(255,215,0,0.3);border-radius:16px;padding:15px;margin-top:15px}
.score-label{color:#a0aec0;font-size:12px;margin-bottom:5px}
.score-value{color:#ffd700;font-size:38px;font-weight:900;text-shadow:0 0 25px rgba(255,215,0,0.7)}

.stats-title{color:#00e5ff;font-size:15px;font-weight:bold;margin-bottom:12px;text-align:center;position:relative;z-index:2}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:500px;margin:0 auto 20px;position:relative;z-index:2}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;transition:0.3s}
.stat-icon{font-size:26px}
.stat-info{display:flex;flex-direction:column;flex:1}
.stat-name{font-size:11px;color:#a0aec0}
.stat-value{font-size:18px;font-weight:900;color:#00e5ff}

.badges-section{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:18px;margin-bottom:15px;max-width:500px;margin-left:auto;margin-right:auto;position:relative;z-index:2}
.badges-section h3{color:#00e5ff;font-size:15px;margin-bottom:15px;text-align:center}
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge-item{text-align:center;padding:10px 5px;border-radius:12px;transition:0.3s}
.badge-item.earned{background:linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));border:1px solid rgba(255,215,0,0.4);box-shadow:0 0 15px rgba(255,215,0,0.2)}
.badge-item.locked{background:rgba(0,0,0,0.3);border:1px dashed rgba(255,255,255,0.15);opacity:0.4;filter:grayscale(1)}
.badge-icon{font-size:26px;margin-bottom:5px}
.badge-name{font-size:9px;color:#e0e0e0;font-weight:bold;line-height:1.3}

.buttons-container{max-width:500px;margin:0 auto;position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;padding-bottom:30px}
.btn-action{width:100%;padding:16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;transition:0.3s;display:flex;align-items:center;justify-content:center;gap:8px;border:none;text-decoration:none}
.btn-change-avatar{background:linear-gradient(135deg, #27ae60, #1e8449);color:#fff;box-shadow:0 10px 25px rgba(39,174,96,0.5)}
.btn-change-avatar:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(39,174,96,0.7)}
.btn-logout{background:linear-gradient(135deg, #e74c3c, #c0392b);color:#fff;box-shadow:0 10px 25px rgba(231,76,60,0.4)}
.btn-logout:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(231,76,60,0.6)}
.btn-action:active{transform:scale(0.97)}

/* Custom Logout Modal */
.custom-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,9,20,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:99999;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
.custom-modal-overlay.show{opacity:1;pointer-events:auto}
.custom-modal-box{background:linear-gradient(135deg, #0f172a, #1e293b);border:2px solid #e74c3c;border-radius:24px;padding:30px 20px;text-align:center;max-width:340px;width:90%;box-shadow:0 0 40px rgba(231,76,60,0.3);transform:scale(0.8);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
.custom-modal-overlay.show .custom-modal-box{transform:scale(1)}
.custom-modal-icon{font-size:55px;margin-bottom:15px;filter:drop-shadow(0 0 15px rgba(231,76,60,0.6))}
.custom-modal-title{color:#fff;font-size:20px;font-weight:900;margin-bottom:10px;font-family:'Cairo',sans-serif}
.custom-modal-desc{color:#a0aec0;font-size:14px;margin-bottom:25px;line-height:1.6;font-family:'Cairo',sans-serif}
.custom-modal-actions{display:flex;gap:10px}
.custom-modal-btn{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;border:none;transition:0.3s}
.custom-modal-btn-cancel{background:rgba(255,255,255,0.1);color:#fff}
.custom-modal-btn-cancel:hover{background:rgba(255,255,255,0.2)}
.custom-modal-btn-confirm{background:linear-gradient(135deg, #e74c3c, #c0392b);color:#fff;box-shadow:0 5px 15px rgba(231,76,60,0.4)}
.custom-modal-btn-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(231,76,60,0.6)}

</style>
</head>
<body>

<div class="header-bar">
<button class="back-btn" onclick="playSound('click'); setTimeout(()=>window.location.href='languages.html',150)">← رجوع</button>
<div class="header-title">👤 ملفي الشخصي</div>
<div style="width:70px"></div>
</div>

<div class="profile-card">
<div class="avatar-wrap" onclick="playSound('click'); window.location.href='avatar.html'">
<div id="userAvatar"></div>
<div class="avatar-edit">✏️</div>
</div>
<h2 id="userName">-</h2>
<p class="join-date">عضو من <span id="joinDate">-</span></p>
<div class="total-score">
<div class="score-label">مجموع النقاط</div>
<div class="score-value" id="totalScore">0</div>
</div>
</div>

<div class="stats-title">📊 إحصائياتك</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon">🧩</div><div class="stat-info"><span class="stat-name">بازل الأكواد</span><span class="stat-value" data-stat="match">0</span></div></div>
<div class="stat-card"><div class="stat-icon">🧠</div><div class="stat-info"><span class="stat-name">لعبة الذاكرة</span><span class="stat-value" data-stat="memory">0</span></div></div>
<div class="stat-card"><div class="stat-icon">🐛</div><div class="stat-info"><span class="stat-name">اكتشف الخطأ</span><span class="stat-value" data-stat="bug">0</span></div></div>
<div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-info"><span class="stat-name">تحدي السرعة</span><span class="stat-value" data-stat="speed">0</span></div></div>
<div class="stat-card"><div class="stat-icon">❓</div><div class="stat-info"><span class="stat-name">سؤال وجواب</span><span class="stat-value" data-stat="quiz">0</span></div></div>
<div class="stat-card"><div class="stat-icon">🏗️</div><div class="stat-info"><span class="stat-name">بناء الكود</span><span class="stat-value" data-stat="build">0</span></div></div>
</div>

<div class="badges-section">
<h3>🏅 الأوسمة اللي كسبتها</h3>
<div class="badges-grid" id="badgesGrid"></div>
</div>

<div class="buttons-container">
<button class="btn-action btn-change-avatar" onclick="playSound('click'); window.location.href='avatar.html'">
🎨 غير شخصيتك
</button>
<button class="btn-action btn-logout" onclick="confirmLogout()">
🚪 تسجيل الخروج / تبديل الحساب
</button>
</div>

<script>
const user = Auth.getCurrentUser();
document.getElementById('userName').innerText = user || 'بطل البرمجة';
document.getElementById('userAvatar').innerHTML = Auth.getAvatarHtml(user);

setTimeout(() => { if (typeof Accessories !== 'undefined') Accessories.render(); }, 300);

const users = Auth.getUsers();
const userData = users[user] || {};
if (userData.created) {
    const d = new Date(userData.created);
    document.getElementById('joinDate').innerText = d.toLocaleDateString('ar-EG');
}

const games = ['match', 'memory', 'bug', 'speed', 'quiz', 'build'];
let total = 0;
games.forEach(g => {
    const score = parseInt(localStorage.getItem('cq_high_' + g) || '0');
    total += score;
    const el = document.querySelector('[data-stat="' + g + '"]');
    if (el) el.innerText = score;
});
const bonus = (userData.bonusPoints || 0);
const levelsBalance = parseInt(localStorage.getItem('cq_balance_' + user) || '0');
document.getElementById('totalScore').innerText = total + bonus + levelsBalance;

const allBadges = [
    { id: 'match', icon: '🧩', name: 'حلّال البازل', condition: () => parseInt(localStorage.getItem('cq_high_match') || '0') >= 30 },
    { id: 'memory', icon: '🧠', name: 'صاحب الذاكرة', condition: () => parseInt(localStorage.getItem('cq_high_memory') || '0') >= 60 },
    { id: 'bug', icon: '🐛', name: 'صائد الأخطاء', condition: () => parseInt(localStorage.getItem('cq_high_bug') || '0') >= 40 },
    { id: 'speed', icon: '⚡', name: 'السريع', condition: () => parseInt(localStorage.getItem('cq_high_speed') || '0') >= 60 },
    { id: 'quiz', icon: '❓', name: 'العبقري', condition: () => parseInt(localStorage.getItem('cq_high_quiz') || '0') >= 60 },
    { id: 'build', icon: '🏗️', name: 'المهندس', condition: () => parseInt(localStorage.getItem('cq_high_build') || '0') >= 50 },
    { id: 'master', icon: '👑', name: 'بطل CodeQuest', condition: () => (total + bonus + levelsBalance) >= 200 },
    { id: 'legend', icon: '💎', name: 'أسطورة البرمجة', condition: () => (total + bonus + levelsBalance) >= 300 }
];

const badgesGrid = document.getElementById('badgesGrid');
allBadges.forEach(b => {
    const earned = b.condition();
    const el = document.createElement('div');
    el.className = 'badge-item' + (earned ? ' earned' : ' locked');
    el.innerHTML = '<div class="badge-icon">' + b.icon + '</div><div class="badge-name">' + b.name + '</div>';
    badgesGrid.appendChild(el);
});


}

function confirmLogout() {
    playSound('click');
    document.getElementById('logoutModal').classList.add('show');
}

function closeLogoutModal() {
    playSound('click');
    document.getElementById('logoutModal').classList.remove('show');
}

function doLogout() {
    playSound('win');
    Auth.logout();
}

</script>

<div class="custom-modal-overlay" id="logoutModal">
    <div class="custom-modal-box">
        <div class="custom-modal-icon">🚪</div>
        <div class="custom-modal-title">تسجيل الخروج</div>
        <div class="custom-modal-desc">هل أنت متأكد أنك تريد تسجيل الخروج من حسابك؟<br>لن تفقد أي تقدم أو نقاط.</div>
        <div class="custom-modal-actions">
            <button class="custom-modal-btn custom-modal-btn-cancel" onclick="closeLogoutModal()">إلغاء</button>
            <button class="custom-modal-btn custom-modal-btn-confirm" onclick="doLogout()">نعم، خروج</button>
        </div>
    </div>
</div>

</body>
</html>
