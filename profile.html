<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">ملفي الشخصي</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>

        <div class="card" style="text-align: center; margin-bottom: 30px;">
            <div style="width: 100px; height: 100px; background: var(--primary-main); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px auto;">
                <i class="ri-user-smile-line"></i>
            </div>
            <h2 style="color: var(--text-main); margin-bottom: 5px;">مريم البطلة</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">مبرمجة طموحة 🚀</p>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <div style="text-align: center;">
                    <p style="font-size: 1.5rem; font-weight: 700; color: var(--primary-main);">1,250</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">XP</p>
                </div>
                <div style="text-align: center;">
                    <p style="font-size: 1.5rem; font-weight: 700; color: var(--reward);">15</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">أيام متتالية</p>
                </div>
                <div style="text-align: center;">
                    <p style="font-size: 1.5rem; font-weight: 700; color: var(--success);">24</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">دروس مكتملة</p>
                </div>
            </div>
        </div>

        <h3 style="color: var(--text-main); margin-bottom: 20px;">الشارات المكتسبة</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px;">
            <div class="card" style="text-align: center; padding: 15px;">
                <div style="font-size: 2rem; margin-bottom: 10px;">🚀</div>
                <p style="font-size: 0.8rem; font-weight: 600;">البداية الموفقة</p>
            </div>
            <div class="card" style="text-align: center; padding: 15px;">
                <div style="font-size: 2rem; margin-bottom: 10px;">🔥</div>
                <p style="font-size: 0.8rem; font-weight: 600;">أسبوع كامل</p>
            </div>
            <div class="card" style="text-align: center; padding: 15px;">
                <div style="font-size: 2rem; margin-bottom: 10px;">🧠</div>
                <p style="font-size: 0.8rem; font-weight: 600;">حل الألغاز</p>
            </div>
        </div>
    </div>
</body>
</html>
