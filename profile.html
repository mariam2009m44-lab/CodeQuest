<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>ملفي</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <style>
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 100px; }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { color: #00e5ff; text-decoration: none; font-weight: bold; }
        .profile-card { background: rgba(10, 25, 47, 0.8); border: 1px solid rgba(0,229,255,0.2); border-radius: 30px; padding: 40px 20px; width: 100%; max-width: 400px; text-align: center; box-sizing: border-box;}
        .avatar-wrapper { width: 120px; height: 120px; margin: 0 auto 20px; border-radius: 50%; padding: 5px; background: linear-gradient(45deg, #00e5ff, #8b5cf6); }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; background: #111; object-fit: cover;}
        .stats { display: flex; justify-content: space-around; margin-top: 20px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; }
        .stat h3 { margin: 0; font-size: 0.9rem; color: #aaa; } .stat p { margin: 5px 0 0; color: #ffd700; font-size: 1.5rem; font-weight: bold; }
        .btn-logout { margin-top: 20px; width: 100%; padding: 15px; border-radius: 15px; background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid #ff4444; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.95); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; }
        .nav-btn { color: #667; text-decoration: none; display: flex; flex-direction: column; align-items: center; width: 60px; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; }
        .nav-btn.active { color: #00e5ff; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h2>ملفي</h2></div>
    <div class="profile-card">
        <div class="avatar-wrapper"><img src="cody-avatar.svg" id="userAvatar"></div>
        <h2 id="userName" style="margin:0;">جاري التحميل...</h2>
        <div class="stats">
            <div class="stat"><h3>النقاط</h3><p id="userPts">0</p></div>
            <div class="stat"><h3>المستوى</h3><p>1</p></div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()">تسجيل الخروج</button>
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn active"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const av = localStorage.getItem('cq_avatar'); if(av) document.getElementById('userAvatar').src = av;
            Auth.init(async (logged) => {
                if (!logged) return window.location.href = 'index.html';
                const doc = await firebase.firestore().collection('users').doc(Auth.getUserId()).get();
                if (doc.exists) {
                    document.getElementById('userName').innerText = doc.data().username || "بطل";
                    document.getElementById('userPts').innerText = doc.data().points || 0;
                    if(doc.data().avatar) { document.getElementById('userAvatar').src = doc.data().avatar; localStorage.setItem('cq_avatar', doc.data().avatar); }
                }
            });
        });
    </script>
</body></html>
