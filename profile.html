<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>ملفي | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .header { width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; backdrop-filter: blur(10px); background: rgba(5,9,20,0.5); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,229,255,0.1);}
        .header h1 { margin: 0; font-size: 1.5rem; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,229,255,0.5);}
        .btn-back { background: var(--glass); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; backdrop-filter: blur(5px); font-weight: bold;}
        
        .profile-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px 20px; width: 90%; max-width: 400px; margin-top: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; z-index: 10;}
        .avatar-wrapper { width: 140px; height: 140px; margin: 0 auto 20px; border-radius: 50%; padding: 5px; background: linear-gradient(45deg, #00e5ff, #8b5cf6); box-shadow: 0 0 30px rgba(0,229,255,0.4); }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; background: #111; object-fit: cover;}
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;}
        .stat-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);}
        .stat-box h3 { margin: 0; color: #aaa; font-size: 0.9rem; font-weight: normal;}
        .stat-box p { margin: 5px 0 0; color: var(--gold); font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px rgba(255,215,0,0.3);}
        
        .btn-logout { background: rgba(255, 68, 68, 0.1); color: #ff4444; border: 1px solid #ff4444; padding: 15px; border-radius: 15px; width: 100%; margin-top: 30px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem;}
        .btn-logout:hover { background: #ff4444; color: #fff; box-shadow: 0 0 20px rgba(255,68,68,0.5);}
    </style>
</head>
<body>

    <!-- Matrix Background -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.createElement('canvas');
            canvas.id = 'matrix-canvas';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.zIndex = '-1';
            canvas.style.opacity = '0.15';
            document.body.prepend(canvas);

            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = '01JSletconstifelseforwhilefunction(){}[]=>'.split('');
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;

            function draw() {
                ctx.fillStyle = 'rgba(5, 9, 20, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00e5ff';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
        });
    </script>

    <div class="header"><h1>👤 الملف الشخصي</h1><a href="languages.html" class="btn-back">← رجوع</a></div>
    
    <div class="profile-card">
        <div class="avatar-wrapper">
            <img src="cody-avatar.svg" id="userAvatar" alt="Avatar">
        </div>
        <h2 style="margin: 0; font-size: 1.8rem; color: #fff;" id="userName">جاري التحميل...</h2>
        <p style="color: #00e5ff; margin: 5px 0 0; font-size: 1rem;">مبرمج طموح 🚀</p>
        
        <div class="stats-grid">
            <div class="stat-box">
                <h3>النقاط (XP)</h3>
                <p id="userPts">0</p>
            </div>
            <div class="stat-box">
                <h3>المستوى</h3>
                <p>1</p>
            </div>
        </div>
        
        <button class="btn-logout" onclick="Auth.logout()">تسجيل الخروج</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const uid = Auth.getUserId();
                
                // جلب الشخصية المحفوظة
                let savedAvatar = localStorage.getItem('cq_avatar');
                if(savedAvatar) document.getElementById('userAvatar').src = savedAvatar;

                const doc = await firebase.firestore().collection('users').doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('userName').innerText = data.username;
                    document.getElementById('userPts').innerText = data.points || 0;
                    if(data.avatar) {
                        document.getElementById('userAvatar').src = data.avatar;
                        localStorage.setItem('cq_avatar', data.avatar);
                    }
                }
            });
        });
    </script>
</body></html>
