<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>ملفي</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script><link rel="stylesheet" href="global.css">
    <style>
        .profile-card { background: var(--glass); padding: 40px 20px; border-radius: 30px; width: 90%; max-width: 400px; margin-top: 20px; text-align: center; }
        .profile-card img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--neon-cyan); margin-bottom: 20px; }
        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-top: 20px; }
        .stat h3 { margin: 0; font-size: 0.9rem; color: #aaa; } .stat p { margin: 5px 0 0; color: var(--gold); font-size: 1.5rem; font-weight: bold; }
        .btn-logout { margin-top: 20px; width: 100%; padding: 15px; border-radius: 15px; background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid #ff4444; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
    </style>
</head><body>
    <div class="header"><a href="languages.html" class="btn-back">رجوع</a><h1>ملفي</h1></div>
    <div class="profile-card">
        <img src="cody-avatar.svg" id="userAvatar">
        <h2 id="userName">جاري التحميل...</h2>
        <div class="stats"><div class="stat"><h3>النقاط</h3><p id="userPts">0</p></div><div class="stat"><h3>المستوى</h3><p>1</p></div></div>
        <button class="btn-logout" onclick="Auth.logout()">تسجيل الخروج</button>
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn active"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const av = localStorage.getItem('cq_avatar'); if(av) document.getElementById('userAvatar').src = av;
            Auth.init(async (logged) => {
                if(!logged) return window.location.href = 'index.html';
                const doc = await firebase.firestore().collection('users').doc(Auth.getUserId()).get();
                if(doc.exists) { document.getElementById('userName').innerText = doc.data().username; document.getElementById('userPts').innerText = doc.data().points || 0; }
            });
        });
    </script>

<script>
    // كود عرض النقاط الحقيقية في الواجهة
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (window.Auth && Auth.getUserData()) {
                const points = Auth.getUserData().points || 0;
                // بندور على أي عنصر فيه كلمة "رصيدك" أو "0" ونغيره
                let el = document.getElementById('pointsDisplay');
                if(!el) {
                    // لو مفيش ID، هنكريت شارة صغيرة فوق الشمال تبان في كل الصفحات
                    el = document.createElement('div');
                    el.style.cssText = 'position:fixed; top:15px; left:15px; background:#FFD700; color:#000; padding:8px 15px; border-radius:20px; font-weight:bold; z-index:9999; font-family:Cairo, sans-serif; box-shadow: 0 4px 15px rgba(255,215,0,0.3);';
                    document.body.appendChild(el);
                }
                el.innerHTML = `⭐ رصيدك: ${points} XP`;
            }
        }, 1000); // نستنى ثانية عشان Firebase يحمل الداتا
    });
</script>
    <script src="global.js"></script>
</body>
</html>
