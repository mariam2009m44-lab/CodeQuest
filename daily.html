<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التحدي اليومي | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #050914; padding: 20px; }
        .challenge-card { background: var(--glass); border: 2px solid var(--gold); border-radius: 25px; padding: 40px 20px; text-align: center; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .icon { font-size: 4rem; margin-bottom: 20px; text-shadow: 0 0 20px var(--gold); }
        .btn-claim { background: linear-gradient(135deg, var(--gold), #ff8c00); color: #000; border: none; padding: 15px; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; width: 100%; cursor: pointer; margin-top: 20px; display: none; box-shadow: 0 4px 15px rgba(255,215,0,0.4); transition: 0.3s; }
        .btn-claim:hover { transform: scale(1.05); }
        .btn-back { margin-top: 20px; color: var(--text-muted); text-decoration: none; font-weight: bold; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <div class="challenge-card">
        <div class="icon">⚡</div>
        <h1 style="color:var(--gold); margin:0 0 10px;">التحدي اليومي</h1>
        <p style="color:var(--text-muted); margin-bottom:30px;">أجب على السؤال لتحصل على 50 نقطة!</p>
        
        <div id="quizArea" style="display:none;">
            <h2 style="margin-bottom:20px; font-size:1.5rem;">كم يساوي: <strong>10 / 2</strong> ؟</h2>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" style="flex:1; background:#1e1e1e; color:#fff; border:1px solid #444;" onclick="answer(10)">10</button>
                <button class="btn-primary" style="flex:1; background:#1e1e1e; color:#fff; border:1px solid #444;" onclick="answer(5)">5</button>
            </div>
        </div>
        
        <p id="statusMsg" style="color:var(--text-muted); font-weight:bold; margin-top:20px;"></p>
        <button class="btn-claim" id="claimBtn" onclick="claimReward()">احصل على المكافأة 🎁</button>
    </div>
    <a href="dashboard.html" class="btn-back">← العودة للوحة التحكم</a>

    <script>
        const today = new Date().toDateString();
        let isCorrect = false;
        let userRef = null;

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'login.html'; return; }
                
                const uid = Auth.getUserId();
                userRef = firebase.firestore().collection('users').doc(uid);
                
                try {
                    const doc = await userRef.get();
                    const lastDate = doc.data().lastDailyDate;
                    
                    if(lastDate === today) {
                        document.getElementById('statusMsg').innerText = "لقد حصلت على مكافأتك اليوم! عد غداً 🌟";
                        document.getElementById('statusMsg').style.color = "var(--primary)";
                    } else {
                        document.getElementById('quizArea').style.display = 'block';
                    }
                } catch(e) {
                    console.error(e);
                    document.getElementById('statusMsg').innerText = "حدث خطأ في تحميل البيانات.";
                }
            });
        });

        function answer(val) {
            if(val === 5) {
                isCorrect = true;
                document.getElementById('quizArea').style.display = 'none';
                document.getElementById('statusMsg').innerText = "إجابة صحيحة! أنت رائع.";
                document.getElementById('statusMsg').style.color = "var(--success)";
                document.getElementById('claimBtn').style.display = 'block';
            } else {
                alert("إجابة خاطئة! حاول مرة أخرى.");
            }
        }

        async function claimReward() {
            if(!isCorrect || !userRef) return;
            
            document.getElementById('claimBtn').innerText = "جاري التحقق...";
            document.getElementById('claimBtn').disabled = true;

            try {
                // استخدام Transaction لمنع الغش نهائياً
                await firebase.firestore().runTransaction(async (transaction) => {
                    const doc = await transaction.get(userRef);
                    const data = doc.data();
                    
                    // التحقق مرة أخرى داخل الـ Transaction (عشان لو فتح الصفحة في تابين)
                    if (data.lastDailyDate === today) {
                        throw new Error("ALREADY_CLAIMED");
                    }

                    // تحديث النقاط والتاريخ بشكل آمن
                    transaction.update(userRef, {
                        coins: firebase.firestore.FieldValue.increment(50),
                        lastDailyDate: today
                    });
                });
                
                // لو نجح الـ Transaction
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
                alert("🎉 مبروك! حصلت على 50 عملة.");
                window.location.href = 'dashboard.html';

            } catch (e) {
                if (e.message === "ALREADY_CLAIMED") {
                    alert("❌ لقد حصلت على المكافأة بالفعل اليوم!");
                } else {
                    alert("❌ حدث خطأ، حاول مرة أخرى.");
                    console.error(e);
                }
                window.location.reload(); // إعادة تحميل الصفحة لتحديث الحالة
            }
        }
    </script>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="games.html" class="mobile-nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
