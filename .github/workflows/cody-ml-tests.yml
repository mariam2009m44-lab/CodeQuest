name: Cody ML Engine Tests

on:
  push:
    paths:
      - "cody-ml-engine/**"
      - ".github/workflows/cody-ml-tests.yml"
  pull_request:
    paths:
      - "cody-ml-engine/**"
      - ".github/workflows/cody-ml-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run Cody ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cody-ml-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cody-ml-engine/requirements.txt

      - name: Run tests
        run: |
          python -m pytest cody-ml-engine/tests -v