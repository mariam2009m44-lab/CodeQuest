name: Project regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            CodeQuest/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix CodeQuest
      - run: npm run build --prefix CodeQuest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            cody-ml-engine/requirements.txt
      - run: pip install -r backend/requirements.txt -r cody-ml-engine/requirements.txt
      - run: python -m pytest backend/tests cody-ml-engine/tests -q