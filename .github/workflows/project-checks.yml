
name: Project regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CodeQuest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase Functions syntax
        run: node --check functions/index.js

      - name: Check frontend module syntax
        run: |
          node --input-type=module --check < js/auth.js
          node --input-type=module --check < js/code-runner.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            cody-ml-engine/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r cody-ml-engine/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests cody-ml-engine/tests -q
