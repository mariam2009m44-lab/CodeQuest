name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codequest-firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODEQUEST }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_CODEQUEST repository secret before deploying."
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODEQUEST }}

      - name: Deploy Firebase Functions
        run: |
          npx --yes firebase-tools@15.37.0 deploy \
            --only functions \
            --project codequest-6350a \
            --non-interactive
