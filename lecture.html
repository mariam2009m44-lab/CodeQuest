<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | Cody Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="stylesheet" href="css/style.css?v=ultimate3">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="levels.html" class="nav-item active"><i class="ri-map-2-line"></i> مسار التعلم</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
                <a href="shop.html" class="nav-item"><i class="ri-shopping-bag-3-line"></i> المتجر</a>
                <a href="profile.html" class="nav-item"><i class="ri-user-smile-line"></i> حسابي</a>
                <a href="index.html" class="nav-item logout"><i class="ri-logout-box-r-line"></i> خروج</a>
            </nav>
        </aside>
        <main class="main-content" style="display: flex; flex-direction: column;">
            <div class="workspace">
                <div class="lecture-panel">
                    <div class="cody-bubble">
                        <div class="cody-avatar"><i class="ri-robot-2-fill"></i></div>
                        <div class="cody-text">
                            <h3 id="lessonTitle">جاري التحميل...</h3>
                            <p id="codyDesc"></p>
                        </div>
                    </div>
                    <div class="task-box">
                        <h4><i class="ri-lightbulb-line"></i> تلميح من كودي</h4>
                        <p>جرب تعديل الكود بنفسك وشغله عشان تشوف النتيجة. التعلم بالممارسة هو الأفضل!</p>
                    </div>
                </div>
                <div class="editor-panel">
                    <div class="editor-header">
                        <span id="fileNameDisplay">main.js</span>
                        <button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.9rem;" onclick="runUserCode()"><i class="ri-play-fill"></i> تشغيل</button>
                    </div>
                    <textarea id="codeEditor"></textarea>
                    <div class="terminal-panel">
                        <div class="terminal-header">
                            <div class="dot" style="background: #FF6B6B;"></div>
                            <div class="dot" style="background: #FFCB57;"></div>
                            <div class="dot" style="background: #35D6A3;"></div>
                        </div>
                        <div id="terminalOutput" class="terminal-output">> Console Ready...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script type="module">
        import { App } from './js/app.js';
        import { curriculum } from './js/curriculum.js';
        
        App.init();

        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'javascript';
        const chIdx = parseInt(urlParams.get('chapter')) || 0;
        const lsIdx = parseInt(urlParams.get('lesson')) || 0;
        
        const lessonData = curriculum[lang][chIdx].lessons[lsIdx];
        document.getElementById('lessonTitle').innerText = lessonData.title;
        document.getElementById('codyDesc').innerText = lessonData.desc;
        
        const ext = lang === 'python' ? '.py' : (lang === 'cpp' ? '.cpp' : '.js');
        document.getElementById('fileNameDisplay').innerText = 'main' + ext;

        const mode = lang === 'python' ? 'python' : (lang === 'cpp' ? 'text/x-c++src' : 'javascript');
        
        var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), { 
            lineNumbers: true, 
            theme: "dracula", 
            mode: mode,
            autoCloseBrackets: true
        });
        editor.setValue(lessonData.code || '// اكتب الكود هنا');
        
        window.runUserCode = () => {
            const code = editor.getValue();
            const out = document.getElementById('terminalOutput');
            out.innerHTML = '> جاري التشغيل...';
            
            if (lang === 'javascript') {
                let logs = [];
                const origLog = console.log;
                console.log = (...args) => logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '));
                try {
                    new Function(code)();
                    console.log = origLog;
                    out.innerHTML = logs.length ? logs.map(l => `> ${l}`).join('<br>') : '> Execution completed.';
                    App.addXP(10);
                } catch (e) {
                    console.log = origLog;
                    out.innerHTML = `<span style="color:#FB7185;">> Error: ${e.message}</span>`;
                }
            } else if (lang === 'python') {
                const encodeB64 = (str) => btoa(unescape(encodeURIComponent(str)));
                const decodeB64 = (str) => decodeURIComponent(escape(atob(str)));
                fetch('https://ce.judge0.com/submissions?base64_encoded=true&wait=true', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source_code: encodeB64(code), language_id: 71 })
                }).then(res => res.json()).then(data => {
                    let txt = '';
                    if(data.stdout) txt += decodeB64(data.stdout);
                    if(data.stderr) txt += `<span style="color:#FB7185;">${decodeB64(data.stderr)}</span>`;
                    if(data.compile_output) txt += `<span style="color:#FB7185;">${decodeB64(data.compile_output)}</span>`;
                    out.innerHTML = txt || '> Execution completed.';
                    if(txt) App.addXP(15);
                }).catch(err => {
                    out.innerHTML = `<span style="color:#FB7185;">> Network Error: ${err.message}</span>`;
                });
            } else {
                out.innerHTML = '> تشغيل C++ يتطلب سيرفر خارجي. (Placeholder)';
            }
        };
    </script>
</body>
</html>
