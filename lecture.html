<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | Cody Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="languages.html" class="nav-item active"><i class="ri-map-2-line"></i> المسارات</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="profile.html" class="nav-item"><i class="ri-user-smile-line"></i> حسابي</a>
                <a href="#" class="nav-item logout"><i class="ri-logout-box-r-line"></i> خروج</a>
            </nav>
        </aside>
        <main class="main-content" style="display: flex; flex-direction: column;">
            <div class="workspace">
                <div class="lecture-panel glass-card">
                    <div class="cody-bubble">
                        <div class="cody-avatar"><i class="ri-robot-2-fill"></i></div>
                        <div class="cody-text">
                            <h3 id="lessonTitle">جاري التحميل...</h3>
                            <p id="codyDesc"></p>
                        </div>
                    </div>
                    <div class="task-box">
                        <h4><i class="ri-lightbulb-line"></i> تلميح من كودي</h4>
                        <p>جرب تعديل الكود بنفسك وشغله عشان تشوف النتيجة.</p>
                    </div>
                </div>
                <div class="editor-panel">
                    <div class="editor-header">
                        <span id="fileNameDisplay">main.py</span>
                        <button class="btn-dark-primary" style="padding: 8px 16px; font-size: 0.9rem;" onclick="runCode()"><i class="ri-play-fill"></i> تشغيل</button>
                    </div>
                    <textarea id="codeEditor"></textarea>
                    <div class="terminal-panel">
                        <div class="terminal-header">
                            <div class="dot" style="background: #FF6B6B;"></div>
                            <div class="dot" style="background: #FFCB57;"></div>
                            <div class="dot" style="background: #35D6A3;"></div>
                        </div>
                        <div id="terminalOutput" class="terminal-output">> Console Ready...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script type="module">
        import { App } from './js/app.js';
        import { readSelection, getLesson } from './js/curriculum.js';

        await App.init();
        const { language } = readSelection();
        const lesson = getLesson(readSelection());
        
        document.getElementById('lessonTitle').innerText = lesson.title;
        document.getElementById('codyDesc').innerText = lesson.cody_intro || lesson.desc;
        
        const ext = language === 'python' ? '.py' : (language === 'cpp' ? '.cpp' : '.js');
        document.getElementById('fileNameDisplay').innerText = 'main' + ext;

        const mode = language === 'python' ? 'python' : (language === 'cpp' ? 'text/x-c++src' : 'javascript');
        
        var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), { 
            lineNumbers: true, theme: "dracula", mode: mode, autoCloseBrackets: true
        });
        editor.setValue(lesson.code || '// اكتب الكود هنا');
        
        window.runCode = () => {
            const out = document.getElementById('terminalOutput');
            out.innerHTML = '> جاري التشغيل (يتطلب خادم آمن)...';
        };
    </script>
</body>
</html>
