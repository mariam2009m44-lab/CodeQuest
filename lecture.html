<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="levels.html" class="nav-item active"><i class="ri-map-2-line"></i> مسار التعلم</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
            </nav>
        </aside>
        <main class="main-content" style="display: flex; flex-direction: column;">
            <div class="workspace">
                <div class="panel" style="background: var(--dark-card); border: 1px solid var(--dark-border);">
                    <div style="padding: 25px;">
                        <h2 style="color: #06B6D4; margin-bottom: 15px;">كودي يقول:</h2>
                        <p style="font-size: 1.1rem; line-height: 1.8;">أهلاً بك! المتغيرات هي صناديق تخزين البيانات. في JavaScript نستخدم <code>let</code> لإنشاء متغير.</p>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header">
                        <span>main.js</span>
                        <button style="background: #8B5CF6; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer;">تشغيل</button>
                    </div>
                    <textarea id="code"></textarea>
                    <div class="terminal">> Console Ready...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            lineNumbers: true, theme: "dracula", mode: "javascript"
        });
        editor.setValue("let name = 'Cody';\nconsole.log('Hello ' + name);");
    </script>
</body>
</html>
