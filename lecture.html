<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة التفاعلية | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <style>
        body { background: var(--bg-deep); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .progress-bar-container { width: 100%; height: 6px; background: var(--border-soft); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent-purple)); width: 0%; transition: width 0.5s ease; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .content-side { width: 45%; padding: var(--space-l); overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-l); border-left: 1px solid var(--border-soft); }
        .editor-side { width: 55%; display: flex; flex-direction: column; background: #1E1E24; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-s); }
        .header-nav h1 { font-size: 1.5rem; color: var(--text-primary); }
        .cody-box { display: flex; gap: 15px; }
        .cody-avatar { width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), var(--accent-purple)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: white; flex-shrink: 0; box-shadow: 0 0 20px rgba(0, 217, 255, 0.3); }
        .cody-bubble { background: var(--bg-panel); border: 1px solid var(--border-soft); padding: var(--space-m); border-radius: var(--radius-card); border-top-right-radius: 0; }
        .cody-bubble h3 { color: var(--primary); margin-bottom: 8px; font-size: 1.2rem; }
        .cody-bubble p { color: var(--text-secondary); line-height: 1.8; font-size: 1.1rem; }
        .task-box { background: rgba(255, 159, 67, 0.1); border: 1px solid var(--accent-orange); border-radius: var(--radius-card); padding: var(--space-m); }
        .task-box h4 { color: var(--accent-orange); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .task-box p { color: var(--text-primary); line-height: 1.6; }
        .hints-box { margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--accent-orange); }
        .hints-box ul { padding-right: 20px; color: var(--text-secondary); font-size: 0.95rem; }
        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .editor-header { padding: 12px 20px; background: #111; display: flex; justify-content: space-between; align-items: center; color: #A8B5D9; font-family: var(--font-code); }
        .editor-controls { display: flex; gap: 10px; }
        .CodeMirror { flex: 1; height: 100% !important; font-family: var(--font-code); font-size: 15px; direction: ltr; }
        .terminal-container { height: 180px; background: #000; display: flex; flex-direction: column; border-top: 1px solid #333; }
        .terminal-header { padding: 8px 15px; background: #111; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-output { flex: 1; padding: 15px; color: var(--accent-green); font-family: var(--font-code); font-size: 14px; direction: ltr; overflow-y: auto; white-space: pre-wrap; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(5, 11, 31, 0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .quiz-modal { background: var(--bg-panel); border: 2px solid var(--primary); border-radius: var(--radius-card); padding: var(--space-l); max-width: 500px; width: 100%; text-align: center; box-shadow: 0 0 50px rgba(0, 217, 255, 0.2); }
        .quiz-modal h2 { color: var(--text-primary); margin-bottom: var(--space-l); }
        .quiz-option { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: var(--bg-deep); border: 1px solid var(--border-soft); border-radius: var(--radius-button); color: var(--text-primary); font-family: var(--font-arabic); font-size: 1.1rem; cursor: pointer; transition: 0.2s; text-align: right; }
        .quiz-option:hover { border-color: var(--primary); }
        .quiz-option.selected { background: rgba(0, 217, 255, 0.1); border-color: var(--primary); }
        @media (max-width: 900px) { .main-layout { flex-direction: column; overflow-y: auto; } .content-side, .editor-side { width: 100%; height: auto; } .editor-side { min-height: 500px; } }
    </style>
</head>
<body>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="main-layout">
        <div class="content-side">
            <div class="header-nav">
                <a href="levels.html" class="btn-secondary" style="padding: 6px 12px; min-height: 36px;"><i class="ri-arrow-right-line"></i> رجوع</a>
                <h1 id="lessonTitle">جاري التحميل...</h1>
            </div>
            <div class="cody-box">
                <div class="cody-avatar"><i class="ri-robot-2-fill"></i></div>
                <div class="cody-bubble">
                    <h3>كودي يقول:</h3>
                    <p id="codyIntro"></p>
                </div>
            </div>
            <div class="task-box">
                <h4><i class="ri-focus-3-line"></i> المهمة المطلوبة</h4>
                <p id="lessonTask"></p>
                <div class="hints-box">
                    <p style="color: var(--accent-orange); font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;">تلميحات:</p>
                    <ul id="lessonHints"></ul>
                </div>
            </div>
            <div class="actions">
                <button class="btn-primary" style="font-size: 1.2rem; padding: 16px;" onclick="showQuiz()"><i class="ri-check-double-line"></i> جاهز للاختبار</button>
            </div>
        </div>
        <div class="editor-side">
            <div class="editor-header">
                <span id="fileNameDisplay">main.js</span>
                <div class="editor-controls">
                    <button class="btn-secondary" style="padding: 6px 12px; min-height: 32px; font-size: 0.85rem;" onclick="resetCode()"><i class="ri-refresh-line"></i> مسح</button>
                    <button class="btn-primary" style="padding: 6px 12px; min-height: 32px; font-size: 0.85rem;" onclick="runUserCode()"><i class="ri-play-fill"></i> تشغيل</button>
                </div>
            </div>
            <textarea id="codeEditor"></textarea>
            <div class="terminal-container">
                <div class="terminal-header">
                    <div class="dot" style="background: #FF6B6B;"></div>
                    <div class="dot" style="background: #FFCB57;"></div>
                    <div class="dot" style="background: #35D6A3;"></div>
                </div>
                <div id="terminalOutput" class="terminal-output">> Console Ready...</div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="quizModal">
        <div class="quiz-modal">
            <h2 id="quizQuestion">السؤال هنا؟</h2>
            <div id="quizOptions"></div>
            <button class="btn-primary" style="width: 100%; margin-top: 15px; display: none;" id="submitQuizBtn" onclick="submitQuiz()">تأكيد الإجابة</button>
            <div id="quizFeedback" style="margin-top: 15px; font-size: 1.2rem; font-weight: bold;"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script type="module" src="js/lecture.js"></script>
</body>
</html>
