<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        .cody-box { display: flex; gap: 15px; margin-bottom: 30px; }
        .cody-avatar { width: 50px; height: 50px; background: var(--primary-main); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
        .cody-bubble { background: var(--bg-surface); padding: 20px; border-radius: 16px; border-top-right-radius: 0; border: 1px solid var(--border-light); flex: 1; line-height: 1.8; }
        pre[class*="language-"] { border-radius: var(--radius-md) !important; margin: 0 !important; }
        .code-wrapper { background: #1d1f21; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 30px; }
        .code-header { padding: 10px 15px; background: #2d2f31; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 id="lessonTitle" style="color: var(--text-main);">جاري التحميل...</h2>
            <a href="levels.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> رجوع</a>
        </div>

        <div id="contentArea" style="display: none;">
            <div class="cody-box">
                <div class="cody-avatar"><i class="ri-robot-2-line"></i></div>
                <div class="cody-bubble" id="codyText"></div>
            </div>

            <div class="code-wrapper">
                <div class="code-header">
                    <span style="color: #a0aec0; font-family: var(--font-code); font-size: 0.85rem;">main.code</span>
                    <button onclick="goToPlayground()" class="btn btn-primary" style="padding: 4px 12px; font-size: 0.8rem; min-height: 30px;"><i class="ri-play-line"></i> جرب الكود</button>
                </div>
                <pre><code class="language-javascript" id="codeBlock"></code></pre>
            </div>

            <button onclick="nextLesson()" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem;">الدرس التالي <i class="ri-arrow-left-line"></i></button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chapterIdx = parseInt(urlParams.get('chapter')) || 0;
        let lessonIdx = parseInt(urlParams.get('lesson')) || 0;
        
        const lang = sessionStorage.getItem('selectedLang') || 'javascript';
        const files = { javascript: 'js_curriculum.json', python: 'python_curriculum.json', cpp: 'cpp_curriculum.json' };
        const prismLang = { javascript: 'javascript', python: 'python', cpp: 'cpp' };

        let currentData = null;
        let currentLesson = null;

        async function loadLesson() {
            try {
                const res = await fetch(files[lang]);
                currentData = await res.json();
                
                const chapter = currentData.chapters[chapterIdx];
                currentLesson = chapter.lessons[lessonIdx];

                document.getElementById('lessonTitle').innerText = chapter.title;
                document.getElementById('codyText').innerHTML = currentLesson.concept;
                
                const codeBlock = document.getElementById('codeBlock');
                codeBlock.className = `language-${prismLang[lang]}`;
                codeBlock.textContent = currentLesson.code;
                Prism.highlightElement(codeBlock);

                document.getElementById('contentArea').style.display = 'block';
            } catch (e) {
                document.getElementById('lessonTitle').innerText = "خطأ في تحميل الدرس";
            }
        }

        function goToPlayground() {
            sessionStorage.setItem('playgroundCode', currentLesson.code);
            sessionStorage.setItem('playgroundLang', lang);
            window.location.href = 'playground.html';
        }

        function nextLesson() {
            const chapter = currentData.chapters[chapterIdx];
            if (lessonIdx < chapter.lessons.length - 1) {
                lessonIdx++;
                window.location.href = `lecture.html?chapter=${chapterIdx}&lesson=${lessonIdx}`;
            } else if (chapterIdx < currentData.chapters.length - 1) {
                window.location.href = `lecture.html?chapter=${chapterIdx + 1}&lesson=0`;
            } else {
                alert('أكملت هذا المسار!');
                window.location.href = 'levels.html';
            }
        }

        loadLesson();
    </script>
</body>
</html>
