<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>بناء الكود</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        .game-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; width: 100%; max-width: 800px; margin: 0 auto; box-sizing: border-box; }
        .task { background: rgba(244,114,182,0.1); border: 1px solid #f472b6; padding: 15px; border-radius: 15px; text-align: center; }
        .editor { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        @media(min-width: 600px) { .editor { flex-direction: row; } }
        textarea { flex: 1; background: #1e1e1e; color: #00ff00; border: 1px solid #444; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 1.1rem; resize: none; direction: ltr; }
        .console { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: monospace; color: #ccc; overflow-y: auto; direction: ltr; }
        .btn-run { background: #10b981; color: #fff; border: none; padding: 15px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head><body>
    <div class="header"><a href="games.html" class="btn-back">رجوع</a><h1>🏗️ بناء الكود</h1></div>
    <div class="game-area">
        <div class="task">المهمة: اكتب كود يطبع الجملة <strong>"I am a coder"</strong></div>
        <div class="editor">
            <textarea id="codeInput" placeholder="// اكتب الكود هنا..."></textarea>
            <div class="console" id="console">> Output...</div>
        </div>
        <button class="btn-run" onclick="runAndCheck()">▶ تشغيل وفحص</button>
    </div>
    <script>
        function runAndCheck() {
            const code = document.getElementById('codeInput').value;
            const output = document.getElementById('console'); output.innerHTML = '> Running...<br>';
            let oldLog = console.log; let hasOutput = false;
            console.log = function(...args) { output.innerHTML += `> ${args.join(' ')}<br>`; if(args.join(' ').includes('I am a coder')) hasOutput = true; oldLog(...args); };
            try { eval(code); } catch(e) { output.innerHTML += `<span style="color:#ff4444;">❌ ${e.message}</span>`; } finally { console.log = oldLog; }
            if(hasOutput) { confetti({ particleCount: 150 }); setTimeout(claim, 1000); }
            else { output.innerHTML += `<br><span style="color:#ffd700;">⚠️ الكود لم يطبع الجملة المطلوبة.</span>`; }
        }
        async function claim() {
            const uid = Auth.getUserId();
            if(uid) { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(50) }); }
            alert("🎉 ممتاز! +50 نقطة"); window.location.href = 'games.html';
        }
        Auth.init((l) => { if(!l) window.location.href = 'index.html'; });
    </script>
</body></html>
