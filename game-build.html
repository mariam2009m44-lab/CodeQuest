<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بناء الكود | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; }
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: #ec4899; font-size: 1.3rem; }
        .game-area { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        .task { background: rgba(236,72,153,0.1); border: 1px solid #ec4899; padding: 15px; border-radius: 15px; text-align: center; font-size: 1.1rem;}
        .editor { display: flex; flex-direction: column; gap: 10px; height: 300px; }
        @media(min-width: 600px) { .editor { flex-direction: row; } }
        textarea { flex: 1; background: #1e1e1e; color: #00ff00; border: 1px solid #444; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 1.1rem; resize: none; direction: ltr; outline:none;}
        .console { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: monospace; color: #ccc; overflow-y: auto; direction: ltr; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <div class="header"><a href="games.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">← رجوع</a><h1>🏗️ بناء الكود</h1><div style="width:50px;"></div></div>
    <div class="game-area">
        <div class="task">المهمة: اكتب كود يطبع الجملة <strong style="color:#ec4899;">"I am a coder"</strong></div>
        <div class="editor">
            <textarea id="codeInput" placeholder="// اكتب الكود هنا..."></textarea>
            <div class="console" id="console">> Output...</div>
        </div>
        <button class="btn btn-primary" style="background:#ec4899; color:#fff;" onclick="runAndCheck()">▶ تشغيل وفحص</button>
    </div>
    <div class="bottom-nav"><a href="dashboard.html"><i class="ri-home-4-line"></i> الرئيسية</a><a href="games.html" class="active"><i class="ri-gamepad-line"></i> الألعاب</a><a href="profile.html"><i class="ri-user-3-line"></i> ملفي</a></div>
    <script>
        function runAndCheck() {
            const code = document.getElementById('codeInput').value;
            const output = document.getElementById('console'); output.innerHTML = '> Running...<br>';
            let oldLog = console.log; let hasOutput = false;
            console.log = function(...args) { output.innerHTML += `> ${args.join(' ')}<br>`; if(args.join(' ').includes('I am a coder')) hasOutput = true; oldLog(...args); };
            try { eval(code); } catch(e) { output.innerHTML += `<span style="color:#ff4444;">❌ ${e.message}</span>`; } finally { console.log = oldLog; }
            if(hasOutput) { confetti({ particleCount: 150 }); setTimeout(claim, 1000); }
            else { output.innerHTML += `<br><span style="color:#ffd700;">⚠️ الكود لم يطبع الجملة المطلوبة بدقة.</span>`; }
        }
        async function claim() {
            const uid = Auth.getUserId();
            if(uid) { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(50) }); }
            alert("🎉 ممتاز! +50 نقطة"); window.location.href = 'games.html';
        }
        Auth.init((l) => { if(!l) window.location.href = 'login.html'; });
    </script>

    
    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="games.html" class="mobile-nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body></html>
