<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | بناء الكود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;text-align:center;}
.slot{background:rgba(255,255,255,0.05);min-height:80px;border:2px dashed #27ae60;border-radius:15px;padding:10px;max-width:400px;margin:20px auto;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}
.pool{display:flex;flex-wrap:wrap;gap:10px;max-width:400px;margin:auto;justify-content:center;}
.piece{background:#1e293b;padding:10px 15px;border-radius:10px;font-family:monospace;cursor:pointer;}
.piece:hover{background:#27ae60;}
</style>
</head>
<body>
<h1 style="color:#27ae60;">🏗️ بناء الكود</h1>
<p>رتب الأسطر عشان تكتب: <code style="color:#ffd700;">let x = 10;</code></p>
<div class="slot" id="slot"></div>
<div class="pool" id="pool"></div>
<script>
const correct = ['let', 'x', '=', '10;'];
let build = [], score = 0;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => { if(!logged) window.location.href = 'index.html'; else init(); });
});

function init() {
    const pool = document.getElementById('pool');
    [...correct].sort(() => Math.random() - 0.5).forEach(p => {
        const el = document.createElement('div');
        el.className = 'piece';
        el.innerText = p;
        el.onclick = () => { build.push(p); el.remove(); render(); check(); };
        pool.appendChild(el);
    });
}

function render() {
    const slot = document.getElementById('slot');
    slot.innerHTML = build.map(b => `<span class="piece">${b}</span>`).join('');
}

async function check() {
    if(build.length !== correct.length) return;
    if(JSON.stringify(build) === JSON.stringify(correct)) {
        score = 50;
        try { playSound('success'); confetti({ particleCount: 200 }); } catch(e){}
        alert('🎉 صح! الكود سليم وكسبت 50 نقطة!');
        const uid = Auth.getUserId();
        if(uid) {
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(50) });
        }
        setTimeout(() => window.location.href = 'games.html', 1500);
    } else {
        try { playSound('error'); } catch(e){}
        alert('❌ الترتيب غلط، جرب تاني!');
        setTimeout(() => location.reload(), 1000);
    }
}
</script>
</body></html>
