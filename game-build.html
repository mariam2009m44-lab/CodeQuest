<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازل الأكواد | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(13, 20, 40, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #8892b0; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(118,233,192,0.08), transparent 50%); }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 800; transition: 0.3s; }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-weight: 900; color: var(--gold); }
    .screen { display: none; width: 100%; max-width: 650px; }
    .screen.active { display: block; }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px; backdrop-filter: blur(20px); text-align: center; }
    .level-box h2 { margin-bottom: 20px; color: var(--green); }
    .levels-grid { display: flex; flex-direction: column; gap: 12px; }
    .lvl-btn { padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 900; border: 2px solid; background: transparent; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; }
    .lvl-easy { color: var(--green); border-color: var(--green); }
    .lvl-med { color: var(--gold); border-color: var(--gold); }
    .lvl-hard { color: var(--red); border-color: var(--red); }
    .task { background: rgba(118,233,192,0.1); border: 1px solid var(--green); border-radius: 12px; padding: 12px; text-align: center; font-weight: 800; margin-bottom: 20px; color: var(--green); }
    .drop-zone { display: flex; flex-direction: column; gap: 8px; min-height: 100px; padding: 12px; border: 2px dashed var(--border); border-radius: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.2); }
    .code-block { padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 0.95rem; cursor: grab; transition: 0.2s; direction: ltr; text-align: left; color: var(--cyan); }
    .code-block:hover { border-color: var(--cyan); background: rgba(107,232,255,0.1); }
    .code-block.selected { opacity: 0.4; pointer-events: none; }
    .btn-check { width: 100%; padding: 12px; background: var(--green); color: #000; font-weight: 900; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; font-family: 'Cairo'; }
    .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-emoji { font-size: 4rem; margin-bottom: 10px; }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 15px; }
    @media (max-width: 600px) { .top-nav { flex-direction: column; gap: 10px; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى البازل</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>3 قطع</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>4 قطع</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>5 قطع</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div class="task" id="taskText">المهمة هنا...</div>
      <div class="drop-zone" id="dropZone"></div>
      <div class="drop-zone" id="sourceZone"></div>
      <button class="btn-check" onclick="check()" id="btn" disabled>تحقق من الترتيب</button>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p class="result-message" id="resultMessage"></p>
      <button class="btn-restart" onclick="restartGame()" style="background: var(--cyan); color:#000; border:none; padding:12px 24px; border-radius:10px; font-weight:900; cursor:pointer; font-family:'Cairo'; margin-top:10px;">العب مستوى آخر</button>
      <button class="btn-restart" onclick="window.location.href='games.html'" style="background:transparent; border:1px solid var(--border); color:var(--text); margin-top:10px;">العودة للألعاب</button>
    </div>
  </div>
  <script>
    const puzzles = {
      easy: { task: "رتب الكود لطباعة 'Hello'", correct: ['print("Hello")', 'console.log("Hello")', 'echo "Hello"'], options: ['print("Hello")', 'console.log("Hello")', 'echo "Hello"'] },
      medium: { task: "رتب دالة ترحب بالمستخدم", correct: ['def greet(name):', '    print("Hello " + name)', 'greet("Cody")', 'return True'], options: ['def greet(name):', '    print("Hello " + name)', 'greet("Cody")', 'return True'] },
      hard: { task: "رتب كلاس بسيط للسيارة", correct: ['class Car:', '    def __init__(self, brand):', '        self.brand = brand', '    def display(self):', '        print(self.brand)'], options: ['class Car:', '    def __init__(self, brand):', '        self.brand = brand', '    def display(self):', '        print(self.brand)'] }
    };
    let seq = [], correctSeq = [], score = 0, currentLevel = 'easy';
    const drop = document.getElementById('dropZone'), source = document.getElementById('sourceZone'), btn = document.getElementById('btn'), scoreDisplay = document.getElementById('scoreDisplay'), taskText = document.getElementById('taskText');
    function updateGlobalScore(points) { let total = parseInt(localStorage.getItem('codyTotalScore')) || 0; total += points; localStorage.setItem('codyTotalScore', total); }
    function startGame(level) {
      currentLevel = level; document.getElementById('levelScreen').classList.remove('active'); document.getElementById('resultScreen').classList.remove('active'); document.getElementById('gameScreen').classList.add('active');
      const p = puzzles[level]; correctSeq = p.correct; taskText.textContent = p.task;
      const shuffled = [...p.options].sort(() => Math.random() - 0.5);
      source.innerHTML = ''; drop.innerHTML = ''; seq = []; btn.disabled = true;
      shuffled.forEach(opt => { const el = document.createElement('div'); el.className = 'code-block'; el.textContent = opt; el.onclick = () => select(el, opt); source.appendChild(el); });
    }
    function select(el, code) {
      el.classList.add('selected'); seq.push(code);
      const newEl = document.createElement('div'); newEl.className = 'code-block'; newEl.textContent = code; newEl.onclick = () => remove(newEl, code); drop.appendChild(newEl);
      btn.disabled = seq.length !== correctSeq.length;
    }
    function remove(el, code) {
      const i = seq.indexOf(code);
      if (i > -1) { seq.splice(i, 1); el.remove(); document.querySelectorAll('#sourceZone .code-block').forEach(b => { if (b.textContent.includes(code)) b.classList.remove('selected'); }); btn.disabled = seq.length !== correctSeq.length; }
    }
    function check() {
      if (seq.every((v, i) => v === correctSeq[i])) {
        btn.textContent = 'أحسنت! 🎉'; btn.style.background = 'var(--cyan)'; btn.disabled = true;
        score += 50; scoreDisplay.textContent = score; updateGlobalScore(50);
        drop.style.borderColor = 'var(--green)'; drop.style.background = 'rgba(118,233,192,0.1)';
        setTimeout(() => {
          document.getElementById('gameScreen').classList.remove('active');
          document.getElementById('resultScreen').classList.add('active');
          document.getElementById('resultEmoji').textContent = '🏆';
          document.getElementById('resultTitle').textContent = 'رائع! لقد حللت البازل!';
          document.getElementById('resultMessage').textContent = `لقد جمعت ${score} نقطة.`;
        }, 800);
      } else { btn.textContent = 'خطأ، حاول مجدداً!'; btn.style.background = 'var(--red)'; setTimeout(() => { btn.textContent = 'تحقق من الترتيب'; btn.style.background = 'var(--green)'; }, 1500); }
    }
    function restartGame() { document.getElementById('resultScreen').classList.remove('active'); document.getElementById('levelScreen').classList.add('active'); }
  </script>
</body>
</html>
