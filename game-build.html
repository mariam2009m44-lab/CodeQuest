<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بناء الكود | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); }
        .header h1 { margin: 0; font-size: 1.3rem; color: #f472b6; }
        .btn-back { background: rgba(244,114,182,0.1); border: 1px solid #f472b6; color: #f472b6; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; max-width: 800px; margin: 0 auto; width: 100%; }
        .task-box { background: rgba(244,114,182,0.1); border: 1px solid #f472b6; padding: 15px; border-radius: 15px; text-align: center; font-size: 1.1rem; }
        
        .editor-container { flex: 1; display: flex; gap: 15px; flex-direction: column; }
        @media(min-width: 600px) { .editor-container { flex-direction: row; } }
        
        .code-input { flex: 1; background: #1e1e1e; color: #00ff00; border: 1px solid #444; border-radius: 10px; padding: 15px; font-family: 'Courier New', monospace; font-size: 1.1rem; resize: none; direction: ltr; text-align: left; outline: none; }
        .console-output { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: 'Courier New', monospace; font-size: 1rem; color: #ccc; overflow-y: auto; direction: ltr; text-align: left; }
        
        .controls { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .btn-run { background: #28a745; color: #fff; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,9,20,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid #ffd700; padding: 40px; border-radius: 30px; text-align: center; }
        .btn-claim { background: #f472b6; color: #000; padding: 15px 40px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 15px; }
    </style>
</head><body>
    <div class="header"><a href="games.html" class="btn-back">← رجوع</a><h1>🏗️ بناء الكود</h1><div style="width: 70px;"></div></div>
    
    <div class="game-area">
        <div class="task-box">المهمة: اكتب كود يطبع الجملة <strong>"I am a coder"</strong> في الشاشة.</div>
        <div class="editor-container">
            <textarea class="code-input" id="codeInput" placeholder="// اكتب الكود هنا..."></textarea>
            <div class="console-output" id="consoleOutput">> Output...</div>
        </div>
        <div class="controls">
            <button class="btn btn-run" onclick="runAndCheck()">▶ تشغيل وفحص</button>
        </div>
    </div>

    <div class="modal" id="successModal"><div class="modal-content">
        <h2 style="color: #ffd700;">🎉 ممتاز يا بطل!</h2>
        <p>لقد كتبت الكود الصحيح</p>
        <button class="btn-claim" onclick="claimReward()">احصل على 50 نقطة</button>
    </div></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((l) => { if(!l) window.location.href='index.html'; });
        });

        function runAndCheck() {
            const code = document.getElementById('codeInput').value;
            const output = document.getElementById('consoleOutput');
            output.innerHTML = '> Running...</span><br>';

            let originalLog = console.log;
            let hasOutput = false;

            console.log = function(...args) {
                output.innerHTML += `> ${args.join(' ')}<br>`;
                if (args.join(' ').includes('I am a coder')) hasOutput = true;
                originalLog.apply(console, args);
            };

            try {
                eval(code);
            } catch (err) {
                output.innerHTML += `<span style="color:#ff4444;">❌ Error: ${err.message}</span>`;
            } finally {
                console.log = originalLog;
            }

            if (hasOutput) {
                confetti({ particleCount: 150, spread: 70 });
                document.getElementById('successModal').classList.add('active');
            } else {
                output.innerHTML += `<br><span style="color:#ffd700;">⚠️ الكود لم يطبع الجملة المطلوبة بدقة.</span>`;
            }
        }

        async function claimReward() {
            const uid = Auth.getUserId();
            if (uid) {
                try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(50) }); } catch(e) {}
            }
            window.location.href = 'games.html';
        }
    </script>
</body></html>
