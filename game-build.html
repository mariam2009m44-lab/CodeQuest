<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازل الأكواد | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --pop-yellow: #FFD166; --pop-coral: #FF6B6B; --pop-teal: #4ECDC4; --pop-dark: #1A1A2E; --pop-white: #F8F9FA; }
    body { font-family: 'Playpen Sans Arabic', sans-serif; background: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; margin: 0; }
    .game-box { width: 100%; max-width: 600px; background: var(--pop-white); border: 4px solid var(--pop-dark); border-radius: 24px; padding: 30px; box-shadow: 8px 8px 0 var(--pop-dark); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { color: var(--pop-dark); text-decoration: none; font-weight: 800; }
    .task { background: #FEF3C7; border: 3px solid var(--pop-dark); border-radius: 16px; padding: 15px; text-align: center; font-weight: 800; margin-bottom: 20px; }
    .drop-zone { display: flex; flex-direction: column; gap: 10px; min-height: 150px; padding: 15px; border: 3px dashed #94A3B8; border-radius: 16px; margin-bottom: 20px; background: #F1F5F9; }
    .code-block { padding: 12px 16px; background: #fff; border: 3px solid var(--pop-dark); border-radius: 12px; font-family: monospace; font-size: 1.1rem; cursor: pointer; box-shadow: 3px 3px 0 var(--pop-dark); transition: 0.2s; direction: ltr; text-align: left; }
    .code-block:hover { transform: translateY(-2px); background: var(--pop-teal); color: #fff; }
    .code-block.selected { opacity: 0.5; pointer-events: none; }
    .btn-check { width: 100%; padding: 14px; background: var(--pop-coral); color: #fff; font-weight: 800; font-size: 1.1rem; border: 3px solid var(--pop-dark); border-radius: 16px; cursor: pointer; box-shadow: 4px 4px 0 var(--pop-dark); font-family: 'Playpen Sans Arabic'; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <h2 style="color: var(--pop-dark); margin: 0;">بازل الأكواد 🧩</h2>
    </div>
    <div class="task">رتب القطع لتكوين كود يطبع "Hello"</div>
    <div class="drop-zone" id="dropZone"></div>
    <div class="drop-zone" id="sourceZone">
      <div class="code-block" onclick="select(this, 'print(\"Hello\")')">print("Hello")</div>
      <div class="code-block" onclick="select(this, 'console.log(\"Hello\")')">console.log("Hello")</div>
      <div class="code-block" onclick="select(this, 'echo \"Hello\"')">echo "Hello"</div>
    </div>
    <button class="btn-check" onclick="check()" id="btn" disabled>تحقق</button>
  </div>

  <script>
    let seq = [], correct = ['print("Hello")', 'console.log("Hello")', 'echo "Hello"'];
    const drop = document.getElementById('dropZone'), btn = document.getElementById('btn');

    function select(el, code) {
      el.classList.add('selected'); seq.push(code);
      const newEl = document.createElement('div');
      newEl.className = 'code-block'; newEl.textContent = code;
      newEl.onclick = () => remove(newEl, code);
      drop.appendChild(newEl);
      btn.disabled = seq.length !== 3;
    }

    function remove(el, code) {
      const i = seq.indexOf(code);
      if (i > -1) {
        seq.splice(i, 1); el.remove();
        document.querySelectorAll('#sourceZone .code-block').forEach(b => {
          if (b.textContent.includes(code)) b.classList.remove('selected');
        });
        btn.disabled = seq.length !== 3;
      }
    }

    function check() {
      if (seq.every((v, i) => v === correct[i])) {
        btn.textContent = 'أحسنت! 🎉'; btn.style.background = 'var(--pop-teal)'; btn.disabled = true;
      } else {
        btn.textContent = 'خطأ، حاول مجدداً!'; btn.style.background = '#EF4444';
        setTimeout(() => { btn.textContent = 'تحقق'; btn.style.background = 'var(--pop-coral)'; }, 1500);
      }
    }
  </script>
</body>
</html>
