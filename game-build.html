<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بناء</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}.piece{background:#27ae60;padding:10px;margin:5px;border-radius:10px;display:inline-block;cursor:pointer;}</style></head><body><h2 style="color:#27ae60;">🏗️ بناء الكود</h2><p>رتب: let x = 5;</p><div id="slot" style="min-height:50px;border:2px dashed #27ae60;margin-bottom:20px;"></div><div id="pool"></div><script>const c=['let','x','=','5;'];let b=[];document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){const p=document.getElementById('pool');[...c].sort(()=>Math.random()-0.5).forEach(i=>{const d=document.createElement('div');d.className='piece';d.innerText=i;d.onclick=()=>{b.push(i);d.remove();document.getElementById('slot').innerText=b.join(' ');if(b.length===4)check();};p.appendChild(d);});}async function check(){if(b.join(' ')===c.join(' ')){alert('صح! ربحت 50 نقطة');const uid=Auth.getUserId();if(uid)await firebase.firestore().collection('users').doc(uid).update({bonusPoints:firebase.firestore.FieldValue.increment(50)});}else alert('غلط!');window.location.href='games.html';}</script></body></html>
