<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازل الأكواد | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; color: var(--gold); backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--green); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); transform: scale(1.02); }
    .task { background: rgba(118,233,192,0.1); border: 1px solid var(--green); border-radius: 14px; padding: 15px; text-align: center; font-weight: 800; margin-bottom: 25px; color: var(--green); box-shadow: 0 0 20px rgba(118,233,192,0.1); }
    .drop-zone { display: flex; flex-direction: column; gap: 12px; min-height: 120px; padding: 18px; border: 2px dashed var(--border); border-radius: 16px; margin-bottom: 20px; background: rgba(0,0,0,0.3); transition: 0.3s; }
    .drop-zone:hover { border-color: var(--cyan); background: rgba(107,232,255,0.05); }
    .code-block { padding: 14px 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; font-family: 'Fira Code', monospace; font-size: 1rem; cursor: pointer; transition: 0.2s; direction: ltr; text-align: left; color: var(--cyan); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .code-block:hover { border-color: var(--cyan); background: rgba(107,232,255,0.1); transform: translateY(-2px); }
    .code-block.selected { opacity: 0.3; pointer-events: none; }
    .btn-check { width: 100%; padding: 16px; background: var(--green); color: #000; font-weight: 900; font-size: 1.1rem; border: none; border-radius: 14px; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; }
    .btn-check:hover { box-shadow: 0 0 20px var(--green); transform: scale(1.02); }
    .btn-check:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .result-box { text-align: center; }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .result-box h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--cyan); }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 25px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
  
    /* Shared touch-first and reduced-motion refinements */
    button,
    a.back-btn,
    a.btn-back,
    a.btn-restart {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      min-height: 44px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--cyan, #36bfe5);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .level-box {
        width: 100%;
        max-width: 100%;
        padding: clamp(14px, 4vw, 22px) !important;
        border-radius: 18px;
      }

      .lvl-btn {
        width: 100%;
        min-height: 64px;
        gap: 10px;
        justify-content: space-between;
        touch-action: manipulation;
      }

      .back-btn,
      .btn-back,
      .btn-restart {
        min-height: 48px;
      }

      .drop-zone {
        min-height: 132px;
        padding: 14px;
        touch-action: pan-y;
      }
    }

    @media (max-width: 500px) {
      .memory-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

/* CodeQuest 2026 game-wide polish */
:root{color-scheme:dark}body{background-color:#080e1c;background-image:radial-gradient(ellipse at 10% 0%,rgba(75,105,190,.18),transparent 36%),radial-gradient(ellipse at 90% 12%,rgba(27,181,190,.11),transparent 32%),linear-gradient(155deg,#080e1c,#0c1427 58%,#080e1b)!important;background-attachment:fixed}main,.level-box,.game-card,.game-container,.result-box,.panel{border-color:rgba(151,177,218,.19)}button{font-family:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #75e2ef!important;outline-offset:3px!important}button:disabled{cursor:not-allowed;filter:saturate(.65)}.level-box,.game-card,.result-box{box-shadow:0 18px 48px rgba(0,0,0,.22)}.lvl-btn,.btn,.opt-btn,.line,.piece{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.lvl-btn:active,.btn:active,.opt-btn:active,.line:active,.piece:active{transform:scale(.985)}.progress,.timer-bar{overflow:hidden;border-radius:999px}.progress>span,.timer-bar>span{transition:width .25s ease}.result-emoji{filter:drop-shadow(0 8px 18px rgba(111,190,255,.2))}@media(max-width:640px){body{background-attachment:scroll!important}.level-box,.game-card,.result-box{width:min(100%,100%)!important;max-width:100%!important}.actions{gap:10px}.btn-restart,.btn-back{min-height:48px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

  <link rel="stylesheet" href="css/codequest-games.css">
  <link rel="stylesheet" href="css/codequest-games-pro.css">
  <link rel="stylesheet" href="css/game-3d.css">
<link rel="stylesheet" href="css/game-space.css">

</head>
<body class="cq-game-page" data-cq-game="build" data-cq-theme="space">
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <section class="game-art-banner" aria-label="بازل الأكواد"><img src="assets/games/game-build.svg" alt="" decoding="async"></section>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى البازل</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>3 قطع</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>4 قطع</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>5 قطع</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div class="task" id="taskText">المهمة هنا...</div>
      <p id="buildFeedback" class="hint" role="status" aria-live="polite"></p>
      <p id="buildAttempts" class="build-attempts" aria-live="polite">المحاولات: 0</p>
      <div class="drop-zone" id="dropZone"></div>
      <div class="drop-zone" id="sourceZone"></div>
      <button class="btn-check" onclick="check()" id="btn" disabled>تحقق من الترتيب</button>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <pre id="buildLearning" dir="ltr" class="cq-code-learning"></pre><p class="result-message" id="resultMessage"></p>
      <button class="btn-restart" onclick="restartGame()">العب مستوى آخر</button>
      <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
    </div>
  </div>
  <style>
    .build-attempts{margin:8px 0;text-align:center;color:var(--cyan);font-weight:800}
    .code-block.build-wrong{border-color:var(--red)!important;background:rgba(251,113,133,.15)!important;box-shadow:0 0 0 2px rgba(251,113,133,.12)}
    .code-block.selected{opacity:.55}
  </style>
  <script>
    const puzzles = {
      easy: { task: "Python: رتّب الكود لطباعة Hello ثم العدد 5", correct: ['message = "Hello"', 'print(message)', 'print(2 + 3)'], options: ['message = "Hello"', 'print(message)', 'print(2 + 3)'] },
      medium: { task: "Python: رتّب دالة ترحّب بالمستخدم وتستدعيها", correct: ['def greet(name):', '    print("Hello " + name)', '    return True', 'greet("Cody")'], options: ['def greet(name):', '    print("Hello " + name)', '    return True', 'greet("Cody")'] },
      hard: { task: "Python: رتّب كلاس سيارة وأنشئ كائنًا واطبع علامته", correct: ['class Car:', '    def __init__(self, brand):', '        self.brand = brand', '    def display(self):', '        print(self.brand)', 'car = Car("Cody")', 'car.display()'], options: ['class Car:', '    def __init__(self, brand):', '        self.brand = brand', '    def display(self):', '        print(self.brand)', 'car = Car("Cody")', 'car.display()'] }
    };
    let seq = [], correctSeq = [], score = 0, currentLevel = 'easy', attempts = 0;
    const drop = document.getElementById('dropZone'), source = document.getElementById('sourceZone'), btn = document.getElementById('btn'), scoreDisplay = document.getElementById('scoreDisplay'), taskText = document.getElementById('taskText');

    function updateGlobalScore(points) {
      let total = parseInt(localStorage.getItem('codyTotalScore')) || 0;
      total += points; localStorage.setItem('codyTotalScore', total);
      window.CodeQuestExperience?.collectible({ label: "+" + points + " نقطة" });
    }

    function startGame(level) {
      currentLevel = level; score = 0; attempts = 0; scoreDisplay.textContent = 0; document.getElementById('buildFeedback').textContent = ''; document.getElementById('buildAttempts').textContent = 'المحاولات: 0';
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      const p = puzzles[level]; correctSeq = p.correct; taskText.textContent = p.task;
      const shuffled = [...p.options];
      for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
      source.innerHTML = ''; drop.innerHTML = ''; seq = []; btn.disabled = true;
      btn.textContent = 'تحقق من الترتيب';
      btn.style.background = 'var(--green)';
      drop.style.borderColor = '';
      drop.style.background = '';
      shuffled.forEach(opt => {
        const el = document.createElement('button'); el.type = 'button'; el.className = 'code-block'; el.setAttribute('aria-label','إضافة سطر الكود: '+opt);
        el.textContent = opt; el.onclick = () => select(el, opt); source.appendChild(el);
      });
    }

    function select(el, code) {
      if (el.classList.contains('selected')) return;
      const sourceIndex = Array.prototype.indexOf.call(source.children, el);
      el.classList.add('selected');
      el.setAttribute('aria-disabled', 'true');
      drop.querySelectorAll('.build-wrong').forEach(item => item.classList.remove('build-wrong'));
      seq.push(code);
      const newEl = document.createElement('button'); newEl.type = 'button'; newEl.className = 'code-block'; newEl.setAttribute('aria-label','إزالة السطر من الترتيب');
      newEl.textContent = code;
      newEl.dataset.sourceIndex = String(sourceIndex);
      newEl.onclick = () => remove(newEl, code);
      drop.appendChild(newEl);
      btn.disabled = seq.length !== correctSeq.length;
    }

    function remove(el, code) {
      const i = Array.prototype.indexOf.call(drop.children, el);
      if (i > -1) {
        seq.splice(i, 1);
        const sourceIndex = Number(el.dataset.sourceIndex);
        const sourceItem = source.children[sourceIndex];
        if (sourceItem) {
          sourceItem.classList.remove('selected');
          sourceItem.removeAttribute('aria-disabled');
        }
        el.remove();
        btn.disabled = seq.length !== correctSeq.length;
      }
    }

    function check() {
      const firstWrong = seq.findIndex((value, index) => value !== correctSeq[index]);
      if (firstWrong === -1 && seq.length === correctSeq.length) {
        const earned = Math.max(20, 50 - attempts * 5);
        document.getElementById('buildFeedback').textContent = 'ترتيب صحيح! كل سطر في مكانه، وأصبح الكود جاهزًا للتنفيذ.';
        btn.textContent = 'أحسنت! 🎉'; btn.style.background = 'var(--cyan)'; btn.disabled = true;
        drop.querySelectorAll('.code-block').forEach(item => { item.disabled = true; });
        score += earned; scoreDisplay.textContent = score; updateGlobalScore(earned);
        drop.style.borderColor = 'var(--green)'; drop.style.background = 'rgba(118,233,192,0.1)';
        document.getElementById('buildAttempts').textContent = 'نجحت بعد ' + (attempts + 1) + ' محاولة — +' + earned + ' نقطة';
        setTimeout(() => {
          document.getElementById('gameScreen').classList.remove('active');
          document.getElementById('resultScreen').classList.add('active');
          document.getElementById('resultEmoji').textContent = '🏆';
          document.getElementById('resultTitle').textContent = 'اكتمل ترتيب الكود!';
          document.getElementById('resultMessage').textContent = `حصلت على ${earned} نقطة. هذا ترتيب Python تم اختباره ضمن اختبارات المنصة.`;
          document.getElementById('buildLearning').textContent = 'الكود الصحيح:\n' + correctSeq.join('\n') + '\n\nالناتج المتوقع:\n' + ({easy:'Hello\n5',medium:'Hello Cody',hard:'Cody'}[currentLevel]);
          window.CodeQuestExperience?.reward({ gems: 0, title: 'البازل اكتمل!', message: 'رتبت الكود بشكل صحيح! كودي فخور بيك.' });
        }, 800);
      } else {
        attempts++;
        document.getElementById('buildAttempts').textContent = 'المحاولات: ' + attempts;
        drop.querySelectorAll('.build-wrong').forEach(item => item.classList.remove('build-wrong'));
        const wrongBlock = drop.children[firstWrong >= 0 ? firstWrong : drop.children.length - 1];
        if (wrongBlock) wrongBlock.classList.add('build-wrong');
        document.getElementById('buildFeedback').textContent = firstWrong >= 0
          ? 'راجع السطر المميز؛ أول اختلاف في الترتيب يبدأ من هنا.'
          : 'ما زال هناك سطر ناقص. أكمل ترتيب كل الأجزاء أولًا.';
        btn.textContent = 'خطأ، حاول مجدداً!'; btn.style.background = 'var(--red)';
        setTimeout(() => { btn.textContent = 'تحقق من الترتيب'; btn.style.background = 'var(--green)'; }, 1500);
      }
    }
    function restartGame() {
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('levelScreen').classList.add('active');
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(118, 233, 192, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    let matrixTimer = null;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function startMatrix(){ if(reducedMotion || matrixTimer) return; matrixTimer = setInterval(draw, 120); }
    function stopMatrix(){ if(matrixTimer){ clearInterval(matrixTimer); matrixTimer = null; } }
    startMatrix();
    document.addEventListener('visibilitychange',()=>document.hidden?stopMatrix():startMatrix());
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
<script type="module" src="js/route-guard.js"></script>
