<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-labelledby="title desc">
<title id="title">كودي — مساعدك في رحلة بايثون</title><desc id="desc">روبوت ثلاثي الأبعاد المظهر بدرع أبيض وبدلة بنفسجية وعيون سماوية متوهجة ونجمة ذهبية على الصدر، يلوّح بيده ترحيبًا.</desc>
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#e9f1ff"/><stop offset="1" stop-color="#9eb6df"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6a2ff"/><stop offset=".48" stop-color="#8057ed"/><stop offset="1" stop-color="#39217f"/></linearGradient>
 <linearGradient id="visor" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#182c68"/><stop offset="1" stop-color="#070d28"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6ffff"/><stop offset=".35" stop-color="#52f2ff"/><stop offset="1" stop-color="#009bd8"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbd1"/><stop offset=".5" stop-color="#ffdf62"/><stop offset="1" stop-color="#f59a21"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#35d9ff" stop-opacity=".25"/><stop offset="1" stop-color="#35d9ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="212" cy="375" rx="145" ry="34" fill="url(#halo)"/>
<circle cx="211" cy="202" r="188" fill="url(#halo)"/>
<g filter="url(#shadow)" stroke-linejoin="round">
 <!-- antenna -->
 <path d="M208 56V28" stroke="#6042c5" stroke-width="13" stroke-linecap="round"/>
 <path d="M208 53V28" stroke="#37d9f5" stroke-width="5" stroke-linecap="round"/>
 <circle cx="208" cy="23" r="18" fill="url(#cyan)" stroke="#e6ffff" stroke-width="5" filter="url(#glow)"/>
 <!-- legs -->
 <path d="M148 321l-5 53q-1 18 17 20l39 1q15 0 16-17l-1-50z" fill="url(#purple)" stroke="#f8fbff" stroke-width="9"/>
 <path d="M219 326l2 52q1 16 17 16h40q17 0 16-19l-7-56z" fill="url(#purple)" stroke="#f8fbff" stroke-width="9"/>
 <path d="M145 377q-37 8-38 27-1 12 15 14h76q16-2 14-17l-5-16z" fill="url(#shell)" stroke="#fff" stroke-width="6"/>
 <path d="M224 382l-2 19q-1 15 16 17h73q17-2 12-17-5-15-36-24z" fill="url(#shell)" stroke="#fff" stroke-width="6"/>
 <path d="M126 407h75M241 408h69" stroke="#32dcf6" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
 <!-- waving arm -->
 <path d="M119 221q-23-13-39-39l-26-34q-12-15-27-4-13 11-3 27l40 57q20 29 51 33z" fill="url(#purple)" stroke="#f8fbff" stroke-width="10"/>
 <path d="M45 151q-5-25 8-31 12-5 20 13l10 22q7-27 20-22 13 5 7 31l-5 20q21-18 31-5 9 13-8 30l-23 23q-18 18-40 0l-26-30q-14-16-4-28 8-9 22-1z" fill="url(#shell)" stroke="#fff" stroke-width="7"/>
 <path d="M53 158l17 21M83 155l9 25M110 169l-2 18" stroke="#aebfe0" stroke-width="5" stroke-linecap="round"/>
 <!-- right arm -->
 <path d="M286 226q32 4 49 32l23 39q9 16-7 26-16 9-26-7l-29-36-25-4z" fill="url(#purple)" stroke="#f8fbff" stroke-width="9"/>
 <path d="M331 295l27 17" stroke="#ffd66b" stroke-width="7" stroke-linecap="round"/>
 <!-- torso -->
 <path d="M133 207q5-34 43-42h75q39 6 48 42l14 91q6 48-41 57-65 17-125 0-43-13-34-56z" fill="url(#purple)" stroke="#f8fbff" stroke-width="10"/>
 <path d="M155 285q53 24 117 0l5 29q-61 25-128 0z" fill="url(#shell)" opacity=".9"/>
 <path d="M207 213l13 17 22 3-16 16 4 22-20-11-20 11 4-22-16-16 22-3z" fill="url(#gold)" stroke="#fff3b4" stroke-width="6" filter="url(#glow)"/>
 <!-- neck -->
 <path d="M173 169q-2-24 35-25 36 1 35 25l-5 20h-60z" fill="#30206e" stroke="#f8fbff" stroke-width="7"/>
 <!-- head ear modules -->
 <rect x="64" y="70" width="43" height="88" rx="19" fill="url(#purple)" stroke="#f8fbff" stroke-width="8"/>
 <rect x="314" y="70" width="43" height="88" rx="19" fill="url(#purple)" stroke="#f8fbff" stroke-width="8"/>
 <path d="M75 91v45M346 91v45" stroke="#36dcf6" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
 <!-- helmet -->
 <path d="M91 79q4-58 65-61h105q64 2 69 62l-5 93q-5 43-52 47H149q-48-4-53-48z" fill="url(#shell)" stroke="#fff" stroke-width="9"/>
 <path d="M150 19q59-15 119 3l-8 17H159z" fill="url(#gold)" stroke="#fff4bf" stroke-width="4"/>
 <!-- visor -->
 <rect x="112" y="54" width="194" height="126" rx="43" fill="url(#visor)" stroke="#a8caff" stroke-width="5"/>
 <path d="M145 118q0-28 23-28 24 0 24 28" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M226 118q0-28 23-28 24 0 24 28" fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M192 143q18 17 36 0" fill="none" stroke="#ff8fc4" stroke-width="8" stroke-linecap="round"/>
 <path d="M130 73q42-24 78-13" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
</g>
<g fill="#ffd66b"><path d="M60 52l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M356 205l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
</svg>