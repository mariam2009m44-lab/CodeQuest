    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.7); --glass-border: rgba(0, 229, 255, 0.2); }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; overflow-x: hidden; }
        
        /* Matrix Background */
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; pointer-events: none; }

        /* Glass Header */
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 1.4rem; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,229,255,0.5); display: flex; align-items: center; gap: 8px;}
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s;}
        .btn-back:hover { background: var(--neon-cyan); color: #000; }

        /* Glass Cards */
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 25px; padding: 25px 20px; width: 90%; max-width: 450px; margin-top: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; z-index: 10; }
        
        /* Floating Dock */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 65px; height: 60px; border-radius: 18px; background: transparent; color: #667; text-decoration: none; transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; font-family: 'Cairo'; font-weight: bold; }
        .nav-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border-color: rgba(0, 229, 255, 0.4); transform: translateY(-5px); }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.createElement('canvas'); canvas.id = 'matrix-canvas'; document.body.prepend(canvas);
            const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const chars = '01JSletconstifelsefor(){}[]'.split(''); const fontSize = 16; const columns = canvas.width / fontSize; const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;
            function draw() {
                ctx.fillStyle = 'rgba(5, 9, 20, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00e5ff'; ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
                }
            }
            setInterval(draw, 50);
        });
    </script>
