<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر لغتك | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --card-bg: rgba(255,255,255,0.03); }
        body { 
            background: radial-gradient(circle at top, #0a192f 0%, var(--bg) 100%);
            color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            padding-bottom: 120px; box-sizing: border-box;
        }
        
        .header-text { margin-top: 40px; text-align: center; }
        .header-text h1 { color: #fff; font-size: 2rem; margin: 0 0 10px; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .header-text p { color: #aaa; font-size: 1.1rem; margin: 0; }

        .languages-grid { 
            display: flex; flex-direction: column; gap: 25px; 
            width: 100%; max-width: 500px; margin-top: 40px; padding: 0 20px; box-sizing: border-box;
        }
        
        .lang-card { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 30px 20px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden;
        }
        
        .lang-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0,229,255,0.1), transparent);
            transform: translateX(-100%); transition: 0.5s;
        }
        .lang-card:hover::before { transform: translateX(100%); }
        .lang-card:hover { transform: translateY(-5px) scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 10px 30px rgba(0,229,255,0.2); }

        .lang-logo { width: 80px; height: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .lang-title { font-size: 1.8rem; font-weight: 900; margin: 0 0 5px; }
        .lang-desc { color: #888; font-size: 1rem; margin: 0; text-align: center; }
        
        .card-js .lang-title { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .card-py .lang-title { color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.3); }
        .card-cpp .lang-title { color: #4facfe; text-shadow: 0 0 10px rgba(79,172,254,0.3); }

        /* Floating Navigation Dock */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px 20px;
            background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,229,255,0.1);
            z-index: 1000;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 70px; height: 65px; border-radius: 18px;
            background: transparent; color: #667; text-decoration: none;
            transition: all 0.3s ease; border: 1px solid transparent;
        }
        .nav-btn i { font-size: 1.6rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-btn span { font-size: 0.75rem; font-family: 'Cairo'; font-weight: bold; }
        
        .nav-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border-color: rgba(0, 229, 255, 0.4); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,229,255,0.2); }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>أهلاً بك يا مريم 👋</h1>
        <p>اختر لغة البرمجة اللي عايز تتعلمها</p>
    </div>

    <div class="languages-grid">
        <!-- JavaScript -->
        <div class="lang-card card-js" onclick="selectLang('JavaScript')">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" class="lang-logo" alt="JS">
            <h2 class="lang-title">JavaScript</h2>
            <p class="lang-desc">لغة الويب التفاعلية</p>
        </div>

        <!-- Python -->
        <div class="lang-card card-py" onclick="selectLang('Python')">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" class="lang-logo" alt="Python">
            <h2 class="lang-title">Python</h2>
            <p class="lang-desc">لغة الذكاء الاصطناعي</p>
        </div>

        <!-- C++ -->
        <div class="lang-card card-cpp" onclick="selectLang('C++')">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg" class="lang-logo" alt="C++">
            <h2 class="lang-title">C++</h2>
            <p class="lang-desc">لغة الألعاب والأنظمة</p>
        </div>
    </div>

    <!-- Professional Navigation Dock -->
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn">
            <i class="ri-user-3-line"></i>
            <span>ملفي</span>
        </a>
        <a href="shop.html" class="nav-btn">
            <i class="ri-shopping-bag-3-line"></i>
            <span>المتجر</span>
        </a>
        <a href="games.html" class="nav-btn">
            <i class="ri-gamepad-line"></i>
            <span>الألعاب</span>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <i class="ri-trophy-line"></i>
            <span>الشرف</span>
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof Auth !== 'undefined') {
                Auth.init((logged) => {
                    if (!logged) window.location.href = 'index.html';
                });
            }
        });

        function selectLang(lang) {
            localStorage.setItem('cq_language', lang);
            window.location.href = 'levels.html';
        }
    </script>
</body>
</html>
