<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>اللغات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/languages.css"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <style>
        /* تحديث ستايل الشريط السفلي */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 12px 25px;
            background: rgba(5, 9, 20, 0.8); backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(0,229,255,0.1);
            z-index: 1000;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 65px; height: 65px; border-radius: 20px;
            background: transparent; color: #aaa; text-decoration: none;
            transition: all 0.3s ease; position: relative;
            border: 1px solid transparent;
        }
        .nav-btn i { font-size: 1.6rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-btn span { font-size: 0.7rem; font-family: 'Cairo'; font-weight: bold; }
        
        /* تأثيرات عند الوقوف أو التنشيط */
        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 229, 255, 0.1); color: #00e5ff;
            border-color: rgba(0, 229, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.3);
        }
        .nav-btn:nth-child(3):hover { color: #ffd700; background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .nav-btn:nth-child(4):hover { color: #ff4444; background: rgba(255, 68, 68, 0.1); border-color: rgba(255, 68, 68, 0.5); box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3); }
        
        /* إخفاء الشريط القديم لو موجود */
        .nav-buttons, .buttons-container { display: none !important; }
    </style>
    </head><body>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn">
            <i class="ri-user-3-line"></i>
            <span>ملفي</span>
        </a>
        <a href="shop.html" class="nav-btn">
            <i class="ri-shopping-bag-3-line"></i>
            <span>المتجر</span>
        </a>
        <a href="games.html" class="nav-btn">
            <i class="ri-gamepad-line"></i>
            <span>الألعاب</span>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <i class="ri-trophy-line"></i>
            <span>الشرف</span>
        </a>
    </div>
    <script>document.addEventListener('DOMContentLoaded', () => { Auth.init((logged) => { if(!logged) window.location.href = 'index.html'; else document.getElementById('userName').innerText = Auth.getCurrentUser(); }); }); function chooseLang(c, n) { localStorage.setItem('cq_language', c); localStorage.setItem('cq_language_name', n); window.location.href = 'levels.html'; }</script></body></html>
