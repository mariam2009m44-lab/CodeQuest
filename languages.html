<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسارات | Cody Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="languages.html" class="nav-item active"><i class="ri-map-2-line"></i> المسارات</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="profile.html" class="nav-item"><i class="ri-user-smile-line"></i> حسابي</a>
                <a href="#" class="nav-item logout"><i class="ri-logout-box-r-line"></i> خروج</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1 style="font-size: 2.2rem; margin-bottom: 30px; color: #fff; font-weight: 900;">اختر مسارك</h1>
            <div class="grid-quick" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
                <a href="levels.html?lang=python" class="glass-card quick-card" style="padding: 40px; align-items: flex-start; text-align: right;">
                    <div class="quick-icon" style="background: rgba(251, 191, 36, 0.1); color: var(--dark-gold); font-size: 3rem; width: 80px; height: 80px;">🐍</div>
                    <h3 style="color: #fff; font-size: 1.5rem; margin-bottom: 5px;">Python</h3>
                    <p style="color: var(--dark-muted);">لغة الذكاء الاصطناعي والبيانات</p>
                </a>
                <a href="levels.html?lang=javascript" class="glass-card quick-card" style="padding: 40px; align-items: flex-start; text-align: right;">
                    <div class="quick-icon" style="background: rgba(0, 217, 255, 0.1); color: var(--dark-cyan); font-size: 3rem; width: 80px; height: 80px;">🟨</div>
                    <h3 style="color: #fff; font-size: 1.5rem; margin-bottom: 5px;">JavaScript</h3>
                    <p style="color: var(--dark-muted);">لغة الويب والتفاعل</p>
                </a>
                <a href="levels.html?lang=cpp" class="glass-card quick-card" style="padding: 40px; align-items: flex-start; text-align: right;">
                    <div class="quick-icon" style="background: rgba(139, 92, 246, 0.1); color: var(--dark-purple); font-size: 3rem; width: 80px; height: 80px;">⚙️</div>
                    <h3 style="color: #fff; font-size: 1.5rem; margin-bottom: 5px;">C++</h3>
                    <p style="color: var(--dark-muted);">لغة الأنظمة والألعاب</p>
                </a>
            </div>
        </main>
    </div>
    <nav class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
        <a href="languages.html" class="mobile-nav-item active"><i class="ri-book-open-line"></i> المسارات</a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-terminal-box-line"></i> الملعب</a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i> حسابي</a>
    </nav>
    <script type="module">
        import { App } from './js/app.js';
        App.init();
    </script>
</body>
</html>
