<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر مسارك | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { color: var(--primary); font-size: 2rem; text-shadow: 0 0 10px rgba(0,229,255,0.4); }
        .btn-back { color: var(--text-muted); text-decoration: none; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .btn-back:hover { color: #fff; }

        .lang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; width: 100%; max-width: 900px; }
        .lang-card { background: var(--glass); border: 2px solid var(--glass-border); border-radius: 25px; padding: 30px; text-align: center; text-decoration: none; color: #fff; transition: 0.3s; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .lang-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        
        .lang-card.js:hover { border-color: #f7df1e; box-shadow: 0 0 25px rgba(247,223,30,0.3); }
        .lang-card.py:hover { border-color: #3776ab; box-shadow: 0 0 25px rgba(55,118,171,0.3); }
        .lang-card.cpp:hover { border-color: #00599c; box-shadow: 0 0 25px rgba(0,89,156,0.3); }

        .lang-card img { width: 80px; height: 80px; margin-bottom: 20px; }
        .lang-card h2 { font-size: 1.8rem; margin: 0 0 10px; }
        .lang-card p { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 20px; line-height: 1.5; }
        .lang-card .btn-primary { width: 100%; padding: 12px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <a href="avatar.html" class="btn-back">→ رجوع</a>
        <h1>اختر مسار البرمجة المناسب لك</h1>
        <div style="width: 50px;"></div>
    </div>

    <div class="lang-grid">
        <a href="#" onclick="selectLang('JavaScript')" class="lang-card js">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JS">
            <h2>JavaScript</h2>
            <p>لغة الويب التفاعلية. نبني بها المواقع والألعاب.</p>
            <div class="btn-primary">🚀 ابدأ الآن</div>
        </a>

        <a href="#" onclick="selectLang('Python')" class="lang-card py">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
            <h2>Python</h2>
            <p>لغة الذكاء الاصطناعي وتحليل البيانات.</p>
            <div class="btn-primary" style="background: #3776ab; color: #fff;">🚀 ابدأ الآن</div>
        </a>

        <a href="#" onclick="selectLang('C++')" class="lang-card cpp">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg" alt="C++">
            <h2>C++</h2>
            <p>لغة الألعاب والأنظمة السريعة والقوية.</p>
            <div class="btn-primary" style="background: #00599c; color: #fff;">🚀 ابدأ الآن</div>
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((logged) => { if (!logged) window.location.href = 'index.html'; });
        });

        function selectLang(lang) {
            localStorage.setItem('cq_language', lang);
            window.location.href = 'levels.html';
        }
    </script>
</body>
</html>
