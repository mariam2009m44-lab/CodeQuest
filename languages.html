<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسارات التعلم | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
    body{background:#050914;color:#fff;min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0%, rgba(0,229,255,0.15) 0%, transparent 60%);display:flex;flex-direction:column;align-items:center;padding-top:40px}
    .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
    .particle{position:absolute;color:rgba(0,229,255,0.2);font-weight:bold;font-size:20px;animation:floatUp 10s linear infinite}
    @keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh);opacity:0}}
    .lang-header{text-align:center;margin-bottom:40px;position:relative;z-index:2;animation:fadeDown 0.8s ease}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
    .lang-header h1{color:#00e5ff;font-size:28px;text-shadow:0 0 20px rgba(0,229,255,0.6);margin-bottom:10px;font-weight:900}
    .lang-header p{color:#a0aec0;font-size:15px}
    .lang-cards-container{display:flex;flex-direction:column;gap:25px;max-width:400px;margin:0 auto;position:relative;z-index:2;padding-bottom:40px;width:90%}
    .lang-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(15px);border:2px solid rgba(255,255,255,0.08);border-radius:28px;padding:30px 20px;text-align:center;cursor:pointer;transition:all 0.4s;text-decoration:none;display:block}
    .lang-card:hover{transform:translateY(-10px) scale(1.02)}
    .java-card:hover{border-color:#f89820;box-shadow:0 20px 50px rgba(248,152,32,0.3)}
    .py-card:hover{border-color:#00e5ff;box-shadow:0 20px 50px rgba(0,229,255,0.3)}
    .cpp-card:hover{border-color:#0072ff;box-shadow:0 20px 50px rgba(0,114,255,0.3)}
    .card-icon{width:110px;height:110px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 15px 25px rgba(0,0,0,0.6))}
    .card-icon img{width:100%;height:100%;object-fit:contain;animation:breathe 3s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .lang-card h2{font-size:26px;margin-bottom:8px;font-weight:900}
    .java-card h2{color:#f89820;text-shadow:0 0 15px rgba(248,152,32,0.5)}
    .py-card h2{color:#00e5ff;text-shadow:0 0 15px rgba(0,229,255,0.5)}
    .cpp-card h2{color:#0072ff;text-shadow:0 0 15px rgba(0,114,255,0.5)}
    .lang-card > p{color:#a0aec0;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="lang-header">
    <h1>مساراتك البرمجية</h1>
    <p>اختر اللغة التي تريد استكشافها، وابدأ التعلم خطوة بخطوة.</p>
  </div>
  <div class="lang-cards-container">
    <a href="python-welcome.html" class="lang-card py-card">
      <div class="card-icon"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python"></div>
      <h2>Python</h2>
      <p>لغة سهلة وقوية، مثالية للمبتدئين وعلوم البيانات.</p>
    </a>
    <div class="lang-card java-card" onclick="alert('مسار Java قيد التطوير!')">
      <div class="card-icon"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java"></div>
      <h2>Java</h2>
      <p>لغة قوية لبناء التطبيقات والأنظمة الضخمة.</p>
    </div>
    <div class="lang-card cpp-card" onclick="alert('مسار C++ قيد التطوير!')">
      <div class="card-icon"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg" alt="C++"></div>
      <h2>C++</h2>
      <p>لغة الأداء العالي والخوارزميات. تحدَّ نفسك في حل المشكلات.</p>
    </div>
  </div>
  <script>
    const particlesContainer = document.getElementById('particles');
    const symbols = ['{ }', '</>', '( )', '0', '1', ';', '=>', '++', '=='];
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
      particle.style.fontSize = (Math.random() * 15 + 15) + 'px';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
