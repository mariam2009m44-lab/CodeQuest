<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest | رحلة الكود</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; background: radial-gradient(circle at center, #0a192f, #050914); }
        .container { text-align: center; z-index: 2; padding: 20px; }
        h1 { font-size: 3rem; color: #fff; text-shadow: 0 0 20px var(--primary); margin-bottom: 10px; }
        p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        .btn-start { font-size: 1.3rem; padding: 15px 40px; }
        .bg-stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

    <!-- DRACONIAN CSS TO HIDE MOBILE NAV -->
    <style>
        /* إخفاء الشريط السفلي نهائياً في الصفحة دي */
        body .mobile-bottom-nav, 
        .mobile-bottom-nav,
        nav.mobile-bottom-nav {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
        }
    </style>

    <!-- Shield to hide mobile nav on Landing Page -->
    <style>
        body > nav.mobile-bottom-nav, 
        body > .mobile-bottom-nav,
        #mobile-bottom-nav {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 5rem; color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 0 20px var(--primary));"><i class="ri-robot-line"></i></div>
        <h1>CodeQuest</h1>
        <p>اكتشف عالم البرمجة. تعلم، العب، واصنع مستقبلك.</p>
        <a href="login.html" class="btn btn-primary btn-start">🚀 ابدأ رحلتك الآن</a>
    </div>

    
    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    
    

    <!-- Curriculum Async Bridge -->
    <script src="js/curriculum.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("⏳ جاري تحميل المناهج...");
            
            // تحميل المناهج الثلاثة بالتوازي عشان السرعة
            const [jsData, pyData, cppData] = await Promise.all([
                window.CodeQuestCurriculum.loadCurriculum('javascript'),
                window.CodeQuestCurriculum.loadCurriculum('python'),
                window.CodeQuestCurriculum.loadCurriculum('cpp')
            ]);

            // تجميعهم في متغير عام عشان الصفحات القديمة متبوظش
            window.allCurriculums = {
                javascript: jsData,
                python: pyData,
                cpp: cppData
            };
            
            // متغير احتياطي لو الصفحة كانت بتستخدم اسم curriculumData
            window.curriculumData = window.allCurriculums; 

            console.log("✅ تم تحميل جميع المناهج بنجاح!");
            
            // إطلاق حدث مخصص عشان الصفحات تعرف إن الداتا جاهزة
            document.dispatchEvent(new CustomEvent('curriculumLoaded', { detail: window.allCurriculums }));
        });
    </script>

    <script>
        // 🚨 قتل شريط التنقل السفلي في هذه الصفحة فقط
        document.addEventListener('DOMContentLoaded', function() {
            const killNav = () => {
                const navs = document.querySelectorAll('.mobile-bottom-nav, nav');
                navs.forEach(nav => {
                    if (nav.classList.contains('mobile-bottom-nav') || nav.innerHTML.includes('الرئيسية')) {
                        nav.remove();
                        nav.style.display = 'none';
                        console.log("🗑️ تم تدمير الشريط السفلي");
                    }
                });
            };
            killNav(); // جرب فوراً
            setTimeout(killNav, 500); // جرب تاني بعد نص ثانية لو اتحمل متأخر
            setTimeout(killNav, 1500); // جرب تالت بعد ثانية ونص
        });
    </script>
</body>

</html>
