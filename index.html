<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeQuest | رحلة الكود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="custom-alert" id="customAlert"></div>

<div class="loader" id="loader"><div class="spinner"></div><p>جاري التحميل...</p></div>
<div class="gate-container" id="gate">
<div class="scene">
<div class="robot-container" id="robot" onclick="robotJoke()">
<img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" alt="Cute Robot" class="mascot-img" id="mascot">
<div class="speech-bubble" id="speechBubble">مرحباً! اضغط عليّ لأقول لك نكتة 😄</div>
</div>
<div class="login-box" id="loginBox">
<h1>CodeQuest</h1>
<p id="form-title">تسجيل الدخول</p>
<input type="text" id="username" placeholder="اسم المستخدم...">
<input type="password" id="password" placeholder="كلمة المرور...">
<button id="enter-btn">دخول</button>
<p class="toggle-text" id="toggle-btn">ليس لديك حساب؟ سجل الآن</p>
</div>
</div>
<div class="door left-door"></div>
<div class="door right-door"></div>
</div>
<script src="js/auth.js"></script>
<script src="js/script.js"></script>
</body>
</html>
