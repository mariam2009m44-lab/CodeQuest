<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - مستقبلك يبدأ من هنا</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .landing-page { display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(5, 9, 20, 0.8); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--glass-border); }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .nav-links a { color: var(--text-main); text-decoration: none; margin: 0 15px; font-weight: 700; transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }
        .hero-section { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 120px 40px 60px; max-width: 1200px; margin: 0 auto; gap: 40px; }
        .hero-content { flex: 1; text-align: right; }
        .hero-title { font-size: 3.5rem; font-weight: 900; line-height: 1.2; margin-bottom: 20px; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-description { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; }
        .hero-actions { display: flex; gap: 20px; }
        .hero-visual { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .robot-avatar { width: 300px; height: 300px; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 8rem; animation: float 4s ease-in-out infinite; box-shadow: 0 0 50px var(--secondary); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .features-bar { display: flex; justify-content: center; gap: 30px; padding: 20px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); flex-wrap: wrap; }
        .feature-item { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-weight: 700; }
        .feature-item span { color: var(--primary); font-size: 1.5rem; }
        @media (max-width: 768px) {
            .hero-section { flex-direction: column; text-align: center; padding-top: 100px; }
            .hero-content { text-align: center; }
            .hero-title { font-size: 2.5rem; }
            .hero-actions { justify-content: center; flex-wrap: wrap; }
            .navbar { padding: 15px 20px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body class="landing-page">
    <nav class="navbar">
        <div class="logo">CodeQuest 🚀</div>
        <div class="nav-links">
            <a href="#features">المميزات</a>
            <a href="login.html">تسجيل الدخول</a>
        </div>
    </nav>
    <header class="hero-section">
        <div class="hero-content animate-fade">
            <h1 class="hero-title">مستقبلك يبدأ من هنا</h1>
            <p class="hero-description">
                تعلم البرمجة بطريقة تفاعلية وممتعة. اكتب الكود، شغله، والعب ألعاباً تعليمية لتطوير مهاراتك في JavaScript، Python، وC++.
            </p>
            <div class="hero-actions">
                <a href="login.html" class="btn-primary">🚀 ابدأ رحلتك الآن</a>
                <a href="login.html" class="btn-secondary">تسجيل الدخول</a>
            </div>
        </div>
        <div class="hero-visual animate-fade">
            <div class="robot-avatar">🤖</div>
        </div>
    </header>
    <footer class="features-bar" id="features">
        <div class="feature-item"><span>🎮</span> ألعاب تعليمية</div>
        <div class="feature-item"><span>💻</span> محرر أكواد حقيقي</div>
        <div class="feature-item"><span>🤖</span> مساعد ذكي (AI)</div>
        <div class="feature-item"><span>🕶️</span> تجربة الواقع الافتراضي (VR)</div>
    </footer>
</body>
</html>
