<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest | رحلة الكود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 80px 5%; min-height: 80vh; background: linear-gradient(135deg, var(--bg-surface), var(--bg-base)); }
        .hero-content { max-width: 600px; }
        .hero-content h1 { font-size: 3rem; font-weight: 800; color: var(--text-main); margin-bottom: var(--space-4); line-height: 1.2; }
        .hero-content p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: var(--space-8); }
        .hero-actions { display: flex; gap: var(--space-4); }
        .hero-image { font-size: 15rem; color: var(--primary-main); filter: drop-shadow(0 20px 30px rgba(101,84,217,0.2)); }
        @media (max-width: 768px) { .hero { flex-direction: column; text-align: center; padding: 40px 20px; } .hero-content h1 { font-size: 2rem; } .hero-image { font-size: 8rem; margin-top: 40px; } .hero-actions { justify-content: center; flex-wrap: wrap; } }
    </style>
</head>
<body>
    <header style="padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); box-shadow: var(--shadow-sm);">
        <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary-main); display: flex; align-items: center; gap: 10px;">
            <i class="ri-code-box-fill"></i> CodeQuest
        </div>
        <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>اتعلّم البرمجة…<br>مغامرة صغيرة كل يوم!</h1>
            <p>انضم إلى كودي في رحلة ممتعة لتعلم لغات البرمجة، بناء الألعاب، وحل الألغاز. مصمم للأبطال الصغار من 8 إلى 14 سنة.</p>
            <div class="hero-actions">
                <a href="login.html" class="btn btn-primary" style="padding: 16px 32px; font-size: 1.2rem;">ابدأ المغامرة <i class="ri-rocket-line"></i></a>
                <a href="lessons.html" class="btn btn-secondary" style="padding: 16px 32px; font-size: 1.2rem;">جرّب درس مجاني</a>
            </div>
        </div>
        <div class="hero-image">
            <i class="ri-robot-2-fill"></i>
        </div>
    </section>
</body>
</html>
