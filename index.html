<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - لوحة البطل</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .hero-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--primary); }
        .hero-stats { display: flex; gap: 20px; font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 30px; max-width: 600px; margin: 0 auto; text-align: center; }
        .action-card { padding: 30px; border-radius: 20px; cursor: pointer; transition: transform 0.3s; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: white; background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(139, 92, 246, 0.1)); border: 1px solid var(--primary); }
        .action-card:hover { transform: scale(1.05); background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(139, 92, 246, 0.2)); }
        .action-icon { font-size: 4rem; margin-bottom: 15px; }
        .action-title { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="hero-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 2rem;" id="nav-avatar">👤</span>
            <span id="nav-username" style="font-weight: bold;">البطل</span>
        </div>
        <div class="hero-stats">
            <span>⭐ <span id="nav-points">0</span></span>
            <button onclick="Auth.logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;">خروج</button>
        </div>
    </div>

    <div class="dashboard animate-fade">
        <a href="studio.html" class="action-card card-glass">
            <span class="action-icon">🤖</span>
            <span class="action-title">اتعلم مع كودي (AI)</span>
        </a>
        <a href="games.html" class="action-card card-glass">
            <span class="action-icon">🎮</span>
            <span class="action-title">مركز الألعاب</span>
        </a>
        <a href="shop.html" class="action-card card-glass">
            <span class="action-icon">🛒</span>
            <span class="action-title">المتجر والمفاجآت</span>
        </a>
        <a href="avatar.html" class="action-card card-glass">
            <span class="action-icon">🦸‍♂️</span>
            <span class="action-title">تغيير الشخصية</span>
        </a>
    </div>

    <script>
        Auth.init((loggedIn) => {
            if(!loggedIn) window.location.href = 'login.html';
            else {
                const data = Auth.getUserData();
                if(data) {
                    document.getElementById('nav-username').innerText = data.username;
                    document.getElementById('nav-points').innerText = data.points || 0;
                    document.getElementById('nav-avatar').innerText = data.avatar || '👤';
                }
            }
        });
    </script>
    <script src="global.js"></script>
</body>
</html>
