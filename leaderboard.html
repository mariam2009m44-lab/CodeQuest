<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشرف | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">لوحة الشرف</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="display: flex; align-items: center; padding: 15px 20px; background: #FEF3C7; border-bottom: 1px solid var(--border-light);">
                <span style="font-size: 1.5rem; width: 40px;">🥇</span>
                <div style="flex: 1;">
                    <h4 style="color: var(--text-main);">النجم الساطع</h4>
                </div>
                <strong style="color: var(--reward);">2,500 XP</strong>
            </div>
            <div style="display: flex; align-items: center; padding: 15px 20px; background: #F1F5F9; border-bottom: 1px solid var(--border-light);">
                <span style="font-size: 1.5rem; width: 40px;">🥈</span>
                <div style="flex: 1;">
                    <h4 style="color: var(--text-main);">مبرمج المستقبل</h4>
                </div>
                <strong style="color: var(--text-muted);">2,100 XP</strong>
            </div>
            <div style="display: flex; align-items: center; padding: 15px 20px; background: #FFEDD5;">
                <span style="font-size: 1.5rem; width: 40px;">🥉</span>
                <div style="flex: 1;">
                    <h4 style="color: var(--text-main);">مريم (أنت)</h4>
                </div>
                <strong style="color: #EA580C;">1,250 XP</strong>
            </div>
        </div>
    </div>
</body>
</html>
