<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>لوحة الشرف | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --card-bg: rgba(255,255,255,0.03); }
        body { background: radial-gradient(circle at top, #0a192f 0%, var(--bg) 100%); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; box-sizing: border-box; }
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; }
        .header h1 { font-size: 1.8rem; color: var(--gold); margin: 0; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; text-decoration: none;}
        
        .leaderboard-container { width: 100%; max-width: 500px; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .player-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; transition: 0.3s; }
        .player-card:hover { transform: scale(1.02); border-color: var(--gold); }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .rank { font-size: 1.5rem; font-weight: bold; width: 30px; text-align: center; }
        .rank.gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .rank.silver { color: #c0c0c0; }
        .rank.bronze { color: #cd7f32; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--neon-cyan); }
        .name { font-weight: bold; font-size: 1.1rem; }
        .points { color: var(--gold); font-weight: bold; font-size: 1.2rem; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 65px; border-radius: 18px; background: transparent; color: #667; text-decoration: none; transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-btn i { font-size: 1.6rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.75rem; font-family: 'Cairo'; font-weight: bold; }
        .nav-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border-color: rgba(0, 229, 255, 0.4); transform: translateY(-5px); }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>
    <div class="header"><h1>🏆 لوحة الشرف</h1><a href="languages.html" class="btn-back">← رجوع</a></div>
    <div class="leaderboard-container" id="board">
        <p style="text-align:center; color:#aaa;">جاري تحميل أبطال الكود...</p>
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn active"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                loadLeaderboard();
            });
        });

        async function loadLeaderboard() {
            const board = document.getElementById('board');
            try {
                const snapshot = await firebase.firestore().collection('users').orderBy('points', 'desc').limit(10).get();
                board.innerHTML = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                    let avatar = data.avatar || 'cody-avatar.svg';
                    
                    board.innerHTML += `
                        <div class="player-card">
                            <div class="player-info">
                                <div class="rank ${rankClass}">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</div>
                                <img src="${avatar}" class="avatar">
                                <div class="name">${data.username || 'لاعب مجهول'}</div>
                            </div>
                            <div class="points">${data.points || 0} XP</div>
                        </div>
                    `;
                    rank++;
                });
            } catch(e) {
                console.error(e);
                board.innerHTML = '<p style="color:#ff4444; text-align:center;">حدث خطأ في تحميل البيانات. تأكدي من اتصال الإنترنت.</p>';
            }
        }
    </script>
</body></html>
