<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>لوحة الشرف</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" /><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script><link rel="stylesheet" href="global.css"></head><body><div class="header"><a href="languages.html" class="btn-back">رجوع</a><h1>الشرف 🏆</h1></div><div style="width:90%; max-width:500px; margin-top:20px;" id="board"><p style="text-align:center;">جاري التحميل...</p></div><div class="bottom-nav"><a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a><a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a><a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a><a href="leaderboard.html" class="nav-btn active"><i class="ri-trophy-line"></i><span>الشرف</span></a></div><script>Auth.init(async (l)=>{if(!l) window.location.href='index.html'; else { const s = await firebase.firestore().collection('users').orderBy('points','desc').limit(10).get(); const b = document.getElementById('board'); b.innerHTML=''; if(s.empty) b.innerHTML='<p style="text-align:center; color:#aaa;">لا يوجد أبطال بعد.</p>'; let r=1; s.forEach(d=>{const data=d.data(); b.innerHTML+=`<div style="background:rgba(255,255,255,0.1); padding:15px; margin-bottom:10px; border-radius:15px; display:flex; justify-content:space-between;"><span>#${r} ${data.username}</span><span style="color:#ffd700; font-weight:bold;">${data.points||0} XP</span></div>`; r++;}); }});</script></body></html>
