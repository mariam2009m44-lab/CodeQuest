<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة الشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
<style>body{background:#050914;color:#fff;font-family:Cairo;text-align:center;padding:20px;} .list{max-width:400px;margin:auto;} .row{background:rgba(255,255,255,0.05);margin-bottom:10px;padding:15px;border-radius:10px;display:flex;justify-content:space-between;font-weight:bold;}</style>
</head>
<body>
<h2 style="color:#ffd700;">🏆 أفضل 3 لاعبين</h2>
<button onclick="window.location.href='languages.html'" style="margin-bottom:20px;padding:10px;border-radius:10px;cursor:pointer;font-family:Cairo;">رجوع</button>
<div class="list" id="list">جاري التحميل...</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init(async (logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        try {
            const snap = await firebase.firestore().collection('users').orderBy('bonusPoints', 'desc').limit(3).get();
            let html = '';
            snap.forEach((doc, idx) => {
                html += '<div class="row"><span>' + (idx+1) + '. ' + doc.data().username + '</span><span style="color:#00e5ff;">' + (doc.data().bonusPoints||0) + ' نقطة</span></div>';
            });
            document.getElementById('list').innerHTML = html || 'لا يوجد لاعبين.';
        } catch(e) { document.getElementById('list').innerText = 'خطأ في التحميل'; }
    });
});
</script>
</body></html>
