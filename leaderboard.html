<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>لوحة الشرف</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" /><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script><link rel="stylesheet" href="global.css"></head><body><div class="header"><a href="languages.html" class="btn-back">رجوع</a><h1>الشرف 🏆</h1></div><div style="width:90%; max-width:500px; margin-top:20px;" id="board"><p style="text-align:center;">جاري التحميل...</p></div><div class="bottom-nav"><a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a><a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a><a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a><a href="leaderboard.html" class="nav-btn active"><i class="ri-trophy-line"></i><span>الشرف</span></a></div><script>Auth.init(async (l)=>{if(!l) window.location.href='index.html'; else { const s = await firebase.firestore().collection('users').orderBy('points','desc').limit(10).get(); const b = document.getElementById('board'); b.innerHTML=''; if(s.empty) b.innerHTML='<p style="text-align:center; color:#aaa;">لا يوجد أبطال بعد.</p>'; let r=1; s.forEach(d=>{const data=d.data(); b.innerHTML+=`<div style="background:rgba(255,255,255,0.1); padding:15px; margin-bottom:10px; border-radius:15px; display:flex; justify-content:space-between;"><span>#${r} ${data.username}</span><span style="color:#ffd700; font-weight:bold;">${data.points||0} XP</span></div>`; r++;}); }});</script>
<script>
    // كود عرض النقاط الحقيقية في الواجهة
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (window.Auth && Auth.getUserData()) {
                const points = Auth.getUserData().points || 0;
                // بندور على أي عنصر فيه كلمة "رصيدك" أو "0" ونغيره
                let el = document.getElementById('pointsDisplay');
                if(!el) {
                    // لو مفيش ID، هنكريت شارة صغيرة فوق الشمال تبان في كل الصفحات
                    el = document.createElement('div');
                    el.style.cssText = 'position:fixed; top:15px; left:15px; background:#FFD700; color:#000; padding:8px 15px; border-radius:20px; font-weight:bold; z-index:9999; font-family:Cairo, sans-serif; box-shadow: 0 4px 15px rgba(255,215,0,0.3);';
                    document.body.appendChild(el);
                }
                el.innerHTML = `⭐ رصيدك: ${points} XP`;
            }
        }, 1000); // نستنى ثانية عشان Firebase يحمل الداتا
    });
</script>

    <!-- Leaderboard Dynamic Injection -->
    <style>
        #dynamic-leaderboard { max-width: 700px; margin: 40px auto; padding: 20px; background: #0a0f1d; border-radius: 15px; border: 1px solid #00E5FF; font-family: 'Cairo', sans-serif; direction: rtl; box-shadow: 0 0 20px rgba(0,229,255,0.1); }
        #dynamic-leaderboard h2 { text-align: center; color: #FFD700; margin-bottom: 20px; font-size: 24px; }
        .lb-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border-radius: 10px; transition: transform 0.2s; }
        .lb-item:hover { transform: scale(1.02); background: rgba(255,255,255,0.08); }
        .lb-item.top-1 { border-right: 4px solid #FFD700; background: rgba(255, 215, 0, 0.1); }
        .lb-item.top-2 { border-right: 4px solid #C0C0C0; }
        .lb-item.top-3 { border-right: 4px solid #CD7F32; }
        .lb-name { font-weight: bold; color: #00E5FF; font-size: 18px; }
        .lb-points { color: #FFD700; font-weight: bold; font-size: 16px; }
    </style>

    <div id="dynamic-leaderboard">
        <h2>🏆 لوحة شرف الأبطال</h2>
        <div id="lb-content" style="color: white; text-align: center;">جاري تحميل بيانات الأبطال... ⏳</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // نستنى ثانية عشان نتأكد إن Firebase اشتغل
            setTimeout(async () => {
                const contentDiv = document.getElementById('lb-content');
                if (typeof firebase === 'undefined') {
                    contentDiv.innerHTML = "⚠️ خطأ: لم يتم الاتصال بقاعدة البيانات.";
                    return;
                }
                
                try {
                    // سحب أعلى 10 طلاب مرتبين حسب النقاط
                    const snapshot = await firebase.firestore().collection('users').orderBy('points', 'desc').limit(10).get();
                    
                    if (snapshot.empty) {
                        contentDiv.innerHTML = "لا يوجد أبطال بعد. كن أول من يجمع النقاط! 🚀";
                        return;
                    }

                    let html = '';
                    let rank = 1;
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                        let topClass = rank <= 3 ? `top-${rank}` : '';
                        
                        html += `
                            <div class="lb-item ${topClass}">
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <span style="font-size: 24px;">${medal}</span>
                                    <span class="lb-name">${user.username || 'طالب مجهول'}</span>
                                </div>
                                <div class="lb-points">${user.points || 0} XP ⭐</div>
                            </div>
                        `;
                        rank++;
                    });
                    contentDiv.innerHTML = html;
                } catch (e) {
                    console.error("Leaderboard Error:", e);
                    contentDiv.innerHTML = "حدث خطأ في جلب البيانات. تأكد من إعدادات الصلاحيات (Rules).";
                }
            }, 1500);
        });
    </script>
    </body>
    
</html>
