<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشرف | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">لوحة الشرف</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>

        <div class="card" id="leaderboardList" style="padding: 0; overflow: hidden;">
            <p style="padding: 20px; text-align: center; color: var(--text-muted);">جاري تحميل الأبطال...</p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/app.js';
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            try {
                const q = query(collection(db, "users"), orderBy("xp", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    list.innerHTML = '<p style="padding: 20px; text-align: center; color: var(--text-muted);">لا يوجد أبطال بعد. كن أول بطل!</p>';
                    return;
                }

                list.innerHTML = '';
                let rank = 1;
                const medals = ['🥇', '🥈', '🥉'];
                const bgColors = ['#FEF3C7', '#F1F5F9', '#FFEDD5'];

                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    const div = document.createElement('div');
                    div.style.cssText = `display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-light); background: ${rank <= 3 ? bgColors[rank-1] : 'transparent'};`;
                    
                    const medal = rank <= 3 ? medals[rank-1] : `<span style="width: 40px; text-align: center; font-weight: bold; color: var(--text-muted);">${rank}</span>`;
                    const name = user.displayName || "مستخدم مجهول";
                    const xp = user.xp || 0;

                    div.innerHTML = `
                        <span style="font-size: 1.5rem; width: 40px;">${medal}</span>
                        <div style="flex: 1; margin-right: 15px;">
                            <h4 style="color: var(--text-main); margin: 0;">${name}</h4>
                        </div>
                        <strong style="color: ${rank === 1 ? 'var(--reward)' : 'var(--text-muted)'};">${xp} XP</strong>
                    `;
                    list.appendChild(div);
                    rank++;
                });
            } catch (e) {
                list.innerHTML = '<p style="padding: 20px; color: red; text-align: center;">حدث خطأ في تحميل البيانات.</p>';
            }
        }
        loadLeaderboard();
    </script>
</body>
</html>
