<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | الشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
<style>
body{background:#050914;color:#fff;font-family:Cairo;text-align:center;padding:20px;background-image:radial-gradient(circle at 50% 0%, rgba(255,215,0,0.1) 0%, transparent 60%)}
h2{color:#ffd700;margin-bottom:30px;text-shadow:0 0
: 0 20px rgba(255,215,0,0.5);}
.list{max-width:400px;margin:auto;}
.row{background:rgba(255,255,255,0.05);margin-bottom:15px;padding:20px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.1);font-weight:bold;font-size:18px;}
.top-1{background:rgba(255,215,0,0.15);border-color:#ffd700;}
.top-2{background:rgba(192,192,192,0.15);border-color:#c0c0c0;}
.top-3{background:rgba(205,127,50,0.15);border-color:#cd7f32;}
.back-btn{background:#00e5ff;color:#000;border:none;padding:10px 20px;border-radius:20px;font-family:Cairo;font-weight:bold;cursor:pointer;margin-top:20px;}
</style>
</head>
<body>
<h2>🏆 أفضل 3 أبطال</h2>
<div class="list" id="list">جاري التحميل...</div>
<button class="back-btn" onclick="window.location.href='languages.html'">رجوع</button>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init(async (logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        try {
            const snap = await firebase.firestore().collection('users').orderBy('bonusPoints', 'desc').limit(3).get();
            let html = '';
            snap.forEach((doc, idx) => {
                let cls = idx === 0 ? 'top-1' : (idx === 1 ? 'top-2' : 'top-3');
                let medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : '🥉');
                html += `<div class="row ${cls}"><span>${medal} ${doc.data().username}</span><span style="color:#00e5ff;">${doc.data().bonusPoints||0} نقطة</span></div>`;
            });
            document.getElementById('list').innerHTML = html || 'لا يوجد لاعبين.';
        } catch(e) { document.getElementById('list').innerText = 'خطأ في التحميل'; }
    });
});
</script>
</body></html>
