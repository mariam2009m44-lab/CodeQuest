<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | لوحة الشرف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sfx.js"></script>
<script>if(!localStorage.getItem("cq_session")){window.location.href="index.html";}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#050914;color:#fff;min-height:100vh;padding:15px;overflow-x:hidden;background-image:radial-gradient(circle at 50% 0%, rgba(255,215,0,0.15) 0%, transparent 60%)}
.header-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;position:relative;z-index:2}
.back-btn{background:rgba(0,229,255,0.1);color:#00e5ff;border:1px solid rgba(0,229,255,0.4);padding:9px 16px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer;font-family:'Cairo',sans-serif;transition:0.3s}
.back-btn:hover{background:rgba(0,229,255,0.25)}
.header-title{flex:1;text-align:center;color:#ffd700;font-size:20px;font-weight:900;text-shadow:0 0 15px rgba(255,215,0,0.6)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-bottom:30px;position:relative;z-index:2;padding:0 5px}
.podium-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:120px}
.podium-avatar{width:70px;height:70px;border-radius:50%;background:#b6e3f4;border:4px solid;overflow:hidden;margin-bottom:8px;position:relative;transition:0.3s}
.podium-avatar img{width:100%;height:100%;object-fit:cover}
.podium-name{font-size:12px;font-weight:bold;color:#fff;margin-bottom:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.podium-score{font-size:14px;font-weight:900;color:#ffd700;margin-bottom:8px}
.podium-block{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:26px;font-weight:900;color:#050914;position:relative;overflow:hidden;box-shadow:0 -5px 20px rgba(0,0,0,0.4)}
.podium-block::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg, rgba(255,255,255,0.35), transparent 60%);pointer-events:none}
.podium-1 .podium-avatar{border-color:#ffd700;box-shadow:0 0 35px rgba(255,215,0,0.9);width:85px;height:85px;animation:crownFloat 2s ease-in-out infinite}
@keyframes crownFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.podium-1 .podium-block{background:linear-gradient(180deg, #ffd700, #d4a017);height:110px}
.podium-2 .podium-avatar{border-color:#c0c0c0;box-shadow:0 0 25px rgba(192,192,192,0.7)}
.podium-2 .podium-block{background:linear-gradient(180deg, #d8d8d8, #888);height:80px}
.podium-3 .podium-avatar{border-color:#cd7f32;box-shadow:0 0 25px rgba(205,127,50,0.7)}
.podium-3 .podium-block{background:linear-gradient(180deg, #e09a5a, #a0522d);height:60px}
.crown-top{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:26px;animation:crownFloat 1.5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,215,0,0.9))}
.my-rank-card{background:linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,114,255,0.08));border:2px solid #00e5ff;border-radius:20px;padding:18px;text-align:center;max-width:400px;margin:0 auto 20px;position:relative;z-index:2;box-shadow:0 0 30px rgba(0,229,255,0.3)}
.my-rank-label{color:#00e5ff;font-size:12px;font-weight:bold;margin-bottom:8px}
.my-rank-info{display:flex;align-items:center;justify-content:center;gap:15px}
.my-rank-avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#b6e3f4;border:3px solid #00e5ff}
.my-rank-avatar img{width:100%;height:100%;object-fit:cover}
.my-rank-name{font-size:16px;font-weight:900;color:#fff}
.my-rank-score{font-size:20px;font-weight:900;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.6)}
.my-rank-position{color:#a0aec0;font-size:12px;margin-top:6px}
.empty-msg{text-align:center;color:#a0aec0;font-size:14px;padding:60px 20px;position:relative;z-index:2}
.empty-msg .emoji{font-size:70px;display:block;margin-bottom:20px;animation:crownFloat 2s infinite}
.info-note{text-align:center;color:#666;font-size:11px;margin-top:20px;position:relative;z-index:2;padding:0 20px}
</style>
</head>
<body>

<div class="header-bar">
<button class="back-btn" onclick="playSound('click'); setTimeout(()=>window.location.href='languages.html',150)">← رجوع</button>
<div class="header-title">🏆 لوحة الشرف</div>
<div style="width:60px"></div>
</div>

<div id="podiumArea"></div>
<div id="myRankArea"></div>

<div class="info-note">🔒 يتم عرض أفضل 3 لاعبين فقط للحفاظ على الخصوصية</div>

<script>
const users = Auth.getUsers();
const currentUser = Auth.getCurrentUser();
const games = ['match', 'memory', 'bug', 'speed', 'quiz', 'build'];
const players = [];

Object.keys(users).forEach(name => {
    let total = 0;
    games.forEach(g => {
        total += parseInt(localStorage.getItem('cq_high_' + g) || '0');
    });
    const u = users[name];
    if (u && u.bonusPoints) total += u.bonusPoints;
    if (total > 0) players.push({ name: name, score: total });
});

players.sort((a, b) => b.score - a.score);

const podiumArea = document.getElementById('podiumArea');
const myRankArea = document.getElementById('myRankArea');

function getAvatarUrl(name) { return Auth.getAvatarUrl(name); }

if (players.length === 0) {
    podiumArea.innerHTML = '<div class="empty-msg"><span class="emoji">🏆</span>مفيش لاعبين لسه!<br>ابدأ العب عشان تكون أول بطل.</div>';
    myRankArea.innerHTML = '';
} else {
    const top3 = players.slice(0, 3);
    let podiumHtml = '<div class="podium">';
    let myRankInfo = -1;
    players.forEach((p, i) => {
        if (p.name === currentUser) myRankInfo = i + 1;
    });

    if (top3[1]) {
        podiumHtml += '<div class="podium-item podium-2">';
        podiumHtml += '<div class="podium-avatar"><img src="' + getAvatarUrl(top3[1].name) + '"></div>';
        podiumHtml += '<div class="podium-name">' + top3[1].name + '</div>';
        podiumHtml += '<div class="podium-score">' + top3[1].score + '</div>';
        podiumHtml += '<div class="podium-block">2</div>';
        podiumHtml += '</div>';
    } else {
        podiumHtml += '<div class="podium-item podium-2" style="opacity:0.3"><div class="podium-avatar"></div><div class="podium-name">-</div><div class="podium-score">0</div><div class="podium-block">2</div></div>';
    }

    if (top3[0]) {
        podiumHtml += '<div class="podium-item podium-1">';
        podiumHtml += '<div class="podium-avatar"><div class="crown-top">👑</div><img src="' + getAvatarUrl(top3[0].name) + '"></div>';
        podiumHtml += '<div class="podium-name">' + top3[0].name + '</div>';
        podiumHtml += '<div class="podium-score">' + top3[0].score + '</div>';
        podiumHtml += '<div class="podium-block">1</div>';
        podiumHtml += '</div>';
    } else {
        podiumHtml += '<div class="podium-item podium-1" style="opacity:0.3"><div class="podium-avatar"></div><div class="podium-name">-</div><div class="podium-score">0</div><div class="podium-block">1</div></div>';
    }

    if (top3[2]) {
        podiumHtml += '<div class="podium-item podium-3">';
        podiumHtml += '<div class="podium-avatar"><img src="' + getAvatarUrl(top3[2].name) + '"></div>';
        podiumHtml += '<div class="podium-name">' + top3[2].name + '</div>';
        podiumHtml += '<div class="podium-score">' + top3[2].score + '</div>';
        podiumHtml += '<div class="podium-block">3</div>';
        podiumHtml += '</div>';
    } else {
        podiumHtml += '<div class="podium-item podium-3" style="opacity:0.3"><div class="podium-avatar"></div><div class="podium-name">-</div><div class="podium-score">0</div><div class="podium-block">3</div></div>';
    }

    podiumHtml += '</div>';
    podiumArea.innerHTML = podiumHtml;

    if (myRankInfo > 0) {
        let myScore = 0;
        players.forEach(p => { if (p.name === currentUser) myScore = p.score; });
        let posText = '';
        if (myRankInfo === 1) posText = '🥇 إنت في المركز الأول!';
        else if (myRankInfo === 2) posText = '🥈 إنت في المركز التاني!';
        else if (myRankInfo === 3) posText = '🥉 إنت في المركز التالت!';
        else posText = 'إنت في المركز #' + myRankInfo + ' — كمّل عشان توصل للتلاتة الأوائل!';
        myRankArea.innerHTML = 
            '<div class="my-rank-card">' +
                '<div class="my-rank-label">⭐ مركزك</div>' +
                '<div class="my-rank-info">' +
                    '<div class="my-rank-avatar"><img src="' + getAvatarUrl(currentUser) + '"></div>' +
                    '<div>' +
                        '<div class="my-rank-name">' + currentUser + '</div>' +
                        '<div class="my-rank-score">' + myScore + ' نقطة</div>' +
                    '</div>' +
                '</div>' +
                '<div class="my-rank-position">' + posText + '</div>' +
            '</div>';
    }

    if (top3[0] && top3[0].name === currentUser) {
        setTimeout(() => {
            try { confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 }, colors: ['#ffd700', '#00e5ff', '#ffffff'] }); } catch(e) {}
        }, 500);
    }
}
</script>
</body>
</html>
