<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الشرف</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:20px;font-family:Cairo;text-align:center;}.row{background:rgba(255,255,255,0.05);padding:15px;margin-bottom:10px;border-radius:10px;display:flex;justify-content:space-between;max-width:400px;margin:auto;}</style></head><body><h2 style="color:#ffd700;">🏆 أفضل 3 أبطال</h2><div id="l"></div><button onclick="window.location.href='languages.html'" style="margin-top:20px;">رجوع</button><script>document.addEventListener('DOMContentLoaded',()=>{Auth.init(async(l)=>{if(!l)window.location.href='index.html';else{const s=await firebase.firestore().collection('users').orderBy('bonusPoints','desc').limit(3).get();let h='';s.forEach((d,i)=>{h+=`<div class="row"><span>${i===0?'🥇':i===1?'🥈':'🥉'} ${d.data().username}</span><span style="color:#00e5ff;">${d.data().bonusPoints||0}</span></div>`;});document.getElementById('l').innerHTML=h;}});});</script></body></html>
