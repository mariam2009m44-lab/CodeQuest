<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشرف - CodeQuest</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .leaderboard-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: var(--accent); text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .list-container { display: flex; flex-direction: column; gap: 15px; }
        .player-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; background: rgba(17, 24, 39, 0.7); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .player-row:hover { transform: scale(1.02); background: rgba(17, 24, 39, 0.9); }
        
        .player-info { display: flex; align-items: center; gap: 15px; }
        .rank { font-size: 1.5rem; font-weight: bold; width: 40px; text-align: center; }
        .avatar { font-size: 2rem; background: rgba(0,0,0,0.3); width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid var(--primary); }
        .username { font-weight: bold; font-size: 1.2rem; }
        .points { font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        
        /* تمييز المراكز الثلاثة الأولى */
        .top-1 { border-color: #FFD700; background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent); }
        .top-1 .rank, .top-1 .points { color: #FFD700; }
        .top-2 { border-color: #C0C0C0; background: linear-gradient(90deg, rgba(192, 192, 192, 0.1), transparent); }
        .top-2 .rank, .top-2 .points { color: #C0C0C0; }
        .top-3 { border-color: #CD7F32; background: linear-gradient(90deg, rgba(205, 127, 50, 0.1), transparent); }
        .top-3 .rank, .top-3 .points { color: #CD7F32; }
        
        .loading { text-align: center; color: var(--text-muted); font-size: 1.2rem; padding: 40px; }
    </style>
</head>
<body>
    <div class="leaderboard-container animate-fade">
        <div class="header">
            <a href="index.html" class="btn-secondary" style="text-decoration: none;">⬅️ رجوع للرئيسية</a>
            <h1>🏆 أبطال CodeQuest</h1>
            <div style="width: 100px;"></div> <!-- للتوازن -->
        </div>
        
        <div class="list-container" id="leaderboardList">
            <div class="loading">جاري تحميل بيانات الأبطال... ⏳</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // بنستنى ثانية عشان نتأكد إن Firebase اشتغل
            setTimeout(async () => {
                const listContainer = document.getElementById('leaderboardList');
                if (typeof firebase === 'undefined') {
                    listContainer.innerHTML = "<div class='loading' style='color:var(--danger);'>خطأ في الاتصال بقاعدة البيانات.</div>";
                    return;
                }
                
                try {
                    // سحب أعلى 10 طلاب مرتبين حسب النقاط
                    const snapshot = await firebase.firestore().collection('users').orderBy('points', 'desc').limit(10).get();
                    
                    if (snapshot.empty) {
                        listContainer.innerHTML = "<div class='loading'>لا يوجد أبطال بعد. كن أول من يجمع النقاط! 🚀</div>";
                        return;
                    }

                    let html = '';
                    let rank = 1;
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
                        let topClass = rank <= 3 ? `top-${rank}` : '';
                        let avatar = user.avatar || '👤';
                        let name = user.username || 'بطل مجهول';
                        let points = user.points || 0;
                        
                        html += `
                            <div class="player-row ${topClass}">
                                <div class="player-info">
                                    <span class="rank">${medal}</span>
                                    <span class="avatar">${avatar}</span>
                                    <span class="username">${name}</span>
                                </div>
                                <div class="points">${points} XP ⭐</div>
                            </div>
                        `;
                        rank++;
                    });
                    listContainer.innerHTML = html;
                } catch (e) {
                    console.error("Leaderboard Error:", e);
                    listContainer.innerHTML = "<div class='loading' style='color:var(--danger);'>حدث خطأ في جلب البيانات. تأكد من إعدادات Firebase Rules.</div>";
                }
            }, 1000);
        });
    </script>
    <script src="global.js"></script>
</body>
</html>
