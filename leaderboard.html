<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>لوحة الشرف | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.7); }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; font-size: 1.4rem; color: var(--gold); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .board-container { width: 90%; max-width: 500px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .player-row { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--neon-cyan); background: #000; }
        .player-name { font-weight: bold; font-size: 1.1rem; }
        .player-points { color: var(--gold); font-weight: bold; font-size: 1.2rem; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 65px; height: 60px; border-radius: 18px; color: #667; text-decoration: none; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; font-weight: bold; }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h1>🏆 لوحة الشرف</h1></div>
    <div class="board-container" id="board"><p style="text-align:center;">جاري التحميل...</p></div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn active"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const board = document.getElementById('board');
                try {
                    const snapshot = await firebase.firestore().collection('users').orderBy('points', 'desc').limit(10).get();
                    board.innerHTML = '';
                    let rank = 1;
                    if (snapshot.empty) { board.innerHTML = '<p style="text-align:center; color:#aaa;">لا يوجد أبطال حتى الآن. كن أولهم!</p>'; return; }
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        let avatar = data.avatar || 'cody-avatar.svg';
                        board.innerHTML += `
                            <div class="player-row">
                                <div class="player-info">
                                    <span style="color:var(--gold); font-weight:bold;">#${rank}</span>
                                    <img src="${avatar}" class="player-avatar">
                                    <span class="player-name">${data.username || 'لاعب'}</span>
                                </div>
                                <span class="player-points">${data.points || 0} XP</span>
                            </div>
                        `;
                        rank++;
                    });
                } catch(e) { board.innerHTML = '<p style="text-align:center; color:#ff4444;">خطأ في تحميل البيانات</p>'; }
            });
        });
    </script>
</body></html>
