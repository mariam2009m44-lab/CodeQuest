<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">الإعدادات</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h3 style="color: var(--text-main); margin-bottom: 5px;">المؤثرات الصوتية</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">تشغيل أصوات الألعاب والمحرر</p>
                </div>
                <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--primary-main);">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h3 style="color: var(--text-main); margin-bottom: 5px;">الوضع الداكن</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">تغيير مظهر المنصة</p>
                </div>
                <input type="checkbox" id="darkModeToggle" style="width: 20px; height: 20px; accent-color: var(--primary-main);">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="color: var(--text-main); margin-bottom: 5px;">حجم الخط</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">تكبير النصوص لتسهيل القراءة</p>
                </div>
                <select style="padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-light);">
                    <option>عادي</option>
                    <option>كبير</option>
                </select>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h3 style="color: var(--text-main); margin-bottom: 15px;">الخصوصية والأمان</h3>
            <a href="parent.html" style="display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--bg-base); border-radius: var(--radius-md); text-decoration: none; color: var(--text-main);">
                <span>لوحة ولي الأمر</span>
                <i class="ri-arrow-left-s-line"></i>
            </a>
        </div>

        <button class="btn" style="width: 100%; background: #FEE2E2; color: var(--danger); font-weight: bold;">تسجيل الخروج</button>
    </div>
    <script>
        const darkToggle = document.getElementById('darkModeToggle');
        darkToggle.addEventListener('change', (e) => {
            if(e.target.checked) {
                document.body.style.backgroundColor = '#0f172a';
                document.body.style.color = '#fff';
            } else {
                document.body.style.backgroundColor = '#F7F9FF';
                document.body.style.color = '#1E293B';
            }
        });
    </script>
</body>
</html>
