<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المشاريع | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; min-height: 100vh; background: #050914; }
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; }
        .btn-back { color: var(--primary); text-decoration: none; font-weight: bold; border: 1px solid var(--primary); padding: 5px 15px; border-radius: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center; position: relative;}
        .card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .card h3 { margin: 0 0 10px; color: #fff; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; flex: 1; }
        .btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; width: 100%; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 17, 40, 0.98); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass-border); z-index: 100; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-btn.active { color: var(--primary); }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <div class="header">
        <a href="dashboard.html" class="btn-back"><i class="ri-arrow-right-line"></i> رجوع</a>
        <h1>💼 المشاريع</h1>
        <div style="width: 50px;"></div>
    </div>

    <div class="grid" id="projectsGrid">
        <!-- كارت إنشاء مشروع جديد -->
        <div class="card" onclick="window.location.href='studio.html'" style="border-style: dashed;">
            <i class="ri-add-circle-line" style="color: var(--success);"></i>
            <h3 style="color: var(--success);">مشروع جديد</h3>
            <p>ابدأ مشروعاً من الصفر واكتب الكود بنفسك.</p>
        </div>
        <!-- المشاريع المحفوظة هتظهر هنا -->
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-btn"><i class="ri-home-4-line"></i><span>الرئيسية</span></a>
        <a href="languages.html" class="nav-btn"><i class="ri-book-open-line"></i><span>التعلم</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="projects.html" class="nav-btn active"><i class="ri-folder-3-line"></i><span>المشاريع</span></a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if(!logged) { window.location.href='login.html'; return; }
                
                const uid = Auth.getUserId();
                try {
                    const snapshot = await firebase.firestore().collection('users').doc(uid).collection('projects').orderBy('createdAt', 'desc').get();
                    const grid = document.getElementById('projectsGrid');
                    
                    snapshot.forEach(doc => {
                        const project = doc.data();
                        grid.innerHTML += `
                            <div class="card">
                                <i class="ri-code-box-line"></i>
                                <h3>${project.title}</h3>
                                <p>لغة: ${project.lang}</p>
                                <button class="btn" onclick="window.location.href='studio.html?project=${doc.id}'">فتح المشروع</button>
                            </div>
                        `;
                    });
                } catch(e) { console.error(e); }
            });
        });
    </script>

    
    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="games.html" class="mobile-nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
