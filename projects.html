<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاريعي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">مشاريعي</h1>
            <button class="btn btn-primary" onclick="createProject()"><i class="ri-add-line"></i> مشروع جديد</button>
        </div>
        
        <div id="projectsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc, setDoc, updateDoc } from './js/app.js';
        import { showToast } from './js/ui.js';
        import { collection, query, where, getDocs, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        let currentUser = null;
        let projects = [];

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadProjects();
            }
        });

        async function loadProjects() {
            const q = query(collection(db, "projects"), where("userId", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            projects = [];
            querySnapshot.forEach((doc) => {
                projects.push({ id: doc.id, ...doc.data() });
            });
            renderProjects();
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            if (projects.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1 / -1;">لا توجد مشاريع بعد. ابدأ بإنشاء مشروعك الأول!</p>';
                return;
            }
            projects.forEach((proj) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="font-size: 2rem; color: var(--primary-main); margin-bottom: 10px;"><i class="ri-folder-code-line"></i></div>
                    <h3 style="margin-bottom: 5px;">${proj.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">آخر تعديل: ${proj.date}</p>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" style="flex: 1; padding: 8px;" onclick="openProject('${proj.id}')">فتح</button>
                        <button class="btn btn-secondary" style="padding: 8px; color: var(--danger); border-color: var(--danger);" onclick="deleteProject('${proj.id}')"><i class="ri-delete-bin-line"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.createProject = async () => {
            const name = prompt('أدخل اسم المشروع الجديد:');
            if (name && currentUser) {
                const newProj = {
                    userId: currentUser.uid,
                    name: name,
                    date: new Date().toLocaleDateString('ar-EG'),
                    code: 'console.log("Hello CodeQuest");',
                    language: 'javascript'
                };
                await addDoc(collection(db, "projects"), newProj);
                showToast('تم إنشاء المشروع بنجاح!', 'success');
                await loadProjects();
            }
        };

        window.deleteProject = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا المشروع؟')) {
                await deleteDoc(doc(db, "projects", id));
                showToast('تم حذف المشروع.', 'info');
                await loadProjects();
            }
        };

        window.openProject = (id) => {
            const proj = projects.find(p => p.id === id);
            if (proj) {
                sessionStorage.setItem('playgroundCode', proj.code);
                sessionStorage.setItem('playgroundLang', proj.language || 'javascript');
                window.location.href = 'playground.html';
            }
        };
    </script>
</body>
</html>
