
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h1 style="color: var(--primary-main); font-size: 1.8rem; margin-bottom: var(--space-8); display: flex; align-items: center; gap: 8px;">
                <i class="ri-code-box-fill"></i> CodeQuest
            </h1>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item active"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="lessons.html" class="nav-item"><i class="ri-book-open-line"></i> مسار التعلم</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> ملعب الأكواد</a>
                <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
                <a href="projects.html" class="nav-item"><i class="ri-folder-code-line"></i> مشاريعي</a>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="window.logoutUser()" class="btn btn-secondary" style="width: 100%; border-color: var(--danger); color: var(--danger);">
                    <i class="ri-logout-box-r-line"></i> تسجيل الخروج
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2 style="font-size: 1.2rem; font-weight: 700;">مرحباً بك، <span class="js-user-name">بطل</span> 👋</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">جاهز لمغامرة برمجية جديدة اليوم؟</p>
                </div>
                <div style="display: flex; align-items: center; gap: var(--space-3);">
                    <div style="text-align: left;">
                        <p style="font-weight: 700; color: var(--reward);"><i class="ri-star-fill"></i> <span class="js-user-xp">0</span> XP</p>
                    </div>
                    <div style="width: 48px; height: 48px; border-radius: 50%; background-color: var(--primary-main); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                        <i class="ri-user-smile-line"></i>
                    </div>
                </div>
            </header>

            <div class="grid-dashboard">
                <div class="card stat-card">
                    <div class="stat-icon primary"><i class="ri-fire-fill"></i></div>
                    <div class="stat-info">
                        <h4>أيام متتالية</h4>
                        <p>5</p>
                    </div>
                </div>
                <div class="card stat-card">
                    <div class="stat-icon success"><i class="ri-check-double-line"></i></div>
                    <div class="stat-info">
                        <h4>دروس مكتملة</h4>
                        <p>12</p>
                    </div>
                </div>
                <div class="card stat-card">
                    <div class="stat-icon reward"><i class="ri-medal-fill"></i></div>
                    <div class="stat-info">
                        <h4>المستوى الحالي</h4>
                        <p>3</p>
                    </div>
                </div>
            </div>

            <div class="card" style="background: linear-gradient(135deg, rgba(101, 84, 217, 0.05), rgba(15, 139, 141, 0.05)); display: flex; justify-content: space-between; align-items: center; padding: var(--space-8);">
                <div>
                    <h3 style="font-size: 1.5rem; margin-bottom: var(--space-2); color: var(--primary-main);">أكمل مغامرتك!</h3>
                    <p style="color: var(--text-muted); margin-bottom: var(--space-4);">الدرس القادم: المتغيرات في JavaScript</p>
                    <a href="lecture.html" class="btn btn-primary">ابدأ الدرس الآن <i class="ri-arrow-left-line"></i></a>
                </div>
                <div style="font-size: 4rem; color: var(--primary-main); opacity: 0.2;">
                    <i class="ri-rocket-line"></i>
                </div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-item active"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>التعلم</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-terminal-box-line"></i><span>الملعب</span></a>
        <a href="projects.html" class="mobile-nav-item"><i class="ri-folder-code-line"></i><span>مشاريعي</span></a>
    </nav>

    <script type="module">
        import { initApp, logoutUser } from './js/app.js';
        window.logoutUser = logoutUser;
        initApp();
    </script>
</body>
</html>
