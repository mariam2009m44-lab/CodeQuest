<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background-color: var(--bg-deep); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-panel); border-left: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: var(--space-m); z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: var(--space-xl); padding: 0 var(--space-s); }
        .nav-menu { display: flex; flex-direction: column; gap: var(--space-xs); flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-button); color: var(--text-secondary); font-weight: 600; transition: 0.2s; cursor: pointer; text-decoration: none; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 217, 255, 0.1); color: var(--primary); }
        .logout-btn { margin-top: auto; color: var(--accent-coral); background: rgba(255, 107, 107, 0.1); }
        .main-content { flex: 1; overflow-y: auto; padding: var(--space-l); display: flex; flex-direction: column; gap: var(--space-l); }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 15px 25px; border-radius: var(--radius-card); border: 1px solid var(--border-soft); }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--bg-deep); }
        .stats-bar { display: flex; gap: var(--space-m); }
        .stat-pill { background: var(--bg-deep); padding: 8px 16px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-soft); font-weight: 700; }
        .stat-pill i { color: var(--accent-yellow); }
        .stat-pill.xp i { color: var(--primary); }
        .hero-section { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-m); }
        .main-card { background: linear-gradient(135deg, rgba(14, 23, 64, 1), rgba(118, 87, 255, 0.15)); border: 1px solid var(--accent-purple); border-radius: var(--radius-card); padding: var(--space-l); position: relative; overflow: hidden; }
        .main-card h1 { font-size: 2rem; color: var(--text-primary); margin-bottom: 10px; }
        .main-card p { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 25px; max-width: 80%; }
        .cody-bg { position: absolute; left: -20px; bottom: -20px; font-size: 10rem; color: rgba(255,255,255,0.05); transform: rotate(-15deg); pointer-events: none; }
        .quick-access { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-m); }
        .qa-card { background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-m); display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.3s; text-decoration: none; }
        .qa-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .qa-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 15px; }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { display: none; } .main-content { padding: var(--space-m); } .hero-section, .quick-access { grid-template-columns: 1fr; } .topbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area"><i class="ri-code-box-fill"></i> CodeQuest</div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item active"><i class="ri-home-5-line"></i> الرئيسية</a>
            <a href="languages.html" class="nav-item"><i class="ri-map-2-line"></i> مسار التعلم</a>
            <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
            <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
            <a href="shop.html" class="nav-item"><i class="ri-store-3-line"></i> المتجر</a>
            <a href="profile.html" class="nav-item"><i class="ri-user-smile-line"></i> ملفي الشخصي</a>
        </nav>
        <a href="#" onclick="logoutUser()" class="nav-item logout-btn"><i class="ri-logout-box-r-line"></i> تسجيل الخروج</a>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div class="user-info">
                <div class="user-avatar" id="dashAvatar">🤖</div>
                <div>
                    <h2 style="font-size: 1.2rem; color: var(--text-primary); margin: 0;">مرحباً، <span class="js-user-name">بطل</span> 👋</h2>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin: 0;">مستعد لمغامرة جديدة اليوم؟</p>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stat-pill"><i class="ri-coins-fill"></i> <span class="js-user-coins">0</span></div>
                <div class="stat-pill xp"><i class="ri-star-fill"></i> <span class="js-user-xp">0</span> XP</div>
            </div>
        </header>
        <section class="hero-section">
            <div class="main-card">
                <h1>أكمل مغامرتك!</h1>
                <p>أنت على بعد خطوة واحدة من إتقان لغة جديدة. الدرس التالي ينتظرك.</p>
                <button class="btn-primary" onclick="window.location.href='languages.html'">استكمال التعلم <i class="ri-arrow-left-line"></i></button>
                <i class="ri-robot-2-fill cody-bg"></i>
            </div>
            <div style="background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-l); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <i class="ri-fire-fill" style="font-size: 3rem; color: var(--accent-orange); margin-bottom: 15px;"></i>
                <h3 style="color: var(--text-primary); margin-bottom: 5px;">مهمة اليوم</h3>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px;">أكمل درساً واحداً اليوم!</p>
                <button class="btn-secondary" onclick="window.location.href='languages.html'">اذهب للدروس</button>
            </div>
        </section>
        <section class="quick-access">
            <a href="languages.html" class="qa-card"><div class="qa-icon" style="background: rgba(0, 217, 255, 0.1); color: var(--primary);"><i class="ri-book-open-line"></i></div><div style="color: var(--text-primary); font-weight: 700;">الدروس</div></a>
            <a href="playground.html" class="qa-card"><div class="qa-icon" style="background: rgba(118, 87, 255, 0.1); color: var(--accent-purple);"><i class="ri-code-s-slash-line"></i></div><div style="color: var(--text-primary); font-weight: 700;">الملعب</div></a>
            <a href="games.html" class="qa-card"><div class="qa-icon" style="background: rgba(255, 159, 67, 0.1); color: var(--accent-orange);"><i class="ri-gamepad-line"></i></div><div style="color: var(--text-primary); font-weight: 700;">الألعاب</div></a>
            <a href="shop.html" class="qa-card"><div class="qa-icon" style="background: rgba(255, 203, 87, 0.1); color: var(--accent-yellow);"><i class="ri-shopping-bag-3-line"></i></div><div style="color: var(--text-primary); font-weight: 700;">المتجر</div></a>
        </section>
    </main>
    <script type="module">
        import { initApp, logoutUser } from './js/app.js';
        window.logoutUser = logoutUser;
        initApp();

        const avatarMap = { 'crown': '👑', 'glasses': '👓', 'stars': '✨', 'suit': '🧥', 'cody': '🤖', 'layla': '👩‍💻', 'omar': '👨‍🚀', 'sara': '🧚‍♀️', 'robo': '🦾', 'nova': '👽' };
        const savedAvatar = localStorage.getItem('cq_avatar') || 'cody';
        document.getElementById('dashAvatar').innerText = avatarMap[savedAvatar] || '🤖';
    </script>
</body>
</html>
