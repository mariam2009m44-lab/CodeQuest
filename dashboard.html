<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="desktop-sidebar">
        <div style="color:var(--primary); font-size:1.5rem; font-weight:900; margin-bottom:30px;"><i class="ri-robot-line"></i> CodeQuest</div>
        <a href="dashboard.html" class="sidebar-link active"><i class="ri-home-4-line"></i> الرئيسية</a>
        <a href="languages.html" class="sidebar-link"><i class="ri-road-map-line"></i> مسار التعلم</a>
        <a href="games.html" class="sidebar-link"><i class="ri-gamepad-line"></i> مركز الألعاب</a>
        <a href="profile.html" class="sidebar-link"><i class="ri-user-3-line"></i> ملفي</a>
                    <a href="settings.html" class="sidebar-link"><i class="ri-settings-4-line"></i> الإعدادات</a>
            <a href="#" onclick="Auth.logout()" class="sidebar-link" style="margin-top:auto; color:var(--danger);"><i class="ri-logout-box-r-line"></i> خروج</a>
    </div>

    <div class="main-content" style="padding-bottom: 80px;">
        <header style="display:flex; justify-content:space-between; align-items:center; background:var(--glass); padding:15px 20px; border-radius:15px; border:1px solid var(--glass-border); margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:15px;">
                <img src="cody-avatar.svg" id="nav-avatar" style="width:50px; height:50px; border-radius:50%; border:2px solid var(--primary);">
                <div>
                    <h3 id="nav-name" style="margin:0; font-size:1.1rem;">جاري التحميل...</h3>
                    <span style="color:var(--text-muted); font-size:0.85rem;">مبرمج طموح 🚀</span>
                </div>
            </div>
            <div style="background:rgba(0,0,0,0.5); border:1px solid var(--gold); padding:8px 15px; border-radius:10px; color:var(--gold); font-weight:bold;">
                <i class="ri-star-fill"></i> <span id="nav-pts">0</span> XP
            </div>
        </header>

        <div class="glass-card" style="background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(0,229,255,0.1)); text-align:center; padding:40px 20px; margin-bottom:20px;">
            <h1 style="color:#fff; margin-bottom:10px;">مرحباً، <span id="hero-name" style="color:var(--primary);">البطل</span>! 👋</h1>
            <p style="color:var(--text-muted); margin-bottom:20px;">أنت على بعد خطوة واحدة من تحقيق حلمك.</p>
            <a href="languages.html" class="btn btn-primary">🚀 أكمل التعلم</a>
        </div>

        <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:15px;">
            <a href="languages.html" class="glass-card" style="text-align:center; padding:20px; color:#fff; border-color:var(--primary);">
                <i class="ri-book-open-line" style="font-size:2rem; color:var(--primary); margin-bottom:10px; display:block;"></i> المسارات
            </a>
            <a href="games.html" class="glass-card" style="text-align:center; padding:20px; color:#fff; border-color:var(--gold);">
                <i class="ri-gamepad-line" style="font-size:2rem; color:var(--gold); margin-bottom:10px; display:block;"></i> الألعاب
            </a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="active"><i class="ri-home-4-line"></i> الرئيسية</a>
        <a href="languages.html"><i class="ri-book-open-line"></i> التعلم</a>
        <a href="games.html"><i class="ri-gamepad-line"></i> الألعاب</a>
        <a href="profile.html"><i class="ri-user-3-line"></i> ملفي</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const av = localStorage.getItem('cq_avatar'); if(av) document.getElementById('nav-avatar').src = av;
            Auth.init(async (logged) => {
                if(!logged) return window.location.href = 'login.html';
                try {
                    const doc = await firebase.firestore().collection('users').doc(Auth.getUserId()).get();
                    if(doc.exists) {
                        const d = doc.data();
                        document.getElementById('nav-name').innerText = d.username || 'البطل';
                        document.getElementById('hero-name').innerText = d.username || 'البطل';
                        document.getElementById('nav-pts').innerText = d.points || 0;
                        if(d.avatar) document.getElementById('nav-avatar').src = d.avatar;
                    }
                } catch(e) { console.error(e); }
            });
        });
    </script>
</body></html>
