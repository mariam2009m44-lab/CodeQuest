<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الامتحان | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; background: #0a1128; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--glass); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--glass-border); }
        .header h1 { color: #ef4444; margin: 0; font-size: 1.3rem; }
        .header a { color: var(--primary); text-decoration: none; font-weight: bold; }
        
        .exam-container { max-width: 600px; margin: 0 auto; width: 100%; }
        .question-card { background: #fff; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; animation: popIn 0.4s;}
        .question-card.active { display: block; }
        
        .q-title { font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 20px; }
        .q-option { background: #f3f4f6; border: 2px solid transparent; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-weight: bold; color: #4b5563; transition: 0.2s;}
        .q-option:hover { background: #e5e7eb; }
        
        .result-screen { display: none; text-align: center; background: #fff; padding: 40px 20px; border-radius: 30px; max-width: 500px; margin: 0 auto; }
        .result-screen h1 { color: #10b981; font-size: 2.5rem; margin-bottom: 10px; }
        .result-screen p { font-size: 1.2rem; color: #666; margin-bottom: 20px; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <header class="header">
        <a href="levels.html"><i class="ri-arrow-right-line"></i> رجوع للفصول</a>
        <h1>📝 الامتحان النهائي</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="exam-container" id="examContainer"></div>

    <div class="result-screen" id="resultScreen">
        <h1>🏆 عاش يا بطل!</h1>
        <p>لقد أكملت الامتحان بنجاح.</p>
        <p>نتيجتك: <span id="scoreText" style="color:#ef4444; font-weight:bold;">0</span></p>
        <button class="btn btn-primary" onclick="window.location.href='levels.html'">العودة للفصول 🚀</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang') || 'JavaScript';
        if (lang === 'C') lang = 'C++';
        const chIndex = parseInt(urlParams.get('ch')) || 0;
        
        let jsonFile = 'js_curriculum.json';
        if (lang === 'Python') jsonFile = 'python_curriculum.json';
        else if (lang === 'C++') jsonFile = 'cpp_curriculum.json';

        let questions = [];
        let currentQ = 0;
        let score = 0;
        const examContainer = document.getElementById('examContainer');

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.init(l => { if(!l) window.location.href='login.html'; });
            
            // بنجيب كل دروس الفصل ده
            const res = await fetch(jsonFile);
            const data = await res.json();
            const chapter = data.chapters[chIndex];
            
            // بنجمع كل الأسئلة من كل الدروس
            chapter.lessons.forEach(lesson => {
                questions.push(lesson.quiz);
            });

            // لو مفيش أسئلة كفاية، بنضيف أسئلة عشوائية أو نكتفي بالموجود
            showQuestion();
        });

        function showQuestion() {
            if (currentQ >= questions.length) {
                endExam();
                return;
            }

            const q = questions[currentQ];
            const card = document.createElement('div');
            card.className = 'question-card active';
            
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `<div class="q-option" onclick="checkAnswer(${i}, this)">${opt}</div>`;
            });
            
            card.innerHTML = `
                <div class="q-title">السؤال ${currentQ + 1} من ${questions.length}: ${q.q}</div>
                ${optionsHtml}
            `;
            
            // مسح السؤال القديم وإضافة الجديد
            examContainer.innerHTML = '';
            examContainer.appendChild(card);
        }

        function checkAnswer(selected, btnElement) {
            const q = questions[currentQ];
            if(selected === q.a) {
                btnElement.style.background = '#d1fae5';
                btnElement.style.borderColor = '#10b981';
                score++;
            } else {
                btnElement.style.background = '#fee2e2';
                btnElement.style.borderColor = '#ef4444';
                // نظهر الإجابة الصح
                btnElement.parentElement.children[q.a + 1].style.background = '#d1fae5'; // +1 عشان الـ title
            }
            
            // منع الضغط تاني
            document.querySelectorAll('.q-option').forEach(el => el.style.pointerEvents = 'none');
            
            setTimeout(() => {
                currentQ++;
                showQuestion();
            }, 1000);
        }

        
        async function endExam() {
            document.getElementById('examContainer').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            
            const passMark = Math.ceil(questions.length * 0.5); // 50% للنجاح
            const isPassed = score >= passMark;
            
            document.getElementById('scoreText').innerText = score + " / " + questions.length;
            
            const titleEl = document.querySelector('.result-screen h1');
            const msgEl = document.querySelector('.result-screen p:first-of-type');
            
            if(isPassed) {
                titleEl.innerText = "🏆 عاش يا بطل!";
                titleEl.style.color = "#10b981";
                msgEl.innerText = "لقد نجحت في الامتحان بتفوق!";
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
                
                const uid = Auth.getUserId();
                if(uid) {
                    await firebase.firestore().collection('users').doc(uid).update({
                        points: firebase.firestore.FieldValue.increment(100)
                    });
                }
            } else {
                titleEl.innerText = "❌ للأسف، لم تنجح";
                titleEl.style.color = "#ef4444";
                msgEl.innerText = "تحتاج لمراجعة الدروس والمحاولة مرة أخرى.";
            }
        }
    
    </script>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="games.html" class="mobile-nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
