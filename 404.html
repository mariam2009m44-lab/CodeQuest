<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضائع في الفضاء | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: var(--bg-deep); display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; background-image: radial-gradient(circle at center, rgba(118, 87, 255, 0.15), transparent 60%); }
        .error-container { max-width: 500px; padding: var(--space-l); }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: var(--space-m); filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.4)); }
        .error-title { font-size: 2rem; color: var(--text-primary); margin-bottom: var(--space-s); }
        .error-desc { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: var(--space-xl); line-height: 1.6; }
        .cody-lost { font-size: 5rem; color: var(--accent-purple); margin-bottom: var(--space-m); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="cody-lost"><i class="ri-robot-2-fill"></i></div>
        <div class="error-code">404</div>
        <h1 class="error-title">ضاعت في الفضاء!</h1>
        <p class="error-desc">يبدو أن كودي أخذك إلى كوكب غير موجود. لا تقلق، يمكننا العودة إلى المسار الصحيح.</p>
        <a href="dashboard.html" class="btn-primary" style="font-size: 1.2rem; padding: 16px 32px;"><i class="ri-rocket-line"></i> العودة إلى القاعدة</a>
    </div>
</body>
</html>
