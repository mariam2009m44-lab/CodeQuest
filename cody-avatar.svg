<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- الرأس -->
  <rect x="15" y="25" width="70" height="55" rx="25" fill="#111" stroke="url(#grad1)" stroke-width="3"/>
  <!-- الشاشة -->
  <rect x="25" y="35" width="50" height="35" rx="15" fill="#050914"/>
  <!-- العينين -->
  <circle cx="40" cy="52" r="5" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="52" r="5" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- الابتسامة -->
  <path d="M 40 62 Q 50 70 60 62" stroke="#00e5ff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- الهوائيات -->
  <line x1="30" y1="25" x2="25" y2="15" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="25" cy="15" r="3" fill="#00e5ff"/>
  <line x1="70" y1="25" x2="75" y2="15" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="15" r="3" fill="#00e5ff"/>
</svg>