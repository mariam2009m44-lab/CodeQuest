<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">
    <div class="auth-container">
        <div class="auth-card">
            <h2>أهلاً بعودتك!</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" required placeholder="example@email.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-full">دخول إلى عالم كودي</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.9rem;">ليس لديك حساب؟ <a href="signup.html" style="color: var(--light-primary); font-weight: bold;">سجل الآن</a></p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('cq_user', 'بطل');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
