<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; }
        .img-side { flex: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #0a192f, #050914); }
        .img-side img { width: 80%; max-width: 400px; animation: float 4s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .form-side { flex: 1; display: flex; justify-content: center; align-items: center; background: #050914; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-group input { width: 100%; padding: 15px 45px 15px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: var(--primary); }
        @media (max-width: 768px) { .img-side { display: none; } }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

    <!-- DRACONIAN CSS TO HIDE MOBILE NAV -->
    <style>
        /* إخفاء الشريط السفلي نهائياً في الصفحة دي */
        body .mobile-bottom-nav, 
        .mobile-bottom-nav,
        nav.mobile-bottom-nav {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="page-login">
    <div class="img-side"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cody&backgroundColor=00e5ff"></div>
    <div class="form-side">
        <div class="login-box">
            <div style="color:var(--primary); font-size:2rem; font-weight:900; margin-bottom:20px; text-align:center;"><i class="ri-robot-line"></i> CodeQuest</div>
            <h2 id="title" style="text-align:center; margin-bottom:30px;">تسجيل الدخول</h2>
            <div class="input-group"><i class="ri-user-line"></i><input type="text" id="username" placeholder="اسم المستخدم"></div>
            <div class="input-group"><i class="ri-lock-line"></i><input type="password" id="password" placeholder="كلمة المرور"></div>
            <button class="btn btn-primary" style="width:100%;" id="btn" onclick="handleAuth()">دخول 🚀</button>
            <p style="text-align:center; margin-top:20px; color:var(--text-muted); cursor:pointer;" onclick="toggle()" id="toggleText">ليس لديك حساب؟ سجل الآن</p>
        </div>
    </div>
    <script>
        let isLogin = true;
        function toggle() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
            document.getElementById('btn').innerText = isLogin ? 'دخول 🚀' : 'تسجيل 🚀';
            document.getElementById('toggleText').innerText = isLogin ? 'ليس لديك حساب؟ سجل الآن' : 'لديك حساب؟ سجل دخول';
        }
        async function handleAuth() {
            const u = document.getElementById('username').value; const p = document.getElementById('password').value;
            if(!u || !p) return alert("املأ البيانات!");
            document.getElementById('btn').innerText = 'جاري التحميل...';
            
            const res = isLogin ? await Auth.loginUser(u, p) : await Auth.registerUser(u, p);
            if(res.success) {
                window.location.href = localStorage.getItem('cq_avatar') ? 'dashboard.html' : 'avatar.html';
            } else {
                alert(res.message); document.getElementById('btn').innerText = isLogin ? 'دخول 🚀' : 'تسجيل 🚀';
            }
        }
    </script>

    
    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    
</body></html>
