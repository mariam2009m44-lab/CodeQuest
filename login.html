<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4F46E5; --text-main: #1F2937; --text-muted: #6B7280; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #F8FAFC; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; border: 1px solid #E2E8F0; }
        .auth-card h2 { color: var(--text-main); margin-bottom: 25px; font-size: 1.8rem; font-weight: 800; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        .input-field { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #D1D5DB; font-size: 1rem; outline: none; transition: 0.2s; background: #F9FAFB; }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); background: white; }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }
        .btn-submit:hover { background: #4338CA; transform: translateY(-2px); }
        .auth-links { margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-links a { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>أهلاً بعودتك!</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" class="input-field" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" class="input-field" placeholder="********" required>
            </div>
            <button type="submit" class="btn-submit">دخول إلى عالم كودي</button>
        </form>
        <div class="auth-links">
            ليس لديك حساب؟ <a href="signup.html">سجل الآن</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-submit');
            btn.innerText = 'جاري الدخول...';
            setTimeout(() => {
                localStorage.setItem('cq_user', 'Hero');
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>
</html>
