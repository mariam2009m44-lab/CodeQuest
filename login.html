<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-base); }
        .auth-card { background: var(--bg-surface); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; text-align: center; }
        .auth-card h2 { margin-bottom: var(--space-6); color: var(--primary-main); }
        .form-group { margin-bottom: var(--space-4); text-align: right; }
        .form-group label { display: block; margin-bottom: var(--space-2); font-weight: 600; color: var(--text-main); }
        .auth-links { margin-top: var(--space-4); font-size: 0.9rem; color: var(--text-muted); }
        .auth-links a { color: var(--primary-main); font-weight: 600; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6554D9">
</head>
<body>
    <div class="auth-card">
        <h2>أهلاً بك مجدداً!</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" class="input-field" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" class="input-field" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">دخول</button>
        </form>
        <div class="auth-links">
            ليس لديك حساب؟ <a href="#">سجل الآن</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
