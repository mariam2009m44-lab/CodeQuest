<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .store-item { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 20px; text-align: center; border: 1px solid var(--border-light); transition: var(--transition); }
        .store-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .item-icon { font-size: 3rem; margin-bottom: 15px; }
        .item-price { display: inline-block; background: var(--reward-bg); color: var(--reward); padding: 4px 12px; border-radius: 20px; font-weight: 700; margin-bottom: 15px; }
    </style>
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 style="color: var(--text-main);">متجر كودي</h1>
                <p style="color: var(--text-muted);">اشتري أشكال جديدة لملفك الشخصي</p>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="card" style="padding: 10px 20px; margin: 0; display: flex; align-items: center; gap: 10px;">
                    <i class="ri-coins-fill" style="color: var(--reward); font-size: 1.5rem;"></i>
                    <strong id="userCoins" style="font-size: 1.2rem; color: var(--text-main);">0</strong>
                </div>
                <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
            </div>
        </header>

        <div class="store-grid">
            <div class="store-item">
                <div class="item-icon">👩‍🚀</div>
                <h3 style="color: var(--text-main); margin-bottom: 10px;">رائد فضاء</h3>
                <div class="item-price"><i class="ri-coins-fill"></i> 150</div>
                <button class="btn btn-primary buy-btn" onclick="buyItem('astronaut', 150)" style="width: 100%;">شراء</button>
            </div>
            <div class="store-item">
                <div class="item-icon">🦊</div>
                <h3 style="color: var(--text-main); margin-bottom: 10px;">ثعلب ذكي</h3>
                <div class="item-price"><i class="ri-coins-fill"></i> 200</div>
                <button class="btn btn-primary buy-btn" onclick="buyItem('fox', 200)" style="width: 100%;">شراء</button>
            </div>
            <div class="store-item">
                <div class="item-icon">🤖</div>
                <h3 style="color: var(--text-main); margin-bottom: 10px;">روبوت متقدم</h3>
                <div class="item-price"><i class="ri-coins-fill"></i> 300</div>
                <button class="btn btn-primary buy-btn" onclick="buyItem('robot', 300)" style="width: 100%;">شراء</button>
            </div>
            <div class="store-item">
                <div class="item-icon">🐉</div>
                <h3 style="color: var(--text-main); margin-bottom: 10px;">تنين الكود</h3>
                <div class="item-price"><i class="ri-coins-fill"></i> 500</div>
                <button class="btn btn-primary buy-btn" onclick="buyItem('dragon', 500)" style="width: 100%;">شراء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { showToast, showLoader } from './js/ui.js';

        let coins = parseInt(localStorage.getItem('cq_coins')) || 500;
        document.getElementById('userCoins').innerText = coins;

        window.buyItem = (itemId, price) => {
            if (coins < price) {
                showToast('عذراً، لا تمتلك نقاط كافية!', 'error');
                return;
            }

            coins -= price;
            localStorage.setItem('cq_coins', coins);
            document.getElementById('userCoins').innerText = coins;
            
            let inventory = JSON.parse(localStorage.getItem('cq_inventory')) || [];
            if (!inventory.includes(itemId)) {
                inventory.push(itemId);
                localStorage.setItem('cq_inventory', JSON.stringify(inventory));
            }

            showToast('تم الشراء بنجاح! استمتع بشكلك الجديد 🎉', 'success');
        };

        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
