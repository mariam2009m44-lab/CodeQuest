<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .store-item { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 20px; text-align: center; border: 1px solid var(--border-light); transition: var(--transition); }
        .store-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
        .item-icon { font-size: 3rem; margin-bottom: 15px; }
        .item-price { display: inline-block; background: var(--reward-bg); color: var(--reward); padding: 4px 12px; border-radius: 20px; font-weight: 700; margin-bottom: 15px; }
    </style>
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 style="color: var(--text-main);">متجر كودي</h1>
                <p style="color: var(--text-muted);">اشتري أشكال جديدة لملفك الشخصي</p>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="card" style="padding: 10px 20px; margin: 0; display: flex; align-items: center; gap: 10px;">
                    <i class="ri-coins-fill" style="color: var(--reward); font-size: 1.5rem;"></i>
                    <strong id="userCoins" class="js-user-coins" style="font-size: 1.2rem; color: var(--text-main);">0</strong>
                </div>
                <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
            </div>
        </header>

        <div class="store-grid" id="storeGrid"></div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc, updateDoc, increment } from './js/app.js';
        import { showToast } from './js/ui.js';

        const items = [
            { id: 'astronaut', name: 'رائد فضاء', icon: '👩‍🚀', price: 150 },
            { id: 'fox', name: 'ثعلب ذكي', icon: '🦊', price: 200 },
            { id: 'robot', name: 'روبوت متقدم', icon: '🤖', price: 300 },
            { id: 'dragon', name: 'تنين الكود', icon: '🐉', price: 500 }
        ];

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.data() || {};
                let coins = userData.coins || 0;
                let inventory = userData.inventory || [];

                document.getElementById('userCoins').innerText = coins;
                renderStore(items, coins, inventory, user.uid);
            }
        });

        function renderStore(itemsList, currentCoins, inventory, uid) {
            const grid = document.getElementById('storeGrid');
            grid.innerHTML = '';
            
            itemsList.forEach(item => {
                const owned = inventory.includes(item.id);
                const div = document.createElement('div');
                div.className = 'store-item';
                div.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <h3 style="color: var(--text-main); margin-bottom: 10px;">${item.name}</h3>
                    <div class="item-price"><i class="ri-coins-fill"></i> ${item.price}</div>
                    <button class="btn ${owned ? 'btn-secondary' : 'btn-primary'}" style="width: 100%;" ${owned ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, ${currentCoins}, '${uid}')">
                        ${owned ? 'تم الشراء' : 'شراء'}
                    </button>
                `;
                grid.appendChild(div);
            });
        }

        window.buyItem = async (itemId, price, currentCoins, uid) => {
            if (currentCoins < price) {
                showToast('عذراً، لا تمتلك عملات كافية!', 'error');
                return;
            }

            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                let inventory = userSnap.data().inventory || [];
                
                if (!inventory.includes(itemId)) {
                    inventory.push(itemId);
                    await updateDoc(userRef, {
                        coins: increment(-price),
                        inventory: inventory
                    });
                    showToast('تم الشراء بنجاح! 🎉', 'success');
                    setTimeout(() => window.location.reload(), 1500);
                }
            } catch (e) {
                showToast('حدث خطأ أثناء الشراء.', 'error');
            }
        };
    </script>
</body>
</html>
