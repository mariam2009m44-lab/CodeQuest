<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>تجربة حفظ النتائج على الحساب</title><link rel="stylesheet" href="style.css"></head>
<body><main style="max-width:560px;margin:24px auto;padding:0 16px;line-height:1.9">
<p style="display:inline-block;padding:3px 10px;border-radius:99px;background:#3a2f10;color:#ffe18a;font-weight:800;font-size:.8rem">تجربة داخلية</p>
<h1 style="font-size:1.4rem">تجربة حفظ نتيجة اختبار الدرس على حسابك</h1>
<p>دي تجربة لاختبار حفظ نتيجة اختبار الدرس على حسابك. مش بتأثر على باقي الطلاب، ولا على باقي الحسابات، ومش هتحفظ حاجة غير نتيجة اختبار الدرس.</p>
<p id="who" aria-live="polite">بنتأكد من الحساب...</p>
<p>معرّف الحساب (مش سرّي، بس بيتبعت للمسؤول عشان يضيف حسابك للتجربة): <bdi dir="ltr" id="uid" style="user-select:all;font-family:monospace"></bdi></p>
<p><button id="toggle" type="button" class="primary" disabled>...</button></p>
<p id="state" role="status"></p>
<p><a href="/course-path.html" style="color:#9fc2ff">الرجوع للخريطة</a></p>
</main>
<script type="module">
import {pilotActive,setPilot} from './pilot.mjs';
const $=id=>document.getElementById(id);let uid=null;
const localHost=location.hostname==='localhost'||location.hostname==='127.0.0.1';
try{if(localHost){uid=new URLSearchParams(location.search).get('uid')}else{const {requireUser}=await import('/js/auth.js');const u=await requireUser();uid=u?.uid||null}}catch{uid=null}
if(!uid){$('who').textContent='لازم تسجّلي الدخول الأول.';$('toggle').hidden=true;$('uid').parentElement.hidden=true}
else{$('who').textContent='الحساب الحالي جاهز.';$('uid').textContent=uid;
 const paint=()=>{const on=pilotActive(uid,localStorage);$('toggle').disabled=false;$('toggle').textContent=on?'إيقاف التجربة':'تشغيل التجربة على هذا الجهاز';$('state').textContent=on?'التجربة شغالة على هذا الجهاز لحسابك. نتيجة اختبار الدرس الجاي هتتحاول تتسجل على الحساب، ولو الخادم مش جاهز هتفضل محفوظة على الجهاز.':'التجربة موقوفة.'};
 $('toggle').onclick=()=>{setPilot(uid,!pilotActive(uid,localStorage),localStorage);paint()};paint()}
</script></body></html>
