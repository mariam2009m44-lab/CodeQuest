<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">

  <title>اختيار الشخصية | Cody Academy</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Cairo", sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(111,78,255,.2), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(0,217,255,.13), transparent 40%),
        #080d20;
    }

    .avatar-page {
      width: min(100% - 30px, 1050px);
      min-height: 100vh;
      margin: auto;
      padding: 35px 0 45px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      margin-bottom: 13px;
      border: 1px solid rgba(85,234,255,.25);
      border-radius: 30px;
      color: #65eaff;
      background: rgba(85,234,255,.08);
      font-size: .82rem;
      font-weight: 800;
    }

    .page-header h1 {
      margin: 0 0 9px;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      font-weight: 900;
      color: #fff;
    }

    .page-header p {
      margin: 0;
      color: #aab5d0;
      font-size: .95rem;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 0 auto 28px;
    }

    .avatar-card {
      min-width: 0;
      min-height: 260px;
      position: relative;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
      border: 2px solid rgba(143,164,220,.17);
      border-radius: 23px;
      background:
        linear-gradient(145deg, rgba(34,47,91,.78), rgba(13,20,47,.9));
      cursor: pointer;
      font: inherit;
      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;
    }

    .avatar-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(
        circle at 50% 45%,
        rgba(85,234,255,.16),
        transparent 70%
      );
      transition: opacity .22s ease;
      pointer-events: none;
    }

    .avatar-card:hover {
      transform: translateY(-5px);
      border-color: rgba(85,234,255,.7);
    }

    .avatar-card:hover::before {
      opacity: 1;
    }

    .avatar-card.selected {
      border-color: #55eaff;
      background:
        linear-gradient(145deg, rgba(24,67,105,.9), rgba(17,30,65,.95));
      box-shadow:
        0 0 0 3px rgba(85,234,255,.1),
        0 0 28px rgba(85,234,255,.2);
    }

    .avatar-card.selected::before {
      opacity: 1;
    }

    .avatar-card.selected::after {
      content: "✓";
      position: absolute;
      z-index: 20;
      top: 12px;
      left: 12px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #071322;
      background: #55eaff;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(85,234,255,.4);
    }

    .avatar-card:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .avatar-card .avatar-art-container {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .avatar-card .anime-avatar {
      width: 100%;
      max-width: 230px;
      height: 235px;
      margin: auto;
    }

    .avatar-card.locked {
      opacity: .68;
      cursor: not-allowed;
      filter: saturate(.55);
    }

    .avatar-card.locked:hover {
      transform: none;
      border-color: rgba(143,164,220,.17);
    }

    .avatar-card.locked .avatar-art-container {
      opacity: .48;
    }

    .avatar-name {
      position: relative;
      z-index: 3;
      margin: 2px 0 8px;
      color: #fff;
      font-size: .95rem;
      font-weight: 800;
      text-align: center;
    }

    .avatar-lock {
      position: absolute;
      z-index: 10;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 20px;
      color: #fff;
      background: rgba(8,13,32,.88);
      font-size: .72rem;
      font-weight: 800;
    }

    .avatar-lock i {
      font-size: 1rem;
    }

    .avatar-store-label {
      position: relative;
      z-index: 3;
      margin: -3px 0 7px;
      color: #65eaff;
      font-size: .7rem;
      font-weight: 800;
    }

    .selection-hint {
      min-height: 24px;
      margin: 0 0 18px;
      text-align: center;
      color: #aab5d0;
      font-size: .85rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .save-button {
      width: min(100%, 330px);
      min-height: 52px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 15px;
      color: #071322;
      background: linear-gradient(110deg, #55eaff, #8bafff);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    .save-button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .save-button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .save-message {
      min-height: 23px;
      margin: 0;
      color: #70e5ff;
      font-size: .85rem;
      text-align: center;
    }

    .save-message.error {
      color: #ff8585;
    }

    @media (max-width: 700px) {
      .avatar-page {
        width: min(100% - 20px, 520px);
        padding-top: 25px;
      }

      .avatars-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .avatar-card {
        min-height: 205px;
        padding: 5px;
        border-radius: 17px;
      }

      .avatar-card .anime-avatar {
        width: 100%;
        height: 190px;
      }

      .avatar-card .anime-character {
        transform: scale(.83);
        transform-origin: 50% 90%;
      }
    }

    @media (max-width: 360px) {
      .avatar-card .anime-avatar {
        height: 165px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-card,
      .save-button {
        transition: none;
      }
    }
  </style>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <main class="avatar-page">

    <header class="page-header">
      <div class="eyebrow">
        <i class="ri-sparkling-2-fill"></i>
        رحلتك تبدأ هنا
      </div>

      <h1>اختر شخصيتك</h1>

      <p>اختر الشكل الذي يعبر عنك ويكون رفيقك في رحلتك.</p>
    </header>

    <section
      class="avatars-grid"
      id="avatarsGrid"
      aria-label="اختيار شخصية"
      aria-busy="true"
    ></section>

    <p class="selection-hint" id="selectionHint" aria-live="polite">
      اختر الشخصية التي تفضلها
    </p>

    <div class="actions">

      <button
        class="save-button"
        id="saveBtn"
        type="button"
        disabled
      >
        <span>تأكيد الاختيار</span>
        <i class="ri-arrow-left-line"></i>
      </button>

      <p
        class="save-message"
        id="saveMessage"
        role="status"
        aria-live="polite"
      ></p>

    </div>

  </main>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";

    import {
      doc,
      getDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    import {
      requireUser,
      ensureUserProfile
    } from "./js/auth.js";

    import { showToast } from "./js/ui.js";

    import {
      getAllAvatars,
      renderAvatarCard,
      installAvatarStyles
    } from "./js/avatars.js";

    installAvatarStyles();

    const grid = document.getElementById("avatarsGrid");
    const saveBtn = document.getElementById("saveBtn");
    const saveMessage = document.getElementById("saveMessage");
    const selectionHint = document.getElementById("selectionHint");

    let selectedId = null;
    let saving = false;
    let currentUser = null;
    let ownedAvatarIds = new Set();

    const characters = getAllAvatars();

    const validAvatarIds = new Set(
      characters.map(character => character.id)
    );

    const freeAvatarIds = new Set([
      "cody",
      "layla",
      "omar",
      "sara",
      "robo",
      "nova"
    ]);

    function setMessage(message, isError = false) {
      saveMessage.textContent = message;
      saveMessage.classList.toggle("error", isError);
    }

    function isAvatarOwned(character) {
      if (!character) return false;

      if (freeAvatarIds.has(character.id)) {
        return true;
      }

      if (!character.storeItem) {
        return true;
      }

      return ownedAvatarIds.has(character.id);
    }

    function selectAvatar(avatarId) {
      if (!validAvatarIds.has(avatarId) || saving) {
        return;
      }

      const character = characters.find(
        item => item.id === avatarId
      );

      if (!character || !isAvatarOwned(character)) {
        setMessage(
          "هذه الشخصية مقفولة. يمكنك الحصول عليها من متجر كودي.",
          true
        );
        return;
      }

      const card = grid.querySelector(
        `[data-id="${avatarId}"]`
      );

      if (!card) return;

      grid.querySelectorAll(".avatar-card").forEach(item => {
        item.classList.remove("selected");
        item.setAttribute("aria-pressed", "false");
      });

      card.classList.add("selected");
      card.setAttribute("aria-pressed", "true");

      selectedId = avatarId;
      saveBtn.disabled = false;

      selectionHint.textContent =
        `تم تحديد ${character.name}. يمكنك تأكيد الاختيار.`;

      setMessage("");
    }

    function renderCharacters() {
      grid.innerHTML = "";

      characters.forEach(character => {
        const owned = isAvatarOwned(character);

        const card = document.createElement("button");

        card.type = "button";
        card.className = "avatar-card";
        card.dataset.id = character.id;

        card.setAttribute(
          "aria-label",
          owned
            ? `اختيار الشخصية ${character.name}`
            : `${character.name}، شخصية مقفولة`
        );

        card.setAttribute("aria-pressed", "false");

        if (!owned) {
          card.classList.add("locked");
          card.disabled = true;
          card.setAttribute("aria-disabled", "true");
        }

        card.innerHTML = `
          ${renderAvatarCard(character.id)}
          <div class="avatar-name">${character.name}</div>
          ${
            character.storeItem
              ? `<div class="avatar-store-label">شخصية المتجر</div>`
              : ""
          }
          ${
            owned
              ? ""
              : `
                <div class="avatar-lock">
                  <i class="ri-lock-fill"></i>
                  مقفولة
                </div>
              `
          }
        `;

        if (owned) {
          card.addEventListener("click", () => {
            selectAvatar(character.id);
          });
        }

        grid.appendChild(card);
      });

      grid.setAttribute("aria-busy", "false");
    }

    async function loadUserData(user) {
      const userRef = doc(db, "users", user.uid);
      const snapshot = await getDoc(userRef);

      if (!snapshot.exists()) {
        throw new Error(
          "ملف المستخدم غير موجود في قاعدة البيانات."
        );
      }

      const userData = snapshot.data();

      const inventory = Array.isArray(userData.inventory)
        ? userData.inventory
        : [];

      ownedAvatarIds = new Set(
        inventory.filter(item => typeof item === "string")
      );

      return userData;
    }

    async function loadSavedAvatar(userData) {
      const savedAvatar = userData.activeAvatar;

      const character = characters.find(
        item => item.id === savedAvatar
      );

      if (
        character &&
        isAvatarOwned(character)
      ) {
        selectAvatar(savedAvatar);

        selectionHint.textContent =
          "تم تحميل شخصيتك المحفوظة. يمكنك تغييرها إذا أردت.";

        return;
      }

      selectedId = null;
      saveBtn.disabled = true;

      selectionHint.textContent =
        "اختر إحدى الشخصيات المتاحة لك.";
    }

    async function initializeAvatarPage() {
      try {
        saveBtn.disabled = true;

        selectionHint.textContent =
          "جارٍ التحقق من الحساب...";

        currentUser = await requireUser();

        if (!currentUser?.uid) {
          throw new Error(
            "لم يتم العثور على حساب مسجل الدخول."
          );
        }

        await ensureUserProfile(currentUser);

        const userData = await loadUserData(currentUser);

        renderCharacters();

        await loadSavedAvatar(userData);

      } catch (error) {
        console.error(
          "Avatar page initialization error:",
          error
        );

        grid.setAttribute("aria-busy", "false");

        selectionHint.textContent =
          "تعذر تحميل بيانات الحساب. سجل الدخول ثم حاول مجددًا.";

        setMessage(
          error.message || "تعذر تحميل صفحة اختيار الشخصية.",
          true
        );

        showToast(
          "تعذر تحميل بيانات الحساب.",
          "error"
        );
      }
    }

    async function saveSelection() {
      if (
        !selectedId ||
        saving ||
        !currentUser?.uid
      ) {
        return;
      }

      const character = characters.find(
        item => item.id === selectedId
      );

      if (!character || !isAvatarOwned(character)) {
        setMessage(
          "لا يمكنك اختيار شخصية غير مملوكة.",
          true
        );
        return;
      }

      saving = true;
      saveBtn.disabled = true;

      saveBtn.setAttribute("aria-busy", "true");

      saveBtn.innerHTML =
        '<i class="ri-loader-4-line"></i> جارٍ الحفظ...';

      try {
        const userRef = doc(
          db,
          "users",
          currentUser.uid
        );

        await updateDoc(userRef, {
          activeAvatar: selectedId
        });

        try {
          localStorage.setItem(
            "cq_avatar",
            selectedId
          );
        } catch (storageError) {
          console.warn(
            "Could not update local avatar cache:",
            storageError
          );
        }

        setMessage("تم حفظ الشخصية بنجاح.");

        showToast(
          "تم حفظ الشخصية بنجاح.",
          "success"
        );

        window.location.replace("profile.html");

      } catch (error) {
        console.error(
          "Avatar save error:",
          error
        );

        setMessage(
          error?.code === "permission-denied"
            ? "رفضت قاعدة البيانات حفظ الاختيار. تحقق من صلاحيات Firestore."
            : "تعذر حفظ الشخصية. حاول مرة أخرى.",
          true
        );

        showToast(
          "تعذر حفظ الشخصية.",
          "error"
        );

        saving = false;
        saveBtn.disabled = false;

        saveBtn.removeAttribute("aria-busy");

        saveBtn.innerHTML =
          '<span>تأكيد الاختيار</span><i class="ri-arrow-left-line"></i>';
      }
    }

    saveBtn.addEventListener(
      "click",
      saveSelection
    );

    renderCharacters();
    initializeAvatarPage();
  </script>

</body>
</html>
