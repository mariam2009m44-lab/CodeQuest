<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | اختر شخصيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/avatar.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sfx.js"></script>
<script>if(!localStorage.getItem("cq_session")){window.location.href="index.html";}</script>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="top-bar">
<button class="skip-btn" onclick="window.location.href='languages.html'">تخطي ←</button>
</div>
<header class="avatar-header">
<h1>👤 اختر شخصيتك</h1>
<p>اختار الصورة اللي بتمثلك</p>
</header>
<div class="avatar-grid" id="avatarGrid"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = Auth.getCurrentUser() || 'Guest';
    const allSeeds = ['Jack', 'Emma', 'Oliver', 'Sophia', 'Leo', 'Mia', 'Max', 'Luna', 'Ryan', 'Aria', 'Noah', 'Zoe', 'Liam', 'Lily', 'Ethan', 'Chloe', 'Lucas', 'Ella'];
    const bgColors = ['ffdfbf', 'c0aede', 'b6e3f4', 'd1d4f9', 'ffd5dc', 'c8f7c5', 'ffe0b3', 'e0d5f9'];
    const grid = document.getElementById('avatarGrid');

    allSeeds.forEach((seed, i) => {
        const bg = bgColors[i % bgColors.length];
        const url = 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + seed + '&backgroundColor=' + bg + '&radius=50';
        const card = document.createElement('div');
        card.className = 'avatar-card';
        card.innerHTML = '<img src="' + url + '" alt="' + seed + '">';
        card.onclick = () => {
            // 1. الحفظ الفوري في المتصفح
            localStorage.setItem('cq_avatar_' + user, url);
            
            // 2. الحفظ في Firebase (لو متاح)
            if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
                firebase.firestore().collection('users').doc(firebase.auth().currentUser.uid).update({ avatar: url }).catch(console.error);
            }

            // 3. الانيميشن والاحتفال
            try { playSound('win'); } catch(e) {}
            try { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); } catch(e) {}
            
            // تأثير اهتزاز بسيط
            document.body.style.transform = 'scale(0.95)';
            setTimeout(() => { document.body.style.transform = 'scale(1)'; }, 200);

            // 4. التحويل لصفحة اللغات فوراً
            setTimeout(() => { window.location.href = 'languages.html'; }, 800);
        };
        grid.appendChild(card);
    });

    const pc = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div'); p.className = 'particle';
        p.innerText = ['👤', '✨', '⭐', '🌟'][Math.floor(Math.random() * 4)];
        p.style.left = Math.random() * 100 + 'vw'; p.style.top = Math.random() * 100 + 'vh';
        p.style.fontSize = (Math.random() * 15 + 10) + 'px';
        p.style.animationDelay = (Math.random() * 5) + 's';
        pc.appendChild(p);
    }
});
</script>
</body>
</html>
