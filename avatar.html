
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d20">

  <title>اختر شخصيتك | Cody Academy</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(105,75,255,.18), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(0,217,255,.13), transparent 35%),
        var(--bg-main, #080d20);
    }

    .onboarding-container {
      width: min(100% - 30px, 1050px);
      min-height: 100vh;
      margin: auto;
      padding: 45px 0 35px;
      display: flex;
      flex-direction: column;
    }

    .header-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .header-title h1 {
      color: #fff;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 900;
      margin-bottom: 8px;
    }

    .header-title p {
      color: #aab5d0;
      font-size: 1rem;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 35px;
    }

    .avatar-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      border: 2px solid rgba(130,155,220,.2);
      border-radius: 22px;
      background: rgba(20,29,65,.72);
      transition: transform .25s ease, border-color .25s ease,
        box-shadow .25s ease, background .25s ease;
      font-family: inherit;
      color: inherit;
    }

    .avatar-card:hover {
      transform: translateY(-5px);
      border-color: #50dfff;
      box-shadow: 0 10px 35px rgba(0,217,255,.12);
    }

    .avatar-card.selected {
      border-color: #50dfff;
      background: rgba(25,65,110,.45);
      box-shadow: 0 0 0 3px rgba(80,223,255,.12),
        0 0 30px rgba(0,217,255,.2);
    }

    .avatar-card.selected::after {
      content: "✓";
      position: absolute;
      top: 12px;
      left: 12px;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      color: #071322;
      font-weight: 900;
      border-radius: 50%;
      background: #50dfff;
    }

    .avatar-card .avatar-illustration {
      width: 100%;
      max-width: 205px;
      height: 205px;
    }

    .actions {
      text-align: center;
      margin-top: auto;
    }

    .actions button {
      width: min(100%, 320px);
      padding: 13px 22px;
      border: 0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: .2s ease;
    }

    .actions button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .save-message {
      min-height: 25px;
      margin-top: 12px;
      color: #70e5ff;
      font-size: .85rem;
    }

    @media (max-width: 700px) {
      .avatars-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }

      .avatar-card { padding: 12px 8px; }

      .avatar-card .avatar-illustration {
        height: 155px;
      }
    }

    @media (max-width: 360px) {
      .avatar-card .avatar-illustration { height: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="onboarding-container">

    <header class="header-title">
      <h1>اختر شخصيتك الفضائية</h1>
      <p>اختار الشخصية اللي هترافقك في رحلة تعلم البرمجة 🚀</p>
    </header>

    <section
      class="avatars-grid"
      id="avatarsGrid"
      aria-label="الشخصيات المتاحة"
    ></section>

    <div class="actions">
      <button class="btn-primary" id="saveBtn" type="button" disabled>
        حفظ والانتقال
        <i class="ri-arrow-left-line"></i>
      </button>

      <p class="save-message" id="saveMessage" role="status"></p>
    </div>

  </main>

  <script type="module">
    import { auth, db, doc, updateDoc } from "./js/app.js";
    import { showToast } from "./js/ui.js";

    import {
      getAllAvatars,
      renderAvatarCard,
      installAvatarStyles
    } from "./js/avatars.js";

    installAvatarStyles();

    const grid = document.getElementById("avatarsGrid");
    const saveBtn = document.getElementById("saveBtn");
    const saveMessage = document.getElementById("saveMessage");

    const characters = getAllAvatars();

    let selectedId = null;
    let saving = false;

    function renderAvatars() {
      grid.innerHTML = "";

      characters.forEach(character => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "avatar-card";
        card.dataset.id = character.id;
        card.setAttribute("aria-pressed", "false");

        card.innerHTML = renderAvatarCard(character.id);

        card.addEventListener("click", () => {
          if (saving) return;

          document.querySelectorAll(".avatar-card").forEach(item => {
            item.classList.remove("selected");
            item.setAttribute("aria-pressed", "false");
          });

          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");

          selectedId = character.id;
          saveBtn.disabled = false;
          saveMessage.textContent = `اخترت شخصية ${character.name}`;
        });

        grid.appendChild(card);
      });

      // استعادة آخر اختيار محليًا لتسهيل التعديل
      const saved = localStorage.getItem("cq_avatar");

      if (characters.some(item => item.id === saved)) {
        const previous = grid.querySelector(`[data-id="${saved}"]`);

        if (previous) previous.click();
      }
    }

    async function saveAvatar() {
      if (!selectedId || saving) return;

      const user = auth.currentUser;

      if (!user) {
        showToast("سجّلي الدخول أولاً لحفظ الشخصية.", "error");
        return;
      }

      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = "جارٍ حفظ الشخصية...";
      saveMessage.textContent = "";

      try {
        await updateDoc(doc(db, "users", user.uid), {
          activeAvatar: selectedId
        });

        localStorage.setItem("cq_avatar", selectedId);

        showToast("تم حفظ شخصيتك بنجاح!", "success");
        saveMessage.textContent = "تم الحفظ بنجاح!";

        window.location.href = "languages.html";

      } catch (error) {
        console.error("Avatar save error:", error);

        showToast("لم نتمكن من حفظ الشخصية. حاولي مرة أخرى.", "error");

        saveMessage.textContent = "حدث خطأ أثناء الحفظ.";
        saving = false;
        saveBtn.disabled = false;
        saveBtn.innerHTML =
          'حفظ والانتقال <i class="ri-arrow-left-line"></i>';
      }
    }

    saveBtn.addEventListener("click", saveAvatar);

    renderAvatars();
  </script>
</body>
</html>
