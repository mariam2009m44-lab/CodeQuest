<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>اختر شخصيتك</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 500px; margin-top: 20px; }
        .card { background: var(--glass); border: 3px solid transparent; border-radius: 20px; padding: 10px; cursor: pointer; transition: 0.3s; aspect-ratio: 1/1; }
        .card img { width: 100%; height: 100%; border-radius: 15px; background: #111; }
        .card.selected { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,229,255,0.5); }
        .btn-start { margin-top: 20px; padding: 15px 40px; border-radius: 15px; background: var(--neon-cyan); border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head><body>
    <div class="header"><h1>اختر شخصيتك</h1></div>
    <div class="grid" id="grid"></div>
    <button class="btn-start" onclick="save()">يلا نبدأ 🚀</button>
    <script>
        let selected = null;
        const seeds = ['Mia', 'Leo', 'Zoe', 'Max', 'Luna', 'Charlie', 'Lily', 'Oscar', 'Bella', 'Rocky', 'Coco', 'Daisy'];
        const grid = document.getElementById('grid');
        seeds.forEach(s => {
            const url = `https://api.dicebear.com/7.x/adventurer/svg?seed=${s}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;
            const d = document.createElement('div'); d.className = 'card'; d.innerHTML = `<img src="${url}">`;
            d.onclick = () => { document.querySelectorAll('.card').forEach(c => c.classList.remove('selected')); d.classList.add('selected'); selected = url; };
            grid.appendChild(d);
        });
        function save() {
            if(!selected) return alert("اختر شخصية!");
            localStorage.setItem('cq_avatar', selected);
            const uid = Auth.getUserId();
            if(uid) firebase.firestore().collection('users').doc(uid).update({ avatar: selected });
            window.location.href = 'languages.html';
        }
    </script>
</body></html>
