
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">

  <title>اختيار الشخصية | Cody Academy</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Cairo", sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(111,78,255,.2), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(0,217,255,.13), transparent 40%),
        #080d20;
    }

    .avatar-page {
      width: min(100% - 30px, 1050px);
      min-height: 100vh;
      margin: auto;
      padding: 35px 0 45px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      margin-bottom: 13px;
      border: 1px solid rgba(85,234,255,.25);
      border-radius: 30px;
      color: #65eaff;
      background: rgba(85,234,255,.08);
      font-size: .82rem;
      font-weight: 800;
    }

    .page-header h1 {
      margin: 0 0 9px;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      font-weight: 900;
      color: #fff;
    }

    .page-header p {
      margin: 0;
      color: #aab5d0;
      font-size: .95rem;
    }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 0 auto 28px;
    }

    .avatar-card {
      min-width: 0;
      min-height: 260px;
      position: relative;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
      border: 2px solid rgba(143,164,220,.17);
      border-radius: 23px;
      background:
        linear-gradient(145deg, rgba(34,47,91,.78), rgba(13,20,47,.9));
      cursor: pointer;
      font: inherit;
      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background .22s ease;
    }

    .avatar-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(
        circle at 50% 45%,
        rgba(85,234,255,.16),
        transparent 70%
      );
      transition: opacity .22s ease;
      pointer-events: none;
    }

    .avatar-card:hover {
      transform: translateY(-5px);
      border-color: rgba(85,234,255,.7);
    }

    .avatar-card:hover::before {
      opacity: 1;
    }

    .avatar-card.selected {
      border-color: #55eaff;
      background:
        linear-gradient(145deg, rgba(24,67,105,.9), rgba(17,30,65,.95));
      box-shadow:
        0 0 0 3px rgba(85,234,255,.1),
        0 0 28px rgba(85,234,255,.2);
    }

    .avatar-card.selected::before {
      opacity: 1;
    }

    .avatar-card.selected::after {
      content: "✓";
      position: absolute;
      z-index: 20;
      top: 12px;
      left: 12px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #071322;
      background: #55eaff;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(85,234,255,.4);
    }

    .avatar-card:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .avatar-card .avatar-art-container {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .avatar-card .anime-avatar {
      width: 100%;
      max-width: 230px;
      height: 235px;
      margin: auto;
    }

    .selection-hint {
      min-height: 24px;
      margin: 0 0 18px;
      text-align: center;
      color: #aab5d0;
      font-size: .85rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .save-button {
      width: min(100%, 330px);
      min-height: 52px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 15px;
      color: #071322;
      background: linear-gradient(110deg, #55eaff, #8bafff);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    .save-button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .save-button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .save-message {
      min-height: 23px;
      margin: 0;
      color: #70e5ff;
      font-size: .85rem;
      text-align: center;
    }

    @media (max-width: 700px) {
      .avatar-page {
        width: min(100% - 20px, 520px);
        padding-top: 25px;
      }

      .avatars-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .avatar-card {
        min-height: 205px;
        padding: 5px;
        border-radius: 17px;
      }

      .avatar-card .anime-avatar {
        width: 100%;
        height: 190px;
      }

      .avatar-card .anime-character {
        transform: scale(.83);
        transform-origin: 50% 90%;
      }
    }

    @media (max-width: 360px) {
      .avatar-card .anime-avatar {
        height: 165px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar-card,
      .save-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="avatar-page">

    <header class="page-header">
      <div class="eyebrow">
        <i class="ri-sparkling-2-fill"></i>
        رحلتك تبدأ هنا
      </div>

      <h1>اختار شخصيتك</h1>

      <p>اختار الشكل اللي يعبر عنك ويكون رفيقك في رحلتك.</p>
    </header>

    <section
      class="avatars-grid"
      id="avatarsGrid"
      aria-label="اختيار شخصية"
    ></section>

    <p class="selection-hint" id="selectionHint" aria-live="polite">
      اضغط على الشخصية التي تفضلها
    </p>

    <div class="actions">

      <button
        class="save-button"
        id="saveBtn"
        type="button"
        disabled
      >
        <span>تأكيد الاختيار</span>
        <i class="ri-arrow-left-line"></i>
      </button>

      <p
        class="save-message"
        id="saveMessage"
        role="status"
        aria-live="polite"
      ></p>

    </div>

  </main>

  <script type="module">
    import { auth, db, doc, updateDoc } from "./js/app.js";
    import { showToast } from "./js/ui.js";

    import {
      getAllAvatars,
      renderAvatarCard,
      installAvatarStyles
    } from "./js/avatars.js";

    installAvatarStyles();

    const grid = document.getElementById("avatarsGrid");
    const saveBtn = document.getElementById("saveBtn");
    const saveMessage = document.getElementById("saveMessage");
    const selectionHint = document.getElementById("selectionHint");

    let selectedId = null;
    let saving = false;

    const characters = getAllAvatars();

    function renderCharacters() {
      grid.innerHTML = "";

      characters.forEach(character => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "avatar-card";
        card.dataset.id = character.id;

        card.setAttribute("aria-label", "اختيار هذه الشخصية");
        card.setAttribute("aria-pressed", "false");

        card.innerHTML = renderAvatarCard(character.id);

        card.addEventListener("click", () => {
          if (saving) return;

          document.querySelectorAll(".avatar-card").forEach(item => {
            item.classList.remove("selected");
            item.setAttribute("aria-pressed", "false");
          });

          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");

          selectedId = character.id;

          saveBtn.disabled = false;
          selectionHint.textContent = "تم تحديد الشخصية. يمكنك تأكيد اختيارك.";
          saveMessage.textContent = "";
        });

        grid.appendChild(card);
      });

      // Restore previously selected avatar
      const previousId = localStorage.getItem("cq_avatar");

      if (characters.some(item => item.id === previousId)) {
        const previousCard = grid.querySelector(
          `[data-id="${previousId}"]`
        );

        if (previousCard) previousCard.click();
      }
    }

    async function saveSelection() {
      if (!selectedId || saving) return;

      const user = auth.currentUser;

      if (!user) {
        showToast("يجب تسجيل الدخول أولاً.", "error");
        return;
      }

      saving = true;
      saveBtn.disabled = true;
      saveBtn.innerHTML =
        '<i class="ri-loader-4-line"></i> جارٍ الحفظ...';

      try {
        await updateDoc(doc(db, "users", user.uid), {
          activeAvatar: selectedId
        });

        localStorage.setItem("cq_avatar", selectedId);

        saveMessage.textContent = "تم حفظ اختيارك بنجاح.";

        showToast("تم حفظ الشخصية!", "success");

        window.location.href = "profile.html";

      } catch (error) {
        console.error("Avatar save error:", error);

        showToast("تعذر حفظ الشخصية. حاولي مرة أخرى.", "error");

        saveMessage.textContent =
          "لم يتم الحفظ. تأكدي من اتصال الإنترنت وحاولي مجددًا.";

        saving = false;
        saveBtn.disabled = false;
        saveBtn.innerHTML =
          '<span>تأكيد الاختيار</span><i class="ri-arrow-left-line"></i>';
      }
    }

    saveBtn.addEventListener("click", saveSelection);

    renderCharacters();
  </script>

</body>
</html>
