<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | اختر شخصيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/avatar.css">
<script src="js/auth.js"></script>
<script>if(!localStorage.getItem("cq_session")){window.location.href="index.html";}</script>
<style>
/* ستايلات الأنيميشن */
body, html { margin: 0; padding: 0; overflow-x: hidden; }
.boom-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.95); z-index: 99999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box; /* عشان الكلام ميزقش برة */
}
.boom-overlay.show { display: flex; animation: fadeIn 0.5s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.big-avatar {
    width: 140px; height: 140px; /* صغرنا الحجم */
    border-radius: 50%;
    border: 4px solid #00e5ff; background: #fff;
    box-shadow: 0 0 40px #00e5ff, 0 0 80px #0072ff;
    animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transform: scale(0);
    object-fit: cover;
}
@keyframes zoomIn {
    0% { transform: scale(0) rotate(-180deg); }
    70% { transform: scale(1.1) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
}

.big-text {
    color: #fff; font-size: 18px; font-weight: 900; margin-top: 20px;
    text-shadow: 0 0 15px #00e5ff;
    animation: slideUp 0.8s 0.5s forwards; opacity: 0;
    text-align: center;
}
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } from { transform: translateY(30px); } }

.hero-text {
    color: #ffd700; font-size: 20px; font-weight: 900; margin-top: 10px;
    text-shadow: 0 0 20px #ffd700;
    animation: slideUp 0.8s 1s forwards; opacity: 0;
    text-align: center; /* عشان الكلام يتوسط */
    padding: 0 10px;
    line-height: 1.4;
}

.continue-btn {
    background: #27ae60; color: #fff; border: none; padding: 12px 35px;
    border-radius: 30px; font-size: 16px; font-weight: bold; margin-top: 30px;
    font-family: 'Cairo', sans-serif; cursor: pointer; box-shadow: 0 10px 20px rgba(39,174,96,0.5);
    animation: slideUp 0.8s 1.5s forwards; opacity: 0;
}
</style>
</head>
<body>
<div class="top-bar">
<button class="skip-btn" onclick="window.location.href='languages.html'">تخطي ←</button>
</div>
<header class="avatar-header">
<h1>👤 اختر شخصيتك</h1>
</header>
<div class="avatar-grid" id="avatarGrid"></div>

<!-- الشاشة اللي هتظهر -->
<div class="boom-overlay" id="boomOverlay">
    <img class="big-avatar" id="bigAvatar" src="" alt="Avatar">
    <div class="big-text">✨ هذه شخصيتك! ✨</div>
    <div class="hero-text">استعد للمغامرة يا بطل! 🚀</div>
    <button class="continue-btn" onclick="window.location.href='languages.html'">يلا نبدأ! 🎮</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = Auth.getCurrentUser() || 'Guest';
    const allSeeds = ['Jack', 'Emma', 'Oliver', 'Sophia', 'Leo', 'Mia', 'Max', 'Luna', 'Ryan', 'Aria', 'Noah', 'Zoe', 'Liam', 'Lily', 'Ethan', 'Chloe', 'Lucas', 'Ella'];
    const bgColors = ['ffdfbf', 'c0aede', 'b6e3f4', 'd1d4f9', 'ffd5dc', 'c8f7c5', 'ffe0b3', 'e0d5f9'];
    const grid = document.getElementById('avatarGrid');

    allSeeds.forEach((seed, i) => {
        const bg = bgColors[i % bgColors.length];
        const url = 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + seed + '&backgroundColor=' + bg + '&radius=50';
        const card = document.createElement('div');
        card.className = 'avatar-card';
        card.innerHTML = '<img src="' + url + '" alt="' + seed + '">';
        
        card.onclick = () => {
            localStorage.setItem('cq_avatar_' + user, url);
            if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
                firebase.firestore().collection('users').doc(firebase.auth().currentUser.uid).update({ avatar: url }).catch(console.error);
            }
            
            document.getElementById('bigAvatar').src = url;
            document.getElementById('boomOverlay').classList.add('show');
        };
        
        grid.appendChild(card);
    });
});
</script>
</body>
</html>
