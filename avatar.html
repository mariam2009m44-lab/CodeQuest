<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | اختر شخصيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/avatar.css">
<link rel="stylesheet" href="css/accessories.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sfx.js"></script>
<script>if(!localStorage.getItem("cq_session")){window.location.href="index.html";}</script>
<style>
/* تأثير اهتزاز الشاشة */
body.screen-shake { animation: screenShake 0.5s; }
@keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 5px); }
    40% { transform: translate(8px, -5px); }
    60% { transform: translate(-5px, -5px); }
    80% { transform: translate(5px, 5px); }
}

/* تطاير الشررات */
.burst-particle {
    position: fixed; width: 12px; height: 12px; border-radius: 50%;
    pointer-events: none; z-index: 9998; animation: burst 0.8s ease-out forwards;
    box-shadow: 0 0 15px currentColor;
}
@keyframes burst {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; }
}

/* شاشة الاقتحام الكبيرة */
.reveal-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(20,10,40,0.95), rgba(0,0,0,0.98));
    backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s; padding: 20px; overflow: hidden;
}
.reveal-overlay.show { opacity: 1; pointer-events: auto; }

/* حلقات الإضاءة اللي بتلف */
.reveal-rings { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.ring { position: absolute; border-radius: 50%; border: 3px solid transparent; }
.ring-1 { width: 300px; height: 300px; border-top-color: #00e5ff; border-right-color: #00e5ff; animation: spinRing 2s linear infinite; box-shadow: 0 0 40px rgba(0,229,255,0.6); }
.ring-2 { width: 360px; height: 360px; border-bottom-color: #9b59b6; border-left-color: #9b59b6; animation: spinRing 3s linear infinite reverse; box-shadow: 0 0 40px rgba(155,89,182,0.6); }
.ring-3 { width: 420px; height: 420px; border-top-color: #ffd700; border-left-color: #ffd700; animation: spinRing 5s linear infinite; box-shadow: 0 0 30px rgba(255,215,0,0.4); opacity: 0.7; }
@keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* الصورة الكبيرة */
.reveal-avatar-wrap { position: relative; width: 240px; height: 240px; z-index: 5; animation: avatarEnter 0.8s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes avatarEnter { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.2) rotate(20deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
.reveal-avatar { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; background: #fff; padding: 10px; border: 5px solid #00e5ff; box-shadow: 0 0 80px rgba(0,229,255,0.9), 0 0 150px rgba(155,89,182,0.6); animation: avatarPulse 1.5s ease-in-out infinite; }
@keyframes avatarPulse { 0%, 100% { box-shadow: 0 0 50px rgba(0,229,255,0.7), 0 0 100px rgba(155,89,182,0.4); } 50% { box-shadow: 0 0 100px rgba(0,229,255,1), 0 0 180px rgba(155,89,182,0.8); } }

/* الكلام المحفز */
.reveal-text-wrap { text-align: center; margin-top: 30px; z-index: 5; position: relative; }
.reveal-text { color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 15px; text-shadow: 0 0 20px rgba(0,229,255,0.8); min-height: 35px; }
.reveal-hero-text { color: #ffd700; font-size: 32px; font-weight: 900; text-shadow: 0 0 30px rgba(255,215,0,1); opacity: 0; transform: translateY(20px) scale(0.5); transition: all 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
.reveal-hero-text.show { opacity: 1; transform: translateY(0) scale(1); animation: heroGlow 2s infinite; }
@keyframes heroGlow { 0%, 100% { text-shadow: 0 0 30px rgba(255,215,0,1); } 50% { text-shadow: 0 0 50px rgba(255,215,0,1), 0 0 80px rgba(255,100,0,0.8); } }
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="top-bar">
<button class="skip-btn" onclick="window.location.href='languages.html'">تخطي ←</button>
</div>
<header class="avatar-header">
<h1>👤 اختر شخصيتك</h1>
<p>اختار الصورة اللي بتمثلك</p>
</header>
<div class="avatar-grid" id="avatarGrid"></div>

<!-- شاشة الأنيميشن السينمائي -->
<div class="reveal-overlay" id="revealOverlay">
    <div class="reveal-rings">
        <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
    </div>
    <div class="reveal-avatar-wrap">
        <img class="reveal-avatar" id="revealAvatar" src="" alt="Avatar">
    </div>
    <div class="reveal-text-wrap">
        <div class="reveal-text" id="revealText"></div>
        <div class="reveal-hero-text" id="revealHeroText">استعد للمغامرة يا بطل! 🚀</div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const user = Auth.getCurrentUser() || 'Guest';
    const allSeeds = ['Jack', 'Emma', 'Oliver', 'Sophia', 'Leo', 'Mia', 'Max', 'Luna', 'Ryan', 'Aria', 'Noah', 'Zoe', 'Liam', 'Lily', 'Ethan', 'Chloe', 'Lucas', 'Ella'];
    const bgColors = ['ffdfbf', 'c0aede', 'b6e3f4', 'd1d4f9', 'ffd5dc', 'c8f7c5', 'ffe0b3', 'e0d5f9'];
    const grid = document.getElementById('avatarGrid');

    allSeeds.forEach((seed, i) => {
        const bg = bgColors[i % bgColors.length];
        const url = 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + seed + '&backgroundColor=' + bg + '&radius=50';
        const card = document.createElement('div');
        card.className = 'avatar-card';
        card.innerHTML = '<img src="' + url + '" alt="' + seed + '">';
        card.onclick = (e) => playEpicAnimation(e, url);
        grid.appendChild(card);
    });

    function playEpicAnimation(event, url) {
        // 1. الحفظ الفوري في الخلفية
        localStorage.setItem('cq_avatar_' + user, url);
        if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
            firebase.firestore().collection('users').doc(firebase.auth().currentUser.uid).update({ avatar: url }).catch(console.error);
        }

        // 2. اهتزاز الشاشة
        try { playSound('pop'); } catch(e) {}
        document.body.classList.add('screen-shake');
        setTimeout(() => document.body.classList.remove('screen-shake'), 500);

        // 3. تطاير الشررات
        const card = event.currentTarget;
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'burst-particle';
            p.style.left = cx + 'px';
            p.style.top = cy + 'px';
            const angle = Math.random() * Math.PI * 2;
            const distance = 150 + Math.random() * 300;
            p.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
            p.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
            p.style.background = ['#00e5ff', '#ffd700', '#ffffff', '#27ae60', '#9b59b6'][Math.floor(Math.random() * 5)];
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        // 4. شاشة الاقتحام
        setTimeout(() => {
            document.getElementById('revealAvatar').src = url;
            document.getElementById('revealOverlay').classList.add('show');
            try { playSound('whoosh'); } catch(e) {}

            // كتابة النص حرف حرف
            const text = '✨ هذه شخصيتك! ✨';
            const textEl = document.getElementById('revealText');
            textEl.innerHTML = '';
            let idx = 0;
            const typer = setInterval(() => {
                if (idx < text.length) { textEl.innerHTML += text.charAt(idx); idx++; }
                else clearInterval(typer);
            }, 60);

            // أصوات وبالونات
            setTimeout(() => {
                try { playSound('success'); } catch(e) {}
                try { confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } catch(e) {}
            }, 700);

            // ظهور الكلام المحفز
            setTimeout(() => {
                document.getElementById('revealHeroText').classList.add('show');
                try { playSound('win'); } catch(e) {}
            }, 1500);

            // 5. الانتقال لصفحة اللغات
            setTimeout(() => {
                window.location.href = 'languages.html';
            }, 4000);

        }, 400);
    }
});
</script>
</body>
</html>
