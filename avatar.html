<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>اختر شخصيتك</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <style>
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;}
        .header { width: 100%; display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn-skip { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 20px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; text-decoration: none;}
        .title-area { text-align: center; margin-bottom: 30px; }
        .title-area h1 { color: #00e5ff; font-size: 2rem; margin: 0 0 10px; }
        .avatars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 500px; }
        .avatar-card { background: rgba(10, 25, 47, 0.8); border: 3px solid transparent; border-radius: 20px; padding: 10px; cursor: pointer; transition: 0.3s; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; }
        .avatar-card img { width: 100%; height: 100%; border-radius: 15px; background: #111; object-fit: cover; }
        .avatar-card.selected { border-color: #00e5ff; box-shadow: 0 0 20px rgba(0,229,255,0.5); transform: scale(1.05); }
        .btn-start { margin-top: 30px; width: 100%; max-width: 400px; padding: 18px; border: none; border-radius: 20px; background: linear-gradient(135deg, #00e5ff, #007bff); color: #000; font-family: 'Cairo'; font-weight: 900; font-size: 1.3rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-skip">تخطي ←</a></div>
    <div class="title-area"><h1>اختر شخصيتك</h1><p>الصورة التي ستمثلك في الرحلة</p></div>
    <div class="avatars-grid" id="avatarsGrid"></div>
    <button class="btn-start" onclick="saveAndStart()">🚀 يلا نبدأ المغامرة</button>
    <script>
        let selectedAvatarUrl = null;
        // استخدام نمط adventurer (أطفال كيوت)
        const seeds = ['Mia', 'Leo', 'Zoe', 'Max', 'Luna', 'Charlie', 'Lily', 'Oscar', 'Bella', 'Rocky', 'Coco', 'Daisy'];
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((logged) => { if (!logged) window.location.href = 'index.html'; });
            const grid = document.getElementById('avatarsGrid');
            seeds.forEach(seed => {
                const imgUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;
                const card = document.createElement('div');
                card.className = 'avatar-card';
                card.innerHTML = `<img src="${imgUrl}">`;
                card.onclick = () => {
                    document.querySelectorAll('.avatar-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedAvatarUrl = imgUrl;
                };
                grid.appendChild(card);
            });
        });
        async function saveAndStart() {
            if (!selectedAvatarUrl) return alert("اختر شخصيتك الأول يا بطل!");
            localStorage.setItem('cq_avatar', selectedAvatarUrl);
            const uid = Auth.getUserId();
            if (uid) {
                try { await firebase.firestore().collection('users').doc(uid).update({ avatar: selectedAvatarUrl }); } catch(e) {}
            }
            window.location.href = 'languages.html';
        }
    </script>
</body></html>
