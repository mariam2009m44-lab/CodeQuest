<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر شخصيتك | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .onboarding-container { max-width: 900px; margin: 0 auto; padding: var(--space-l) var(--space-m); min-height: 100vh; display: flex; flex-direction: column; }
        .header-title { text-align: center; margin-bottom: var(--space-xl); }
        .header-title h1 { font-size: 2.5rem; color: var(--text-primary); margin-bottom: var(--space-xs); }
        .header-title p { color: var(--text-secondary); font-size: 1.1rem; }
        .avatars-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-m); margin-bottom: var(--space-xl); }
        .avatar-card { background: var(--bg-panel); border: 2px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-m); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .avatar-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .avatar-card.selected { border-color: var(--primary); box-shadow: var(--glow-active); background: rgba(0, 217, 255, 0.05); }
        .avatar-icon { font-size: 4rem; margin-bottom: var(--space-s); }
        .avatar-name { font-weight: 700; color: var(--text-primary); }
        .actions { margin-top: auto; text-align: center; }
        .actions button { width: 100%; max-width: 300px; padding: var(--space-s) var(--space-l); font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="header-title">
            <h1>اختر شخصيتك</h1>
            <p>من تريد أن يكون مرشدك في هذه الرحلة؟</p>
        </div>
        <div class="avatars-grid" id="avatarsGrid"></div>
        <div class="actions">
            <button class="btn-primary" id="saveBtn" disabled onclick="saveAvatar()">حفظ والانتقال <i class="ri-arrow-left-line"></i></button>
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, updateDoc } from './js/app.js';
        import { showToast } from './js/ui.js';

        const characters = [
            { id: 'cody', name: 'كودي', icon: '🤖', desc: 'روبوت ذكي' },
            { id: 'layla', name: 'ليلى', icon: '👩‍💻', desc: 'مبرمجة ماهرة' },
            { id: 'omar', name: 'عمر', icon: '👨‍🚀', desc: 'مستكشف شجاع' },
            { id: 'sara', name: 'سارة', icon: '🧚‍♀️', desc: 'مبتكرة' },
            { id: 'robo', name: 'روبو', icon: '🦾', desc: 'آلة قوية' },
            { id: 'nova', name: 'نوفا', icon: '👽', desc: 'كائن فضائي' }
        ];

        let selectedId = null;

        function renderAvatars() {
            const grid = document.getElementById('avatarsGrid');
            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'avatar-card';
                card.onclick = () => {
                    document.querySelectorAll('.avatar-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedId = char.id;
                    document.getElementById('saveBtn').disabled = false;
                };
                card.innerHTML = `<div class="avatar-icon">${char.icon}</div><div class="avatar-name">${char.name}</div><div style="font-size:0.8rem; color:var(--text-muted);">${char.desc}</div>`;
                grid.appendChild(card);
            });
        }

        window.saveAvatar = async () => {
            if (selectedId && auth.currentUser) {
                localStorage.setItem('cq_avatar', selectedId);
                try {
                    const userRef = doc(db, "users", auth.currentUser.uid);
                    await updateDoc(userRef, { activeAvatar: selectedId });
                    showToast('تم حفظ شخصيتك بنجاح!', 'success');
                    setTimeout(() => window.location.href = 'languages.html', 1000);
                } catch (e) {
                    window.location.href = 'languages.html';
                }
            }
        };
        renderAvatars();
    </script>
</body>
</html>
