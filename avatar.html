<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار الشخصية</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .avatar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 20px; padding: 40px; max-width: 600px; margin: 0 auto; }
        .avatar-item { font-size: 4rem; text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .avatar-item:hover, .avatar-item.selected { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); transform: scale(1.1); }
    </style>
</head>
<body>
    <div style="text-align: center; padding: 20px;">
        <h1 style="color: var(--primary);">اختر شخصيتك البطلة</h1>
        <p style="color: var(--text-muted);">اختر الشخصية التي ستمثلك في رحلة التعلم</p>
    </div>
    <div class="avatar-grid animate-fade" id="avatarGrid">
        <!-- سيتم ملؤها بواسطة JS -->
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <a href="index.html" class="btn-primary" style="text-decoration: none;">حفظ والعودة ⬅️</a>
    </div>

    <script>
        const avatars = ['👤', '👦', '👧', '🦸‍♂️', '🦸‍♀️', '🧙‍♂️', '🧙‍♀️', '👽', '🐱', '🤖'];
        
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((loggedIn) => {
                if(!loggedIn) window.location.href = 'login.html';
                const grid = document.getElementById('avatarGrid');
                const currentAvatar = Auth.getUserData()?.avatar;

                avatars.forEach(av => {
                    const div = document.createElement('div');
                    div.className = 'avatar-item' + (av === currentAvatar ? ' selected' : '');
                    div.innerText = av;
                    div.onclick = () => saveAvatar(av, div);
                    grid.appendChild(div);
                });
            });
        });

        async function saveAvatar(avatar) {
            const user = Auth.getCurrentUser();
            if(!user) return;
            await firebase.firestore().collection('users').doc(user.uid).update({ avatar: avatar });
            
            document.querySelectorAll('.avatar-item').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
            
            // تحديث الداتا المحلية
            const data = Auth.getUserData();
            if(data) data.avatar = avatar;
            
            setTimeout(() => { window.location.href = 'index.html'; }, 500);
        }
    </script>
    <script src="global.js"></script>
</body>
</html>
