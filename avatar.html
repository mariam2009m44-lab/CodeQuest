<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | اختر شخصيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/avatar.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="top-bar"><button class="skip-btn" onclick="window.location.href='languages.html'">تخطي ←</button></div>
<header class="avatar-header"><h1>👤 اختر شخصيتك</h1><p>اختار الصورة اللي بتمثلك</p></header>
<div class="avatar-grid" id="avatarGrid"></div>

<div class="reveal-overlay" id="revealOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;">
    <img id="revealAvatar" style="width:150px;height:150px;border-radius:50%;border:4px solid #00e5ff;box-shadow:0 0 50px #00e5ff;">
    <h2 style="color:#ffd700;margin-top:20px;font-weight:900;text-shadow:0 0 20px #ffd700;">استعد للمغامرة يا بطل! 🚀</h2>
    <button onclick="window.location.href='languages.html'" style="background:#27ae60;color:#fff;padding:15px 40px;border-radius:30px;border:none;font-weight:bold;margin-top:30px;font-family:Cairo;font-size:18px;cursor:pointer;">يلا نبدأ! 🎮</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        const user = Auth.getCurrentUser();
        const allSeeds = ['Jack', 'Emma', 'Oliver', 'Sophia', 'Leo', 'Mia', 'Max', 'Luna', 'Ryan', 'Aria', 'Noah', 'Zoe', 'Liam', 'Lily', 'Ethan', 'Chloe', 'Lucas', 'Ella'];
        const bgColors = ['ffdfbf', 'c0aede', 'b6e3f4', 'd1d4f9', 'ffd5dc', 'c8f7c5', 'ffe0b3', 'e0d5f9'];
        const grid = document.getElementById('avatarGrid');

        allSeeds.forEach((seed, i) => {
            const bg = bgColors[i % bgColors.length];
            const url = 'https://api.dicebear.com/7.x/adventurer/svg?seed=' + seed + '&backgroundColor=' + bg + '&radius=50';
            const card = document.createElement('div');
            card.className = 'avatar-card';
            card.innerHTML = '<img src="' + url + '">';
            card.onclick = async () => {
                localStorage.setItem('cq_avatar_' + user, url);
                if (Auth.getUserId()) {
                    try { await firebase.firestore().collection('users').doc(Auth.getUserId()).update({ avatar: url }); } catch(e) {}
                }
                document.getElementById('revealAvatar').src = url;
                document.getElementById('revealOverlay').style.display = 'flex';
                try { playSound('win'); } catch(e) {}
                try { confetti({ particleCount: 150, spread: 80 }); } catch(e) {}
            };
            grid.appendChild(card);
        });
    });
});
</script>
</body></html>
