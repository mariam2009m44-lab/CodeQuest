<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رحلة بايثون التفاعلية | Cody</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
  --bg:#05080f;
  --surface:#0f172a;
  --border:#1e293b;
  --text:#fff;
  --muted:#94a3b8;
  --cyan:#06b6d4;
  --green:#10b981;
  --gold:#fbbf24;
  --red:#f43f5e;
  --safe:env(safe-area-inset-bottom,20px);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Cairo',sans-serif;
}

body {
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100dvh;
  overflow:hidden;
}

button { font-family:inherit; }

.overlay,.editor-backdrop {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:999;
}

.overlay.open,.editor-backdrop.show { display:block; }

.sidebar {
  width:320px;
  min-width:0;
  background:#0b1120;
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  height:100dvh;
  z-index:1000;
  transition:.3s;
}

.sidebar-header {
  padding:20px 15px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sidebar-brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.sidebar-brand img { width:36px; }

.sidebar-brand h2 {
  font-size:1.3rem;
  font-weight:900;
}

.close-btn,.menu-btn {
  background:var(--border);
  border:0;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.close-btn {
  display:none;
  width:36px;
  height:36px;
}

.chapters-list {
  flex:1;
  overflow-y:auto;
  padding:20px 15px 150px;
}

.chapter-item {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}

.chapter-title {
  padding:18px 15px;
  cursor:pointer;
  position:relative;
  border-bottom:1px solid var(--border);
}

.chap-name {
  display:block;
  font-size:1.05rem;
  font-weight:700;
  padding-left:35px;
  margin-bottom:8px;
}

.chap-icon {
  position:absolute;
  left:15px;
  top:18px;
  font-size:1.3rem;
}

.chap-mini-prog {
  width:100%;
  height:6px;
  background:rgba(255,255,255,.1);
  border-radius:5px;
  overflow:hidden;
}

.chap-mini-fill {
  height:100%;
  background:var(--cyan);
}

.lessons-list {
  display:none;
  background:#0a0f1a;
}

.lessons-list.open { display:block; }

.lesson-link {
  display:block;
  padding:14px;
  color:var(--muted);
  text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.04);
}

.lesson-link.active,.lesson-link:hover {
  color:var(--cyan);
  background:#1a2332;
}

.lesson-link.locked-lesson {
  opacity:.45;
  cursor:not-allowed;
}

.main-area {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  height:100dvh;
  position:relative;
}

.top-bar {
  padding:15px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:15px;
  z-index:10;
}

.top-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu-btn {
  display:none;
  width:44px;
  height:44px;
  font-size:1.5rem;
}

.back-btn {
  color:white;
  text-decoration:none;
  font-weight:800;
  background:var(--border);
  padding:10px 15px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.stats-badge {
  background:rgba(251,191,36,.1);
  color:var(--gold);
  padding:8px 16px;
  border-radius:20px;
  font-weight:900;
  display:flex;
  gap:8px;
}

.progress-text {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  margin-bottom:8px;
}

.progress-text span:last-child { color:var(--cyan); }

.progress-bar {
  height:10px;
  background:var(--border);
  border-radius:10px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  background:var(--cyan);
  width:0;
  transition:.3s;
}

.content-wrapper {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.chat-container {
  flex:1;
  min-height:0;
  padding:20px 20px 120px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.message-row {
  display:flex;
  gap:12px;
  align-items:flex-end;
}

.message-row.cody { flex-direction:row; }
.message-row.student { flex-direction:row-reverse; }

.avatar {
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex-shrink:0;
  overflow:hidden;
  background:#0ea5e9;
}

.message-row.student .avatar { background:#4f46e5; }

.avatar img,.avatar svg {
  width:100%;
  height:100%;
  object-fit:cover;
}

.bubble {
  padding:16px 20px;
  font-size:1.05rem;
  line-height:1.8;
  max-width:85%;
  color:white;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px 20px 0 20px;
  overflow-wrap:anywhere;
}

.message-row.student .bubble {
  background:#4f46e5;
  border:0;
  border-radius:20px 20px 20px 0;
}

.bubble code {
  background:#000;
  color:var(--cyan);
  padding:4px 8px;
  border-radius:6px;
  font-family:'Fira Code',monospace;
  direction:ltr;
  display:inline-block;
}

.choices-container {
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
  max-width:500px;
  margin-right:56px;
  margin-top:10px;
}

.choice-btn {
  background:var(--surface);
  border:1px solid var(--border);
  color:white;
  padding:17px;
  border-radius:12px;
  font-size:1rem;
  font-weight:700;
  text-align:right;
  cursor:pointer;
}

.choice-btn:hover { border-color:var(--cyan); }

.open-editor-btn,.btn-next {
  background:var(--cyan);
  color:#000;
  border:0;
  padding:18px;
  border-radius:14px;
  font-weight:900;
  font-size:1.1rem;
  width:100%;
  cursor:pointer;
}

.open-editor-btn { margin-top:15px; }

.editor-wrapper {
  display:none;
  flex-direction:column;
  background:#0d1117;
  border:1px solid var(--border);
  overflow:hidden;
  z-index:2000;
}

.editor-wrapper.show { display:flex; }

.editor-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#161b22;
  border-bottom:1px solid var(--border);
  gap:10px;
}

.editor-title {
  color:var(--muted);
  font-family:'Fira Code',monospace;
}

.btn-run {
  background:var(--green);
  color:#000;
  padding:10px 18px;
  border-radius:8px;
  font-weight:900;
  border:0;
  cursor:pointer;
}

.code-area {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.CodeMirror {
  flex:1;
  width:100%;
  height:100%;
  font-family:'Fira Code',monospace;
  font-size:1rem;
  direction:ltr;
  text-align:left;
  background:#0d1117!important;
}

.lesson-help-panel {
  flex-shrink:0;
  padding:12px 15px;
  background:#111b2b;
  border-top:1px solid var(--border);
  color:#dbeafe;
  line-height:1.7;
  max-height:150px;
  overflow:auto;
}

.lesson-help-panel strong {
  display:block;
  color:var(--gold);
  margin-bottom:5px;
}

.lesson-help-panel p { margin:0 0 5px; }

#lessonSolutionText {
  margin-top:8px;
  padding:9px 11px;
  background:rgba(16,185,129,.10);
  border-right:3px solid var(--green);
  border-radius:8px;
}

.exam-feedback {
  min-height:28px;
  margin-top:12px;
  color:var(--gold);
  font-weight:700;
  line-height:1.7;
}

.output-area {
  height:120px;
  background:#000;
  padding:15px;
  color:#ccc;
  direction:ltr;
  text-align:left;
  overflow:auto;
  font-family:'Fira Code',monospace;
  white-space:pre-wrap;
  border-top:1px solid var(--border);
}

.bottom-action {
  position:fixed;
  bottom:calc(var(--safe) + 15px);
  left:50%;
  transform:translateX(-50%);
  display:none;
  z-index:900;
  width:90%;
  max-width:400px;
}

.bottom-action.show { display:block; }

.exam-view {
  display:none;
  flex-direction:column;
  flex:1;
  min-height:0;
  padding:25px;
  overflow-y:auto;
}

.exam-view.show { display:flex; }

.exam-header {
  text-align:center;
  margin-bottom:25px;
}

.exam-header h2 {
  color:var(--cyan);
  font-size:1.8rem;
  margin-bottom:15px;
}

.exam-progress-bar {
  height:10px;
  background:var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.exam-progress-fill {
  height:100%;
  background:var(--gold);
  width:0;
}

.exam-question-box {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
}

.exam-q-text {
  font-size:1.25rem;
  margin-bottom:20px;
}

.exam-options {
  display:flex;
  flex-direction:column;
  gap:12px;
}

.exam-opt-btn {
  background:#0b1120;
  border:1px solid var(--border);
  color:white;
  padding:17px;
  border-radius:12px;
  text-align:right;
  cursor:pointer;
  font-size:1rem;
}

.exam-opt-btn.correct {
  border-color:var(--green);
  color:var(--green);
}

.exam-opt-btn.wrong {
  border-color:var(--red);
  color:var(--red);
}

.exam-result {
  display:none;
  flex-direction:column;
  align-items:center;
  text-align:center;
  justify-content:center;
  flex:1;
}

.exam-result.show { display:flex; }

.score-ring {
  width:170px;
  height:170px;
  border-radius:50%;
  background:conic-gradient(var(--green) 0%,var(--border) 0%);
  display:grid;
  place-items:center;
  position:relative;
  margin-bottom:25px;
}

.score-ring::before {
  content:"";
  position:absolute;
  inset:10px;
  background:var(--surface);
  border-radius:50%;
}

.score-ring span {
  position:relative;
  font-size:2.5rem;
  font-weight:900;
  color:var(--gold);
}

.exam-result h2 { margin-bottom:12px; }
.exam-result p { color:var(--muted); margin-bottom:20px; }

@media(max-width:900px) {
  .sidebar {
    position:fixed;
    top:0;
    right:-100%;
    height:100dvh;
    width:100%;
  }

  .sidebar.open { right:0; }

  .close-btn,.menu-btn {
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .back-btn span { display:none; }

  .back-btn {
    width:44px;
    height:44px;
    padding:0;
    justify-content:center;
  }

  .chat-container { padding:15px 15px 140px; }
  .choices-container { margin-right:0; }
  .bubble { max-width:90%; }

  .editor-wrapper.show {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:80vh;
    border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.8);
  }
}

@media(min-width:901px) {
  .content-wrapper { flex-direction:row; }
  .chat-container { max-width:50%; padding-bottom:40px; }

  .editor-wrapper {
    flex:1;
    height:100%;
    border-radius:0;
    border-left:1px solid var(--border);
  }

  .editor-backdrop { display:none!important; }

  .bottom-action {
    position:relative;
    bottom:auto;
    left:auto;
    transform:none;
    width:100%;
    max-width:100%;
    padding:20px;
    background:var(--surface);
    border-top:1px solid var(--border);
  }

  .btn-next { max-width:400px; margin:auto; }
}
</style>

<script>
// ==========================================
// 1) المتغيرات الأساسية
// ==========================================

const chapterList = window.CHAPTERS || {};

let currentChapterId = 1;
let currentLessonIndex = 0;
let currentLesson = null;
let currentStepIndex = 0;

let currentExamQuestions = [];
let currentExamIndex = 0;
let examScore = 0;
let examAnswered = false;

let editor = null;
let currentChallenge = null;
let challengeSolved = false;

let profileAvatarHTML = "";
let studentAvatarId = "cody";

const chatContainer = document.getElementById("chatContainer");
const chaptersListElement = document.getElementById("chaptersList");
const bottomAction = document.getElementById("bottomAction");
const nextBtn = document.getElementById("nextBtn");

const completedChapters = new Set(
  JSON.parse(localStorage.getItem("cody_python_progress") || "[]")
);

const escapeHTML = (value) => {
  return String(value ?? "").replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
};

function saveLocalProgress() {
  localStorage.setItem(
    "cody_python_progress",
    JSON.stringify([...completedChapters])
  );
}

function getChapter(chapterId) {
  return chapterList[chapterId] || null;
}

function getChapterLessons(chapterId) {
  const chapter = getChapter(chapterId);
  return Array.isArray(chapter?.lessons) ? chapter.lessons : [];
}

function getLessonTitle(lesson) {
  return lesson?.title || "درس جديد";
}

function isExamLesson(lesson) {
  return /امتحان|اختبار/i.test(getLessonTitle(lesson));
}

function getCurrentChapterNumber() {
  return Number(currentChapterId) || 1;
}


// ==========================================
// 2) صورة الطالب من الحساب نفسه
// ==========================================

async function initializeStudentAvatar() {
  try {
    const avatarModule = await import("./js/avatars.js");

    const {
      renderAvatar,
      installAvatarStyles
    } = avatarModule;

    installAvatarStyles();

    const avatarStyle = document.createElement("style");
    avatarStyle.id = "python-chat-avatar-style";

    avatarStyle.textContent = `
      .message-row .avatar {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #17243b;
        border: 1px solid rgba(255,255,255,.12);
      }

      .message-row.student .avatar {
        background: #17243b;
      }

      .message-row .avatar .anime-avatar {
        width: 100%;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .message-row .avatar .anime-character {
        width: 100%;
        height: 100%;
      }

      .message-row .avatar .anime-avatar-svg {
        width: 100%;
        height: 100%;
        max-width: 44px;
        object-fit: contain;
      }
    `;

    if (!document.getElementById("python-chat-avatar-style")) {
      document.head.appendChild(avatarStyle);
    }

    const { requireUser } = await import("./js/auth.js");
    const { db } = await import("./js/firebase-config.js");

    const {
      doc,
      onSnapshot
    } = await import(
      "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
    );

    const user = await requireUser();

    if (!user?.uid) {
      profileAvatarHTML = renderAvatar("cody");
      return;
    }

    const userRef = doc(db, "users", user.uid);

    onSnapshot(
      userRef,
      (snapshot) => {
        if (!snapshot.exists()) {
          studentAvatarId = "cody";
          profileAvatarHTML = renderAvatar("cody");
          return;
        }

        const userData = snapshot.data() || {};
        const requestedAvatar = userData.activeAvatar || "cody";

        const inventory = Array.isArray(userData.inventory)
          ? userData.inventory
          : [];

        const avatars = avatarModule.getAllAvatars();

        const selectedAvatar = avatars.find((avatar) => {
          if (avatar.id !== requestedAvatar) return false;

          return !avatar.storeItem ||
            inventory.includes(avatar.id);
        });

        studentAvatarId = selectedAvatar?.id || "cody";
        profileAvatarHTML = renderAvatar(studentAvatarId);

        // تحديث صورة الطالب في الرسائل الموجودة بالفعل.
        document.querySelectorAll(
          ".message-row.student .avatar"
        ).forEach((avatarElement) => {
          avatarElement.innerHTML = profileAvatarHTML;
        });
      },
      (error) => {
        console.error("تعذر تحديث صورة الطالب:", error);
        studentAvatarId = "cody";
        profileAvatarHTML = renderAvatar("cody");
      }
    );

  } catch (error) {
    console.error("تعذر تحميل صورة الحساب:", error);
    profileAvatarHTML = "";
  }
}

function getStudentAvatarHTML() {

function updateXPDisplay(value) {
  const xpElement = document.getElementById("xpDisplay");

  if (xpElement) {
    xpElement.textContent = Math.max(0, Number(value) || 0);
  }
}

async function syncAccountRewards() {
  try {
    const { requireUser } = await import("./js/auth.js");
    const { db } = await import("./js/firebase-config.js");

    const {
      doc,
      getDoc
    } = await import(
      "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
    );

    const user = await requireUser();

    if (!user?.uid) return;

    const userRef = doc(db, "users", user.uid);
    const snapshot = await getDoc(userRef);

    if (!snapshot.exists()) return;

    const userData = snapshot.data() || {};

    // نقاط الحساب مصدرها Firestore، ولا نكتب XP محلياً إلى الحساب.
    updateXPDisplay(userData.xp || 0);

  } catch (error) {
    console.warn("تعذر مزامنة نقاط الحساب:", error);
  }
}

async function savePythonCloudProgress(lessonNumber) {
  try {
    const { saveLessonProgress } = await import("./js/auth.js");

    await saveLessonProgress({
      language: "python",
      chapter: Number(currentChapterId) - 1,
      lesson: Number(lessonNumber),
      completed: true
    });

    return true;

  } catch (error) {
    console.error("تعذر حفظ تقدم الدرس:", error);
    return false;
  }
}

async function syncPythonProgressFromCloud() {
  try {
    const {
      getLessonProgress
    } = await import("./js/auth.js");

    const cloudProgress = await getLessonProgress("python");

    if (!Array.isArray(cloudProgress)) return;

    const completedByChapter = {};

    cloudProgress.forEach((item) => {
      const chapterIndex = Number(item.chapter);
      const lessonIndex = Number(item.lesson);

      if (!Number.isInteger(chapterIndex) ||
          !Number.isInteger(lessonIndex)) {
        return;
      }

      if (!completedByChapter[chapterIndex]) {
        completedByChapter[chapterIndex] = new Set();
      }

      completedByChapter[chapterIndex].add(lessonIndex);
    });

    Object.entries(completedByChapter).forEach(
      ([chapterIndex, lessons]) => {
        // الفصل يحتوي على أربعة دروس تعليمية عادية.
        if ([0, 1, 2, 3].every((lessonIndex) =>
          lessons.has(lessonIndex)
        )) {
          completedChapters.add(Number(chapterIndex) + 1);
        }
      }
    );

    saveLocalProgress();
    renderSidebar();
    updateProgressBar();

  } catch (error) {
    console.warn("تعذر جلب تقدم بايثون من الحساب:", error);
  }
}

function renderSidebar() {
  if (!chaptersListElement) return;

  chaptersListElement.innerHTML = "";

  const chapterIds = Object.keys(chapterList)
    .map(Number)
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  chapterIds.forEach((chapterId, index) => {
    const chapter = getChapter(chapterId);
    if (!chapter) return;

    const lessons = getChapterLessons(chapterId);

    const isUnlocked =
      index === 0 || completedChapters.has(chapterId - 1);

    const isCompleted = completedChapters.has(chapterId);

    const completedLessonsCount = isCompleted
      ? lessons.length
      : 0;

    const progress = lessons.length
      ? Math.round(
          (completedLessonsCount / lessons.length) * 100
        )
      : 0;

    const chapterElement = document.createElement("div");
    chapterElement.className = "chapter-item";

    const titleElement = document.createElement("div");
    titleElement.className = "chapter-title";

    titleElement.innerHTML = `
      <span class="chap-name">
        ${escapeHTML(chapter.title || `الفصل ${chapterId}`)}
      </span>

      <i class="chap-icon ri-${
        isCompleted
          ? "checkbox-circle-fill"
          : isUnlocked
            ? "arrow-down-s-line"
            : "lock-line"
      }"></i>

      <div class="chap-mini-prog">
        <div
          class="chap-mini-fill"
          style="width:${progress}%"
        ></div>
      </div>
    `;

    const lessonsElement = document.createElement("div");
    lessonsElement.className = "lessons-list";

    if (chapterId === currentChapterId) {
      lessonsElement.classList.add("open");
    }

    lessons.forEach((lesson, lessonIndex) => {
      const lessonLink = document.createElement("a");

      lessonLink.href = "#";
      lessonLink.className = "lesson-link";

      const active =
        chapterId === currentChapterId &&
        lessonIndex === currentLessonIndex;

      if (active) {
        lessonLink.classList.add("active");
      }

      if (!isUnlocked) {
        lessonLink.classList.add("locked-lesson");
      }

      const examIcon = isExamLesson(lesson)
        ? '<i class="ri-graduation-cap-line"></i> '
        : '<i class="ri-book-open-line"></i> ';

      lessonLink.innerHTML =
        examIcon + escapeHTML(getLessonTitle(lesson));

      lessonLink.addEventListener("click", (event) => {
        event.preventDefault();

        if (!isUnlocked) {
          showToast("أكمل الفصل السابق أولاً لفتح هذا الفصل.");
          return;
        }

        loadLesson(chapterId, lessonIndex);

        if (window.innerWidth <= 900) {
          toggleSidebar();
        }
      });

      lessonsElement.appendChild(lessonLink);
    });

    titleElement.addEventListener("click", () => {
      if (!isUnlocked) {
        showToast("هذا الفصل لم يُفتح بعد. أكمل الفصل السابق أولاً.");
        return;
      }

      const wasOpen = lessonsElement.classList.contains("open");

      document.querySelectorAll(".lessons-list.open").forEach((list) => {
        list.classList.remove("open");
      });

      if (!wasOpen) {
        lessonsElement.classList.add("open");
      }
    });

    chapterElement.appendChild(titleElement);
    chapterElement.appendChild(lessonsElement);
    chaptersListElement.appendChild(chapterElement);
  });
}

function updateProgressBar() {
  const totalChapters = Object.keys(chapterList).length || 12;
  const completedCount = completedChapters.size;

  const percent = Math.min(
    100,
    Math.round((completedCount / totalChapters) * 100)
  );

  const percentElement = document.getElementById("progressPercent");
  const fillElement = document.getElementById("progressFill");

  if (percentElement) {
    percentElement.textContent = `${percent}%`;
  }

  if (fillElement) {
    fillElement.style.width = `${percent}%`;
  }
}

// ==========================================
// 6) إدارة الدروس وعرض خطواتها
// ==========================================

let stepCompleted = true;
let currentStep = null;
let currentHintIndex = 0;
let challengeHelpVisible = false;

const completedLessonKeys = new Set(
  JSON.parse(
    localStorage.getItem("cody_python_completed_lessons") || "[]"
  )
);

function saveCompletedLessonKeys() {
  localStorage.setItem(
    "cody_python_completed_lessons",
    JSON.stringify([...completedLessonKeys])
  );
}

function getLessonKey(chapterId, lessonIndex) {
  return `${chapterId}_${lessonIndex}`;
}

function isLessonCompleted(chapterId, lessonIndex) {
  return completedLessonKeys.has(
    getLessonKey(chapterId, lessonIndex)
  );
}

function markLessonCompleted(chapterId, lessonIndex) {
  completedLessonKeys.add(
    getLessonKey(chapterId, lessonIndex)
  );

  saveCompletedLessonKeys();

  const regularLessons = getChapterLessons(chapterId)
    .filter((lesson) => !isExamLesson(lesson));

  const allRegularLessonsCompleted = regularLessons.every(
    (lesson) => {
      const index = getChapterLessons(chapterId).indexOf(lesson);
      return isLessonCompleted(chapterId, index);
    }
  );

  if (allRegularLessonsCompleted && regularLessons.length >= 4) {
    completedChapters.add(Number(chapterId));
    saveLocalProgress();
  }

  renderSidebar();
  updateProgressBar();
}

function loadLesson(chapterId, lessonIndex) {
  const chapter = getChapter(chapterId);
  const lessons = getChapterLessons(chapterId);

  if (!chapter || !lessons[lessonIndex]) {
    showToast("لم يتم العثور على هذا الدرس.");
    return;
  }

  currentChapterId = Number(chapterId);
  currentLessonIndex = Number(lessonIndex);
  currentLesson = lessons[currentLessonIndex];

  currentStepIndex = 0;
  currentStep = null;
  stepCompleted = true;
  currentHintIndex = 0;
  challengeHelpVisible = false;

  const examView = document.getElementById("examView");
  const contentWrapper = document.querySelector(".content-wrapper");

  examView?.classList.remove("show");

  if (contentWrapper) {
    contentWrapper.style.display = "flex";
  }

  const examResult = document.getElementById("examResultBox");
  examResult?.classList.remove("show");

  const questionBox = document.getElementById("examQuestionBox");
  if (questionBox) questionBox.style.display = "block";

  const editorContainer = document.getElementById("editorContainer");
  if (editorContainer) editorContainer.innerHTML = "";

  editor = null;

  clearChat();
  showBottomAction(false);

  renderSidebar();

  if (isExamLesson(currentLesson)) {
    if (typeof startExam === "function") {
      startExam();
    } else {
      addBubble("cody", "الامتحان بيتم تجهيزه...");
    }
    return;
  }

  localStorage.setItem(
    "cody_last_lesson",
    JSON.stringify({
      chapter: currentChapterId,
      lesson: currentLessonIndex
    })
  );

  addBubble(
    "cody",
    `<strong>${escapeHTML(getLessonTitle(currentLesson))}</strong><br>
    أهلاً بك! جاهز نبدأ الدرس خطوة بخطوة؟`
  );

  processStep();
}

function processStep() {
  if (!currentLesson ||
      !Array.isArray(currentLesson.steps)) {
    showToast("محتوى الدرس غير متاح حالياً.");
    return;
  }

  const steps = currentLesson.steps;

  if (currentStepIndex >= steps.length) {
    completeCurrentLesson();
    return;
  }

  currentStep = steps[currentStepIndex];
  stepCompleted = false;

  currentHintIndex = 0;
  challengeHelpVisible = false;

  showBottomAction(false);

  if (!currentStep || typeof currentStep !== "object") {
    stepCompleted = true;
    showBottomAction(true);
    return;
  }

  switch (currentStep.type) {
    case "cody":
      addBubble("cody", currentStep.text || "");
      stepCompleted = true;
      showBottomAction(true);
      break;

    case "choice":
      renderChoices(currentStep);
      break;

    case "challenge":
      addBubble(
        "cody",
        currentStep.text ||
        "دلوقتي دورك تطبق اللي اتعلمته في محرر بايثون."
      );

      showEditor(currentStep);
      break;

    case "quiz":
      renderInlineQuiz(currentStep);
      break;

    default:
      addBubble(
        "cody",
        currentStep.text || "نكمل الدرس مع بعض!"
      );
      stepCompleted = true;
      showBottomAction(true);
      break;
  }
}

// ==========================================

function renderChoices(step) {
  addBubble("cody", step.question || "اختار الإجابة المناسبة:");

  const choicesWrapper = document.createElement("div");
  choicesWrapper.className = "choices-container";

  (step.options || []).forEach((option, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice-btn";
    button.textContent = option;

    button.addEventListener("click", () => {
      if (stepCompleted) return;

      stepCompleted = true;

      choicesWrapper.querySelectorAll("button").forEach((item) => {
        item.disabled = true;
        item.style.opacity = ".55";
      });

      button.style.opacity = "1";
      button.style.borderColor = "var(--cyan)";

      addStudentMessage(option);

      const reply = Array.isArray(step.replies)
        ? step.replies[index]
        : "";

      if (reply) {
        addBubble("cody", reply);
      }

      showBottomAction(true);
    });

    choicesWrapper.appendChild(button);
  });

  chatContainer?.appendChild(choicesWrapper);
  scrollChatToBottom();
}

// ==========================================

function renderInlineQuiz(step) {
  addBubble("cody", step.question || "اختار الإجابة الصحيحة:");

  const optionsWrapper = document.createElement("div");
  optionsWrapper.className = "choices-container";

  const feedback = document.createElement("div");
  feedback.className = "exam-feedback";
  feedback.setAttribute("aria-live", "polite");

  (step.options || []).forEach((option, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice-btn";
    button.textContent = option;

    button.addEventListener("click", () => {
      if (stepCompleted) return;

      stepCompleted = true;

      optionsWrapper.querySelectorAll("button").forEach((item) => {
        item.disabled = true;
      });

      const isCorrect = index === Number(step.correct);

      button.style.borderColor = isCorrect
        ? "var(--green)"
        : "var(--red)";

      button.style.color = isCorrect
        ? "var(--green)"
        : "var(--red)";

      addStudentMessage(option);

      if (isCorrect) {
        feedback.textContent = "إجابة صحيحة! أحسنت! 🎉";
      } else {
        const correctAnswer = step.options?.[step.correct];

        feedback.textContent =
          `الإجابة الصحيحة هي: ${correctAnswer || "الإجابة الموضحة في الشرح"}`;
      }

      const explanation = step.explanation
        ? `<br><br><strong>خلينا نفهم السبب:</strong> ${step.explanation}`
        : "";

      addBubble(
        "cody",
        `${isCorrect ? "ممتاز!" : "ولا يهمك، بنتعلم من المحاولة."}${explanation}`
      );

      if (!isCorrect && step.options?.[step.correct]) {
        feedback.textContent += " — راجع الشرح قبل المتابعة.";
      }

      showBottomAction(true);
      scrollChatToBottom();
    });

    optionsWrapper.appendChild(button);
  });

  chatContainer?.appendChild(optionsWrapper);
  chatContainer?.appendChild(feedback);

  scrollChatToBottom();
}

function getChallengeHints(step) {
  if (Array.isArray(step.hints) && step.hints.length) {
    return step.hints;
  }

  return [
    "اقرأ المطلوب مرة تانية، وحدد إيه اللي المفروض يظهر على الشاشة.",
    "فكر في الأمر أو الفكرة البرمجية اللي اتعلمناها في الدرس.",
    "قسّم المطلوب لخطوات صغيرة، واكتب كل خطوة لوحدها."
  ];
}

function showNextHint() {
  if (!currentChallenge || challengeSolved) return;

  const hints = getChallengeHints(currentChallenge);

  const helpText = document.getElementById("lessonHelpText");

  if (!helpText) return;

  if (currentHintIndex < hints.length) {
    helpText.textContent =
      `التلميح ${currentHintIndex + 1}: ${hints[currentHintIndex]}`;

    currentHintIndex++;
  } else {
    helpText.textContent =
      "استخدم زر عرض الحل والشرح لو ما زلت محتاج مساعدة.";
  }
}

function normalizeOutput(value) {
  return String(value ?? "")
    .replace(/\r/g, "")
    .trim();
}

async function runPythonChallenge() {
  if (!currentChallenge || challengeSolved) return;

  const outputElement = document.getElementById("pythonOutput");
  const runButton = document.getElementById("runPythonBtn");

  if (!outputElement) return;

  const code = getEditorCode();

  if (!code.trim()) {
    outputElement.textContent =
      "اكتب الكود الأول، وبعدها اضغط تشغيل.";
    return;
  }

  if (typeof Sk === "undefined") {
    outputElement.textContent =
      "مشغل بايثون غير متاح حالياً. تأكد من تحميل مكتبة Skulpt.";
    return;
  }

  runButton.disabled = true;
  runButton.textContent = "جاري التشغيل...";

  outputElement.textContent = "جاري تنفيذ الكود...";

  let programOutput = "";

  try {
    Sk.configure({
      output: (text) => {
        programOutput += text;
      },

      read: (filename) => {
        if (
          Sk.builtinFiles === undefined ||
          Sk.builtinFiles.files[filename] === undefined
        ) {
          throw new Error(`الملف غير موجود: ${filename}`);
        }

        return Sk.builtinFiles.files[filename];
      },

      __future__: Sk.python3
    });

    await Sk.misceval.asyncToPromise(() => {
      return Sk.importMainWithBody(
        "<stdin>",
        false,
        code,
        true
      );
    });

    outputElement.textContent = programOutput || "تم تشغيل الكود بدون مخرجات.";

    let passed = false;

    if (typeof currentChallenge.check === "function") {
      passed = Boolean(currentChallenge.check(code));
    } else if (currentChallenge.expected !== undefined) {
      passed =
        normalizeOutput(programOutput) ===
        normalizeOutput(currentChallenge.expected);
    }

    if (passed) {
      challengeSolved = true;
      stepCompleted = true;

      outputElement.textContent +=
        "\n\n✓ أحسنت! الحل صحيح، نجحت في التحدي.";

      outputElement.style.color = "var(--green)";

      if (typeof confetti === "function") {
        confetti({
          particleCount: 70,
          spread: 65,
          origin: { y: 0.7 }
        });
      }

      addBubble(
        "cody",
        currentChallenge.successMsg ||
        "ممتاز! 🎉 نفذت التحدي بنجاح."
      );

      showBottomAction(true);

      document.getElementById("lessonHelpText").textContent =
        "أحسنت! أنهيت التحدي بنجاح. اضغط متابعة للخطوة التالية.";

      closeEditor();

    } else {
      outputElement.style.color = "var(--gold)";

      outputElement.textContent +=
        "\n\nالكود اشتغل، لكن الناتج أو طريقة الحل لسه مش مطابقة للمطلوب. راجع المطلوب وحاول مرة تانية.";

      addBubble(
        "cody",
        "الكود اشتغل، ودي خطوة كويسة! راجع النتيجة المطلوبة وحاول تعدّل الكود. تقدر تطلب تلميح لو احتجت."
      );
    }

  } catch (error) {
    outputElement.style.color = "var(--red)";

    outputElement.textContent =
      "حصل خطأ أثناء تشغيل الكود:\n" +
      (error?.toString?.() || "خطأ غير معروف") +
      "\n\nراجع الأقواس وعلامات التنصيص وجرّب تاني.";

    addBubble(
      "cody",
      "ولا يهمك! الأخطاء جزء طبيعي من البرمجة. اقرأ رسالة الخطأ وحاول تصلح الكود."
    );

  } finally {
    runButton.disabled = false;

    runButton.innerHTML = `
      <i class="ri-play-fill"></i>
      تشغيل الكود
    `;
  }
}

function advanceChat() {
  if (!currentLesson) return;

  if (!stepCompleted) {
    showToast("كمّل الخطوة الحالية الأول.");
    return;
  }

  currentStepIndex++;

  const editorContainer = document.getElementById("editorContainer");

  if (editorContainer) {
    editorContainer.innerHTML = "";
  }

  editor = null;
  currentChallenge = null;

  document.getElementById("editorBackdrop")
    ?.classList.remove("show");

  showBottomAction(false);

  processStep();
}

async function completeCurrentLesson() {
  if (!currentLesson) return;

  showBottomAction(false);

  addBubble(
    "cody",
    "🎉 رائع! خلصت الدرس ده بنجاح. استمر، كل خطوة بتقربك من إنك تبقى مبرمج شاطر."
  );

  const isExam = isExamLesson(currentLesson);

  if (!isExam) {
    markLessonCompleted(
      currentChapterId,
      currentLessonIndex
    );

    // الفصول العادية الأربعة تُحفظ بمؤشرات 0 إلى 3.
    if (currentLessonIndex >= 0 && currentLessonIndex <= 3) {
      await savePythonCloudProgress(currentLessonIndex);
    }

    await syncAccountRewards();
  }

  const lessons = getChapterLessons(currentChapterId);
  const nextLessonIndex = currentLessonIndex + 1;

  if (nextLessonIndex < lessons.length) {
    const nextLesson = lessons[nextLessonIndex];

    const nextButton = document.createElement("button");
    nextButton.type = "button";
    nextButton.className = "open-editor-btn";
    nextButton.textContent =
      `الانتقال إلى: ${getLessonTitle(nextLesson)}`;

    nextButton.addEventListener("click", () => {
      loadLesson(currentChapterId, nextLessonIndex);
    });

    chatContainer?.appendChild(nextButton);

  } else {
    const nextChapterId = currentChapterId + 1;

    if (getChapter(nextChapterId)) {
      const nextChapterButton = document.createElement("button");

      nextChapterButton.type = "button";
      nextChapterButton.className = "open-editor-btn";
      nextChapterButton.textContent = "الانتقال إلى الفصل التالي";

      nextChapterButton.addEventListener("click", () => {
        if (!completedChapters.has(currentChapterId)) {
          showToast("أكمل الدروس التعليمية في الفصل قبل الانتقال.");
          return;
        }

        loadLesson(nextChapterId, 0);
      });

      chatContainer?.appendChild(nextChapterButton);
    }
  }

  scrollChatToBottom();
}

      explanation: "المشروع الجيد يحقق هدفه ويكون واضحاً وقابلاً للتطوير."
    }
  ]
};


// ==========================================
// 14) خلط الأسئلة عشوائياً
// ==========================================

function shuffleArray(items) {
  const shuffled = [...items];

  for (let index = shuffled.length - 1; index > 0; index--) {
    const randomIndex = Math.floor(Math.random() * (index + 1));

    [shuffled[index], shuffled[randomIndex]] =
      [shuffled[randomIndex], shuffled[index]];
  }

  return shuffled;
}

function prepareExamQuestions(lesson) {
  const originalQuestions = Array.isArray(lesson?.steps)
    ? lesson.steps.filter((step) => step.type === "quiz")
    : [];

  const extraQuestions =
    PYTHON_EXTRA_QUESTIONS[currentChapterId] || [];

  const shuffledExtra = shuffleArray(extraQuestions);

  const combined = [
    ...originalQuestions,
    ...shuffledExtra.slice(0, 4)
  ];

  // ضمان وجود خمسة أسئلة على الأقل.
  while (combined.length < 5 && shuffledExtra.length) {
    combined.push(
      shuffledExtra[combined.length % shuffledExtra.length]
    );
  }

  return shuffleArray(combined);
}


// ==========================================
// 15) بدء الامتحان
// ==========================================

function startExam() {
  if (!currentLesson) return;

  currentExamQuestions = prepareExamQuestions(currentLesson);
  currentExamIndex = 0;
  examScore = 0;
  examAnswered = false;

  clearChat();
  showBottomAction(false);

  const contentWrapper = document.querySelector(".content-wrapper");
  const examView = document.getElementById("examView");

  if (contentWrapper) {
    contentWrapper.style.display = "none";
  }

  examView?.classList.add("show");

  const title = document.getElementById("examTitle");

  if (title) {
    title.textContent = getLessonTitle(currentLesson);
  }

  const resultBox = document.getElementById("examResultBox");
  const questionBox = document.getElementById("examQuestionBox");

  resultBox?.classList.remove("show");

  if (questionBox) {
    questionBox.style.display = "block";
  }

  if (!currentExamQuestions.length) {
    const questionText = document.getElementById("examQuestionText");

    if (questionText) {
      questionText.textContent =
        "لا توجد أسئلة متاحة لهذا الامتحان حالياً.";
    }

    document.getElementById("examOptionsContainer").innerHTML = "";
    return;
  }

  showExamQuestion();
}


// ==========================================
// 16) عرض سؤال الامتحان
// ==========================================

function showExamQuestion() {
  if (currentExamIndex >= currentExamQuestions.length) {
    endExam();
    return;
  }

  examAnswered = false;

  const question = currentExamQuestions[currentExamIndex];

  const questionText = document.getElementById("examQuestionText");
  const optionsContainer = document.getElementById("examOptionsContainer");
  const progressText = document.getElementById("examProgress");
  const progressFill = document.getElementById("examProgFill");
  const feedback = document.getElementById("examFeedback");

  if (!questionText || !optionsContainer) return;

  questionText.textContent = question.question || "اختر الإجابة الصحيحة";

  optionsContainer.innerHTML = "";

  if (feedback) {
    feedback.textContent = "";
  }

  const total = currentExamQuestions.length;
  const currentNumber = currentExamIndex + 1;

  if (progressText) {
    progressText.textContent =
      `السؤال ${currentNumber} من ${total}`;
  }

  if (progressFill) {
    progressFill.style.width =
      `${(currentNumber / total) * 100}%`;
  }

  (question.options || []).forEach((option, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "exam-opt-btn";
    button.textContent = option;

    button.addEventListener("click", () => {
      answerExamQuestion(index, question, button);
    });

    optionsContainer.appendChild(button);
  });
}


// ==========================================
// 17) تصحيح إجابة الامتحان
// ==========================================

function answerExamQuestion(selectedIndex, question, selectedButton) {
  if (examAnswered) return;

  examAnswered = true;

  const optionsContainer = document.getElementById("examOptionsContainer");
  const feedback = document.getElementById("examFeedback");

  const correctIndex = Number(question.correct);
  const isCorrect = selectedIndex === correctIndex;

  if (isCorrect) {
    examScore++;
    selectedButton.classList.add("correct");

    if (feedback) {
      feedback.textContent = "إجابة صحيحة! ممتاز! 🎉";
      feedback.style.color = "var(--green)";
    }
  } else {
    selectedButton.classList.add("wrong");

    if (feedback) {
      feedback.textContent =
        `الإجابة الصحيحة: ${question.options?.[correctIndex] || ""}`;

      feedback.style.color = "var(--red)";
    }
  }

  optionsContainer?.querySelectorAll("button").forEach((button, index) => {
    button.disabled = true;

    if (index === correctIndex) {
      button.classList.add("correct");
    }
  });

  if (question.explanation && feedback) {
    feedback.textContent += ` — ${question.explanation}`;
  }

  const nextQuestionButton = document.createElement("button");

  nextQuestionButton.type = "button";
  nextQuestionButton.className = "open-editor-btn";
  nextQuestionButton.style.marginTop = "18px";

  nextQuestionButton.textContent =
    currentExamIndex + 1 < currentExamQuestions.length
      ? "السؤال التالي"
      : "عرض النتيجة";

  nextQuestionButton.addEventListener("click", () => {
    currentExamIndex++;
    showExamQuestion();
  });

  optionsContainer?.appendChild(nextQuestionButton);
}


// ==========================================
// 18) نتيجة الامتحان
// ==========================================

function endExam() {
  const total = currentExamQuestions.length;
  const percentage = total
    ? Math.round((examScore / total) * 100)
    : 0;

  const passed = percentage >= 50;

  const questionBox = document.getElementById("examQuestionBox");
  const resultBox = document.getElementById("examResultBox");

  questionBox.style.display = "none";
  resultBox.classList.add("show");

  const scoreElement = document.getElementById("finalScore");
  const ring = document.getElementById("scoreRing");
  const title = document.getElementById("resultTitle");
  const message = document.getElementById("resultMsg");

  if (scoreElement) {
    scoreElement.textContent = `${examScore}/${total}`;
  }

  if (ring) {
    ring.style.background =
      `conic-gradient(var(--green) ${percentage}%, var(--border) ${percentage}%)`;
  }

  if (title) {
    title.textContent = passed
      ? "أحسنت! نجحت في الامتحان 🎉"
      : "محاولة جيدة! تقدر تتحسن 💪";
  }

  if (message) {
    message.textContent =
      `حصلت على ${percentage}% — ${examScore} إجابات صحيحة من ${total} أسئلة. ` +
      (passed
        ? "راجع الدروس واستعد للفصل التالي."
        : "راجع الإجابات وحاول مرة أخرى.");
  }

  const oldActions = resultBox.querySelector(".exam-result-actions");
  oldActions?.remove();

  const actions = document.createElement("div");
  actions.className = "exam-result-actions";

  actions.style.cssText = `
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:360px;
    margin-top:20px;
  `;

  const retryButton = document.createElement("button");
  retryButton.type = "button";
  retryButton.className = "open-editor-btn";
  retryButton.textContent = "إعادة الامتحان";

  retryButton.addEventListener("click", () => {
    startExam();
  });

  actions.appendChild(retryButton);

  const backButton = document.createElement("button");
  backButton.type = "button";
  backButton.className = "choice-btn";
  backButton.textContent = "العودة إلى الدروس";

  backButton.addEventListener("click", () => {
    const contentWrapper = document.querySelector(".content-wrapper");

    resultBox.classList.remove("show");
    questionBox.style.display = "block";

    document.getElementById("examView")
      ?.classList.remove("show");

    if (contentWrapper) {
      contentWrapper.style.display = "flex";
    }

    loadLesson(currentChapterId, 0);
  });

  actions.appendChild(backButton);

  if (passed) {
    const nextChapterId = currentChapterId + 1;

    if (getChapter(nextChapterId)) {
      const nextChapterButton = document.createElement("button");

      nextChapterButton.type = "button";
      nextChapterButton.className = "btn-next";
      nextChapterButton.textContent = "ابدأ الفصل التالي";

      nextChapterButton.addEventListener("click", () => {
                completedChapters.add(currentChapterId);

        // حفظ تقدم الطالب محلياً
        saveLocalProgress();

        // تحديث قائمة الفصول وشريط التقدم
        renderSidebar();
        updateProgressBar();

        // الانتقال إلى الفصل التالي
        loadLesson(nextChapterId, 0);
      });

      actions.appendChild(nextChapterButton);
    }
  }

  // إضافة أزرار النتيجة إلى صندوق النتيجة
  resultBox.appendChild(actions);
}


// ==========================================
// 19) إغلاق وتشغيل الصفحة
// ==========================================

document.addEventListener("DOMContentLoaded", async () => {
  try {
    // مزامنة تقدم الطالب من السحابة إن كانت الدالة متاحة
    if (typeof syncPythonProgressFromCloud === "function") {
      await syncPythonProgressFromCloud();
    }

    // مزامنة المكافآت إن كانت الدالة متاحة
    if (typeof syncAccountRewards === "function") {
      await syncAccountRewards();
    }

    // تحديث واجهة الفصول والتقدم
    if (typeof renderSidebar === "function") {
      renderSidebar();
    }

    if (typeof updateProgressBar === "function") {
      updateProgressBar();
    }

    // تحميل الفصل والدرس المحددين
    const params = new URLSearchParams(window.location.search);

    const chapterId = Number(params.get("ch")) || 1;
    const lessonIndex = Number(params.get("lesson")) || 0;

    loadLesson(chapterId, lessonIndex);

  } catch (error) {
    console.error("خطأ أثناء تشغيل صفحة تعلم بايثون:", error);

    if (typeof showToast === "function") {
      showToast("حدث خطأ أثناء تحميل الدروس. حاول تحديث الصفحة.");
    }
  }
});
</script>
