<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>رحلة بايثون التفاعلية | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;600&display=swap');

    :root { 
      --bg: #05080f; 
      --surface: rgba(15, 23, 42, 0.7);
      --surface-hover: rgba(30, 41, 59, 0.9);
      --sidebar-bg: rgba(9, 13, 23, 0.98);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(6, 182, 212, 0.5);
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --cyan: #06b6d4; 
      --green: #10b981; 
      --gold: #fbbf24; 
      --red: #f43f5e;
      --safe: env(safe-area-inset-bottom, 20px); 
      --font-main: 'Cairo', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: var(--font-main); 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      height: 100dvh; 
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(79, 70, 229, 0.08), transparent 40%);
    }

    button { font-family: var(--font-main); cursor: pointer; border: none; outline: none; transition: 0.3s; }
    
    /* ============ القائمة الجانبية ============ */
    .overlay { 
      display: none; position: fixed; inset: 0; 
      background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 999; 
    }
    .overlay.open { display: block; animation: fadeIn 0.3s ease; }

    .sidebar { 
      width: 340px; background: var(--sidebar-bg); border-left: 1px solid var(--border); 
      display: flex; flex-direction: column; height: 100dvh; z-index: 1000; 
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
    }
    .sidebar-header { 
      padding: 20px 15px; border-bottom: 1px solid var(--border); 
      display: flex; align-items: center; justify-content: space-between; 
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; }
    .sidebar-brand img { width: 34px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    .sidebar-brand h2 { color: var(--text); font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; }
    .close-btn { display: none; background: rgba(255,255,255,0.05); border-radius: 50%; width: 36px; height: 36px; color: var(--text-muted); font-size: 1.2rem; }
    .close-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .chapters-list { 
      flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 120px; 
      display: flex; flex-direction: column; gap: 12px; 
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    
    .chapter-item { 
      background: var(--surface); border: 1px solid var(--border); 
      border-radius: 12px; overflow: hidden; transition: 0.3s;
    }
    .chapter-item:hover { border-color: rgba(255,255,255,0.15); }
    .chapter-title { 
      padding: 16px; font-weight: 700; font-size: 1rem; color: var(--text); 
      display: flex; justify-content: space-between; align-items: center; 
      cursor: pointer; background: linear-gradient(to right, transparent, rgba(255,255,255,0.02));
    }
    .chapter-title:hover { background: linear-gradient(to right, transparent, rgba(255,255,255,0.05)); }
    .chap-info { display: flex; flex-direction: column; gap: 4px; }
    .chap-mini-prog { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; overflow: hidden;}
    .chap-mini-fill { height: 100%; background: var(--cyan); width: 0%; border-radius: 2px; transition: 0.3s;}

    .chapter-item.locked { opacity: 0.7; }
    .chapter-item.locked .chapter-title { cursor: not-allowed; color: var(--text-muted); }
    .chapter-item.locked .chap-mini-fill { background: var(--text-muted); }

    .lessons-list { display: none; flex-direction: column; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); }
    .lessons-list.open { display: flex; animation: slideDown 0.3s ease; }
    
    .lesson-link { 
      padding: 14px 16px; color: var(--text-muted); text-decoration: none; 
      font-size: 0.95rem; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex; align-items: center; gap: 10px; transition: 0.2s; 
    }
    .lesson-link:last-child { border-bottom: none; }
    .lesson-link:hover:not(.locked-lesson), .lesson-link.active { 
      color: var(--cyan); background: rgba(6, 182, 212, 0.05); padding-right: 20px; 
    }
    .lesson-link.active { border-right: 3px solid var(--cyan); }
    .lesson-link.locked-lesson { opacity: 0.5; cursor: not-allowed; }

    /* ============ المنطقة الرئيسية ============ */
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; }
    
    /* الشريط العلوي - متجاوب للموبايل */
    .top-bar { 
      padding: 12px 16px; background: var(--surface); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); display: flex; align-items: center; 
      justify-content: space-between; gap: 10px; z-index: 10; flex-wrap: wrap;
    }
    .menu-btn { display: none; background: rgba(255,255,255,0.05); border-radius: 8px; width: 40px; height: 40px; color: var(--text); font-size: 1.3rem; justify-content: center; align-items: center; }
    
    .back-btn { 
      color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.9rem; 
      background: rgba(255,255,255,0.05); padding: 8px 14px; border-radius: 10px; 
      border: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    
    .progress-container { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 4px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .progress-text span:last-child { color: var(--cyan); }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), #3b82f6); width: 0%; transition: 0.5s ease; border-radius: 10px; }
    
    .stats-badge { 
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.02)); 
      color: var(--gold); padding: 6px 12px; border-radius: 16px; font-weight: 900; font-size: 0.9rem; 
      border: 1px solid rgba(251, 191, 36, 0.2); display: flex; align-items: center; gap: 4px;
    }
    
    /* ============ الشات ============ */
    .chat-container { 
      flex: 1; padding: 20px; padding-bottom: 120px; overflow-y: auto; 
      display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; 
    }
    .message-row { display: flex; gap: 12px; align-items: flex-end; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    .message-row.cody { flex-direction: row; }
    .message-row.cody .avatar { background: linear-gradient(135deg, #0ea5e9, #2563eb); box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); }
    .message-row.cody .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 4px 20px; }
    
    .message-row.student { flex-direction: row-reverse; }
    .message-row.student .avatar { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }
    .message-row.student .bubble { background: linear-gradient(135deg, #4f46e5, #4338ca); border: none; border-radius: 20px 20px 20px 4px; color: #fff; }
    
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0; }
    .bubble { padding: 14px 18px; font-size: 1rem; line-height: 1.8; max-width: 85%; position: relative; }
    .bubble code { background: rgba(0,0,0,0.4); color: var(--cyan); padding: 3px 8px; border-radius: 6px; font-family: var(--font-code); direction: ltr; display: inline-block; margin: 3px 0; font-size: 0.95rem; border: 1px solid rgba(255,255,255,0.05); }
    
    /* مؤشر الكتابة */
    .typing-indicator { display: flex; gap: 4px; padding: 10px 14px; background: var(--surface); border-radius: 20px; width: fit-content; border: 1px solid var(--border); }
    .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    /* ============ الخيارات ============ */
    .choices-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; margin-right: 52px; margin-top: 5px; }
    .choice-btn { 
      background: var(--surface); border: 1px solid var(--border); color: var(--text); 
      padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; 
      text-align: right; position: relative; overflow: hidden;
    }
    .choice-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--cyan), transparent); opacity: 0; transition: 0.3s; z-index: 0; }
    .choice-btn:hover { border-color: var(--cyan); transform: translateX(-4px); }
    .choice-btn:hover::before { opacity: 0.1; }
    .choice-btn span { position: relative; z-index: 1; }

    /* ============ المحرر - تم إصلاحه بالكامل ============ */
    .editor-wrapper { 
      display: none; 
      width: 100%; 
      margin: 15px 0; 
      background: #0d1117; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    }
    .editor-wrapper.show { display: block; animation: slideUp 0.4s ease; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
    .editor-dots { display: flex; gap: 6px; }
    .editor-dot { width: 10px; height: 10px; border-radius: 50%; }
    .editor-dot.r { background: #ff5f56; } .editor-dot.y { background: #ffbd2e; } .editor-dot.g { background: #27c93f; }
    .editor-title { color: var(--text-muted); font-family: var(--font-code); font-size: 0.8rem; }
    .btn-run { background: var(--green); color: #000; padding: 6px 16px; border-radius: 6px; font-weight: 900; display: flex; align-items: center; gap: 4px; font-size: 0.85rem; }
    .btn-run:hover { background: #34d399; }
    
    .code-area { display: flex; flex-direction: column; width: 100%; }
    .CodeMirror { 
      width: 100% !important;
      height: 250px !important; 
      min-height: 250px;
      font-family: var(--font-code); 
      font-size: 1rem; 
      direction: ltr; 
      text-align: left; 
      border-radius: 0; 
    }
    .output-area { height: 120px; background: #000; padding: 12px; font-family: var(--font-code); color: #d1d5db; direction: ltr; text-align: left; overflow-y: auto; font-size: 0.9rem; white-space: pre-wrap; border-top: 1px solid var(--border); }

    /* ============ واجهة الامتحان ============ */
    .exam-view { display: none; flex-direction: column; flex: 1; padding: 20px; background: var(--bg); overflow-y: auto; }
    .exam-view.show { display: flex; animation: fadeIn 0.5s ease; }
    
    .exam-header { text-align: center; margin-bottom: 30px; }
    .exam-header h2 { color: var(--cyan); font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
    .exam-progress-bar { width: 100%; max-width: 400px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 0 auto 10px; overflow: hidden; }
    .exam-progress-fill { height: 100%; background: var(--gold); width: 0%; transition: 0.3s; }
    .exam-progress-text { color: var(--text-muted); font-size: 0.85rem; font-weight: 700; }

    .exam-question-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }
    .exam-q-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; color: #fff; line-height: 1.6; }
    .exam-options { display: flex; flex-direction: column; gap: 10px; }
    
    .exam-opt-btn { 
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); 
      padding: 16px 20px; border-radius: 12px; font-size: 1rem; font-weight: 600; 
      text-align: right; transition: 0.2s; 
    }
    .exam-opt-btn:hover { background: rgba(255,255,255,0.08); }
    .exam-opt-btn.correct { background: rgba(16, 185, 129, 0.1); border-color: var(--green); color: var(--green); }
    .exam-opt-btn.wrong { background: rgba(244, 63, 94, 0.1); border-color: var(--red); color: var(--red); }

    .exam-result { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
    .exam-result.show { display: flex; animation: zoomIn 0.5s ease; }
    
    .score-ring { width: 160px; height: 160px; border-radius: 50%; background: conic-gradient(var(--green) 0%, rgba(255,255,255,0.05) 0%); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; }
    .score-ring::before { content: ''; position: absolute; inset: 8px; background: var(--bg); border-radius: 50%; }
    .score-ring span { position: relative; z-index: 1; font-size: 2.5rem; font-weight: 900; color: var(--gold); }
    .exam-result h2 { font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
    .exam-result p { color: var(--text-muted); font-size: 1rem; margin-bottom: 20px; }

    /* ============ أزرار التحكم السفلية ============ */
    .bottom-action { 
      position: fixed; bottom: calc(var(--safe) + 15px); left: 50%; transform: translateX(-50%); 
      display: none; justify-content: center; z-index: 900; width: 90%; max-width: 400px; 
    }
    .bottom-action.show { display: flex; animation: slideUp 0.4s ease; }
    .btn-next { 
      background: linear-gradient(135deg, var(--cyan), #3b82f6); color: #fff; 
      padding: 14px; width: 100%; border-radius: 14px; font-weight: 900; font-size: 1.1rem; 
      display: flex; justify-content: center; align-items: center; gap: 8px; 
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4); 
    }
    .btn-next:hover { transform: translateY(-2px); }

    /* ============ Animations ============ */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* ============ Responsive - الموبايل ============ */
    @media (max-width: 900px) {
      .sidebar { position: fixed; top: 0; right: -100%; height: 100dvh; width: 100%; border-left: none; }
      .sidebar.open { right: 0; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
      .close-btn { display: block; }
      
      /* تظبيط الشريط العلوي */
      .top-bar { padding: 10px 12px; display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px; }
      .menu-btn { display: flex; grid-column: 1; width: 36px; height: 36px; }
      .back-btn { grid-column: 2; padding: 8px; justify-content: center; border-radius: 50%; width: 36px; height: 36px; }
      .back-btn span { display: none; } /* إخفاء كلمة الخريطة */
      .stats-badge { grid-column: 4; justify-self: end; padding: 4px 10px; font-size: 0.8rem; }
      .progress-container { grid-column: 1 / -1; width: 100%; margin-top: 5px; }
      .progress-text { font-size: 0.7rem; }
      
      .chat-container { padding: 15px 12px; padding-bottom: 120px; }
      .bubble { max-width: 95%; font-size: 0.95rem; padding: 12px 16px; border-radius: 18px; }
      .message-row.cody .bubble { border-radius: 18px 18px 4px 18px; }
      .message-row.student .bubble { border-radius: 18px 18px 18px 4px; }
      
      .choices-container { margin-right: 0; width: 100%; max-width: 100%; }
      .choice-btn { padding: 12px 16px; font-size: 0.9rem; }
      
      /* المحرر في الموبايل */
      .editor-wrapper { width: 100%; margin: 10px 0; border-radius: 12px; }
      .CodeMirror { height: 220px !important; font-size: 0.95rem; }
      .output-area { height: 100px; font-size: 0.85rem; }
      
      .exam-view { padding: 15px 12px; }
      .exam-header h2 { font-size: 1.4rem; }
      .exam-question-box { padding: 15px; }
      .exam-q-text { font-size: 1.05rem; }
      .exam-opt-btn { padding: 14px 16px; font-size: 0.95rem; }
      
      .bottom-action { width: calc(100% - 24px); bottom: calc(var(--safe) + 10px); }
      .btn-next { padding: 14px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  
  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg">
        <h2>رحلة بايثون</h2>
      </div>
      <button class="close-btn" onclick="toggleSidebar()"><i class="ri-close-line"></i></button>
    </div>
    <div class="chapters-list" id="chaptersList"></div>
  </div>
  
  <!-- المنطقة الرئيسية -->
  <div class="main-area">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="ri-menu-line"></i></button>
      <a href="python-chapters.html" class="back-btn" title="العودة للخريطة"><i class="ri-map-2-line"></i> <span>الخريطة</span></a>
      
      <div class="progress-container">
        <div class="progress-text"><span>تقدمك</span><span id="progressPercent">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      
      <div class="stats-badge"><i class="ri-star-fill"></i> <span id="xpDisplay">0</span></div>
    </div>
    
    <!-- الشات -->
    <div class="chat-container" id="chatContainer"></div>
    
    <!-- واجهة الامتحان -->
    <div class="exam-view" id="examView">
      <div class="exam-header">
        <h2 id="examTitle">امتحان الفصل</h2>
        <div class="exam-progress-bar"><div class="exam-progress-fill" id="examProgFill"></div></div>
        <p class="exam-progress-text" id="examProgress">سؤال 1 من 5</p>
      </div>
      
      <div class="exam-question-box" id="examQuestionBox">
        <div class="exam-q-text" id="examQuestionText">جاري التحميل...</div>
        <div class="exam-options" id="examOptionsContainer"></div>
      </div>
      
      <div class="exam-result" id="examResultBox">
        <div class="score-ring" id="scoreRing">
          <span id="finalScore">0/5</span>
        </div>
        <h2 id="resultTitle">نتيجتك النهائية</h2>
        <p id="resultMsg">لقد أتممت الامتحان!</p>
      </div>
    </div>

    <div class="bottom-action" id="bottomAction">
      <button class="btn-next" id="nextBtn" onclick="advanceChat()">متابعة <i class="ri-arrow-left-line"></i></button>
    </div>
  </div>
  
  <script src="js/chapters/ch1.js"></script>
  <script src="js/chapters/ch2.js"></script>
  <script src="js/chapters/ch3.js"></script>
  <script src="js/chapters/ch4.js"></script>
  <script src="js/chapters/ch5.js"></script>
  <script src="js/chapters/ch6.js"></script>
  <script src="js/chapters/ch7.js"></script>
  <script src="js/chapters/ch8.js"></script>
  <script src="js/chapters/ch9.js"></script>
  <script src="js/chapters/ch10.js"></script>
  <script src="js/chapters/ch11.js"></script>
  <script src="js/chapters/ch12.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script>
    "use strict";
    
    const chapterList = [
      { id: 1, title: "الطباعة" }, { id: 2, title: "المتغيرات" }, { id: 3, title: "العمليات الحسابية" },
      { id: 4, title: "الشروط" }, { id: 5, title: "التكرار" }, { id: 6, title: "القوائم" },
      { id: 7, title: "الدوال" }, { id: 8, title: "النصوص" }, { id: 9, title: "الأخطاء" },
      { id: 10, title: "القواميس" }, { id: 11, title: "المكتبات" }, { id: 12, title: "المشروع النهائي" }
    ];
    
    const PROGRESS_KEY = "cody_python_progress", XP_KEY = "cody_xp";
    const urlParams = new URLSearchParams(window.location.search);
    let chapterId = parseInt(urlParams.get("ch"));
    let lessonId = parseInt(urlParams.get("lesson"));

    if (isNaN(chapterId) || isNaN(lessonId)) {
        const lastLesson = JSON.parse(localStorage.getItem("cody_last_lesson") || "null");
        if (lastLesson) {
            chapterId = lastLesson.ch;
            lessonId = lastLesson.lesson;
            window.history.replaceState(null, '', `?ch=${chapterId}&lesson=${lessonId}`);
        } else {
            chapterId = 1; lessonId = 1;
        }
    }

    let currentLesson = null, currentStepIndex = 0, challengeSolved = false, editorInstance = null;
    let isExamMode = false, examQuestions = [], currentExamIndex = 0, examScore = 0;

    function toggleSidebar() { 
      document.getElementById('sidebar').classList.toggle('open'); 
      document.getElementById('overlay').classList.toggle('open'); 
    }
    
    function showTypingIndicator() {
        const row = document.createElement("div");
        row.className = "message-row cody";
        row.id = "typingIndicator";
        row.innerHTML = `<div class="avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
        document.getElementById("chatContainer").appendChild(row);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const el = document.getElementById("typingIndicator");
        if (el) el.remove();
    }

    function renderSidebar() {
      const list = document.getElementById("chaptersList"); 
      list.innerHTML = "";
      const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
      
      chapterList.forEach((chap, index) => {
        const chapData = window.CHAPTERS && window.CHAPTERS[chap.id];
        const isCompleted = progress.completed.includes(chap.id);
        const isUnlocked = index === 0 || progress.completed.includes(chapterList[index - 1].id);
        
        let totalLessons = chapData && chapData.lessons ? chapData.lessons.length : 0;
        let chapProgressPercent = isCompleted ? 100 : 0;
        if (String(chapterId) === String(chap.id) && lessonId > 1) {
            chapProgressPercent = Math.round(((lessonId - 1) / totalLessons) * 100);
        }

        const chapEl = document.createElement("div"); 
        chapEl.className = `chapter-item ${isUnlocked ? "" : "locked"}`;
        const titleEl = document.createElement("div"); 
        titleEl.className = "chapter-title";
        
        let lockIcon = !isUnlocked ? '<i class="ri-lock-fill"></i>' : (isCompleted ? '<i class="ri-checkbox-circle-fill" style="color:var(--green);"></i>' : '');
        
        titleEl.innerHTML = `
          <div class="chap-info">
            <span>${chap.id}. ${chap.title}</span>
            <div class="chap-mini-prog"><div class="chap-mini-fill" style="width: ${chapProgressPercent}%"></div></div>
          </div>
          ${lockIcon}
        `;
        
        const lessonsEl = document.createElement("div"); 
        lessonsEl.className = "lessons-list";
        if (String(chapterId) === String(chap.id)) lessonsEl.classList.add("open");
        
        if (chapData && chapData.lessons) {
          chapData.lessons.forEach((lesson, lIndex) => {
            const lessonEl = document.createElement("a");
            const isLessonUnlocked = isUnlocked; 
            
            lessonEl.className = `lesson-link ${!isLessonUnlocked ? "locked-lesson" : ""} ${String(chapterId) === String(chap.id) && (lIndex + 1) === lessonId ? "active" : ""}`;
            
            if (isLessonUnlocked) {
                let icon = lesson.title.includes('امتحان') ? '<i class="ri-file-list-3-line"></i>' : '<i class="ri-play-circle-line"></i>';
                lessonEl.innerHTML = `${icon} ${lesson.title}`;
                lessonEl.href = `python-lesson.html?ch=${chap.id}&lesson=${lIndex + 1}`;
                lessonEl.onclick = () => { if(window.innerWidth <= 900) toggleSidebar(); };
            } else {
                lessonEl.innerHTML = `<i class="ri-lock-line"></i> ${lesson.title}`;
                lessonEl.href = "javascript:void(0)";
            }
            lessonsEl.appendChild(lessonEl);
          });
          
          titleEl.onclick = () => { if(isUnlocked) lessonsEl.classList.toggle("open"); };
        }
        chapEl.appendChild(titleEl); 
        chapEl.appendChild(lessonsEl); 
        list.appendChild(chapEl);
      });
    }

    function updateProgressBar() {
      const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
      const percent = Math.round((progress.completed.length / 12) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressPercent").textContent = percent + "%";
      document.getElementById("xpDisplay").textContent = localStorage.getItem(XP_KEY) || 0;
    }

    function loadLesson() {
      localStorage.setItem("cody_last_lesson", JSON.stringify({ch: chapterId, lesson: lessonId}));
      
      const chapter = window.CHAPTERS && window.CHAPTERS[chapterId];
      if (!chapter || !chapter.lessons[lessonId - 1]) {
        document.getElementById("chatContainer").innerHTML = `<div style="text-align:center; padding: 50px;"><h2>هذا الدرس قيد التطوير 🚧</h2></div>`;
        renderSidebar(); updateProgressBar(); return;
      }
      currentLesson = chapter.lessons[lessonId - 1]; 
      isExamMode = currentLesson.title.includes('امتحان') || currentLesson.title.includes('الامتحان');
      
      if (isExamMode) {
          startExam();
      } else {
          document.getElementById("examView").classList.remove("show");
          document.getElementById("chatContainer").style.display = "flex";
          document.getElementById("chatContainer").innerHTML = "";
          currentStepIndex = 0; challengeSolved = false;
          processStep(); 
      }
      renderSidebar(); updateProgressBar();
    }

    function processStep() {
      if (currentStepIndex >= currentLesson.steps.length) { endLesson(); return; }
      const step = currentLesson.steps[currentStepIndex];
      document.getElementById("bottomAction").classList.remove("show");
      const oldEditor = document.querySelector(".editor-wrapper"); 
      if (oldEditor) oldEditor.remove();
      
      if (step.type === "cody") { 
        showTypingIndicator();
        setTimeout(() => {
            removeTypingIndicator();
            addBubble("cody", step.text); 
            showNextButton(); 
            currentStepIndex++;
        }, 600);
      } else if (step.type === "choice") { 
        addBubble("cody", step.question); 
        renderChoices(step.options, step.replies); 
        currentStepIndex++; 
      } else if (step.type === "challenge") { 
        addBubble("cody", "تحدي برمجي! اكتب الكود في المحرر 👇"); 
        showEditor(step); 
      } else if (step.type === "quiz") { 
        addBubble("cody", step.question); 
        renderQuiz(step.options, step.correct, step.explanation); 
        currentStepIndex++; 
      }
    }

    function startExam() {
        document.getElementById("chatContainer").style.display = "none";
        document.getElementById("bottomAction").classList.remove("show");
        document.getElementById("examView").classList.add("show");
        document.getElementById("examResultBox").classList.remove("show");
        document.getElementById("examQuestionBox").style.display = "block";
        document.getElementById("examTitle").textContent = currentLesson.title;
        
        examQuestions = currentLesson.steps.filter(s => s.type === 'quiz');
        currentExamIndex = 0;
        examScore = 0;
        
        if (examQuestions.length === 0) {
            document.getElementById("examQuestionText").textContent = "لا توجد أسئلة في هذا الامتحان.";
            document.getElementById("examProgFill").style.width = "100%";
            return;
        }
        showExamQuestion();
    }

    function showExamQuestion() {
        if (currentExamIndex >= examQuestions.length) {
            endExam();
            return;
        }
        
        const q = examQuestions[currentExamIndex];
        document.getElementById("examProgress").textContent = `سؤال ${currentExamIndex + 1} من ${examQuestions.length}`;
        document.getElementById("examProgFill").style.width = `${(currentExamIndex / examQuestions.length) * 100}%`;
        document.getElementById("examQuestionText").textContent = q.question;
        
        const optsContainer = document.getElementById("examOptionsContainer");
        optsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "exam-opt-btn";
            btn.textContent = opt;
            btn.onclick = () => {
                Array.from(optsContainer.children).forEach(b => b.style.pointerEvents = 'none');
                
                if (index === q.correct) {
                    btn.classList.add("correct");
                    examScore++;
                } else {
                    btn.classList.add("wrong");
                    optsContainer.children[q.correct].classList.add("correct");
                }
                
                setTimeout(() => {
                    currentExamIndex++;
                    showExamQuestion();
                }, 1200);
            };
            optsContainer.appendChild(btn);
        });
    }

    function endExam() {
        document.getElementById("examProgFill").style.width = "100%";
        document.getElementById("examQuestionBox").style.display = "none";
        document.getElementById("examResultBox").classList.add("show");
        
        const scorePercent = Math.round((examScore / examQuestions.length) * 100);
        document.getElementById("finalScore").textContent = `${examScore}/${examQuestions.length}`;
        
        const scoreRing = document.getElementById("scoreRing");
        scoreRing.style.background = `conic-gradient(var(--green) ${scorePercent}%, rgba(255,255,255,0.05) ${scorePercent}%)`;
        
        if (scorePercent >= 50) {
            if (typeof window.confetti === "function") window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
            document.getElementById("resultTitle").textContent = "عمل رائع! 🎉";
            document.getElementById("resultMsg").textContent = "لقد اجتزت الامتحان بنجاح وتم فتح الفصل التالي.";
            
            let progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
            if (!progress.completed.includes(chapterId)) {
              progress.completed.push(chapterId);
              localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
            }
        } else {
            document.getElementById("resultTitle").textContent = "تحتاج للمزيد من التدريب 😅";
            document.getElementById("resultMsg").textContent = "لم تجتز الامتحان هذه المرة، يمكنك المحاولة مرة أخرى.";
        }
        
        const btn = document.getElementById("nextBtn");
        if (scorePercent >= 50) {
            btn.innerHTML = 'الفصل التالي <i class="ri-arrow-left-line"></i>';
            btn.onclick = () => { window.location.href = chapterId < 12 ? `python-lesson.html?ch=${chapterId + 1}&lesson=1` : "python-chapters.html"; };
        } else {
            btn.innerHTML = 'إعادة المحاولة <i class="ri-refresh-line"></i>';
            btn.onclick = () => { window.location.reload(); };
        }
        
        document.getElementById("bottomAction").classList.add("show");
        renderSidebar();
        updateProgressBar();
    }

    function addBubble(type, text) {
      const row = document.createElement("div"); 
      row.className = `message-row ${type}`;
      row.innerHTML = `<div class="avatar">${type === "cody" ? "🤖" : "👦"}</div><div class="bubble">${text}</div>`;
      document.getElementById("chatContainer").appendChild(row); 
      scrollToBottom();
    }

    function renderChoices(options, replies) {
      const container = document.createElement("div"); 
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button"); 
        btn.className = "choice-btn"; 
        btn.innerHTML = `<span>${opt}</span>`;
        btn.onclick = () => { 
          container.remove(); 
          addBubble("student", opt); 
          if (replies && replies[index]) {
              showTypingIndicator();
              setTimeout(() => {
                  removeTypingIndicator();
                  addBubble("cody", replies[index]); 
                  document.getElementById("bottomAction").classList.add("show"); 
              }, 600);
          } else {
              document.getElementById("bottomAction").classList.add("show"); 
          }
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); 
      scrollToBottom();
    }

    function renderQuiz(options, correctIndex, explanation) {
      const container = document.createElement("div"); 
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button"); 
        btn.className = "choice-btn"; 
        btn.innerHTML = `<span>${opt}</span>`;
        btn.onclick = () => {
          container.remove(); 
          addBubble("student", opt);
          
          showTypingIndicator();
          setTimeout(() => {
              removeTypingIndicator();
              if (index === correctIndex) { 
                addBubble("cody", "✅ إجابة صحيحة! " + (explanation || "")); 
                addXp(5); 
              } else { 
                addBubble("cody", `❌ ليست صحيحة. الإجابة الصح: <code>${options[correctIndex]}</code>.`); 
              }
              document.getElementById("bottomAction").classList.add("show");
          }, 600);
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); 
      scrollToBottom();
    }

    function showNextButton() { document.getElementById("bottomAction").classList.add("show"); }
    function advanceChat() { document.getElementById("bottomAction").classList.remove("show"); processStep(); }

    function showEditor(step) {
      const wrapper = document.createElement("div"); 
      wrapper.className = "editor-wrapper show";
      wrapper.innerHTML = `
        <div class="editor-header">
          <div class="editor-dots"><div class="editor-dot r"></div><div class="editor-dot y"></div><div class="editor-dot g"></div></div>
          <span class="editor-title">main.py</span>
          <button class="btn-run" onclick="runCode()"><i class="ri-play-circle-fill"></i> تشغيل</button>
        </div>
        <div class="code-area">
          <textarea id="dynamicCodeEditor"></textarea>
          <div class="output-area" id="outputArea">&gt; Output...</div>
        </div>`;
      document.getElementById("chatContainer").appendChild(wrapper);
      
      setTimeout(() => {
        if (editorInstance) editorInstance.toTextArea();
        editorInstance = CodeMirror.fromTextArea(document.getElementById("dynamicCodeEditor"), { 
            lineNumbers: true, mode: "python", theme: "dracula", indentUnit: 4, lineWrapping: true 
        });
        editorInstance.setValue(step.defaultCode);
        
        setTimeout(() => {
            editorInstance.refresh();
        }, 100);
      }, 50);
      
      window.currentChallenge = step; challengeSolved = false; scrollToBottom();
    }

    function builtinRead(x) { 
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'"; 
      return Sk.builtinFiles["files"][x]; 
    }

    async function runCode() {
      const outputArea = document.getElementById("outputArea");
      const code = editorInstance ? editorInstance.getValue() : document.getElementById("dynamicCodeEditor").value;
      const challenge = window.currentChallenge;
      
      if (!code.trim()) { outputArea.textContent = "⚠️ اكتب الكود أولاً."; return; }
      outputArea.textContent = "> Running..."; 
      let outputText = "";
      
      Sk.configure({ output: (t) => { outputText += t; }, read: builtinRead, __future__: Sk.python3 });
      
      try {
        await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
        const actual = outputText.trim();
        const passed = challenge.check(code) && (challenge.expected === "" || actual === challenge.expected.trim());
        
        if (passed) {
          outputArea.textContent = actual + "\n\n✅ إجابة صحيحة!"; 
          outputArea.style.color = "var(--green)";
          if (!challengeSolved) {
            challengeSolved = true; 
            showTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                addBubble("cody", challenge.successMsg); 
                addXp(10);
                if (typeof window.confetti === "function") window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                currentStepIndex++; 
                showNextButton();
            }, 600);
          }
        } else {
          outputArea.textContent = actual + `\n\n⚠️ الناتج غير مطابق.\n💡 تلميح: ${challenge.hint}`; 
          outputArea.style.color = "var(--gold)";
        }
      } catch (err) { 
        outputArea.textContent = "❌ خطأ:\n" + err.toString(); 
        outputArea.style.color = "var(--red)"; 
      }
      scrollToBottom();
    }

    function addXp(amount) { 
      let xp = parseInt(localStorage.getItem(XP_KEY)) || 0; 
      localStorage.setItem(XP_KEY, xp + amount); 
      updateProgressBar(); 
    }

    function endLesson() {
      showTypingIndicator();
      setTimeout(() => {
          removeTypingIndicator();
          addBubble("cody", "🎉 مبروك! أتممت هذا الدرس بنجاح.");
          addBubble("cody", "📝 <b>مراجعة سريعة:</b> تأكد دائماً من قراءة الكود جيداً قبل تشغيله!");
          
          const btn = document.getElementById("nextBtn");
          
          if (lessonId < window.CHAPTERS[chapterId].lessons.length) {
            btn.innerHTML = 'الدرس التالي <i class="ri-arrow-left-line"></i>';
            btn.onclick = () => { window.location.href = `python-lesson.html?ch=${chapterId}&lesson=${lessonId + 1}`; };
          } else {
            btn.innerHTML = 'العودة للخريطة <i class="ri-map-pin-line"></i>';
            btn.onclick = () => { window.location.href = "python-chapters.html"; };
          }
          showNextButton(); 
          scrollToBottom();
          renderSidebar(); 
      }, 800);
    }

    function scrollToBottom() {
      const chat = document.getElementById("chatContainer");
      setTimeout(() => chat.scrollTop = chat.scrollHeight, 100);
    }

    loadLesson();
  </script>
</body>
</html>
