<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة بايثون التفاعلية | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    :root { 
      --bg: #090d16; 
      --sidebar-bg: #0f172a;
      --chat-bg: #1e293b;
      --cody-bubble: #334155;
      --student-bubble: #4f46e5;
      --border: #334155;
      --text: #f8fafc; 
      --muted: #94a3b8; 
      --cyan: #06b6d4; 
      --green: #10b981; 
      --red: #f43f5e; 
      --gold: #fbbf24; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* الستارة (تظهر في الموبايل فقط) */
    .overlay { 
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
      backdrop-filter: blur(3px); z-index: 999; transition: 0.3s; 
    }
    .overlay.open { display: block; }

    /* القائمة الجانبية */
    .sidebar { 
      width: 320px; background: var(--sidebar-bg); border-left: 1px solid var(--border); 
      display: flex; flex-direction: column; height: 100vh; z-index: 1000; transition: 0.3s ease;
    }
    
    .sidebar-header { 
      padding: 20px; border-bottom: 1px solid var(--border); 
      display: flex; align-items: center; justify-content: space-between; 
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; }
    .sidebar-brand img { width: 30px; height: 30px; }
    .sidebar-brand h2 { color: var(--cyan); font-size: 1.2rem; font-weight: 900; }
    
    /* زر إغلاق القائمة (للموبايل) */
    .close-btn { display: none; background: none; border: none; color: var(--muted); font-size: 1.8rem; cursor: pointer; }
    .close-btn:hover { color: var(--red); }
    
    .chapters-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .chapter-item { background: #1e293b; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .chapter-title { padding: 15px; font-weight: 800; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .chapter-title:hover { background: #334155; }
    .lessons-list { display: none; flex-direction: column; background: #0f172a; }
    .lessons-list.open { display: flex; }
    .lesson-link { padding: 12px 20px; color: var(--muted); text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .lesson-link:hover, .lesson-link.active { color: var(--cyan); background: #1e293b; }
    
    /* المنطقة الرئيسية */
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; width: 100%; background: var(--bg); }
    
    /* الشريط العلوي */
    .top-bar { padding: 12px 20px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; z-index: 10; }
    .menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    
    /* زر الخريطة الاحترافي */
    .back-btn { 
      color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.9rem; 
      display: flex; align-items: center; gap: 6px; background: #334155; 
      padding: 8px 16px; border-radius: 10px; transition: 0.2s; 
    }
    .back-btn:hover { background: var(--cyan); color: #000; }
    
    .progress-container { flex: 1; min-width: 100px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--gold); }
    .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); width: 0%; transition: 0.5s; }
    
    /* النقاط والنجوم */
    .stats-badge { 
      background: rgba(251, 191, 36, 0.1); color: var(--gold); 
      padding: 6px 14px; border-radius: 20px; font-weight: 900; font-size: 0.9rem; 
      border: 1px solid rgba(251, 191, 36, 0.3); display: flex; align-items: center; gap: 5px; 
    }
    
    /* الشات */
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; background: var(--bg); }
    .message-row { display: flex; gap: 12px; align-items: flex-end; }
    
    .message-row.cody { flex-direction: row; }
    .message-row.cody .avatar { background: #0ea5e9; }
    .message-row.cody .bubble { background: var(--cody-bubble); border: 1px solid var(--border); border-radius: 18px 18px 0 18px; }
    
    .message-row.student { flex-direction: row-reverse; }
    .message-row.student .avatar { background: var(--student-bubble); }
    .message-row.student .bubble { background: var(--student-bubble); border: 1px solid var(--student-bubble); border-radius: 18px 18px 18px 0; }
    
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; flex-shrink: 0; }
    .bubble { padding: 14px 18px; font-size: 1rem; line-height: 1.7; max-width: 85%; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .bubble code { background: #0f172a; color: var(--cyan); padding: 3px 8px; border-radius: 6px; font-family: 'Fira Code', monospace; direction: ltr; display: inline-block; margin-top: 5px; }
    
    /* الخيارات */
    .choices-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; margin-right: 52px; }
    .choice-btn { background: #334155; border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; font-family: 'Cairo'; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: right; }
    .choice-btn:hover { background: #475569; border-color: var(--cyan); }
    
    /* محرر الأكواد */
    .editor-wrapper { display: none; width: calc(100% - 52px); margin-right: 52px; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-top: 10px; }
    .editor-wrapper.show { display: block; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-run { background: var(--green); color: #000; border: none; padding: 8px 20px; border-radius: 10px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; transition: 0.2s; }
    .btn-run:hover { transform: scale(1.05); }
    .code-area { display: flex; flex-direction: column; gap: 10px; height: 380px; }
    .CodeMirror { flex: 1; height: 250px !important; border-radius: 10px; font-family: 'Fira Code', monospace; font-size: 0.95rem; direction: ltr; text-align: left; }
    .output-area { height: 120px; background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: 'Fira Code', monospace; color: #ccc; direction: ltr; text-align: left; overflow-y: auto; font-size: 0.9rem; white-space: pre-wrap; }
    
    /* زر المتابعة */
    .bottom-action { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--bg) 80%, transparent); padding: 20px; display: none; justify-content: center; }
    .bottom-action.show { display: flex; }
    .btn-next { background: var(--cyan); color: #000; border: none; padding: 14px 40px; border-radius: 30px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); }
    
    /* التصميم للموبايل */
    @media (max-width: 900px) {
      .sidebar { position: fixed; top: 0; right: -100%; height: 100vh; width: 280px; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
      .sidebar.open { right: 0; }
      .close-btn { display: block; }
      .menu-btn { display: block; }
      .top-bar { flex-wrap: wrap; justify-content: space-between; padding: 10px; }
      .back-btn { order: 1; padding: 6px 10px; font-size: 0.8rem; }
      .stats-badge { order: 2; padding: 4px 10px; font-size: 0.8rem; }
      .progress-container { order: 3; width: 100%; margin-top: 5px; }
      .chat-container { padding: 15px; }
      .bubble { max-width: 90%; font-size: 0.95rem; }
      .choices-container, .editor-wrapper { margin-right: 0; width: 100%; }
      .code-area { height: 350px; }
    }
  </style>
</head>
<body>

  <!-- الستارة السوداء للموبايل -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
        <h2>رحلة بايثون</h2>
      </div>
      <!-- زر الإغلاق (للموبايل) -->
      <button class="close-btn" onclick="toggleSidebar()"><i class="ri-close-line"></i></button>
    </div>
    <div class="chapters-list" id="chaptersList"></div>
  </div>

  <!-- المنطقة الرئيسية -->
  <div class="main-area">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="ri-menu-line"></i></button>
      
      <!-- زر العودة للخريطة -->
      <a href="python-chapters.html" class="back-btn">
        <i class="ri-map-2-line"></i> الخريطة
      </a>
      
      <div class="progress-container">
        <div class="progress-text"><span>تقدمك</span><span id="progressPercent">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      
      <!-- النقاط والنجوم -->
      <div class="stats-badge">
        <i class="ri-star-fill" style="color: #fbbf24;"></i> 
        <span id="xpDisplay">0</span> XP
      </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="bottom-action" id="bottomAction">
      <button class="btn-next" id="nextBtn" onclick="advanceChat()">متابعة <i class="ri-arrow-left-line"></i></button>
    </div>
  </div>

  <!-- استدعاء ملفات الفصول الخارجية -->
  <script src="js/chapters/ch1.js"></script>
  <script src="js/chapters/ch2.js"></script>
  <script src="js/chapters/ch3.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script>
    "use strict";
    
    const chapterList = [
      { id: 1, title: "الطباعة" }, { id: 2, title: "المتغيرات" }, { id: 3, title: "العمليات الحسابية" },
      { id: 4, title: "الشروط" }, { id: 5, title: "التكرار" }, { id: 6, title: "القوائم" },
      { id: 7, title: "الدوال" }, { id: 8, title: "النصوص" }, { id: 9, title: "الأخطاء" },
      { id: 10, title: "القواميس" }, { id: 11, title: "المكتبات" }, { id: 12, title: "المشروع النهائي" }
    ];

    // محتوى احتياطي
    window.CHAPTERS = window.CHAPTERS || {};
    if (!window.CHAPTERS[1]) {
        window.CHAPTERS[1] = { title: "الطباعة", lessons: [
            { title: "الدرس 1", steps: [{ type: "cody", text: "أهلاً بك يا بطل! 🤖 أنا كودي، سنتعلم اليوم أول أمر: <code>print()</code>." }, { type: "challenge", expected: "Hello", defaultCode: 'print("Hello")', hint: 'print("Hello")', check: (code) => code.includes("Hello"), successMsg: "عظيم!" }] },
            { title: "الدرس 2", steps: [{ type: "cody", text: "مرحباً مجدداً!" }] }, { title: "الدرس 3", steps: [{ type: "cody", text: "مرحباً!" }] },
            { title: "الدرس 4", steps: [{ type: "cody", text: "مرحباً!" }] }, { title: "امتحان الفصل", steps: [{ type: "cody", text: "امتحان!" }] }
        ]};
    }
    for(let i=2; i<=12; i++) {
        if(!window.CHAPTERS[i]) {
            window.CHAPTERS[i] = { title: chapterList[i-1].title, lessons: [
                { title: "الدرس 1", steps: [{ type: "cody", text: "هذا الفصل قيد التطوير حالياً! ✨" }] },
                { title: "الدرس 2", steps: [] }, { title: "الدرس 3", steps: [] }, { title: "الدرس 4", steps: [] }, { title: "امتحان الفصل", steps: [] }
            ]};
        }
    }

    const PROGRESS_KEY = "cody_python_progress";
    const XP_KEY = "cody_xp";
    const urlParams = new URLSearchParams(window.location.search);
    let chapterId = parseInt(urlParams.get("ch")) || 1;
    let lessonId = parseInt(urlParams.get("lesson")) || 1;
    let currentLesson = null, currentStepIndex = 0, challengeSolved = false, editorInstance = null;

    // فتح وإغلاق القائمة الجانبية (مع الستارة)
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function renderSidebar() {
      const list = document.getElementById("chaptersList");
      list.innerHTML = "";
      chapterList.forEach((chap) => {
        const chapData = window.CHAPTERS[chap.id];
        const chapEl = document.createElement("div");
        chapEl.className = "chapter-item";
        
        const titleEl = document.createElement("div");
        titleEl.className = "chapter-title";
        titleEl.innerHTML = `<span>${chap.id}. ${chap.title}</span> <i class="ri-arrow-down-s-line"></i>`;
        
        const lessonsEl = document.createElement("div");
        lessonsEl.className = "lessons-list";
        if (String(chapterId) === String(chap.id)) lessonsEl.classList.add("open");
        
        if (chapData) {
          chapData.lessons.forEach((lesson, lIndex) => {
            const lessonEl = document.createElement("a");
            lessonEl.className = `lesson-link ${String(chapterId) === String(chap.id) && (lIndex + 1) === lessonId ? "active" : ""}`;
            lessonEl.innerHTML = `<i class="ri-play-circle-line"></i> ${lesson.title}`;
            lessonEl.href = `python-lesson.html?ch=${chap.id}&lesson=${lIndex + 1}`;
            // إغلاق القائمة تلقائياً عند اختيار درس في الموبايل
            lessonEl.onclick = () => {
                if(window.innerWidth <= 900) toggleSidebar(); 
            };
            lessonsEl.appendChild(lessonEl);
          });
          titleEl.onclick = () => lessonsEl.classList.toggle("open");
        }
        
        chapEl.appendChild(titleEl);
        chapEl.appendChild(lessonsEl);
        list.appendChild(chapEl);
      });
    }

    function updateProgressBar() {
      const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
      const percent = Math.round((progress.completed.length / 12) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressPercent").textContent = percent + "%";
      document.getElementById("xpDisplay").textContent = localStorage.getItem(XP_KEY) || 0;
    }

    function loadLesson() {
      const chapter = window.CHAPTERS[chapterId];
      if (!chapter || !chapter.lessons[lessonId - 1]) {
        document.getElementById("chatContainer").innerHTML = `<div style="text-align:center; padding: 50px;"><h2>هذا الدرس قيد التطوير 🚧</h2></div>`;
        renderSidebar(); updateProgressBar(); return;
      }
      currentLesson = chapter.lessons[lessonId - 1];
      document.getElementById("chatContainer").innerHTML = "";
      currentStepIndex = 0; challengeSolved = false;
      processStep(); renderSidebar(); updateProgressBar();
    }

    function processStep() {
      if (currentStepIndex >= currentLesson.steps.length) { endLesson(); return; }
      const step = currentLesson.steps[currentStepIndex];
      document.getElementById("bottomAction").classList.remove("show");
      const oldEditor = document.querySelector(".editor-wrapper");
      if (oldEditor) oldEditor.remove();

      if (step.type === "cody") {
        addBubble("cody", step.text); showNextButton(); currentStepIndex++;
      } else if (step.type === "choice") {
        addBubble("cody", step.question); renderChoices(step.options, step.replies); currentStepIndex++;
      } else if (step.type === "challenge") {
        addBubble("cody", "تحدي برمجي! اكتب الكود في المحرر 👇"); showEditor(step);
      } else if (step.type === "quiz") {
        addBubble("cody", step.question); renderQuiz(step.options, step.correct, step.explanation); currentStepIndex++;
      }
    }

    function addBubble(type, text) {
      const row = document.createElement("div");
      row.className = `message-row ${type}`;
      row.innerHTML = `<div class="avatar">${type === "cody" ? "🤖" : "👦"}</div><div class="bubble">${text}</div>`;
      document.getElementById("chatContainer").appendChild(row);
      scrollToBottom();
    }

    function renderChoices(options, replies) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn"; btn.textContent = opt;
        btn.onclick = () => {
          container.remove(); addBubble("student", opt);
          if (replies && replies[index]) addBubble("cody", replies[index]);
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); scrollToBottom();
    }

    function renderQuiz(options, correctIndex, explanation) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn"; btn.textContent = opt;
        btn.onclick = () => {
          container.remove(); addBubble("student", opt);
          if (index === correctIndex) { addBubble("cody", "✅ إجابة صحيحة! " + (explanation || "")); addXp(5); }
          else { addBubble("cody", `❌ ليست صحيحة. الإجابة الصح: <code>${options[correctIndex]}</code>.`); }
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); scrollToBottom();
    }

    function showNextButton() { document.getElementById("bottomAction").classList.add("show"); }
    function advanceChat() { document.getElementById("bottomAction").classList.remove("show"); processStep(); }

    function showEditor(step) {
      const wrapper = document.createElement("div");
      wrapper.className = "editor-wrapper show";
      wrapper.innerHTML = `
        <div class="editor-header">
          <span style="font-family: 'Fira Code', monospace; color: var(--muted); font-size:0.85rem;">main.py</span>
          <button class="btn-run" onclick="runCode()"><i class="ri-play-circle-fill"></i> تشغيل</button>
        </div>
        <div class="code-area">
          <textarea id="dynamicCodeEditor"></textarea>
          <div class="output-area" id="outputArea">&gt; Output...</div>
        </div>
      `;
      document.getElementById("chatContainer").appendChild(wrapper);
      setTimeout(() => {
        if (editorInstance) 
        if (editorInstance) editorInstance.toTextArea();
        editorInstance = CodeMirror.fromTextArea(document.getElementById("dynamicCodeEditor"), { lineNumbers: true, mode: "python", theme: "dracula", indentUnit: 4, lineWrapping: true });
        editorInstance.setValue(step.defaultCode);
      }, 50);
      window.currentChallenge = step; challengeSolved = false; scrollToBottom();
    }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    }

    async function runCode() {
      const outputArea = document.getElementById("outputArea");
      const code = editorInstance ? editorInstance.getValue() : document.getElementById("dynamicCodeEditor").value;
      const challenge = window.currentChallenge;
      if (!code.trim()) { outputArea.textContent = "⚠️ اكتب الكود أولاً."; return; }
      outputArea.textContent = "> Running...";
      let outputText = "";
      Sk.configure({ output: (t) => { outputText += t; }, read: builtinRead, __future__: Sk.python3 });
      try {
        await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
        const actual = outputText.trim();
        const passed = challenge.check(code) && actual === challenge.expected.trim();
        if (passed) {
          outputArea.textContent = actual + "\n\n✅ إجابة صحيحة!"; outputArea.style.color = "var(--green)";
          if (!challengeSolved) {
            challengeSolved = true; addBubble("cody", challenge.successMsg); addXp(10);
            if (typeof window.confetti === "function") window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            currentStepIndex++; showNextButton();
          }
        } else {
          outputArea.textContent = actual + `\n\n⚠️ الناتج غير مطابق.\n💡 تلميح: ${challenge.hint}`; outputArea.style.color = "var(--gold)";
        }
      } catch (err) {
        outputArea.textContent = "❌ خطأ:\n" + err.toString(); outputArea.style.color = "var(--red)";
      }
      scrollToBottom();
    }

    function addXp(amount) {
      let xp = parseInt(localStorage.getItem(XP_KEY)) || 0;
      localStorage.setItem(XP_KEY, xp + amount); 
      updateProgressBar();
    }

    function endLesson() {
      addBubble("cody", "🎉 مبروك! أتممت الدرس.");
      addBubble("cody", "📝 <b>مراجعة سريعة:</b> تأكد دائماً من قراءة الكود جيداً قبل تشغيله!");
      
      const btn = document.getElementById("nextBtn");
      
      if (lessonId < window.CHAPTERS[chapterId].lessons.length) {
        btn.innerHTML = 'الدرس التالي <i class="ri-arrow-left-line"></i>';
        btn.onclick = () => { window.location.href = `python-lesson.html?ch=${chapterId}&lesson=${lessonId + 1}`; };
      } else {
        let progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
        if (!progress.completed.includes(chapterId)) {
          progress.completed.push(chapterId);
          localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
        }
        btn.innerHTML = 'الفصل التالي <i class="ri-arrow-left-line"></i>';
        btn.onclick = () => { window.location.href = chapterId < 12 ? `python-lesson.html?ch=${chapterId + 1}&lesson=1` : "python-chapters.html"; };
      }
      showNextButton(); scrollToBottom();
    }

    function scrollToBottom() {
      const chat = document.getElementById("chatContainer");
      setTimeout(() => chat.scrollTop = chat.scrollHeight, 100);
    }

    loadLesson();
  </script>
</body>
</html>
