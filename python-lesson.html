<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>رحلة بايثون التفاعلية | Cody Academy</title>

  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="تعلم البرمجة بلغة بايثون مع كودي بطريقة تفاعلية وممتعة.">

  <!-- الخطوط والأيقونات -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <!-- محرر الأكواد -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

  <style>
    :root {
      --bg: #080d19;
      --surface: #111a2b;
      --surface-2: #17243a;
      --border: #293750;
      --text: #f1f5f9;
      --muted: #9aaac2;
      --purple: #7955e8;
      --cyan: #36bfe5;
      --gold: #ffd66b;
      --green: #43c99a;
      --red: #ff6b7a;
      --pink: #ff8fb8;
      --safe: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(121,85,232,.12), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(54,191,229,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .app-shell {
      display: flex;
      width: 100%;
      min-height: 100dvh;
    }

    /* القائمة الجانبية */

    .sidebar {
      width: 290px;
      min-width: 290px;
      min-height: 100dvh;
      padding: 20px 15px;
      background: rgba(13, 21, 37, .97);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      z-index: 3000;
      transition: right .25s ease;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .sidebar-brand h2 {
      margin: 0;
      color: var(--cyan);
      font-size: 1.15rem;
      font-weight: 900;
    }

    .close-btn,
    .menu-btn {
      display: none;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 1.35rem;
    }

    .chapters-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chapter-item {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
    }

    .chapter-title {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 13px;
      cursor: pointer;
    }

    .chap-name {
      flex: 1;
      font-size: .92rem;
      font-weight: 800;
    }

    .chap-icon {
      color: var(--cyan);
      font-size: 1.2rem;
    }

    .chapter-item.locked .chap-icon {
      color: var(--muted);
    }

    .chap-mini-prog {
      width: 100%;
      height: 5px;
      overflow: hidden;
      border-radius: 10px;
      background: var(--border);
    }

    .chap-mini-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width .3s;
    }

    .lessons-list {
      display: none;
      padding: 5px 10px 12px;
      border-top: 1px solid var(--border);
    }

    .lessons-list.open {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lesson-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 9px;
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      transition: .2s;
    }

    .lesson-link:hover,
    .lesson-link.active {
      background: rgba(54,191,229,.12);
      color: var(--cyan);
    }

    .lesson-link.completed {
      color: var(--green);
    }

    .lesson-link.locked-lesson {
      opacity: .45;
      cursor: not-allowed;
    }

    /* المنطقة الرئيسية */

    .main-area {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 100dvh;
      flex-direction: column;
    }

    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 17px 22px;
      background: rgba(13, 21, 37, .92);
      border-bottom: 1px solid var(--border);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .stats-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid rgba(255,214,107,.25);
      border-radius: 10px;
      background: rgba(255,214,107,.08);
      color: var(--gold);
      font-weight: 900;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .85rem;
    }

    .progress-text span:last-child {
      color: var(--cyan);
      font-weight: 800;
    }

    .progress-bar,
    .exam-progress-bar {
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--border);
    }

    .progress-fill,
    .exam-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      transition: width .3s;
    }

    /* المحادثة */

    .content-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .chat-container {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 18px;
      padding: 22px 20px 125px;
      overflow-y: auto;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 11px;
    }

    .message-row.student {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: var(--purple);
    }

    .message-row.cody .avatar {
      background: var(--cyan);
    }

    .avatar svg,
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble {
      max-width: 85%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 18px 18px 0 18px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .message-row.student .bubble {
      border: 0;
      border-radius: 18px 18px 18px 0;
      background: #4f46a5;
    }

    .bubble code {
      display: inline-block;
      direction: ltr;
      padding: 3px 7px;
      border-radius: 6px;
      background: #05080f;
      color: var(--cyan);
      font-family: "Fira Code", monospace;
    }

    .choices-container {
      display: flex;
      width: min(100%, 520px);
      flex-direction: column;
      gap: 10px;
      margin: 0 55px 5px 0;
    }

    .choice-btn {
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      text-align: right;
      cursor: pointer;
      transition: .2s;
    }

    .choice-btn:hover {
      border-color: var(--cyan);
      background: var(--surface-2);
    }

    .choice-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* محرر بايثون */

    .editor-wrapper {
      display: none;
      width: 100%;
      min-height: 420px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #0d1117;
    }

    .editor-wrapper.show {
      display: flex;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      background: #161b22;
    }

    .editor-title {
      color: var(--muted);
      font-family: "Fira Code", monospace;
      font-size: .9rem;
    }

    .editor-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-run,
    .editor-close-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 13px;
      border: 0;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-run {
      background: var(--green);
      color: #06140f;
    }

    .btn-run:disabled {
      opacity: .6;
      cursor: wait;
    }

    .editor-close-btn {
      background: var(--surface-2);
      color: var(--text);
    }

    .code-area {
      display: flex;
      min-height: 210px;
      flex: 1;
      overflow: hidden;
    }

    .CodeMirror {
      width: 100%;
      min-height: 210px;
      height: auto;
      direction: ltr;
      text-align: left;
      font-family: "Fira Code", monospace;
      font-size: .95rem;
    }

    .code-fallback {
      width: 100%;
      min-height: 210px;
      resize: vertical;
      padding: 15px;
      border: 0;
      outline: 0;
      background: #0d1117;
      color: #e6edf3;
      direction: ltr;
      text-align: left;
      font-family: "Fira Code", monospace;
      font-size: .95rem;
      line-height: 1.7;
    }

    .lesson-help-panel {
      padding: 12px 15px;
      border-top: 1px solid var(--border);
      background: #111b2b;
      color: #dbeafe;
      line-height: 1.8;
    }

    .lesson-help-panel strong {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
    }

    .help-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .help-actions button {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }

    #lessonSolutionText {
      margin-top: 10px;
      padding: 10px;
      border-right: 3px solid var(--green);
      border-radius: 8px;
      background: rgba(67,201,154,.09);
    }

    #lessonSolutionText pre {
      direction: ltr;
      overflow-x: auto;
      padding: 10px;
      border-radius: 8px;
      background: #05080f;
      font-family: "Fira Code", monospace;
      white-space: pre-wrap;
    }

    .output-area {
      min-height: 100px;
      max-height: 180px;
      padding: 13px;
      overflow: auto;
      border-top: 1px solid var(--border);
      background: #03060b;
      color: #d1d5db;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      font-family: "Fira Code", monospace;
      font-size: .88rem;
    }

    /* الامتحان */

    .exam-view {
      display: none;
      width: 100%;
      max-width: 850px;
      flex: 1;
      flex-direction: column;
      gap: 20px;
      margin: 0 auto;
      padding: 25px;
      overflow-y: auto;
    }

    .exam-view.show {
      display: flex;
    }

    .exam-header {
      text-align: center;
    }

    .exam-header h2 {
      margin: 0 0 15px;
      color: var(--cyan);
      font-size: 1.6rem;
    }

    .exam-progress-bar {
      margin-bottom: 8px;
    }

    .exam-progress-fill {
      background: linear-gradient(90deg, var(--gold), var(--green));
    }

    .exam-progress-label {
      color: var(--muted);
      font-size: .85rem;
    }

    .exam-question-box {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }

    .exam-q-text {
      margin-bottom: 18px;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.8;
    }

    .exam-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .exam-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1120;
      color: var(--text);
      text-align: right;
      cursor: pointer;
    }

    .exam-option:disabled {
      cursor: default;
    }

    .exam-option.correct {
      border-color: var(--green);
      color: var(--green);
    }

    .exam-option.incorrect {
      border-color: var(--red);
      color: var(--red);
    }

    .option-letter {
      display: grid;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-2);
      font-weight: 900;
    }

    .exam-feedback {
      min-height: 25px;
      margin-top: 13px;
      line-height: 1.7;
    }

    .exam-feedback.correct {
      color: var(--green);
    }

    .exam-feedback.incorrect {
      color: var(--gold);
    }

    .exam-next-btn,
    .btn-next,
    .open-editor-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--cyan);
      color: #06121a;
      font-weight: 900;
      cursor: pointer;
    }

    .exam-next-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .exam-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 25px 10px;
      text-align: center;
    }

    .exam-result.show {
      display: flex;
    }

    .exam-result-icon {
      color: var(--gold);
      font-size: 3.5rem;
    }

    .exam-result h2 {
      margin: 0;
    }

    .exam-score {
      color: var(--cyan);
      font-size: 2.7rem;
      font-weight: 900;
    }

    .exam-result p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .exam-result-actions {
      display: flex;
      width: 100%;
      max-width: 400px;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    /* زر المتابعة والتنبيهات */

    .bottom-action {
      position: fixed;
      right: 50%;
      bottom: calc(var(--safe) + 15px);
      z-index: 1000;
      display: none;
      width: min(90%, 420px);
      transform: translateX(50%);
    }

    .bottom-action.show {
      display: block;
    }

    .overlay,
    .editor-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2500;
      background: rgba(0,0,0,.65);
    }

    .overlay.show,
    .editor-backdrop.show {
      display: block;
    }

    #pythonToast {
      position: fixed;
      right: 50%;
      bottom: calc(var(--safe) + 25px);
      z-index: 6000;
      display: none;
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      transform: translateX(50%);
      border: 1px solid var(--cyan);
      border-radius: 12px;
      background: #17243b;
      color: white;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.35);
    }

    /* الشاشات الصغيرة */

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        top: 0;
        right: -310px;
        width: 290px;
        height: 100dvh;
        min-height: 100dvh;
      }

      .sidebar.open {
        right: 0;
      }

      .close-btn,
      .menu-btn {
        display: inline-flex;
      }

      .top-bar {
        padding: 12px;
      }

      .top-row {
        gap: 8px;
      }

      .back-btn {
        padding: 8px;
      }

      .back-btn span {
        display: none;
      }

      .stats-badge {
        padding: 8px 10px;
      }

      .chat-container {
        padding: 15px 12px 130px;
      }

      .bubble {
        max-width: 90%;
        padding: 12px 14px;
        font-size: .95rem;
      }

      .choices-container {
        margin-right: 0;
      }

      .editor-wrapper.show {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: 2600;
        width: 100%;
        height: 82dvh;
        min-height: 0;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 30px rgba(0,0,0,.6);
      }

      .exam-view {
        padding: 18px 12px;
      }
    }

    @media (min-width: 901px) {
      .content-wrapper {
        flex-direction: row;
      }

      .chat-container {
        max-width: 55%;
      }

      .editor-wrapper {
        flex: 1;
        align-self: stretch;
        min-width: 0;
        margin: 18px;
      }

      .bottom-action {
        position: relative;
        right: auto;
        bottom: auto;
        width: 100%;
        padding: 15px 20px;
        transform: none;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .btn-next {
        max-width: 420px;
        margin: auto;
      }
    }

    /* Premium learning experience */
    :root { --bg:#070b16; --surface:#101a2c; --surface-2:#17253d; --border:rgba(148,163,184,.19); --text:#f5f7ff; --muted:#a8b5cc; --purple:#8b6cff; --cyan:#4bd5f2; }
    body { background:radial-gradient(ellipse at 8% 0%,rgba(139,108,255,.17),transparent 34%),radial-gradient(ellipse at 92% 22%,rgba(75,213,242,.10),transparent 30%),#070b16; letter-spacing:.05px; }
    .sidebar { background:linear-gradient(180deg,rgba(16,26,44,.99),rgba(9,15,28,.99)); border-left-color:rgba(139,108,255,.22); box-shadow:-16px 0 48px rgba(0,0,0,.16); }
    .chapter-item { border-radius:16px; background:rgba(17,28,47,.88); transition:border-color .2s,transform .2s,background .2s; }
    .chapter-item:hover { border-color:rgba(75,213,242,.45); transform:translateY(-1px); }
    .chapter-title { padding:15px; }
    .chat-container { gap:22px; padding:clamp(18px,3vw,34px); scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:rgba(139,108,255,.55) transparent; }
    .message-row { gap:12px; align-items:flex-end; }
    .avatar { width:46px; height:46px; border:2px solid rgba(255,255,255,.14); box-shadow:0 5px 18px rgba(0,0,0,.22); background:linear-gradient(145deg,#8b6cff,#4bd5f2); }
    .message-row.cody .avatar { background:linear-gradient(145deg,#233e60,#12617a); border-color:rgba(75,213,242,.45); }
    .avatar img,.avatar svg { display:block; width:100%; height:100%; object-fit:contain; }
    .avatar-fallback { display:grid; width:100%; height:100%; place-items:center; color:white; font-size:1.2rem; }
    .bubble { max-width:min(820px,88%); padding:17px 20px; border:1px solid rgba(148,163,184,.17); border-radius:20px 20px 5px 20px; background:linear-gradient(145deg,rgba(19,31,52,.98),rgba(14,23,40,.98)); box-shadow:0 10px 28px rgba(0,0,0,.12); font-size:1rem; line-height:2; }
    .message-row.student .bubble { border:1px solid rgba(139,108,255,.3); border-radius:20px 20px 20px 5px; background:linear-gradient(135deg,#5140a0,#3b347a); }
    .bubble code { margin:2px 3px; padding:4px 9px; border:1px solid rgba(75,213,242,.16); border-radius:8px; background:#080e1b; color:#72e1f6; direction:ltr; unicode-bidi:isolate; }
    .bubble pre { max-width:100%; margin:14px 0; padding:15px; overflow-x:auto; border:1px solid rgba(75,213,242,.22); border-radius:13px; background:#070d18; color:#d7f5ff; direction:ltr; text-align:left; font:500 .9rem/1.75 "Fira Code",monospace; white-space:pre; }
    .bubble ul,.bubble ol { padding-inline-start:1.5rem; margin:10px 0; }
    .bubble li { margin:5px 0; }
    .choices-container { width:min(100% - 58px,620px); gap:11px; }

    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }

  <script>
  "use strict";

  // ==========================================
  // 1) المتغيرات الأساسية
  // ==========================================

  const chapterList = window.CHAPTERS || {};

  let currentChapterId = 1;
  let currentLessonIndex = 0;
  let currentLesson = null;
  let currentStepIndex = 0;
  let currentStep = null;

  let stepCompleted = false;
  let currentChallenge = null;
  let currentHintIndex = 0;
  let challengeSolved = false;

  let editor = null;

  let profileAvatarHTML = "";

  let currentExamQuestions = [];
  let currentExamIndex = 0;
  let examScore = 0;
  let examAnswered = false;

  const PASS_PERCENTAGE = 80;

  const chatContainer =
    document.getElementById("chatContainer");

  const chaptersListElement =
    document.getElementById("chaptersList");

  const bottomAction =
    document.getElementById("bottomAction");

  const nextBtn =
    document.getElementById("nextBtn");

  const $ = (id) => document.getElementById(id);


  // ==========================================
  // 2) التخزين المحلي
  // ==========================================

  function readStorage(key, fallback) {
    try {
      const value = localStorage.getItem(key);

      return value === null
        ? fallback
        : JSON.parse(value);

    } catch (error) {
      console.warn("تعذر قراءة البيانات:", key, error);
      return fallback;
    }
  }

  function writeStorage(key, value) {
    try {
      localStorage.setItem(
        key,
        JSON.stringify(value)
      );

      return true;

    } catch (error) {
      console.warn("تعذر حفظ البيانات:", key, error);
      return false;
    }
  }

  const storedCompletedLessons = readStorage(
    "cody_python_completed_lessons",
    []
  );

  const storedCompletedChapters = readStorage(
    "cody_python_progress",
    []
  );

  const completedLessonKeys = new Set(
    (Array.isArray(storedCompletedLessons) ? storedCompletedLessons : [])
      .map(String)
  );

  // يدعم التنسيق القديم (مصفوفة) والجديد (كائن) دون فقدان تقدم المستخدم.
  const normalizedCompletedChapters = Array.isArray(storedCompletedChapters)
    ? storedCompletedChapters
    : Array.isArray(storedCompletedChapters?.completed)
      ? storedCompletedChapters.completed
      : [];

  const completedChapters = new Set(
    normalizedCompletedChapters
      .map(Number)
      .filter(Number.isInteger)
  );

  function getLessonKey(chapterId, lessonIndex) {
    return `${Number(chapterId)}_${Number(lessonIndex)}`;
  }

  function isLessonCompleted(chapterId, lessonIndex) {
    return completedLessonKeys.has(
      getLessonKey(chapterId, lessonIndex)
    );
  }

  function saveLocalProgress() {
    const existingProgress = readStorage(
      "cody_python_progress",
      {}
    );

    writeStorage(
      "cody_python_progress",
      {
        completed: [...completedChapters],
        stars: (
          existingProgress &&
          !Array.isArray(existingProgress) &&
          typeof existingProgress.stars === "object"
        )
          ? existingProgress.stars
          : {}
      }
    );

    writeStorage(
      "cody_python_completed_lessons",
      [...completedLessonKeys]
    );
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(
      /[&<>"']/g,
      (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]
    );
  }

  function renderLessonMarkup(value) {
    const safe = escapeHTML(value);

    return safe.replace(
      /&lt;(\/?)(code|b|strong|br|em|i|ul|ol|li)(\s*\/?)&gt;/gi,
      (match, closing, tag, selfClosing) => {
        const name = tag.toLowerCase();
        if (name === "br") return "<br>";
        return closing
          ? "</" + name + ">"
          : "<" + name + (selfClosing ? " /" : "") + ">";
      }
    );
  }

  function showToast(message) {
    let toast = $("pythonToast");

    if (!toast) {
      toast = document.createElement("div");
      toast.id = "pythonToast";
      document.body.appendChild(toast);
    }

    toast.textContent = String(message);
    toast.style.display = "block";

    clearTimeout(toast.hideTimer);

    toast.hideTimer = setTimeout(() => {
      toast.style.display = "none";
    }, 2800);
  }

  function getChapter(chapterId) {
    return chapterList[Number(chapterId)] || null;
  }

  function getChapterLessons(chapterId) {
    const chapter = getChapter(chapterId);

    return Array.isArray(chapter?.lessons)
      ? chapter.lessons
      : [];
  }

  function getLessonTitle(lesson) {
    return lesson?.title || "درس جديد";
  }

  function isExamLesson(lesson) {
    return /امتحان|اختبار/i.test(
      String(lesson?.title || "")
    );
  }

  function getChapterIds() {
    return Object.keys(chapterList)
      .map(Number)
      .filter((id) => Number.isInteger(id) && id > 0)
      .sort((a, b) => a - b);
  }

  function getStudentAvatarHTML() {
    return profileAvatarHTML ||
      '<span aria-label="صورة الطالب">👦</span>';
  }

  function getCodyAvatarHTML() {
    return '<span aria-label="Cody">🤖</span>';
  }

  function scrollChatToBottom() {
    if (!chatContainer) return;

    requestAnimationFrame(() => {
      chatContainer.scrollTop =
        chatContainer.scrollHeight;
    });
  }

  function addBubble(type, message) {
    if (!chatContainer) return null;

    const row = document.createElement("div");
    row.className = `message-row ${type}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    avatar.innerHTML = type === "cody"
      ? getCodyAvatarHTML()
      : getStudentAvatarHTML();

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = String(message ?? "");

    row.appendChild(avatar);
    row.appendChild(bubble);

    chatContainer.appendChild(row);

    scrollChatToBottom();

    return row;
  }

  function clearChat() {
    if (chatContainer) {
      chatContainer.innerHTML = "";
    }

  }

  function showBottomAction(show, label = "متابعة") {
    if (!bottomAction || !nextBtn) return;

    bottomAction.classList.toggle(
      "show",
      Boolean(show)
    );

    nextBtn.innerHTML = `
      ${escapeHTML(label)}
      <i class="ri-arrow-left-line"></i>
    `;
  }
    // ==========================================
  // 4) القائمة الجانبية
  // ==========================================

  function openSidebar() {
    $("sidebar")?.classList.add("open");
    $("overlay")?.classList.add("show");
  }

  function closeSidebar() {
    $("sidebar")?.classList.remove("open");
    $("overlay")?.classList.remove("show");
  }


  // ==========================================
  // 5) عرض الفصول والدروس
  // ==========================================

  function getChapterProgress(chapterId) {
    const lessons = getChapterLessons(chapterId);

    if (!lessons.length) return 0;

    const completed = lessons.filter((lesson, index) =>
      !isExamLesson(lesson) &&
      isLessonCompleted(chapterId, index)
    ).length;

    const normalLessons = lessons.filter(
      (lesson) => !isExamLesson(lesson)
    ).length;

    if (!normalLessons) return 0;

    return Math.round(
      (completed / normalLessons) * 100
    );
  }

  function renderChapters() {
    if (!chaptersListElement) return;

    chaptersListElement.innerHTML = "";

    const chapterIds = getChapterIds();

    if (!chapterIds.length) {
      chaptersListElement.innerHTML = `
        <p style="color:var(--muted);text-align:center">
          لم يتم تحميل الفصول بعد.
        </p>
      `;
      return;
    }

    chapterIds.forEach((chapterId, index) => {
      const chapter = getChapter(chapterId);

      if (!chapter) return;

      const lessons = getChapterLessons(chapterId);
      const progress = getChapterProgress(chapterId);

      const item = document.createElement("div");

      item.className = "chapter-item";

      const title = escapeHTML(
        chapter.title || `الفصل ${chapterId}`
      );

      const icon = escapeHTML(
        chapter.icon || "ri-book-open-line"
      );

      item.innerHTML = `
        <div class="chapter-title">
          <i class="${icon} chap-icon"></i>

          <span class="chap-name">${title}</span>

          <i class="ri-arrow-down-s-line"></i>

          <div class="chap-mini-prog">
            <div
              class="chap-mini-fill"
              style="width:${progress}%"
            ></div>
          </div>
        </div>

        <div class="lessons-list"></div>
      `;

      const chapterTitle =
        item.querySelector(".chapter-title");

      const lessonsList =
        item.querySelector(".lessons-list");

      lessons.forEach((lesson, lessonIndex) => {
        const completed = isLessonCompleted(
          chapterId,
          lessonIndex
        );

        const link = document.createElement("button");

        link.type = "button";
        link.className = "lesson-link";

        if (completed) {
          link.classList.add("completed");
        }

        if (
          chapterId === currentChapterId &&
          lessonIndex === currentLessonIndex
        ) {
          link.classList.add("active");
        }

        const lessonIcon = completed
          ? "ri-checkbox-circle-fill"
          : "ri-play-circle-line";

        link.innerHTML = `
          <i class="${lessonIcon}"></i>
          <span>${escapeHTML(getLessonTitle(lesson))}</span>
        `;

        link.addEventListener("click", () => {
          currentChapterId = chapterId;
          currentLessonIndex = lessonIndex;

          closeSidebar();
          loadCurrentLesson();
          renderChapters();
        });

        lessonsList.appendChild(link);
      });

      chapterTitle.addEventListener("click", () => {
        lessonsList.classList.toggle("open");
      });

      chaptersListElement.appendChild(item);

      if (chapterId === currentChapterId) {
        lessonsList.classList.add("open");
      }
    });
  }


  // ==========================================
  // 6) تحديث شريط التقدم
  // ==========================================

  function updateProgressDisplay() {
    const allLessons = [];

    getChapterIds().forEach((chapterId) => {
      getChapterLessons(chapterId).forEach(
        (lesson, index) => {
          if (!isExamLesson(lesson)) {
            allLessons.push({
              chapterId,
              index
            });
          }
        }
      );
    });

    const completedCount = allLessons.filter(
      (lesson) =>
        isLessonCompleted(
          lesson.chapterId,
          lesson.index
        )
    ).length;

    const percentage = allLessons.length
      ? Math.round(
          (completedCount / allLessons.length) * 100
        )
      : 0;

    const progressPercent = $("progressPercent");
    const progressFill = $("progressFill");

    if (progressPercent) {
      progressPercent.textContent = `${percentage}%`;
    }

    if (progressFill) {
      progressFill.style.width = `${percentage}%`;
    }

    const xpDisplay = $("xpDisplay");

    if (xpDisplay) {
      xpDisplay.textContent = String(
        readStorage("cody_xp", 0)
      );
    }
  }


  // ==========================================
  // 7) مكافآت إكمال الدرس
  // ==========================================

  function awardLessonReward(chapterId, lessonIndex) {
    const key = getLessonKey(chapterId, lessonIndex);

    if (completedLessonKeys.has(key)) {
      return false;
    }

    completedLessonKeys.add(key);

    const legacyXP = Number(
      readStorage("cody_python_xp", 0)
    ) || 0;

    const sharedXP = Number(
      readStorage("cody_xp", 0)
    ) || 0;

    const oldXP = Math.max(legacyXP, sharedXP);
    const newXP = oldXP + 10;

    // مفتاح موحد مع صفحة خريطة الفصول، مع ترحيل المفتاح القديم.
    writeStorage("cody_xp", newXP);
    writeStorage("cody_python_xp", newXP);

    saveLocalProgress();

    const lessons = getChapterLessons(chapterId);

    const normalLessons = lessons
      .map((lesson, index) => ({
        lesson,
        index
      }))
      .filter(({ lesson }) => !isExamLesson(lesson));

    const chapterCompleted = normalLessons.every(
      ({ index }) =>
        isLessonCompleted(chapterId, index)
    );

    if (chapterCompleted) {
      completedChapters.add(Number(chapterId));
      saveLocalProgress();
    }

    updateProgressDisplay();
    renderChapters();

    showToast("أحسنت! حصلت على 10 نقاط خبرة ⭐");

    return true;
  }


  // ==========================================
  // 8) التعامل مع محتوى الدروس
  // ==========================================

  function getLessonSteps(lesson) {
    if (!lesson) return [];

    if (Array.isArray(lesson.steps)) {
      return lesson.steps;
    }

    if (Array.isArray(lesson.content)) {
      return lesson.content;
    }

    if (Array.isArray(lesson.activities)) {
      return lesson.activities;
    }

    if (Array.isArray(lesson.questions)) {
      return lesson.questions;
    }

    return [];
  }

  function getStepText(step) {
    if (typeof step === "string") {
      return step;
    }

    if (!step || typeof step !== "object") {
      return "";
    }

    return (
      step.text ||
      step.content ||
      step.description ||
      step.message ||
      step.question ||
      ""
    );
  }

  function renderStep(step) {
    if (step === null || step === undefined) {
      return;
    }

    currentStep = step;
    stepCompleted = false;

    if (typeof step === "string") {
      addBubble(
        "cody",
        renderLessonMarkup(step)
      );

      showBottomAction(true);
      return;
    }

    const type = String(
      step.type || step.kind || "text"
    ).toLowerCase();

    const text = getStepText(step);

    if (
      type === "challenge" ||
      type === "code" ||
      type === "coding"
    ) {
      addBubble(
        "cody",
        renderLessonMarkup(text || "حان وقت التطبيق العملي!")
      );

      showEditor(step);
      return;
    }

    if (
      type === "choice" ||
      type === "quiz" ||
      type === "question"
    ) {
      renderLessonChoices(step);
      return;
    }

    addBubble(
      "cody",
      renderLessonMarkup(text)
    );

    showBottomAction(true);
  }


  // ==========================================
  // 9) الاختيارات داخل الدرس
  // ==========================================

  function renderLessonChoices(step) {
    const question = getStepText(step);

    addBubble(
      "cody",
      renderLessonMarkup(question || "اختار الإجابة الصحيحة:")
    );

    const choices = Array.isArray(step.options)
      ? step.options
      : Array.isArray(step.choices)
        ? step.choices
        : [];

    if (!choices.length) {
      showBottomAction(true);
      return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "choices-container";

    choices.forEach((choice, index) => {
      const choiceText =
        typeof choice === "string"
          ? choice
          : choice.text || choice.label || "";

      const button = document.createElement("button");

      button.type = "button";
      button.className = "choice-btn";
      button.textContent = choiceText;

      button.addEventListener("click", () => {
        if (stepCompleted) return;

        const correctAnswer =
          step.answer ??
          step.correctAnswer ??
          step.correct;

        const hasCorrectAnswer =
          correctAnswer !== undefined &&
          correctAnswer !== null &&
          correctAnswer !== "";

        const selectedValue =
          typeof choice === "object"
            ? (
                choice.value ??
                choice.id ??
                choice.text ??
                choice.label
              )
            : choice;

        const numericAnswer =
          typeof correctAnswer === "number" ||
          (typeof correctAnswer === "string" && correctAnswer.trim() !== "");

        const correct = hasCorrectAnswer && (
          String(selectedValue) === String(correctAnswer) ||
          (
            numericAnswer &&
            Number.isInteger(Number(correctAnswer)) &&
            Number(correctAnswer) === index
          )
        );

        stepCompleted = true;

        wrapper.querySelectorAll("button").forEach(
          (option) => {
            option.disabled = true;
          }
        );

        addBubble(
          "student",
          escapeHTML(choiceText)
        );

        const reply = Array.isArray(step.replies)
          ? step.replies[index]
          : "";

        if (!hasCorrectAnswer) {
          addBubble(
            "cody",
            renderLessonMarkup(
              reply || "تمام! نكمل مع بعض الخطوة التالية."
            )
          );
        } else if (correct) {
          addBubble(
            "cody",
            renderLessonMarkup(
              reply || "ممتاز! إجابتك صحيحة 👏"
            )
          );
        } else {
          addBubble(
            "cody",
            renderLessonMarkup(
              reply ||
              step.explanation ||
              "مش مشكلة، راجع الشرح وحاول تفهم الفكرة."
            )
          );
        }

        showBottomAction(true);
      });

      wrapper.appendChild(button);
    });

    chatContainer.appendChild(wrapper);
    scrollChatToBottom();
  }
  // ==========================================
  // 10) إنشاء محرر بايثون
  // ==========================================

  // ==========================================
  // 11) تهيئة محرر الأكواد
  // ==========================================

  function initializePythonEditor() {
    const textarea = $("pythonCodeInput");

    if (!textarea) return;

    if (
      typeof CodeMirror === "undefined"
    ) {
      editor = null;
      return;
    }

    try {
      editor = CodeMirror.fromTextArea(
        textarea,
        {
          mode: "python",
          theme: "material-darker",
          lineNumbers: true,
          indentUnit: 4,
          tabSize: 4,
          lineWrapping: true,
          direction: "ltr",
          viewportMargin: Infinity,
          extraKeys: {
            Tab: (cm) => cm.replaceSelection("    ")
          }
        }
      );

      editor.setSize("100%", "100%");

      setTimeout(() => {
        editor?.refresh();
      }, 100);

    } catch (error) {
      console.error(
        "تعذر تشغيل محرر الأكواد:",
        error
      );

      editor = null;
    }
  }


  // ==========================================
  // 12) الحصول على الكود المكتوب
  // ==========================================

  function getEditorCode() {
    if (editor) {
      return editor.getValue();
    }

    return $("pythonCodeInput")?.value || "";
  }


  // ==========================================
  // 13) إغلاق المحرر
  // ==========================================

  function closeEditor(options = {}) {
    const discardChallenge = options?.discardChallenge === true;
    const wrapper = $("pythonEditorWrapper");

    if (discardChallenge) {
      $("editorContainer")?.replaceChildren();
      editor = null;
      currentChallenge = null;
      currentHintIndex = 0;
      challengeSolved = false;
    } else if (wrapper) {
      wrapper.classList.remove("show");
      wrapper.style.display = "none";
    }

    $("editorBackdrop")?.classList.remove("show");
    showBottomAction(true);
  }

  function reopenCurrentChallenge() {
    const wrapper = $("pythonEditorWrapper");

    if (!wrapper || !currentChallenge || challengeSolved) return false;

    wrapper.style.display = "";
    wrapper.classList.add("show");
    $("editorBackdrop")?.classList.add("show");
    showBottomAction(false);
    return true;
  }


  // ==========================================
  // 14) التلميحات
  // ==========================================

  function showPythonHint() {
    if (!currentChallenge) return;

    const hints = Array.isArray(currentChallenge.hints)
      ? currentChallenge.hints
      : currentChallenge.hint
        ? [currentChallenge.hint]
        : [];

    if (!hints.length) {
      showToast("لا يوجد تلميح إضافي لهذا التحدي.");
      return;
    }

    const hintBox = $("lessonHintText");
    const hintCode = $("lessonHintCode");

    if (!hintBox || !hintCode) {
      showToast("مساحة التلميح غير متاحة حاليًا.");
      return;
    }

    const hint = hints[Math.min(currentHintIndex, hints.length - 1)];
    currentHintIndex++;

    hintCode.textContent = String(hint);
    hintBox.hidden = false;
    hintBox.classList.remove("hint-reveal");
    void hintBox.offsetWidth;
    hintBox.classList.add("hint-reveal");

    hintBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }


  // ==========================================
  // 15) عرض الحل النموذجي
  // ==========================================

  function showPythonSolution() {
    if (!currentChallenge) return;

    const solution =
      currentChallenge.solution ||
      currentChallenge.expectedCode ||
      currentChallenge.answerCode ||
      "";

    if (!solution) {
      showToast("الحل النموذجي غير متاح لهذا التحدي.");
      return;
    }

    const solutionBox = $("lessonSolutionText");

    if (!solutionBox) return;

    solutionBox.hidden = false;

    solutionBox.innerHTML = `
      <strong>الحل النموذجي:</strong>
      <pre>${escapeHTML(solution)}</pre>
    `;

    solutionBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }


  // ==========================================
  // 16) تشغيل كود بايثون
  // ==========================================

  async function runPythonChallenge() {
    if (!currentChallenge) return;

    const runButton = $("runPythonBtn");
    const output = $("pythonOutput");

    if (!output) return;

    const code = getEditorCode();

    if (!code.trim()) {
      output.textContent = "اكتب الكود أولًا.";
      return;
    }

    if (
      typeof Sk === "undefined" ||
      typeof Sk.configure !== "function"
    ) {
      output.textContent =
        "محرك تشغيل بايثون لم يتم تحميله. تأكد من اتصال الإنترنت.";
      return;
    }

    if (runButton) {
      runButton.disabled = true;
      runButton.innerHTML =
        '<i class="ri-loader-4-line"></i> جاري التشغيل...';
    }

    output.textContent = "جاري تشغيل الكود...";

    let programOutput = "";

    try {
      Sk.configure({
        output: (text) => {
          programOutput += text;
        },

        read: (file) => {
          if (
            Sk.builtinFiles &&
            Sk.builtinFiles.files &&
            Sk.builtinFiles.files[file] !== undefined
          ) {
            return Sk.builtinFiles.files[file];
          }

          throw new Error(
            "الملف المطلوب غير موجود: " + file
          );
        },

        inputfun: () => {
          return Promise.resolve("");
        },

        __future__: Sk.python3
      });

      await Sk.misceval.asyncToPromise(
        () => Sk.importMainWithBody(
          "<stdin>",
          false,
          code,
          true
        )
      );

      output.textContent =
        programOutput || "تم تشغيل الكود بدون أخطاء.";

      checkChallengeResult(programOutput, code);

    } catch (error) {
      output.textContent =
        "حدث خطأ أثناء تشغيل الكود:\n" +
        String(error?.toString?.() || error);

    } finally {
      if (runButton) {
        runButton.disabled = false;
        runButton.innerHTML =
          '<i class="ri-play-fill"></i> تشغيل';
      }
    }
  }


  // ==========================================
  // 17) التحقق من نتيجة التحدي
  // ==========================================

  function checkChallengeResult(programOutput, sourceCode = "") {
    if (!currentChallenge || challengeSolved) {
      return;
    }

    const challenge = currentChallenge;

    const expectedOutput =
      challenge.expectedOutput ??
      challenge.expected_output ??
      challenge.expected;

    const customCheck =
      typeof challenge.check === "function"
        ? challenge.check
        : null;

    if (
      expectedOutput === undefined &&
      !customCheck
    ) {
      addBubble(
        "cody",
        "الكود اشتغل بنجاح! راجع الناتج وتأكد إنه بيحقق المطلوب. مش هاعتبر التحدي مكتمل تلقائيًا من غير اختبار محدد."
      );

      return;
    }

    let passed = false;

    if (customCheck) {
      try {
        passed = Boolean(
          customCheck(sourceCode, programOutput)
        );
      } catch (error) {
        console.warn(
          "تعذر تنفيذ اختبار التحدي:",
          error
        );
      }

    } else {
      const actual = String(programOutput)
        .replace(/\r\n/g, "\n")
        .trim();

      const expected = String(expectedOutput)
        .replace(/\r\n/g, "\n")
        .trim();

      passed = actual === expected;
    }

    if (passed) {
      challengeSolved = true;

      addBubble(
        "cody",
        "ممتاز! الناتج صحيح، وقد نجحت في التحدي! 🎉"
      );

      showBottomAction(true);

    } else {
      addBubble(
        "cody",
        "الكود اشتغل، لكن الناتج لسه مش مطابق للمطلوب. راجع التعليمات وجرب تاني."
      );
    }
  }


  // ==========================================
  // 18) الانتقال بين خطوات الدرس
  // ==========================================

  function advanceChat() {
    if (!currentLesson) return;

    const steps = getLessonSteps(currentLesson);

    if (currentStep && (
      currentStep.type === "challenge" ||
      currentStep.type === "code" ||
      currentStep.type === "coding"
    )) {
      if (!challengeSolved) {
        showToast("أكمل التحدي الأول.");
        return;
      }

      closeEditor({ discardChallenge: true });
    }

    currentStepIndex++;

    if (currentStepIndex < steps.length) {
      renderStep(steps[currentStepIndex]);
      return;
    }

    finishCurrentLesson();
  }


  // ==========================================
  // 19) إنهاء الدرس
  // ==========================================

  async function finishCurrentLesson() {
    if (!currentLesson) return;

    const wasCompleted = isLessonCompleted(
      currentChapterId,
      currentLessonIndex
    );

    if (!wasCompleted) {
      awardLessonReward(
        currentChapterId,
        currentLessonIndex
      );

      await saveProgressToFirebase();
    }

    clearChat();

    addBubble(
      "cody",
      wasCompleted
        ? "أهلًا بعودتك! الدرس ده مكتمل بالفعل. تقدر تراجع محتواه أو تنتقل للدرس التالي."
        : "رائع! أنهيت الدرس بنجاح وحصلت على 10 نقاط خبرة ⭐"
    );

    showBottomAction(
      true,
      "الدرس التالي"
    );

    updateProgressDisplay();
    renderChapters();
  }


  // ==========================================
  // 20) تحميل الدرس الحالي
  // ==========================================

  function loadCurrentLesson() {
    const lessons = getChapterLessons(
      currentChapterId
    );

    if (!lessons.length) {
      clearChat();

      addBubble(
        "cody",
        "لم يتم العثور على دروس في هذا الفصل. تأكد من تحميل ملف الفصل."
      );

      showBottomAction(false);
      return;
    }

    if (
      currentLessonIndex < 0 ||
      currentLessonIndex >= lessons.length
    ) {
      currentLessonIndex = 0;
    }

    currentLesson = lessons[currentLessonIndex];

    if (!currentLesson) return;

    currentStepIndex = 0;
    currentStep = null;
    stepCompleted = false;
    challengeSolved = false;

    closeEditor();
    clearChat();

    const chapter = getChapter(currentChapterId);

    addBubble(
      "cody",
      `
        <strong>${escapeHTML(
          chapter?.title || `الفصل ${currentChapterId}`
        )}</strong>
        <br>
        ${escapeHTML(getLessonTitle(currentLesson))}
      `
    );

    if (isExamLesson(currentLesson)) {
      startExam(currentLesson);
      return;
    }

    const steps = getLessonSteps(currentLesson);

    if (!steps.length) {
      const description =
        currentLesson.description ||
        currentLesson.content ||
        "ابدأ رحلتك التعليمية مع كودي!";

      addBubble(
        "cody",
        escapeHTML(description)
      );

      showBottomAction(true);
      return;
    }

    renderStep(steps[0]);

    updateProgressDisplay();
    renderChapters();
  }


  // ==========================================
  // 21) الدرس التالي
  // ==========================================

  function goToNextLesson() {
    const lessons = getChapterLessons(
      currentChapterId
    );

    if (
      currentLessonIndex + 1 < lessons.length
    ) {
      currentLessonIndex++;
      loadCurrentLesson();
      renderChapters();
      return;
    }

    const chapterIds = getChapterIds();

    const currentPosition =
      chapterIds.indexOf(currentChapterId);

    if (
      currentPosition >= 0 &&
      currentPosition + 1 < chapterIds.length
    ) {
      currentChapterId =
        chapterIds[currentPosition + 1];

      currentLessonIndex = 0;

      loadCurrentLesson();
      renderChapters();
      return;
    }

    clearChat();

    addBubble(
      "cody",
      "🎉 وصلت لنهاية الدروس المتاحة حاليًا! إنجاز رائع."
    );

    showBottomAction(false);
  }


  // ==========================================
  // 22) تجهيز أسئلة الامتحان
  // ==========================================

  function getExamQuestions(lesson) {
    const questions = Array.isArray(lesson?.questions)
      ? lesson.questions
      : Array.isArray(lesson?.exam)
        ? lesson.exam
        : Array.isArray(lesson?.steps)
          ? lesson.steps.filter((step) =>
              step &&
              (
                step.type === "question" ||
                step.type === "quiz" ||
                step.options ||
                step.choices
              )
            )
          : [];

    return questions.filter((question) =>
      question &&
      (
        Array.isArray(question.options) ||
        Array.isArray(question.choices)
      )
    );
  }


  // ==========================================
  // 23) بدء الامتحان
  // ==========================================

  function startExam(lesson) {
    currentExamQuestions = getExamQuestions(lesson)
      .slice()
      .sort(() => Math.random() - 0.5)
      .slice(0, 15);

    currentExamIndex = 0;
    examScore = 0;
    examAnswered = false;

    $("examView")?.classList.add("show");
    $("chatContainer")?.style.setProperty(
      "display",
      "none"
    );

    $("editorContainer")?.style.setProperty(
      "display",
      "none"
    );

    showBottomAction(false);

    const title = $("examTitle");

    if (title) {
      title.textContent =
        `امتحان ${getLessonTitle(lesson)}`;
    }

    $("examResultBox")?.classList.remove("show");

    const questionBox = $("examQuestionBox");

    if (questionBox) {
      questionBox.style.display = "block";
    }

    if (!currentExamQuestions.length) {
      const questionBox = $("examQuestionBox");
      const resultBox = $("examResultBox");

      if (questionBox) questionBox.style.display = "none";
      if (resultBox) resultBox.classList.add("show");

      $("resultTitle").textContent = "الامتحان غير متاح";
      $("resultMsg").textContent =
        "لا توجد أسئلة صالحة لهذا الامتحان حاليًا. يمكنك العودة إلى الدرس ومتابعة التعلم.";

      $("finalScore").textContent = "0/0";
      showToast("لا توجد أسئلة امتحان صالحة في بيانات هذا الدرس.");
      return;
    }

    renderExamQuestion();
  }


  // ==========================================
  // 24) عرض سؤال الامتحان
  // ==========================================

  function renderExamQuestion() {
    const question = currentExamQuestions[
      currentExamIndex
    ];

    if (!question) {
      finishExam();
      return;
    }

    examAnswered = false;

    const questionText = $("examQuestionText");
    const optionsContainer = $("examOptionsContainer");
    const feedback = $("examFeedback");
    const progress = $("examProgress");
    const progressFill = $("examProgFill");

    if (!questionText || !optionsContainer) return;

    questionText.textContent =
      question.question ||
      question.text ||
      question.title ||
      "اختر الإجابة الصحيحة:";

    optionsContainer.innerHTML = "";

    if (feedback) {
      feedback.textContent = "";
      feedback.className = "exam-feedback";
    }

    const options = question.options || question.choices;

    options.forEach((option, index) => {
      const value =
        typeof option === "object"
          ? (
              option.value ??
              option.text ??
              option.label ??
              ""
            )
          : option;

      const button = document.createElement("button");

      button.type = "button";
      button.className = "exam-option";

      button.innerHTML = `
        <span class="option-letter">
          ${String.fromCharCode(65 + index)}
        </span>
        <span>${escapeHTML(value)}</span>
      `;

      button.addEventListener("click", () => {
        answerExamQuestion(
          button,
          option,
          question,
          index
        );
      });

      optionsContainer.appendChild(button);
    });

    const currentNumber = currentExamIndex + 1;
    const total = currentExamQuestions.length;

    if (progress) {
      progress.textContent =
        `السؤال ${currentNumber} من ${total}`;
    }

    if (progressFill) {
      progressFill.style.width =
        `${(currentNumber / total) * 100}%`;
    }
  }


  // ==========================================
  // 25) تصحيح إجابة الامتحان
  // ==========================================

  function answerExamQuestion(
    selectedButton,
    selectedOption,
    question,
    selectedIndex
  ) {
    if (examAnswered) return;

    examAnswered = true;

    const correctAnswer =
      question.answer ??
      question.correctAnswer ??
      question.correct;

    const selectedValue =
      typeof selectedOption === "object"
        ? (
            selectedOption.value ??
            selectedOption.text ??
            selectedOption.label
          )
        : selectedOption;

    const hasCorrectAnswer =
      correctAnswer !== undefined &&
      correctAnswer !== null &&
      correctAnswer !== "";

    const isIndexAnswer =
      typeof correctAnswer === "number" ||
      (typeof correctAnswer === "string" && correctAnswer.trim() !== "");

    const isCorrect = hasCorrectAnswer && (
      String(selectedValue) === String(correctAnswer) ||
      (
        isIndexAnswer &&
        Number.isInteger(Number(correctAnswer)) &&
        Number(correctAnswer) === selectedIndex
      )
    );

    if (isCorrect) {
      examScore++;

      selectedButton.classList.add("correct");

    } else {
      selectedButton.classList.add("incorrect");
    }

    const optionsContainer = $("examOptionsContainer");

    optionsContainer?.querySelectorAll("button").forEach(
      (button) => {
        button.disabled = true;
      }
    );

    const feedback = $("examFeedback");

    if (feedback) {
      feedback.textContent = isCorrect
        ? "إجابة صحيحة! أحسنت 👏"
        : (
            question.explanation ||
            "الإجابة غير صحيحة. راجع الدرس وحاول مرة أخرى."
          );

      feedback.classList.add(
        isCorrect ? "correct" : "incorrect"
      );
    }

    let nextButton = $("examNextQuestionBtn");

    if (!nextButton) {
      nextButton = document.createElement("button");

      nextButton.type = "button";
      nextButton.id = "examNextQuestionBtn";
      nextButton.className = "exam-next-btn";

      $("examQuestionBox")?.appendChild(nextButton);
    }

    nextButton.textContent =
      currentExamIndex + 1 >= currentExamQuestions.length
        ? "عرض النتيجة"
        : "السؤال التالي";

    nextButton.disabled = false;

    nextButton.onclick = () => {
      nextButton.remove();

      currentExamIndex++;

      if (
        currentExamIndex < currentExamQuestions.length
      ) {
        renderExamQuestion();
      } else {
        finishExam();
      }
    };
  }


  // ==========================================
  // 26) إنهاء الامتحان
  // ==========================================

  async function finishExam() {
    const total = currentExamQuestions.length;

      const percentage = total
    ? Math.round((examScore / total) * 100)
    : 0;

  const passed = percentage >= PASS_PERCENTAGE;

  $("examQuestionBox")?.style.setProperty(
    "display",
    "none"
  );

  const resultBox = $("examResultBox");

  if (resultBox) {
    resultBox.classList.add("show");
  }

  const finalScore = $("finalScore");

  if (finalScore) {
    finalScore.textContent =
      `${examScore}/${total}`;
  }

  const resultTitle = $("resultTitle");
  const resultMsg = $("resultMsg");

  if (resultTitle) {
    resultTitle.textContent = passed
      ? "مبروك! نجحت في الامتحان 🎉"
      : "حاول مرة أخرى!";
  }

  if (resultMsg) {
    resultMsg.textContent = passed
      ? `حصلت على ${percentage}% واجتزت الامتحان بنجاح.`
      : `حصلت على ${percentage}%. تحتاج إلى 80% على الأقل للنجاح.`;
  }

  if (passed) {
    writeStorage(
      `cody_python_exam_passed_${currentChapterId}`,
      true
    );

    // الامتحان له سجل مستقل حتى لا يُحسب كدرس عادي.
    await saveProgressToFirebase({
      chapter: Number(currentChapterId) - 1,
      lesson: 104
    });
  }
}


// ==========================================
// 27) إعادة الامتحان
// ==========================================

function retryExam() {
  if (!currentLesson) return;

  startExam(currentLesson);
}


// ==========================================
// 28) العودة إلى الدرس
// ==========================================

function returnToLesson() {
  $("examView")?.classList.remove("show");

  $("chatContainer")?.style.removeProperty("display");

  $("editorContainer")?.style.removeProperty("display");

  currentStepIndex = 0;

  loadCurrentLesson();
}


// ==========================================
// 29) حفظ التقدم
// ==========================================

async function saveProgressToFirebase(position = {}) {
  try {
    const authModule = await import("./js/auth.js");

    if (typeof authModule.saveLessonProgress !== "function") {
      throw new Error("دالة حفظ تقدم الدروس غير متاحة في js/auth.js");
    }

    const chapter = Number.isInteger(position.chapter)
      ? position.chapter
      : Number(currentChapterId) - 1;

    const lesson = Number.isInteger(position.lesson)
      ? position.lesson
      : Number(currentLessonIndex);

    await authModule.saveLessonProgress({
      language: "python",
      chapter,
      lesson,
      completed: true
    });

    return true;
  } catch (error) {
    console.error("تعذر حفظ تقدم درس بايثون في Firebase:", error);
    return false;
  }
}


// ==========================================
// 30) أحداث الأزرار
// ==========================================

function bindPageEvents() {
  $("sidebarToggle")?.addEventListener(
    "click",
    openSidebar
  );

  $("closeSidebarBtn")?.addEventListener(
    "click",
    closeSidebar
  );

  $("overlay")?.addEventListener(
    "click",
    closeSidebar
  );

  nextBtn?.addEventListener(
    "click",
    () => {
      if ($("examView")?.classList.contains("show")) return;

      if (
        currentStep &&
        ["challenge", "code", "coding"].includes(currentStep.type) &&
        !challengeSolved &&
        $("pythonEditorWrapper")?.style.display === "none"
      ) {
        reopenCurrentChallenge();
        return;
      }

      if (
        currentLesson &&
        currentStepIndex >=
          getLessonSteps(currentLesson).length
      ) {
        goToNextLesson();
      } else {
        advanceChat();
      }
    }
  );

  $("retryExamBtn")?.addEventListener(
    "click",
    retryExam
  );

  $("returnLessonBtn")?.addEventListener(
    "click",
    returnToLesson
  );

  $("editorBackdrop")?.addEventListener(
    "click",
    closeEditor
  );

  document.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Escape") {
        closeSidebar();
        closeEditor();
      }
    }
  );
}


// ==========================================
// 31) تحميل بيانات الطالب
// ==========================================

async function loadStudentData() {
  const xpDisplay = $("xpDisplay");
  const savedXP = Number(readStorage("cody_python_xp", 0)) || 0;
  if (xpDisplay) xpDisplay.textContent = String(savedXP);

  try {
    const [authModule, firebaseModule, firestoreModule, avatarModule] =
      await Promise.all([
        import("./js/auth.js"),
        import("./js/firebase-config.js"),
        import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"),
        import("./js/avatars.js")
      ]);

    const user = await authModule.requireUser();
    const userRef = firestoreModule.doc(firebaseModule.db, "users", user.uid);
    const snapshot = await firestoreModule.getDoc(userRef);
    const userData = snapshot.exists() ? snapshot.data() : {};
    const avatars = avatarModule.getAllAvatars();
    const inventory = Array.isArray(userData.inventory) ? userData.inventory : [];
    const activeAvatar = typeof userData.activeAvatar === "string"
      ? userData.activeAvatar
      : "cody";

    const selected = avatars.find(avatar =>
      avatar.id === activeAvatar &&
      (!avatar.storeItem || inventory.includes(avatar.id))
    );

    avatarModule.installAvatarStyles();
    profileAvatarHTML = avatarModule.renderAvatar(selected?.id || "cody");

    const nameElement = $("studentName");
    if (nameElement) {
      nameElement.textContent = userData.displayName || user.displayName || "المتعلم";
    }
    return true;
  } catch (error) {
    console.error("تعذر تحميل صورة الملف الشخصي:", error);
    const cached = readStorage("cody_python_avatar", "");
    profileAvatarHTML = typeof cached === "string" && cached.trim()
      ? `<img src="${escapeHTML(cached)}" alt="صورة الملف الشخصي">`
      : '<span class="avatar-fallback" aria-label="صورة الملف الشخصي"><i class="ri-user-3-fill"></i></span>';
    return false;
  }
}


// ==========================================
// 32) التحقق من ملفات الفصول
// ==========================================

function validateChapterData() {
  const ids = getChapterIds();

  if (!ids.length) {
    showToast(
      "لم يتم العثور على ملفات الفصول. تأكد من مسارات ملفات ch1.js إلى ch12.js."
    );

    console.error(
      "window.CHAPTERS غير موجود أو فارغ."
    );

    return false;
  }

  console.info("الفصول المحملة:", ids);

  return true;
}


// ==========================================
// 33) تشغيل الصفحة
// ==========================================

async function initializePythonLesson() {
  bindPageEvents();

  await loadStudentData();

  if (!validateChapterData()) {
    return;
  }

  renderChapters();
  updateProgressDisplay();

  const firstChapter = getChapterIds()[0];

  const savedChapter = Number(
    readStorage(
      "cody_python_current_chapter",
      firstChapter
    )
  );

  const savedLesson = Number(
    readStorage(
      "cody_python_current_lesson",
      0
    )
  );

  currentChapterId = getChapter(savedChapter)
    ? savedChapter
    : firstChapter;

  currentLessonIndex =
    Number.isInteger(savedLesson) && savedLesson >= 0
      ? savedLesson
      : 0;

  if (
    currentLessonIndex >=
    getChapterLessons(currentChapterId).length
  ) {
    currentLessonIndex = 0;
  }

  loadCurrentLesson();

  console.info(
    "Python Lesson initialized."
  );
}


// ==========================================
// 34) حفظ موضع الدرس
// ==========================================

window.addEventListener("beforeunload", () => {
  writeStorage(
    "cody_python_current_chapter",
    currentChapterId
  );

  writeStorage(
    "cody_python_current_lesson",
    currentLessonIndex
  );
});


// ==========================================
// 35) بدء التطبيق
// ==========================================

if (document.readyState === "loading") {
  document.addEventListener(
    "DOMContentLoaded",
    initializePythonLesson,
    { once: true }
  );

} else {
  initializePythonLesson();
}

</script>
