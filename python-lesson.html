<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة بايثون | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.85); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; --purple: #a99aff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(107,232,255,0.08), transparent 60%); overflow-x: hidden; }
    .top-nav { width: 100%; background: rgba(5, 8, 16, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .back-btn { display: flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 800; transition: 0.3s; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 10px; }
    .back-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
    .lesson-title { font-weight: 800; color: var(--gold); font-size: 1.1rem; }
    .xp-badge { background: rgba(255, 212, 138, 0.1); color: var(--gold); padding: 6px 15px; border-radius: 20px; font-weight: 900; border: 1px solid rgba(255, 212, 138, 0.3); }
    .chat-container { width: 100%; max-width: 900px; flex: 1; padding: 30px 20px 120px 20px; display: flex; flex-direction: column; gap: 20px; }
    .message-row { display: flex; gap: 15px; align-items: flex-end; opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .message-row.show { opacity: 1; transform: translateY(0); }
    .message-row.cody { flex-direction: row; }
    .message-row.cody .avatar { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }
    .message-row.cody .bubble { background: var(--glass); border: 1px solid var(--border); border-radius: 20px 20px 0 20px; }
    .message-row.student { flex-direction: row-reverse; }
    .message-row.student .avatar { background: linear-gradient(135deg, #a99aff, #6b4eff); }
    .message-row.student .bubble { background: rgba(169,154,255,0.1); border: 1px solid rgba(169,154,255,0.3); border-radius: 20px 20px 20px 0; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .bubble { padding: 15px 20px; color: var(--text); font-size: 1.1rem; line-height: 1.7; max-width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .bubble code { background: rgba(0,0,0,0.5); color: var(--gold); padding: 2px 6px; border-radius: 6px; font-family: 'Fira Code', monospace; direction: ltr; display: inline-block; }
    .choices-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; margin-right: 65px; margin-top: -5px; }
    .choice-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 15px 20px; border-radius: 12px; font-family: 'Cairo'; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; text-align: right; }
    .choice-btn:hover { background: rgba(107,232,255,0.1); border-color: var(--cyan); transform: translateX(-5px); }
    .editor-wrapper { display: none; width: 100%; max-width: 900px; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; animation: slideDown 0.5s ease; }
    .editor-wrapper.show { display: block; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .btn-run { background: var(--green); color: #000; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-run:hover { box-shadow: 0 0 15px var(--green); transform: scale(1.05); }
    .code-area { display: flex; gap: 15px; height: 250px; }
    .CodeMirror { flex: 1; height: 100% !important; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 1.1rem; direction: ltr; text-align: left; }
    .output-area { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-family: 'Fira Code', monospace; color: #ccc; direction: ltr; text-align: left; overflow-y: auto; font-size: 1rem; white-space: pre-wrap; }
    .bottom-action { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--bg) 60%, transparent); padding: 20px; display: none; justify-content: center; z-index: 100; }
    .bottom-action.show { display: flex; }
    .btn-next { background: var(--cyan); color: #000; border: none; padding: 16px 50px; border-radius: 50px; font-weight: 900; font-size: 1.2rem; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; box-shadow: 0 5px 20px rgba(107,232,255,0.3); display: flex; align-items: center; gap: 10px; }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(107,232,255,0.5); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) { .code-area { flex-direction: column; height: 450px; } .bubble { max-width: 90%; font-size: 1rem; } .choices-container { margin-right: 0; max-width: 100%; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="python-chapters.html" class="back-btn"><i class="ri-arrow-right-line"></i> الخريطة</a>
    <div class="lesson-title" id="headerTitle">جاري التحميل...</div>
    <div class="xp-badge" id="xpDisplay">XP: 0</div>
  </div>
  <div class="chat-container" id="chatContainer"></div>
  <div class="editor-wrapper" id="editorWrapper">
    <div class="editor-header">
      <span style="font-family: 'Fira Code', monospace; color: var(--muted);">main.py</span>
      <button class="btn-run" onclick="runCode()"><i class="ri-play-circle-fill"></i> تشغيل الكود</button>
    </div>
    <div class="code-area">
      <textarea id="codeEditor"></textarea>
      <div class="output-area" id="outputArea">&gt; Output...</div>
    </div>
  </div>
  <div class="bottom-action" id="bottomAction">
    <button class="btn-next" id="nextBtn" onclick="advanceChat()">متابعة <i class="ri-arrow-left-line"></i></button>
  </div>

  <script src="js/chapters/ch1.js"></script>
  <script src="js/chapters/ch2.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

  <script>
    "use strict";
    const PROGRESS_KEY = "cody_python_progress";
    const XP_KEY = "cody_xp";
    const urlParams = new URLSearchParams(window.location.search);
    let chapterId = parseInt(urlParams.get("ch")) || 1;
    let lessonId = parseInt(urlParams.get("lesson")) || 1;
    let currentLesson = null;
    let currentStepIndex = 0;
    let challengeSolved = false;
    const editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), { lineNumbers: true, mode: "python", theme: "dracula", indentUnit: 4, lineWrapping: true });

    function updateXpDisplay() {
      const xp = parseInt(localStorage.getItem(XP_KEY)) || 0;
      document.getElementById("xpDisplay").textContent = `XP: ${xp}`;
    }
    function loadLesson() {
      const chapter = window.CHAPTERS && window.CHAPTERS[chapterId];
      if (!chapter) { window.location.href = "python-chapters.html"; return; }
      currentLesson = chapter.lessons[lessonId - 1];
      if (!currentLesson) { window.location.href = "python-chapters.html"; return; }
      document.getElementById("headerTitle").textContent = `${chapter.title} · الدرس ${lessonId}`;
      document.getElementById("chatContainer").innerHTML = "";
      currentStepIndex = 0;
      challengeSolved = false;
      updateXpDisplay();
      processStep();
    }
    function processStep() {
      if (currentStepIndex >= currentLesson.steps.length) { endLesson(); return; }
      const step = currentLesson.steps[currentStepIndex];
      document.getElementById("bottomAction").classList.remove("show");
      document.getElementById("editorWrapper").classList.remove("show");

      if (step.type === "cody") {
        addBubble("cody", step.text);
        showNextButton();
        currentStepIndex++;
      } else if (step.type === "choice") {
        addBubble("cody", step.question);
        renderChoices(step.options, step.replies);
        currentStepIndex++;
      } else if (step.type === "challenge") {
        addBubble("cody", "تحدي برمجي! اكتب الكود في المحرر بالأسفل 👇");
        showEditor(step);
      } else if (step.type === "quiz") {
        addBubble("cody", step.question);
        renderQuiz(step.options, step.correct, step.explanation);
        currentStepIndex++;
      }
    }
    function addBubble(type, text) {
      const row = document.createElement("div");
      row.className = `message-row ${type} show`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = type === "cody" ? "🤖" : "👦";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text;
      row.appendChild(avatar);
      row.appendChild(bubble);
      document.getElementById("chatContainer").appendChild(row);
      scrollToBottom();
    }
    function renderChoices(options, replies) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          container.remove();
          addBubble("student", opt);
          if (replies && replies[index]) addBubble("cody", replies[index]);
          scrollToBottom();
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container);
      scrollToBottom();
    }
    function renderQuiz(options, correctIndex, explanation) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          container.remove();
          addBubble("student", opt);
          if (index === correctIndex) {
            addBubble("cody", "✅ إجابة صحيحة! " + (explanation || ""));
            addXp(5);
          } else {
            addBubble("cody", `❌ ليست صحيحة. الإجابة الصح: <code>${options[correctIndex]}</code>. ` + (explanation || ""));
          }
          scrollToBottom();
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container);
      scrollToBottom();
    }
    function showNextButton() { document.getElementById("bottomAction").classList.add("show"); }
    function advanceChat() { document.getElementById("bottomAction").classList.remove("show"); processStep(); }
    function showEditor(step) {
      document.getElementById("editorWrapper").classList.add("show");
      editor.setValue(step.defaultCode);
      document.getElementById("outputArea").textContent = "> Output...";
      document.getElementById("outputArea").style.color = "#ccc";
      window.currentChallenge = step;
      challengeSolved = false;
      scrollToBottom();
    }
    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    }
    async function runCode() {
      const outputArea = document.getElementById("outputArea");
      const code = editor.getValue();
      const challenge = window.currentChallenge;
      if (!code.trim()) { outputArea.textContent = "⚠️ اكتب بعض الكود أولاً."; return; }
      outputArea.textContent = "> Running...";
      let outputText = "";
      Sk.configure({ output: (t) => { outputText += t; }, read: builtinRead, __future__: Sk.python3 });
      try {
        await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
        const actual = outputText.trim();
        const passed = challenge.check(code) && actual === challenge.expected.trim();
        if (passed) {
          outputArea.textContent = actual + "\n\n✅ إجابة صحيحة!";
          outputArea.style.color = "var(--green)";
          if (!challengeSolved) {
            challengeSolved = true;
            addBubble("cody", challenge.successMsg);
            addXp(10);
            if (typeof window.confetti === "function") window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            currentStepIndex++;
            showNextButton();
          }
        } else {
          outputArea.textContent = actual + `\n\n⚠️ الناتج غير مطابق.\n💡 تلميح: ${challenge.hint}`;
          outputArea.style.color = "var(--gold)";
        }
      } catch (err) {
        outputArea.textContent = "❌ خطأ:\n" + err.toString();
        outputArea.style.color = "var(--red)";
      }
      scrollToBottom();
    }
    function addXp(amount) {
      let xp = parseInt(localStorage.getItem(XP_KEY)) || 0;
      localStorage.setItem(XP_KEY, xp + amount);
      updateXpDisplay();
    }
    function endLesson() {
      addBubble("cody", "🎉 مبروك! أتممت الدرس بنجاح.");
      const chapter = window.CHAPTERS[chapterId];
      let progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[], "stars":{}}');
      if (lessonId === chapter.lessons.length && !progress.completed.includes(chapterId)) {
        progress.completed.push(chapterId);
        progress.stars[chapterId] = 3;
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
      }
      const btn = document.getElementById("nextBtn");
      btn.innerHTML = 'العودة للخريطة <i class="ri-map-pin-line"></i>';
      btn.onclick = () => { window.location.href = "python-chapters.html"; };
      showNextButton();
      scrollToBottom();
    }
    function scrollToBottom() {
      setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
    }
    loadLesson();
  </script>
</body>
</html>
