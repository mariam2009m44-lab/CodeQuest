<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدرس | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(107,232,255,0.1), transparent 60%); }
    .top-nav { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; }
    .lesson-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    .cody-dialogue { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; gap: 15px; }
    .cody-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #00d2ff, #3a7bd5); display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; }
    .bubble-text { font-size: 1.05rem; line-height: 1.7; }
    .bubble-text code { background: rgba(0,0,0,0.3); color: var(--gold); padding: 2px 6px; border-radius: 6px; font-family: 'Fira Code', monospace; direction: ltr; display: inline-block; }
    .task-box { background: rgba(255,212,138,0.1); border: 1px solid var(--gold); border-radius: 12px; padding: 15px; color: var(--gold); font-weight: 700; font-size: 1rem; }
    .editor-section { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; }
    .btn-run { background: var(--green); color: #000; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-run:hover { box-shadow: 0 0 15px var(--green); transform: scale(1.02); }
    .code-area { display: flex; gap: 15px; height: 250px; }
    .CodeMirror { flex: 1; height: 100% !important; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 1rem; direction: ltr; }
    .output-area { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-family: 'Fira Code', monospace; color: #ccc; direction: ltr; text-align: left; overflow-y: auto; font-size: 0.95rem; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .btn-next { flex: 1; background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; display: none; transition: 0.3s; text-align: center; text-decoration: none; }
    .btn-next:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.01); }
    .btn-next.show { display: block; }
    @media (max-width: 600px) { .code-area { flex-direction: column; height: 400px; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="python-chapters.html" class="back-btn"><i class="ri-arrow-right-line"></i> خريطة الفصول</a>
    <div style="font-weight: 900; color: var(--gold);" id="headerTitle">جاري التحميل...</div>
  </div>
  <div class="lesson-container">
    <div class="cody-dialogue">
      <div class="cody-avatar">🤖</div>
      <div class="bubble-text" id="codyText"></div>
    </div>
    <div class="task-box" id="taskText"></div>
    <div class="editor-section">
      <div class="editor-header">
        <span style="font-family: 'Fira Code', monospace; color: var(--muted);">main.py</span>
        <button class="btn-run" onclick="runCode()"><i class="ri-play-circle-fill"></i> تشغيل الكود</button>
      </div>
      <div class="code-area">
        <textarea id="codeEditor"></textarea>
        <div class="output-area" id="outputArea">> Output...</div>
      </div>
      <div class="nav-buttons">
        <a href="python-chapters.html" style="background:transparent; border:1px solid var(--border); color:var(--text); padding:16px; border-radius:14px; font-weight:900; text-decoration:none; text-align:center;">الخريطة</a>
        <button class="btn-next" id="nextBtn" onclick="goToNextChapter()">التالي <i class="ri-arrow-left-line"></i></button>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script>
    const lessonData = {
      1: { title: "الفصل 1: الطباعة", cody: "جرب تكتب الكود اللي بيطبع <code>Hello, World!</code>", task: "اكتب كود يطبع الجملة Hello, World!", defaultCode: '# اكتب الكود هنا\n', hint: "print(\"Hello, World!\")", solutionCheck: (c) => c.includes('print("Hello, World!")') || c.includes("print('Hello, World!')"), successMsg: "> Hello, World!<br><br><span style='color: var(--green);'>✓ أحسنت!</span>", successCody: "رائع جدًا! لقد طبعت أول رسالة لك." },
      2: { title: "الفصل 2: المتغيرات", cody: "هنكتب <code>name = \"Cody\"</code>، وبعدين نطبعه.", task: "أنشئ متغير اسمه name واطبعه.", defaultCode: '# اكتب الكود هنا\n', hint: "name = \"اسمك\"\nprint(name)", solutionCheck: (c) => c.includes('name =') && c.includes('print(name)'), successMsg: "> [اسمك]<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "عاش جداً! المتغيرات هتسهل شغلك." },
      3: { title: "الفصل 3: العمليات", cody: "ممكن نكتب <code>print(5 + 3)</code> وهيطلع 8.", task: "اطبع ناتج جمع 10 + 20.", defaultCode: '# اكتب الكود هنا\n', hint: "print(10 + 20)", solutionCheck: (c) => c.includes('print(10 + 20)'), successMsg: "> 30<br><br><span style='color: var(--green);'>✓ عبقري!</span>", successCody: "أنت بتفهم بسرعة!" },
      4: { title: "الفصل 4: الشروط", cody: "لو الرقم أكبر من 10، اطبع \"كبير\".", task: "لو الرقم 15 أكبر من 10، اطبع \"كبير\".", defaultCode: '# اكتب الكود هنا\n', hint: "if 15 > 10:\n    print(\"كبير\")", solutionCheck: (c) => c.includes('if 15 > 10:') && c.includes('print("كبير")'), successMsg: "> كبير<br><br><span style='color: var(--green);'>✓ رائع!</span>", successCody: "البرنامج بقى بيفكر." },
      5: { title: "الفصل 5: التكرار", cody: "بنستخدم <code>for</code> loop.", task: "اطبع \"مرحباً\" 3 مرات.", defaultCode: '# اكتب الكود هنا\n', hint: "for i in range(3):\n    print(\"مرحباً\")", solutionCheck: (c) => c.includes('for') && c.includes('range(3)') && c.includes('print("مرحباً")'), successMsg: "> مرحباً<br>> مرحباً<br>> مرحباً<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "الحلقات بتوفر وقت!" },
      6: { title: "الفصل 6: القوائم", cody: "<code>fruits = [\"Apple\", \"Banana\"]</code>.", task: "أنشئ قائمة واطبع أول عنصر.", defaultCode: '# اكتب الكود هنا\n', hint: "fruits = [\"Apple\", \"Banana\"]\nprint(fruits[0])", solutionCheck: (c) => c.includes('fruits =') && c.includes('print(fruits[0])'), successMsg: "> Apple<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "رائع! القوائم مهمة." },
      7: { title: "الفصل 7: الدوال", cody: "بنكتب <code>def greet():</code> وننادي عليها.", task: "أنشئ دالة اسمها greet تطبع \"Hi\".", defaultCode: '# اكتب الكود هنا\n', hint: "def greet():\n    print(\"Hi\")\ngreet()", solutionCheck: (c) => c.includes('def greet():') && c.includes('greet()'), successMsg: "> Hi<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "الدوال بتخلي الكود منظّم." },
      8: { title: "الفصل 8: النصوص", cody: "تقدر تدمج النصوص بـ <code>+</code>.", task: "اطبع Hello World بمتغيرين.", defaultCode: '# اكتب الكود هنا\n', hint: "x = \"Hello\"\ny = \"World\"\nprint(x + \" \" + y)", solutionCheck: (c) => c.includes('+') && c.includes('print'), successMsg: "> Hello World<br><br><span style='color: var(--green);'>✓ رائع!</span>", successCody: "تمام! دمج النصوص مفيد." },
      9: { title: "الفصل 9: الأخطاء", cody: "بنستخدم <code>try</code> و <code>except</code>.", task: "حاول تقسم على صفر واطبع Error.", defaultCode: '# اكتب الكود هنا\n', hint: "try:\n    print(10/0)\nexcept:\n    print(\"Error\")", solutionCheck: (c) => c.includes('try:') && c.includes('except:'), successMsg: "> Error<br><br><span style='color: var(--green);'>✓ عبقري!</span>", successCody: "مبرمج محترف بتتعامل مع الأخطاء." },
      10: { title: "الفصل 10: القواميس", cody: "مفتاح وقيمة: <code>{\"name\": \"Cody\"}</code>.", task: "أنشئ قاموس person واطبع name.", defaultCode: '# اكتب الكود هنا\n', hint: "person = {\"name\": \"Ali\"}\nprint(person[\"name\"])", solutionCheck: (c) => c.includes('person =') && c.includes('print(person'), successMsg: "> Ali<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "القواميس ممتازة لتنظيم البيانات." },
      11: { title: "الفصل 11: المكتبات", cody: "استخدم <code>import math</code>.", task: "اطبع الجذر التربيعي لـ 16.", defaultCode: '# اكتب الكود هنا\n', hint: "import math\nprint(math.sqrt(16))", solutionCheck: (c) => c.includes('import math') && c.includes('sqrt'), successMsg: "> 4.0<br><br><span style='color: var(--green);'>✓ ممتاز!</span>", successCody: "المكتبات بتوفر وقت." },
      12: { title: "الفصل 12: المشروع", cody: "استخدم كل ما تعلمته.", task: "حلقة من 1 لـ 3، لو زوجي اطبع Even، فردي Odd.", defaultCode: '# اكتب الكود هنا\n', hint: "for i in range(1, 4):\n    if i % 2 == 0:\n        print(\"Even\")\n    else:\n        print(\"Odd\")", solutionCheck: (c) => c.includes('for') && c.includes('if') && c.includes('%'), successMsg: "> Odd<br>> Even<br>> Odd<br><br><span style='color: var(--green);'>✓ مشروع ناجح!</span>", successCody: "مبروك! أنت مبرمج بايثون." }
    };
    const urlParams = new URLSearchParams(window.location.search);
    let chapterId = parseInt(urlParams.get('ch')) || 1;
    let currentLesson = lessonData[chapterId];
    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), { lineNumbers: true, mode: 'python', theme: 'dracula', indentUnit: 4, matchBrackets: true });
    let isCompleted = false;
    function loadLesson(id) {
      currentLesson = lessonData[id];
      document.getElementById('headerTitle').textContent = currentLesson.title;
      document.getElementById('codyText').innerHTML = currentLesson.cody;
      document.getElementById('taskText').innerHTML = `<i class="ri-lightbulb-fill"></i> ${currentLesson.task}`;
      editor.setValue(currentLesson.defaultCode);
      document.getElementById('outputArea').innerHTML = "> Output...";
      document.getElementById('nextBtn').classList.remove('show');
      isCompleted = false;
      window.history.replaceState(null, '', `?ch=${id}`);
    }
    function runCode() {
      const code = editor.getValue();
      const output = document.getElementById('outputArea');
      output.innerHTML = '> Executing...<br>';
      setTimeout(() => {
        if (currentLesson.solutionCheck(code)) {
          output.innerHTML += currentLesson.successMsg;
          document.getElementById('nextBtn').classList.add('show');
          document.getElementById('codyText').innerHTML = currentLesson.successCody;
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          if (!isCompleted) { saveProgress(chapterId); isCompleted = true; }
        } else {
          output.innerHTML += `<span style="color: var(--red);">> خطأ في الكود. جرب تاني.</span><br><br><span style="color: var(--gold);">💡 تلميح: ${currentLesson.hint}</span>`;
          document.getElementById('codyText').innerHTML = "متقلقش، جرب تقرأ التلميح وتعدل الكود.";
        }
      }, 500);
    }
    function saveProgress(id) {
      let xp = parseInt(localStorage.getItem('cody_xp')) || 0;
      let completed = JSON.parse(localStorage.getItem('cody_completed_python')) || [];
      if (!completed.includes(id)) {
        xp += 50;
        completed.push(id);
        localStorage.setItem('cody_xp', xp);
        localStorage.setItem('cody_completed_python', JSON.stringify(completed));
      }
    }
    function goToNextChapter() {
      if (chapterId < 12) { chapterId++; loadLesson(chapterId); window.scrollTo(0, 0); } 
      else { window.location.href = 'python-branches.html'; }
    }
    loadLesson(chapterId);
  </script>
</body>
</html>
