
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>رحلة بايثون التفاعلية | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    :root { 
      --bg: #090d16; 
      --sidebar-bg: #0f172a;
      --chat-bg: #1e293b;
      --cody-bubble: #334155;
      --student-bubble: #4f46e5;
      --border: #334155;
      --text: #f8fafc; 
      --muted: #94a3b8; 
      --cyan: #06b6d4; 
      --green: #10b981; 
      --red: #f43f5e; 
      --gold: #fbbf24; 
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100dvh; overflow: hidden; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999; transition: 0.3s; }
    .overlay.open { display: block; }
    .sidebar { width: 320px; background: var(--sidebar-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; z-index: 1000; transition: 0.3s ease; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; }
    .sidebar-brand img { width: 28px; height: 28px; }
    .sidebar-brand h2 { color: var(--cyan); font-size: 1.1rem; font-weight: 900; }
    .close-btn { display: none; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
    .chapters-list { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 8px; }
    .chapter-item { background: #1e293b; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .chapter-title { padding: 12px 15px; font-weight: 700; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .chapter-title:hover { background: #334155; }
    .lessons-list { display: none; flex-direction: column; background: #0f172a; }
    .lessons-list.open { display: flex; }
    .lesson-link { padding: 10px 15px; color: var(--muted); text-decoration: none; font-size: 0.85rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .lesson-link:hover, .lesson-link.active { color: var(--cyan); background: #1e293b; font-weight: 700; }
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; width: 100%; background: var(--bg); }
    .top-bar { padding: 12px 15px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 10; flex-wrap: wrap; }
    .menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    .back-btn { color: var(--text); text-decoration: none; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; background: #1e293b; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; }
    .back-btn:hover { background: var(--cyan); color: #000; }
    .progress-container { flex: 1; min-width: 100px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; color: var(--gold); }
    .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); width: 0%; transition: 0.5s ease; }
    .stats-badge { background: rgba(251, 191, 36, 0.1); color: var(--gold); padding: 4px 10px; border-radius: 15px; font-weight: 900; font-size: 0.8rem; border: 1px solid rgba(251, 191, 36, 0.3); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .chat-container { flex: 1; padding: 15px; padding-bottom: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; background: var(--bg); }
    .message-row { display: flex; gap: 10px; align-items: flex-end; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message-row.cody { flex-direction: row; }
    .message-row.cody .avatar { background: #0ea5e9; }
    .message-row.cody .bubble { background: var(--cody-bubble); border: 1px solid var(--border); border-radius: 16px 16px 0 16px; }
    .message-row.student { flex-direction: row-reverse; }
    .message-row.student .avatar { background: var(--student-bubble); }
    .message-row.student .bubble { background: var(--student-bubble); border: 1px solid var(--student-bubble); border-radius: 16px 16px 16px 0; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0; }
    .bubble { padding: 12px 16px; font-size: 0.95rem; line-height: 1.7; max-width: 85%; color: #fff; }
    .bubble code { background: #0f172a; color: var(--cyan); padding: 2px 6px; border-radius: 4px; font-family: 'Fira Code', monospace; direction: ltr; display: inline-block; margin: 5px 0; }
    .choices-container { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; margin-right: 48px; }
    .choice-btn { background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 12px 15px; border-radius: 10px; font-family: 'Cairo'; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: right; }
    .choice-btn:hover { background: #334155; border-color: var(--cyan); }
    .editor-wrapper { display: none; width: calc(100% - 48px); margin-right: 48px; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-top: 10px; }
    .editor-wrapper.show { display: block; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-run { background: var(--green); color: #000; border: none; padding: 6px 16px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
    .code-area { display: flex; flex-direction: column; gap: 10px; }
    .CodeMirror { height: 200px !important; border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 0.9rem; direction: ltr; text-align: left; }
    .output-area { height: 100px; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: 'Fira Code', monospace; color: #ccc; direction: ltr; text-align: left; overflow-y: auto; font-size: 0.85rem; white-space: pre-wrap; }
    .bottom-action { position: fixed; bottom: calc(var(--safe-bottom) + 15px); left: 50%; transform: translateX(-50%); display: none; justify-content: center; z-index: 9999; width: 90%; max-width: 350px; }
    .bottom-action.show { display: flex; }
    .btn-next { background: var(--cyan); color: #000; border: none; padding: 14px 20px; width: 100%; border-radius: 50px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 10px 25px rgba(6, 182, 212, 0.5); transition: 0.2s; }
    .btn-next:hover { transform: scale(1.02); }
    @media (max-width: 900px) {
      .sidebar { position: fixed; top: 0; right: -100%; height: 100dvh; width: 280px; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
      .sidebar.open { right: 0; }
      .close-btn { display: block; }
      .menu-btn { display: block; order: 1; }
      .back-btn { order: 2; }
      .stats-badge { order: 3; }
      .progress-container { order: 4; width: 100%; margin-top: 5px; }
      .chat-container { padding: 10px; padding-bottom: 120px; }
      .bubble { max-width: 90%; font-size: 0.9rem; padding: 10px 14px; }
      .choices-container, .editor-wrapper { margin-right: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
        <h2>رحلة بايثون</h2>
      </div>
      <button class="close-btn" onclick="toggleSidebar()"><i class="ri-close-line"></i></button>
    </div>
    <div class="chapters-list" id="chaptersList"></div>
  </div>

  <div class="main-area">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="ri-menu-line"></i></button>
      <a href="python-chapters.html" class="back-btn"><i class="ri-map-2-line"></i> الخريطة</a>
      <div class="stats-badge"><i class="ri-star-fill"></i> <span id="xpDisplay">0</span> XP</div>
      <div class="progress-container">
        <div class="progress-text"><span>تقدمك في الرحلة</span><span id="progressPercent">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="bottom-action" id="bottomAction">
      <button class="btn-next" id="nextBtn" onclick="advanceChat()">متابعة <i class="ri-arrow-left-line"></i></button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script>
    "use strict";
    
    // ================== المحتوى الكامل للـ 12 فصل ==================
    const allChapters = {
      1: {
        title: "الطباعة",
        lessons: [
          { title: "الدرس 1: أول أمر", steps: [
            { type: "cody", text: "أهلاً بك يا بطل! 🤖 أنا كودي. سنتعلم اليوم أول أمر برمجي: <code>print()</code>." },
            { type: "choice", question: "هل أنت مستعد للبدء؟", options: ["نعم، جاهز!", "ممكن توضيح أكثر؟"], replies: ["رائع! لنتحرك.", "بالتأكيد. الأمر print يطلب من الكمبيوتر عرض شيء على الشاشة."] },
            { type: "cody", text: "اكتب <code>print(\"Hello\")</code> في المحرر." },
            { type: "challenge", expected: "Hello", defaultCode: '# اكتب هنا\n', hint: 'print("Hello")', check: (code) => /print\s*\(\s*(['"])Hello\1\s*\)/m.test(code.trim()), successMsg: "ممتاز! 🎉 لقد كتبت أول كود لك." }
          ]},
          { title: "الدرس 2: الأرقام", steps: [
            { type: "cody", text: "الأمر print يطبع الأرقام أيضاً. اكتب <code>print(25)</code>." },
            { type: "challenge", expected: "25", defaultCode: '# اكتب هنا\n', hint: 'print(25)', check: (code) => /print\s*\(\s*25\s*\)/m.test(code.trim()), successMsg: "عمل رائع! الأرقام لا تحتاج لعلامات تنصيص." }
          ]},
          { title: "الدرس 3: الحساب", steps: [
            { type: "cody", text: "الكمبيوتر ذكي! اكتب <code>print(5 + 3)</code> ليقوم بالجمع." },
            { type: "challenge", expected: "8", defaultCode: '# اكتب هنا\n', hint: 'print(5 + 3)', check: (code) => /print\s*\(\s*5\s*\+\s*3\s*\)/m.test(code.trim()), successMsg: "عبقري! الكمبيوتر أجرى العملية." }
          ]},
          { title: "الدرس 4: نصوص متعددة", steps: [
            { type: "cody", text: "يمكنك طباعة أكثر من سطر. اطبع <code>Hi</code> ثم <code>Bye</code>." },
            { type: "challenge", expected: "Hi\nBye", defaultCode: '# اكتب هنا\n', hint: 'print("Hi")\nprint("Bye")', check: (code) => code.includes('print("Hi")') && code.includes('print("Bye")'), successMsg: "مذهل! الكمبيوتر ينفذ الأوامر بالترتيب." }
          ]},
          { title: "امتحان الفصل", steps: [
            { type: "quiz", question: "ما وظيفة print؟", options: ["عرض النصوص والأرقام", "حذف الكود", "إيقاف الكمبيوتر"], correct: 0, explanation: "الأمر print يعرض المخرجات على الشاشة." },
            { type: "cody", text: "تحدي أخير: اطبع <code>Done</code>." },
            { type: "challenge", expected: "Done", defaultCode: '# اكتب هنا\n', hint: 'print("Done")', check: (code) => code.includes('print("Done")'), successMsg: "مبروك! اجتزت الفصل الأول." }
          ]}
        ]
      },
      2: {
        title: "المتغيرات",
        lessons: [
          { title: "الدرس 1: المتغير", steps: [
            { type: "cody", text: "المتغير هو صندوق نخزن فيه قيمة. اكتب <code>age = 10</code> ثم اطبعها." },
            { type: "challenge", expected: "10", defaultCode: '# اكتب هنا\n', hint: 'age = 10\nprint(age)', check: (code) => code.includes('age = 10') && code.includes('print(age)'), successMsg: "أحسنت! خزنت القيمة وطبعت المتغير." }
          ]},
          { title: "الدرس 2: تغيير القيمة", steps: [
            { type: "cody", text: "يمكنك تغيير القيمة. اكتب <code>score = 5</code> ثم غيرها لـ <code>score = 20</code> واطبعها." },
            { type: "challenge", expected: "20", defaultCode: '# اكتب هنا\n', hint: 'score = 5\nscore = 20\nprint(score)', check: (code) => code.includes('score = 5') && code.includes('score = 20') && code.includes('print(score)'), successMsg: "ممتاز! الكمبيوتر يأخذ آخر قيمة." }
          ]},
          { title: "الدرس 3: دمج النصوص", steps: [
            { type: "cody", text: "اجمع نصين معاً. <code>x = \"Hello\"</code> و <code>y = \"World\"</code>. اطبعهما مع مسافة." },
            { type: "challenge", expected: "Hello World", defaultCode: '# اكتب هنا\n', hint: 'x = "Hello"\ny = "World"\nprint(x + " " + y)', check: (code) => code.includes('x = "Hello"') && code.includes('y = "World"') && code.includes('x + " " + y'), successMsg: "رائع! دمج النصوص مفيد جداً." }
          ]},
          { title: "الدرس 4: قواعد التسمية", steps: [
            { type: "quiz", question: "أي اسم متغير صحيح؟", options: ["2user", "user name", "user_name"], correct: 2, explanation: "لا يبدأ برقم ولا يحتوي على مسافات." },
            { type: "cody", text: "أنشئ متغير <code>user_name</code> وضع فيه اسمك واطبعه." },
            { type: "challenge", expected: "Ali", defaultCode: '# اكتب هنا\n', hint: 'user_name = "Ali"\nprint(user_name)', check: (code) => code.includes('user_name = "Ali"') && code.includes('print(user_name)'), successMsg: "عمل رائع! اتبعت قواعد التسمية." }
          ]},
          { title: "امتحان الفصل", steps: [
            { type: "quiz", question: "كيف ننشئ متغير باسم x وقيمته 5؟", options: ["x == 5", "x = 5", "let x = 5"], correct: 1, explanation: "علامة = المفردة للتعيين." },
            { type: "cody", text: "تحدي أخير: أنشئ متغير <code>hero</code> واطبع <code>I am [اسمك]</code>." },
            { type: "challenge", expected: "I am Ali", defaultCode: '# اكتب هنا\n', hint: 'hero = "Ali"\nprint("I am", hero)', check: (code) => code.includes('hero = "Ali"') && code.includes('print("I am", hero)'), successMsg: "مبروك! اجتزت الفصل الثاني." }
          ]}
        ]
      },
      3: {
        title: "العمليات الحسابية",
        lessons: [
          { title: "الدرس 1: الجمع والطرح", steps: [
            { type: "cody", text: "استخدم + و - في بايثون. اطبع <code>25 + 35</code> و <code>100 - 40</code>." },
            { type: "challenge", expected: "60\n60", defaultCode: '# اكتب هنا\n', hint: 'print(25 + 35)\nprint(100 - 40)', check: (code) => code.includes('print(25 + 35)') && code.includes('print(100 - 40)'), successMsg: "ممتاز! العمليات الأساسية سهلة." }
          ]},
          { title: "الدرس 2: الضرب والقسمة", steps: [
            { type: "cody", text: "للضرب نستخدم * وللقسمة /. اطبع <code>8 * 7</code> و <code>50 / 2</code>." },
            { type: "challenge", expected: "56\n25.0", defaultCode: '# اكتب هنا\n', hint: 'print(8 * 7)\nprint(50 / 2)', check: (code) => code.includes('print(8 * 7)') && code.includes('print(50 / 2)'), successMsg: "رائع! لاحظ أن القسمة تعطي رقماً عشرياً." }
          ]},
          { title: "الدرس 3: باقي القسمة", steps: [
            { type: "cody", text: "علامة % تجيب باقي القسمة. اطبع <code>15 % 4</code>." },
            { type: "challenge", expected: "3", defaultCode: '# اكتب هنا\n', hint: 'print(15 % 4)', check: (code) => code.includes('print(15 % 4)'), successMsg: "عبقري! 15 على 4 تساوي 3 والباقي 3." }
          ]},
          { title: "الدرس 4: أولويات العمليات", steps: [
            { type: "cody", text: "الأقواس تغير الأولويات. اطبع <code>(10 + 5) * 2</code> ثم <code>10 + (5 * 2)</code>." },
            { type: "challenge", expected: "30\n20", defaultCode: '# اكتب هنا\n', hint: 'print((10 + 5) * 2)\nprint(10 + (5 * 2))', check: (code) => code.includes('print((10 + 5) * 2)') && code.includes('print(10 + (5 * 2))'), successMsg: "مذهل! الأقواس غيرت الناتج." }
          ]},
          { title: "امتحان الفصل", steps: [
            { type: "quiz", question: "ما ناتج print(10 - 2 * 3)؟", options: ["24", "4", "8"], correct: 1, explanation: "الضرب أولاً: 2*3=6، ثم 10-6=4." },
            { type: "cody", text: "تحدي أخير: اطبع ناتج (5 + 5) * 2 ثم باقي قسمة 10 على 3." },
            { type: "challenge", expected: "20\n1", defaultCode: '# اكتب هنا\n', hint: 'print((5 + 5) * 2)\nprint(10 % 3)', check: (code) => code.includes('print((5 + 5) * 2)') && code.includes('print(10 % 3)'), successMsg: "مبروك! اجتزت الفصل الثالث." }
          ]}
        ]
      },
      4: {
        title: "الشروط",
        lessons: [
          { title: "الدرس 1: أول قرار", steps: [
            { type: "cody", text: "الشرط if يتحقق من شيء. اكتب <code>if 10 > 5:</code> ثم اطبع <code>Yes</code>." },
            { type: "challenge", expected: "Yes", defaultCode: '# اكتب هنا\n', hint: 'if 10 > 5:\n    print("Yes")', check: (code) => code.includes('if 10 > 5:') && code.includes('print("Yes")'), successMsg: "رائع! الشرط تحقق فتم التنفيذ." }
          ]},
          { title: "الدرس 2: خيار آخر", steps: [
            { type: "cody", text: "استخدم else لتنفيذ شيء إذا كان الشرط خطأ. اكتب: إذا كان 5 > 10 اطبع Yes، وإلا اطبع No." },
            { type: "challenge", expected: "No", defaultCode: '# اكتب هنا\n', hint: 'if 5 > 10:\n    print("Yes")\nelse:\n    print("No")', check: (code) => code.includes('if 5 > 10:') && code.includes('else:') && code.includes('print("No")'), successMsg: "عبقري! انتقل الكمبيوتر إلى else." }
          ]},
          { title: "الدرس 3: شروط متعددة", steps: [
            { type: "cody", text: "استخدم elif. أنشئ <code>score = 75</code> واطبع A إذا كان >= 90 أو B إذا كان >= 75." },
            { type: "challenge", expected: "B", defaultCode: '# اكتب هنا\n', hint: 'score = 75\nif score >= 90:\n    print("A")\nelif score >= 75:\n    print("B")', check: (code) => code.includes('score = 75') && code.includes('elif score >= 75:') && code.includes('print("B")'), successMsg: "ممتاز! elif يفحص الشروط بالترتيب." }
          ]},
          { title: "الدرس 4: العمليات المنطقية", steps: [
            { type: "cody", text: "استخدم and لدمج شرطين. اطبع <code>True</code> إذا كان 10>5 و 5>3." },
            { type: "challenge", expected: "True", defaultCode: '# اكتب هنا\n', hint: 'if 10 > 5 and 5 > 3:\n    print("True")', check: (code) => code.includes('10 > 5 and 5 > 3') && code.includes('print("True")'), successMsg: "عمل رائع! دمجت شرطين بنجاح." }
          ]},

          ]},
          { title: "امتحان الفصل النهائي", steps: [
            { type: "quiz", question: "ما أهم مهارة تعلمتها؟", options: ["حفظ الأوامر", "التفكير المنطقي وحل المشكلات", "الطباعة فقط"], correct: 1, explanation: "البرمجة هي فن حل المشكلات." },
            { type: "cody", text: "تحدي أخير: أنشئ قائمة [1, 2, 3] واطبع طولها." },
            { type: "challenge", expected: "3", defaultCode: '# اكتب هنا\n', hint: 'nums = [1, 2, 3]\nprint(len(nums))', check: (code) => code.includes('len(nums)'), successMsg: "🎉 مبروك! لقد أكملت رحلة بايثون بالكامل." }
          ]}
        ]
      }
    };

    const PROGRESS_KEY = "cody_python_progress";
    const XP_KEY = "cody_xp";
    const urlParams = new URLSearchParams(window.location.search);
    let chapterId = parseInt(urlParams.get("ch")) || 1;
    let lessonId = parseInt(urlParams.get("lesson")) || 1;
    let currentLesson = null, currentStepIndex = 0, challengeSolved = false, editorInstance = null;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function renderSidebar() {
      const list = document.g      const list = document.getElementById("chaptersList");
      list.innerHTML = "";
      Object.keys(allChapters).forEach((id) => {
        const chap = allChapters[id];
        const chapEl = document.createElement("div");
        chapEl.className = "chapter-item";
        
        const titleEl = document.createElement("div");
        titleEl.className = "chapter-title";
        titleEl.innerHTML = `<span>${id}. ${chap.title}</span> <i class="ri-arrow-down-s-line"></i>`;
        
        const lessonsEl = document.createElement("div");
        lessonsEl.className = "lessons-list";
        if (String(chapterId) === id) lessonsEl.classList.add("open");
        
        chap.lessons.forEach((lesson, lIndex) => {
          const lessonEl = document.createElement("a");
          lessonEl.className = `lesson-link ${String(chapterId) === id && (lIndex + 1) === lessonId ? "active" : ""}`;
          lessonEl.innerHTML = `<i class="ri-play-circle-line"></i> ${lesson.title}`;
          lessonEl.href = `python-lesson.html?ch=${id}&lesson=${lIndex + 1}`;
          lessonEl.onclick = () => { if(window.innerWidth <= 900) toggleSidebar(); };
          lessonsEl.appendChild(lessonEl);
        });
        titleEl.onclick = () => lessonsEl.classList.toggle("open");
        
        chapEl.appendChild(titleEl);
        chapEl.appendChild(lessonsEl);
        list.appendChild(chapEl);
      });
    }

    function updateProgressBar() {
      const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
      const percent = Math.round((progress.completed.length / 12) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressPercent").textContent = percent + "%";
      document.getElementById("xpDisplay").textContent = localStorage.getItem(XP_KEY) || 0;
    }

    function loadLesson() {
      const chapter = allChapters[chapterId];
      if (!chapter || !chapter.lessons[lessonId - 1]) {
        document.getElementById("chatContainer").innerHTML = `<div style="text-align:center; padding: 50px;"><h2>هذا الدرس قيد التطوير 🚧</h2></div>`;
        renderSidebar(); updateProgressBar(); return;
      }
      currentLesson = chapter.lessons[lessonId - 1];
      document.getElementById("chatContainer").innerHTML = "";
      currentStepIndex = 0; challengeSolved = false;
      processStep(); renderSidebar(); updateProgressBar();
    }

    function processStep() {
      if (currentStepIndex >= currentLesson.steps.length) { endLesson(); return; }
      const step = currentLesson.steps[currentStepIndex];
      document.getElementById("bottomAction").classList.remove("show");
      const oldEditor = document.querySelector(".editor-wrapper");
      if (oldEditor) oldEditor.remove();

      if (step.type === "cody") {
        addBubble("cody", step.text); showNextButton(); currentStepIndex++;
      } else if (step.type === "choice") {
        addBubble("cody", step.question); renderChoices(step.options, step.replies); currentStepIndex++;
      } else if (step.type === "challenge") {
        addBubble("cody", "تحدي برمجي! اكتب الكود في المحرر 👇"); showEditor(step);
      } else if (step.type === "quiz") {
        addBubble("cody", step.question); renderQuiz(step.options, step.correct, step.explanation); currentStepIndex++;
      }
    }

    function addBubble(type, text) {
      const row = document.createElement("div");
      row.className = `message-row ${type}`;
      row.innerHTML = `<div class="avatar">${type === "cody" ? "🤖" : "👦"}</div><div class="bubble">${text}</div>`;
      document.getElementById("chatContainer").appendChild(row);
      scrollToBottom();
    }

    function renderChoices(options, replies) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn"; btn.textContent = opt;
        btn.onclick = () => {
          container.remove(); addBubble("student", opt);
          if (replies && replies[index]) addBubble("cody", replies[index]);
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); scrollToBottom();
    }

    function renderQuiz(options, correctIndex, explanation) {
      const container = document.createElement("div");
      container.className = "choices-container";
      options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn"; btn.textContent = opt;
        btn.onclick = () => {
          container.remove(); addBubble("student", opt);
          if (index === correctIndex) { addBubble("cody", "✅ إجابة صحيحة! " + (explanation || "")); addXp(5); }
          else { addBubble("cody", `❌ ليست صحيحة. الإجابة الصح: <code>${options[correctIndex]}</code>.`); }
          document.getElementById("bottomAction").classList.add("show");
        };
        container.appendChild(btn);
      });
      document.getElementById("chatContainer").appendChild(container); scrollToBottom();
    }

    function showNextButton() { document.getElementById("bottomAction").classList.add("show"); }
    function advanceChat() { document.getElementById("bottomAction").classList.remove("show"); processStep(); }

    function showEditor(step) {
      const wrapper = document.createElement("div");
      wrapper.className = "editor-wrapper show";
      wrapper.innerHTML = `
        <div class="editor-header">
          <span style="font-family: 'Fira Code', monospace; color: var(--muted); font-size:0.85rem;">main.py</span>
          <button class="btn-run" onclick="runCode()"><i class="ri-play-circle-fill"></i> تشغيل</button>
        </div>
        <div class="code-area">
          <textarea id="dynamicCodeEditor"></textarea>
          <div class="output-area" id="outputArea">&gt; Output...</div>
        </div>
      `;
      document.getElementById("chatContainer").appendChild(wrapper);
      setTimeout(() => {
        if (editorInstance) editorInstance.toTextArea();
        editorInstance = CodeMirror.fromTextArea(document.getElementById("dynamicCodeEditor"), { lineNumbers: true, mode: "python", theme: "dracula", indentUnit: 4, lineWrapping: true });
        editorInstance.setValue(step.defaultCode);
      }, 50);
      window.currentChallenge = step; challengeSolved = false; scrollToBottom();
    }

    function builtinRead(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    }

    async function runCode() {
      const outputArea = document.getElementById("outputArea");
      const code = editorInstance ? editorInstance.getValue() : document.getElementById("dynamicCodeEditor").value;
      const challenge = window.currentChallenge;
      if (!code.trim()) { outputArea.textContent = "⚠️ اكتب الكود أولاً."; return; }
      outputArea.textContent = "> Running...";
      let outputText = "";
      Sk.configure({ output: (t) => { outputText += t; }, read: builtinRead, __future__: Sk.python3 });
      try {
        await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
        const actual = outputText.trim();
        const passed = challenge.check(code) && (challenge.expected === "" || actual === challenge.expected.trim());
        
        if (passed) {
          outputArea.textContent = actual + "\n\n✅ إجابة صحيحة!"; outputArea.style.color = "var(--green)";
          if (!challengeSolved) {
            challengeSolved = true; addBubble("cody", challenge.successMsg); addXp(10);
            if (typeof window.confetti === "function") window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            currentStepIndex++; showNextButton();
          }
        } else {
          outputArea.textContent = actual + `\n\n⚠️ الناتج غير مطابق.\n💡 تلميح: ${challenge.hint}`; outputArea.style.color = "var(--gold)";
        }
      } catch (err) {
        outputArea.textContent = "❌ خطأ:\n" + err.toString(); outputArea.style.color = "var(--red)";
      }
      scrollToBottom();
    }

    function addXp(amount) {
      let xp = parseInt(localStorage.getItem(XP_KEY)) || 0;
      localStorage.setItem(XP_KEY, xp + amount); 
      updateProgressBar();
    }

    function endLesson() {
      addBubble("cody", "🎉 مبروك! أتممت الدرس.");
      addBubble("cody", "📝 <b>مراجعة سريعة:</b> تأكد دائماً من قراءة الكود جيداً قبل تشغيله!");
      
      const btn = document.getElementById("nextBtn");
      
      if (lessonId < allChapters[chapterId].lessons.length) {
        btn.innerHTML = 'الدرس التالي <i class="ri-arrow-left-line"></i>';
        btn.onclick = () => { window.location.href = `python-lesson.html?ch=${chapterId}&lesson=${lessonId + 1}`; };
      } else {
        let progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"completed":[]}');
        if (!progress.completed.includes(chapterId)) {
          progress.completed.push(chapterId);
          localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
        }
        btn.innerHTML = 'الفصل التالي <i class="ri-arrow-left-line"></i>';
        btn.onclick = () => { window.location.href = chapterId < 12 ? `python-lesson.html?ch=${chapterId + 1}&lesson=1` : "python-chapters.html"; };
      }
      showNextButton(); scrollToBottom();
    }

    function scrollToBottom() {
      const chat = document.getElementById("chatContainer");
      setTimeout(() => chat.scrollTop = chat.scrollHeight, 100);
    }

    loadLesson();
  </script>
</body>
</html>
