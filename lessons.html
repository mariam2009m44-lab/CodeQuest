<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار المسار | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1 style="color: var(--text-main);">اختر مسارك البرمجي</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">
            <div class="card" onclick="selectLang('javascript')" style="cursor: pointer; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 15px;">🟨</div>
                <h2 style="color: var(--text-main); margin-bottom: 10px;">JavaScript</h2>
                <p style="color: var(--text-muted);">لغة الويب التفاعلية. الأفضل للبدء وبناء الألعاب والمواقع.</p>
            </div>
            
            <div class="card" onclick="selectLang('python')" style="cursor: pointer; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 15px;">🐍</div>
                <h2 style="color: var(--text-main); margin-bottom: 10px;">Python</h2>
                <p style="color: var(--text-muted);">لغة الذكاء الاصطناعي والبيانات. سهلة وبسيطة وقوية.</p>
            </div>
            
            <div class="card" onclick="selectLang('cpp')" style="cursor: pointer; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 15px;">⚙️</div>
                <h2 style="color: var(--text-main); margin-bottom: 10px;">C++</h2>
                <p style="color: var(--text-muted);">لغة الألعاب والأنظمة السريعة. للمبرمجين الطموحين.</p>
            </div>
        </div>
    </div>
    <script>
        function selectLang(lang) {
            sessionStorage.setItem('selectedLang', lang);
            window.location.href = 'levels.html';
        }
    </script>
</body>
</html>
