<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سيد الأسئلة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); }
        .header h1 { margin: 0; font-size: 1.3rem; color: #34d399; }
        .btn-back { background: rgba(52,211,153,0.1); border: 1px solid #34d399; color: #34d399; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .progress-bar { width: 100%; height: 10px; background: #1e1e1e; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00e5ff, #34d399); width: 0%; transition: 0.3s; }
        
        .question-box { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; width: 100%; }
        .question-text { font-size: 1.3rem; margin-bottom: 20px; min-height: 60px;}
        .options { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .option-btn { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 10px; font-family: 'Cairo'; font-size: 1.1rem; cursor: pointer; transition: 0.2s; text-align: right; }
        .option-btn:hover { background: rgba(52,211,153,0.1); border-color: #34d399; }
        .option-btn.correct { background: rgba(52,211,153,0.3) !important; border-color: #34d399; color: #fff; pointer-events: none; }
        .option-btn.wrong { background: rgba(255,68,68,0.3) !important; border-color: #ff4444; color: #fff; pointer-events: none; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,9,20,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid #ffd700; padding: 40px; border-radius: 30px; text-align: center; }
        .btn-claim { background: #34d399; color: #000; padding: 15px 40px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 15px; }
    </style>
</head><body>
    <div class="header"><a href="games.html" class="btn-back">← رجوع</a><h1>❓ سيد الأسئلة</h1><div style="width: 70px;"></div></div>
    <div class="game-area">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="question-box">
            <div class="question-text" id="question">جاري التحميل...</div>
            <div class="options" id="options"></div>
        </div>
    </div>
    <div class="modal" id="resultModal"><div class="modal-content">
        <h2 style="color: #ffd700;">🎉 أكملت الاختبار!</h2>
        <p style="font-size: 1.5rem;">النتيجة: <span id="finalScore" style="color: #34d399; font-weight: bold;">0</span> / 5</p>
        <button class="btn-claim" onclick="claimReward()">احصل على النقاط</button>
    </div></div>

    <script>
        const questions = [
            { q: "ما هي اللغة التي تعمل في المتصفح بشكل أساسي؟", options: ["Python", "JavaScript", "C++", "Java"], correct: 1 },
            { q: "أي من هذه الكلمات هي كلمة محجوزة في JS؟", options: ["let", "name", "value", "data"], correct: 0 },
            { q: "كيف نكتب تعليقاً في JavaScript؟", options: ["<!-- -->", "#", "//", "/* */"], correct: 2 },
            { q: "ما هي النتيجة المتوقعة: typeof 5؟", options: ["'number'", "'integer'", "'float'", "'string'"], correct: 0 },
            { q: "أي دالة تستخدم لتحويل نص إلى رقم صحيح؟", options: ["Number()", "parseInt()", "toString()", "String()"], correct: 1 }
        ];
        
        let currentQ = 0, score = 0;

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((l) => { if(!l) window.location.href='index.html'; else showQuestion(); });
        });

        function showQuestion() {
            if(currentQ >= questions.length) { endGame(); return; }
            document.getElementById('progressFill').style.width = ((currentQ) / questions.length * 100) + '%';
            
            const q = questions[currentQ];
            document.getElementById('question').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                optDiv.appendChild(btn);
            });
        }

        function checkAnswer(idx, btn) {
            const correctIdx = questions[currentQ].correct;
            if(idx === correctIdx) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn')[correctIdx].classList.add('correct');
            }
            setTimeout(() => {
                currentQ++;
                showQuestion();
            }, 1200);
        }

        function endGame() {
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('resultModal').classList.add('active');
            if(score > 2) confetti({ particleCount: 150, spread: 70 });
        }

        async function claimReward() {
            const points = score * 15; // 15 نقطة لكل إجابة
            const uid = Auth.getUserId();
            if (uid && points > 0) {
                try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(points) }); } catch(e) {}
            }
            window.location.href = 'games.html';
        }
    </script>
</body></html>
