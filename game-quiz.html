<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيد الأسئلة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-l); }
        .quiz-container { background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-xl); max-width: 600px; width: 100%; box-shadow: var(--shadow-card); }
        .header { display: flex; justify-content: space-between; margin-bottom: var(--space-l); color: var(--primary); font-weight: 700; }
        .question { font-size: 1.5rem; color: var(--text-primary); margin-bottom: var(--space-l); text-align: center; }
        .options { display: flex; flex-direction: column; gap: 15px; }
        .option-btn { padding: 15px; background: var(--bg-deep); border: 1px solid var(--border-soft); border-radius: var(--radius-button); color: var(--text-primary); font-size: 1.1rem; cursor: pointer; font-family: var(--font-arabic); text-align: right; transition: 0.2s; }
        .option-btn:hover { border-color: var(--primary); }
        .option-btn.correct { background: rgba(53, 214, 163, 0.2); border-color: var(--accent-green); }
        .option-btn.wrong { background: rgba(255, 107, 107, 0.2); border-color: var(--accent-coral); }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="header">
            <span>السؤال <span id="qNum">1</span>/5</span>
            <span id="scoreDisplay">النقاط: 0</span>
        </div>
        <div class="question" id="questionText">جاري التحميل...</div>
        <div class="options" id="optionsContainer"></div>
    </div>

    <script>
        const questions = [
            { q: "إيه اللغة اللي بنستخدمها لبناء المواقع التفاعلية؟", options: ["Python", "JavaScript", "C++"], a: 1 },
            { q: "إيه الأمر اللي بنستخدمه للطباعة في بايثون؟", options: ["console.log", "cout", "print"], a: 2 },
            { q: "إيه النوع اللي بنستخدمه للأرقام الصحيحة في C++؟", options: ["int", "string", "float"], a: 0 },
            { q: "إيه العلامة اللي بنستخدمها في الضرب؟", options: ["x", "*", "#"], a: 1 },
            { q: "مين الروبوت اللي بيرشدنا في المنصة؟", options: ["كودي", "روبو", "نوفا"], a: 0 }
        ];

        let currentQ = 0;
        let score = 0;

        function loadQuestion() {
            if (currentQ >= questions.length) {
                document.getElementById('questionText').innerText = "أنهيت اللعبة! نقاطك: " + score;
                document.getElementById('optionsContainer').innerHTML = '<a href="games.html" class="btn-primary" style="text-align:center; margin-top:20px;">العودة للألعاب</a>';
                return;
            }
            const q = questions[currentQ];
            document.getElementById('qNum').innerText = currentQ + 1;
            document.getElementById('questionText').innerText = q.q;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn, q.a);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn, correct) {
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if (selected === correct) {
                btn.classList.add('correct');
                score += 20;
                document.getElementById('scoreDisplay').innerText = "النقاط: " + score;
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn')[correct].classList.add('correct');
            }
            setTimeout(() => {
                currentQ++;
                loadQuestion();
            }, 1500);
        }

        loadQuestion();
    </script>
</body>
</html>
