<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>سؤال</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}button{background:#9b59b6;padding:15px;margin:10px;border:none;border-radius:10px;font-family:Cairo;font-weight:bold;cursor:pointer;color:#fff;}</style></head><body><h2 style="color:#9b59b6;">❓ سؤال وجواب</h2><div id="q">جاري التحميل...</div><div id="opts"></div><script>document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){document.getElementById('q').innerText='إيه نوع بيانات true؟';const opts=document.getElementById('opts');['String','Boolean','Number'].forEach(o=>{const b=document.createElement('button');b.innerText=o;b.onclick=()=>check(o);opts.appendChild(b);});}async function check(o){if(o==='Boolean'){alert('صح! ربحت 30 نقطة');const uid=Auth.getUserId();if(uid)await firebase.firestore().collection('users').doc(uid).update({bonusPoints:firebase.firestore.FieldValue.increment(30)});}else alert('غلط!');window.location.href='games.html';}</script></body></html>
