<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سيد الأسئلة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --pop-yellow: #FFD166; --pop-coral: #FF6B6B; --pop-teal: #4ECDC4; --pop-purple: #A78BFA; --pop-dark: #1A1A2E; --pop-white: #F8F9FA; }
    body { font-family: 'Playpen Sans Arabic', sans-serif; background: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; margin: 0; }
    .quiz-box { width: 100%; max-width: 600px; background: var(--pop-white); border: 4px solid var(--pop-dark); border-radius: 24px; padding: 30px; box-shadow: 8px 8px 0 var(--pop-dark); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px dashed #CBD5E1; padding-bottom: 15px; }
    .back-btn { color: var(--pop-dark); text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .stats { display: flex; gap: 15px; font-weight: 800; }
    .timer { color: var(--pop-coral); } .score { color: var(--pop-teal); }
    
    .q-text { font-size: 1.4rem; font-weight: 800; color: var(--pop-dark); margin-bottom: 24px; text-align: center; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { padding: 16px; border-radius: 16px; border: 3px solid var(--pop-dark); background: #fff; font-size: 1.1rem; font-weight: 700; color: var(--pop-dark); cursor: pointer; transition: 0.2s; text-align: right; font-family: 'Playpen Sans Arabic'; }
    .opt-btn:hover { background: var(--pop-yellow); transform: translateY(-2px); box-shadow: 0 4px 0 var(--pop-dark); }
    .opt-btn.correct { background: #D1FAE5; border-color: #10B981; }
    .opt-btn.wrong { background: #FEE2E2; border-color: #EF4444; }
    
    .cody-hint { display: flex; align-items: center; gap: 10px; background: #FEF3C7; border: 3px solid var(--pop-dark); border-radius: 16px; padding: 12px; margin-top: 20px; font-weight: 700; color: #92400E; display: none; }
    .cody-hint img { width: 40px; }
    
    .result { text-align: center; display: none; }
    .btn-restart { background: var(--pop-teal); color: var(--pop-dark); border: 3px solid var(--pop-dark); padding: 14px 30px; border-radius: 16px; font-weight: 800; font-size: 1.2rem; cursor: pointer; margin-top: 20px; box-shadow: 4px 4px 0 var(--pop-dark); font-family: 'Playpen Sans Arabic'; }
  </style>
</head>
<body>
  <div class="quiz-box" id="quizBox">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <div class="stats">
        <div class="timer"><i class="ri-timer-line"></i> <span id="time">15</span></div>
        <div class="score"><i class="ri-trophy-line"></i> <span id="score">0</span></div>
      </div>
    </div>
    <div class="q-text" id="question">جاري التحميل...</div>
    <div class="options" id="options"></div>
    <div class="cody-hint" id="hintBox">
      <span style="font-size: 1.5rem;">🤖</span>
      <span id="hintText"></span>
    </div>
  </div>

  <div class="quiz-box result" id="resultBox">
    <h2 style="color: var(--pop-dark); font-size: 2rem;">انتهى التحدي! 🎉</h2>
    <p style="font-size: 1.5rem; font-weight: 800; color: var(--pop-teal);">النقاط: <span id="finalScore">0</span></p>
    <button class="btn-restart" onclick="location.reload()">العب مرة أخرى</button>
  </div>

  <script>
    const questions = [
      { q: "ما هو الكود الصحيح لطباعة 'مرحباً' في بايثون؟", opts: ["echo 'مرحباً'", "print('مرحباً')", "console.log('مرحباً')"], a: 1, hint: "في بايثون نستخدم دالة الطباعة الشهيرة." },
      { q: "إذا كان لدينا مصفوفة [1, 2, 3] وأردنا الوصول للرقم 2، ماذا نكتب؟", opts: ["array[1]", "array[2]", "array(2)"], a: 0, hint: "الترقيم يبدأ من الصفر في معظم اللغات." },
      { q: "أي من هذه الرموز يستخدم لكتابة تعليق في JavaScript؟", opts: ["#", "//", "<!--"], a: 1, hint: "نفس الرمز المستخدم في C++." },
      { q: "ما هو ناتج الكود: let x = 5; let y = 2; console.log(x * y);", opts: ["7", "10", "52"], a: 1, hint: "العلامة * تعني الضرب." }
    ];
    let curr = 0, score = 0, timeLeft = 15, timerInt;
    const qEl = document.getElementById('question'), optsEl = document.getElementById('options'), timeEl = document.getElementById('time'), scoreEl = document.getElementById('score');

    function loadQ() {
      if (curr >= questions.length) return endGame();
      const q = questions[curr];
      qEl.textContent = q.q;
      optsEl.innerHTML = '';
      document.getElementById('hintBox').style.display = 'none';
      
      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn'; btn.textContent = opt;
        btn.onclick = () => checkAns(i, btn);
        optsEl.appendChild(btn);
      });
      startTimer(q.hint);
    }

    function checkAns(i, btn) {
      clearInterval(timerInt);
      if (i === questions[curr].a) {
        btn.classList.add('correct'); score += 10; scoreEl.textContent = score;
      } else {
        btn.classList.add('wrong');
        optsEl.children[questions[curr].a].classList.add('correct');
        document.getElementById('hintText').textContent = questions[curr].hint;
        document.getElementById('hintBox').style.display = 'flex';
      }
      setTimeout(() => { curr++; loadQ(); }, 2500);
    }

    function startTimer(hint) {
      clearInterval(timerInt); timeLeft = 15; timeEl.textContent = timeLeft;
      timerInt = setInterval(() => {
        timeLeft--; timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInt);
          optsEl.children[questions[curr].a].classList.add('correct');
          document.getElementById('hintText').textContent = hint;
          document.getElementById('hintBox').style.display = 'flex';
          setTimeout(() => { curr++; loadQ(); }, 2500);
        }
      }, 1000);
    }

    function endGame() {
      document.getElementById('quizBox').style.display = 'none';
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('finalScore').textContent = score;
    }
    loadQ();
  </script>
</body>
</html>
