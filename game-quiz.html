<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سيد الأسئلة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .stats { display: flex; gap: 12px; }
    .stat-box { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; font-size: 1rem; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px; }
    .timer { color: var(--red); box-shadow: 0 0 15px rgba(255, 145, 169, 0.1); } 
    .score { color: var(--gold); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); } 
    .combo { color: var(--green); box-shadow: 0 0 15px rgba(118, 233, 192, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--cyan); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); box-shadow: 0 0 20px rgba(118,233,192,0.2); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); box-shadow: 0 0 20px rgba(255,212,138,0.2); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); box-shadow: 0 0 20px rgba(255,145,169,0.2); transform: scale(1.02); }
    .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), #3a7bd5); width: 0%; transition: 0.4s; box-shadow: 0 0 10px var(--cyan); }
    .q-text { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; text-align: center; line-height: 1.6; min-height: 80px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { padding: 18px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); font-size: 1.1rem; font-weight: 700; color: var(--text); cursor: pointer; transition: 0.2s; text-align: right; font-family: 'Cairo'; }
    .opt-btn:hover { background: rgba(107,232,255,0.1); border-color: var(--cyan); transform: translateX(-5px); }
    .opt-btn.correct { background: rgba(118,233,192,0.2); border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(118,233,192,0.2); }
    .opt-btn.wrong { background: rgba(255,145,169,0.2); border-color: var(--red); color: var(--red); }
    .result-box { text-align: center; }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .result-box h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--cyan); }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 20px; }
    .final-score-text { font-size: 1.4rem; font-weight: 900; color: var(--gold); margin-bottom: 25px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="stats">
      <div class="stat-box combo"><i class="ri-fire-fill"></i> <span id="combo">0</span></div>
      <div class="stat-box timer"><i class="ri-timer-line"></i> <span id="time">20</span></div>
      <div class="stat-box score"><i class="ri-trophy-line"></i> <span id="score">0</span></div>
    </div>
  </div>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى التحدي</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>10 أسئلة</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>15 سؤال</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>20 سؤال</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="q-text" id="question">...</div>
      <div class="options" id="options"></div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p class="result-message" id="resultMessage"></p>
      <p class="final-score-text">لقد جمعت <span id="finalScore" style="color: var(--green);">0</span> نقطة.</p>
      <button class="btn-restart" onclick="restartGame()">العب مستوى آخر</button>
      <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
    </div>
  </div>
  <script>
    const questionBank = {
      easy: [
        { q: "ما هي اللغة المستخدمة لتصميم هيكل صفحات الويب؟", opts: ["Python", "HTML", "C++", "Java"], a: 1 },
        { q: "ما هي الدالة المستخدمة للطباعة في بايثون؟", opts: ["console.log()", "print()", "echo()", "write()"], a: 1 },
        { q: "أي من هذه اللغات تستخدم في تنسيق الألوان؟", opts: ["HTML", "CSS", "JS", "SQL"], a: 1 },
        { q: "ماذا تعني كلمة Bug في البرمجة؟", opts: ["لعبة", "خطأ", "ميزة", "كمبيوتر"], a: 1 },
        { q: "ما هو الرمز المستخدم للتعليق في بايثون؟", opts: ["//", "<!--", "#", "**"], a: 2 },
        { q: "ما هي اللغة التي تعمل داخل المتصفح؟", opts: ["Python", "C++", "JavaScript", "Java"], a: 2 },
        { q: "ماذا نسمي البيانات التي نخزنها في متغير؟", opts: ["Value", "Loop", "Function", "Array"], a: 0 },
        { q: "أي من هذه اللغات تستخدم في الذكاء الاصطناعي؟", opts: ["HTML", "CSS", "Python", "SQL"], a: 2 },
        { q: "ما هو العنصر الذي يسمح بتخزين عدة قيم؟", opts: ["Variable", "List", "Function", "Loop"], a: 1 },
        { q: "كيف نكتب تعليق في JavaScript؟", opts: ["#", "//", "<!--", "**"], a: 1 }
      ],
      medium: [
        { q: "ما هو ناتج الكود: let x = 5; let y = 2; console.log(x * y);", opts: ["7", "10", "52", "25"], a: 1 },
        { q: "إذا كان لدينا مصفوفة [1, 2, 3]، ماذا نكتب للوصول للرقم 2؟", opts: ["array[1]", "array[2]", "array(2)", "array{1}"], a: 0 },
        { q: "ما هي الدالة التي تحول النص إلى رقم صحيح في بايثون؟", opts: ["str()", "int()", "float()", "num()"], a: 1 },
        { q: "ما هو الرمز المستخدم للتحقق من التساوي في C++؟", opts: ["=", "==", "===", "!="], a: 1 },
        { q: "في JavaScript، ماذا يعني '===' ؟", opts: ["تساوي القيمة", "تساوي القيمة والنوع", "لا يساوي", "أكبر من"], a: 1 },
        { q: "ما هي الكلمة المفتاحية لتعريف متغير في JS حديثاً؟", opts: ["var", "let", "int", "string"], a: 1 },
        { q: "أي مما يلي لغة برمجة كائنية التوجه (OOP)؟", opts: ["HTML", "CSS", "C++", "SQL"], a: 2 },
        { q: "كيف نكتب حلقة تكرار 'لكل عنصر' في بايثون؟", opts: ["for i in range():", "for i:", "foreach i:", "loop i:"], a: 0 },
        { q: "ما هو الخطأ الذي يسبب توقف البرنامج فجأة؟", opts: ["Syntax Error", "Logic Error", "Runtime Error", "All"], a: 2 },
        { q: "ما هي الدالة المستخدمة لطباعة النص في C++؟", opts: ["print()", "cout", "console.log()", "echo"], a: 1 },
        { q: "ما هي اللغة التي تستخدم في قواعد البيانات؟", opts: ["Python", "C++", "JavaScript", "SQL"], a: 3 },
        { q: "ما هو اسم الدالة التي تنفذ أولاً في بايثون؟", opts: ["main()", "__init__()", "start()", "run()"], a: 0 },
        { q: "كيف نعرف مصفوفة في JavaScript؟", opts: ["[]", "{}", "()", "<>"], a: 0 },
        { q: "ما هي الكلمة المستخدمة لإنهاء الحلقة في بايثون؟", opts: ["stop", "break", "exit", "end"], a: 1 },
        { q: "أي مما يلي يصف HTML بشكل صحيح؟", opts: ["لغة برمجة", "لغة ترميز", "قاعدة بيانات", "نظام تشغيل"], a: 1 }
      ],
      hard: [
        { q: "ما هو ناتج الكود: let x = [1, 2, 3]; x.push(4); console.log(x.length);", opts: ["3", "4", "5", "Error"], a: 1 },
        { q: "ما هو الفرق بين let و const في JS؟", opts: ["لا فرق", "const لا يمكن إعادة تعيينها", "let أسرع", "const أبطأ"], a: 1 },
        { q: "ما هو الـ Closure في JavaScript؟", opts: ["دالة داخل دالة", "حلقة تكرار", "متغير عام", "كائن"], a: 0 },
        { q: "كيف نتعامل مع الاستثناءات في بايثون؟", opts: ["if/else", "try/except", "for/while", "switch/case"], a: 1 },
        { q: "ما هو الـ Pointer في C++؟", opts: ["متغير يخزن عنوان ذاكرة", "دالة", "حلقة", "مصفوفة"], a: 0 },
        { q: "ما هو ناتج الكود: console.log(typeof []);", opts: ["array", "object", "list", "undefined"], a: 1 },
        { q: "ما هو الـ Hoisting في JavaScript؟", opts: ["رفع المتغيرات لأعلى", "حذف المتغيرات", "تعديل المتغيرات", "طباعة المتغيرات"], a: 0 },
        { q: "كيف نحسب طول النص في بايثون؟", opts: ["size()", "len()", "length()", "count()"], a: 1 },
        { q: "ما هو الـ Virtual Function في C++؟", opts: ["دالة وهمية", "دالة يمكن تجاوزها", "دالة ثابتة", "دالة عشوائية"], a: 1 },
        { q: "ما هو ناتج الكود: let a = 10; let b = '10'; console.log(a == b);", opts: ["true", "false", "Error", "undefined"], a: 0 },
        { q: "ما هو الـ Asynchronous في JS؟", opts: ["كود متزامن", "كود غير متزامن", "كود خاطئ", "كود سريع"], a: 1 },
        { q: "كيف نتعامل مع الملفات في بايثون؟", opts: ["open()", "file()", "read()", "write()"], a: 0 },
        { q: "ما هو الـ Constructor في OOP؟", opts: ["دالة بناء", "دالة تدمير", "دالة طباعة", "دالة تحقق"], a: 0 },
        { q: "ما هو الفرق بين == و === في JS؟", opts: ["لا فرق", "=== يقارن النوع والقيمة", "== يقارن النوع", "=== أبطأ"], a: 1 },
        { q: "ما هو الـ Recursion؟", opts: ["حلقة تكرار", "دالة تستدعي نفسها", "متغير", "كائن"], a: 1 },
        { q: "كيف نضيف عنصر لنهاية مصفوفة في JS؟", opts: ["push()", "pop()", "shift()", "unshift()"], a: 0 },
        { q: "ما هو الـ Garbage Collector؟", opts: ["جامع القمامة", "مدير الذاكرة", "محلل الكود", "مترجم"], a: 1 },
        { q: "ما هو ناتج الكود: print(3 // 2) في بايثون؟", opts: ["1.5", "1", "2", "0"], a: 1 },
        { q: "ما هو الـ API؟", opts: ["واجهة برمجة التطبيقات", "لغة برمجة", "قاعدة بيانات", "نظام تشغيل"], a: 0 },
        { q: "ما هو الـ Git؟", opts: ["لغة برمجة", "نظام تحكم في الإصدارات", "قاعدة بيانات", "محرر نصوص"], a: 1 }
      ]
    };
    let currentQs = [], curr = 0, score = 0, timeLeft = 20, timerInt, streak = 0, currentLevel = 'easy';
    const qEl = document.getElementById('question'), optsEl = document.getElementById('options'), timeEl = document.getElementById('time'), scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo'), progressEl = document.getElementById('progress');

    function startGame(level) {
      currentLevel = level;
      let qs = questionBank[level];
      currentQs = qs.sort(() => Math.random() - 0.5).slice(0, (level === 'easy' ? 10 : level === 'medium' ? 15 : 20));
      curr = 0; score = 0; streak = 0; scoreEl.textContent = 0; comboEl.textContent = 0;
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      loadQ();
    }

    function updateGlobalScore(points) {
      let total = parseInt(localStorage.getItem('codyTotalScore')) || 0;
      total += points;
      localStorage.setItem('codyTotalScore', total);
    }

    function loadQ() {
      if (curr >= currentQs.length) return endGame();
      const q = currentQs[curr];
      qEl.textContent = q.q;
      optsEl.innerHTML = '';
      progressEl.style.width = `${(curr / currentQs.length) * 100}%`;
      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAns(i, btn);
        optsEl.appendChild(btn);
      });
      startTimer();
    }

    function checkAns(i, btn) {
      clearInterval(timerInt);
      const correctIndex = currentQs[curr].a;
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      if (i === correctIndex) {
        btn.classList.add('correct');
        streak++;
        let points = 10 + (streak * 2);
        score += points;
        scoreEl.textContent = score;
        comboEl.textContent = streak;
        updateGlobalScore(points);
      } else {
        btn.classList.add('wrong');
        optsEl.children[correctIndex].classList.add('correct');
        streak = 0;
        comboEl.textContent = streak;
      }
      setTimeout(() => { curr++; loadQ(); }, 1500);
    }

    function startTimer() {
      clearInterval(timerInt); timeLeft = 20; timeEl.textContent = timeLeft;
      timerInt = setInterval(() => {
        timeLeft--; timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInt);
          document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          optsEl.children[currentQs[curr].a].classList.add('correct');
          streak = 0; comboEl.textContent = streak;
          setTimeout(() => { curr++; loadQ(); }, 1500);
        }
      }, 1000);
    }

    function endGame() {
      progressEl.style.width = '100%';
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.add('active');
      document.getElementById('finalScore').textContent = score;
      const emoji = document.getElementById('resultEmoji');
      const msg = document.getElementById('resultMessage');
      if (score >= 100) { emoji.textContent = '🏆'; msg.textContent = 'أنت أسطورة! أداء مبهر جداً.'; }
      else if (score >= 50) { emoji.textContent = '🌟'; msg.textContent = 'عمل رائع! يمكنك تحقيق الأفضل.'; }
      else { emoji.textContent = '🚀'; msg.textContent = 'بداية جيدة! استمر في التعلم.'; }
    }

    function restartGame() {
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('levelScreen').classList.add('active');
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(107, 232, 255, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 100);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
