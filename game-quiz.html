<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | سؤال وجواب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;text-align:center;}
.q-box{background:rgba(255,255,255,0.05);padding:20px;border-radius:15px;max-width:400px;margin:20px auto;font-size:18px;border:2px solid #9b59b6;}
button{background:#1e293b;color:#fff;padding:15px;border:none;border-radius:10px;font-family:Cairo;font-size:16px;cursor:pointer;width:100%;margin-top:10px;}
button:hover{background:#9b59b6;}
</style>
</head>
<body>
<h1 style="color:#9b59b6;">❓ سؤال وجواب</h1>
<div class="q-box" id="qText"></div>
<div id="opts" style="max-width:400px;margin:auto;"></div>
<script>
const qs = [
    { q: 'إيه نوع البيانات اللي بيخزن صح/غلط؟', o: ['String', 'Boolean', 'Number'], a: 'Boolean' },
    { q: 'إيه اللي بيعمل تكرار؟', o: ['Loop', 'If', 'Var'], a: 'Loop' },
    { q: 'إيه اللي بيخزن مجموعة قيم؟', o: ['Array', 'String', 'Number'], a: 'Array' }
];
let current = 0, score = 0;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => { if(!logged) window.location.href = 'index.html'; else loadQ(); });
});

function loadQ() {
    if(current >= qs.length) return finishGame();
    const q = qs[current];
    document.getElementById('qText').innerText = q.q;
    const opts = document.getElementById('opts');
    opts.innerHTML = '';
    q.o.forEach(o => {
        const b = document.createElement('button');
        b.innerText = o;
        b.onclick = () => check(o, q.a);
        opts.appendChild(b);
    });
}

function check(sel, correct) {
    if(sel === correct) { score += 30; try { playSound('success'); } catch(e){} }
    else { try { playSound('error'); } catch(e){} }
    current++; loadQ();
}

async function finishGame() {
    try { confetti({ particleCount: 200, spread: 100 }); } catch(e){}
    alert('🎉 مبروك! كسبت ' + score + ' نقطة!');
    const uid = Auth.getUserId();
    if(uid) {
        const ref = firebase.firestore().collection('users').doc(uid).collection('highscores').doc('quiz');
        const doc = await ref.get();
        if(!doc.exists || score > doc.data().score) {
            await ref.set({ score: score });
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(score) });
        }
    }
    setTimeout(() => window.location.href = 'games.html', 1500);
}
</script>
</body></html>
