<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <script src="js/game-store.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سيد الأسئلة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .stats { display: flex; gap: 12px; }
    .stat-box { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; font-size: 1rem; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px; }
    .timer { color: var(--red); box-shadow: 0 0 15px rgba(255, 145, 169, 0.1); } 
    .score { color: var(--gold); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); } 
    .combo { color: var(--green); box-shadow: 0 0 15px rgba(118, 233, 192, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--cyan); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); box-shadow: 0 0 20px rgba(118,233,192,0.2); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); box-shadow: 0 0 20px rgba(255,212,138,0.2); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); box-shadow: 0 0 20px rgba(255,145,169,0.2); transform: scale(1.02); }
    .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), #3a7bd5); width: 0%; transition: 0.4s; box-shadow: 0 0 10px var(--cyan); }
    .q-text { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; text-align: center; line-height: 1.6; min-height: 80px; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { padding: 18px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); font-size: 1.1rem; font-weight: 700; color: var(--text); cursor: pointer; transition: 0.2s; text-align: right; font-family: 'Cairo'; }
    .opt-btn:hover { background: rgba(107,232,255,0.1); border-color: var(--cyan); transform: translateX(-5px); }
    .opt-btn.correct { background: rgba(118,233,192,0.2); border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(118,233,192,0.2); }
    .opt-btn.wrong { background: rgba(255,145,169,0.2); border-color: var(--red); color: var(--red); }
    /* Answered state must stay clearly readable even though the buttons are disabled. */
    body[data-cq-theme="space"] .opt-btn.correct:disabled { opacity: 1 !important; background: #0f6b52 !important; border: 2px solid #8ff5c8 !important; color: #ffffff !important; box-shadow: 0 0 16px rgba(105,229,170,.45) !important; }
    body[data-cq-theme="space"] .opt-btn.wrong:disabled { opacity: 1 !important; background: #7a1f4a !important; border: 2px solid #ffa3c4 !important; color: #ffffff !important; }
    body[data-cq-theme="space"] .opt-btn.correct:disabled::before { content: "✓ "; }
    body[data-cq-theme="space"] .opt-btn.wrong:disabled::before { content: "✕ "; }
    .result-box { text-align: center; }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .result-box h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--cyan); }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 20px; }
    .final-score-text { font-size: 1.4rem; font-weight: 900; color: var(--gold); margin-bottom: 25px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
  
    /* Shared touch-first and reduced-motion refinements */
    button,
    a.back-btn,
    a.btn-back,
    a.btn-restart {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      min-height: 44px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--cyan, #36bfe5);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .level-box {
        width: 100%;
        max-width: 100%;
        padding: clamp(14px, 4vw, 22px) !important;
        border-radius: 18px;
      }

      .lvl-btn {
        width: 100%;
        min-height: 64px;
        gap: 10px;
        justify-content: space-between;
        touch-action: manipulation;
      }

      .back-btn,
      .btn-back,
      .btn-restart {
        min-height: 48px;
      }

      .drop-zone {
        min-height: 132px;
        padding: 14px;
        touch-action: pan-y;
      }
    }

    @media (max-width: 500px) {
      .memory-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

/* CodeQuest 2026 game-wide polish */
:root{color-scheme:dark}body{background-color:#080e1c;background-image:radial-gradient(ellipse at 10% 0%,rgba(75,105,190,.18),transparent 36%),radial-gradient(ellipse at 90% 12%,rgba(27,181,190,.11),transparent 32%),linear-gradient(155deg,#080e1c,#0c1427 58%,#080e1b)!important;background-attachment:fixed}main,.level-box,.game-card,.game-container,.result-box,.panel{border-color:rgba(151,177,218,.19)}button{font-family:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #75e2ef!important;outline-offset:3px!important}button:disabled{cursor:not-allowed;filter:saturate(.65)}.level-box,.game-card,.result-box{box-shadow:0 18px 48px rgba(0,0,0,.22)}.lvl-btn,.btn,.opt-btn,.line,.piece{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.lvl-btn:active,.btn:active,.opt-btn:active,.line:active,.piece:active{transform:scale(.985)}.progress,.timer-bar{overflow:hidden;border-radius:999px}.progress>span,.timer-bar>span{transition:width .25s ease}.result-emoji{filter:drop-shadow(0 8px 18px rgba(111,190,255,.2))}@media(max-width:640px){body{background-attachment:scroll!important}.level-box,.game-card,.result-box{width:min(100%,100%)!important;max-width:100%!important}.actions{gap:10px}.btn-restart,.btn-back{min-height:48px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    .q-code{direction:ltr;text-align:left;unicode-bidi:isolate;white-space:pre-wrap;overflow-wrap:anywhere;font-family:'Fira Code',monospace;font-size:.95em;margin:10px 0 0;padding:12px 14px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(0,0,0,.3);color:#6be8ff}
    @media (max-width:360px){.q-code{font-size:.78em;padding:10px 10px}}
</style>

  <link rel="stylesheet" href="css/codequest-games.css">
  <link rel="stylesheet" href="css/codequest-games-pro.css">

<body class="cq-game-page" data-cq-game="quiz" data-cq-theme="space">
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="stats">
      <div class="stat-box combo"><i class="ri-fire-fill"></i> <small class="stat-label">السلسلة</small> <span id="combo">0</span></div>
      <div class="stat-box timer"><i class="ri-timer-line"></i> <small class="stat-label">الوقت</small> <span id="time">20</span></div>
      <div class="stat-box score"><i class="ri-trophy-line"></i> <small class="stat-label">النقاط</small> <span id="score">0</span></div>
    </div>
  </div>
  <section class="game-art-banner" aria-label="تحدي المعرفة"><img src="assets/games/game-quiz.svg" alt="" decoding="async"></section>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى التحدي</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>10 أسئلة</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>15 سؤال</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>20 سؤال</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="q-text" id="question">...</div>
      <p id="quizLearning" class="cq-learning-feedback" role="status"></p><div class="options" id="options"></div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p class="result-message" id="resultMessage"></p>
      <p class="final-score-text">لقد جمعت <span id="finalScore" style="color: var(--green);">0</span> نقطة.</p>
      <button class="btn-restart" onclick="restartGame()">العب مستوى آخر</button>
      <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
    </div>
  </div>
  <script>
    const questionBank = {
      easy: [
        { q: "ما هي اللغة المستخدمة لتصميم هيكل صفحات الويب؟", opts: ["Python", "HTML", "C++", "Java"], a: 1, why: "HTML لغة ترميز تحدد هيكل الصفحة: العناوين والفقرات والأزرار." },
        { q: "ما هي الدالة المستخدمة للطباعة في بايثون؟", opts: ["console.log()", "print()", "echo()", "write()"], a: 1, why: "في بايثون نطبع على الشاشة بالدالة print(). أما console.log() فهي لـ JavaScript." },
        { q: "أي من هذه اللغات تستخدم في تنسيق الألوان؟", opts: ["HTML", "CSS", "JS", "SQL"], a: 1, why: "CSS تتحكم في شكل الصفحة: الألوان والخطوط والمسافات." },
        { q: "ماذا تعني كلمة Bug في البرمجة؟", opts: ["لعبة", "خطأ", "ميزة", "كمبيوتر"], a: 1, why: "كلمة Bug تعني خطأ في البرنامج يجعله يعمل بشكل غير صحيح." },
        { q: "ما هو الرمز المستخدم للتعليق في بايثون؟", opts: ["//", "<!--", "#", "**"], a: 2, why: "في بايثون يبدأ التعليق بعلامة #. وبايثون يتجاهل ما بعدها في نفس السطر." },
        { q: "أي لغة من الخيارات يدعم المتصفح تشغيلها مباشرة لإضافة التفاعل للصفحة؟", opts: ["Python", "C++", "JavaScript", "Java"], a: 2, why: "المتصفح يشغّل JavaScript مباشرة، ولذلك نستخدمها لإضافة التفاعل للصفحة." },
        { q: "ماذا نسمي البيانات التي نخزنها في متغير؟", opts: ["Value", "Loop", "Function", "Array"], a: 0, why: "القيمة (Value) هي البيانات المخزنة، والمتغير هو الاسم الذي نحفظها به." },
        { q: "أي من هذه اللغات تستخدم في الذكاء الاصطناعي؟", opts: ["HTML", "CSS", "Python", "SQL"], a: 2, why: "بايثون من أكثر اللغات استخدامًا في الذكاء الاصطناعي لأن مكتباتها كثيرة وسهلة." },
        { q: "أي نوع في Python يمثل مجموعة مرتبة قابلة للتعديل من العناصر؟", opts: ["Variable", "List", "Function", "Loop"], a: 1, why: "القائمة List في بايثون مرتبة، ويمكن تعديل عناصرها." },
        { q: "كيف نكتب تعليق في JavaScript؟", opts: ["#", "//", "<!--", "**"], a: 1, why: "في JavaScript يبدأ التعليق في سطر واحد بعلامة //. أما # فهي لبايثون." }
      ],
      medium: [
        { q: "ما هو ناتج الكود: let x = 5; let y = 2; console.log(x * y);", opts: ["7", "10", "52", "25"], a: 1, why: "5 × 2 = 10. العلامة * تضرب الرقمين." },
        { q: "إذا كان لدينا مصفوفة [1, 2, 3]، ماذا نكتب للوصول للرقم 2؟", opts: ["array[1]", "array[2]", "array(2)", "array{1}"], a: 0, why: "الفهرس يبدأ من 0، فالرقم 2 هو العنصر الثاني وفهرسه 1." },
        { q: "ما هي الدالة التي تحول النص إلى رقم صحيح في بايثون؟", opts: ["str()", "int()", "float()", "num()"], a: 1, why: "int() تحوّل النص مثل \"5\" إلى عدد صحيح 5." },
        { q: "ما هو الرمز المستخدم للتحقق من التساوي في C++؟", opts: ["=", "==", "===", "!="], a: 1, why: "في C++ العلامة == تفحص التساوي، أما = فتخزن قيمة في متغير." },
        { q: "في JavaScript، ماذا يعني '===' ؟", opts: ["تساوي القيمة", "تساوي القيمة والنوع", "لا يساوي", "أكبر من"], a: 1, why: "العلامة === تقارن القيمة والنوع معًا، فالرقم 5 والنص \"5\" غير متساويين." },
        { q: "أي كلمة تعرّف متغيرًا قابلًا لإعادة التعيين وله نطاق كتلة في JavaScript؟", opts: ["var", "let", "int", "string"], a: 1, why: "let تعرّف متغيرًا يمكن تغيير قيمته، ونطاقه الكتلة { } الموجود فيها." },
        { q: "أي مما يلي لغة برمجة كائنية التوجه (OOP)؟", opts: ["HTML", "CSS", "C++", "SQL"], a: 2, why: "C++ تدعم البرمجة الكائنية. HTML وCSS للصفحات، وSQL لقواعد البيانات." },
        { q: "كيف نمرّ على كل عنصر في القائمة items في بايثون؟", opts: ["for item in items:", "for items:", "foreach item:", "loop items:"], a: 0, why: "في بايثون نكتب for item in items: وتتكرر الحلقة مرة لكل عنصر." },
        { q: "أي اسم يصف خطأ يحدث أثناء التنفيذ، مثل قراءة متغير غير معرّف في JavaScript؟", opts: ["Syntax Error", "Logic Error", "Runtime Error", "All"], a: 2, why: "الخطأ أثناء التنفيذ (Runtime Error) يظهر والبرنامج يعمل، مثل استخدام متغير غير معرّف." },
        { q: "أي تعبير نستخدمه لإرسال نص إلى المخرجات القياسية في C++؟", opts: ["print()", "std::cout << text", "console.log()", "echo"], a: 1, why: "في C++ نطبع باستخدام std::cout << النص." },
        { q: "ما هي اللغة التي تستخدم في قواعد البيانات؟", opts: ["Python", "C++", "JavaScript", "SQL"], a: 3, why: "SQL لغة مخصصة لقواعد البيانات: قراءة البيانات وإضافتها وتعديلها." },
        { q: "هل تستدعي Python دالة main() تلقائيًا لمجرد تعريفها؟", opts: ["نعم دائمًا", "لا، يجب استدعاؤها", "فقط داخل كلاس", "إذا لم تستقبل معاملات"], a: 1, why: "تعريف الدالة لا يستدعيها. يبدأ الملف بتنفيذ التعليمات الموجودة في مستواه الأعلى." },
        { q: "كيف نعرف مصفوفة في JavaScript؟", opts: ["[]", "{}", "()", "<>"], a: 0, why: "في JavaScript نعرّف المصفوفة بأقواس مربعة، مثل [1, 2, 3]." },
        { q: "ما هي الكلمة المستخدمة لإنهاء الحلقة في بايثون؟", opts: ["stop", "break", "exit", "end"], a: 1, why: "break توقف الحلقة فورًا ويكمل البرنامج بعدها." },
        { q: "أي مما يلي يصف HTML بشكل صحيح؟", opts: ["لغة برمجة", "لغة ترميز", "قاعدة بيانات", "نظام تشغيل"], a: 1, why: "HTML لغة ترميز: تصف محتوى الصفحة وهيكلها، وليست لغة برمجة." }
      ],
      hard: [
        { q: "ما هو ناتج الكود: let x = [1, 2, 3]; x.push(4); console.log(x.length);", opts: ["3", "4", "5", "Error"], a: 1, why: "كانت المصفوفة 3 عناصر، وpush(4) أضافت عنصرًا فأصبح الطول 4." },
        { q: "ما هو الفرق بين let و const في JS؟", opts: ["لا فرق", "const لا يمكن إعادة تعيينها", "let أسرع", "const أبطأ"], a: 1, why: "const لا يمكن إعادة تعيينها بعد أول قيمة، أما let فيمكن تغييرها." },
        { q: "ما هو الـ Closure في JavaScript؟", opts: ["دالة تحتفظ بالوصول إلى نطاقها الخارجي", "حلقة تكرار", "متغير عام فقط", "اسم آخر للمصفوفة"], a: 0, why: "الدالة تتذكر متغيرات النطاق الذي أُنشئت فيه حتى بعد انتهاء ذلك النطاق." },
        { q: "كيف نتعامل مع الاستثناءات في بايثون؟", opts: ["if/else", "try/except", "for/while", "switch/case"], a: 1, why: "نضع الكود المحتمل خطؤه في try، ونعالج الخطأ في except." },
        { q: "ما هو الـ Pointer في C++؟", opts: ["متغير يخزن عنوان ذاكرة", "دالة", "حلقة", "مصفوفة"], a: 0, why: "المؤشر متغير يحفظ عنوان مكان في الذاكرة، لا القيمة نفسها." },
        { q: "ما هو ناتج الكود: console.log(typeof []);", opts: ["array", "object", "list", "undefined"], a: 1, why: "المصفوفة في JavaScript نوعها object، فتعيد typeof القيمة \"object\"." },
        { q: "ما هو الـ Hoisting في JavaScript؟", opts: ["معالجة التصريحات قبل التنفيذ مع اختلاف قواعد الوصول إليها", "نقل سطور الملف فعليًا", "إتاحة let قبل تهيئتها", "طباعة المتغيرات"], a: 0, why: "JavaScript تعالج التصريحات قبل التنفيذ، لكن let وconst لا تُستخدم قبل سطر تعريفها." },
        { q: "كيف نحسب طول النص في بايثون؟", opts: ["size()", "len()", "length()", "count()"], a: 1, why: "len() تعيد عدد حروف النص في بايثون." },
        { q: "ما فائدة virtual عند استدعاء دالة عضو في C++ عبر مؤشر أو مرجع للصنف الأساسي؟", opts: ["منع استدعاء الدالة", "اختيار التنفيذ المعاد تعريفه في الصنف المشتق", "تحويلها إلى دالة ثابتة", "استدعاء دالة عشوائية"], a: 1, why: "virtual تجعل C++ تختار الدالة المعاد تعريفها في الصنف المشتق وقت التشغيل، حتى لو استدعيناها عبر مؤشر للصنف الأساسي." },
        { q: "ما هو ناتج الكود: let a = 10; let b = '10'; console.log(a == b);", opts: ["true", "false", "Error", "undefined"], a: 0, why: "العلامة == تحوّل النوع قبل المقارنة، فالرقم 10 والنص \"10\" متساويان وتعطي true." },
        { q: "ما هو الـ Asynchronous في JS؟", opts: ["كود متزامن", "كود غير متزامن", "كود خاطئ", "كود سريع"], a: 1, why: "الكود غير المتزامن لا ينتظر عملية بطيئة لتنتهي، ويكمل البرنامج عمله." },
        { q: "كيف نتعامل مع الملفات في بايثون؟", opts: ["open()", "file()", "read()", "write()"], a: 0, why: "open() تفتح ملفًا لقراءته أو الكتابة فيه." },
        { q: "ما هو الـ Constructor في OOP؟", opts: ["دالة بناء", "دالة تدمير", "دالة طباعة", "دالة تحقق"], a: 0, why: "الـ Constructor دالة بناء تعمل تلقائيًا عند إنشاء كائن جديد وتجهّز قيمه." },
        { q: "ما هو الفرق بين == و === في JS؟", opts: ["لا فرق", "=== يقارن النوع والقيمة", "== يقارن النوع", "=== أبطأ"], a: 1, why: "=== تقارن القيمة والنوع، أما == فتحوّل النوع قبل المقارنة." },
        { q: "ما هو الـ Recursion؟", opts: ["حلقة تكرار", "دالة تستدعي نفسها", "متغير", "كائن"], a: 1, why: "الدالة التكرارية تستدعي نفسها بمدخل أصغر حتى تصل لحالة توقف." },
        { q: "كيف نضيف عنصر لنهاية مصفوفة في JS؟", opts: ["push()", "pop()", "shift()", "unshift()"], a: 0, why: "push() تضيف عنصرًا في نهاية المصفوفة، وpop() تحذف من النهاية." },
        { q: "ما هو الـ Garbage Collector؟", opts: ["جامع القمامة", "مدير الذاكرة", "محلل الكود", "مترجم"], a: 1, why: "الـ Garbage Collector يدير الذاكرة تلقائيًا بتحرير ما لم يعد البرنامج يستخدمه." },
        { q: "ما هو ناتج الكود: print(3 // 2) في بايثون؟", opts: ["1.5", "1", "2", "0"], a: 1, why: "العلامة // في بايثون قسمة صحيحة: 3 ÷ 2 = 1.5 فيُقرَّب الناتج لأسفل إلى 1." },
        { q: "ما هو الـ API؟", opts: ["واجهة برمجة التطبيقات", "لغة برمجة", "قاعدة بيانات", "نظام تشغيل"], a: 0, why: "الـ API واجهة تسمح لبرنامج بطلب خدمة أو بيانات من برنامج آخر." },
        { q: "ما هو الـ Git؟", opts: ["لغة برمجة", "نظام تحكم في الإصدارات", "قاعدة بيانات", "محرر نصوص"], a: 1, why: "Git نظام تحكم في الإصدارات: يحفظ تاريخ تغييرات الكود ويسمح بالرجوع إليه." }
      ]
    };
    let optionOrder = [];
    let currentQs = [], curr = 0, score = 0, timeLeft = 20, timerInt, streak = 0, currentLevel = 'easy', answerLocked = false;
    const qEl = document.getElementById('question'), optsEl = document.getElementById('options'), timeEl = document.getElementById('time'), scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo'), progressEl = document.getElementById('progress');

    // Multi-statement code in a question goes in its own left-to-right block, one statement per line, so it never wraps inside the Arabic sentence.
    function renderQuestion(el, text) {
      const m = /^(ما هو ناتج الكود:)\s*([^;]+;\s.*;)\s*$/.exec(String(text));
      if (!m) { setBidiText(el, text); return; }
      el.textContent = '';
      const lead = document.createElement('div'); lead.textContent = m[1]; el.appendChild(lead);
      const pre = document.createElement('pre'); pre.className = 'q-code'; pre.dir = 'ltr';
      pre.textContent = m[2].split(/;\s+/).map((x, i, a) => i < a.length - 1 ? x + ';' : x).join('\n');
      el.appendChild(pre);
    }
    // Show Latin runs (C++, console.log(), code) left-to-right inside Arabic text. Each run is wrapped in an
    // isolated LTR span built with createElement/textContent, so the text is never parsed as HTML and
    // textContent stays identical to the original string.
    function setBidiText(el, text) {
      el.textContent = '';
      const parts = String(text).split(/([\x21-\x7E](?:[\x20-\x7E]*[\x21-\x7E])?)/);
      parts.forEach((part, i) => {
        if (!part) return;
        if (i % 2 === 1) {
          // Sentence punctuation around a code run belongs to the Arabic sentence: keep it outside the LTR isolate; textContent stays identical to the original string.
          // Peel only punctuation that sits between Arabic text and the code run; code that starts or ends the string (for example "!=" or "for x in y:") stays whole.
          const hasBefore = i > 0 && parts[i - 1], hasAfter = i < parts.length - 1 && parts[i + 1];
          const lead = hasBefore ? part.match(/^[\s:]*/)[0] : '', rest = part.slice(lead.length), trail = hasAfter ? (rest.match(/[\s.,:;]*$/) || [''])[0] : '', value = rest.slice(0, rest.length - trail.length);
          if (!value) { el.appendChild(document.createTextNode(part)); return; }
          if (lead) el.appendChild(document.createTextNode(lead));
          const span = document.createElement('span'); span.dir = 'ltr'; span.style.unicodeBidi = 'isolate'; span.textContent = value; el.appendChild(span);
          if (trail) el.appendChild(document.createTextNode(trail));
        }
        else el.appendChild(document.createTextNode(part));
      });
    }
    // Feedback prose: only code-like words are isolated left-to-right, so punctuation between Arabic and code stays in Arabic order.
    function setFeedback(el, lead, answer, reason) {
      el.textContent = '';
      const add = t => String(t).split(/([A-Za-z0-9_][\x20-\x7E]*?[A-Za-z0-9_)\]}>])(?![A-Za-z0-9_])/).forEach((part, i) => {
        if (!part) return;
        if (i % 2 === 1) { const sp = document.createElement('span'); sp.dir = 'ltr'; sp.style.unicodeBidi = 'isolate'; sp.textContent = part; el.appendChild(sp); }
        else el.appendChild(document.createTextNode(part));
      });
      add(lead + ' '); const a = document.createElement('bdi'); a.dir = 'auto'; a.style.unicodeBidi = 'isolate'; a.textContent = answer; el.appendChild(a); add('. ' + (reason || ''));
    }
    function shuffleQuestions(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function startGame(level) {
      currentLevel = level;
      const qs = questionBank[level];
      currentQs = shuffleQuestions(qs).slice(0, (level === 'easy' ? 10 : level === 'medium' ? 15 : 20));
      curr = 0; score = 0; streak = 0; answerLocked = false; scoreEl.textContent = 0; comboEl.textContent = 0;
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      loadQ();
    }

    function updateGlobalScore(points) {
      let total = parseInt(CQGameStore.get('codyTotalScore')) || 0;
      total += points;
      CQGameStore.set('codyTotalScore', total);
      window.CodeQuestExperience?.collectible({ label: "+" + points + " نقطة" });
    }

    function loadQ() {
      if (curr >= currentQs.length) return endGame();
      const q = currentQs[curr];
      renderQuestion(qEl, q.q);
      optsEl.innerHTML = '';
      progressEl.style.width = `${(curr / currentQs.length) * 100}%`;
      progressEl.setAttribute('aria-label',`السؤال ${curr+1} من ${currentQs.length}`);
      progressEl.parentElement.setAttribute('aria-valuenow', String(curr + 1));
      progressEl.parentElement.setAttribute('aria-valuemax', String(currentQs.length));
      // Show the options in a random order. optionOrder[position] is the original option index,
      // so the correct answer is identified by its original index, never by screen position.
      optionOrder = shuffleQuestions(q.opts.map((_, index) => index));
      optionOrder.forEach((originalIndex, position) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        setBidiText(btn, q.opts[originalIndex]);
        btn.onclick = () => checkAns(position, btn);
        optsEl.appendChild(btn);
      });
      document.getElementById('quizLearning').textContent='';
      startTimer();
    }

    function checkAns(i, btn) {
      if (answerLocked) return;
      answerLocked = true;
      clearInterval(timerInt);
      const correctIndex = optionOrder.indexOf(currentQs[curr].a);
      const chosenOriginal = optionOrder[i];
      const feedback=document.getElementById('quizLearning');
      setFeedback(feedback, 'الإجابة الصحيحة:', currentQs[curr].opts[currentQs[curr].a], currentQs[curr].why);
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      if (chosenOriginal === currentQs[curr].a) {
        btn.classList.add('correct');
        streak++;
        let points = 10 + (streak * 2);
        score += points;
        scoreEl.textContent = score;
        comboEl.textContent = streak;
        updateGlobalScore(points);
      } else {
        btn.classList.add('wrong');
        optsEl.children[correctIndex].classList.add('correct');
        streak = 0;
        comboEl.textContent = streak;
      }
      setTimeout(() => { curr++; answerLocked = false; loadQ(); }, 1700);
    }

    function startTimer(reset = true) {
      clearInterval(timerInt);
      if (reset) timeLeft = 20;
      timeEl.textContent = timeLeft;
      if (document.hidden || answerLocked) return;
      timerInt = setInterval(() => {
        timeLeft--; timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          if (answerLocked) return;
          answerLocked = true;
          clearInterval(timerInt);
          document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          optsEl.children[optionOrder.indexOf(currentQs[curr].a)].classList.add('correct');
          setFeedback(document.getElementById('quizLearning'), 'انتهى الوقت. الإجابة الصحيحة:', currentQs[curr].opts[currentQs[curr].a], currentQs[curr].why);
          streak = 0; comboEl.textContent = streak;
          setTimeout(() => { curr++; answerLocked = false; loadQ(); }, 1700);
        }
      }, 1000);
    }

    function endGame() {
      progressEl.style.width = '100%';
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.add('active');
      document.getElementById('finalScore').textContent = score;
      const emoji = document.getElementById('resultEmoji');
      const msg = document.getElementById('resultMessage');
      // Same thresholds as the stars in js/game-levels.js: 80% / 50% / 20% of the best possible streak score.
      let bestPossible = 0; for (let k = 1; k <= currentQs.length; k++) bestPossible += 10 + 2 * k;
      const quizRatio = score / bestPossible;
      if (quizRatio >= 0.8) { emoji.textContent = '🏆'; msg.textContent = 'أنت أسطورة! أداء مبهر جداً. حصلت على 3 نجوم.'; }
      else if (quizRatio >= 0.5) { emoji.textContent = '🌟'; msg.textContent = 'عمل رائع! حصلت على نجمتين. حاول مرة أخرى للحصول على 3.'; }
      else if (quizRatio >= 0.2) { emoji.textContent = '🚀'; msg.textContent = 'بداية جيدة! حصلت على نجمة وفتحت المستوى التالي. استمر في التعلم.'; }
      else { emoji.textContent = '🚀'; msg.textContent = 'لم تحصل على نجمة هذه المرة. أجب بشكل صحيح وبسلسلة أطول لفتح المستوى التالي، وحاول مرة أخرى.'; }
      if (quizRatio >= 0.2) window.CodeQuestExperience?.reward({ gems: 0, title: 'تحدي مكتمل!', message: 'أداء رائع! كودي بيحتفل بتقدمك.' });
    }

    function restartGame() {
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('levelScreen').classList.add('active');
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(107, 232, 255, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    let matrixTimer = null;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function startMatrix(){ if(reducedMotion || matrixTimer || document.hidden) return; matrixTimer = setInterval(draw, 120); }
    function stopMatrix(){ if(matrixTimer){ clearInterval(matrixTimer); matrixTimer = null; } }
    startMatrix();
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearInterval(timerInt);stopMatrix();}
      else {if(document.getElementById('gameScreen').classList.contains('active')&&!answerLocked)startTimer(false);startMatrix();}
    });
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
