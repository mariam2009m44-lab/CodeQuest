<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي السرعة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { font-family: 'Playpen Sans Arabic', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); padding: 20px; }
    .game-box { width: 100%; max-width: 500px; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .back-btn { color: var(--muted); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: var(--gold); }
    .timer-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
    .timer-fill { height: 100%; background: var(--gold); width: 100%; transition: width 0.1s linear; }
    .question-box { min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }
    .question-box h2 { font-size: 1.6rem; color: var(--text); font-weight: 800; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-ans { padding: 20px; border-radius: var(--radius-md); font-size: 1.3rem; font-weight: 900; border: 2px solid transparent; cursor: pointer; transition: 0.2s; font-family: 'Playpen Sans Arabic'; }
    .btn-true { background: rgba(118,233,192,0.1); color: var(--green); border-color: var(--green); }
    .btn-true:hover { background: var(--green); color: var(--bg-deep); }
    .btn-false { background: rgba(255,145,169,0.1); color: var(--red); border-color: var(--red); }
    .btn-false:hover { background: var(--red); color: var(--bg-deep); }
    .score-display { font-size: 1.2rem; font-weight: 800; color: var(--gold); margin-top: 20px; }
    .result-screen { display: none; }
    .result-screen h2 { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }
    .result-screen p { color: var(--muted); font-size: 1.2rem; margin-bottom: 20px; }
    .btn-restart { background: var(--gold); color: var(--bg-deep); padding: 15px 30px; border-radius: var(--radius-md); font-weight: 900; font-size: 1.1rem; border: none; cursor: pointer; width: 100%; font-family: 'Playpen Sans Arabic'; }
  </style>
</head>
<body>
  <div class="game-box" id="gameUI">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <span style="font-weight: 800; color: var(--gold);"><i class="ri-flashlight-fill"></i> السرعة</span>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="question-box"><h2 id="questionText">هل Python هي لغة برمجة؟</h2></div>
    <div class="actions">
      <button class="btn-ans btn-true" onclick="answer(true)">صح</button>
      <button class="btn-ans btn-false" onclick="answer(false)">خطأ</button>
    </div>
    <div class="score-display">النقاط: <span id="score">0</span></div>
  </div>

  <div class="game-box result-screen" id="resultUI">
    <h2>انتهى الوقت!</h2>
    <p>لقد جمعت <strong id="finalScore">0</strong> نقطة.</p>
    <button class="btn-restart" onclick="location.reload()">العب مرة أخرى</button>
  </div>

  <script>
    const questions = [
      { q: "هل HTML تستخدم لتصميم صفحات الويب؟", a: true },
      { q: "هل JavaScript لغة برمجة؟", a: true },
      { q: "هل C++ لغة سهلة للمبتدئين؟", a: false },
      { q: "هل يمكن استخدام Python في الذكاء الاصطناعي؟", a: true },
      { q: "هل CSS تستخدم للتفاعل مع الأزرار؟", a: false },
      { q: "هل print() تستخدم للطباعة في بايثون؟", a: true },
      { q: "هل console.log() تستخدم في C++؟", a: false },
      { q: "هل الأكواد تكتب باللغة العربية؟", a: false }
    ];

    let currentQ = 0, score = 0, timeLeft = 100;
    let timerInterval;
    const totalTime = 100;

    function loadQuestion() {
      if (currentQ >= questions.length) { endGame(); return; }
      document.getElementById('questionText').textContent = questions[currentQ].q;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft -= 1;
        document.getElementById('timerFill').style.width = `${(timeLeft / totalTime) * 100}%`;
        if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); }
      }, 100);
    }

    function answer(choice) {
      if (choice === questions[currentQ].a) {
        score += 10;
        document.getElementById('score').textContent = score;
      }
      currentQ++;
      loadQuestion();
    }

    function endGame() {
      clearInterval(timerInterval);
      document.getElementById('gameUI').style.display = 'none';
      document.getElementById('resultUI').style.display = 'block';
      document.getElementById('finalScore').textContent = score;
    }

    loadQuestion();
    startTimer();
  </script>
</body>
</html>
