<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | تحدي السرعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;text-align:center;}
.timer{width:100%;height:10px;background:#333;border-radius:10px;margin:20px auto;max-width:400px;overflow:hidden;}
.fill{height:100%;background:#e74c3c;width:100%;transition:width 0.1s linear;}
.q-box{background:rgba(255,255,255,0.05);padding:20px;border-radius:15px;max-width:400px;margin:auto;font-size:20px;font-weight:bold;border:2px solid #00e5ff;}
.opts{display:grid;gap:10px;max-width:400px;margin:20px auto;}
button{background:#1e293b;color:#fff;padding:15px;border:none;border-radius:10px;font-family:Cairo;font-size:16px;cursor:pointer;}
button:hover{background:#00e5ff;color:#000;}
</style>
</head>
<body>
<h1 style="color:#ffd700;">⚡ تحدي السرعة</h1>
<div class="timer"><div class="fill" id="fill"></div></div>
<div class="q-box" id="qText">جاري التحميل...</div>
<div class="opts" id="opts"></div>
<script>
const qs = [
    { q: 'إيه ناتج 5+5؟', o: ['10', '12', '8'], a: '10' },
    { q: 'إيه لون JavaScript؟', o: ['أصفر', 'أزرق', 'أحمر'], a: 'أصفر' },
    { q: 'إيه رمز الطباعة؟', o: ['print', 'console.log', 'echo'], a: 'console.log' },
    { q: 'إيه ناتج 10-4؟', o: ['6', '8', '4'], a: '6' },
    { q: 'إيه لغة الذكاء الاصطناعي؟', o: ['Python', 'HTML', 'C++'], a: 'Python' }
];
let current = 0, score = 0, time = 100, timer;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => { if(!logged) window.location.href = 'index.html'; else loadQ(); });
});

function loadQ() {
    if(current >= qs.length) return finishGame();
    const q = qs[current];
    document.getElementById('qText').innerText = q.q;
    const opts = document.getElementById('opts');
    opts.innerHTML = '';
    q.o.forEach(o => {
        const b = document.createElement('button');
        b.innerText = o;
        b.onclick = () => check(b, o, q.a);
        opts.appendChild(b);
    });
    time = 100;
    document.getElementById('fill').style.width = '100%';
    clearInterval(timer);
    timer = setInterval(() => {
        time -= 2;
        document.getElementById('fill').style.width = time + '%';
        if(time <= 0) { clearInterval(timer); check(null, '', q.a); }
    }, 100);
}

function check(btn, sel, correct) {
    clearInterval(timer);
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    if(sel === correct) { score += 20; try { playSound('success'); } catch(e){} }
    else { try { playSound('error'); } catch(e){} }
    setTimeout(() => { current++; loadQ(); }, 1000);
}

async function finishGame() {
    try { confetti({ particleCount: 200, spread: 100 }); } catch(e){}
    alert('🎉 مبروك! كسبت ' + score + ' نقطة!');
    const uid = Auth.getUserId();
    if(uid) {
        const ref = firebase.firestore().collection('users').doc(uid).collection('highscores').doc('speed');
        const doc = await ref.get();
        if(!doc.exists || score > doc.data().score) {
            await ref.set({ score: score });
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(score) });
        }
    }
    setTimeout(() => window.location.href = 'games.html', 1500);
}
</script>
</body></html>
