<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي السرعة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --pop-yellow: #FFD166; --pop-coral: #FF6B6B; --pop-teal: #4ECDC4; --pop-dark: #1A1A2E; --pop-white: #F8F9FA; }
    body { font-family: 'Playpen Sans Arabic', sans-serif; background: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; margin: 0; }
    .game-box { width: 100%; max-width: 500px; background: var(--pop-white); border: 4px solid var(--pop-dark); border-radius: 24px; padding: 30px; box-shadow: 8px 8px 0 var(--pop-dark); text-align: center; }
    .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { color: var(--pop-dark); text-decoration: none; font-weight: 800; }
    .timer-bar { width: 100%; height: 15px; background: #E2E8F0; border: 3px solid var(--pop-dark); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
    .fill { height: 100%; background: var(--pop-yellow); width: 100%; transition: width 0.1s linear; }
    .question { font-size: 1.5rem; font-weight: 800; color: var(--pop-dark); margin-bottom: 30px; min-height: 80px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { padding: 20px; font-size: 1.3rem; font-weight: 800; border: 3px solid var(--pop-dark); border-radius: 16px; cursor: pointer; font-family: 'Playpen Sans Arabic'; transition: 0.2s; box-shadow: 3px 3px 0 var(--pop-dark); }
    .btn-true { background: var(--pop-teal); color: var(--pop-dark); }
    .btn-false { background: var(--pop-coral); color: #fff; }
    .btn:hover { transform: translateY(-2px); }
    .score { font-size: 1.3rem; font-weight: 800; color: var(--pop-dark); margin-top: 20px; }
    .result { display: none; }
    .btn-restart { background: var(--pop-yellow); color: var(--pop-dark); border: 3px solid var(--pop-dark); padding: 15px; border-radius: 16px; font-weight: 800; font-size: 1.2rem; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 4px 4px 0 var(--pop-dark); font-family: 'Playpen Sans Arabic'; }
  </style>
</head>
<body>
  <div class="game-box" id="gameUI">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <h2 style="color: var(--pop-dark); margin: 0;">السرعة ⚡</h2>
    </div>
    <div class="timer-bar"><div class="fill" id="fill"></div></div>
    <div class="question" id="qText">هل HTML هي لغة برمجة؟</div>
    <div class="actions">
      <button class="btn btn-true" onclick="ans(true)">صح</button>
      <button class="btn btn-false" onclick="ans(false)">خطأ</button>
    </div>
    <div class="score">النقاط: <span id="score">0</span></div>
  </div>

  <div class="game-box result" id="resultUI">
    <h2 style="color: var(--pop-dark);">انتهى الوقت! ⏰</h2>
    <p style="font-weight: 800; font-size: 1.2rem; color: var(--pop-teal);">نقاطك: <span id="final">0</span></p>
    <button class="btn-restart" onclick="location.reload()">العب مجدداً</button>
  </div>

  <script>
    const qs = [
      { q: "هل HTML هي لغة برمجة؟", a: false },
      { q: "هل نستخدم print() في بايثون للطباعة؟", a: true },
      { q: "هل CSS تستخدم للتفاعل مع الأزرار؟", a: false },
      { q: "هل C++ لغة سريعة؟", a: true },
      { q: "هل console.log() تستخدم في JavaScript؟", a: true },
      { q: "هل يمكن استخدام Python في الذكاء الاصطناعي؟", a: true }
    ];
    let curr = 0, score = 0, time = 100, int;
    const fill = document.getElementById('fill'), qText = document.getElementById('qText'), scoreEl = document.getElementById('score');
    
    function load() {
      if (curr >= qs.length) return end();
      qText.textContent = qs[curr].q;
    }
    
    function ans(choice) {
      if (choice === qs[curr].a) { score += 10; scoreEl.textContent = score; }
      curr++; load();
    }
    
    function startTimer() {
      int = setInterval(() => {
        time -= 1; fill.style.width = `${(time/100)*100}%`;
        if (time <= 0) end();
      }, 100);
    }
    
    function end() {
      clearInterval(int);
      document.getElementById('gameUI').style.display = 'none';
      document.getElementById('resultUI').style.display = 'block';
      document.getElementById('final').textContent = score;
    }
    
    load(); startTimer();
  </script>
</body>
</html>
