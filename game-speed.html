<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي السرعة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); }
        .header h1 { margin: 0; font-size: 1.3rem; color: #8b5cf6; }
        .btn-back { background: rgba(139,92,246,0.1); border: 1px solid #8b5cf6; color: #8b5cf6; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .timer { font-size: 2rem; font-weight: bold; color: #ff4444; text-shadow: 0 0 10px rgba(255,68,68,0.5); }
        .question-box { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; width: 100%; }
        .question-text { font-size: 1.5rem; margin-bottom: 20px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .option-btn { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 10px; font-family: 'Cairo'; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: rgba(139,92,246,0.2); border-color: #8b5cf6; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,9,20,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid #ffd700; padding: 40px; border-radius: 30px; text-align: center; }
        .btn-claim { background: #8b5cf6; color: #fff; padding: 15px 40px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 15px; }
    </style>
</head><body>
    <div class="header"><a href="games.html" class="btn-back">← رجوع</a><h1>⚡ تحدي السرعة</h1><div style="width: 70px;"></div></div>
    <div class="game-area">
        <div class="timer" id="timer">15</div>
        <div class="question-box">
            <div class="question-text" id="question">جاري التحميل...</div>
            <div class="options" id="options"></div>
        </div>
    </div>
    <div class="modal" id="resultModal"><div class="modal-content">
        <h2 style="color: #ffd700;">انتهى الوقت!</h2>
        <p style="font-size: 1.5rem;">نتيجتك: <span id="finalScore" style="color: #00e5ff; font-weight: bold;">0</span> إجابة صحيحة</p>
        <button class="btn-claim" onclick="claimReward()">احصل على النقاط</button>
    </div></div>

    <script>
        const questions = [
            { q: "ناتج 5 + 3 هو:", options: ["7", "8", "9", "10"], correct: 1 },
            { q: "أي مما يلي يُستخدم لتعريف متغير في JavaScript؟", options: ["var", "int", "def", "let"], correct: 3 },
            { q: "ناتج 'Hello' + ' World' هو:", options: ["Hello World", "HelloWorld", "Error", "None"], correct: 0 },
            { q: "ما هي الدالة التي تطبع في الشاشة؟", options: ["print()", "console.log()", "echo", "cout"], correct: 1 },
            { q: "حلقة التكرار في JavaScript تبدأ بـ:", options: ["loop", "repeat", "for", "while only"], correct: 2 }
        ];
        
        let currentQ = 0, score = 0, timeLeft = 15, timerInterval;

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((l) => { if(!l) window.location.href='index.html'; else startGame(); });
        });

        function startGame() {
            currentQ = 0; score = 0; timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            showQuestion();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) endGame();
            }, 1000);
        }

        function showQuestion() {
            if(currentQ >= questions.length) { endGame(); return; }
            const q = questions[currentQ];
            document.getElementById('question').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                optDiv.appendChild(btn);
            });
        }

        function checkAnswer(idx) {
            if(idx === questions[currentQ].correct) score++;
            currentQ++;
            if(currentQ < questions.length) showQuestion();
            else endGame();
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('finalScore').innerText = score;
            document.getElementById('resultModal').classList.add('active');
            if(score > 0) confetti({ particleCount: score * 50, spread: 70 });
        }

        async function claimReward() {
            const points = score * 10; // 10 نقاط لكل إجابة صحيحة
            const uid = Auth.getUserId();
            if (uid && points > 0) {
                try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(points) }); } catch(e) {}
            }
            window.location.href = 'games.html';
        }
    </script>
</body></html>
