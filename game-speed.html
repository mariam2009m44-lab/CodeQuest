<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي السرعة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --surface: #0a0f1e; --glass: rgba(13, 20, 40, 0.8); --border: rgba(255, 212, 138, 0.2); --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; --text: #ffffff; --muted: #8892b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 100%, rgba(255, 212, 138, 0.1), transparent 50%); }
    .screen { display: none; width: 100%; max-width: 500px; }
    .screen.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 40px 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
    .level-box h2 { font-size: 2rem; margin-bottom: 30px; color: var(--gold); }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 20px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: transparent; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118, 233, 192, 0.1); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255, 212, 138, 0.1); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255, 145, 169, 0.1); transform: scale(1.02); }
    .game-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 25px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .back-btn { color: var(--muted); text-decoration: none; font-weight: 800; cursor: pointer; background: none; border: none; font-family: 'Cairo'; font-size: 1rem; }
    .back-btn:hover { color: var(--gold); }
    .score-board { font-weight: 900; font-size: 1.2rem; color: var(--gold); }
    .timer-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
    .fill { height: 100%; background: var(--gold); width: 100%; transition: width 0.1s linear; box-shadow: 0 0 10px var(--gold); }
    .question { font-size: 1.5rem; font-weight: 900; margin-bottom: 30px; min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { padding: 20px; font-size: 1.3rem; font-weight: 900; border: 2px solid transparent; border-radius: 16px; cursor: pointer; font-family: 'Cairo'; transition: 0.2s; }
    .btn-true { background: rgba(118,233,192,0.1); color: var(--green); border-color: var(--green); }
    .btn-true:hover { background: var(--green); color: #000; }
    .btn-false { background: rgba(255,145,169,0.1); color: var(--red); border-color: var(--red); }
    .btn-false:hover { background: var(--red); color: #000; }
    .result-box h2 { color: var(--gold); font-size: 2rem; margin-bottom: 10px; }
    .result-box p { color: var(--muted); font-size: 1.2rem; margin-bottom: 25px; }
    .btn-restart { background: var(--gold); color: #000; border: none; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 1.2rem; cursor: pointer; width: 100%; font-family: 'Cairo'; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--gold); transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى السرعة</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>10 أسئلة | 30 ثانية</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>15 سؤال | 40 ثانية</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>20 سؤال | 50 ثانية</span></button>
      </div>
      <a href="games.html" class="back-btn" style="display:block; margin-top:20px;"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="game-box">
      <div class="header">
        <button class="back-btn" onclick="location.reload()"><i class="ri-arrow-right-line"></i> خروج</button>
        <div class="score-board">النقاط: <span id="score">0</span></div>
      </div>
      <div class="timer-bar"><div class="fill" id="fill"></div></div>
      <div class="question" id="qText">...</div>
      <div class="actions">
        <button class="btn btn-true" onclick="ans(true)">صح</button>
        <button class="btn btn-false" onclick="ans(false)">خطأ</button>
      </div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <h2>انتهى الوقت! ⏰</h2>
      <p>لقد جمعت <strong id="final" style="color: var(--green); font-size: 1.8rem;">0</strong> نقطة.</p>
      <button class="btn-restart" onclick="restartGame()">العب مجدداً</button>
    </div>
  </div>
  <script>
    const allQs = [
      { q: "هل HTML هي لغة برمجة؟", a: false },
      { q: "هل نستخدم print() في بايثون للطباعة؟", a: true },
      { q: "هل CSS تستخدم للتفاعل مع الأزرار؟", a: false },
      { q: "هل C++ لغة سريعة؟", a: true },
      { q: "هل console.log() تستخدم في JavaScript؟", a: true },
      { q: "هل يمكن استخدام Python في الذكاء الاصطناعي؟", a: true },
      { q: "هل المتغيرات يمكن أن تبدأ برقم؟", a: false },
      { q: "هل # تستخدم للتعليق في بايثون؟", a: true },
      { q: "هل // تستخدم للتعليق في C++؟", a: true },
      { q: "هل يمكن كتابة كود HTML داخل ملف JavaScript؟", a: false },
      { q: "هل JS تستخدم لبناء الواجهات الأمامية؟", a: true },
      { q: "هل Python أسرع من C++؟", a: false },
      { q: "هل SQL تستخدم في قواعد البيانات؟", a: true },
      { q: "هل يمكن استخدام CSS في الطباعة؟", a: true },
      { q: "هل Git هو لغة برمجة؟", a: false },
      { q: "هل API تعني واجهة برمجة التطبيقات؟", a: true },
      { q: "هل الـ Loop هو حلقة تكرار؟", a: true },
      { q: "هل الـ Array يخزن قيمة واحدة فقط؟", a: false },
      { q: "هل يمكن استخدام دالة كمتغير؟", a: true },
      { q: "هل OOP تعني البرمجة الكائنية؟", a: true }
    ];
    let curr = 0, score = 0, time = 100, int, currentLevelQs = [], currentLevel = 'easy';
    const fill = document.getElementById('fill'), qText = document.getElementById('qText'), scoreEl = document.getElementById('score');
    function updateGlobalScore(points) { let total = parseInt(localStorage.getItem('codyTotalScore')) || 0; total += points; localStorage.setItem('codyTotalScore', total); }
    function startGame(level) {
      currentLevel = level; document.getElementById('levelScreen').classList.remove('active'); document.getElementById('gameScreen').classList.add('active');
      let count = level === 'easy' ? 10 : level === 'medium' ? 15 : 20;
      let timePerQ = level === 'easy' ? 30 : level === 'medium' ? 40 : 50;
      time = timePerQ * 10; currentLevelQs = allQs.sort(() => Math.random() - 0.5).slice(0, count);
      curr = 0; score = 0; scoreEl.textContent = score; load(); startTimer();
    }
    function load() { if (curr >= currentLevelQs.length) return end(); qText.textContent = currentLevelQs[curr].q; }
    function ans(choice) {
      if (choice === currentLevelQs[curr].a) { score += 10; scoreEl.textContent = score; updateGlobalScore(10); }
      curr++; load();
    }
    function startTimer() { int = setInterval(() => { time -= 1; fill.style.width = `${(time/100)*100}%`; if (time <= 0) end(); }, 100); }
    function end() {
      clearInterval(int);
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.add('active');
      document.getElementById('final').textContent = score;
    }
    function restartGame() { startGame(currentLevel); }
  </script>
</body>
</html>
