
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050810">
  <title>الامتحان الشامل | CodeQuest</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg: #050810;
      --glass: rgba(15, 23, 42, 0.8);
      --border: rgba(255,255,255,0.1);
      --text: #fff;
      --muted: #94a3b8;
      --cyan: #6be8ff;
      --green: #76e9c0;
      --red: #ff91a9;
      --gold: #ffd48a;
      --purple: #a99aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 0%, rgba(169,154,255,0.1), transparent 60%);
    }
    .exam-container {
      width: 100%;
      max-width: 800px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px;
      backdrop-filter: blur(20px);
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 {
      font-size: 2rem;
      color: var(--purple);
      font-weight: 900;
      margin-bottom: 10px;
    }
    .header p { color: var(--muted); line-height: 1.8; }
    .notice {
      margin: 18px 0;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      line-height: 1.8;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      width: 0%;
      transition: width 0.3s;
    }
    .question-box { display: none; flex-direction: column; gap: 20px; }
    .question-box.active { display: flex; animation: fadeIn 0.4s ease; }
    .q-text { font-size: 1.3rem; font-weight: 800; line-height: 1.8; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 16px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      text-align: right;
      transition: 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: rgba(169,154,255,0.1);
      border-color: var(--purple);
    }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct {
      background: rgba(118,233,192,0.2);
      border-color: var(--green);
      color: var(--green);
    }
    .opt-btn.wrong {
      background: rgba(255,145,169,0.2);
      border-color: var(--red);
      color: var(--red);
    }
    .result-box { display: none; text-align: center; }
    .result-box.active { display: block; animation: fadeIn 0.4s ease; }
    .result-box h2 { font-size: 2rem; color: var(--gold); margin-bottom: 15px; }
    .result-box p { color: var(--muted); line-height: 1.9; }
    .btn-finish {
      background: var(--purple);
      color: #000;
      padding: 13px 25px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      text-decoration: none;
      display: inline-block;
      margin: 10px 5px 0;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    #statusMessage { text-align: center; padding: 25px; line-height: 1.9; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      .exam-container { padding: 22px; }
      .header h1 { font-size: 1.55rem; }
      .q-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main class="exam-container">
    <header class="header">
      <h1>الامتحان الشامل لمادة بايثون</h1>
      <p>أجب عن 5 أسئلة عشوائية. تحتاج إلى 4 إجابات صحيحة على الأقل لاجتياز الامتحان.</p>
    </header>

    <div id="statusMessage">جارٍ التحقق من الحساب والتقدم...</div>

    <section id="examContent" hidden>
      <div class="notice">النجاح في هذا الامتحان يفتح صفحة المشاريع لهذا الحساب على هذا المتصفح.</div>
      <div class="progress-bar" aria-label="تقدم الامتحان">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div id="quizArea">
        <div class="question-box active" id="qBox">
          <div class="q-text" id="qText">جاري تحميل السؤال...</div>
          <div class="options" id="qOptions"></div>
        </div>
      </div>
      <div class="result-box" id="resultBox" aria-live="polite">
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>
        <p id="scoreText" style="margin-top:12px;font-weight:900;color:var(--cyan)"></p>
        <a id="projectsLink" href="python-projects.html" class="btn-finish" hidden>
          الذهاب إلى المشاريع <i class="ri-arrow-left-line"></i>
        </a>
        <button id="retryButton" class="btn-finish btn-secondary" type="button" hidden>
          إعادة الامتحان <i class="ri-refresh-line"></i>
        </button>
        <a href="python-chapters.html" class="btn-finish btn-secondary">العودة للفصول</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { requireUser } from "./js/auth.js";

    const PASS_MARK = 4;
    const EXAM_KEY_PREFIX = "codequest_python_exam_passed_";

    const allQuestions = [
      { q: "أي أمر يستخدم لطباعة النص؟", opts: ["echo", "print", "write"], a: 1 },
      { q: "كيف نعرّف متغيرًا باسم x وقيمته 5؟", opts: ["x = 5", "var x = 5", "int x = 5"], a: 0 },
      { q: "ما ناتج print(10 // 3)؟", opts: ["3.33", "3", "4"], a: 1 },
      { q: "متى نستخدم if؟", opts: ["للتكرار", "لاتخاذ قرار", "للطباعة"], a: 1 },
      { q: "ما وظيفة for loop؟", opts: ["تكرار الأوامر", "تعريف دالة", "حفظ البيانات"], a: 0 },
      { q: "كيف نصل إلى العنصر الأول في قائمة Python؟", opts: ["list[1]", "list[0]", "list.first"], a: 1 },
      { q: "ما الكلمة المفتاحية لتعريف دالة في Python؟", opts: ["function", "def", "func"], a: 1 },
      { q: "أي عامل يمكن استخدامه لدمج نصين؟", opts: ["+", "*", "&"], a: 0 },
      { q: "أي جزء يتعامل مع الاستثناء في تركيب try/except؟", opts: ["except", "repeat", "define"], a: 0 },
      { q: "أي أقواس نستخدم عادةً لكتابة قاموس Python؟", opts: ["[ ]", "{ }", "( )"], a: 1 }
    ];

    const statusMessage = document.getElementById("statusMessage");
    const examContent = document.getElementById("examContent");
    const qEl = document.getElementById("qText");
    const optsEl = document.getElementById("qOptions");
    const progressEl = document.getElementById("progressFill");
    const quizArea = document.getElementById("quizArea");
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const scoreText = document.getElementById("scoreText");
    const projectsLink = document.getElementById("projectsLink");
    const retryButton = document.getElementById("retryButton");

    let currentQuiz = [];
    let currentIndex = 0;
    let score = 0;
    let answerLocked = false;
    let examStorageKey = "";

    function showBlocked(message) {
      statusMessage.textContent = message;
      statusMessage.hidden = false;
      examContent.hidden = true;
    }

    function readCompletedChapters() {
      try {
        const saved = JSON.parse(localStorage.getItem("cody_python_progress") || "{}");
        return Array.isArray(saved.completed) ? saved.completed : [];
      } catch {
        return [];
      }
    }

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function startExam() {
      currentQuiz = shuffle(allQuestions).slice(0, 5);
      currentIndex = 0;
      score = 0;
      answerLocked = false;
      quizArea.hidden = false;
      resultBox.classList.remove("active");
      resultBox.style.display = "";
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= currentQuiz.length) {
        finishExam();
        return;
      }

      answerLocked = false;
      const question = currentQuiz[currentIndex];
      qEl.textContent = `السؤال ${currentIndex + 1} من ${currentQuiz.length}: ${question.q}`;
      optsEl.replaceChildren();
      progressEl.style.width = `${(currentIndex / currentQuiz.length) * 100}%`;

      question.opts.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "opt-btn";
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(index, button));
        optsEl.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answerLocked) return;
      answerLocked = true;

      const question = currentQuiz[currentIndex];
      const buttons = [...optsEl.querySelectorAll("button")];
      buttons.forEach(button => button.disabled = true);

      if (selectedIndex === question.a) {
        selectedButton.classList.add("correct");
        score++;
      } else {
        selectedButton.classList.add("wrong");
        buttons[question.a]?.classList.add("correct");
      }

      window.setTimeout(() => {
        currentIndex++;
        loadQuestion();
      }, 700);
    }

    function finishExam() {
      progressEl.style.width = "100%";
      quizArea.hidden = true;
      resultBox.classList.add("active");
      resultBox.style.display = "block";
      scoreText.textContent = `النتيجة: ${score} من ${currentQuiz.length}`;

      const passed = score >= PASS_MARK;

      if (passed) {
        localStorage.setItem(examStorageKey, "true");
        resultTitle.textContent = "مبروك! اجتزت الامتحان 🎉";
        resultMessage.textContent = "حققت درجة النجاح. أصبحت صفحة المشاريع متاحة لهذا الحساب على هذا المتصفح.";
        projectsLink.hidden = false;
        retryButton.hidden = true;
      } else {
        // لا نسمح بنتيجة قديمة أن تظل فعّالة بعد رسوب محاولة جديدة.
        localStorage.removeItem(examStorageKey);
        resultTitle.textContent = "لسه محتاج تدريب شوية";
        resultMessage.textContent = `النجاح يتطلب ${PASS_MARK} إجابات صحيحة من 5. راجع الدروس وحاول مرة أخرى.`;
        projectsLink.hidden = true;
        retryButton.hidden = false;
      }
    }

    retryButton.addEventListener("click", startExam);

    try {
      const user = await requireUser();

      if (!user?.uid) {
        showBlocked("سجّل الدخول أولًا لبدء الامتحان.");
      } else {
        examStorageKey = `${EXAM_KEY_PREFIX}${user.uid}`;

        const completed = readCompletedChapters();
        const allChaptersCompleted = Array.from({ length: 12 }, (_, i) => i + 1)
          .every(id => completed.includes(id));

        if (!allChaptersCompleted) {
          showBlocked("لازم تكمل الفصول الـ12 قبل الامتحان. هنعيدك لخريطة الفصول.");
          window.setTimeout(() => {
            window.location.replace("python-chapters.html");
          }, 1400);
        } else {
          statusMessage.hidden = true;
          examContent.hidden = false;
          startExam();
        }
      }
    } catch (error) {
      console.error("Exam authentication failed:", error);
      showBlocked("تعذر التحقق من تسجيل الدخول. ارجع لصفحة تسجيل الدخول وحاول مرة أخرى.");
    }
  </script>

  <script type="module" src="js/route-guard.js"></script>
</body>
</html>
