<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">
    <div class="auth-container">
        <div class="auth-card">
            <h2>انضم إلينا!</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label>اسم البطل</label>
                    <input type="text" id="name" required placeholder="مريم">
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" required placeholder="example@email.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" required placeholder="6 أحرف على الأقل">
                </div>
                <button type="submit" class="btn-full">إنشاء الحساب</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.9rem;">لديك حساب بالفعل؟ <a href="login.html" style="color: var(--light-primary); font-weight: bold;">سجل دخول</a></p>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('cq_user', document.getElementById('name').value);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
