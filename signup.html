<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="أنشئ حسابك على CodeQuest وابدأ تعلّم البرمجة.">
  <title>إنشاء حساب | CodeQuest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --text: #172033;
      --muted: #64748b;
      --border: #e2e8f0;
      --background: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 10% 10%, rgba(79, 70, 229, .09), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(34, 211, 238, .10), transparent 35%),
        var(--background);
      color: var(--text);
      font-family: "Cairo", sans-serif;
    }

    button, input, a {
      font: inherit;
    }

    .auth-card {
      width: min(100%, 450px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .08);
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--primary);
      font-size: 1.8rem;
      font-weight: 900;
    }

    .logo i {
      font-size: 2rem;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 900;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: var(--muted);
      line-height: 1.8;
      text-align: center;
      font-size: .93rem;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: .92rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .input-field {
      width: 100%;
      min-height: 52px;
      padding: 12px 44px 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #f8fafc;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
      background: white;
    }

    .input-field::placeholder {
      color: #94a3b8;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.7;
    }

    .btn-submit {
      width: 100%;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    .auth-links {
      margin-top: 24px;
      color: var(--muted);
      font-size: .92rem;
      text-align: center;
    }

    .auth-links a,
    .back-home {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
    }

    .auth-links a:hover,
    .back-home:hover {
      text-decoration: underline;
    }

    .back-home-wrap {
      margin-top: 22px;
      text-align: center;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .9rem;
    }

    .auth-message {
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: .9rem;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    @media (max-width: 400px) {
      body {
        padding: 14px 10px;
      }

      .auth-card {
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <div class="logo">
      <i class="ri-code-box-fill" aria-hidden="true"></i>
      <span>CodeQuest</span>
    </div>

    <h1>ابدأ رحلتك البرمجية!</h1>
    <p class="subtitle">أنشئ حسابك واحفظ تقدمك في تعلّم البرمجة.</p>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">اسمك داخل المنصة</label>
        <div class="input-wrap">
          <i class="ri-user-line" aria-hidden="true"></i>
          <input
            type="text"
            id="name"
            name="name"
            class="input-field"
            placeholder="اكتب اسمك"
            autocomplete="name"
            minlength="2"
            maxlength="50"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <i class="ri-mail-line" aria-hidden="true"></i>
          <input
            type="email"
            id="email"
            name="email"
            class="input-field"
            placeholder="example@email.com"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="input-wrap">
          <i class="ri-lock-password-line" aria-hidden="true"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="input-field"
            placeholder="6 أحرف على الأقل"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>
        <span class="hint">استخدم كلمة مرور لا تقل عن 6 أحرف، ولا تشاركها مع أي شخص.</span>
      </div>

      <button type="submit" class="btn-submit">
        <i class="ri-user-add-line" aria-hidden="true"></i>
        <span>إنشاء الحساب</span>
      </button>
    </form>

    <div class="auth-links">
      لديك حساب بالفعل؟
      <a href="login.html">سجّل الدخول</a>
    </div>

    <div class="back-home-wrap">
      <a href="index.html" class="back-home">
        <i class="ri-arrow-right-line" aria-hidden="true"></i>
        العودة إلى الرئيسية
      </a>
    </div>
  </main>

  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
