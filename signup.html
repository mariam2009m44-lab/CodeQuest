<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css?v=5">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: var(--bg-panel); padding: 40px; border-radius: var(--radius-card); box-shadow: var(--shadow-glass); width: 100%; max-width: 420px; text-align: center; border: 1px solid var(--border-soft); backdrop-filter: blur(15px); }
        .auth-card h2 { margin-bottom: 30px; color: var(--text-primary); font-size: 1.8rem; font-weight: 800; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        .auth-links { margin-top: 25px; font-size: 0.9rem; color: var(--text-secondary); }
        .auth-links a { color: var(--primary); font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>انضم إلينا!</h2>
        <form id="signupForm">
            <div class="form-group">
                <label>اسم البطل</label>
                <input type="text" id="name" class="input-field" placeholder="مريم" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" class="input-field" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور (6 أحرف على الأقل)</label>
                <input type="password" id="password" class="input-field" placeholder="********" required minlength="6">
            </div>
            <button type="submit" id="signupBtn" class="btn-primary" style="width: 100%; margin-top: 10px;">إنشاء الحساب</button>
        </form>
        <div class="auth-links">
            لديك حساب بالفعل؟ <a onclick="window.location.href='login.html'">سجل دخول</a>
        </div>
    </div>
    <script type="module">
        import { auth, db, doc, setDoc } from './js/app.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { showToast } from './js/ui.js';
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signupBtn');
            btn.disabled = true; btn.innerText = 'جاري الإنشاء...';
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await updateProfile(user, { displayName: name });
                await setDoc(doc(db, "users", user.uid), {
                    displayName: name, email: email, xp: 0, coins: 500, inventory: [], activeAvatar: 'cody'
                });
                showToast('تم إنشاء الحساب بنجاح!', 'success');
                setTimeout(() => window.location.href = 'avatar.html', 1000);
            } catch (error) {
                showToast('حدث خطأ. قد يكون البريد مستخدم بالفعل.', 'error');
                btn.disabled = false; btn.innerText = 'إنشاء الحساب';
            }
        });
    </script>
</body>
</html>
