<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | المستويات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/levels.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="stars" id="stars"></div>
<header class="top-bar">
<button class="back-btn" onclick="window.location.href='languages.html'">← رجوع</button>
<div class="title-box"><h1 id="userName">...</h1><p>مسارك في <span id="langName">JavaScript</span></p></div>
</header>
<div class="map-container">
<img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" class="mascot-float">
<div class="path-line"></div>
<div class="level-node unlocked" onclick="window.location.href='game.html'">
<span class="node-icon">▶</span><span class="node-num">1</span><span class="node-label">البداية</span>
</div>
<div class="level-node locked" style="margin-left: 40%;"><span class="node-icon">🔒</span><span class="node-num">2</span><span class="node-label">الشروط</span></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; } 
        else { 
            document.getElementById('userName').innerText = Auth.getCurrentUser(); 
            document.getElementById('langName').innerText = localStorage.getItem('cq_language_name') || 'JavaScript';
        }
    });
});
</script>
</body></html>
