<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المستويات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/levels.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
</head>
<body style="background:#050914; color:#fff; text-align:center; padding:20px;">
<h1 id="usernameDisplay" style="color:#00e5ff;">جاري التحميل...</h1>
<div style="margin-top:50px;">
    <div onclick="window.location.href='game.html'" style="background:#00e5ff; color:#000; padding:20px; border-radius:50%; width:100px; margin:0 auto; cursor:pointer; font-weight:bold;">المستوى 1</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; } 
        else { document.getElementById('usernameDisplay').innerText = 'أهلاً ' + Auth.getCurrentUser(); }
    });
});
</script>
</body></html>
