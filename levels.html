<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستويات | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="languages.html" class="nav-item active"><i class="ri-map-2-line"></i> مسار التعلم</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
                <a href="index.html" class="nav-item logout"><i class="ri-logout-box-r-line"></i> تسجيل الخروج</a>
            </nav>
        </aside>
        <main class="main-content">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                <a href="languages.html" class="btn-dark" style="padding: 8px 15px; background: transparent; border: 1px solid var(--dark-border);"><i class="ri-arrow-right-line"></i> رجوع</a>
                <h1 style="font-size: 1.8rem;" id="pageTitle">مسار JavaScript</h1>
            </div>
            <div class="levels-list">
                <div class="level-item" onclick="window.location.href='lecture.html'">
                    <div>
                        <h4>المتغيرات (Variables)</h4>
                        <p>فهم كيفية تخزين البيانات</p>
                    </div>
                    <i class="ri-play-circle-fill" style="font-size: 2rem; color: #06B6D4;"></i>
                </div>
                <div class="level-item locked">
                    <div>
                        <h4>العمليات الحسابية</h4>
                        <p>استخدام العمليات الأساسية</p>
                    </div>
                    <i class="ri-lock-fill" style="font-size: 1.5rem; color: #6B7AAB;"></i>
                </div>
            </div>
        </main>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'javascript';
        if(lang === 'python') document.getElementById('pageTitle').innerText = 'مسار Python';
        if(lang === 'cpp') document.getElementById('pageTitle').innerText = 'مسار C++';
    </script>
</body>
</html>
