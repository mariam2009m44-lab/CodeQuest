<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>خريطة المسار | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; }
        body { background: radial-gradient(circle at top, #0a192f 0%, var(--bg) 100%); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; box-sizing: border-box; }
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; }
        .header h1 { font-size: 1.8rem; color: var(--neon-cyan); margin: 0; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; text-decoration: none;}
        
        .map-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        .path-line { width: 6px; height: 1200px; background: linear-gradient(to bottom, #00e5ff, rgba(0,229,255,0.1)); position: absolute; top: 100px; z-index: 1; }
        .level-node { width: 70px; height: 70px; background: #111; border: 3px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; color: #fff; cursor: pointer; z-index: 2; margin: 30px 0; transition: 0.3s; box-shadow: 0 0 15px rgba(0,229,255,0.3); position: relative; }
        .level-node:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(0,229,255,0.8); }
        .level-node.locked { border-color: #555; color: #555; box-shadow: none; cursor: not-allowed; background: #1a1a1a; }
        .stars { position: absolute; bottom: -25px; font-size: 1rem; display: flex; gap: 2px; }
        .star { color: #ffd700; text-shadow: 0 0 5px #ffd700; } .star.empty { color: #444; text-shadow: none; }
        
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 65px; border-radius: 18px; background: transparent; color: #667; text-decoration: none; transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-btn i { font-size: 1.6rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.75rem; font-family: 'Cairo'; font-weight: bold; }
        .nav-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border-color: rgba(0, 229, 255, 0.4); transform: translateY(-5px); }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }
    </style>
</head>
<body>
    <div class="header"><h1>مسارك في <span id="langName" style="color:var(--gold);">...</span></h1><a href="languages.html" class="btn-back">← رجوع</a></div>
    <div class="map-container" id="mapContainer">
        <img src="cody-avatar.svg" style="width: 100px; height: 100px; margin-top: 20px; z-index: 2; filter: drop-shadow(0 0 20px #00e5ff);">
        <div class="path-line"></div>
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const lang = localStorage.getItem('cq_language') || 'JavaScript';
                document.getElementById('langName').innerText = lang;
                
                const uid = Auth.getUserId();
                let progress = {};
                try {
                    const doc = await firebase.firestore().collection('users').doc(uid).get();
                    if(doc.exists) progress = (doc.data().progress && doc.data().progress[lang]) || {};
                } catch(e) {}

                const response = await fetch('curriculum.json');
                const curriculum = await response.json();
                const levelsCount = Object.keys(curriculum[lang] || curriculum['JavaScript']).length;

                const map = document.getElementById('mapContainer');
                for (let i = 1; i <= levelsCount; i++) {
                    const isUnlocked = (i === 1) || (progress['level'+(i-1)] && progress['level'+(i-1)].unlocked);
                    const stars = (progress['level'+i] && progress['level'+i].stars) || 0;
                    
                    let starsHtml = '<div class="stars">';
                    for(let s=0; s<3; s++) starsHtml += `<span class="star ${s < stars ? '' : 'empty'}">★</span>`;
                    starsHtml += '</div>';

                    const node = document.createElement('div');
                    node.className = `level-node ${isUnlocked ? '' : 'locked'}`;
                    node.innerHTML = `${isUnlocked ? i : '🔒'} ${starsHtml}`;
                    
                    if (isUnlocked) {
                        node.onclick = () => {
                            localStorage.setItem('cq_current_level', i);
                            window.location.href = `studio.html?lang=${lang}&level=${i}`;
                        };
                    }
                    map.appendChild(node);
                }
            });
        });
    </script>
</body></html>
