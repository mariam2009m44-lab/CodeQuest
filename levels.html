<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>المستويات</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <style>
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 25, 47, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); box-sizing: border-box; }
        .header h1 { margin: 0; font-size: 1.4rem; color: #00e5ff; }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid #00e5ff; color: #00e5ff; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .map-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; margin-top: 30px; padding-bottom: 100px;}
        .level-node { width: 70px; height: 70px; background: #111; border: 3px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; margin: 20px 0; box-shadow: 0 0 15px rgba(0,229,255,0.3); position: relative; z-index: 2; }
        .level-node.locked { border-color: #555; color: #555; cursor: not-allowed; background: #1a1a1a; box-shadow: none; }
        .path-line { position: absolute; width: 4px; background: rgba(0,229,255,0.3); top: 100px; bottom: 100px; z-index: 1; }
        .stars { position: absolute; bottom: -25px; display: flex; gap: 2px; font-size: 1rem; }
        .star { color: #444; } .star.filled { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.95); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; }
        .nav-btn { color: #667; text-decoration: none; display: flex; flex-direction: column; align-items: center; width: 60px; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; }
        .nav-btn.active { color: #00e5ff; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h1>مسارك</h1></div>
    <div style="position:relative; display:flex; flex-direction:column; align-items:center;" class="map-container">
        <div class="path-line"></div>
        <!-- سيتم إضافة المستويات هنا -->
    </div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                const lang = localStorage.getItem('cq_language') || 'JavaScript';
                const map = document.querySelector('.map-container');
                const line = document.querySelector('.path-line');

                try {
                    const doc = await firebase.firestore().collection('users').doc(Auth.getUserId()).get();
                    let progress = doc.exists ? (doc.data().progress?.[lang] || {}) : {};

                    const response = await fetch('curriculum.json');
                    const curriculum = await response.json();
                    const levels = Object.keys(curriculum[lang] || curriculum['JavaScript']);
                    
                    line.style.height = (levels.length * 110) + 'px';

                    levels.forEach((lvl, index) => {
                        const isUnlocked = (index === 0) || (progress['level'+(index)] && progress['level'+(index)].unlocked);
                        const stars = (progress['level'+(index+1)] && progress['level'+(index+1)].stars) || 0;
                        
                        let starsHtml = '<div class="stars">';
                        for(let s=0; s<3; s++) starsHtml += `<span class="star ${s < stars ? 'filled' : ''}">★</span>`;
                        starsHtml += '</div>';

                        const node = document.createElement('div');
                        node.className = `level-node ${isUnlocked ? '' : 'locked'}`;
                        node.innerHTML = `${isUnlocked ? (index+1) : '🔒'} ${starsHtml}`;
                        
                        if (isUnlocked) {
                            node.onclick = () => {
                                window.location.href = `studio.html?lang=${lang}&level=${index+1}`;
                            };
                        }
                        map.appendChild(node);
                    });
                } catch(e) { console.error(e); }
            });
        });
    </script>
</body></html>
