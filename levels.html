<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>المستويات</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script><link rel="stylesheet" href="css/global.css">
    <style>
        .map { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; margin-top: 20px; }
        .node { width: 70px; height: 70px; border-radius: 50%; background: #111; border: 3px solid var(--neon-cyan); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; margin: 20px 0; cursor: pointer; }
        .node.locked { border-color: #555; color: #555; cursor: not-allowed; }
    </style>
<link rel="stylesheet" href="global.css">
</head><body>
    <div class="header"><a href="languages.html" class="btn-back">رجوع</a><h1 id="title">المستويات</h1></div>
    <div class="map" id="map"></div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        const lang = localStorage.getItem('cq_language') || 'JavaScript';
        document.getElementById('title').innerText = lang;
        const map = document.getElementById('map');
        for(let i=1; i<=10; i++) {
            const d = document.createElement('div'); d.className = 'node' + (i===1 ? '' : ' locked'); d.innerText = i===1 ? '1' : '🔒';
            if(i===1) d.onclick = () => window.location.href = `studio.html?lang=${lang}&level=1`;
            map.appendChild(d);
        }
    </script>

<script>
    // كود عرض النقاط الحقيقية في الواجهة
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (window.Auth && Auth.getUserData()) {
                const points = Auth.getUserData().points || 0;
                // بندور على أي عنصر فيه كلمة "رصيدك" أو "0" ونغيره
                let el = document.getElementById('pointsDisplay');
                if(!el) {
                    // لو مفيش ID، هنكريت شارة صغيرة فوق الشمال تبان في كل الصفحات
                    el = document.createElement('div');
                    el.style.cssText = 'position:fixed; top:15px; left:15px; background:#FFD700; color:#000; padding:8px 15px; border-radius:20px; font-weight:bold; z-index:9999; font-family:Cairo, sans-serif; box-shadow: 0 4px 15px rgba(255,215,0,0.3);';
                    document.body.appendChild(el);
                }
                el.innerHTML = `⭐ رصيدك: ${points} XP`;
            }
        }, 1000); // نستنى ثانية عشان Firebase يحمل الداتا
    });
</script>
    <script src="global.js"></script>
</body>
</html>
