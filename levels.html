<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الفصول | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 70px; background: #050914; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(10, 17, 40, 0.95); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; }
        .top-bar a { color: var(--primary); text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .top-bar h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .menu-btn { background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: #0a1128; z-index: 1000; transition: 0.3s; box-shadow: -5px 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { margin: 0; color: #fff; font-size: 1.2rem; }
        .close-btn { background: none; border: none; color: var(--danger); font-size: 1.5rem; cursor: pointer; }
        
        .chapter-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chapter-item { padding: 15px 20px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; color: var(--text-muted); font-weight: bold; transition: 0.3s; display: flex; justify-content: space-between; align-items: center;}
        .chapter-item:hover, .chapter-item.active { background: rgba(0,229,255,0.1); color: var(--primary); border-right: 4px solid var(--primary); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; }
        .overlay.open { display: block; }

        .content { padding: 20px; flex: 1; }
        .intro-box { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .intro-box img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--primary); background: #000; }
        .intro-box p { margin: 0; font-size: 1rem; color: #e0e0e0; line-height: 1.5; }
        
        .lessons-list { display: flex; flex-direction: column; gap: 15px; }
        .lesson-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
        .lesson-card:active { transform: scale(0.98); border-color: var(--primary); }
        .lesson-icon { width: 45px; height: 45px; border-radius: 12px; background: rgba(0,229,255,0.1); display: flex; justify-content: center; align-items: center; font-size: 1.3rem; color: var(--primary); }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: bold; font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
        .lesson-type { font-size: 0.8rem; color: var(--text-muted); }
        .stars { color: var(--gold); font-size: 1rem; }

        /* كارت الامتحان */
        .exam-card { background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(139,92,246,0.2)); border: 2px dashed #ef4444; border-radius: 15px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .exam-card:hover { background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(139,92,246,0.3)); transform: scale(1.02); }
        .exam-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(239,68,68,0.2); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #ef4444; }
        .exam-title { font-weight: bold; font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .exam-desc { font-size: 0.85rem; color: #ccc; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 17, 40, 0.98); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass-border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: bold; }
        .nav-item i { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>
    <header class="top-bar">
        <a href="languages.html"><i class="ri-arrow-right-line"></i> رجوع</a>
        <h1 id="langTitle">جاري التحميل...</h1>
        <button class="menu-btn" onclick="toggleMenu()"><i class="ri-menu-line"></i> الفصول</button>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>الفصول الدراسية</h2>
            <button class="close-btn" onclick="toggleMenu()"><i class="ri-close-line"></i></button>
        </div>
        <div class="chapter-list" id="chapterList"></div>
    </div>

    <div class="content">
        <div class="intro-box">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cody&backgroundColor=00e5ff" id="codyImg">
            <p>اختر درساً من القائمة لتبدأ التعلم مع كودي!</p>
        </div>
        <div class="lessons-list" id="lessonsList"></div>
        <div id="examArea"></div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="ri-home-4-line"></i> الرئيسية</a>
        <a href="languages.html" class="nav-item active"><i class="ri-book-open-line"></i> التعلم</a>
        <a href="games.html" class="nav-item"><i class="ri-gamepad-line"></i> الألعاب</a>
        <a href="profile.html" class="nav-item"><i class="ri-user-3-line"></i> ملفي</a>
    </nav>

    <script>
        let lang = localStorage.getItem('cq_language') || 'JavaScript';
        // إصلاح مشكلة C++ 
        if (lang === 'C') { lang = 'C++'; localStorage.setItem('cq_language', 'C++'); }
        
        let jsonFile = 'js_curriculum.json';
        if (lang === 'Python') jsonFile = 'python_curriculum.json';
        else if (lang === 'C++') jsonFile = 'cpp_curriculum.json';
        
        document.getElementById('langTitle').innerText = `مسار ${lang}`;
        let curriculumData = null;
        let userProgress = {}; 

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(async (logged) => {
                if (!logged) { window.location.href = 'login.html'; return; }
                try {
                    const userDoc = await firebase.firestore().collection('users').doc(Auth.getUserId()).get();
                    if(userDoc.exists && userDoc.data().progress) {
                        userProgress = userDoc.data().progress[lang] || {};
                    }

                    const res = await fetch(jsonFile);
                    curriculumData = await res.json();
                    
                    renderChapters();
                    if(curriculumData.chapters.length > 0) loadChapter(curriculumData.chapters[0], 0);
                } catch(e) {
                    console.error(e);
                    document.getElementById('lessonsList').innerHTML = `<p style="color:red; text-align:center;">حدث خطأ في تحميل المحتوى.</p>`;
                }
            });
        });

        function renderChapters() {
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            curriculumData.chapters.forEach((ch, i) => {
                const div = document.createElement('div');
                div.className = `chapter-item ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `<span>${ch.title}</span> <i class="ri-arrow-left-s-line"></i>`;
                div.onclick = () => {
                    document.querySelectorAll('.chapter-item').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    loadChapter(ch, i);
                    toggleMenu();
                };
                list.appendChild(div);
            });
        }

        function loadChapter(chapter, chIndex) {
            const grid = document.getElementById('lessonsList');
            const examArea = document.getElementById('examArea');
            grid.innerHTML = '';
            examArea.innerHTML = ''; // مسح الامتحان القديم

            chapter.lessons.forEach((lesson, lIndex) => {
                let starsHtml = '<span class="stars">☆☆☆</span>';
                const progressKey = `ch_${chapter.id}_les_${lesson.id}`;
                if(userProgress[progressKey] && userProgress[progressKey].stars) {
                    const s = userProgress[progressKey].stars;
                    starsHtml = `<span class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span>`;
                }

                const card = document.createElement('div');
                card.className = `lesson-card`;
                card.innerHTML = `
                    <div class="lesson-icon"><i class="ri-chat-3-line"></i></div>
                    <div class="lesson-info">
                        <div class="lesson-title">${lesson.title}</div>
                        <div class="lesson-type">شرح تفاعلي + كويز</div>
                    </div>
                    ${starsHtml}
                `;
                card.onclick = () => {
                    window.location.href = `lecture.html?lang=${lang}&ch=${chIndex}&les=${lIndex}`;
                };
                grid.appendChild(card);
            });

            // إضافة كارت "الامتحان النهائي للفصل"
            const examCard = document.createElement('div');
            examCard.className = 'exam-card';
            examCard.innerHTML = `
                <div class="exam-icon"><i class="ri-file-paper-2-line"></i></div>
                <div class="lesson-info">
                    <div class="exam-title">امتحان ${chapter.title}</div>
                    <div class="exam-desc">اختبر فهمك لكل ما تعلمته في هذا الفصل!</div>
                </div>
                <i class="ri-arrow-left-s-line" style="color:#ef4444; font-size:1.5rem;"></i>
            `;
            examCard.onclick = () => {
                window.location.href = `exam.html?lang=${lang}&ch=${chIndex}`;
            };
            examArea.appendChild(examCard);
        }
    </script>
</body>
</html>
