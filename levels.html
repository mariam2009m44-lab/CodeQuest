<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1224">
  <title>جاري فتح خريطة التعلم | CodeQuest</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const requestedLanguage = (params.get("lang") || "javascript").toLowerCase();
      const supportedLanguages = new Set(["python", "javascript", "cpp", "java"]);
      const language = supportedLanguages.has(requestedLanguage)
        ? requestedLanguage
        : "javascript";

      const destination = new URL("course-path.html", window.location.href);
      destination.searchParams.set("lang", language);
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <p>
    جاري فتح خريطة التعلم...
    <a href="course-path.html?lang=javascript">اضغط هنا للمتابعة إلى JavaScript</a>
  </p>
</body>
</html>
