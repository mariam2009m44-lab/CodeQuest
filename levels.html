<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | خريطة المغامرات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/levels.css">
<link rel="stylesheet" href="css/accessories.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>

    <!-- Firebase SDKs (Compat for pure HTML/JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/auth.js"></script>
<script src="js/sfx.js"></script>
<script src="js/accessories.js"></script>

<script>if(!localStorage.getItem("cq_session")){window.location.href="index.html";}</script>
<link rel="stylesheet" href="css/accessories.css">
</head>
<body>
<div class="stars" id="stars"></div>

<header class="top-bar">
<button class="back-btn" onclick="playSound('click'); setTimeout(()=>window.location.href='languages.html',150)">← رجوع</button>
<div class="title-box">
<div class="mini-avatar avatar-with-acc" onclick="playSound('click'); window.location.href='profile.html'">
<div id="miniAvatar" style="width:100%;height:100%"></div>
</div>
<h1>أهلاً يا <span id="userName"></span> 👋</h1>
<p>مسارك في <span id="langName">JavaScript</span></p>
</div>
<button class="change-lang-btn" onclick="playSound('click'); window.location.href='languages.html'">تغيير اللغة</button>
</header>

<div class="videos-scroll" id="videosScroll"></div>
</div>

<div class="map-container">
<img src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png" alt="Robot" class="mascot-float">
<div class="path-line"></div>

<div class="level-node unlocked" id="level1" onclick="startLevel(1)">
<span class="node-icon">▶</span>
<span class="node-num">1</span>
<span class="node-label">المتغيرات</span>
</div>

<div class="level-node locked" id="level2">
<span class="node-icon">🔒</span>
<span class="node-num">2</span>
<span class="node-label">الشروط</span>
</div>

<div class="level-node locked" id="level3" style="margin-left: 40%;">
<span class="node-icon">🔒</span>
<span class="node-num">3</span>
<span class="node-label">الحلقات</span>
</div>

<div class="level-node locked" id="level4">
<span class="node-icon">🔒</span>
<span class="node-num">4</span>
<span class="node-label">الدوال</span>
</div>

<div class="level-node locked" id="level5" style="margin-right: 40%;">
<span class="node-icon">🔒</span>
<span class="node-num">5</span>
<span class="node-label">المشاريع</span>
</div>

</div>

<script>
const user = Auth.getCurrentUser();
const langCode = localStorage.getItem('cq_language') || 'js';
const langName = localStorage.getItem('cq_language_name') || 'JavaScript';

document.getElementById('userName').innerText = user || 'بطل';
document.getElementById('langName').innerText = langName;


document.getElementById("miniAvatar").innerHTML = Auth.getAvatarHtml(user);

const videosData = {
    js: [
        { title: 'أساسيات JS', query: 'تعلم جافا سكريبت بالعربي من الصفر' },
        { title: 'المتغيرات', query: 'متغيرات جافا سكريبت بالعربي' },
        { title: 'الشروط', query: 'if else جافا سكريبت بالعربي' },
        { title: 'الحلقات', query: 'loops جافا سكريبت بالعربي' }
    ],
    py: [
        { title: 'أساسيات Python', query: 'تعلم بايثون بالعربي من الصفر' },
        { title: 'المتغيرات', query: 'متغيرات بايثون بالعربي' },
        { title: 'الشروط', query: 'if else بايثون بالعربي' },
        { title: 'الحلقات', query: 'loops بايثون بالعربي' }
    ],
    cpp: [
        { title: 'أساسيات C++', query: 'تعلم سي بلس بلس بالعربي' },
        { title: 'المتغيرات', query: 'متغيرات سي بلس بلس بالعربي' },
        { title: 'الشروط', query: 'if else سي بلس بلس بالعربي' },
        { title: 'الحلقات', query: 'loops سي بلس بلس بالعربي' }
    ]
};

const currentVideos = videosData[langCode] || videosData.js;
const videosScroll = document.getElementById('videosScroll');
currentVideos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-chip';
    card.onclick = () => {
        playSound('pop');
        window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(v.query), '_blank');
    };
    card.innerHTML = '▶ ' + v.title;
    videosScroll.appendChild(card);
});

const progress = JSON.parse(localStorage.getItem('cq_unlocked_' + user + '_' + langCode)) || { level1: true };

function unlockLevel(num) {
    const node = document.getElementById('level' + num);
    if (!node) return;
    node.classList.remove('locked');
    node.classList.add('unlocked');
    node.querySelector('.node-icon').innerText = '▶';
    node.setAttribute('onclick', 'startLevel(' + num + ')');
}

for (let i = 2; i <= 5; i++) {
    if (progress['level' + i]) unlockLevel(i);
}

const starsContainer = document.getElementById('stars');
for (let i = 0; i < 30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}

function startLevel(num) {
    playSound('win');
    localStorage.setItem('cq_current_level', 'level' + num);
    try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#00e5ff', '#27ae60', '#ffffff'] }); } catch(e) {}
    setTimeout(() => { window.location.href = 'game.html'; }, 700);
}
</script>
<script src="js/accessories.js">setTimeout(() => { if (typeof Accessories !== "undefined") Accessories.render(); }, 200);
</script>
</body>
</html>
