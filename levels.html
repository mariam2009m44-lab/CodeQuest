<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة التعلم | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1 id="pageTitle" style="color: var(--text-main);">جاري التحميل...</h1>
            <a href="lessons.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> رجوع</a>
        </div>
        
        <div id="levelsContainer" style="display: flex; flex-direction: column; gap: 16px;">
        </div>
    </div>

    <script>
        const lang = sessionStorage.getItem('selectedLang') || 'javascript';
        const titles = { javascript: 'مسار JavaScript', python: 'مسار Python', cpp: 'مسار C++' };
        document.getElementById('pageTitle').innerText = titles[lang];

        const files = { javascript: 'js_curriculum.json', python: 'python_curriculum.json', cpp: 'cpp_curriculum.json' };

        async function loadLevels() {
            try {
                const res = await fetch(files[lang]);
                const data = await res.json();
                const container = document.getElementById('levelsContainer');
                
                data.chapters.forEach((chapter, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.cursor = 'pointer';
                    card.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h3 style="color: var(--text-main); margin-bottom: 8px;">${chapter.title}</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">${chapter.lessons.length} دروس تفاعلية</p>
                            </div>
                            <div style="width: 50px; height: 50px; background: rgba(101,84,217,0.1); color: var(--primary-main); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                                <i class="ri-arrow-left-s-line"></i>
                            </div>
                        </div>
                    `;
                    card.onclick = () => {
                        window.location.href = `lecture.html?chapter=${index}`;
                    };
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('levelsContainer').innerHTML = '<p style="color:red;">حدث خطأ في تحميل المنهج.</p>';
            }
        }
        loadLevels();
    </script>
</body>
</html>
