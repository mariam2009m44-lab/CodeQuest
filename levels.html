
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسار التعلم | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --bg-panel: #1e293b; --primary: #00ffcc; --text-main: #e2e8f0; }
        body { margin: 0; padding: 20px; font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--bg-panel); padding: 15px 20px; border-radius: 12px; }
        .back-btn { color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .chapters-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .chapter-card { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .chapter-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,255,204,0.1); }
        .chapter-info h3 { margin: 0 0 8px 0; font-size: 1.2rem; color: #fff; }
        .chapter-info p { margin: 0; font-size: 0.9rem; color: #94a3b8; }
        .chapter-icon { width: 50px; height: 50px; background: rgba(0,255,204,0.1); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--primary); font-size: 1.5rem; }
        .loading-text { text-align: center; color: #94a3b8; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="lessons.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
        <h2 id="lang-title" style="margin:0; color:var(--primary);">مسار التعلم</h2>
        <div></div>
    </div>
    <div class="chapters-grid" id="chapters-container">
        <div class="loading-text">جاري تحميل الفصول...</div>
    </div>

    <!-- Bottom Nav -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item active"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>

    <style>
        .mobile-bottom-nav { position: fixed; bottom: 0; right: 0; left: 0; height: 70px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 9999; }
        .mobile-nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; text-decoration: none; font-size: 0.75rem; gap: 4px; }
        .mobile-nav-item.active { color: var(--primary); }
        .mobile-nav-item i { font-size: 1.4rem; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const lang = urlParams.get('lang') || 'javascript';
            
            const langTitles = { javascript: 'مسار JavaScript', python: 'مسار Python', cpp: 'مسار C++' };
            document.getElementById('lang-title').innerText = langTitles[lang];

            // دالة لجلب البيانات
            async function fetchCurriculum() {
                try {
                    const fileMap = { javascript: 'js_curriculum.json', python: 'python_curriculum.json', cpp: 'cpp_curriculum.json' };
                    const response = await fetch(fileMap[lang]);
                    const data = await response.json();
                    renderChapters(data.chapters);
                } catch (error) {
                    document.getElementById('chapters-container').innerHTML = '<p style="color:red; text-align:center;">حدث خطأ في تحميل الفصول. تأكد من وجود الملف.</p>';
                }
            }

            function renderChapters(chapters) {
                const container = document.getElementById('chapters-container');
                container.innerHTML = '';
                
                if (!chapters || chapters.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد فصول متاحة حالياً لهذه اللغة.</p>';
                    return;
                }

                chapters.forEach((chapter, index) => {
                    const card = document.createElement('div');
                    card.className = 'chapter-card';
                    card.onclick = () => {
                        // هنا بننقل للمحاضرة ونبعت رقم الفصل واللغة
                        window.location.href = `lecture.html?lang=${lang}&chapter=${index}`;
                    };
                    card.innerHTML = `
                        <div class="chapter-info">
                            <h3>${chapter.title}</h3>
                            <p>${chapter.lessons ? chapter.lessons.length : 0} دروس تفاعلية</p>
                        </div>
                        <div class="chapter-icon"><i class="ri-arrow-left-s-line"></i></div>
                    `;
                    container.appendChild(card);
                });
            }

            fetchCurriculum();
        });
    </script>
</body>
</html>
