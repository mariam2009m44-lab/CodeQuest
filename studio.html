<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو كودي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: transparent; color: #fff; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--glass); border-bottom: 1px solid rgba(0,229,255,0.2); backdrop-filter: blur(15px); z-index: 100; }
        .header h1 { margin: 0; font-size: 1rem; color: var(--neon-cyan); }
        .header-btns { display: flex; gap: 8px; }
        .btn { border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; font-size: 0.85rem;}
        .btn-run { background: #28a745; color: white; }
        .btn-finish { background: var(--gold); color: #000; }

        .main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; }
        
        /* شاشة الحوار */
        .dialogue-phase { display: flex; flex-direction: column; height: 100%; padding: 20px; justify-content: flex-end; background: var(--glass); backdrop-filter: blur(10px); z-index: 50; position: absolute; top: 0; left: 0; width: 100%; }
        .chat-bubble { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--neon-cyan); border-radius: 20px 20px 0 20px; padding: 20px; margin-bottom: 20px; max-width: 85%; align-self: flex-start; position: relative; }
        .cody-msg { font-size: 1.1rem; line-height: 1.8; color: #e0e0e0; }
        .avatars-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar-img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--neon-cyan); background: #000; object-fit: cover;}
        .user-avatar-img { border-color: var(--gold); }
        .btn-next { background: var(--neon-cyan); color: #000; border: none; padding: 15px; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; width: 100%; }

        /* شاشة الكود */
        .coding-phase { display: none; flex-direction: column; height: 100%; width: 100%; }
        .editor-wrapper { flex: 1; position: relative; background: #1e1e1e; }
        #editor-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .terminal-wrapper { height: 35%; background: #0a0a0a; border-top: 2px solid #333; display: flex; flex-direction: column; }
        .terminal-header { background: #1a1a1a; color: #888; padding: 5px 15px; font-size: 0.8rem; display: flex; justify-content: space-between; font-family: monospace; }
        .terminal-output { flex: 1; padding: 10px; font-family: 'Courier New', monospace; color: #00ff00; overflow-y: auto; direction: ltr; text-align: left; font-size: 0.9rem; }

        @media (min-width: 769px) {
            .coding-phase { flex-direction: row; }
            .editor-wrapper { flex: 2; height: 100%; }
            .terminal-wrapper { height: 100%; width: 35%; border-top: none; border-right: 2px solid #333; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="ri-terminal-box-line"></i> <span id="lessonTitle">جاري التحميل...</span></h1>
        <div class="header-btns" id="headerBtns" style="display:none;">
            <button class="btn btn-run" onclick="runCode()">▶ تشغيل</button>
            <button class="btn btn-finish" onclick="completeLesson()">✓ إنهاء</button>
        </div>
    </div>

    <div class="main-container">
        <div class="dialogue-phase" id="dialoguePhase">
            <div class="avatars-row">
                <img src="cody-avatar.svg" class="avatar-img" id="codyAvatarDialogue">
                <img src="cody-avatar.svg" class="avatar-img user-avatar-img" id="userAvatarDialogue">
            </div>
            <div class="chat-bubble">
                <div class="cody-msg" id="codyMessage">أهلاً بك! أنا كودي. اضغط على الزر أدناه لبدء الدرس.</div>
            </div>
            <button class="btn-next" id="nextBtn" onclick="nextDialogueStep()">التالي ➡️</button>
        </div>

        <div class="coding-phase" id="codingPhase">
            <div class="editor-wrapper"><div id="editor-container"></div></div>
            <div class="terminal-wrapper">
                <div class="terminal-header"><span><i class="ri-terminal-line"></i> CONSOLE</span><span onclick="document.getElementById('terminalOutput').innerHTML='> Ready...'" style="cursor:pointer; color: #ff4444;">مسح 🗑️</span></div>
                <div class="terminal-output" id="terminalOutput">> Ready...</div>
            </div>
        </div>
    </div>

    <script>
        let editor;
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || localStorage.getItem('cq_language') || 'JavaScript';
        const levelId = parseInt(urlParams.get('level')) || 1;
        let lessonData = null;

        // عرض صورة الطالب
        const userAvatar = localStorage.getItem('cq_avatar') || 'cody-avatar.svg';
        document.getElementById('userAvatarDialogue').src = userAvatar;

        async function loadCurriculum() {
            try {
                const response = await fetch('curriculum.json');
                const data = await response.json();
                lessonData = data[lang]?.[levelId] || data['JavaScript'][1];
                
                document.getElementById('lessonTitle').innerText = lessonData.title;
                document.getElementById('codyMessage').innerText = lessonData.intro.replace(/<[^>]*>?/gm, '');

            } catch(e) { console.error(e); document.getElementById('codyMessage').innerText = "حدث خطأ في تحميل الدرس."; }
        }

        function nextDialogueStep() {
            document.getElementById('dialoguePhase').style.display = 'none';
            document.getElementById('codingPhase').style.display = 'flex';
            document.getElementById('headerBtns').style.display = 'flex';
            initEditor();
        }

        function initEditor() {
            const savedCode = localStorage.getItem(`cq_code_${lang}_${levelId}`) || lessonData.code;
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: savedCode, language: lang === 'js' || lang === 'JavaScript' ? 'javascript' : (lang === 'Python' ? 'python' : 'cpp'),
                    theme: 'vs-dark', fontSize: 16, minimap: { enabled: false }, automaticLayout: true, scrollBeyondLastLine: false
                });
                let saveTimeout;
                editor.onDidChangeModelContent(() => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => { localStorage.setItem(`cq_code_${lang}_${levelId}`, editor.getValue()); }, 1000);
                });
            });
        }

        function runCode() {
            const code = editor.getValue();
            const terminal = document.getElementById('terminalOutput');
            terminal.innerHTML += `<br><span style="color:#888;">> Running...</span><br>`;
            if (lang === 'js' || lang === 'JavaScript') {
                let originalLog = console.log;
                console.log = function(...args) {
                    terminal.innerHTML += `<span style="color:#00ff00;">> ${args.join(' ')}</span><br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                    originalLog.apply(console, args);
                };
                try { eval(code); } 
                catch (err) { terminal.innerHTML += `<span style="color:#ff4444;">❌ Error: ${err.message}</span><br>`; } 
                finally { console.log = originalLog; }
            } else {
                terminal.innerHTML += `<span style="color:#ffd700;">⚠️ تشغيل ${lang} يتطلب سيرفر.</span><br>`;
            }
        }

        async function completeLesson() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00e5ff', '#ffd700', '#ff4444'] });
            const uid = Auth.getUserId();
            if (uid) {
                try {
                    await firebase.firestore().collection('users').doc(uid).update({
                        points: firebase.firestore.FieldValue.increment(50),
                        [`progress.${lang}.level${levelId}`]: { unlocked: true, stars: 3 },
                        [`progress.${lang}.level${levelId + 1}`]: { unlocked: true, stars: 0 }
                    });
                } catch(e) { console.error(e); }
            }
            setTimeout(() => { alert("🎉 مبروك! حصلت على 50 نقطة."); window.location.href = 'levels.html'; }, 1500);
        }

        document.addEventListener('DOMContentLoaded', loadCurriculum);
    </script>
</body>
</html>
