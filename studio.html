<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستوديو | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .studio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .task-panel { background: var(--bg-surface); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-light); }
        .editor-panel { background: #1d1f21; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
        .editor-header { background: #2d2f31; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .output-box { background: #fff; color: #1e293b; padding: 15px; font-family: var(--font-code); min-height: 100px; border-top: 1px solid var(--border-light); direction: ltr; }
        textarea { width: 100%; height: 300px; background: #282a36; color: #f8f8f2; border: none; padding: 15px; font-family: var(--font-code); font-size: 15px; resize: none; outline: none; direction: ltr; }
        @media (max-width: 768px) { .studio-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="studio-grid">
        <div class="task-panel">
            <h2 style="color: var(--primary-main); margin-bottom: 15px;">المهمة: طباعة النص</h2>
            <p style="color: var(--text-muted); line-height: 1.8; margin-bottom: 20px;">قم بكتابة كود يطبع الجملة التالية على الشاشة: <strong>"مرحباً يا كودي"</strong>.</p>
            <div style="background: var(--bg-base); padding: 15px; border-radius: var(--radius-md); border-right: 4px solid var(--primary-main); margin-bottom: 20px;">
                <p style="font-weight: 600; margin-bottom: 5px;">تلميح:</p>
                <p style="color: var(--text-muted); font-size: 0.9rem;">استخدم <code style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">console.log("النص")</code></p>
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="checkSolution()"><i class="ri-check-double-line"></i> تحقق من الحل</button>
            <div id="resultMsg" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </div>
        <div class="editor-panel">
            <div class="editor-header">
                <span style="color: #a0aec0; font-family: var(--font-code); font-size: 0.9rem;">solution.js</span>
                <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.8rem; border-color: var(--primary-main); color: var(--primary-main);" onclick="runCode()"><i class="ri-play-fill"></i> تشغيل</button>
            </div>
            <textarea id="codeInput" placeholder="// اكتب الكود هنا..."></textarea>
            <div id="consoleOutput" class="output-box">> Output will appear here...</div>
        </div>
    </div>
    <script>
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const output = document.getElementById('consoleOutput');
            let logs = [];
            const origLog = console.log;
            console.log = (...args) => logs.push(args.join(' '));
            try {
                new Function(code)();
                console.log = origLog;
                output.innerHTML = logs.length > 0 ? logs.map(l => `> ${l}`).join('<br>') : '> No output';
            } catch (e) {
                console.log = origLog;
                output.innerHTML = `<span style="color:red;">> Error: ${e.message}</span>`;
            }
        }

        function checkSolution() {
            const code = document.getElementById('codeInput').value;
            const msg = document.getElementById('resultMsg');
            if (code.includes('مرحباً يا كودي') && code.includes('console.log')) {
                msg.innerHTML = '<span style="color: var(--success);">✅ إجابة صحيحة! أحسنت.</span>';
            } else {
                msg.innerHTML = '<span style="color: var(--danger);">❌ حاول مرة أخرى، تأكد من النص المطلوب.</span>';
            }
        }
    </script>
</body>
</html>
