<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاستوديو | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: #1e1e1e; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(10, 17, 40, 0.95); border-bottom: 2px solid var(--glass-border); z-index: 100; }
        .header h1 { margin: 0; font-size: 1rem; color: var(--primary); }
        .btn-group { display: flex; gap: 8px; }
        .btn-sm { padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; border: none; display: flex; align-items: center; gap: 5px; font-family: 'Cairo';}
        .btn-hint { background: #8b5cf6; color: #fff; }
        .btn-run { background: var(--success); color: #fff; }
        .btn-finish { background: var(--gold); color: #000; }
        .studio-layout { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        .editor-section { flex: 1; display: flex; flex-direction: column; position: relative; min-height: 200px; }
        #editor-container { width: 100%; flex: 1; }
        .console-section { height: 35%; background: #0a0a0a; border-top: 2px solid #333; display: flex; flex-direction: column; }
        .console-header { background: #1a1a1a; color: #888; padding: 5px 15px; font-size: 0.8rem; display: flex; justify-content: space-between; font-family: monospace; }
        .console-output { flex: 1; padding: 10px; font-family: monospace; color: #00ff00; overflow-y: auto; direction: ltr; text-align: left; font-size: 0.9rem; }
        @media (min-width: 768px) {
            .studio-layout { flex-direction: row; }
            .console-section { height: 100%; width: 35%; border-top: none; border-right: 2px solid #333; }
        }
        .dialogue-modal { position: absolute; inset: 0; background: rgba(5, 9, 20, 0.95); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .cody-box { display: flex; gap: 15px; max-width: 500px; width: 100%; align-items: flex-end;}
        .cody-box img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--primary); }
        .speech { background: rgba(0,0,0,0.8); border: 2px solid var(--primary); padding: 20px; border-radius: 20px 20px 0 20px; font-size: 1.1rem; line-height: 1.6; color: #fff; }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="lessonTitle">جاري التحميل...</h1>
        <div class="btn-group" id="headerBtns" style="display:none;">
            <button class="btn-sm btn-hint" onclick="showHint()"><i class="ri-lightbulb-line"></i> تلميح</button>
            <button class="btn-sm btn-run" onclick="runCode()"><i class="ri-play-fill"></i> تشغيل</button>
            <button class="btn-sm btn-finish" onclick="completeLesson()"><i class="ri-check-line"></i> إنهاء</button>
        </div>
    </header>

    <div class="studio-layout">
        <div class="editor-section">
            <div id="editor-container"></div>
            <div class="console-section">
                <div class="console-header"><span>Console</span><span onclick="document.getElementById('terminalOutput').innerHTML='> Ready...'" style="cursor:pointer; color:#ff4444;">مسح</span></div>
                <div class="console-output" id="terminalOutput">> Ready...</div>
            </div>
        </div>
    </div>

    <!-- شاشة الحوار -->
    <div class="dialogue-modal" id="dialogueModal">
        <div class="cody-box">
            <img src="cody-avatar.svg" id="codyImg">
            <div class="speech" id="codyMessage">أهلاً بك! أنا كودي. جاهز لبدء الدرس؟</div>
        </div>
        <button class="btn btn-primary" style="margin-top:30px;" onclick="startCoding()">🚀 ابدأ التحدي</button>
    </div>

    <script>
        let editor;
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'JavaScript';
        const levelId = parseInt(urlParams.get('level')) || 1;
        let lessonData = null;

        const av = localStorage.getItem('cq_avatar'); if(av) document.getElementById('codyImg').src = av;

        async function loadData() {
            try {
                const res = await fetch('curriculum.json');
                const data = await res.json();
                lessonData = data[lang]?.[levelId] || { title: "درس تجريبي", intro: "مرحباً", code: "console.log('Hello');" };
                document.getElementById('lessonTitle').innerText = lessonData.title;
                document.getElementById('codyMessage').innerText = lessonData.intro;
            } catch(e) { 
                // في حالة عدم وجود ملف المنهج، نستخدم بيانات افتراضية
                lessonData = { title: "المتغيرات", intro: "المتغير هو صندوق نخزن فيه البيانات.", code: "let name = 'Cody';\nconsole.log(name);", hint: "استخدم let لتعريف المتغير" };
                document.getElementById('lessonTitle').innerText = lessonData.title;
                document.getElementById('codyMessage').innerText = lessonData.intro;
            }
        }

        function startCoding() {
            document.getElementById('dialogueModal').style.display = 'none';
            document.getElementById('headerBtns').style.display = 'flex';
            initEditor();
        }

        function initEditor() {
            const saved = localStorage.getItem(`cq_code_${lang}_${levelId}`) || lessonData.code;
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: saved, language: lang === 'JavaScript' ? 'javascript' : (lang === 'Python' ? 'python' : 'cpp'),
                    theme: 'vs-dark', fontSize: 15, minimap: { enabled: false }, automaticLayout: true
                });
                setTimeout(() => { editor.layout(); }, 200);
                editor.onDidChangeModelContent(() => { localStorage.setItem(`cq_code_${lang}_${levelId}`, editor.getValue()); });
            });
        }

        function showHint() { alert(lessonData.hint ? "💡 " + lessonData.hint : "ركز وجرب!"); }

        function runCode() {
            if(!editor) return;
            const code = editor.getValue();
            const terminal = document.getElementById('terminalOutput');
            terminal.innerHTML += `<br><span style="color:#888;">> Running...</span><br>`;
            
            if (lang === 'JavaScript') {
                let oldLog = console.log;
                console.log = function(...args) {
                    terminal.innerHTML += `<span style="color:#00ff00;">> ${args.join(' ')}</span><br>`;
                    terminal.scrollTop = terminal.scrollHeight; oldLog(...args);
                };
                try { eval(code); } catch(e) { terminal.innerHTML += `<span style="color:#ff4444;">❌ ${e.message}</span><br>`; } finally { console.log = oldLog; }
            } else {
                const config = lang === 'Python' ? { language: 'python', version: '3.10.0' } : { language: 'c++', version: '10.2.0' };
                terminal.innerHTML += `<span style="color:#ffd700;">⏳ جاري التنفيذ...</span><br>`;
                fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: config.language, version: config.version, files: [{ content: code }] })
                }).then(res => res.json()).then(data => {
                    if(data.run && data.run.stdout) terminal.innerHTML += `<span style="color:#00ff00;">> ${data.run.stdout.replace(/\n/g, '<br>')}</span><br>`;
                    if(data.run && data.run.stderr) terminal.innerHTML += `<span style="color:#ff4444;">❌ ${data.run.stderr.replace(/\n/g, '<br>')}</span><br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                }).catch(e => { terminal.innerHTML += `<span style="color:#ff4444;">❌ خطأ في الاتصال.</span><br>`; });
            }
        }

        async function completeLesson() {
            confetti({ particleCount: 150, spread: 70 });
            const uid = Auth.getUserId();
            if (uid) {
                try {
                    await firebase.firestore().collection('users').doc(uid).update({
                        points: firebase.firestore.FieldValue.increment(50),
                        [`progress.${lang}.level${levelId}`]: { unlocked: true, stars: 3 },
                        [`progress.${lang}.level${levelId + 1}`]: { unlocked: true, stars: 0 }
                    });
                } catch(e) { console.error(e); }
            }
            setTimeout(() => { alert("🎉 مبروك! +50 نقطة"); window.location.href = 'levels.html'; }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init(l => { if(!l) window.location.href='login.html'; });
            loadData();
        });
    </script>
</body></html>
