<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>الاستوديو | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        body { height: 100vh; height: 100dvh; overflow: hidden; }
        .header { padding: 10px 15px; }
        .main-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .dialogue-phase { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background: #0a192f; z-index: 50; position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box; }
        .avatars-row { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .avatar-img { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #00e5ff; background: #000; object-fit: cover; }
        .user-avatar-img { border-color: #f59e0b; }
        .chat-bubble { background: rgba(0,0,0,0.8); border: 2px solid #00e5ff; padding: 20px; border-radius: 20px 20px 0 20px; margin-bottom: 20px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .cody-msg { margin: 0; line-height: 1.8; font-size: 1.1rem; }
        .btn-next { background: #00e5ff; color: #000; border: none; padding: 15px; border-radius: 15px; font-family: 'Cairo'; font-weight: 900; font-size: 1.2rem; width: 100%; max-width: 400px; cursor: pointer; }
        .coding-phase { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top:0; left:0; }
        .editor-wrapper { flex: 1; position: relative; background: #1e1e1e; width: 100%; min-height: 100px; }
        #editor-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .terminal-wrapper { height: 30%; background: #0a0a0a; border-top: 2px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .terminal-header { background: #1a1a1a; color: #00e5ff; padding: 5px 15px; font-size: 0.8rem; display: flex; justify-content: space-between; font-family: monospace; }
        .terminal-output { flex: 1; padding: 10px; font-family: monospace; color: #00ff00; overflow-y: auto; direction: ltr; text-align: left; font-size: 0.9rem; }
    </style>
</head><body>
    <div class="header">
        <h1 id="lessonTitle" style="font-size:1rem; margin:0;">جاري التحميل...</h1>
        <div id="headerBtns" style="display:none;">
            <button class="btn-run" style="background:#8b5cf6; color:#fff; border:none; padding:8px 12px; border-radius:8px; margin-left:5px;" onclick="showHint()">💡</button>
            <button class="btn-run" style="background:#10b981; color:#fff; border:none; padding:8px 12px; border-radius:8px; margin-left:5px;" onclick="runCode()">▶</button>
            <button class="btn-run" style="background:#f59e0b; color:#000; border:none; padding:8px 12px; border-radius:8px; margin-left:5px;" onclick="completeLesson()">✓</button>
        </div>
    </div>
    <div class="main-container">
        <div class="dialogue-phase" id="dialoguePhase">
            <div class="avatars-row"><img src="cody-avatar.svg" class="avatar-img"><img src="cody-avatar.svg" class="avatar-img user-avatar-img" id="userAvatarDialogue"></div>
            <div class="chat-bubble"><div class="cody-msg" id="codyMessage">أهلاً بك! أنا كودي.</div></div>
            <button class="btn-next" onclick="nextDialogueStep()">التالي ➡️</button>
        </div>
        <div class="coding-phase" id="codingPhase">
            <div class="editor-wrapper"><div id="editor-container"></div></div>
            <div class="terminal-wrapper">
                <div class="terminal-header"><span>CONSOLE</span><span onclick="document.getElementById('terminalOutput').innerHTML='> Ready...'" style="cursor:pointer; color: #ff4444;">مسح</span></div>
                <div class="terminal-output" id="terminalOutput">> Ready...</div>
            </div>
        </div>
    </div>
    <script>
        let editor; const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || localStorage.getItem('cq_language') || 'JavaScript';
        const levelId = parseInt(urlParams.get('level')) || 1; let lessonData = null;
        document.getElementById('userAvatarDialogue').src = localStorage.getItem('cq_avatar') || 'cody-avatar.svg';
        async function loadCurriculum() {
            try {
                const res = await fetch('curriculum.json'); const data = await res.json();
                lessonData = data[lang]?.[levelId] || data['JavaScript'][1];
                document.getElementById('lessonTitle').innerText = lessonData.title;
                document.getElementById('codyMessage').innerText = lessonData.intro;
            } catch(e) { console.error(e); }
        }
        function nextDialogueStep() {
            document.getElementById('dialoguePhase').style.display = 'none';
            document.getElementById('codingPhase').style.display = 'flex';
            document.getElementById('headerBtns').style.display = 'flex';
            setTimeout(initEditor, 100); 
        }
        function initEditor() {
            const saved = localStorage.getItem(`cq_code_${lang}_${levelId}`) || lessonData.code;
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: saved, language: lang === 'JavaScript' ? 'javascript' : (lang === 'Python' ? 'python' : 'cpp'),
                    theme: 'vs-dark', fontSize: 15, minimap: { enabled: false }, automaticLayout: true
                });
                setTimeout(() => { editor.layout(); }, 300);
                editor.onDidChangeModelContent(() => { localStorage.setItem(`cq_code_${lang}_${levelId}`, editor.getValue()); });
            });
        }
        function showHint() { alert(lessonData && lessonData.hint ? "💡 " + lessonData.hint : "ركز وجرب!"); }
        function runCode() {
            if(!editor) return; const code = editor.getValue(); const terminal = document.getElementById('terminalOutput');
            terminal.innerHTML += `<br><span style="color:#888;">> Running...</span><br>`;
            if (lang === 'JavaScript') {
                let oldLog = console.log; console.log = function(...args) { terminal.innerHTML += `<span style="color:#00ff00;">> ${args.join(' ')}</span><br>`; terminal.scrollTop = terminal.scrollHeight; oldLog(...args); };
                try { eval(code); } catch(e) { terminal.innerHTML += `<span style="color:#ff4444;">❌ Error: ${e.message}</span><br>`; } finally { console.log = oldLog; }
                    if (typeof Auth !== 'undefined' && Auth.getUserId()) { Auth.addPoints(10); console.log('🎉 +10 XP!'); }
            } else {
                const c = lang === 'Python' ? { language: 'python', version: '3.10.0' } : { language: 'c++', version: '10.2.0' };
                terminal.innerHTML += `<span style="color:#ffd700;">⏳ جاري التنفيذ...</span><br>`;
                fetch('https://emkc.org/api/v2/piston/execute', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ language: c.language, version: c.version, files: [{ content: code }] }) })
                .then(res => res.json()).then(data => {
                    if(data.run && data.run.stdout) terminal.innerHTML += `<span style="color:#00ff00;">> ${data.run.stdout.replace(/
/g, '<br>')}</span><br>`;
                    if(data.run && data.run.stderr) terminal.innerHTML += `<span style="color:#ff4444;">❌ ${data.run.stderr.replace(/
/g, '<br>')}</span><br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                });
            }
        }
        async function completeLesson() {
            confetti({ particleCount: 150, spread: 70 });
            const uid = Auth.getUserId();
            if (uid) { try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(50), [`progress.${lang}.level${levelId}`]: { unlocked: true, stars: 3 } }); } catch(e) {} }
            setTimeout(() => { alert("🎉 مبروك! +50 نقطة"); window.location.href = 'levels.html'; }, 1500);
        }
        document.addEventListener('DOMContentLoaded', loadCurriculum);
    </script>

    <!-- Cody AI Assistant Panel -->
    <style>
        #aiPanel { position: fixed; top: 0; left: -350px; width: 350px; height: 100vh; background: #0a0f1d; border-right: 2px solid #00E5FF; transition: left 0.3s ease; z-index: 1000; padding: 20px; box-sizing: border-box; direction: rtl; font-family: 'Cairo', sans-serif; box-shadow: 5px 0 15px rgba(0,229,255,0.1); }
        #aiPanel.open { left: 0; }
        #chatHistory { height: 70vh; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #fff; }
        #aiInput { width: 100%; padding: 10px; background: #111827; border: 1px solid #333; color: #fff; border-radius: 5px; margin-bottom: 5px; box-sizing: border-box; outline: none; }
        #aiInput:focus { border-color: #00E5FF; }
        .ai-btn { position: fixed; top: 20px; left: 20px; z-index: 1001; background: #8B5CF6; color: #fff; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); transition: transform 0.2s; }
        .ai-btn:hover { transform: scale(1.05); }
        .msg-user { background: rgba(0, 229, 255, 0.1); padding: 8px; border-radius: 8px; margin-bottom: 10px; border-right: 3px solid #00E5FF; }
        .msg-ai { background: rgba(52, 211, 153, 0.1); padding: 8px; border-radius: 8px; margin-bottom: 10px; border-right: 3px solid #34D399; }
    </style>

    <button class="ai-btn" onclick="toggleAI()">🤖 مساعد Cody</button>
    
    <div id="aiPanel">
        <h3 style="color: #00E5FF; margin-top: 0;">🤖 Cody AI</h3>
        <p style="color: #888; font-size: 12px; margin-bottom: 15px;">مساعدك الشخصي في كتابة الأكواد. اسألني عن أي خطأ!</p>
        <div id="chatHistory">
            <div class="msg-ai">مرحباً! أنا Cody. لو واجهت مشكلة في الكود، اسألني وسأعطيك تلميحاً.</div>
        </div>
        <input type="text" id="aiInput" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key === 'Enter') sendAIMessage()">
        <button onclick="sendAIMessage()" style="width: 100%; padding: 10px; background: #00E5FF; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: 'Cairo';">إرسال</button>
    </div>
    

    <script>
        function toggleAI() {
            const panel = document.getElementById('aiPanel');
            panel.classList.toggle('open');
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const msg = input.value.trim();
            if (!msg) return;

            addChatMessage('أنت', msg, 'user');
            input.value = '';

            // محاكاة تفكير الذكاء الاصطناعي
            setTimeout(() => {
                let reply = "أنا هنا لمساعدتك! جرب تشغل الكود الأول وتشوف النتيجة في الـ Terminal.";
                
                const code = editor ? editor.getValue() : "";

                if (msg.includes('خطأ') || msg.includes('error') || msg.includes('مشكلة') || msg.includes('مش شغال')) {
                    if (code.includes('console.log') && !code.includes(';')) {
                        reply = "يبدو أنك نسيت الفاصلة المنقوطة (;) في نهاية سطر console.log. في JavaScript، الفاصلة المنقوطة مهمة جداً!";
                    } else if (code.includes('if') && !code.includes('{')) {
                        reply = "تأكد من استخدام الأقواس المتعرجة {} بعد جملة if لتحديد الكود الذي سيتم تنفيذه.";
                    } else {
                        reply = "راجع الأقواس المتعرجة {} والفاصلة المنقوطة ;. جرب تشغل الكود وتقرأ رسالة الخطأ الحمراء في الـ Terminal، هي هتقولك المشكلة فين بالظبط.";
                    }
                } else if (msg.includes('حل') || msg.includes('تلميح') || msg.includes('مساعدة')) {
                    reply = "تلميحي لك: تأكد من تعريف المتغيرات (let أو const) قبل استخدامها، وتأكد من صياغة الشروط (if/else) بشكل صحيح.";
                } else if (msg.includes('شكرا')) {
                    reply = "على الرحب والسعة! استمر في التعلم والتطوير. 🚀";
                }

                addChatMessage('Cody AI', reply, 'ai');
            }, 800);
        }

        function addChatMessage(sender, text, type) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = type === 'user' ? 'msg-user' : 'msg-ai';
            div.innerHTML = `<strong style="color: ${type === 'user' ? '#00E5FF' : '#34D399'}; font-size: 12px;">${sender}:</strong><br><span style="font-size: 14px;">${text}</span>`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }
    </script>
    
</body></html>
