<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاستوديو | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: transparent; color: #fff; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(10, 25, 47, 0.95); border-bottom: 1px solid rgba(0,229,255,0.2); z-index: 100; }
        .header h1 { margin: 0; font-size: 1rem; color: #00e5ff; }
        .btn { border: none; padding: 8px 12px; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; font-size: 0.8rem; cursor: pointer; margin-left: 5px;}
        .btn-run { background: #28a745; color: white; }
        .btn-finish { background: #ffd700; color: #000; }
        .btn-hint { background: #8b5cf6; color: white; }

        .main-container { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; }
        
        /* شاشة الحوار */
        .dialogue-phase { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background: rgba(10, 25, 47, 0.95); z-index: 50; position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box; }
        .avatars-row { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .avatar-img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #00e5ff; background: #000; object-fit: cover;}
        .user-avatar-img { border-color: #ffd700; }
        .chat-bubble { background: rgba(0,0,0,0.8); border: 1px solid #00e5ff; padding: 20px; border-radius: 20px 20px 0 20px; margin-bottom: 20px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .cody-msg { margin: 0; line-height: 1.8; font-size: 1.1rem; }
        .btn-next { background: #00e5ff; color: #000; border: none; padding: 15px; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; width: 100%; max-width: 400px; cursor: pointer; }
        
        /* شاشة الكود - التعديل الجوهري هنا */
        .coding-phase { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top:0; left:0; }
        .editor-wrapper { flex: 1; position: relative; background: #1e1e1e; min-height: 300px; width: 100%;}
        #editor-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        
        .terminal-wrapper { height: 35%; background: #0a0a0a; border-top: 2px solid #333; display: flex; flex-direction: column; }
        .terminal-header { background: #1a1a1a; color: #888; padding: 5px 15px; font-size: 0.8rem; display: flex; justify-content: space-between; font-family: monospace; }
        .terminal-output { flex: 1; padding: 10px; font-family: monospace; color: #00ff00; overflow-y: auto; direction: ltr; text-align: left; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="lessonTitle">جاري التحميل...</h1>
        <div id="headerBtns" style="display:none;">
            <button class="btn btn-hint" onclick="showHint()">💡 تلميح</button>
            <button class="btn btn-run" onclick="runCode()">▶ تشغيل</button>
            <button class="btn btn-finish" onclick="completeLesson()">✓ إنهاء</button>
        </div>
    </div>

    <div class="main-container">
        <div class="dialogue-phase" id="dialoguePhase">
            <div class="avatars-row">
                <img src="cody-avatar.svg" class="avatar-img">
                <img src="cody-avatar.svg" class="avatar-img user-avatar-img" id="userAvatarDialogue">
            </div>
            <div class="chat-bubble">
                <div class="cody-msg" id="codyMessage">أهلاً بك! أنا كودي. اضغط على الزر أدناه لبدء الدرس.</div>
            </div>
            <button class="btn-next" onclick="nextDialogueStep()">التالي ➡️</button>
        </div>

        <div class="coding-phase" id="codingPhase">
            <div class="editor-wrapper"><div id="editor-container"></div></div>
            <div class="terminal-wrapper">
                <div class="terminal-header"><span><i class="ri-terminal-line"></i> CONSOLE</span><span onclick="document.getElementById('terminalOutput').innerHTML='> Ready...'" style="cursor:pointer; color: #ff4444;">مسح 🗑️</span></div>
                <div class="terminal-output" id="terminalOutput">> Ready...</div>
            </div>
        </div>
    </div>

    <script>
        let editor;
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || localStorage.getItem('cq_language') || 'JavaScript';
        const levelId = parseInt(urlParams.get('level')) || 1;
        let lessonData = null;

        const userAvatar = localStorage.getItem('cq_avatar') || 'cody-avatar.svg';
        document.getElementById('userAvatarDialogue').src = userAvatar;

        async function loadCurriculum() {
            try {
                const response = await fetch('curriculum.json');
                const data = await response.json();
                lessonData = data[lang]?.[levelId] || data['JavaScript'][1];
                
                document.getElementById('lessonTitle').innerText = lessonData.title;
                document.getElementById('codyMessage').innerText = lessonData.intro;

            } catch(e) { console.error(e); }
        }

        function nextDialogueStep() {
            document.getElementById('dialoguePhase').style.display = 'none';
            document.getElementById('codingPhase').style.display = 'flex';
            document.getElementById('headerBtns').style.display = 'flex';
            initEditor();
        }

        function initEditor() {
            const savedCode = localStorage.getItem(`cq_code_${lang}_${levelId}`) || lessonData.code;
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: savedCode, language: lang === 'js' || lang === 'JavaScript' ? 'javascript' : (lang === 'Python' ? 'python' : 'cpp'),
                    theme: 'vs-dark', fontSize: 16, minimap: { enabled: false }, automaticLayout: true, scrollBeyondLastLine: false
                });
                // إجبار المحرر على أخذ مساحته بعد الظهور
                setTimeout(() => { editor.layout(); }, 200);

                editor.onDidChangeModelContent(() => {
                    localStorage.setItem(`cq_code_${lang}_${levelId}`, editor.getValue());
                });
            });
        }

        function showHint() {
            if(lessonData && lessonData.hint) alert("💡 تلميح كودي:
" + lessonData.hint);
            else alert("💡 ركز في الكود وجرب تشغله!");
        }

        function runCode() {
            if(!editor) return;
            const code = editor.getValue();
            const terminal = document.getElementById('terminalOutput');
            terminal.innerHTML += `<br><span style="color:#888;">> Running...</span><br>`;
            
            // JavaScript
            if (lang === 'js' || lang === 'JavaScript') {
                let originalLog = console.log;
                console.log = function(...args) {
                    terminal.innerHTML += `<span style="color:#00ff00;">> ${args.join(' ')}</span><br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                    originalLog.apply(console, args);
                };
                try { eval(code); } 
                catch (err) { terminal.innerHTML += `<span style="color:#ff4444;">❌ Error: ${err.message}</span><br>`; } 
                finally { console.log = originalLog; }
            } 
            // Python & C++
            else {
                const langMap = {
                    'Python': { language: 'python', version: '3.10.0' },
                    'C++': { language: 'c++', version: '10.2.0' }
                };
                const config = langMap[lang] || langMap['Python'];
                terminal.innerHTML += `<span style="color:#ffd700;">⏳ جاري التنفيذ...</span><br>`;
                
                fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: config.language, version: config.version, files: [{ content: code }] })
                }).then(res => res.json()).then(data => {
                    if (data.run) {
                        if (data.run.stdout) terminal.innerHTML += `<span style="color:#00ff00;">> ${data.run.stdout.replace(/
/g, '<br>')}</span><br>`;
                        if (data.run.stderr) terminal.innerHTML += `<span style="color:#ff4444;">❌ Error: ${data.run.stderr.replace(/
/g, '<br>')}</span><br>`;
                        if (!data.run.stdout && !data.run.stderr) terminal.innerHTML += `<span style="color:#888;">تم التنفيذ بدون مخرجات.</span><br>`;
                    } else {
                        terminal.innerHTML += `<span style="color:#ffd700;">⚠️ تعذر التنفيذ.</span><br>`;
                    }
                    terminal.scrollTop = terminal.scrollHeight;
                }).catch(e => {
                    terminal.innerHTML += `<span style="color:#ff4444;">❌ خطأ في الاتصال.</span><br>`;
                });
            }
        }

        async function completeLesson() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00e5ff', '#ffd700'] });
            const uid = Auth.getUserId();
            if (uid) {
                try {
                    await firebase.firestore().collection('users').doc(uid).update({
                        points: firebase.firestore.FieldValue.increment(50),
                        [`progress.${lang}.level${levelId}`]: { unlocked: true, stars: 3 },
                        [`progress.${lang}.level${levelId + 1}`]: { unlocked: true, stars: 0 }
                    });
                } catch(e) { console.error(e); }
            }
            setTimeout(() => { alert("🎉 مبروك! حصلت على 50 نقطة."); window.location.href = 'levels.html'; }, 1500);
        }

        document.addEventListener('DOMContentLoaded', loadCurriculum);
    </script>
</body>
</html>
