<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتعلم مع كودي - CodeQuest</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/curriculum.js"></script> <!-- ملف المنهج -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/min/vs/loader.js"></script>
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.5); border-bottom: 2px solid var(--primary); }
        .lang-selector { padding: 8px; background: #111; color: white; border: 1px solid var(--primary); border-radius: 5px; font-family: 'Cairo'; outline: none; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .chat-side { flex: 1; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.1); background: rgba(17, 24, 39, 0.8); }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 1rem; }
        .msg.cody { background: rgba(139, 92, 246, 0.2); border: 1px solid var(--secondary); align-self: flex-start; border-top-right-radius: 0; }
        
        .editor-side { flex: 1.5; display: flex; flex-direction: column; }
        #editor-container { flex: 1; width: 100%; }
        .terminal { height: 150px; background: #000; color: #0f0; padding: 10px; font-family: 'JetBrains Mono', monospace; overflow-y: auto; direction: ltr; text-align: left; border-top: 1px solid #333; }
        .controls { padding: 10px; background: #1e1e1e; display: flex; gap: 10px; justify-content: flex-end; }
        
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .chat-side { flex: 0.8; border-left: none; border-bottom: 1px solid #333; }
            .editor-side { flex: 1.2; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="btn-secondary" style="padding: 5px 15px; font-size: 14px; text-decoration: none;">⬅️ الرئيسية</a>
        <h2 style="color: var(--primary); font-size: 1.2rem;" id="levelTitle">المستوى 1</h2>
        <select id="langSelect" class="lang-selector" onchange="changeLanguage(this.value)">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
        </select>
    </div>

    <div class="main-container">
        <div class="chat-side">
            <div class="chat-history" id="chatHistory"></div>
        </div>
        <div class="editor-side">
            <div id="editor-container"></div>
            <div class="terminal" id="terminalOutput">> جاهز للتشغيل...</div>
            <div class="controls">
                <button class="btn-primary" onclick="runCode()" style="padding: 8px 20px;">▶️ تشغيل (Run)</button>
            </div>
        </div>
    </div>

    <script>
        let editor;
        let currentLang = 'javascript';
        let currentLevelIndex = 0;
        let lessonCompleted = false;

        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "// جاري التحميل...",
                language: 'javascript',
                theme: 'vs-dark',
                fontFamily: 'JetBrains Mono',
                fontSize: 15,
                minimap: { enabled: false },
                automaticLayout: true
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((loggedIn) => {
                if(!loggedIn) window.location.href = 'login.html';
                else {
                    const name = Auth.getUserData()?.username || 'البطل';
                    addMessage('cody', `أهلاً يا ${name}! أنا كودي. هنبدأ رحلة التعلم! 🚀`);
                    setTimeout(() => loadLevel(), 500);
                }
            });
        });

        function addMessage(sender, text) {
            const history = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            currentLevelIndex = 0;
            monaco.editor.setModelLanguage(editor.getModel(), lang === 'cpp' ? 'cpp' : lang);
            addMessage('cody', `يلا بينا نتعلم <b>${lang.toUpperCase()}</b> من الأول! 🔥`);
            setTimeout(() => loadLevel(), 500);
        }

        function loadLevel() {
            lessonCompleted = false;
            const langData = curriculumData[currentLang];
            
            if (currentLevelIndex >= langData.length) {
                document.getElementById('levelTitle').innerText = "أنهيت المسار! 🏆";
                addMessage('cody', `مذهل! لقد أكملت كل مستويات ${currentLang.toUpperCase()}. جرب لغة تانية أو روح للألعاب!`);
                editor.setValue("// لقد أكملت المسار بنجاح!");
                return;
            }

            const lesson = langData[currentLevelIndex];
            document.getElementById('levelTitle').innerText = `المستوى ${lesson.level}: ${lesson.title}`;
            
            addMessage('cody', `🎯 <b>المستوى الجديد:</b> ${lesson.title}<br><br>مهمتك: <span style="color:var(--accent);">${lesson.task}</span>`);
            editor.setValue(lesson.starter);
        }

        async function runCode() {
            const code = editor.getValue();
            const terminal = document.getElementById('terminalOutput');
            terminal.innerHTML = "> جاري التشغيل...";

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: currentLang,
                        version: "*",
                        files: [{ content: code }]
                    })
                });
                
                const data = await response.json();
                
                if (data.run && data.run.stdout) {
                    terminal.innerHTML = data.run.stdout.replace(/\n/g, '<br>');
                    checkAnswer(data.run.stdout.trim());
                } else if (data.run && data.run.stderr) {
                    terminal.innerHTML = `<span style="color:#F87171;">${data.run.stderr}</span>`;
                } else {
                    terminal.innerHTML = "> لا يوجد مخرجات (تأكد من كتابة الكود).";
                }
            } catch (error) {
                terminal.innerHTML = `<span style="color:#F87171;">خطأ في الاتصال بالسيرفر.</span>`;
            }
        }

        async function checkAnswer(output) {
            if (lessonCompleted) return; 

            const langData = curriculumData[currentLang];
            const expected = langData[currentLevelIndex].expected;

            if (output.includes(expected)) {
                lessonCompleted = true;
                addMessage('cody', `🎉 عاش جداً! إجابة صحيحة. خدت <b>30 XP</b>!`);
                
                const added = await Auth.addPoints(30);
                if (added) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); playSound('success');
                    setTimeout(() => {
                        currentLevelIndex++;
                        loadLevel(); // الانتقال للمستوى التالي أوتوماتيك
                    }, 3000);
                }
            } else {
                playSound('error'); addMessage('cody', `النتيجة مش متطابقة. راجع الكود وجرب تاني، أنا معاك! 💪`);
            }
        }
    </script>
    <script src="global.js"></script>
</body>
</html>
