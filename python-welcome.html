<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بك | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(107,232,255,0.1), transparent 60%); }
    .top-nav { width: 100%; max-width: 600px; margin-bottom: 20px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; }
    .welcome-container { width: 100%; max-width: 600px; background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px; backdrop-filter: blur(20px); text-align: center; }
    .cody-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #00d2ff, #3a7bd5); display: grid; place-items: center; font-size: 2.5rem; margin: 0 auto 20px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.4); }
    .bubble-text { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 16px; padding: 20px; font-size: 1.1rem; line-height: 1.8; margin-bottom: 25px; }
    .btn-start { display: inline-flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 18px; background: var(--cyan); color: #000; border: none; border-radius: 16px; font-weight: 900; font-size: 1.2rem; cursor: pointer; font-family: 'Cairo'; text-decoration: none; transition: 0.3s; }
    .btn-start:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="top-nav"><a href="languages.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للمسارات</a></div>
  <div class="welcome-container">
    <div class="cody-avatar">🤖</div>
    <div class="bubble-text">
      أهلًا يا بطل! أنا كودي، وهنكون مع بعض في رحلة نتعلم فيها إزاي نخلي الكمبيوتر يفهم أوامرنا. مش مطلوب منك تكون عارف برمجة قبل كده، هنبدأ من الصفر ونتقدم خطوة بخطوة.
    </div>
    <a href="python-chapters.html" class="btn-start">يلا نبدأ رحلة بايثون! 🚀</a>
  </div>
</body>
</html>
