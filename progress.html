<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقدمي | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: var(--bg-deep); padding: var(--space-l); }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); }
        .header h1 { font-size: 2rem; color: var(--text-primary); }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-m); }
        .card { background: var(--bg-panel); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: var(--space-l); }
        
        .gauge-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gauge { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--primary) 65%, var(--border-soft) 0); display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: var(--space-m); }
        .gauge::before { content: ''; position: absolute; width: 120px; height: 120px; background: var(--bg-panel); border-radius: 50%; }
        .gauge-value { position: relative; font-size: 2rem; font-weight: 900; color: var(--text-primary); }
        
        .chart-container { height: 200px; display: flex; align-items: flex-end; justify-content: space-between; padding-top: var(--space-m); }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 12%; }
        .bar { width: 100%; background: var(--primary); border-radius: var(--radius-button) var(--radius-button) 0 0; transition: height 1s ease; }
        .bar-label { font-size: 0.8rem; color: var(--text-muted); }
        
        .stats-list { display: flex; flex-direction: column; gap: var(--space-s); margin-top: var(--space-m); }
        .stat-row { display: flex; justify-content: space-between; padding: 15px; background: var(--bg-deep); border-radius: var(--radius-button); border: 1px solid var(--border-soft); color: var(--text-primary); font-weight: 600; }
        
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>تقدمك في التعلم</h1>
            <a href="dashboard.html" class="btn-secondary"><i class="ri-home-5-line"></i> الرئيسية</a>
        </div>

        <div class="dashboard-grid">
            <div class="card gauge-container">
                <h3 style="color: var(--text-secondary); margin-bottom: 20px;">نسبة الإنجاز</h3>
                <div class="gauge">
                    <div class="gauge-value" id="overallProgress">0%</div>
                </div>
                <p style="color: var(--text-muted); font-size: 0.9rem;">استمر في التعلم للوصول إلى 100%</p>
            </div>

            <div class="card">
                <h3 style="color: var(--text-secondary); margin-bottom: 10px;">تطور الأداء الأسبوعي</h3>
                <div class="chart-container">
                    <div class="bar-wrapper"><div class="bar" style="height: 20%;"></div><span class="bar-label">السبت</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 40%;"></div><span class="bar-label">الأحد</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 60%;"></div><span class="bar-label">الإثنين</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 35%;"></div><span class="bar-label">الثلاثاء</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 80%;"></div><span class="bar-label">الأربعاء</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 50%;"></div><span class="bar-label">الخميس</span></div>
                    <div class="bar-wrapper"><div class="bar" style="height: 90%;"></div><span class="bar-label">الجمعة</span></div>
                </div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h3 style="color: var(--text-secondary); margin-bottom: 10px;">إحصائياتك التفصيلية</h3>
                <div class="stats-list">
                    <div class="stat-row"><span><i class="ri-book-open-line" style="color: var(--primary);"></i> الدروس المكتملة</span> <span id="lessonsStat">0</span></div>
                    <div class="stat-row"><span><i class="ri-code-s-slash-line" style="color: var(--accent-purple);"></i> التمارين الناجحة</span> <span id="exercisesStat">0</span></div>
                    <div class="stat-row"><span><i class="ri-folder-code-line" style="color: var(--accent-orange);"></i> المشاريع المبنية</span> <span id="projectsStat">0</span></div>
                    <div class="stat-row"><span><i class="ri-gamepad-line" style="color: var(--accent-green);"></i> الألعاب المكتملة</span> <span id="gamesStat">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc } from './js/app.js';

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                if (snap.exists()) {
                    const data = snap.data();
                    const xp = data.xp || 0;
                    const progressPercent = Math.min(Math.round((xp / 500) * 100), 100);
                    
                    document.getElementById('overallProgress').innerText = progressPercent + '%';
                    document.querySelector('.gauge').style.background = `conic-gradient(var(--primary) ${progressPercent}%, var(--border-soft) 0)`;
                    
                    document.getElementById('lessonsStat').innerText = Math.floor(xp / 50);
                    document.getElementById('exercisesStat').innerText = Math.floor(xp / 70);
                    document.getElementById('projectsStat').innerText = (data.inventory || []).length > 0 ? 1 : 0;
                    document.getElementById('gamesStat').innerText = Math.floor(xp / 100);
                }
            }
        });
    </script>
</body>
</html>
