services:
  - type: web
    name: codequest-cody-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FIREBASE_PROJECT_ID
        value: codequest-6350a
      - key: CORS_ORIGINS
        value: https://mariam2009m44-lab.github.io
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
