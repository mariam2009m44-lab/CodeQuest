services:
  - type: web
    name: codequest-admin-portal
    runtime: python
    plan: free
    buildCommand: pip install -r admin-portal/requirements.txt && cd admin-portal && python manage.py collectstatic --noinput
    startCommand: cd admin-portal && python manage.py migrate --noinput && python manage.py ensure_admin_roles && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_COOKIES
        value: "true"
      - key: DJANGO_SSL_REDIRECT
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "3600"
      - key: FIREBASE_ADMIN_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: codequest-6350a
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: DJANGO_ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: DJANGO_ADMIN_BOOTSTRAP_PASSWORD
        sync: false
