name = "codequest"
main = "worker.js"
compatibility_date = "2026-10-30"

[vars]
FIREBASE_PROJECT_ID = "codequest-6350a"
ALLOWED_ORIGIN = "https://mariam2009m44-lab.github.io"
ALLOWED_ORIGINS = "https://codequest-mu-six.vercel.app,https://pilot-optin.codequest-preview.pages.dev"
ENVIRONMENT = "production"
GEMINI_MODEL = "gemini-3.8-flash"

[[kv_namespaces]]
binding = "QUIZ_ANSWERS"
id = "99de09069f1a4c82b5155b5a70739f5b"

[[durable_objects.bindings]]
name = "CODE_EXECUTION_LIMITER"
class_name = "CodeExecutionLimiter"

[[durable_objects.bindings]]
name = "STUDENT_PROGRESS"
class_name = "StudentProgress"

[[durable_objects.bindings]]
name = "ACADEMY_DIRECTORY"
class_name = "AcademyDirectory"

[[migrations]]
tag = "v1-code-execution-limiter"
new_sqlite_classes = ["CodeExecutionLimiter"]

# Adds the StudentProgress class (additive, SQLite-backed, Free-plan compatible). Rollback is roll-forward only: wrangler rollback is refused
# across a Durable Object class change, and the class and its records are never deleted as a rollback step.
# PROGRESS_WRITES and CERT_ISSUANCE are intentionally NOT set here: with them unset every progress write route and certificate issuance answer 503.
# Turn them on only through a reviewed commit that adds them to [vars].
# Pilot (lesson-test route only): set PROGRESS_PILOT_EMAILS or PROGRESS_PILOT_UIDS as Cloudflare dashboard SECRETS (they survive deploys and stay out of the repo).
[[migrations]]
tag = "v2-student-progress"
new_sqlite_classes = ["StudentProgress"]

# Adds AcademyDirectory (additive, SQLite-backed, Free-plan compatible). ACADEMY_APPLICATIONS is intentionally unset: every academy route answers 503 until a reviewed commit turns it on.
[[migrations]]
tag = "v3-academy-directory"
new_sqlite_classes = ["AcademyDirectory"]

[previews.vars]
FIREBASE_PROJECT_ID = "codequest-6350a"
ALLOWED_ORIGIN = "https://codequest-preview.pages.dev"
ENVIRONMENT = "preview"
CURRICULUM_BASE_URL = "https://raw.githubusercontent.com/mariam2009m44-lab/CodeQuest/fix/cloudflare-code-runner"
