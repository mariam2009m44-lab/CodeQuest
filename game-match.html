<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | بازل الأكواد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;}
.header{text-align:center;margin-bottom:20px;color:#ffd700;}
.board{max-width:500px;margin:auto;display:flex;flex-direction:column;gap:15px;}
.slot{background:rgba(0,229,255,0.05);border:2px dashed #00e5ff;border-radius:15px;min-height:60px;display:flex;align-items:center;justify-content:center;padding:10px;font-weight:bold;transition:0.3s;}
.slot.hover{background:rgba(0,229,255,0.2);transform:scale(1.02);}
.slot.filled{border-style:solid;background:rgba(39,174,96,0.2);border-color:#27ae60;}
.pieces{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px;}
.piece{background:linear-gradient(135deg,#00e5ff,#0072ff);padding:12px 20px;border-radius:12px;font-family:monospace;cursor:grab;font-weight:bold;color:#fff;box-shadow:0 5px 15px rgba(0,114,255,0.4);}
.piece:active{cursor:grabbing;transform:scale(1.1);}
</style>
</head>
<body>
<h1 class="header">🧩 بازل الأكواد</h1>
<div class="board" id="board"></div>
<div class="pieces" id="pieces"></div>

<script>
const pairs = [
    { code: 'let x = 5;', result: 'يعرف متغير' },
    { code: 'if (x>0)', result: 'شرط لو أكبر' },
    { code: 'console.log()', result: 'يطبع رسالة' }
];
let score = 0; let matched = 0;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        initGame();
    });
});

function initGame() {
    const board = document.getElementById('board');
    const pieces = document.getElementById('pieces');
    board.innerHTML = ''; pieces.innerHTML = '';
    
    pairs.forEach((p, i) => {
        board.innerHTML += `<div class="slot" data-correct="${p.code}" id="slot-${i}">${p.result}</div>`;
    });

    const shuffled = [...pairs].sort(() => Math.random() - 0.5);
    shuffled.forEach(p => {
        pieces.innerHTML += `<div class="piece" draggable="true" data-code="${p.code}">${p.code}</div>`;
    });

    let dragged;
    document.querySelectorAll('.piece').forEach(piece => {
        piece.addEventListener('dragstart', (e) => { dragged = e.target; e.target.style.opacity = '0.5'; });
        piece.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
    });

    document.querySelectorAll('.slot').forEach(slot => {
        slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('hover'); });
        slot.addEventListener('dragleave', () => { slot.classList.remove('hover'); });
        slot.addEventListener('drop', (e) => {
            e.preventDefault(); slot.classList.remove('hover');
            if(slot.classList.contains('filled')) return;
            
            if(slot.dataset.correct === dragged.dataset.code) {
                slot.classList.add('filled');
                slot.innerText = dragged.dataset.code + ' ✅';
                dragged.remove();
                score += 10; matched++;
                try { playSound('success'); } catch(e){}
                try { confetti({ particleCount: 50 }); } catch(e){}
                
                if(matched === pairs.length) {
                    finishGame();
                }
            } else {
                try { playSound('error'); } catch(e){}
                slot.style.borderColor = '#e74c3c';
                setTimeout(() => slot.style.borderColor = '', 500);
            }
        });
    });
}

async function finishGame() {
    try { confetti({ particleCount: 200, spread: 100 }); } catch(e){}
    alert('🎉 مبروك! خلصت اللعبة وكسبت ' + score + ' نقطة!');
    
    // حفظ أعلى نتيجة
    const uid = Auth.getUserId();
    if(uid) {
        const ref = firebase.firestore().collection('users').doc(uid).collection('highscores').doc('match');
        const doc = await ref.get();
        if(!doc.exists || score > doc.data().score) {
            await ref.set({ score: score });
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(score) });
        }
    }
    setTimeout(() => window.location.href = 'games.html', 1000);
}
</script>
</body></html>
