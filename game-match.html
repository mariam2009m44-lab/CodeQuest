<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازل الأكواد | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); z-index: 100; }
        .header h1 { margin: 0; font-size: 1.3rem; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-back:hover { background: var(--neon-cyan); color: #000; }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 30px; width: 100%; max-width: 600px; margin: 0 auto; }
        
        .question-text { text-align: center; color: #ccc; font-size: 1.1rem; margin-bottom: 10px; }
        
        /* منطقة الهدف (فوق) */
        .target-zone { width: 100%; min-height: 120px; background: rgba(0,0,0,0.6); border: 2px dashed rgba(0,229,255,0.4); border-radius: 20px; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; transition: 0.3s; }
        .target-zone.correct { border-color: #28a745; background: rgba(40, 167, 69, 0.1); box-shadow: 0 0 20px rgba(40,167,69,0.3); }
        .target-zone.wrong { border-color: #ff4444; background: rgba(255, 68, 68, 0.1); animation: shake 0.5s; }
        
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }

        /* منطقة القطع (تحت) */
        .pieces-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; }
        
        .code-piece { background: #1e1e1e; border: 1px solid #444; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 1.1rem; color: #00e5ff; transition: 0.2s; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); direction: ltr; }
        .code-piece:hover { border-color: var(--neon-cyan); transform: translateY(-3px); box-shadow: 0 0 15px rgba(0,229,255,0.3); }
        .code-piece.placed { background: #0a0a0a; border-color: #28a745; color: #fff; cursor: pointer; }
        .code-piece.placed:hover { border-color: #ff4444; box-shadow: 0 0 15px rgba(255,68,68,0.3); }
        
        .controls { display: flex; gap: 15px; width: 100%; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-reset { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-check { background: linear-gradient(135deg, #00e5ff, #007bff); color: #000; box-shadow: 0 0 20px rgba(0,229,255,0.4); }
        
        /* شاشة الفوز */
        .success-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .success-modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid var(--gold); border-radius: 30px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; }
        .success-modal.active .modal-content { transform: scale(1); }
        .modal-content h2 { color: var(--gold); font-size: 2.5rem; margin: 0 0 10px; }
        .modal-content p { font-size: 1.2rem; color: #fff; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="games.html" class="btn-back">← رجوع</a>
        <h1>🧩 بازل الأكواد</h1>
        <div style="width: 70px;"></div> <!-- للتوازن -->
    </div>

    <div class="game-area">
        <div class="question-text">رتب القطع لبناء كود يطبع "Hello World"</div>
        
        <div class="target-zone" id="targetZone">
            <!-- القطع المختارة هتظهر هنا -->
        </div>

        <div class="pieces-container" id="piecesContainer">
            <!-- القطع المتاحة هتظهر هنا -->
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetGame()">↺ إعادة</button>
            <button class="btn btn-check" onclick="checkCode()">✓ تحقق من الحل</button>
        </div>
    </div>

    <!-- شاشة الفوز -->
    <div class="success-modal" id="successModal">
        <div class="modal-content">
            <h2>🎉 عاش يا بطل!</h2>
            <p>لقد قمت ببناء الكود بنجاح</p>
            <button class="btn btn-check" style="width: 100%;" onclick="claimReward()">احصل على 20 نقطة</button>
        </div>
    </div>

    <script>
        // الكود الصحيح بالترتيب
        const correctCode = ['console.log', '(', '"Hello World"', ')', ';'];
        // لخبطة القطع
        let availablePieces = [...correctCode];
        // القطع اللي الطالب حطها
        let userBuild = [];

        const targetZone = document.getElementById('targetZone');
        const piecesContainer = document.getElementById('piecesContainer');

        function initGame() {
            userBuild = [];
            targetZone.innerHTML = '';
            targetZone.className = 'target-zone';
            
            // خلط القطع عشوائياً
            availablePieces = [...correctCode].sort(() => Math.random() - 0.5);
            
            renderPieces();
        }

        function renderPieces() {
            piecesContainer.innerHTML = '';
            availablePieces.forEach((piece, index) => {
                if (!userBuild.includes(piece)) {
                    const el = document.createElement('div');
                    el.className = 'code-piece';
                    el.innerText = piece;
                    el.onclick = () => addPiece(piece);
                    piecesContainer.appendChild(el);
                }
            });
        }

        function addPiece(piece) {
            userBuild.push(piece);
            
            // عرض القطعة في منطقة الهدف
            const el = document.createElement('div');
            el.className = 'code-piece placed';
            el.innerText = piece;
            // لو الطالب داس عليها تاني ترجع
            el.onclick = () => removePiece(piece);
            targetZone.appendChild(el);
            
            // إخفاء القطعة من تحت
            renderPieces();
        }

        function removePiece(piece) {
            // إزالة القطعة من الترتيب
            const index = userBuild.indexOf(piece);
            if (index > -1) {
                userBuild.splice(index, 1);
            }
            // إعادة رسم المنطقة
            targetZone.innerHTML = '';
            userBuild.forEach(p => {
                const el = document.createElement('div');
                el.className = 'code-piece placed';
                el.innerText = p;
                el.onclick = () => removePiece(p);
                targetZone.appendChild(el);
            });
            renderPieces();
        }

        function resetGame() {
            initGame();
        }

        function checkCode() {
            // التأكد من الترتيب
            if (userBuild.join(' ') === correctCode.join(' ')) {
                // صح
                targetZone.classList.add('correct');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00e5ff', '#ffd700'] });
                document.getElementById('successModal').classList.add('active');
            } else {
                // غلط
                targetZone.classList.add('wrong');
                setTimeout(() => { targetZone.classList.remove('wrong'); }, 500);
            }
        }

        async function claimReward() {
            const uid = Auth.getUserId();
            if (uid) {
                try {
                    await firebase.firestore().collection('users').doc(uid).update({
                        points: firebase.firestore.FieldValue.increment(20) // 20 نقطة
                    });
                } catch(e) { console.error(e); }
            }
            // العودة لصفحة الألعاب
            window.location.href = 'games.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                initGame();
            });
        });
    </script>
</body>
</html>
