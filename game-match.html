<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>البازل</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}.slot{background:rgba(0,229,255,0.1);border:2px dashed #00e5ff;border-radius:15px;padding:15px;margin-bottom:10px;min-height:50px;}.piece{background:#00e5ff;color:#000;padding:10px;border-radius:10px;font-family:monospace;display:inline-block;margin:5px;cursor:pointer;}</style></head><body><h2 style="color:#ffd700;">🧩 بازل الأكواد</h2><div id="board"></div><div id="pool"></div><script>const pairs=[{c:'let x=5',r:'متغير'},{c:'if(x>0)',r:'شرط'}];let score=0,matched=0;document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){document.getElementById('board').innerHTML=pairs.map((p,i)=>`<div class="slot" data-c="${p.c}">${p.r}</div>`).join('');document.getElementById('pool').innerHTML=[...pairs].sort(()=>Math.random()-0.5).map(p=>`<span class="piece" onclick="match(this,'${p.c}')">${p.c}</span>`).join('');}function match(el,c){const slot=document.querySelector(`.slot[data-c="${c}"]`);if(slot&&!slot.classList.contains('filled')){slot.classList.add('filled');slot.innerText=c+' ✅';el.remove();score+=10;matched++;if(matched===2)finish();}}async function finish(){alert('ربحت '+score+' نقطة!');const uid=Auth.getUserId();if(uid)await firebase.firestore().collection('users').doc(uid).update({bonusPoints:firebase.firestore.FieldValue.increment(score)});window.location.href='games.html';}</script></body></html>
