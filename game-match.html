<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070B14">
  <meta name="description" content="لعبة ترتيب قطع الكود في CodeQuest">
  <title>بازل الأكواد | CodeQuest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #11192a;
      --border: rgba(148, 163, 184, .2);
      --cyan: #22d3ee;
      --purple: #a78bfa;
      --muted: #a7b2c5;
      --success: #34d399;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px 100px;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at top, rgba(34, 211, 238, .1), transparent 48%),
        var(--bg);
      font-family: "Cairo", sans-serif;
    }

    button, a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--cyan);
      text-decoration: none;
      font-weight: 800;
    }

    .game-title {
      margin: 0;
      color: var(--cyan);
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 900;
    }

    .game-card {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(17, 25, 42, .92);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .2);
    }

    .intro, .objective {
      line-height: 1.9;
      text-align: center;
    }

    .intro {
      margin: 0 0 8px;
      color: var(--muted);
    }

    .objective {
      margin: 0 0 24px;
      font-weight: 700;
    }

    .objective code {
      color: var(--purple);
      direction: ltr;
      unicode-bidi: isolate;
    }

    .section-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 800;
    }

    .target-zone {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 110px;
      margin-bottom: 24px;
      padding: 16px;
      border: 2px dashed rgba(34, 211, 238, .45);
      border-radius: 18px;
      background: rgba(0, 0, 0, .18);
    }

    .target-zone.correct {
      border-color: var(--success);
      background: rgba(52, 211, 153, .08);
    }

    .target-zone.incorrect {
      border-color: var(--danger);
    }

    .empty-message {
      color: #8491a7;
      font-size: .9rem;
      text-align: center;
    }

    .pieces {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 55px;
      margin-bottom: 24px;
    }

    .piece {
      max-width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(167, 139, 250, .35);
      border-radius: 12px;
      background: #151b2b;
      color: #c4b5fd;
      font-family: ui-monospace, Consolas, monospace;
      font-size: .98rem;
      overflow-wrap: anywhere;
      direction: ltr;
      unicode-bidi: isolate;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }

    .piece:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--cyan);
    }

    .piece.placed {
      border-color: rgba(52, 211, 153, .45);
      background: rgba(52, 211, 153, .08);
      color: #d1fae5;
    }

    .piece:disabled {
      cursor: default;
      opacity: .8;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .action-button {
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #172033;
      color: #f8fafc;
      font-weight: 800;
      cursor: pointer;
    }

    .action-button.primary {
      border-color: transparent;
      background: linear-gradient(135deg, #0891b2, #6366f1);
    }

    .action-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .feedback {
      min-height: 32px;
      margin: 18px 0 0;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.error {
      color: var(--danger);
    }

    .feedback.info {
      color: var(--cyan);
    }

    .reward {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid rgba(52, 211, 153, .3);
      border-radius: 16px;
      background: rgba(52, 211, 153, .07);
      text-align: center;
    }

    .reward.visible {
      display: block;
    }

    .reward h2 {
      margin: 0 0 8px;
      color: var(--success);
      font-size: 1.15rem;
    }

    .reward p {
      margin: 0;
      color: #d1fae5;
      line-height: 1.8;
    }

    .mobile-bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      display: flex;
      justify-content: space-around;
      gap: 4px;
      padding: 10px 4px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(148, 163, 184, .15);
      background: rgba(7, 11, 20, .96);
      backdrop-filter: blur(16px);
    }

    .mobile-nav-item {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: .72rem;
      text-decoration: none;
    }

    .mobile-nav-item i {
      font-size: 1.35rem;
    }

    .mobile-nav-item.active {
      color: var(--cyan);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px 100px;
      }

      .game-card {
        border-radius: 18px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .piece {
        padding: 10px 12px;
        font-size: .9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page-container">
    <header class="header">
      <a href="games.html" class="back-link">
        <i class="ri-arrow-right-line" aria-hidden="true"></i>
        العودة للألعاب
      </a>

      <h1 class="game-title">🧩 بازل الأكواد</h1>
    </header>

    <section class="game-card" aria-labelledby="gameInstructions">
      <p class="intro" id="gameInstructions">
        رتّب قطع الكود بالترتيب الصحيح، ثم تحقّق من إجابتك.
      </p>

      <p class="objective">
        الهدف: طباعة <code>Hello World</code> باستخدام JavaScript.
      </p>

      <span class="section-label">الكود الذي تبنيه</span>

      <div class="target-zone" id="targetZone" aria-label="قطع الكود المختارة" aria-live="polite">
        <span class="empty-message">اضغط على القطع بالترتيب المطلوب</span>
      </div>

      <span class="section-label">القطع المتاحة — اضغط لإضافتها</span>

      <div class="pieces" id="piecesContainer" aria-label="قطع الكود المتاحة"></div>

      <div class="actions">
        <button type="button" class="action-button primary" id="checkButton">
          <i class="ri-check-line" aria-hidden="true"></i>
          تحقق من الحل
        </button>

        <button type="button" class="action-button" id="undoButton">
          <i class="ri-arrow-go-back-line" aria-hidden="true"></i>
          تراجع
        </button>

        <button type="button" class="action-button" id="resetButton">
          <i class="ri-refresh-line" aria-hidden="true"></i>
          إعادة المحاولة
        </button>
      </div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

      <section class="reward" id="rewardPanel" aria-live="polite">
        <h2>🎉 أحسنت! الحل صحيح</h2>
        <p id="rewardMessage">أكملت التحدي بنجاح.</p>
      </section>
    </section>
  </main>

  <nav class="mobile-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="dashboard.html" class="mobile-nav-item">
      <i class="ri-home-5-line" aria-hidden="true"></i>
      <span>الرئيسية</span>
    </a>

    <a href="languages.html" class="mobile-nav-item">
      <i class="ri-book-open-line" aria-hidden="true"></i>
      <span>الدروس</span>
    </a>

    <a href="games.html" class="mobile-nav-item active" aria-current="page">
      <i class="ri-gamepad-line" aria-hidden="true"></i>
      <span>الألعاب</span>
    </a>

    <a href="playground.html" class="mobile-nav-item">
      <i class="ri-code-box-line" aria-hidden="true"></i>
      <span>الملعب</span>
    </a>

    <a href="profile.html" class="mobile-nav-item">
      <i class="ri-user-smile-line" aria-hidden="true"></i>
      <span>حسابي</span>
    </a>
  </nav>

  <script type="module">
    import { requireUser } from "./js/auth.js";

    const correctCode = [
      "console.log",
      "(",
      '"Hello World"',
      ")",
      ";"
    ];

    const piecesContainer = document.getElementById("piecesContainer");
    const targetZone = document.getElementById("targetZone");
    const feedback = document.getElementById("feedback");
    const checkButton = document.getElementById("checkButton");
    const undoButton = document.getElementById("undoButton");
    const resetButton = document.getElementById("resetButton");
    const rewardPanel = document.getElementById("rewardPanel");
    const rewardMessage = document.getElementById("rewardMessage");

    let availablePieces = [];
    let userBuild = [];
    let completed = false;

    function shufflePieces() {
      const pieces = correctCode.map((value, index) => ({
        id: index,
        value
      }));

      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }

      return pieces;
    }

    function setFeedback(message, type = "info") {
      feedback.textContent = message;
      feedback.className = `feedback ${type}`;
    }

    function renderPieces() {
      piecesContainer.replaceChildren();

      availablePieces.forEach(piece => {
        if (userBuild.some(item => item.id === piece.id)) {
          return;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "piece";
        button.textContent = piece.value;
        button.setAttribute("aria-label", `إضافة ${piece.value}`);

        button.addEventListener("click", () => {
          if (completed) return;

          userBuild.push(piece);
          targetZone.classList.remove("correct", "incorrect");
          rewardPanel.classList.remove("visible");
          setFeedback("");
          renderAll();
        });

        piecesContainer.appendChild(button);
      });

      if (!piecesContainer.children.length && !completed) {
        const message = document.createElement("span");
        message.className = "empty-message";
        message.textContent = "أضفت كل القطع إلى الكود.";
        piecesContainer.appendChild(message);
      }
    }

    function renderTarget() {
      targetZone.replaceChildren();

      if (userBuild.length === 0) {
        const message = document.createElement("span");
        message.className = "empty-message";
        message.textContent = "اضغط على القطع بالترتيب المطلوب";
        targetZone.appendChild(message);
        return;
      }

      userBuild.forEach((piece, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "piece placed";
        button.textContent = piece.value;
        button.disabled = completed;
        button.setAttribute("aria-label", `إزالة ${piece.value}`);

        button.addEventListener("click", () => {
          if (completed) return;

          userBuild.splice(index, 1);
          targetZone.classList.remove("correct", "incorrect");
          setFeedback("");
          renderAll();
        });

        targetZone.appendChild(button);
      });
    }

    function renderAll() {
      renderTarget();
      renderPieces();

      undoButton.disabled = userBuild.length === 0 || completed;
      checkButton.disabled = completed;
      resetButton.disabled = false;
    }

    function resetGame() {
      availablePieces = shufflePieces();
      userBuild = [];
      completed = false;

      targetZone.classList.remove("correct", "incorrect");
      rewardPanel.classList.remove("visible");
      rewardMessage.textContent =
        "أكملت التحدي بنجاح. لم تتم إضافة نقاط أو عملات؛ نظام المكافآت يحتاج إلى ربط آمن قبل تفعيله.";

      setFeedback("رتّب القطع لتكوين الكود الصحيح.");
      renderAll();
    }

    function undoLastPiece() {
      if (completed || userBuild.length === 0) {
        return;
      }

      userBuild.pop();
      targetZone.classList.remove("correct", "incorrect");
      setFeedback("");
      renderAll();
    }

    function checkSolution() {
      if (completed) return;

      if (userBuild.length !== correctCode.length) {
        targetZone.classList.add("incorrect");
        setFeedback("أكمل كل القطع أولًا، ثم تحقّق من الحل.", "error");
        return;
      }

      const isCorrect = userBuild.every(
        (piece, index) => piece.value === correctCode[index]
      );

      if (!isCorrect) {
        targetZone.classList.remove("correct");
        targetZone.classList.add("incorrect");
        setFeedback(
          "الترتيب غير صحيح. اضغط على قطعة داخل منطقة الكود لإزالتها، ثم حاول مرة أخرى.",
          "error"
        );
        return;
      }

      completed = true;
      targetZone.classList.remove("incorrect");
      targetZone.classList.add("correct");
      rewardPanel.classList.add("visible");

      rewardMessage.textContent =
        "أكملت التحدي بنجاح. لم تتم إضافة نقاط أو عملات؛ نظام المكافآت يحتاج إلى ربط آمن قبل تفعيله.";

      setFeedback("إجابة صحيحة! أكملت التحدي بنجاح.", "success");
      renderAll();

      if (typeof window.confetti === "function") {
        window.confetti({
          particleCount: 100,
          spread: 65,
          origin: { y: 0.7 }
        });
      }
    }

    checkButton.addEventListener("click", checkSolution);
    undoButton.addEventListener("click", undoLastPiece);
    resetButton.addEventListener("click", resetGame);

    checkButton.disabled = true;
    undoButton.disabled = true;
    resetButton.disabled = true;

    try {
      const user = await requireUser();

      if (!user?.uid) {
        throw new Error("Authentication required");
      }

      resetGame();
    } catch (error) {
      console.error("تعذر تهيئة اللعبة:", error);

      setFeedback(
        "تعذر التحقق من تسجيل الدخول. ارجع إلى صفحة تسجيل الدخول وحاول مرة أخرى.",
        "error"
      );

      checkButton.disabled = true;
      undoButton.disabled = true;
      resetButton.disabled = true;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script type="module" src="js/route-guard.js"></script>
</body>
</html>
