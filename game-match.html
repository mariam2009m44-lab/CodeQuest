<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازل الأكواد | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; }
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 1.3rem; }
        .game-area { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .target-zone { width: 100%; min-height: 120px; background: rgba(0,0,0,0.6); border: 2px dashed var(--primary); border-radius: 20px; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
        .target-zone.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .pieces { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; width: 100%; }
        .piece { background: #1e1e1e; border: 1px solid #444; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-family: monospace; font-size: 1.1rem; color: var(--primary); box-shadow: 0 4px 0 #111; }
        .piece.placed { background: #0a0a0a; border-color: var(--success); color: #fff; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <div class="header"><a href="games.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">← رجوع</a><h1>🧩 بازل الأكواد</h1><div style="width:50px;"></div></div>
    <div class="game-area">
        <p style="color:var(--text-muted); text-align:center;">رتب القطع لبناء كود يطبع "Hello World"</p>
        <div class="target-zone" id="targetZone"></div>
        <div class="pieces" id="piecesContainer"></div>
        <button class="btn btn-primary" onclick="checkCode()">✓ تحقق من الحل</button>
    </div>
    <div class="bottom-nav"><a href="dashboard.html"><i class="ri-home-4-line"></i> الرئيسية</a><a href="games.html" class="active"><i class="ri-gamepad-line"></i> الألعاب</a><a href="profile.html"><i class="ri-user-3-line"></i> ملفي</a></div>
    <script>
        const correctCode = ['console.log', '(', '"Hello World"', ')', ';'];
        let availablePieces = [...correctCode].sort(() => Math.random() - 0.5);
        let userBuild = [];
        function render() {
            const container = document.getElementById('piecesContainer'); container.innerHTML = '';
            availablePieces.forEach(p => {
                if(!userBuild.includes(p)) {
                    const el = document.createElement('div'); el.className = 'piece'; el.innerText = p;
                    el.onclick = () => { userBuild.push(p); updateUI(); };
                    container.appendChild(el);
                }
            });
        }
        function updateUI() {
            const target = document.getElementById('targetZone'); target.innerHTML = '';
            userBuild.forEach(p => {
                const el = document.createElement('div'); el.className = 'piece placed'; el.innerText = p;
                el.onclick = () => { userBuild = userBuild.filter(x => x !== p); updateUI(); };
                target.appendChild(el);
            });
            render();
        }
        function checkCode() {
            if (userBuild.join(' ') === correctCode.join(' ')) {
                document.getElementById('targetZone').classList.add('correct');
                confetti({ particleCount: 150, spread: 70 });
                setTimeout(claimReward, 1000);
            } else { alert("❌ الترتيب غير صحيح، حاول مرة أخرى!"); }
        }
        async function claimReward() {
            const uid = Auth.getUserId();
            if(uid) { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(20) }); }
            alert("🎉 مبروك! +20 نقطة"); window.location.href = 'games.html';
        }
        Auth.init((l) => { if(!l) window.location.href = 'login.html'; else render(); });
    </script>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
</body></html>
