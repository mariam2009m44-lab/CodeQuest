<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الذاكرة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --purple: #a99aff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .memory-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.memory-stats .score-board{font-size:.88rem;padding:9px 12px}.score-board { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; color: var(--gold); backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--purple); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); transform: scale(1.02); }
    .memory-grid { display: grid; gap: 12px; margin-top: 20px; }
    .card { position: relative; width: 100%; aspect-ratio: 1; cursor: pointer; perspective: 1000px; padding:0; border:0; background:transparent; color:inherit; font:inherit; min-height:0; }
    .card-inner { position: absolute; inset: 0; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid var(--border); }
    .card-front { background: linear-gradient(135deg, #1e293b, #0f172a); color: var(--purple); font-size: 2rem; box-shadow: inset 0 0 20px rgba(169,154,255,0.1); }
    .card-back { background: linear-gradient(135deg, #1e293b, #0f172a); transform: rotateY(180deg); color: var(--cyan); font-size: 1rem; padding: 8px; text-align: center; }
    .card.matched .card-back { border-color: var(--green); color: var(--green); box-shadow: 0 0 20px rgba(118,233,192,0.3); }
    .win-screen { display: none; text-align: center; margin-top: 25px; }
    .win-screen h2 { color: var(--green); font-size: 1.8rem; margin-bottom: 15px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    @media (max-width: 500px) { .memory-grid { gap: 8px; } .card-front { font-size: 1.5rem; } .card-back { font-size: 0.75rem; } }
  
    /* Shared touch-first and reduced-motion refinements */
    button,
    a.back-btn,
    a.btn-back,
    a.btn-restart {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      min-height: 44px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--cyan, #36bfe5);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .level-box {
        width: 100%;
        max-width: 100%;
        padding: clamp(14px, 4vw, 22px) !important;
        border-radius: 18px;
      }

      .lvl-btn {
        width: 100%;
        min-height: 64px;
        gap: 10px;
        justify-content: space-between;
        touch-action: manipulation;
      }

      .back-btn,
      .btn-back,
      .btn-restart {
        min-height: 48px;
      }

      .drop-zone {
        min-height: 132px;
        padding: 14px;
        touch-action: pan-y;
      }
    }

    @media (max-width: 500px) {
      .memory-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

/* CodeQuest 2026 game-wide polish */
:root{color-scheme:dark}body{background-color:#080e1c;background-image:radial-gradient(ellipse at 10% 0%,rgba(75,105,190,.18),transparent 36%),radial-gradient(ellipse at 90% 12%,rgba(27,181,190,.11),transparent 32%),linear-gradient(155deg,#080e1c,#0c1427 58%,#080e1b)!important;background-attachment:fixed}main,.level-box,.game-card,.game-container,.result-box,.panel{border-color:rgba(151,177,218,.19)}button{font-family:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #75e2ef!important;outline-offset:3px!important}button:disabled{cursor:not-allowed;filter:saturate(.65)}.level-box,.game-card,.result-box{box-shadow:0 18px 48px rgba(0,0,0,.22)}.lvl-btn,.btn,.opt-btn,.line,.piece{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.lvl-btn:active,.btn:active,.opt-btn:active,.line:active,.piece:active{transform:scale(.985)}.progress,.timer-bar{overflow:hidden;border-radius:999px}.progress>span,.timer-bar>span{transition:width .25s ease}.result-emoji{filter:drop-shadow(0 8px 18px rgba(111,190,255,.2))}@media(max-width:640px){body{background-attachment:scroll!important}.level-box,.game-card,.result-box{width:min(100%,100%)!important;max-width:100%!important}.actions{gap:10px}.btn-restart,.btn-back{min-height:48px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

  <link rel="stylesheet" href="css/codequest-games.css">
  <link rel="stylesheet" href="css/codequest-games-pro.css">

<link rel="stylesheet" href="css/codequest-icons.css">
</head>
<body class="cq-game-page" data-cq-theme="bright">
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="memory-stats"><div class="score-board">النقاط: <span id="scoreDisplay">0</span></div><div class="score-board">الوقت: <span id="memoryTime">0:00</span></div><div class="score-board">المحاولات: <span id="memoryMoves">0</span></div></div>
  </div>
  <section class="game-art-banner" aria-label="لعبة الذاكرة"><img src="assets/games/game-memory.svg" alt="" decoding="async"></section>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى الذاكرة</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" data-pairs="6" onclick="startGame(6)"><span>مبتدئ</span> <span>6 أزواج</span> <span class="cq-stars" data-stars="6"></span></button>
        <button class="lvl-btn lvl-med" data-pairs="10" onclick="startGame(10)"><span>متوسط</span> <span>10 أزواج</span> <span class="cq-stars" data-stars="10"></span></button>
        <button class="lvl-btn lvl-hard" data-pairs="15" onclick="startGame(15)"><span>متقدم</span> <span>15 زوج</span> <span class="cq-stars" data-stars="15"></span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div id="gameGrid" class="memory-grid" role="group" aria-label="بطاقات لعبة الذاكرة"></div>
      <div id="winScreen" class="win-screen">
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <h2 id="resultTitle">أحسنت! لقد أكملت اللعبة 🎉</h2>
        <p class="result-message" id="resultMessage" style="color: var(--muted); margin-bottom: 20px;"></p>
        <button class="btn-restart" onclick="restartCurrentLevel()">العب مرة أخرى</button>
        <button class="btn-back" onclick="showMemoryLevels()">المستويات</button>
        <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
      </div>
    </div>
  </div>
  <script>
    const allPairs = [
      { id: 1, term: 'HTML', def: 'هيكل' }, { id: 2, term: 'CSS', def: 'تنسيق' }, { id: 3, term: 'JS', def: 'تفاعل' },
      { id: 4, term: 'Python', def: 'ذكاء اصطناعي' }, { id: 5, term: 'Bug', def: 'خطأ' }, { id: 6, term: 'Code', def: 'أوامر' },
      { id: 7, term: 'Loop', def: 'تكرار' }, { id: 8, term: 'Array', def: 'مصفوفة' }, { id: 9, term: 'Function', def: 'دالة' },
      { id: 10, term: 'Variable', def: 'متغير' }, { id: 11, term: 'API', def: 'واجهة برمجة' }, { id: 12, term: 'Git', def: 'إصدارات' },
      { id: 13, term: 'SQL', def: 'قواعد بيانات' }, { id: 14, term: 'C++', def: 'لغة عالية الأداء' }, { id: 15, term: 'Java', def: 'كائنية التوجه' }
    ];
    let flippedCards = [], matchedCount = 0, totalPairs = 0, score = 0, lock = false, currentPairs = 0, memoryMoves = 0, memorySeconds = 0, memoryTimer = null;
    const scoreDisplay = document.getElementById('scoreDisplay'), gameGrid = document.getElementById('gameGrid'), winScreen = document.getElementById('winScreen');
    function formatMemoryTime(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
    function stopMemoryTimer(){if(memoryTimer){clearInterval(memoryTimer);memoryTimer=null;}}
    function resumeMemoryTimer(){if(memoryTimer||document.hidden||gameGrid.style.display==='none'||winScreen.style.display!=='none')return;memoryTimer=setInterval(()=>{memorySeconds++;document.getElementById('memoryTime').textContent=formatMemoryTime(memorySeconds);},1000);}
    function startMemoryTimer(){stopMemoryTimer();memorySeconds=0;document.getElementById('memoryTime').textContent='0:00';resumeMemoryTimer();}
    document.addEventListener('visibilitychange',()=>document.hidden?stopMemoryTimer():resumeMemoryTimer());

    function updateGlobalScore(points) {
      let total = parseInt(localStorage.getItem('codyTotalScore')) || 0;
      total += points;
      localStorage.setItem('codyTotalScore', total);
      window.CodeQuestExperience?.collectible({ label: "+" + points + " نقطة" });
    }

    const MEM_REQUIRES = { 6: 0, 10: 6, 15: 10 };
    function memoryStars(n) { return Number(localStorage.getItem('codequest-memory-stars-' + n)) || 0; }
    function memoryStarText(n) { return '★'.repeat(n) + '<span class="off">' + '★'.repeat(3 - n) + '</span>'; }
    function memoryStarsFor(pairs, moves) { return moves <= Math.ceil(pairs * 1.5) ? 3 : moves <= pairs * 2.5 ? 2 : 1; }
    function renderMemoryLevels() {
      document.querySelectorAll('.lvl-btn[data-pairs]').forEach(btn => {
        const n = Number(btn.dataset.pairs), req = MEM_REQUIRES[n], open = !req || memoryStars(req) > 0;
        btn.disabled = !open;
        btn.querySelector('.cq-stars').innerHTML = open ? memoryStarText(memoryStars(n)) : '<span class="cq-lock">أنهِ المستوى السابق لفتحه</span>';
      });
    }
    function showMemoryLevels() {
      stopMemoryTimer(); renderMemoryLevels();
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('levelScreen').classList.add('active');
    }
    renderMemoryLevels();

    function startGame(pairsCount) {
      if (MEM_REQUIRES[pairsCount] && memoryStars(MEM_REQUIRES[pairsCount]) === 0) return;
      stopMemoryTimer(); currentPairs = pairsCount; totalPairs = pairsCount; score = 0; memoryMoves = 0; document.getElementById('memoryMoves').textContent='0'; scoreDisplay.textContent = score;
      flippedCards = []; matchedCount = 0; lock = false;
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      winScreen.style.display = 'none'; gameGrid.style.display = 'grid'; startMemoryTimer();
      let cols = pairsCount === 15 ? 5 : 4;
      gameGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      const selected = allPairs.slice(0, pairsCount);
      // Each pair must contain one term card and one definition card.
      // Randomizing the label independently could previously create two terms
      // (or two definitions), while the ID-only matcher still accepted them.
      const cards = selected.flatMap(item => [
        { id: item.id, type: "term", text: item.term },
        { id: item.id, type: "definition", text: item.def }
      ]);
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      gameGrid.innerHTML = '';
      cards.forEach(cardData => {
        const cardEl = document.createElement('button');
        cardEl.type = 'button';
        cardEl.classList.add('card');
        cardEl.dataset.id = cardData.id;
        cardEl.setAttribute('aria-label', 'بطاقة مخفية');
        cardEl.setAttribute('aria-pressed', 'false');
        cardEl.innerHTML = `<span class="card-inner"><span class="card-front" aria-hidden="true">?</span><span class="card-back" aria-hidden="true">${cardData.text}</span></span>`;
        cardEl.addEventListener('click', () => flipCard(cardEl, cardData));
        gameGrid.appendChild(cardEl);
      });
    }

    function flipCard(cardEl, cardData) {
      if (lock || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
      cardEl.classList.add('flipped');
      cardEl.setAttribute('aria-label', cardData.type === 'term' ? cardData.text : `تعريف: ${cardData.text}`);
      cardEl.setAttribute('aria-pressed', 'true');
      flippedCards.push({ el: cardEl, data: cardData });
      if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
      lock = true; memoryMoves++; document.getElementById('memoryMoves').textContent=memoryMoves; const [c1, c2] = flippedCards;
      if (
        c1.data.id === c2.data.id &&
        c1.data.type !== c2.data.type
      ) {
        c1.el.classList.add('matched'); c2.el.classList.add('matched');
        c1.el.disabled = true; c2.el.disabled = true;
        matchedCount++; score += 20; scoreDisplay.textContent = score; updateGlobalScore(20);
        flippedCards = []; lock = false;
        if (matchedCount === totalPairs) {
          setTimeout(() => {
            stopMemoryTimer();
            const bestKey='codequest-memory-best-'+currentPairs;
            const previousBest=Number(localStorage.getItem(bestKey))||0;
            const isBest=!previousBest||memorySeconds<previousBest;
            if(isBest)localStorage.setItem(bestKey,String(memorySeconds));
            const earned = memoryStarsFor(currentPairs, memoryMoves);
            if (earned > memoryStars(currentPairs)) { localStorage.setItem('codequest-memory-stars-' + currentPairs, String(earned)); window.dispatchEvent(new CustomEvent('cq-stars-changed', { detail: { game: 'memory', level: String(currentPairs), stars: earned } })); }
            renderMemoryLevels();
            winScreen.style.display = 'block'; gameGrid.style.display = 'none';
            document.getElementById('resultEmoji').textContent = '🏆';
            document.getElementById('resultTitle').textContent = 'رائع! لقد أكملت اللعبة! ' + '★'.repeat(earned);
            document.getElementById('resultMessage').textContent = `النقاط: ${score} • الوقت: ${formatMemoryTime(memorySeconds)} • المحاولات: ${memoryMoves} • أفضل وقت: ${formatMemoryTime(Number(localStorage.getItem(bestKey))||memorySeconds)}${isBest?' • رقم قياسي جديد!':''}`;
            window.CodeQuestExperience?.reward({ gems: 0, title: 'ذاكرة خارقة!', message: 'طابقت كل البطاقات وأكملت المرحلة بنجاح.' });
          }, 500);
        }
      } else {
        score = Math.max(0, score - 5); scoreDisplay.textContent = score;
        setTimeout(() => {
          c1.el.classList.remove('flipped'); c2.el.classList.remove('flipped');
          c1.el.setAttribute('aria-label', 'بطاقة مخفية');
          c2.el.setAttribute('aria-label', 'بطاقة مخفية');
          c1.el.setAttribute('aria-pressed', 'false');
          c2.el.setAttribute('aria-pressed', 'false');
          flippedCards = []; lock = false;
        }, 800);
      }
    }
    function restartCurrentLevel() { startGame(currentPairs); }
    window.addEventListener('pagehide',stopMemoryTimer);

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(169, 154, 255, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    let matrixTimer = null;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function startMatrix(){if(reducedMotion||matrixTimer||document.hidden)return;matrixTimer=setInterval(draw,120);}
    function stopMatrix(){if(matrixTimer){clearInterval(matrixTimer);matrixTimer=null;}}
    startMatrix();
    document.addEventListener('visibilitychange',()=>document.hidden?stopMatrix():startMatrix());
    window.addEventListener('pagehide',stopMatrix);
    window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
  </script>
