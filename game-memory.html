<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الذاكرة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --purple: #a99aff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; color: var(--gold); backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--purple); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); transform: scale(1.02); }
    .memory-grid { display: grid; gap: 12px; margin-top: 20px; }
    .card { position: relative; width: 100%; aspect-ratio: 1; cursor: pointer; perspective: 1000px; }
    .card-inner { position: absolute; inset: 0; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid var(--border); }
    .card-front { background: linear-gradient(135deg, #1e293b, #0f172a); color: var(--purple); font-size: 2rem; box-shadow: inset 0 0 20px rgba(169,154,255,0.1); }
    .card-back { background: linear-gradient(135deg, #1e293b, #0f172a); transform: rotateY(180deg); color: var(--cyan); font-size: 1rem; padding: 8px; text-align: center; }
    .card.matched .card-back { border-color: var(--green); color: var(--green); box-shadow: 0 0 20px rgba(118,233,192,0.3); }
    .win-screen { display: none; text-align: center; margin-top: 25px; }
    .win-screen h2 { color: var(--green); font-size: 1.8rem; margin-bottom: 15px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    @media (max-width: 500px) { .memory-grid { gap: 8px; } .card-front { font-size: 1.5rem; } .card-back { font-size: 0.75rem; } }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى الذاكرة</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame(6)"><span>مبتدئ</span> <span>6 أزواج</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame(10)"><span>متوسط</span> <span>10 أزواج</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame(15)"><span>متقدم</span> <span>15 زوج</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div id="gameGrid" class="memory-grid"></div>
      <div id="winScreen" class="win-screen">
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <h2 id="resultTitle">أحسنت! لقد أكملت اللعبة 🎉</h2>
        <p class="result-message" id="resultMessage" style="color: var(--muted); margin-bottom: 20px;"></p>
        <button class="btn-restart" onclick="restartCurrentLevel()">العب مرة أخرى</button>
        <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
      </div>
    </div>
  </div>
  <script>
    const allPairs = [
      { id: 1, term: 'HTML', def: 'هيكل' }, { id: 2, term: 'CSS', def: 'تنسيق' }, { id: 3, term: 'JS', def: 'تفاعل' },
      { id: 4, term: 'Python', def: 'ذكاء اصطناعي' }, { id: 5, term: 'Bug', def: 'خطأ' }, { id: 6, term: 'Code', def: 'أوامر' },
      { id: 7, term: 'Loop', def: 'تكرار' }, { id: 8, term: 'Array', def: 'مصفوفة' }, { id: 9, term: 'Function', def: 'دالة' },
      { id: 10, term: 'Variable', def: 'متغير' }, { id: 11, term: 'API', def: 'واجهة برمجة' }, { id: 12, term: 'Git', def: 'إصدارات' },
      { id: 13, term: 'SQL', def: 'قواعد بيانات' }, { id: 14, term: 'C++', def: 'لغة عالية الأداء' }, { id: 15, term: 'Java', def: 'كائنية التوجه' }
    ];
    let flippedCards = [], matchedCount = 0, totalPairs = 0, score = 0, lock = false, currentPairs = 0;
    const scoreDisplay = document.getElementById('scoreDisplay'), gameGrid = document.getElementById('gameGrid'), winScreen = document.getElementById('winScreen');

    function updateGlobalScore(points) {
      let total = parseInt(localStorage.getItem('codyTotalScore')) || 0;
      total += points;
      localStorage.setItem('codyTotalScore', total);
    }

    function startGame(pairsCount) {
      currentPairs = pairsCount; totalPairs = pairsCount; score = 0; scoreDisplay.textContent = score;
      flippedCards = []; matchedCount = 0; lock = false;
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      winScreen.style.display = 'none'; gameGrid.style.display = 'grid';
      let cols = pairsCount === 15 ? 5 : 4;
      gameGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      const selected = allPairs.slice(0, pairsCount);
      const cards = [...selected, ...selected].map(item => ({ id: item.id, text: Math.random() < 0.5 ? item.term : item.def })).sort(() => Math.random() - 0.5);
      gameGrid.innerHTML = '';
      cards.forEach(cardData => {
        const cardEl = document.createElement('div'); cardEl.classList.add('card'); cardEl.dataset.id = cardData.id;
        cardEl.innerHTML = `<div class="card-inner"><div class="card-front">?</div><div class="card-back">${cardData.text}</div></div>`;
        cardEl.addEventListener('click', () => flipCard(cardEl, cardData)); gameGrid.appendChild(cardEl);
      });
    }

    function flipCard(cardEl, cardData) {
      if (lock || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
      cardEl.classList.add('flipped'); flippedCards.push({ el: cardEl, data: cardData });
      if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
      lock = true; const [c1, c2] = flippedCards;
      if (c1.data.id === c2.data.id) {
        c1.el.classList.add('matched'); c2.el.classList.add('matched');
        matchedCount++; score += 20; scoreDisplay.textContent = score; updateGlobalScore(20);
        flippedCards = []; lock = false;
        if (matchedCount === totalPairs) {
          setTimeout(() => {
            winScreen.style.display = 'block'; gameGrid.style.display = 'none';
            document.getElementById('resultEmoji').textContent = '🏆';
            document.getElementById('resultTitle').textContent = 'رائع! لقد أكملت اللعبة!';
            document.getElementById('resultMessage').textContent = `لقد جمعت ${score} نقطة.`;
          }, 500);
        }
      } else {
        score = Math.max(0, score - 5); scoreDisplay.textContent = score;
        setTimeout(() => {
          c1.el.classList.remove('flipped'); c2.el.classList.remove('flipped');
          flippedCards = []; lock = false;
        }, 800);
      }
    }
    function restartCurrentLevel() { startGame(currentPairs); }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(169, 154, 255, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 100);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
<script type="module" src="js/route-guard.js"></script>
</body>
</html>
