<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الذاكرة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:auto;}.card{background:#1e293b;height:80px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-weight:bold;}.flipped{background:#00e5ff;color:#000;}</style></head><body><h2 style="color:#00e5ff;">🧠 الذاكرة</h2><div class="grid" id="grid"></div><script>const items=['let','متغير','if','شرط'];let first=null,lock=false,matched=0,score=0;document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){const grid=document.getElementById('grid');[...items,...items].sort(()=>Math.random()-0.5).forEach(i=>{const c=document.createElement('div');c.className='card';c.innerText='?';c.dataset.v=i;c.onclick=()=>flip(c);grid.appendChild(c);});}function flip(c){if(lock||c.classList.contains('flipped'))return;c.classList.add('flipped');c.innerText=c.dataset.v;if(!first){first=c;return;}lock=true;if(first.dataset.v===c.dataset.v&&first.innerText!==c.innerText){matched++;score+=20;first=null;c=null;lock=false;if(matched===2)finish();}else{setTimeout(()=>{first.classList.remove('flipped');first.innerText='?';c.classList.remove('flipped');c.innerText='?';first=null;c=null;lock=false;},800);}}async function finish(){alert('ربحت '+score+' نقطة!');const uid=Auth.getUserId();if(uid)await firebase.firestore().collection('users').doc(uid).update({bonusPoints:firebase.firestore.FieldValue.increment(score)});window.location.href='games.html';}</script></body></html>
