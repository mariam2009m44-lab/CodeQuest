<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الذاكرة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg: #050810; --glass: rgba(13, 20, 40, 0.8);
      --border: rgba(255, 255, 255, 0.1); --text: #ffffff; --muted: #8892b0;
      --cyan: #6be8ff; --purple: #a99aff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
      background-image: radial-gradient(circle at 50% 100%, rgba(169, 154, 255, 0.1), transparent 50%);
    }
    .top-nav {
      width: 100%; max-width: 650px; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 20px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px; background: var(--glass);
      border: 1px solid var(--border); color: var(--text); padding: 8px 16px;
      border-radius: 10px; text-decoration: none; font-weight: 800; transition: 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-weight: 900; color: var(--gold); }
    .screen { display: none; width: 100%; max-width: 650px; }
    .screen.active { display: block; }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px; backdrop-filter: blur(20px); text-align: center; }
    .level-box h2 { margin-bottom: 20px; color: var(--purple); }
    .levels-grid { display: flex; flex-direction: column; gap: 12px; }
    .lvl-btn { padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 900; border: 2px solid; background: transparent; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; }
    .lvl-easy { color: var(--green); border-color: var(--green); }
    .lvl-med { color: var(--gold); border-color: var(--gold); }
    .lvl-hard { color: var(--red); border-color: var(--red); }
    .memory-grid { display: grid; gap: 10px; margin-top: 15px; }
    .card { position: relative; width: 100%; aspect-ratio: 1; cursor: pointer; perspective: 1000px; }
    .card-inner { position: absolute; inset: 0; transition: transform 0.5s; transform-style: preserve-3d; }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-weight: 900;
      border: 2px solid var(--border);
    }
    .card-front { background: linear-gradient(135deg, #1e293b, #0f172a); color: var(--purple); font-size: 1.5rem; }
    .card-back { background: linear-gradient(135deg, #1e293b, #0f172a); transform: rotateY(180deg); color: var(--cyan); font-size: 0.9rem; padding: 5px; text-align: center; }
    .card.matched .card-back { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(118,233,192,0.3); }
    .win-screen { display: none; text-align: center; margin-top: 20px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; margin-top: 10px; }
    @media (max-width: 500px) { .memory-grid { gap: 6px; } .card-front { font-size: 1.2rem; } .card-back { font-size: 0.7rem; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى الذاكرة</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame(6)"><span>مبتدئ</span> <span>6 أزواج</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame(10)"><span>متوسط</span> <span>10 أزواج</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame(15)"><span>متقدم</span> <span>15 زوج</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <div id="gameGrid" class="memory-grid"></div>
      <div id="winScreen" class="win-screen">
        <h2>أحسنت! 🎉</h2>
        <button class="btn-restart" onclick="restartCurrentLevel()">العب مرة أخرى</button>
      </div>
    </div>
  </div>
  <script>
    const allPairs = [
      { id: 1, term: 'HTML', def: 'هيكل' }, { id: 2, term: 'CSS', def: 'تنسيق' }, { id: 3, term: 'JS', def: 'تفاعل' },
      { id: 4, term: 'Python', def: 'ذكاء اصطناعي' }, { id: 5, term: 'Bug', def: 'خطأ' }, { id: 6, term: 'Code', def: 'أوامر' },
      { id: 7, term: 'Loop', def: 'تكرار' }, { id: 8, term: 'Array', def: 'مصفوفة' }, { id: 9, term: 'Function', def: 'دالة' },
      { id: 10, term: 'Variable', def: 'متغير' }, { id: 11, term: 'API', def: 'واجهة برمجة' }, { id: 12, term: 'Git', def: 'إصدارات' },
      { id: 13, term: 'SQL', def: 'قواعد بيانات' }, { id: 14, term: 'C++', def: 'لغة عالية الأداء' }, { id: 15, term: 'Java', def: 'كائنية التوجه' }
    ];
    let flippedCards = [], matchedCount = 0, totalPairs = 0, score = 0, lock = false, currentPairs = 0;
    const scoreDisplay = document.getElementById('scoreDisplay'), gameGrid = document.getElementById('gameGrid'), winScreen = document.getElementById('winScreen');
    function updateGlobalScore(points) { let total = parseInt(localStorage.getItem('codyTotalScore')) || 0; total += points; localStorage.setItem('codyTotalScore', total); }
    function startGame(pairsCount) {
      currentPairs = pairsCount; totalPairs = pairsCount; score = 0; scoreDisplay.textContent = score;
      document.getElementById('levelScreen').classList.remove('active'); document.getElementById('gameScreen').classList.add('active');
      winScreen.style.display = 'none'; gameGrid.style.display = 'grid';
      let cols = pairsCount === 15 ? 5 : 4; gameGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      const selected = allPairs.slice(0, pairsCount);
      const cards = [...selected, ...selected].map(item => ({ id: item.id, text: Math.random() < 0.5 ? item.term : item.def })).sort(() => Math.random() - 0.5);
      gameGrid.innerHTML = ''; flippedCards = []; matchedCount = 0; lock = false;
      cards.forEach(cardData => {
        const cardEl = document.createElement('div'); cardEl.classList.add('card'); cardEl.dataset.id = cardData.id;
        cardEl.innerHTML = `<div class="card-inner"><div class="card-front">?</div><div class="card-back">${cardData.text}</div></div>`;
        cardEl.addEventListener('click', () => flipCard(cardEl, cardData)); gameGrid.appendChild(cardEl);
      });
    }
    function flipCard(cardEl, cardData) {
      if (lock || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
      cardEl.classList.add('flipped'); flippedCards.push({ el: cardEl, data: cardData });
      if (flippedCards.length === 2) checkMatch();
    }
    function checkMatch() {
      lock = true; const [c1, c2] = flippedCards;
      if (c1.data.id === c2.data.id) {
        c1.el.classList.add('matched'); c2.el.classList.add('matched');
        matchedCount++; score += 20; scoreDisplay.textContent = score; updateGlobalScore(20);
        flippedCards = []; lock = false;
        if (matchedCount === totalPairs) setTimeout(() => { winScreen.style.display = 'block'; gameGrid.style.display = 'none'; }, 500);
      } else {
        score = Math.max(0, score - 5); scoreDisplay.textContent = score;
        setTimeout(() => { c1.el.classList.remove('flipped'); c2.el.classList.remove('flipped'); flippedCards = []; lock = false; }, 800);
      }
    }
    function restartCurrentLevel() { startGame(currentPairs); }
  </script>
</body>
</html>
