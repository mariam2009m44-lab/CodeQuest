<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الذاكرة | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); z-index: 100; }
        .header h1 { margin: 0; font-size: 1.3rem; color: var(--neon-cyan); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .game-board { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; align-content: center; }
        .card { aspect-ratio: 1/1; background: #1e1e1e; border: 2px solid #333; border-radius: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; position: relative; text-align: center; padding: 5px;}
        .card:hover { border-color: var(--neon-cyan); }
        .card.flipped { background: var(--glass); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,229,255,0.3); color: #00e5ff; }
        .card.matched { background: rgba(40, 167, 69, 0.2); border-color: #28a745; pointer-events: none; color: #28a745; }
        .card .front { display: block; font-size: 2rem;} .card .back { display: none; font-size: 0.8rem; font-family: monospace; direction: ltr;}
        .card.flipped .front, .card.matched .front { display: none; }
        .card.flipped .back, .card.matched .back { display: block; }
        .success-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .success-modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid var(--gold); border-radius: 30px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; }
        .success-modal.active .modal-content { transform: scale(1); }
        .modal-content h2 { color: var(--gold); font-size: 2.5rem; margin: 0 0 10px; }
        .btn-claim { background: linear-gradient(135deg, #00e5ff, #007bff); color: #000; padding: 15px 40px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="header"><a href="games.html" class="btn-back">← رجوع</a><h1>🧠 لعبة الذاكرة</h1><div style="width: 70px;"></div></div>
    <div class="game-board" id="gameBoard"></div>
    <div class="success-modal" id="successModal"><div class="modal-content"><h2>🎉 عاش يا بطل!</h2><p>لقد طابقت كل الكروت بنجاح</p><button class="btn-claim" onclick="claimReward()">احصل على 80 نقطة</button></div></div>
    <script>
        const gameData = [
            { id: 1, text: 'console.log', match: 'يطبع في الشاشة' },
            { id: 2, text: 'let', match: 'متغير' }, { id: 3, text: 'if', match: 'شرط' },
            { id: 4, text: 'for', match: 'حلقة' }, { id: 5, text: 'function', match: 'دالة' },
            { id: 6, text: 'array', match: 'مصفوفة' }
        ];
        let cards = [], flippedCards = [], matchedPairs = 0;
        document.addEventListener('DOMContentLoaded', () => { Auth.init((l) => { if(!l) window.location.href='index.html'; else initGame(); }); });
        function initGame() {
            cards = [];
            gameData.forEach(item => { cards.push({ id: item.id, text: item.text }); cards.push({ id: item.id, text: item.match }); });
            for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
            const board = document.getElementById('gameBoard'); board.innerHTML = ''; matchedPairs = 0; flippedCards = [];
            cards.forEach((card, index) => {
                const el = document.createElement('div'); el.className = 'card';
                el.innerHTML = `<span class="front">❓</span><span class="back">${card.text}</span>`;
                el.onclick = () => flipCard(el, index); board.appendChild(el);
            });
        }
        function flipCard(el, index) {
            if (el.classList.contains('flipped') || el.classList.contains('matched') || flippedCards.length === 2) return;
            el.classList.add('flipped'); flippedCards.push({ el, index });
            if (flippedCards.length === 2) checkMatch();
        }
        function checkMatch() {
            const [c1, c2] = flippedCards;
            if (cards[c1.index].id === cards[c2.index].id) {
                c1.el.classList.add('matched'); c2.el.classList.add('matched'); matchedPairs++; flippedCards = [];
                if (matchedPairs === 6) setTimeout(winGame, 500);
            } else {
                setTimeout(() => { c1.el.classList.remove('flipped'); c2.el.classList.remove('flipped'); flippedCards = []; }, 1000);
            }
        }
        function winGame() { confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } }); document.getElementById('successModal').classList.add('active'); }
        async function claimReward() {
            const uid = Auth.getUserId();
            if (uid) { try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(80) }); } catch(e) {} }
            window.location.href = 'games.html';
        }
    </script>
</body></html>
