<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الذاكرة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { font-family: 'Playpen Sans Arabic', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); padding: 20px; }
    .game-box { width: 100%; max-width: 600px; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .back-btn { color: var(--muted); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: var(--purple); }
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { aspect-ratio: 1; perspective: 1000px; cursor: pointer; }
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
    .card-front { background: linear-gradient(135deg, var(--purple), #8B5CF6); color: #fff; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-size: 2rem; }
    .card-back { background: var(--surface); border: 1px solid var(--border); transform: rotateY(180deg); color: var(--text); font-size: 0.9rem; padding: 10px; }
    .card.matched .card-inner { transform: rotateY(180deg); }
    .card.matched .card-back { border-color: var(--green); color: var(--green); background: rgba(118,233,192,0.1); }
    .status-text { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
    @media (max-width: 500px) { .memory-grid { grid-template-columns: repeat(3, 1fr); } .card-back { font-size: 0.8rem; } }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <span style="font-weight: 800; color: var(--purple);"><i class="ri-brain-fill"></i> الذاكرة</span>
    </div>
    <div class="memory-grid" id="grid"></div>
    <div class="status-text" id="status">طابق الكلمات مع معانيها!</div>
  </div>

  <script>
    const pairs = [
      { term: 'HTML', def: 'هيكل الويب' },
      { term: 'CSS', def: 'التنسيق والألوان' },
      { term: 'JS', def: 'التفاعل والحركة' },
      { term: 'Python', def: 'الذكاء الاصطناعي' },
      { term: 'Bug', def: 'خطأ برمجي' },
      { term: 'Code', def: 'أوامر الكمبيوتر' }
    ];

    let cards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let lockBoard = false;

    function initGame() {
      cards = [...pairs, ...pairs].sort(() => Math.random() - 0.5);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.dataset.term = card.term;
        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="card-front">?</div>
            <div class="card-back">${card.term ? card.term : card.def}</div>
          </div>
        `;
        cardEl.addEventListener('click', () => flipCard(cardEl, card));
        grid.appendChild(cardEl);
      });
    }

    function flipCard(cardEl, card) {
      if (lockBoard) return;
      if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
      cardEl.classList.add('flipped');
      flippedCards.push({ el: cardEl, data: card });
      if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
      lockBoard = true;
      const [first, second] = flippedCards;
      const isMatch = (first.data.term && second.data.def) || (first.data.def && second.data.term);
      if (isMatch) {
        first.el.classList.add('matched');
        second.el.classList.add('matched');
        flippedCards = [];
        matchedCount++;
        lockBoard = false;
        if (matchedCount === 6) {
          document.getElementById('status').textContent = 'أحسنت! لقد أكملت اللعبة 🎉';
          document.getElementById('status').style.color = 'var(--green)';
        }
      } else {
        setTimeout(() => {
          first.el.classList.remove('flipped');
          second.el.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 1000);
      }
    }
    initGame();
  </script>
</body>
</html>
