<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | لعبة الذاكرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;text-align:center;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:20px auto;}
.card{aspect-ratio:1;background:#1e293b;border-radius:10px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:0.5s;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;}
.card.flipped{transform:rotateY(180deg);background:#00e5ff;color:#050914;}
.card.matched{background:#27ae60;pointer-events:none;opacity:0.7;}
.card .front{position:absolute;backface-visibility:hidden;}
</style>
</head>
<body>
<h1 style="color:#00e5ff;">🧠 لعبة الذاكرة</h1>
<p>طابق الكود بنتيجته!</p>
<div class="grid" id="grid"></div>
<script>
const pairs = [
    { c: 'let', r: 'متغير' }, { c: 'if', r: 'شرط' }, { c: 'for', r: 'حلقة' },
    { c: 'function', r: 'دالة' }, { c: 'console', r: 'طباعة' }, { c: '==', r: 'يساوي' }
];
let first, second, lock = false, matched = 0, score = 0;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => { if(!logged) window.location.href = 'index.html'; else initGame(); });
});

function initGame() {
    let cards = [];
    pairs.forEach((p, i) => {
        cards.push({ val: p.c, pair: i, type: 'code' });
        cards.push({ val: p.r, pair: i, type: 'result' });
    });
    cards.sort(() => Math.random() - 0.5);
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    cards.forEach((c, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.pair = c.pair;
        card.dataset.type = c.type;
        card.innerHTML = `<div class="front">?</div>`;
        card.onclick = () => flip(card, c.val);
        grid.appendChild(card);
    });
}

function flip(card, val) {
    if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    card.innerHTML = `<div class="front">${val}</div>`;
    if(!first) { first = card; return; }
    second = card; lock = true;

    if(first.dataset.pair === second.dataset.pair && first.dataset.type !== second.dataset.type) {
        first.classList.add('matched'); second.classList.add('matched');
        matched++; score += 20;
        try { playSound('success'); } catch(e){}
        resetBoard();
        if(matched === 6) finishGame();
    } else {
        try { playSound('error'); } catch(e){}
        setTimeout(() => {
            first.classList.remove('flipped'); first.innerHTML = `<div class="front">?</div>`;
            second.classList.remove('flipped'); second.innerHTML = `<div class="front">?</div>`;
            resetBoard();
        }, 1000);
    }
}

function resetBoard() { first = null; second = null; lock = false; }

async function finishGame() {
    try { confetti({ particleCount: 200, spread: 100 }); } catch(e){}
    alert('🎉 مبروك! كسبت ' + score + ' نقطة!');
    const uid = Auth.getUserId();
    if(uid) {
        const ref = firebase.firestore().collection('users').doc(uid).collection('highscores').doc('memory');
        const doc = await ref.get();
        if(!doc.exists || score > doc.data().score) {
            await ref.set({ score: score });
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(score) });
        }
    }
    setTimeout(() => window.location.href = 'games.html', 1500);
}
</script>
</body></html>
