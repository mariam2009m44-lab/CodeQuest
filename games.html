    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; }
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 900px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        
        .game-card { border-radius: 20px; padding: 25px 15px; text-align: center; text-decoration: none; color: #fff; display: flex; flex-direction: column; align-items: center; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .game-card:nth-child(1) { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .game-card:nth-child(2) { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
        .game-card:nth-child(3) { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .game-card:nth-child(4) { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .game-card:nth-child(5) { background: linear-gradient(135deg, #10b981, #047857); }
        .game-card:nth-child(6) { background: linear-gradient(135deg, #ec4899, #be185d); }
        
        .game-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .game-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    
    <header class="top-header">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
