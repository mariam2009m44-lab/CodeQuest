<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الألعاب | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
</head>
<body style="background: var(--bg-base);">
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text-main);">مركز الألعاب</h1>
            <a href="dashboard.html" class="btn btn-secondary"><i class="ri-arrow-right-line"></i> الرئيسية</a>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">
            <div class="card" style="text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 15px;">🧩</div>
                <h3 style="margin-bottom: 10px;">حل الألغاز</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">اختبر ذكاءك في ترتيب الأكواد.</p>
                <button class="btn btn-primary" style="width: 100%;">العب الآن</button>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 15px;">⚡</div>
                <h3 style="margin-bottom: 10px;">سرعة البديهة</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">أجب على الأسئلة في أسرع وقت.</p>
                <button class="btn btn-primary" style="width: 100%;">العب الآن</button>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 15px;">🕵️</div>
                <h3 style="margin-bottom: 10px;">اكتشف الخطأ</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">ابحث عن الخطأ البرمجي في الكود.</p>
                <button class="btn btn-primary" style="width: 100%;">العب الآن</button>
            </div>
        </div>
    </div>
</body>
</html>
