<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الألعاب - CodeQuest</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: var(--bg-main); color: white; font-family: 'Cairo', sans-serif; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.3); border-bottom: 2px solid var(--primary); }
        .header h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        
        .game-card { position: relative; padding: 40px 20px; text-align: center; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; text-decoration: none; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .game-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent); transform: translateX(-100%); transition: 0.6s; }
        .game-card:hover::before { transform: translateX(100%); }
        .game-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--primary); box-shadow: 0 15px 40px rgba(0, 229, 255, 0.2); }
        
        .game-icon { font-size: 4rem; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--secondary)); }
        .game-title { color: var(--accent); font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        .game-desc { color: var(--text-muted); font-size: 1rem; margin-bottom: 20px; }
        .play-badge { padding: 8px 20px; background: rgba(0, 229, 255, 0.1); border: 1px solid var(--primary); border-radius: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <div class="header animate-fade">
        <a href="index.html" class="btn-secondary" style="padding: 8px 16px; font-size: 14px; text-decoration: none;">⬅️ الرئيسية</a>
        <h1>مركز الألعاب</h1>
        <div style="width: 100px;"></div>
    </div>

    <div class="games-grid animate-fade">
        <a href="game-memory.html" class="game-card">
            <span class="game-icon">🧠</span>
            <div class="game-title">لعبة الذاكرة</div>
            <div class="game-desc">طابق بين الكود البرمجي ووظيفته لتقوية ذاكرتك.</div>
            <span class="play-badge">العب الآن 🚀</span>
        </a>
        
        <a href="game-bug.html" class="game-card">
            <span class="game-icon">🐞</span>
            <div class="game-title">صائد الأخطاء</div>
            <div class="game-desc">ابحث عن السطر الذي يحتوي على خطأ برمجي واضغط عليه.</div>
            <span class="play-badge">العب الآن 🚀</span>
        </a>
        
        <a href="game-quiz.html" class="game-card">
            <span class="game-icon">🏆</span>
            <div class="game-title">سيد الأسئلة</div>
            <div class="game-desc">أجب على أسئلة البرمجة الصعبة واجمع النقاط.</div>
            <span class="play-badge">العب الآن 🚀</span>
        </a>
    </div>
</body>
</html>
