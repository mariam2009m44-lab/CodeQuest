<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الألعاب | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; }
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 900px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        
        .game-card { border-radius: 20px; padding: 25px 15px; text-align: center; text-decoration: none; color: #fff; display: flex; flex-direction: column; align-items: center; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .game-card:nth-child(1) { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .game-card:nth-child(2) { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
        .game-card:nth-child(3) { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .game-card:nth-child(4) { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .game-card:nth-child(5) { background: linear-gradient(135deg, #10b981, #047857); }
        .game-card:nth-child(6) { background: linear-gradient(135deg, #ec4899, #be185d); }
        
        .game-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .game-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="dashboard.html" style="color:var(--primary); text-decoration:none; font-weight:bold;">← رجوع</a>
        <h1>🎮 مركز الألعاب</h1>
        <div style="width:50px;"></div>
    </div>

    <div class="grid">
        <a href="game-match.html" class="game-card"><i class="ri-puzzle-line game-icon"></i><div class="game-title">بازل الأكواد</div></a>
        <a href="game-memory.html" class="game-card"><i class="ri-brain-line game-icon"></i><div class="game-title">لعبة الذاكرة</div></a>
        <a href="game-bug.html" class="game-card"><i class="ri-bug-line game-icon"></i><div class="game-title">صائد الأخطاء</div></a>
        <a href="game-speed.html" class="game-card"><i class="ri-flashlight-line game-icon"></i><div class="game-title">تحدي السرعة</div></a>
        <a href="game-quiz.html" class="game-card"><i class="ri-question-line game-icon"></i><div class="game-title">سيد الأسئلة</div></a>
        <a href="game-build.html" class="game-card"><i class="ri-code-box-line game-icon"></i><div class="game-title">بناء الكود</div></a>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html"><i class="ri-home-4-line"></i> الرئيسية</a>
        <a href="languages.html"><i class="ri-book-open-line"></i> التعلم</a>
        <a href="games.html" class="active"><i class="ri-gamepad-line"></i> الألعاب</a>
        <a href="profile.html"><i class="ri-user-3-line"></i> ملفي</a>
    </div>
    <script>Auth.init(l => { if(!l) window.location.href='login.html'; });</script>
</body></html>
