<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الألعاب | Cody Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=ultimate3">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="ri-robot-2-fill"></i> Cody Academy</div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
                <a href="languages.html" class="nav-item"><i class="ri-map-2-line"></i> مسار التعلم</a>
                <a href="playground.html" class="nav-item"><i class="ri-terminal-box-line"></i> محرر الأكواد</a>
                <a href="games.html" class="nav-item active"><i class="ri-gamepad-line"></i> الألعاب</a>
                <a href="shop.html" class="nav-item"><i class="ri-shopping-bag-3-line"></i> المتجر</a>
                <a href="profile.html" class="nav-item"><i class="ri-user-smile-line"></i> حسابي</a>
                <a href="index.html" class="nav-item logout"><i class="ri-logout-box-r-line"></i> خروج</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1 style="font-size: 2.2rem; margin-bottom: 30px; color: #fff; font-weight: 900;">مركز الألعاب</h1>
            <div class="grid-quick">
                <div class="glass-card quick-card">
                    <div class="quick-icon" style="background: rgba(0, 217, 255, 0.1); color: var(--primary-cyan);"><i class="ri-puzzle-line"></i></div>
                    <h4>بازل الأكواد</h4>
                </div>
                <div class="glass-card quick-card">
                    <div class="quick-icon" style="background: rgba(139, 92, 246, 0.1); color: var(--primary-purple);"><i class="ri-brain-line"></i></div>
                    <h4>لعبة الذاكرة</h4>
                </div>
                <div class="glass-card quick-card">
                    <div class="quick-icon" style="background: rgba(251, 191, 36, 0.1); color: var(--accent-gold);"><i class="ri-bug-line"></i></div>
                    <h4>صائد الأخطاء</h4>
                </div>
                <div class="glass-card quick-card">
                    <div class="quick-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);"><i class="ri-question-answer-line"></i></div>
                    <h4>سيد الأسئلة</h4>
                </div>
            </div>
        </main>
    </div>
    <nav class="mobile-nav">
        <a href="dashboard.html" class="mobile-nav-item"><i class="ri-home-5-line"></i> الرئيسية</a>
        <a href="languages.html" class="mobile-nav-item"><i class="ri-book-open-line"></i> التعلم</a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-terminal-box-line"></i> الملعب</a>
        <a href="games.html" class="mobile-nav-item active"><i class="ri-gamepad-line"></i> الألعاب</a>
    </nav>
    <script type="module">
        import { App } from './js/app.js';
        App.init();
    </script>
</body>
</html>
