<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>الألعاب</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <style>
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 100px;}
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { color: #00e5ff; text-decoration: none; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 600px; }
        .card { background: rgba(10, 25, 47, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; text-align: center; text-decoration: none; color: #fff; }
        .card i { font-size: 2.5rem; margin-bottom: 10px; color: #00e5ff; }
        .card h3 { margin: 0 0 10px; font-size: 1.1rem; } .card p { color: #aaa; font-size: 0.8rem; margin-bottom: 15px; }
        .btn-play { background: #00e5ff; color: #000; border: none; padding: 8px; border-radius: 10px; width: 100%; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.95); border: 1px solid rgba(0,229,255,0.3); border-radius: 25px; }
        .nav-btn { color: #667; text-decoration: none; display: flex; flex-direction: column; align-items: center; width: 60px; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; } .nav-btn span { font-size: 0.7rem; }
        .nav-btn.active { color: #00e5ff; }
    </style>
</head>
<body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h2>🎮 الألعاب</h2></div>
    <div class="grid" id="grid"></div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn active"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        const games = [
            { name: 'بازل الأكواد', icon: 'ri-puzzle-line', link: 'game-match.html' },
            { name: 'لعبة الذاكرة', icon: 'ri-brain-line', link: 'game-memory.html' },
            { name: 'صائد الأخطاء', icon: 'ri-bug-line', link: 'game-bug.html' },
            { name: 'بناء الكود', icon: 'ri-code-box-line', link: 'game-build.html' }
        ];
        const grid = document.getElementById('grid');
        games.forEach(g => {
            grid.innerHTML += `<a href="${g.link}" class="card"><i class="${g.icon}"></i><h3>${g.name}</h3><p>اضغط للعب</p><button class="btn-play">العب الآن</button></a>`;
        });
        document.addEventListener('DOMContentLoaded', () => { Auth.init((l) => { if(!l) window.location.href = 'index.html'; }); });
    </script>
</body></html>
