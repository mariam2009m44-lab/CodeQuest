<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الذاكرة | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --pop-yellow: #FFD166; --pop-coral: #FF6B6B; --pop-teal: #4ECDC4; --pop-dark: #1A1A2E; --pop-white: #F8F9FA; }
    body { font-family: 'Playpen Sans Arabic', sans-serif; background: #E2E8F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; margin: 0; }
    .game-box { width: 100%; max-width: 650px; background: var(--pop-white); border: 4px solid var(--pop-dark); border-radius: 24px; padding: 30px; box-shadow: 8px 8px 0 var(--pop-dark); text-align: center; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px dashed #CBD5E1; padding-bottom: 15px; }
    .back-btn { color: var(--pop-dark); text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 6px; background: #E2E8F0; padding: 8px 16px; border-radius: 12px; border: 2px solid var(--pop-dark); }
    .stats { font-weight: 800; font-size: 1.2rem; color: var(--pop-dark); }
    
    .level-select { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .level-btn { padding: 16px; font-size: 1.2rem; font-weight: 800; border: 3px solid var(--pop-dark); border-radius: 16px; cursor: pointer; font-family: 'Playpen Sans Arabic'; transition: 0.2s; color: #fff; box-shadow: 4px 4px 0 var(--pop-dark); }
    .level-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--pop-dark); }
    .lvl-easy { background: var(--pop-teal); } .lvl-med { background: var(--pop-yellow); color: var(--pop-dark); } .lvl-hard { background: var(--pop-coral); }

    .memory-grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
    .card { aspect-ratio: 1; perspective: 1000px; cursor: pointer; }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--pop-dark); font-weight: 800; }
    .card-front { background: #A78BFA; color: #fff; font-size: 2rem; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2); }
    .card-back { background: #fff; transform: rotateY(180deg); color: var(--pop-dark); font-size: 0.9rem; padding: 8px; text-align: center; }
    .card.matched .card-back { background: #D1FAE5; border-color: #10B981; }
    .msg { margin-top: 20px; font-weight: 800; font-size: 1.2rem; color: var(--pop-teal); display: none; }
    @media (max-width: 500px) { .memory-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } .card-back { font-size: 0.75rem; } }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <div class="stats">النقاط: <span id="score">0</span></div>
    </div>
    
    <div id="levelScreen" class="level-select">
      <h2 style="color: var(--pop-dark);">اختر مستوى التحدي</h2>
      <button class="level-btn lvl-easy" onclick="startGame(3, 6)">سهل (3 أزواج)</button>
      <button class="level-btn lvl-med" onclick="startGame(6, 12)">متوسط (6 أزواج)</button>
      <button class="level-btn lvl-hard" onclick="startGame(8, 16)">صعب (8 أزواج)</button>
    </div>

    <div id="grid" class="memory-grid"></div>
    <div id="winMsg" class="msg">أحسنت! لقد أكملت اللعبة 🎉</div>
  </div>

  <script>
    const pairs = [
      { t: 'HTML', d: 'هيكل' }, { t: 'CSS', d: 'تنسيق' }, { t: 'JS', d: 'تفاعل' }, 
      { t: 'Python', d: 'ذكاء اصطناعي' }, { t: 'Bug', d: 'خطأ' }, { t: 'Code', d: 'أوامر' },
      { t: 'Loop', d: 'تكرار' }, { t: 'Array', d: 'مصفوفة' }
    ];
    let cards = [], flipped = [], matched = 0, score = 0, lock = false, totalPairs = 0;

    function startGame(pairsCount, totalCards) {
      totalPairs = pairsCount;
      document.getElementById('levelScreen').style.display = 'none';
      const grid = document.getElementById('grid');
      grid.style.display = 'grid';
      if (totalCards === 16) grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
      else if (totalCards === 12) grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
      else grid.style.gridTemplateColumns = 'repeat(3, 1fr)';

      const selected = pairs.slice(0, pairsCount);
      cards = [...selected, ...selected].sort(() => Math.random() - 0.5);
      grid.innerHTML = '';
      
      cards.forEach(c => {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.term = c.t;
        el.innerHTML = `<div class="card-inner"><div class="card-front">?</div><div class="card-back">${c.t ? c.t : c.d}</div></div>`;
        el.onclick = () => flip(el, c);
        grid.appendChild(el);
      });
    }

    function flip(el, card) {
      if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      el.classList.add('flipped');
      flipped.push({ el, data: card });
      if (flipped.length === 2) checkMatch();
    }

    function checkMatch() {
      lock = true;
      const [a, b] = flipped;
      const isMatch = (a.data.t && b.data.d) || (a.data.d && b.data.t);
      
      if (isMatch) {
        a.el.classList.add('matched'); b.el.classList.add('matched');
        matched++; score += 10; document.getElementById('score').textContent = score;
        flipped = []; lock = false;
        if (matched === totalPairs) document.getElementById('winMsg').style.display = 'block';
      } else {
        score = Math.max(0, score - 2); document.getElementById('score').textContent = score;
        setTimeout(() => {
          a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
          flipped = []; lock = false;
        }, 1000);
      }
    }
  </script>
</body>
</html>
