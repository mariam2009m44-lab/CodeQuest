<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>مركز الألعاب | CodeQuest</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accessories.js"></script>

    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --card-bg: rgba(255,255,255,0.03); }
        body { background: radial-gradient(circle at top, #0a192f 0%, var(--bg) 100%); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; box-sizing: border-box; }
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; }
        .header h1 { font-size: 1.8rem; color: var(--neon-cyan); margin: 0; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .btn-back { background: rgba(0,229,255,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; text-decoration: none; display: inline-block;}
        
        /* Floating Dock */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px 20px; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 65px; border-radius: 18px; background: transparent; color: #667; text-decoration: none; transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-btn i { font-size: 1.6rem; margin-bottom: 4px; }
        .nav-btn span { font-size: 0.75rem; font-family: 'Cairo'; font-weight: bold; }
        .nav-btn:hover { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border-color: rgba(0, 229, 255, 0.4); transform: translateY(-5px); }
        .nav-btn.active { color: var(--neon-cyan); border-bottom: 3px solid var(--neon-cyan); border-radius: 18px 18px 5px 5px; }

        /* Global Grid & Cards */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 600px; padding: 0 20px; box-sizing: border-box; }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 10px 30px rgba(0,229,255,0.2); }
        .card-icon { font-size: 3rem; margin-bottom: 15px; color: var(--neon-cyan); }
        .card-title { font-size: 1.4rem; font-weight: bold; margin: 0 0 10px; color: #fff; }
        .card-desc { color: #aaa; font-size: 0.9rem; margin-bottom: 15px; flex: 1; }
        .btn-primary { background: var(--neon-cyan); color: #000; border: none; padding: 10px 25px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-primary:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        .btn-danger { background: #ff4444; color: #fff; border: none; padding: 10px 25px; border-radius: 10px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="header"><h1>🎮 مركز الألعاب</h1><a href="languages.html" class="btn-back">← رجوع</a></div>
    <div class="grid-container" id="gamesGrid"></div>
    
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((logged) => {
                if (!logged) { window.location.href = 'index.html'; return; }
                renderGames();
            });
        });

        async function renderGames() {
            const games = [
                { name: 'بازل الأكواد', icon: 'ri-puzzle-line', desc: 'رتب القطع لبناء الكود الصحيح', link: 'game-match.html', color: '#ffd700' },
                { name: 'لعبة الذاكرة', icon: 'ri-brain-line', desc: 'طابق الكود مع النتيجة', link: 'game-memory.html', color: '#00e5ff' },
                { name: 'صائد الأخطاء', icon: 'ri-bug-line', desc: 'اكتشف الخطأ في الكود', link: 'game-bug.html', color: '#ff4444' },
                { name: 'تحدي السرعة', icon: 'ri-flashlight-line', desc: 'أجب بسرعة قبل انتهاء الوقت', link: 'game-speed.html', color: '#8b5cf6' },
                { name: 'سيد الأسئلة', icon: 'ri-question-line', desc: 'اختبر معلوماتك البرمجية', link: 'game-quiz.html', color: '#34d399' },
                { name: 'بناء الكود', icon: 'ri-code-box-line', desc: 'اكتب الكود من الصفر', link: 'game-build.html', color: '#f472b6' }
            ];

            const grid = document.getElementById('gamesGrid');
            games.forEach(game => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-icon" style="color: ${game.color};"><i class="${game.icon}"></i></div>
                        <h3 class="card-title">${game.name}</h3>
                        <p class="card-desc">${game.desc}</p>
                        <button class="btn-primary" style="background: ${game.color};" onclick="window.location.href='${game.link}'">العب الآن</button>
                    </div>
                `;
            });
        }
    </script>
</body></html>
