<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>مركز الألعاب | CodeQuest</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 25px; width: 95%; max-width: 800px; margin-top: 25px; padding: 0 10px; }
        .game-card { border-radius: 30px; padding: 30px 20px; text-align: center; text-decoration: none; color: #fff; display: flex; flex-direction: column; align-items: center; box-shadow: 8px 8px 16px rgba(0,0,0,0.4), inset -4px -4px 8px rgba(0,0,0,0.2), inset 4px 4px 8px rgba(255,255,255,0.2); transition: 0.3s; }
        .game-card:active { transform: scale(0.95); }
        .game-card:nth-child(1) { background: #f59e0b; } .game-card:nth-child(2) { background: #06b6d4; }
        .game-card:nth-child(3) { background: #ec4899; } .game-card:nth-child(4) { background: #10b981; }
        .game-card:nth-child(5) { background: #8b5cf6; } .game-card:nth-child(6) { background: #ef4444; }
        .game-icon { font-size: 3.5rem; margin-bottom: 15px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .game-title { font-size: 1.3rem; font-weight: 900; margin: 0 0 10px; }
        .game-desc { font-size: 0.9rem; margin-bottom: 20px; opacity: 0.9; font-weight: bold; }
        .btn-play { background: #fff; color: #000; border: none; padding: 12px 20px; border-radius: 15px; font-family: 'Cairo'; font-weight: 900; font-size: 1rem; cursor: pointer; width: 100%; }
    </style>
</head><body>
    <div class="header"><a href="languages.html" class="btn-back">← رجوع</a><h1>🎮 مركز الألعاب</h1></div>
    <div class="grid" id="gamesGrid"></div>
    <div class="bottom-nav">
        <a href="profile.html" class="nav-btn"><i class="ri-user-3-line"></i><span>ملفي</span></a>
        <a href="shop.html" class="nav-btn"><i class="ri-shopping-bag-3-line"></i><span>المتجر</span></a>
        <a href="games.html" class="nav-btn active"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="leaderboard.html" class="nav-btn"><i class="ri-trophy-line"></i><span>الشرف</span></a>
    </div>
    <script>
        const games = [
            { name: 'بازل الأكواد', icon: 'ri-puzzle-line', desc: 'رتب القطع لبناء الكود', link: 'game-match.html' },
            { name: 'لعبة الذاكرة', icon: 'ri-brain-line', desc: 'طابق الكود مع معناه', link: 'game-memory.html' },
            { name: 'بناء الكود', icon: 'ri-code-box-line', desc: 'اكتب الكود بنفسك', link: 'game-build.html' },
            { name: 'صائد الأخطاء', icon: 'ri-bug-line', desc: 'اكتشف الخطأ البرمجي', link: 'game-bug.html' },
            { name: 'تحدي السرعة', icon: 'ri-flashlight-line', desc: 'أجب بسرعة قبل الوقت', link: 'game-speed.html' },
            { name: 'سيد الأسئلة', icon: 'ri-question-line', desc: 'اختبر معلوماتك', link: 'game-quiz.html' }
        ];
        const grid = document.getElementById('gamesGrid');
        games.forEach(g => { grid.innerHTML += `<a href="${g.link}" class="game-card"><div class="game-icon"><i class="${g.icon}"></i></div><h3 class="game-title">${g.name}</h3><p class="game-desc">${g.desc}</p><button class="btn-play">العب الآن</button></a>`; });
        Auth.init((l) => { if(!l) window.location.href = 'index.html'; });
    </script>
    <script src="global.js"></script>
</body></html>
