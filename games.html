<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز الألعاب | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); font-size: 1.8rem; text-shadow: 0 0 10px rgba(0,229,255,0.4); }
        .btn-back { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1rem; border: 1px solid var(--primary); padding: 5px 15px; border-radius: 10px; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; max-width: 800px; }
        
        .game-card { border-radius: 25px; padding: 30px 20px; text-align: center; text-decoration: none; color: #fff; display: flex; flex-direction: column; align-items: center; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);}
        .game-card:hover { transform: translateY(-5px) scale(1.02); }
        
        .game-card:nth-child(1) { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .game-card:nth-child(2) { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
        .game-card:nth-child(3) { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .game-card:nth-child(4) { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .game-card:nth-child(5) { background: linear-gradient(135deg, #10b981, #047857); }
        .game-card:nth-child(6) { background: linear-gradient(135deg, #ec4899, #be185d); }

        .game-icon { font-size: 3.5rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .game-title { font-size: 1.3rem; font-weight: 900; margin: 0 0 10px; }
        .game-desc { font-size: 0.9rem; opacity: 0.9; margin-bottom: 20px; }
        
        .btn-play { background: rgba(255,255,255,0.9); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-family: 'Cairo'; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; }
        .game-card:hover .btn-play { background: #fff; transform: scale(1.05); }

        @media (min-width: 768px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>
    <div class="header">
        <a href="dashboard.html" class="btn-back">← رجوع</a>
        <h1>🎮 مركز الألعاب</h1>
    </div>

    <div class="games-grid">
        <a href="game-match.html" class="game-card">
            <i class="ri-puzzle-line game-icon"></i>
            <h3 class="game-title">بازل الأكواد</h3>
            <p class="game-desc">رتب القطع لبناء الكود</p>
            <button class="btn-play">العب الآن</button>
        </a>
        <a href="game-memory.html" class="game-card">
            <i class="ri-brain-line game-icon"></i>
            <h3 class="game-title">لعبة الذاكرة</h3>
            <p class="game-desc">طابق الكود مع معناه</p>
            <button class="btn-play">العب الآن</button>
        </a>
        <a href="game-bug.html" class="game-card">
            <i class="ri-bug-line game-icon"></i>
            <h3 class="game-title">صائد الأخطاء</h3>
            <p class="game-desc">اكتشف الخطأ البرمجي</p>
            <button class="btn-play">العب الآن</button>
        </a>
        <a href="game-speed.html" class="game-card">
            <i class="ri-flashlight-line game-icon"></i>
            <h3 class="game-title">تحدي السرعة</h3>
            <p class="game-desc">أجب بسرعة قبل الوقت</p>
            <button class="btn-play">العب الآن</button>
        </a>
        <a href="game-quiz.html" class="game-card">
            <i class="ri-question-line game-icon"></i>
            <h3 class="game-title">سيد الأسئلة</h3>
            <p class="game-desc">اختبر معلوماتك</p>
            <button class="btn-play">العب الآن</button>
        </a>
        <a href="game-build.html" class="game-card">
            <i class="ri-code-box-line game-icon"></i>
            <h3 class="game-title">بناء الكود</h3>
            <p class="game-desc">اكتب الكود بنفسك</p>
            <button class="btn-play">العب الآن</button>
        </a>
    </div>

    <script>
        Auth.init((logged) => { if (!logged) window.location.href = 'login.html'; });
    </script>
</body>
</html>
