<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملعب الأكواد | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <style>
        .playground-layout { display: flex; height: calc(100vh - 120px); gap: 20px; padding: 20px; }
        .editor-panel, .output-panel { flex: 1; display: flex; flex-direction: column; background: #1d1f21; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-light); }
        .panel-header { background: #2d2f31; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .panel-title { color: #a0aec0; font-family: var(--font-code); font-size: 0.9rem; }
        .CodeMirror { flex: 1; height: 100% !important; font-family: var(--font-code); font-size: 15px; direction: ltr; }
        .output-content { flex: 1; background: #fff; padding: 15px; font-family: var(--font-code); font-size: 14px; direction: ltr; color: #1e293b; overflow-y: auto; white-space: pre-wrap; }
        .controls { display: flex; gap: 10px; align-items: center; }
        .select-lang { background: #1d1f21; color: #a0aec0; border: 1px solid #4a5568; padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font-arabic); }
    </style>
</head>
<body>
    <div style="padding: 20px 20px 0 20px;">
        <header class="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="dashboard.html" class="btn btn-secondary" style="padding: 8px;"><i class="ri-arrow-right-line"></i></a>
                <h2 style="color: var(--primary-main);">ملعب الأكواد</h2>
            </div>
            <div class="controls">
                <select id="langSelect" class="select-lang">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                </select>
                <button id="runBtn" class="btn btn-primary"><i class="ri-play-fill"></i> تشغيل</button>
            </div>
        </header>
    </div>

    <div class="playground-layout">
        <div class="editor-panel">
            <div class="panel-header">
                <span class="panel-title" id="fileName">main.js</span>
            </div>
            <textarea id="codeEditor"></textarea>
        </div>
        <div class="output-panel">
            <div class="panel-header">
                <span class="panel-title">Console Output</span>
            </div>
            <div id="output" class="output-content">> Ready...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script>
        const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
            mode: 'javascript', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true
        });
        
        const fileNames = { javascript: 'main.js', python: 'main.py', cpp: 'main.cpp' };
        const modes = { javascript: 'javascript', python: 'python', cpp: 'text/x-c++src' };
        const defaultCode = {
            javascript: 'console.log("Hello CodeQuest!");',
            python: 'print("Hello CodeQuest!")',
            cpp: '#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello CodeQuest!" << endl;\n    return 0;\n}'
        };

        document.getElementById('langSelect').addEventListener('change', (e) => {
            const lang = e.target.value;
            document.getElementById('fileName').innerText = fileNames[lang];
            editor.setOption('mode', modes[lang]);
            editor.setValue(defaultCode[lang]);
            document.getElementById('output').innerHTML = '> Ready...';
        });

        document.getElementById('runBtn').addEventListener('click', async () => {
            const lang = document.getElementById('langSelect').value;
            const code = editor.getValue();
            const outputEl = document.getElementById('output');
            const btn = document.getElementById('runBtn');

            btn.disabled = true;
            outputEl.innerHTML = '> Running...';

            if (lang === 'javascript') {
                let logs = [];
                const origLog = console.log;
                console.log = (...args) => logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '));
                try {
                    new Function(code)();
                    console.log = origLog;
                    outputEl.innerHTML = logs.length > 0 ? logs.map(l => `> ${l}`).join('<br>') : '> Execution completed with no output.';
                } catch (err) {
                    console.log = origLog;
                    outputEl.innerHTML = `<span style="color:red;">> Error: ${err.message}</span>`;
                }
            } else {
                let langId = lang === 'python' ? 71 : 54;
                const encodeB64 = (str) => btoa(unescape(encodeURIComponent(str)));
                const decodeB64 = (str) => decodeURIComponent(escape(atob(str)));
                
                try {
                    const res = await fetch('https://ce.judge0.com/submissions?base64_encoded=true&wait=true', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ source_code: encodeB64(code), language_id: langId })
                    });
                    const data = await res.json();
                    let out = '';
                    if (data.stdout) out += decodeB64(data.stdout);
                    if (data.stderr) out += `<span style="color:red;">${decodeB64(data.stderr)}</span>`;
                    if (data.compile_output) out += `<span style="color:red;">${decodeB64(data.compile_output)}</span>`;
                    outputEl.innerHTML = out || '> Execution completed.';
                } catch (err) {
                    outputEl.innerHTML = `<span style="color:red;">> Network Error: ${err.message}</span>`;
                }
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
