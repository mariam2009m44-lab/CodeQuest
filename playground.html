
<script type="module">
  import { App } from './js/app.js';

  await App.init();

  const editor = CodeMirror.fromTextArea(
    document.getElementById('codeEditor'),
    {
      lineNumbers: true,
      theme: 'dracula',
      mode: 'javascript'
    }
  );

  editor.setValue("console.log('Hello Cody Academy!');");

  window.runCode = () => {
    const output = document.getElementById('terminalOutput');
    const code = editor.getValue();

    output.textContent = 'جارٍ التشغيل...';

    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.style.display = 'none';

    const source = `
      <script>
        const send = (type, text) => parent.postMessage({
          source: 'cody-playground',
          type,
          text: String(text)
        }, '*');

        console.log = (...args) => send('log', args.join(' '));
        console.error = (...args) => send('error', args.join(' '));

        try {
          new Function(${JSON.stringify(code)})();
          send('done', '');
        } catch (error) {
          send('error', error.message);
          send('done', '');
        }
      <\/script>
    `;

    const listener = (event) => {
      if (event.source !== frame.contentWindow) return;
      if (event.data?.source !== 'cody-playground') return;

      if (event.data.type === 'log') {
        output.textContent += '\n' + event.data.text;
      } else if (event.data.type === 'error') {
        output.textContent += '\nخطأ: ' + event.data.text;
      } else if (event.data.type === 'done') {
        window.removeEventListener('message', listener);
        frame.remove();

        if (output.textContent === 'جارٍ التشغيل...') {
          output.textContent = 'تم التنفيذ.';
        }
      }
    };

    window.addEventListener('message', listener);
    document.body.appendChild(frame);
    frame.srcdoc = source;
  };
</script>
