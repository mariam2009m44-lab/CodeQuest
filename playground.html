<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملعب | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <style>
        :root { --bg-dark: #0f172a; --bg-panel: #1e293b; --primary: #00ffcc; --text-main: #e2e8f0; --border: rgba(255,255,255,0.1); }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--bg-panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .header h1 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .lang-select { background: #0f172a; color: var(--primary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-family: 'Cairo'; cursor: pointer; }
        .run-btn { background: var(--primary); color: #000; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; display: flex; align-items: center; gap: 8px; }
        .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .editor-container { flex: 1; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .console-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .panel-title { padding: 10px; background: var(--bg-panel); font-size: 0.9rem; color: #94a3b8; border-bottom: 1px solid var(--border); text-align: center; direction: ltr; }
        .CodeMirror { height: 100% !important; font-family: 'JetBrains Mono', monospace; font-size: 15px; direction: ltr; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; }
        @media (max-width: 768px) { .workspace { flex-direction: column; } .editor-container { border-left: none; border-bottom: 1px solid var(--border); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-right">
            <a href="dashboard.html" style="color:var(--text-main); text-decoration:none;"><i class="ri-arrow-right-line"></i></a>
            <h1>ملعب الأكواد</h1>
            <select id="lang-select" class="lang-select">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="cpp">C++</option>
            </select>
        </div>
        <button class="run-btn" id="run-btn" onclick="runCode()">
            <i class="ri-play-fill"></i> تشغيل الكود
        </button>
    </div>

    <div class="workspace">
        <div class="editor-container">
            <div class="panel-title" id="filename">main.js</div>
            <textarea id="code-editor"></textarea>
        </div>
        <div class="console-container">
            <div class="panel-title">Console Output (النتيجة)</div>
            <iframe id="output-frame" sandbox="allow-scripts"></iframe>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <!-- مكتبة Pyodide لتشغيل بايثون -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <script>
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: "javascript", theme: "dracula", lineNumbers: true, autoCloseBrackets: true, indentUnit: 4, tabSize: 4
        });

        const codeJS = "// Welcome to CodeQuest!\nlet name = \"Cody\";\nconsole.log(\"Hello, \" + name + \"!\");";
        const codePy = "# Welcome to CodeQuest!\nname = \"Cody\"\nprint(\"Hello, \" + name + \"!\")";
        const codeCpp = "// Welcome to CodeQuest!\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << \"Hello, Cody!\" << endl;\n    return 0;\n}";

        document.getElementById('lang-select').addEventListener('change', function() {
            const lang = this.value;
            const filenameEl = document.getElementById('filename');
            const iframe = document.getElementById('output-frame');
            const btn = document.getElementById('run-btn');
            
            iframe.srcdoc = ""; 
            btn.disabled = false;
            btn.innerHTML = '<i class="ri-play-fill"></i> تشغيل الكود';

            if (lang === 'cpp') {
                editor.setOption("mode", "text/x-c++src");
                filenameEl.innerText = "main.cpp";
                editor.setValue(codeCpp);
            } else if (lang === 'python') {
                editor.setOption("mode", "python");
                filenameEl.innerText = "main.py";
                editor.setValue(codePy);
            } else {
                editor.setOption("mode", "javascript");
                filenameEl.innerText = "main.js";
                editor.setValue(codeJS);
            }
        });

        async function runCode() {
            const lang = document.getElementById('lang-select').value;
            const code = editor.getValue();
            const btn = document.getElementById('run-btn');
            const iframe = document.getElementById('output-frame');

            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> جاري التشغيل...';
            iframe.srcdoc = '<html><body style="font-family:monospace; padding:15px; text-align:center; color:#333;">جاري التنفيذ...</body></html>';

            try {
                if (lang === 'javascript') {
                    iframe.srcdoc = `<html><body style="font-family:monospace; padding:15px; direction:ltr;"><script>
                        const oLog = console.log;
                        console.log = function(...args) { document.body.innerHTML += '> ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ') + '<br>'; oLog(...args); };
                        window.onerror = function(msg) { document.body.innerHTML += '<span style="color:red;">Error: ' + msg + '</span><br>'; };
                    <\/script><script>try { ${code} } catch(e) { console.log('Error: ' + e.message); }<\/script></body></html>`;
                    btn.disabled = false; btn.innerHTML = '<i class="ri-play-fill"></i> تشغيل الكود';
                
                } else if (lang === 'python') {
                    if (!window.pyodide) {
                        iframe.srcdoc = '<html><body style="font-family:monospace; padding:15px; text-align:center; color:#333;">جاري تحميل بايثون (10 ثواني)...</body></html>';
                        window.pyodide = await loadPyodide({
                            stdout: (text) => { iframe.contentWindow.document.body.innerHTML += text + '<br>'; },
                            stderr: (text) => { iframe.contentWindow.document.body.innerHTML += `<span style="color:red;">${text}</span><br>`; }
                        });
                    }
                    iframe.contentWindow.document.body.innerHTML = '';
                    await window.pyodide.runPythonAsync(code);
                    btn.disabled = false; btn.innerHTML = '<i class="ri-play-fill"></i> تشغيل الكود';
                
                } else if (lang === 'cpp') {
                    iframe.srcdoc = '<html><body style="font-family:monospace; padding:15px; text-align:center; color:#333;">جاري تجميع الكود (C++)...</body></html>';
                    // استخدام Wandbox API (لا يحتاج مفتاح)
                    const response = await fetch('https://wandbox.org/api/compile.json', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code, compiler: 'gcc-head', options: 'warning,c++17' })
                    });
                    const data = await response.json();
                    let outputHTML = '<div style="font-family:monospace; padding:15px; text-align:left; direction:ltr; color:#333; white-space:pre-wrap;">';
                    if (data.program_output) outputHTML += data.program_output;
                    if (data.program_error) outputHTML += '<span style="color:red;">' + data.program_error + '</span>';
                    if (data.compiler_error) outputHTML += '<span style="color:red;">' + data.compiler_error + '</span>';
                    if (!data.program_output && !data.program_error && !data.compiler_error) outputHTML += '<span style="color:gray;">الكود اشتغل بنجاح، ولكن لم يطبع أي نتيجة.</span>';
                    outputHTML += '</div>';
                    iframe.srcdoc = `<html><body style="margin:0;">${outputHTML}</body></html>`;
                    btn.disabled = false; btn.innerHTML = '<i class="ri-play-fill"></i> تشغيل الكود';
                }
            } catch (error) {
                iframe.srcdoc = `<html><body style="margin:0; padding:15px; color:red; font-family:monospace; direction:rtl;">حدث خطأ: ${error.message}</body></html>`;
                btn.disabled = false; btn.innerHTML = '<i class="ri-play-fill"></i> تشغيل الكود';
            }
        }
    </script>
</body>
</html>
