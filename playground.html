
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cody Academy | Code Playground</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #0b1020;
      color: #e5e7eb;
      font-family: system-ui, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      margin: 20px auto;
      border: 1px solid #273449;
      border-radius: 16px;
      overflow: hidden;
      background: #111827;
    }

    .top {
      padding: 20px;
      background: #151e30;
      border-bottom: 1px solid #273449;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    .subtitle { color: #9ca3af; font-size: 14px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px;
    }

    select, button {
      border: 1px solid #374151;
      border-radius: 9px;
      padding: 10px 14px;
      font: inherit;
      color: #f9fafb;
      background: #1f2937;
    }

    select { flex: 1; min-width: 130px; }

    button { cursor: pointer; }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .run {
      background: #2563eb;
      border-color: #2563eb;
    }

    .editor-wrap {
      direction: ltr;
      padding: 0 14px 14px;
    }

    .CodeMirror {
      height: 360px;
      font-size: 15px;
      line-height: 1.6;
      border-radius: 10px;
      border: 1px solid #374151;
      direction: ltr;
      text-align: left;
    }

    .output-wrap { padding: 0 14px 16px; }

    .output-title {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    #output {
      min-height: 90px;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: left;
      background: #080d18;
      color: #d1fae5;
      border: 1px solid #273449;
      border-radius: 10px;
      padding: 14px;
      font: 14px/1.6 monospace;
    }

    #status {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 8px;
    }

    @media (max-width: 550px) {
      body { padding: 8px; }
      .app { margin: 8px auto; }
      .CodeMirror { height: 300px; }
      .toolbar button { flex: 1; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <h1>💻 Cody Academy Playground</h1>
      <div class="subtitle">
        اكتبي الكود، اختاري اللغة، وشغّلي برنامجك.
      </div>
    </header>

    <div class="toolbar">
      <select id="language" aria-label="اختاري لغة البرمجة">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
      </select>

      <button id="reset" type="button">إعادة المثال</button>
      <button id="run" class="run" type="button">▶ تشغيل الكود</button>
    </div>

    <section class="editor-wrap">
      <textarea id="code" aria-label="محرر الكود"></textarea>
    </section>

    <section class="output-wrap">
      <div class="output-title">نتيجة التنفيذ</div>
      <pre id="output">أهلًا بكِ في Cody Academy!</pre>
      <div id="status" role="status">جاهز للكتابة.</div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const language = $('language');
      const runButton = $('run');
      const resetButton = $('reset');
      const output = $('output');
      const status = $('status');

      const examples = {
        javascript: {
          mode: 'javascript',
          id: 63,
          code: 'console.log("Hello Cody Academy!");\nconsole.log(10 + 20);'
        },
        python: {
          mode: 'python',
          id: 71,
          code: 'print("Hello Cody Academy!")\nprint(10 + 20)'
        },
        cpp: {
          mode: 'text/x-c++src',
          id: 54,
          code: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello Cody Academy!" << endl;\n    cout << 10 + 20 << endl;\n    return 0;\n}'
        }
      };

      if (!window.CodeMirror) {
        output.textContent =
          'تعذر تحميل المحرر. تحققي من الإنترنت ثم أعيدي تحميل الصفحة.';
        status.textContent = 'فشل تحميل CodeMirror.';
        runButton.disabled = true;
        return;
      }

      const editor = CodeMirror.fromTextArea($('code'), {
        mode: 'javascript',
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        lineWrapping: true,
        autofocus: true,
        viewportMargin: Infinity
      });

      function setLanguage() {
        const config = examples[language.value];
        editor.setOption('mode', config.mode);
        editor.setValue(config.code);
        output.textContent = 'الكود جاهز للتشغيل.';
        status.textContent = 'جاهز للكتابة.';
        editor.refresh();
        editor.focus();
      }

      language.addEventListener('change', setLanguage);
      resetButton.addEventListener('click', setLanguage);

      runButton.addEventListener('click', async () => {
        if (runButton.disabled) return;

        const config = examples[language.value];
        const source = editor.getValue();

        if (!source.trim()) {
          output.textContent = 'اكتبي الكود أولًا.';
          status.textContent = 'لا يوجد كود للتنفيذ.';
          editor.focus();
          return;
        }

        runButton.disabled = true;
        resetButton.disabled = true;
        language.disabled = true;
        output.textContent = 'جارٍ إرسال الكود للتنفيذ...';
        status.textContent = 'جارٍ الاتصال بخدمة التنفيذ.';

        try {
          const response = await fetch(
            'https://ce.judge0.com/submissions?base64_encoded=false&wait=false',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                source_code: source,
                language_id: config.id
              })
            }
          );

          if (!response.ok) {
            throw new Error('خدمة التنفيذ أعادت HTTP ' + response.status);
          }

          const submission = await response.json();

          if (!submission.token) {
            throw new Error(
              submission.error || 'لم يتم استلام رمز التنفيذ.'
            );
          }

          let result = null;

          for (let i = 0; i < 30; i++) {
            await new Promise(resolve => setTimeout(resolve, 1000));

            const check = await fetch(
              'https://ce.judge0.com/submissions/' +
              encodeURIComponent(submission.token) +
              '?base64_encoded=false&fields=stdout,stderr,compile_output,message,status,time'
            );

            if (!check.ok) {
              throw new Error('تعذر جلب النتيجة: HTTP ' + check.status);
            }

            result = await check.json();
            const id = result.status && result.status.id;

            if (id !== 1 && id !== 2) break;

            output.textContent = 'جارٍ التنفيذ... (' + (i + 1) + '/30)';
          }

          if (!result || !result.status ||
              result.status.id === 1 || result.status.id === 2) {
            throw new Error('التنفيذ استغرق وقتًا طويلًا.');
          }

          const lines = [];
          if (result.stdout) lines.push(result.stdout.trimEnd());
          if (result.stderr) lines.push('خطأ أثناء التشغيل:\n' + result.stderr);
          if (result.compile_output) {
            lines.push('خطأ في الترجمة:\n' + result.compile_output);
          }
          if (result.message) lines.push('رسالة:\n' + result.message);

          if (!lines.length) {
            lines.push(
              result.status.id === 3
                ? 'تم التنفيذ، لكن لا توجد مخرجات.'
                : 'لا توجد مخرجات.'
            );
          }

          lines.push('\nحالة التنفيذ: ' + result.status.description);
          output.textContent = lines.join('\n\n');
          status.textContent =
            result.status.id === 3 ? 'اكتمل التنفيذ.' : 'انتهى التنفيذ مع ملاحظة.';
        } catch (error) {
          console.error(error);
          output.textContent =
            'تعذر تشغيل الكود.\n\n' +
            error.message +
            '\n\nقد تكون خدمة التنفيذ غير متاحة، أو قد يمنع المتصفح الاتصال بها (CORS).';
          status.textContent = 'تعذر الاتصال بخدمة التنفيذ.';
        } finally {
          runButton.disabled = false;
          resetButton.disabled = false;
          language.disabled = false;
        }
      });

      setLanguage();
    })();
  </script>
</body>
</html>
