
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111f">
  <title>محرر الأكواد | Cody Academy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      color-scheme: dark;
      --editor-bg: #10111f;
      --panel-bg: #191a2b;
      --border-color: rgba(255,255,255,.09);
      --muted-color: #9ca3af;
      --accent-color: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: var(--editor-bg);
      color: #f3f4f6;
    }

    button, select { font: inherit; }

    .playground-page {
      width: min(1450px, 100%);
      margin: auto;
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 4px;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    .page-header p {
      margin: 0;
      color: var(--muted-color);
    }

    .header-link {
      color: #c4b5fd;
      text-decoration: none;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--panel-bg);
      box-shadow: 0 18px 55px rgba(0,0,0,.2);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .language-select {
      min-width: 155px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      background: #222337;
      outline: none;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    .action-button:hover {
      transform: translateY(-1px);
    }

    .action-button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .run-button {
      color: white;
      background: #7c3aed;
    }

    .reset-button {
      color: #e5e7eb;
      background: #292a3c;
      border-color: var(--border-color);
    }

    .editor-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 20px;
      border-bottom: 1px solid var(--border-color);
      color: var(--muted-color);
      font-size: .85rem;
    }

    #fileName {
      direction: ltr;
      font-family: 'JetBrains Mono', monospace;
    }

    .CodeMirror {
      height: 440px;
      direction: ltr;
      text-align: left;
      font: 14px/1.8 'JetBrains Mono', monospace;
      padding: 12px 0;
    }

    .CodeMirror-gutters {
      border-left: 0;
    }

    .output-section {
      border-top: 1px solid var(--border-color);
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px;
      background: rgba(0,0,0,.12);
    }

    .output-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
    }

    #status {
      color: var(--muted-color);
      font-size: .85rem;
    }

    #output {
      min-height: 100px;
      max-height: 280px;
      overflow: auto;
      margin: 0;
      padding: 18px 20px;
      color: #d1d5db;
      background: #11121e;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 13px/1.8 'JetBrains Mono', monospace;
    }

    .footer-note {
      margin-top: 15px;
      color: var(--muted-color);
      font-size: .85rem;
      line-height: 1.8;
    }

    @media (max-width: 650px) {
      .playground-page { padding: 14px; }
      .toolbar { padding: 13px; }
      .toolbar-group { width: 100%; }
      .language-select { flex: 1; }
      .action-button { flex: 1; }
      .CodeMirror { height: 340px; font-size: 12px; }
      .editor-meta, .output-header { padding: 11px 13px; }
      #output { padding: 14px; }
    }
  </style>
</head>

<body class="dark-theme">
  <main class="playground-page">
    <header class="page-header">
      <div>
        <h1><i class="ri-code-s-slash-line"></i> محرر الأكواد</h1>
        <p>اكتبي الكود، شغّليه، وشوفي النتيجة مباشرة.</p>
      </div>
      <a class="header-link" href="dashboard.html">
        <i class="ri-arrow-right-line"></i>
        العودة للرئيسية
      </a>
    </header>

    <section class="workspace" aria-label="مساحة كتابة وتشغيل الكود">
      <div class="toolbar">
        <div class="toolbar-group">
          <label for="language">لغة البرمجة</label>
          <select id="language" class="language-select">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="cpp">C++</option>
          </select>
        </div>

        <div class="toolbar-group">
          <button id="reset" class="action-button reset-button" type="button">
            <i class="ri-refresh-line"></i>
            إعادة المثال
          </button>

          <button id="run" class="action-button run-button" type="button">
            <i class="ri-play-fill"></i>
            تشغيل الكود
          </button>
        </div>
      </div>

      <div class="editor-meta">
        <span id="fileName">main.js</span>
        <span>CodeMirror Editor</span>
      </div>

      <textarea id="code" aria-label="اكتبي الكود هنا"></textarea>

      <section class="output-section" aria-label="مخرجات التنفيذ">
        <div class="output-header">
          <div class="output-title">
            <i class="ri-terminal-box-line"></i>
            <strong>النتيجة</strong>
            <span class="status-dot"></span>
          </div>
          <span id="status" role="status" aria-live="polite">جاهز للتشغيل</span>
        </div>
        <pre id="output" aria-live="polite">Console Ready...</pre>
      </section>
    </section>

    <p class="footer-note">
      ملاحظة: يتطلب تشغيل Python وC++ اتصالًا بالإنترنت عند استخدام بيئات تشغيل خارجية.
      لا تضعي كلمات مرور أو بيانات خاصة داخل الكود.
    </p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <script src="js/playground.js"></script>
</body>
</html>
