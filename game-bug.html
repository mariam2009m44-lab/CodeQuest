<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صائد الأخطاء | CodeQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon-cyan: #00e5ff; --bg: #050914; --gold: #ffd700; --glass: rgba(10, 25, 47, 0.85); }
        * { box-sizing: border-box; }
        body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,229,255,0.2); z-index: 100; }
        .header h1 { margin: 0; font-size: 1.3rem; color: #ff4444; }
        .btn-back { background: rgba(255,68,68,0.1); border: 1px solid #ff4444; color: #ff4444; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .question { font-size: 1.2rem; text-align: center; margin-bottom: 10px; }
        
        .code-block { background: #1e1e1e; border: 1px solid #333; border-radius: 15px; padding: 20px; width: 100%; direction: ltr; text-align: left; font-family: 'Courier New', monospace; font-size: 1.1rem; line-height: 1.8; position: relative; }
        .code-line { cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
        .code-line:hover { background: rgba(255,255,255,0.1); }
        .code-line.selected { background: rgba(255, 68, 68, 0.3); border: 1px solid #ff4444; }
        .line-num { color: #555; display: inline-block; width: 25px; user-select: none;}
        
        .controls { display: flex; gap: 15px; width: 100%; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-check { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; box-shadow: 0 0 20px rgba(255,68,68,0.4); }
        
        .success-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 9, 20, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .success-modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--glass); border: 2px solid var(--gold); border-radius: 30px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; }
        .success-modal.active .modal-content { transform: scale(1); }
        .modal-content h2 { color: var(--gold); font-size: 2.5rem; margin: 0 0 10px; }
        .btn-claim { background: linear-gradient(135deg, #00e5ff, #007bff); color: #000; padding: 15px 40px; border-radius: 15px; border: none; font-family: 'Cairo'; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 15px;}
    </style>
</head>
<body>
    <div class="header"><a href="games.html" class="btn-back">← رجوع</a><h1>🐛 صائد الأخطاء</h1><div style="width: 70px;"></div></div>
    <div class="game-area">
        <div class="question">اختر السطر الذي يحتوي على الخطأ البرمجي:</div>
        <div class="code-block" id="codeBlock">
            <!-- الأسطر هتترسم هنا -->
        </div>
        <div class="controls">
            <button class="btn btn-check" onclick="checkBug()">✓ تأكيد السطر</button>
        </div>
    </div>
    <div class="success-modal" id="successModal"><div class="modal-content"><h2>🎉 مبروك!</h2><p>أنت صائد أخطاء محترف</p><button class="btn-claim" onclick="claimReward()">احصل على 30 نقطة</button></div></div>

    <script>
        // الكود فيه خطأ في السطر رقم 3 (استخدام = بدل ==)
        const codeLines = [
            "let x = 5;",
            "let y = 10;",
            "if (x = 5) {", // الخطأ هنا
            "  console.log('x is 5');",
            "}"
        ];
        let selectedLine = -1;

        document.addEventListener('DOMContentLoaded', () => {
            Auth.init((l) => {
                if (!l) { window.location.href = 'index.html'; return; }
                renderCode();
            });
        });

        function renderCode() {
            const block = document.getElementById('codeBlock');
            block.innerHTML = '';
            codeLines.forEach((line, index) => {
                const div = document.createElement('div');
                div.className = 'code-line';
                div.innerHTML = `<span class="line-num">${index + 1}</span>${line}`;
                div.onclick = () => selectLine(index, div);
                block.appendChild(div);
            });
        }

        function selectLine(index, el) {
            document.querySelectorAll('.code-line').forEach(l => l.classList.remove('selected'));
            el.classList.add('selected');
            selectedLine = index;
        }

        function checkBug() {
            if (selectedLine === -1) {
                alert("اختر سطراً أولاً!");
                return;
            }
            if (selectedLine === 2) { // السطر الثالث (index 2) هو الخطأ
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('successModal').classList.add('active');
            } else {
                alert("❌ هذا السطر سليم. حاول مرة أخرى!");
            }
        }

        async function claimReward() {
            const uid = Auth.getUserId();
            if (uid) { try { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(30) }); } catch(e) {} }
            window.location.href = 'games.html';
        }
    </script>
</body></html>
