<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صائد الأخطاء | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { font-family: 'Playpen Sans Arabic', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); padding: 20px; }
    .game-box { width: 100%; max-width: 600px; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .back-btn { color: var(--muted); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: var(--red); }
    .task-box { background: rgba(255,145,169,0.1); border: 1px solid var(--red); padding: 15px; border-radius: var(--radius-md); text-align: center; margin-bottom: 20px; }
    .task-box h2 { font-size: 1.1rem; color: var(--red); font-weight: 800; }
    .code-container { background: #0d1117; border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; direction: ltr; text-align: left; margin-bottom: 20px; }
    .code-line { padding: 10px 20px; font-family: monospace; font-size: 1.1rem; color: #c9d1d9; cursor: pointer; transition: 0.2s; display: flex; gap: 15px; }
    .code-line:hover { background: rgba(255,255,255,0.05); }
    .line-num { color: #484f58; user-select: none; width: 20px; text-align: right; }
    .code-line.correct-guess { background: rgba(118,233,192,0.15); border-left: 3px solid var(--green); }
    .code-line.wrong-guess { background: rgba(255,145,169,0.15); border-left: 3px solid var(--red); }
    .result-msg { text-align: center; font-weight: 800; font-size: 1.2rem; min-height: 30px; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="header">
      <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع</a>
      <span style="font-weight: 800; color: var(--red);"><i class="ri-bug-fill"></i> صائد الأخطاء</span>
    </div>
    <div class="task-box"><h2>اضغط على السطر الذي يحتوي على الخطأ البرمجي!</h2></div>
    <div class="code-container">
      <div class="code-line" onclick="checkLine(1, false)"><span class="line-num">1</span> def calculate_sum(a, b):</div>
      <div class="code-line" onclick="checkLine(2, false)"><span class="line-num">2</span>   result = a + b</div>
      <div class="code-line" onclick="checkLine(3, true)"><span class="line-num">3</span>   return reslt</div>
      <div class="code-line" onclick="checkLine(4, false)"><span class="line-num">4</span> </div>
      <div class="code-line" onclick="checkLine(5, false)"><span class="line-num">5</span> print(calculate_sum(5, 3))</div>
    </div>
    <div class="result-msg" id="resultMsg"></div>
  </div>

  <script>
    let gameEnded = false;
    function checkLine(lineNumber, isBug) {
      if (gameEnded) return;
      const lines = document.querySelectorAll('.code-line');
      const selectedLine = lines[lineNumber - 1];
      const msg = document.getElementById('resultMsg');
      if (isBug) {
        selectedLine.classList.add('correct-guess');
        msg.textContent = 'إجابة صحيحة! الخطأ هو "reslt" بدلاً من "result" 🎯';
        msg.style.color = 'var(--green)';
        gameEnded = true;
      } else {
        selectedLine.classList.add('wrong-guess');
        msg.textContent = 'خطأ! حاول البحث في سطر آخر.';
        msg.style.color = 'var(--red)';
        setTimeout(() => { selectedLine.classList.remove('wrong-guess'); }, 1000);
      }
    }
  </script>
</body>
</html>
