<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><title>صائد الأخطاء</title>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/world-bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px; width: 100%; max-width: 600px; box-sizing: border-box; }
        .code-block { background: #1e1e1e; border: 1px solid #444; border-radius: 15px; padding: 20px; width: 100%; direction: ltr; text-align: left; font-family: monospace; font-size: 1.1rem; line-height: 1.8; }
        .code-line { cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
        .code-line:hover { background: rgba(255,255,255,0.1); }
        .code-line.selected { background: rgba(239, 68, 68, 0.3); border: 1px solid #ef4444; }
        .line-num { color: #555; display: inline-block; width: 25px; }
        .btn-check { background: #ef4444; color: #fff; border: none; padding: 15px; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #b91c1c; }
    </style>
</head><body>
    <div class="header"><a href="games.html" class="btn-back">رجوع</a><h1>🐛 صائد الأخطاء</h1></div>
    <div class="game-area">
        <p style="color:#aaa;">اختر السطر الذي يحتوي على الخطأ البرمجي:</p>
        <div class="code-block" id="codeBlock"></div>
        <button class="btn-check" onclick="checkBug()">✓ تأكيد السطر</button>
    </div>
    <script>
        const codeLines = ["let x = 5;", "let y = 10;", "if (x = 5) {", "  console.log('x is 5');", "}"];
        let selected = -1;
        function render() {
            const block = document.getElementById('codeBlock'); block.innerHTML = '';
            codeLines.forEach((line, i) => {
                const d = document.createElement('div'); d.className = 'code-line';
                d.innerHTML = `<span class="line-num">${i+1}</span>${line}`;
                d.onclick = () => { document.querySelectorAll('.code-line').forEach(c => c.classList.remove('selected')); d.classList.add('selected'); selected = i; };
                block.appendChild(d);
            });
        }
        function checkBug() {
            if(selected === -1) return alert("اختر سطراً أولاً!");
            if(selected === 2) { confetti({ particleCount: 150 }); setTimeout(claimReward, 1000); }
            else alert("❌ هذا السطر سليم. حاول مرة أخرى!");
        }
        async function claimReward() {
            const uid = Auth.getUserId();
            if(uid) { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(30) }); }
            alert("🎉 مبروك! +30 نقطة"); window.location.href = 'games.html';
        }
        Auth.init((l) => { if(!l) window.location.href = 'index.html'; else render(); });
    </script>
</body></html>
