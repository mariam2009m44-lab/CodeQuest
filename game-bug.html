<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صائد الأخطاء | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --surface: #0a0f1e; --glass: rgba(13, 20, 40, 0.8); --border: rgba(255, 145, 169, 0.2); --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; --text: #ffffff; --muted: #8892b0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(255, 145, 169, 0.1), transparent 50%); }
    .screen { display: none; width: 100%; max-width: 650px; }
    .screen.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 40px 30px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
    .level-box h2 { font-size: 2rem; margin-bottom: 30px; color: var(--red); }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 20px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: transparent; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118, 233, 192, 0.1); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255, 212, 138, 0.1); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255, 145, 169, 0.1); transform: scale(1.02); }
    .game-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 25px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { color: var(--muted); text-decoration: none; font-weight: 800; cursor: pointer; background: none; border: none; font-family: 'Cairo'; font-size: 1rem; }
    .back-btn:hover { color: var(--red); }
    .score-board { font-weight: 900; font-size: 1.2rem; color: var(--gold); }
    .code-box { background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; direction: ltr; text-align: left; font-family: 'Fira Code', monospace; }
    .line { padding: 12px 18px; font-size: 1rem; color: #c9d1d9; cursor: pointer; display: flex; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .line:hover { background: rgba(255,255,255,0.05); }
    .num { color: #484f58; user-select: none; }
    .line.correct { background: rgba(118,233,192,0.15); border-left: 4px solid var(--green); }
    .line.wrong { background: rgba(255,145,169,0.15); border-left: 4px solid var(--red); }
    .msg { text-align: center; font-weight: 900; font-size: 1.2rem; height: 30px; }
    .btn-restart { display: none; width: 100%; padding: 14px; background: var(--cyan); color: #000; border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; margin-top: 15px; transition: 0.2s; }
  </style>
</head>
<body>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى التحدي</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>خطأ بسيط</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>خطأ منطقي</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>خطأ معقد</span></button>
      </div>
      <a href="games.html" class="back-btn" style="display:block; margin-top:20px;"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="game-box">
      <div class="header">
        <button class="back-btn" onclick="location.reload()"><i class="ri-arrow-right-line"></i> خروج</button>
        <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
      </div>
      <p style="font-weight: 800; text-align: center; color: var(--red); margin-bottom: 15px;">اضغط على السطر الذي يحتوي على الخطأ!</p>
      <div class="code-box" id="codeContainer"></div>
      <div class="msg" id="msg"></div>
      <button class="btn-restart" id="btnRestart" onclick="restartGame()">العب مرة أخرى</button>
    </div>
  </div>
  <script>
    const levels = {
      easy: { lines: ['def calculate_sum(a, b):', '    result = a + b', '    return reslt', '', 'print(calculate_sum(5, 3))'], bugIndex: 2, msg: 'إجابة صحيحة! الخطأ هو reslt 🎯' },
      medium: { lines: ['let x = 10;', 'let y = "5";', 'let sum = x + y;', 'console.log(sum);'], bugIndex: 1, msg: 'إجابة صحيحة! الخطأ هو خلط النوع (Number + String) 🎯' },
      hard: { lines: ['function findMax(arr) {', '  let max = 0;', '  for (let i = 0; i <= arr.length; i++) {', '    if (arr[i] > max) max = arr[i];', '  }', '  return max;', '}'], bugIndex: 2, msg: 'إجابة صحيحة! الخطأ هو i <= arr.length (يجب أن تكون <) 🎯' }
    };
    let ended = false, score = 0, currentLevel = 'easy';
    const scoreDisplay = document.getElementById('scoreDisplay'), codeContainer = document.getElementById('codeContainer'), msg = document.getElementById('msg'), btnRestart = document.getElementById('btnRestart');
    function updateGlobalScore(points) { let total = parseInt(localStorage.getItem('codyTotalScore')) || 0; total += points; localStorage.setItem('codyTotalScore', total); }
    function startGame(level) {
      currentLevel = level; ended = false; score = 0; scoreDisplay.textContent = score;
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      const currentLvl = levels[level];
      codeContainer.innerHTML = ''; msg.textContent = ''; btnRestart.style.display = 'none';
      currentLvl.lines.forEach((line, index) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line'; lineEl.innerHTML = `<span class="num">${index + 1}</span> ${line}`;
        lineEl.onclick = () => check(index, lineEl); codeContainer.appendChild(lineEl);
      });
    }
    function check(index, lineEl) {
      if (ended) return;
      if (index === levels[currentLevel].bugIndex) {
        lineEl.classList.add('correct'); msg.textContent = levels[currentLevel].msg; msg.style.color = 'var(--green)'; ended = true;
        score += 30; scoreDisplay.textContent = score; updateGlobalScore(30); btnRestart.style.display = 'block';
      } else {
        lineEl.classList.add('wrong'); msg.textContent = 'خطأ! حاول في سطر آخر.'; msg.style.color = 'var(--red)';
        setTimeout(() => lineEl.classList.remove('wrong'), 800);
      }
    }
    function restartGame() { startGame(currentLevel); }
  </script>
</body>
</html>
