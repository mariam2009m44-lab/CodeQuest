<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuest | اكتشف الخطأ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
<style>
body{background:#050914;color:#fff;min-height:100vh;padding:15px;font-family:Cairo;}
.header{text-align:center;margin-bottom:20px;color:#e74c3c;}
.code-box{background:#1e1e1e;border-radius:15px;padding:20px;max-width:500px;margin:auto;border:1px solid #333;}
.line{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:0.3s;margin-bottom:5px;}
.line:hover{background:rgba(255,255,255,0.1);}
.line-num{color:#666;font-family:monospace;width:20px;}
.line-code{font-family:monospace;color:#d4d4d4;font-size:14px;direction:ltr;}
</style>
</head>
<body>
<h1 class="header">🐛 اكتشف الخطأ</h1>
<div class="code-box" id="codeBox"></div>

<script>
const questions = [
    { lines: ['let name = "أحمد";', 'console.log(nam);', 'let age = 10;'], bug: 1, fix: 'الاسم غلط (nam بدل name)' },
    { lines: ['if (x > 5) {', '  console.log("كبير");', '}'], bug: -1, fix: 'الكود ده سليم!' }
];
let current = 0; let score = 0;

document.addEventListener('DOMContentLoaded', () => {
    Auth.init((logged) => {
        if(!logged) { window.location.href = 'index.html'; return; }
        loadQ();
    });
});

function loadQ() {
    if(current >= questions.length) { finishGame(); return; }
    const box = document.getElementById('codeBox');
    box.innerHTML = `<h3 style="color:#00e5ff; text-align:center; margin-bottom:15px;">دوس على السطر اللي فيه الخطأ:</h3>`;
    
    questions[current].lines.forEach((line, i) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = `<span class="line-num">${i+1}</span><span class="line-code">${line}</span>`;
        div.onclick = () => checkBug(i);
        box.appendChild(div);
    });
}

function checkBug(idx) {
    if(idx === questions[current].bug) {
        try { playSound('success'); } catch(e){}
        try { confetti({ particleCount: 50 }); } catch(e){}
        alert('🎉 صح! ' + questions[current].fix);
        score += 20; current++; loadQ();
    } else {
        try { playSound('error'); } catch(e){}
        alert('❌ مش هنا، جرب تاني!');
    }
}

async function finishGame() {
    try { confetti({ particleCount: 200, spread: 100 }); } catch(e){}
    alert('🎉 مبروك! كسبت ' + score + ' نقطة!');
    
    const uid = Auth.getUserId();
    if(uid) {
        const ref = firebase.firestore().collection('users').doc(uid).collection('highscores').doc('bug');
        const doc = await ref.get();
        if(!doc.exists || score > doc.data().score) {
            await ref.set({ score: score });
            await firebase.firestore().collection('users').doc(uid).update({ bonusPoints: firebase.firestore.FieldValue.increment(score) });
        }
    }
    setTimeout(() => window.location.href = 'games.html', 1000);
}
</script>
</body></html>
