<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صائد الأخطاء | CodeQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script><script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; padding-bottom: 80px; }
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: var(--danger); font-size: 1.3rem; }
        .game-area { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .code-block { background: #1e1e1e; border: 1px solid #444; border-radius: 15px; padding: 20px; width: 100%; direction: ltr; text-align: left; font-family: monospace; font-size: 1.1rem; line-height: 1.8; }
        .code-line { cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
        .code-line:hover { background: rgba(255,255,255,0.1); }
        .code-line.selected { background: rgba(239, 68, 68, 0.3); border: 1px solid var(--danger); }
        .line-num { color: #555; display: inline-block; width: 25px; }
    </style>

    <!-- Prism.js Dark Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />
</head>
<body>
    <div class="header"><a href="games.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">← رجوع</a><h1>🐛 صائد الأخطاء</h1><div style="width:50px;"></div></div>
    <div class="game-area">
        <p style="color:var(--text-muted); text-align:center;">اختر السطر الذي يحتوي على الخطأ البرمجي:</p>
        <div class="code-block" id="codeBlock"></div>
        <button class="btn btn-primary" style="background:var(--danger); color:#fff;" onclick="checkBug()">✓ تأكيد السطر</button>
    </div>
    <div class="bottom-nav"><a href="dashboard.html"><i class="ri-home-4-line"></i> الرئيسية</a><a href="games.html" class="active"><i class="ri-gamepad-line"></i> الألعاب</a><a href="profile.html"><i class="ri-user-3-line"></i> ملفي</a></div>
    <script>
        const codeLines = ["let x = 5;", "let y = 10;", "if (x = 5) {", "  console.log('x is 5');", "}"];
        let selected = -1;
        function render() {
            const block = document.getElementById('codeBlock'); block.innerHTML = '';
            codeLines.forEach((line, i) => {
                const d = document.createElement('div'); d.className = 'code-line';
                d.innerHTML = `<span class="line-num">${i+1}</span>${line}`;
                d.onclick = () => { document.querySelectorAll('.code-line').forEach(c => c.classList.remove('selected')); d.classList.add('selected'); selected = i; };
                block.appendChild(d);
            });
        }
        function checkBug() {
            if(selected === -1) return alert("اختر سطراً أولاً!");
            if(selected === 2) { confetti({ particleCount: 150 }); setTimeout(claimReward, 1000); }
            else alert("❌ هذا السطر سليم. حاول مرة أخرى!");
        }
        async function claimReward() {
            const uid = Auth.getUserId();
            if(uid) { await firebase.firestore().collection('users').doc(uid).update({ points: firebase.firestore.FieldValue.increment(30) }); }
            alert("🎉 مبروك! +30 نقطة"); window.location.href = 'games.html';
        }
        Auth.init((l) => { if(!l) window.location.href = 'login.html'; else render(); });
    </script>

    
    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="dashboard.html" class="mobile-nav-item"><i class="ri-home-5-line"></i><span>الرئيسية</span></a>
        <a href="lessons.html" class="mobile-nav-item"><i class="ri-book-open-line"></i><span>الدروس</span></a>
        <a href="games.html" class="mobile-nav-item"><i class="ri-gamepad-line"></i><span>الألعاب</span></a>
        <a href="playground.html" class="mobile-nav-item"><i class="ri-code-box-line"></i><span>الملعب</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="ri-user-smile-line"></i><span>حسابي</span></a>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.mobile-nav-item').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body></html>
