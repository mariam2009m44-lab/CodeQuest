<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صائد الأخطاء | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(13, 20, 40, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #8892b0; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(255,145,169,0.08), transparent 50%); }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 800; transition: 0.3s; }
    .back-btn:hover { background: rgba(255,255,255,0.1); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 8px 16px; border-radius: 10px; font-weight: 900; color: var(--gold); }
    .screen { display: none; width: 100%; max-width: 650px; }
    .screen.active { display: block; }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px; backdrop-filter: blur(20px); text-align: center; }
    .level-box h2 { margin-bottom: 20px; color: var(--red); }
    .levels-grid { display: flex; flex-direction: column; gap: 12px; }
    .lvl-btn { padding: 16px; border-radius: 14px; font-size: 1.1rem; font-weight: 900; border: 2px solid; background: transparent; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; }
    .lvl-easy { color: var(--green); border-color: var(--green); }
    .lvl-med { color: var(--gold); border-color: var(--gold); }
    .lvl-hard { color: var(--red); border-color: var(--red); }
    .code-box { background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; direction: ltr; text-align: left; font-family: 'Fira Code', monospace; }
    .line { padding: 10px 16px; font-size: 0.95rem; color: #c9d1d9; cursor: pointer; display: flex; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .line:hover { background: rgba(255,255,255,0.05); }
    .num { color: #484f58; user-select: none; }
    .line.correct { background: rgba(118,233,192,0.15); border-left: 4px solid var(--green); }
    .line.wrong { background: rgba(255,145,169,0.15); border-left: 4px solid var(--red); }
    .msg { text-align: center; font-weight: 900; font-size: 1.1rem; min-height: 25px; }
    .result-emoji { font-size: 4rem; margin-bottom: 10px; }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 15px; }
    @media (max-width: 600px) { .top-nav { flex-direction: column; gap: 10px; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى التحدي</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>خطأ بسيط</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>خطأ منطقي</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>خطأ معقد</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <p style="font-weight: 800; text-align: center; color: var(--red); margin-bottom: 15px;">اضغط على السطر الذي يحتوي على الخطأ!</p>
      <div class="code-box" id="codeContainer"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p class="result-message" id="resultMessage"></p>
      <button class="btn-restart" onclick="restartGame()" style="background: var(--cyan); color:#000; border:none; padding:12px 24px; border-radius:10px; font-weight:900; cursor:pointer; font-family:'Cairo'; margin-top:10px;">العب مستوى آخر</button>
      <button class="btn-restart" onclick="window.location.href='games.html'" style="background:transparent; border:1px solid var(--border); color:var(--text); margin-top:10px;">العودة للألعاب</button>
    </div>
  </div>
  <script>
    const levels = {
      easy: { lines: ['def calculate_sum(a, b):', '    result = a + b', '    return reslt', '', 'print(calculate_sum(5, 3))'], bugIndex: 2, msg: 'إجابة صحيحة! الخطأ هو reslt 🎯' },
      medium: { lines: ['let x = 10;', 'let y = "5";', 'let sum = x + y;', 'console.log(sum);'], bugIndex: 1, msg: 'إجابة صحيحة! الخطأ هو خلط النوع 🎯' },
      hard: { lines: ['function findMax(arr) {', '  let max = 0;', '  for (let i = 0; i <= arr.length; i++) {', '    if (arr[i] > max) max = arr[i];', '  }', '  return max;', '}'], bugIndex: 2, msg: 'إجابة صحيحة! الخطأ هو i <= arr.length 🎯' }
    };
    let ended = false, score = 0, currentLevel = 'easy';
    const scoreDisplay = document.getElementById('scoreDisplay'), codeContainer = document.getElementById('codeContainer'), msg = document.getElementById('msg');
    function updateGlobalScore(points) { let total = parseInt(localStorage.getItem('codyTotalScore')) || 0; total += points; localStorage.setItem('codyTotalScore', total); }
    function startGame(level) {
      currentLevel = level; ended = false; score = 0; scoreDisplay.textContent = score;
      document.getElementById('levelScreen').classList.remove('active'); document.getElementById('resultScreen').classList.remove('active'); document.getElementById('gameScreen').classList.add('active');
      const lvl = levels[level]; codeContainer.innerHTML = ''; msg.textContent = '';
      lvl.lines.forEach((line, index) => {
        const lineEl = document.createElement('div'); lineEl.className = 'line';
        lineEl.innerHTML = `<span class="num">${index + 1}</span> ${line}`;
        lineEl.onclick = () => check(index, lineEl); codeContainer.appendChild(lineEl);
      });
    }
    function check(index, lineEl) {
      if (ended) return;
      if (index === levels[currentLevel].bugIndex) {
        lineEl.classList.add('correct'); msg.textContent = levels[currentLevel].msg; msg.style.color = 'var(--green)'; ended = true;
        score += 30; scoreDisplay.textContent = score; updateGlobalScore(30);
        setTimeout(() => {
          document.getElementById('gameScreen').classList.remove('active');
          document.getElementById('resultScreen').classList.add('active');
          document.getElementById('resultEmoji').textContent = '🏆';
          document.getElementById('resultTitle').textContent = 'رائع! لقد وجدت الخطأ!';
          document.getElementById('resultMessage').textContent = `لقد جمعت ${score} نقطة.`;
        }, 1000);
      } else { lineEl.classList.add('wrong'); msg.textContent = 'خطأ! حاول في سطر آخر.'; msg.style.color = 'var(--red)'; setTimeout(() => lineEl.classList.remove('wrong'), 800); }
    }
    function restartGame() { document.getElementById('resultScreen').classList.remove('active'); document.getElementById('levelScreen').classList.add('active'); }
  </script>
</body>
</html>
