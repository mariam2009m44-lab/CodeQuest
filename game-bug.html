<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صائد الأخطاء | Cody</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css" rel="stylesheet">
  <style>
    :root { --bg: #050810; --glass: rgba(15, 23, 42, 0.8); --border: rgba(255,255,255,0.1); --text: #ffffff; --muted: #94a3b8; --cyan: #6be8ff; --green: #76e9c0; --red: #ff91a9; --gold: #ffd48a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; }
    .top-nav { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 800; transition: 0.3s; backdrop-filter: blur(10px); }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-3px); }
    .score-board { background: var(--glass); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; font-weight: 900; color: var(--gold); backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(255, 212, 138, 0.1); }
    .screen { display: none; width: 100%; max-width: 650px; position: relative; z-index: 10; }
    .screen.active { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .level-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 35px; backdrop-filter: blur(20px); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .level-box h2 { margin-bottom: 25px; color: var(--red); font-size: 1.8rem; font-weight: 900; }
    .levels-grid { display: flex; flex-direction: column; gap: 15px; }
    .lvl-btn { padding: 18px 24px; border-radius: 16px; font-size: 1.2rem; font-weight: 900; border: 2px solid; background: rgba(255,255,255,0.02); cursor: pointer; font-family: 'Cairo'; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
    .lvl-easy { color: var(--green); border-color: var(--green); } .lvl-easy:hover { background: rgba(118,233,192,0.15); transform: scale(1.02); }
    .lvl-med { color: var(--gold); border-color: var(--gold); } .lvl-med:hover { background: rgba(255,212,138,0.15); transform: scale(1.02); }
    .lvl-hard { color: var(--red); border-color: var(--red); } .lvl-hard:hover { background: rgba(255,145,169,0.15); transform: scale(1.02); }
    .code-box { background: #000; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 25px; direction: ltr; text-align: left; font-family: 'Fira Code', monospace; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .line { padding: 12px 20px; font-size: 1rem; color: #c9d1d9; cursor: pointer; display: flex; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
    .line:hover { background: rgba(255,255,255,0.08); }
    .num { color: #484f58; user-select: none; width: 20px; }
    .line.correct { background: rgba(118,233,192,0.15); border-left: 4px solid var(--green); }
    .line.wrong { background: rgba(255,145,169,0.15); border-left: 4px solid var(--red); animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .msg { text-align: center; font-weight: 900; font-size: 1.1rem; min-height: 30px; }
    .result-box { text-align: center; }
    .result-emoji { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    .result-box h2 { font-size: 1.8rem; margin-bottom: 10px; color: var(--cyan); }
    .result-message { font-size: 1.2rem; color: var(--muted); margin-bottom: 25px; }
    .btn-restart { background: var(--cyan); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-bottom: 10px; transition: 0.3s; }
    .btn-restart:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
    .btn-back { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; cursor: pointer; font-family: 'Cairo'; width: 100%; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.05); }
  
    /* Shared touch-first and reduced-motion refinements */
    button,
    a.back-btn,
    a.btn-back,
    a.btn-restart {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      min-height: 44px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--cyan, #36bfe5);
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .level-box {
        width: 100%;
        max-width: 100%;
        padding: clamp(14px, 4vw, 22px) !important;
        border-radius: 18px;
      }

      .lvl-btn {
        width: 100%;
        min-height: 64px;
        gap: 10px;
        justify-content: space-between;
        touch-action: manipulation;
      }

      .back-btn,
      .btn-back,
      .btn-restart {
        min-height: 48px;
      }

      .drop-zone {
        min-height: 132px;
        padding: 14px;
        touch-action: pan-y;
      }
    }

    @media (max-width: 500px) {
      .memory-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

/* CodeQuest 2026 game-wide polish */
:root{color-scheme:dark}body{background-color:#080e1c;background-image:radial-gradient(ellipse at 10% 0%,rgba(75,105,190,.18),transparent 36%),radial-gradient(ellipse at 90% 12%,rgba(27,181,190,.11),transparent 32%),linear-gradient(155deg,#080e1c,#0c1427 58%,#080e1b)!important;background-attachment:fixed}main,.level-box,.game-card,.game-container,.result-box,.panel{border-color:rgba(151,177,218,.19)}button{font-family:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #75e2ef!important;outline-offset:3px!important}button:disabled{cursor:not-allowed;filter:saturate(.65)}.level-box,.game-card,.result-box{box-shadow:0 18px 48px rgba(0,0,0,.22)}.lvl-btn,.btn,.opt-btn,.line,.piece{transition:background-color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.lvl-btn:active,.btn:active,.opt-btn:active,.line:active,.piece:active{transform:scale(.985)}.progress,.timer-bar{overflow:hidden;border-radius:999px}.progress>span,.timer-bar>span{transition:width .25s ease}.result-emoji{filter:drop-shadow(0 8px 18px rgba(111,190,255,.2))}@media(max-width:640px){body{background-attachment:scroll!important}.level-box,.game-card,.result-box{width:min(100%,100%)!important;max-width:100%!important}.actions{gap:10px}.btn-restart,.btn-back{min-height:48px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/codequest-games.css">
<link rel="stylesheet" href="css/codequest-icons.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="top-nav">
    <a href="games.html" class="back-btn"><i class="ri-arrow-right-line"></i> رجوع للألعاب</a>
    <div class="score-board">النقاط: <span id="scoreDisplay">0</span></div>
  </div>
  <section class="game-art-banner" aria-label="صائد الأخطاء"><img src="assets/games/game-bug.svg" alt="" decoding="async"></section>
  <div class="screen active" id="levelScreen">
    <div class="level-box">
      <h2>اختر مستوى التحدي</h2>
      <div class="levels-grid">
        <button class="lvl-btn lvl-easy" onclick="startGame('easy')"><span>مبتدئ</span> <span>خطأ بسيط</span></button>
        <button class="lvl-btn lvl-med" onclick="startGame('medium')"><span>متوسط</span> <span>خطأ منطقي</span></button>
        <button class="lvl-btn lvl-hard" onclick="startGame('hard')"><span>متقدم</span> <span>خطأ معقد</span></button>
      </div>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="level-box">
      <p style="font-weight: 800; text-align: center; color: var(--red); margin-bottom: 20px; font-size: 1.1rem;">اضغط على السطر الذي يحتوي على الخطأ!</p>
      <div class="code-box" id="codeContainer"></div>
      <p id="attemptStatus" class="attempt-status" aria-live="polite">المحاولات: 0</p>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="level-box result-box">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p class="result-message" id="resultMessage"></p>
      <button class="btn-restart" onclick="restartGame()">العب مستوى آخر</button>
      <button class="btn-back" onclick="window.location.href='games.html'">العودة للألعاب</button>
    </div>
  </div>
  <style>
    .attempt-status{margin:12px 0;text-align:center;color:var(--cyan);font-weight:800}
    .line{transition:background .18s,border-color .18s,transform .18s}
    .line.wrong{border-color:var(--red)!important;background:rgba(251,113,133,.13)!important;transform:translateX(-2px)}
    .line.correct{border-color:var(--green)!important;background:rgba(52,211,153,.16)!important}
    .line:disabled{opacity:1;cursor:default}
  </style>
  <script>
    const levels = {
      easy: { lines: ['def calculate_sum(a, b):', '    result = a + b', '    return reslt', '', 'print(calculate_sum(5, 3))'], bugIndex: 2, hint:'راجع اسم المتغير في سطر الإرجاع؛ هل يطابق الاسم الذي تم إنشاؤه؟', explanation:'تم إنشاء المتغير باسم result، لكن سطر الإرجاع يستخدم reslt. أسماء المتغيرات يجب أن تتطابق تمامًا.' },
      medium: { lines: ['let x = 10;', 'let y = "5";', 'let sum = x + y;', 'console.log(sum);'], bugIndex: 2, hint:'انتبه لاختلاف نوع البيانات: أحد المتغيرين رقم والآخر نص.', explanation:'في JavaScript، استخدام + مع رقم ونص قد يؤدي إلى دمج النصوص بدل الجمع الحسابي. حوّل النص إلى رقم عند الحاجة.' },
      hard: { lines: ['function findMax(arr) {', '  let max = 0;', '  for (let i = 0; i <= arr.length; i++) {', '    if (arr[i] > max) max = arr[i];', '  }', '  return max;', '}'], bugIndex: 2, hint:'تذكّر أن آخر فهرس في المصفوفة يساوي طولها ناقص واحد.', explanation:'الفهارس تبدأ من صفر؛ لذلك يجب أن يتوقف الشرط قبل arr.length. استخدام <= يجعل الحلقة تصل إلى فهرس غير موجود.' }
    };
    let ended = false, score = 0, currentLevel = 'easy', attempts = 0;
    const scoreDisplay = document.getElementById('scoreDisplay'), codeContainer = document.getElementById('codeContainer'), msg = document.getElementById('msg');

    function updateGlobalScore(points) {
      let total = parseInt(localStorage.getItem('codyTotalScore')) || 0;
      total += points; localStorage.setItem('codyTotalScore', total);
      window.CodeQuestExperience?.collectible({ label: "+" + points + " نقطة" });
    }

    function startGame(level) {
      currentLevel = level; ended = false; attempts = 0; score = 0; scoreDisplay.textContent = score; document.getElementById('attemptStatus').textContent = 'المحاولات: 0';
      document.getElementById('levelScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');
      const lvl = levels[level]; codeContainer.innerHTML = ''; msg.textContent = '';
      lvl.lines.forEach((line, index) => {
        const lineEl = document.createElement('button'); lineEl.type = 'button'; lineEl.className = 'line'; lineEl.setAttribute('aria-label','فحص السطر '+(index+1));
        lineEl.innerHTML = `<span class="num">${index + 1}</span> ${line}`;
        lineEl.onclick = () => check(index, lineEl); codeContainer.appendChild(lineEl);
      });
    }

    function check(index, lineEl) {
      if (ended || lineEl.disabled) return;
      if (index === levels[currentLevel].bugIndex) {
        ended = true;
        lineEl.classList.add('correct');
        codeContainer.querySelectorAll('.line').forEach(button => { button.disabled = true; });
        msg.textContent = 'صحيح! ' + levels[currentLevel].explanation;
        msg.style.color = 'var(--green)';
        const earned = Math.max(10, 30 - Math.max(0, attempts - 1) * 5);
        score += earned;
        scoreDisplay.textContent = score;
        updateGlobalScore(earned);
        document.getElementById('attemptStatus').textContent = 'تم اكتشاف الخطأ بعد ' + (attempts + 1) + ' محاولة';
        setTimeout(() => {
          document.getElementById('gameScreen').classList.remove('active');
          document.getElementById('resultScreen').classList.add('active');
          document.getElementById('resultEmoji').textContent = '🏆';
          document.getElementById('resultTitle').textContent = 'تم اكتشاف الخطأ!';
          document.getElementById('resultMessage').textContent = `حصلت على ${earned} نقطة. ` + levels[currentLevel].explanation;
          window.CodeQuestExperience?.reward({ gems: 0, title: 'تم اصطياد الخطأ!', message: 'اكتشفت المشكلة وحليتها بنجاح. برافو!' });
        }, 1000);
      } else {
        attempts++;
        document.getElementById('attemptStatus').textContent = 'المحاولات: ' + attempts;
        lineEl.classList.add('wrong');
        msg.textContent = attempts >= 2 ? 'تلميح: ' + levels[currentLevel].hint : 'ليس هذا السطر. افحص الكود وحاول مرة أخرى.';
        msg.style.color = 'var(--red)';
        setTimeout(() => lineEl.classList.remove('wrong'), 800);
      }
    }
    function restartGame() {
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('levelScreen').classList.add('active');
    }

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01HTMLCSSJSPYTHON{}[]()=+;".split("");
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
    function draw() {
      ctx.fillStyle = "rgba(5, 8, 16, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255, 145, 169, 0.5)";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
        drops[i]++;
      }
    }
    let animationFrame = 0;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let matrixTimer = null;
    function startMatrix(){ if(reducedMotion || matrixTimer) return; matrixTimer = setInterval(draw, 120); }
    function stopMatrix(){ if(matrixTimer){ clearInterval(matrixTimer); matrixTimer = null; } }
    startMatrix();
    document.addEventListener('visibilitychange',()=>document.hidden?stopMatrix():startMatrix());
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
<script type="module" src="js/route-guard.js"></script>
  <script src="js/game-audio.js"></script>
</body>
</html>
