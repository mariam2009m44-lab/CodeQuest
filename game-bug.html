<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الخطأ</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><style>body{background:#050914;color:#fff;padding:15px;font-family:Cairo;text-align:center;}.line{background:#1e293b;padding:15px;margin:10px;border-radius:10px;cursor:pointer;font-family:monospace;}</style></head><body><h2 style="color:#e74c3c;">🐛 اكتشف الخطأ</h2><div id="box"></div><script>const q=['let x = 5;','console.log(x);'];document.addEventListener('DOMContentLoaded',()=>{Auth.init((l)=>{if(!l)window.location.href='index.html';else init();});});function init(){document.getElementById('box').innerHTML=q.map((l,i)=>`<div class="line" onclick="check(${i})">${l}</div>`).join('');}async function check(i){if(i===0){alert('صح! ربحت 20 نقطة');const uid=Auth.getUserId();if(uid)await firebase.firestore().collection('users').doc(uid).update({bonusPoints:firebase.firestore.FieldValue.increment(20)});window.location.href='games.html';}else alert('غلط!');}</script></body></html>
